<tr><td><strong>BDD</strong></td><td>Behaviour-Driven Development</td><td>行为驱动开发，用 Given-When-Then 示例定义“什么算做对”</td></tr>
<tr><td><strong>EARS</strong></td><td>Easy Approach to Requirements Syntax</td><td>受约束的需求句式（当…时，系统应当…），让每条需求都能验证</td></tr>
<tr><td><strong>Gherkin</strong></td><td>—</td><td>Given-When-Then 的文本格式，可直接接进自动化测试</td></tr>
<tr><td><strong>DoD</strong></td><td>Definition of Done</td><td>完成定义：测试必须绿、文档必须更新、谁签字才算做完</td></tr>
<tr><td><strong>ADR</strong></td><td>Architecture Decision Record</td><td>架构决策记录，一页纸写背景/选项/决定/后果，防止 AI 反复推翻选型</td></tr>
<tr><td>arc42</td><td>另称：C4</td><td>架构文档模板与分层图（上下文→容器→组件→代码），高效告诉 AI 系统长什么样</td></tr>
<tr><td>OpenAPI</td><td>另称：AsyncAPI</td><td>REST 与消息接口的契约标准，可据此生成服务端、客户端与 mock</td></tr>
<tr><td><strong>JSON Schema</strong></td><td>—</td><td>数据结构校验标准，也是结构化输出（JSON 模式）的护栏</td></tr>
<tr><td><strong>Protobuf</strong></td><td>Protocol Buffers</td><td>跨语言接口与消息的强类型契约定义</td></tr>
<tr><td><strong>Spec Drift</strong></td><td>—</td><td>规格漂移：代码改了规格没改，下次生成又把改动覆盖回去</td></tr>
<tr><td><strong>Spec Kit</strong></td><td>GitHub Spec Kit</td><td>“宪法 + 阶段门”式 SDD 工具流，一组命令串起 specify→plan→tasks→implement</td></tr>
<tr><td><strong>Kiro</strong></td><td>AWS Kiro</td><td>Agent IDE，Spec 模式产出 requirements/design/tasks 三件套（Vibe 与 Spec 双模式）</td></tr>
<tr><td><strong>OpenSpec</strong></td><td>—</td><td>变更提案式规格管理：提案 + 规格增量 + 归档，适合存量系统改造</td></tr>
<tr><td><strong>BMAD</strong></td><td>BMAD-METHOD</td><td>多角色敏捷框架，分析师/PM/架构师/QA 各出一份文档，以 Story 为最小单元</td></tr>
<tr><td><strong>Tessl</strong></td><td>—</td><td>“规格即源码”路线：规格是唯一主资产，代码是可重生成的产物</td></tr>
<tr><td><strong>Memory Bank</strong></td><td>—</td><td>一组常驻上下文文档，开工先读库、收工前更新库，省掉每次重讲背景</td></tr>
</table></div>
<h3>多模态与生成模型</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>ViT</strong></td><td>Vision Transformer</td><td>把图像按固定边长切成 patch 当序列处理的 Transformer 视觉主干</td></tr>
<tr><td><strong>patch</strong></td><td>—</td><td>图像被切出的小方块，是视觉 token 的来源单位</td></tr>
<tr><td><strong>projector</strong></td><td>Visual Projector / Connector</td><td>把视觉编码器的向量映射到语言模型嵌入空间的对齐层</td></tr>
<tr><td><strong>CLIP</strong></td><td>Contrastive Language-Image Pre-training</td><td>在海量图文对上做双向对比学习，把图与文拉近到共享空间</td></tr>
<tr><td><strong>OCR</strong></td><td>Optical Character Recognition</td><td>从图像识别文字；VLM 里它不是架构自带能力，需高分辨率样本补</td></tr>
<tr><td><strong>grounding</strong></td><td>Visual Grounding</td><td>把图中目标定位成坐标框或点，精度受连续空间量化成数字的粒度限制</td></tr>
<tr><td><strong>CFG</strong></td><td>Classifier-Free Guidance</td><td>扩散每步同时算有条件与无条件预测并放大差值，控制提示词贴合度</td></tr>
<tr><td><strong>DiT</strong></td><td>Diffusion Transformer</td><td>把 latent 切成 patch、用 Transformer 替代 U-Net 作扩散主干的方案</td></tr>
<tr><td><strong>U-Net</strong></td><td>—</td><td>多尺度下采样加上采样带跳连的卷积主干，早期扩散模型的标准选择</td></tr>
<tr><td><strong>VAE</strong></td><td>Variational Autoencoder</td><td>把像素压成低维 latent 再解码回像素，扩散在其 latent 空间生成</td></tr>
<tr><td><strong>RVQ</strong></td><td>Residual Vector Quantization</td><td>逐层量化前一层残差的码本方法，神经音频编解码器用它把波形压成 token</td></tr>
<tr><td><strong>声码器</strong></td><td>Vocoder</td><td>把频谱或声学 token 还原成可播放波形的模块</td></tr>
<tr><td><strong>全模态</strong></td><td>Omni Model</td><td>文本、图像、音频、视频统一编码进同一序列联合训练的模型</td></tr>
<tr><td><strong>RTF</strong></td><td>Real-Time Factor</td><td>处理时长除以音频时长，小于 1 才追得上实时，语音链路核心指标</td></tr>
<tr><td><strong>VAD</strong></td><td>Voice Activity Detection</td><td>检测用户是否开口，是流式打断（barge-in）的触发器</td></tr>
</table></div>
<h3>提示工程进阶</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>Few-shot</strong></td><td>Few-shot Prompting</td><td>在提示里给若干输入输出示例，让模型照例子答题</td></tr>
<tr><td><strong>Zero-shot</strong></td><td>Zero-shot Prompting</td><td>只给指令不给示例；任务定义清楚时反而更不容易被示例锚定</td></tr>
<tr><td><strong>In-Context Learning</strong></td><td>上下文学习</td><td>模型靠提示中的示例临场掌握任务，不更新任何权重</td></tr>
<tr><td><strong>Recency Bias</strong></td><td>近因偏置</td><td>few-shot 中排在后面的示例对输出影响更大，可反过来利用</td></tr>
<tr><td><strong>Majority Label Bias</strong></td><td>多数标签偏置</td><td>示例里某一类占比过高，模型会把其它输入也判成那一类</td></tr>
<tr><td><strong>Function Calling</strong></td><td>函数调用</td><td>让模型按声明的函数签名与参数 schema 生成结构化调用，格式由解码约束保证</td></tr>
<tr><td><strong>Constrained Decoding</strong></td><td>约束解码</td><td>采样时屏蔽会产生非法语法的 token，保证格式合法，但不保证内容真实</td></tr>
<tr><td><strong>Structured Output</strong></td><td>结构化输出</td><td>输出按预定义字段与类型给出，便于程序解析、校验与逐字段重试</td></tr>
<tr><td><strong>Prompt Caching</strong></td><td>提示前缀缓存</td><td>重复且完全一致的静态前缀可复用已算好的 K/V，命中部分通常折扣计费</td></tr>
<tr><td><strong>lost in the middle</strong></td><td>中间丢失</td><td>长上下文中段信息召回最差的现象，源于注意力稀释与位置分布外推</td></tr>
<tr><td><strong>自一致性</strong></td><td>Self-Consistency</td><td>同题多次采样、对最终答案投票取多数，适合有唯一答案的题</td></tr>
<tr><td><strong>best-of-n</strong></td><td>Best-of-n</td><td>采样 n 个候选交给验证器挑最好的；收益取决于验证器质量</td></tr>
<tr><td><strong>思维树</strong></td><td>Tree of Thoughts</td><td>把推理拆成多步、每步展开分支并剪枝搜索，要配深度与宽度上限</td></tr>
<tr><td><strong>测试时扩展</strong></td><td>Test-time Scaling</td><td>把算力从训练挪到推理：多条候选或多个分支换准确率，成本随 n 线性涨</td></tr>
</table></div>
<h3>大模型是怎么思考的</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>Causal Mask</strong></td><td>Causal Masking（因果掩码）</td><td>把注意力打分矩阵的上三角置为负无穷，保证并行训练不偷看未来 Token</td></tr>
<tr><td><strong>MQA</strong></td><td>Multi-Query Attention</td><td>所有 Query 头共享一组 KV 头的注意力形态，KV Cache 最省但质量损失较大</td></tr>
<tr><td><strong>Position Interpolation</strong></td><td>位置插值</td><td>把超范围的位置线性压回训练见过区间，从而不加训练就拉长上下文窗口</td></tr>
<tr><td><strong>Capacity Factor</strong></td><td>专家容量因子</td><td>每个专家单步最多接收平均 Token 数的该倍数，超出部分被丢弃或缓冲</td></tr>
<tr><td><strong>All-to-All</strong></td><td>All-to-All 通信</td><td>MoE 层把 Token 发往各专家设备再送回原设备的双向全交换，是跨节点瓶颈</td></tr>
<tr><td><strong>Expert Parallelism</strong></td><td>专家并行</td><td>把不同专家放到不同设备上的并行方式，与 TP/PP/DP 正交组合</td></tr>
<tr><td><strong>Shared Expert</strong></td><td>共享专家/常开专家</td><td>不参与 Top-K 竞争、每个 Token 都经过的专家，承担通用能力并为误路由保底</td></tr>
</table></div>
<h3>怎么让它替我们干活</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>GraphRAG</strong></td><td>Graph-based RAG</td><td>先由 LLM 从语料抽实体关系建图，用图遍历与社区摘要回答多跳和全局问题</td></tr>
<tr><td><strong>HyDE</strong></td><td>Hypothetical Document Embeddings</td><td>让模型先写假设答案文档、再拿它去向量检索，把问题空间换算成文档空间</td></tr>
<tr><td><strong>Agentic RAG</strong></td><td>代理式检索增强</td><td>由模型自主决定检索次数、查询改写与检索器选择的 RAG 形态</td></tr>
<tr><td><strong>MRR</strong></td><td>Mean Reciprocal Rank</td><td>第一条相关结果排名的倒数在查询集上的均值，量“多久才捞到鱼”</td></tr>
<tr><td><strong>nDCG</strong></td><td>Normalized Discounted Cumulative Gain</td><td>带相关性分档且名次越靠后折减越多的排序质量指标</td></tr>
<tr><td><strong>多智能体</strong></td><td>Multi-Agent</td><td>把任务拆给多个 Agent：只在子任务接口窄、可独立验证时才划算</td></tr>
<tr><td><strong>编排拓扑</strong></td><td>Orchestration Topology</td><td>扇出（中心调度）、链（流水线）、环（对等协作），对应三种失败模式</td></tr>
<tr><td><strong>黑板</strong></td><td>Blackboard</td><td>多个 Agent 共享的存储，按需取片段，避免全量广播历史</td></tr>
<tr><td><strong>交接</strong></td><td>Handoff</td><td>任务、输入、验收判据、禁止事项、回报格式；写得含糊是最常见失败原因</td></tr>
<tr><td><strong>仲裁者</strong></td><td>Arbiter</td><td>专门判分歧的 Agent 或一条规则/测试，用于多 Agent 收不敛时强制收敛</td></tr>
</table></div>
<h3>评测与质量度量</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>LLM-as-Judge</strong></td><td>—</td><td>用模型给模型输出打分的自动化评测方式，需管理位置、长度、自偏好等偏差</td></tr>
<tr><td><strong>Direct Scoring</strong></td><td>—</td><td>单点打分：给一份答案一个分，能出绝对值但量纲会随批次漂移</td></tr>
<tr><td><strong>Pairwise Comparison</strong></td><td>—</td><td>成对比较：两份答案选一个更好的，比单点打分稳但只有相对序</td></tr>
<tr><td><strong>Position Bias</strong></td><td>—</td><td>裁判模型偏爱排在前位的答案的偏差，靠换序双评消除</td></tr>
<tr><td><strong>Kappa</strong></td><td>Cohen's Kappa</td><td>扣除偶然一致后的一致性度量，用于验收标注与裁判质量</td></tr>
<tr><td><strong>pass@k</strong></td><td>—</td><td>k 次采样中至少一次通过单元测试的概率，代码评测主指标</td></tr>
<tr><td><strong>maj@k</strong></td><td>—</td><td>k 次采样取多数票，与 pass@k 一样不能和单次采样并排比</td></tr>
<tr><td><strong>ROUGE</strong></td><td>Recall-Oriented Understudy for Gisting Evaluation</td><td>与参考文本的 n-gram 重叠度，偏召回，不适合开放式长文</td></tr>
<tr><td><strong>BLEU</strong></td><td>Bilingual Evaluation Understudy</td><td>n-gram 精度加长度惩罚的翻译指标，无参考的正确答案会被判零</td></tr>
<tr><td><strong>AUC</strong></td><td>Area Under the ROC Curve</td><td>整体排序质量、与阈值无关，但不代表分数校准良好</td></tr>
<tr><td><strong>Canary String</strong></td><td>—</td><td>埋在评测集里的固定指纹串，出现在模型输出中即证数据泄漏</td></tr>
<tr><td><strong>Data Contamination</strong></td><td>—</td><td>评测题进入训练语料或提示词导致分数虚高，即榜单污染</td></tr>
<tr><td><strong>held-out</strong></td><td>—</td><td>不公开、不参与训练与调参的保留题目，动态榜靠它维持区分度</td></tr>
<tr><td><strong>SWE-bench</strong></td><td>—</td><td>以真实仓库 issue 加通过测试为判据的代码榜，属结果可验证类基准</td></tr>
<tr><td><strong>Shadow Set</strong></td><td>—</td><td>从线上流量取的匿名新题集，永不公开永不进训练，只周期性复测</td></tr>
<tr><td><strong>McNemar</strong></td><td>McNemar test</td><td>配对二值结果的显著性检验，只看两版本一错一对的不一致对子</td></tr>
</table></div>
<h3>安全、合规与对抗</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>提示词注入</strong></td><td>Prompt Injection</td><td>把指令伪装成数据，让模型执行攻击者控制的指令</td></tr>
<tr><td><strong>越狱</strong></td><td>Jailbreak</td><td>用对抗后缀、改写、角色扮演等形态绕开对齐、诱导违规输出；在强对齐模型上仍有效</td></tr>
<tr><td><strong>红队</strong></td><td>Red Teaming</td><td>以攻击者视角系统性试探防线，并把结果沉淀为回归用例</td></tr>
<tr><td><strong>Guardrails</strong></td><td>护栏</td><td>建在模型之外、对输入输出与动作做判定和拦截的一层防线</td></tr>
<tr><td><strong>最小权限</strong></td><td>Principle of Least Privilege</td><td>只授予完成当前任务所需的工具与凭证，默认拒绝、逐个注册</td></tr>
<tr><td><strong>机器遗忘</strong></td><td>Machine Unlearning</td><td>目前只能抑制模型对特定样本的输出倾向，证明不了权重里已不含该信息</td></tr>
<tr><td><strong>DLP</strong></td><td>Data Loss Prevention</td><td>部署在数据出口、发送前做检测脱敏与拦截的网关</td></tr>
<tr><td><strong>后门攻击</strong></td><td>Backdoor Attack</td><td>训练或改权重时植入的触发式恶行，遇特定输入才发作，常规评测隐形</td></tr>
<tr><td><strong>供应链</strong></td><td>—</td><td>权重、数据集、上下文文件、模型与 API 版本等外来标的的入库核验对象</td></tr>
</table></div>
<h3>推理容量与成本工程</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>TTFT</strong></td><td>Time To First Token</td><td>首 token 延迟，由排队时间与 Prefill 时间相加决定，是算力与调度问题</td></tr>
<tr><td><strong>TPOT</strong></td><td>Time Per Output Token</td><td>逐 token 延迟，由每步搬运权重与 KV 的量除以显存带宽决定，是访存问题</td></tr>
<tr><td><strong>continuous batching</strong></td><td>—</td><td>请求级进出的批处理方式，某条序列结束就让位给新请求，死穴是显存碎片</td></tr>
<tr><td><strong>chunked prefill</strong></td><td>—</td><td>把长 prompt 的 Prefill 切成小块与 Decode 步混批，代价是这条请求自己的 TTFT 变长</td></tr>
<tr><td><strong>前缀缓存</strong></td><td>Prefix Cache</td><td>复用完全相同前缀的 KV，命中部分按折扣价计费；拼 prompt 时静态内容必须排前面</td></tr>
<tr><td><strong>PD 分离</strong></td><td>Prefill / Decode Disaggregation</td><td>把算力密集的 Prefill 与带宽密集的 Decode 放进不同资源池，代价是 KV 要整份跨机传输</td></tr>
<tr><td><strong>投机解码</strong></td><td>Speculative Decoding</td><td>小模型起草、大模型一次前向并行验证；收益取决于接受率，高并发下缩水</td></tr>
<tr><td><strong>Little 定律</strong></td><td>Little's Law</td><td>在飞请求数 = 到达速率 × 单请求驻留时间，是从 QPS 推并发与 KV 显存的桥</td></tr>
<tr><td><strong>SLO</strong></td><td>Service Level Objective</td><td>服务质量目标，必须落在 TTFT/TPOT 的分位数上，用均值报等于没报</td></tr>
<tr><td><strong>P99</strong></td><td>99th percentile</td><td>第 99 百分位延迟：99% 的请求快于它；延迟是重尾分布，均值会被快请求稀释</td></tr>
<tr><td><strong>卡·天</strong></td><td>GPU-days</td><td>算力预算单位：卡数乘天数；由 6ND 除以「单卡峰值 × MFU」折算</td></tr>
<tr><td><strong>FLOPs</strong></td><td>Floating Point Operations</td><td>训练算力约 6 × 参数量 × token 数（前向 2、反向 4），除以「单卡峰值 × MFU」即得卡·天</td></tr>
</table></div>
<h3>数据工程与语料治理</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>数据配比</strong></td><td>—</td><td>按领域、语言、长度、质量档切分并加权采样训练语料的做法</td></tr>
<tr><td><strong>合成数据</strong></td><td>—</td><td>由模型生成并用外部判据验对的数据，需设占比上限防自食其尾</td></tr>
<tr><td><strong>课程学习</strong></td><td>—</td><td>训练阶段按由易到难、由泛到精排列数据次序的安排</td></tr>
<tr><td><strong>退火</strong></td><td>—</td><td>训练后期降低学习率并换成精选高质量数据收尾的阶段</td></tr>
<tr><td><strong>许可证</strong></td><td>—</td><td>决定语料能否被下载、再分发与商用训练的权利凭证，开源不等于可商用训练</td></tr>
<tr><td><strong>MinHash</strong></td><td>—</td><td>估计文档 n-gram 集合 Jaccard 相似度的签名算法，用于近似去重</td></tr>
<tr><td><strong>LSH</strong></td><td>Locality-Sensitive Hashing</td><td>把相似样本大概率分进同一桶的分桶法，避免语料两两比较</td></tr>
<tr><td><strong>私有数据闭环</strong></td><td>—</td><td>产品使用产生的信号回流训练、模型变好带来更多使用的数据飞轮</td></tr>
<tr><td><strong>金标题</strong></td><td>—</td><td>答案已知的题目混入标注任务流，用来检查标注员是否认真标注</td></tr>
<tr><td><strong>编辑距离</strong></td><td>—</td><td>草稿与用户终稿之间的差异度量，同时给出改进方向与目标答案</td></tr>
</table></div>
<h3>AI 时代的研发组织</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>知识债</strong></td><td>—</td><td>代码能跑但没人能解释其取舍的状态，一人 + Agent 写完整个模块的典型后遗症</td></tr>
<tr><td><strong>Goodhart</strong></td><td>Goodhart's Law</td><td>指标一旦成为目标就不再是好指标，因为考核会筛出最省力的达标路径</td></tr>
<tr><td><strong>DORA</strong></td><td>DevOps Research and Assessment</td><td>部署频率、变更前置时间、变更失败率、服务恢复时间，四项互相制约的交付指标组</td></tr>
<tr><td><strong>缺陷逃逸率</strong></td><td>Defect Escape Rate</td><td>没被测试和门禁拦住、流到线上才暴露的缺陷占比，用来压住纯速度指标</td></tr>
<tr><td><strong>返工率</strong></td><td>—</td><td>已交付需求被打回重做的比例，写代码省下的时间常转嫁到这里</td></tr>
<tr><td><strong>首次验收通过率</strong></td><td>—</td><td>第一次提交就满足验收判据的需求占比；它往下掉时问题多在判据不在代码</td></tr>
<tr><td><strong>上下文工程</strong></td><td>Context Engineering</td><td>决定什么常驻、什么按需加载、什么不该喂给模型的手艺，是喂好模型的上限所在</td></tr>
</table></div>
<h3>形状记号与索引·旁路参数</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>d_model</strong></td><td>隐藏维度</td><td>token 在层间流动时的向量宽度，FFN 的扩展维度以它为基准</td></tr>
<tr><td><strong>d_ff</strong></td><td>FFN 中间维度</td><td>前馈网络临时放开的宽度，原版约 4×d_model，SwiGLU 代约 8/3×d_model</td></tr>
<tr><td><strong>one-hot</strong></td><td>—</td><td>词表索引的数学表示，「查表取嵌入」等价于 one-hot 乘嵌入矩阵</td></tr>
<tr><td><strong>argmax</strong></td><td>—</td><td>直接取概率最高的 Token，等价于 temperature=0 的贪心解码</td></tr>
<tr><td><strong>HNSW</strong></td><td>Hierarchical Navigable Small World</td><td>多层捷径图式 ANN 索引：快、召回高、内存与构建成本高</td></tr>
<tr><td><strong>IVF</strong></td><td>Inverted File Index</td><td>先聚类分桶再检索的 ANN 索引：省内存，召回靠 nprobe 调</td></tr>
<tr><td><strong>LoRA rank</strong></td><td>—</td><td>旁路矩阵的秩，决定可训练参数量与能装下多少改动</td></tr>
<tr><td><strong>LoRA alpha</strong></td><td>—</td><td>缩放系数，实际倍率为 alpha/rank，与 rank 要分开调</td></tr>
</table></div>
<h3>训练与推理黑话</h3>
<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>
<tr><td><strong>rollout</strong></td><td>—</td><td>策略模型在线生成一整批回答的过程与产物，RLHF 每轮都要付这笔算力账</td></tr>
<tr><td><strong>warmup</strong></td><td>—</td><td>学习率先升后落的预热阶段，用来避开开局大梯度导致的训练尖峰</td></tr>
<tr><td><strong>kernel</strong></td><td>—</td><td>GPU 上单个融合计算核；算子融合减少的是 kernel 启动与显存往返</td></tr>
<tr><td><strong>MFU</strong></td><td>Model FLOPs Utilization</td><td>实际浮点吞吐除以硬件标称峰值，低值多指向引擎而非硬件</td></tr>
<tr><td><strong>hidden size</strong></td><td>—</td><td>隐藏维度的另一种叫法，本文统一写作 d_model</td></tr>

<div class="tbl"><table>
<tr><th>术语</th><th>全称</th><th>一句话解释</th></tr>

  { q: "在自注意力机制中，Query (Q)、Key (K)、Value (V) 的作用是？", o: ["A. Q 和 K 的点积计算相关性权重", "B. V 是被加权提取的真实内容", "C. Q 代表当前词的查询意图", "D. K 代表被查询词的标签", "E. 把 Q 和 V 直接相加得到最终答案"], a: [0, 1, 2, 3], e: "E错误：注意力的输出是 V 的加权求和，不是 Q 与 V 相加。A、B、C、D 都成立：Q 表达查询意图、K 提供被匹配的标签、二者的点积给出权重、V 被加权取出。" },
  { q: "关于位置编码（Positional Encoding）和 RoPE，下列哪两项是正确的？", o: ["A. RoPE 就是把位置数字直接加到词向量上，属于绝对位置编码的一种", "B. RoPE 把位置当成旋转角度注入 Q 和 K，注意力分数主要取决于相对位置差", "C. 在把上下文窗口往外推（长度外推）这件事上，RoPE 比固定长度的位置表更灵活", "D. 查表式绝对位置编码在推理长度超过训练窗口时照样稳定", "E. 位置信息是加在 V 矩阵上的，与 Q、K 无关"], a: [1, 2], e: "D错误：超出训练窗口的位置没有训练信号，硬外推会退化，所以才要做位置插值或调基频；E错误：RoPE 作用在 Q 和 K 上，V 不做旋转；A错误：把位置数字加到词向量上是绝对位置编码，RoPE 是对 Q、K 已有的维度两两分片做旋转，不新开维度也不加参数。B、C 成立：B 是 RoPE 的机制，C 是它成为当前主流方案的原因之一。" },  { q: "现代大模型（如 LLaMA 系列）常采用的底层架构优化有？", o: ["A. 完全去除了注意力层以节省算力", "B. 使用 RMSNorm 代替 LayerNorm", "C. 使用 SwiGLU 激活函数", "D. 使用 RoPE（旋转位置编码）", "E. 使用 Sigmoid 激活函数"], a: [1, 2, 3], e: "A错误：现代大模型恰恰以注意力为核心，去掉注意力层不是优化。E错误：SwiGLU 与 GeLU 是主流激活，Sigmoid 会带来饱和与梯度问题。B、C、D 是 LLaMA 系列的标准配置。" },
  { q: "关于 Dense 和 MoE（混合专家）架构，正确的有？", o: ["A. 逐 Token 解码时，MoE 的专家跳跃导致权重复用率低", "B. Dense 每次推理所有参数参与计算", "C. MoE 打破了参数量与计算 FLOPs 的正比关系", "D. MoE 极大节省了显存占用", "E. MoE 架构必须引入负载均衡机制（Auxiliary Loss）防止专家闲置"], a: [0, 1, 2, 4], e: "D错误：MoE 省的是每个 Token 的算力，总参数照存显存，显存不省。A、B、C、E 都成立：Dense 每次全参参与、MoE 解耦参数量与 FLOPs、专家跳跃让权重复用率低、必须靠辅助损失防专家闲置。" },
  { q: "评估企业 AI 项目的 ROI，应该看什么？", o: ["A. ROI 的基线取演示环境跑出的数据最干净", "B. 选高频、可量化的人工流程做基线，对比处理时长、人力投入与错误率，把节省折算成钱", "C. 试点指标涨了就把它当成上线后的收益写进 ROI", "D. 模型每天被调用了多少次，次数越多 ROI 越高", "E. 模型生成的文本总字数，字数越多产出越大"], a: [1], e: "单选。D错误：正文原话是不要算调用次数，调用量是系统指标不是商业回报；E错误：文本字数与产出价值无关，长而没用照样不省钱；A错误：ROI 结论必须来自小流量灰度后的长期数据，演示环境不代表真实分布；C错误：只看试点指标不看上线后的真实分布，正是正文点名的算账误区。B 正确：这是正文给的正确姿势，落点是人效提升与交付周期缩短。" },  { q: "Harness（智能体执行框架）的核心模块包括？", o: ["A. 记忆管理与权限控制", "B. 可观测性 (Observability)", "C. 大模型的预训练权重参数", "D. 执行循环 (Loop)", "E. 工具集 (Tools)"], a: [0, 1, 3, 4], e: "C错误。Harness 是模型外层的框架。" },
  { q: "关于 2026年11月 Artificial Analysis 排名前三的模型，下列哪一项正确？", o: ["A. Claude Opus 5.5 稳居第一，代码与指令遵循不是它的强项", "B. 三家名次月月互换，所以应该跟着榜单频繁更换模型", "C. 前三里没有任何一家以多模态或长上下文见长", "D. 前三是 Gemini 4 Carbon、Claude Opus 5.5、GPT-6 Astra，三者差距已缩小到个位数百分点", "E. 三家跑分差距仍然很大，选型只看名次就够，不必看生态和价格"], a: [3], e: "单选。E错误：正文说三者差距已缩小到个位数百分点，选型更多看生态与价格而非跑分；A错误：正文只说 Claude 在代码任务与指令遵循上口碑最好，没给它总分第一；B错误：正文建议月度复测一次榜单即可，追热点频繁换模型反而拉高维护成本；C错误：Gemini 正是长上下文与多模态占优。D 正确：与正文的模型前三名单一致。" },  { q: "Transformer 相比 RNN（循环神经网络）的核心优势包括？", o: ["A. 不需要位置编码就能理解语序", "B. 参数量一定比 RNN 小", "C. 支持并行计算，训练速度快", "D. 通过自注意力机制，能更好地捕捉长距离依赖", "E. 彻底解决了梯度消失问题"], a: [2, 3], e: "E错在“彻底”：残差连接只是缓解梯度消失，深层网络仍需 LayerNorm、Warmup 等手段配合（与本库“残差连接缓解梯度消失”口径一致）；A、B错误。" },
  { q: "关于多模态大模型 (VLM)，下列哪一项是正确的？", o: ["A. 把输入分辨率提上去，数物体个数的错误就会随之消失", "B. 它完全无法理解图像里的空间关系", "C. 它把图像按固定边长裁成 patch，经视觉编码与 projector 对齐后拼进同一条 Token 序列", "D. 它能逐字读出截图里的密集小字，因为 OCR 是架构自带的", "E. 图像走独立的视觉通道，不占语言模型的上下文窗口"], a: [2], e: "单选。D错误：几像素高的笔画在下采样与投影后被抹平，正文说 OCR 靠高分辨率训练样本补，不是架构自带；E错误：视觉 Token 是真金白银的成本项，计入上下文、进 KV Cache、按输入价计费；A错误：计数缺的是逐个枚举再累加的机制，只能靠注意力隐式聚合，分辨率只是其中一个变量；B错误：它能理解一定程度的空间关系，只是密集小目标与精细方位最容易错，是弱不是无。C 正确：这是正文那条流水线的完整描述。" },  { q: "企业在构建专属 Agent 时，为什么必须引入可观测性 (Observability)？", o: ["A. 为了提升模型的预训练速度", "B. 统计每个工具调用的耗时和成本", "C. 满足合规审计要求", "D. 防止 Agent 掉入死循环", "E. 追踪 Agent 幻觉导致的错误决策链条"], a: [1, 2, 3, 4], e: "A错误：可观测性与预训练速度无关。B 到 E 成立：它要回答单次工具调用的耗时与成本、合规审计要的留痕、死循环与失控循环的发现，以及幻觉沿决策链放大时的定位。" },
  { q: "关于损失函数（Cross-Entropy Loss），它衡量的是什么？", o: ["A. 它衡量模型预测的概率分布与真实分布之间的差异", "B. 模型一次训练消耗的 GPU 显存", "C. 预测分布与真实分布的差异越小，损失越大", "D. 它是强化学习里的奖励塑形项，给中间推理步骤打分", "E. 它的取值与预测概率无关，只由标签是不是 one-hot 决定"], a: [0], e: "单选。B错误：显存是资源账，不是损失函数的输出；C错误：方向反了，差异越小损失越小，训练做的就是把这个差异压下去；D错误：给中间步骤打分的是 PRM（过程奖励模型），那是强化学习的奖励信号，不是交叉熵；E错误：交叉熵直接由模型对真实标签给出的概率算出来，预测越自信且正确，损失越小。A 正确：它是监督训练里最核心的目标函数，量的是两个分布的差异。" },  { q: "关于位置编码的实现与长度外推，错误的有哪些？", o: ["A. ALiBi 的思路是给距离越远的注意力加越大的负偏置", "B. RoPE 的注意力内积主要取决于两个 token 的相对位置差", "C. 学习式绝对位置编码在推理长度超过训练窗口时仍然稳定", "D. 位置插值这类外推手段通常还要配少量长文本继续训练", "E. 只要位置编码足够好，长上下文中段的信息就不会被忽略"], a: [2, 4], e: "C错误：超出训练窗口的位置没有训练信号，硬外推会退化，这正是要做插值或调基频的原因；E错误：中段被忽略来自注意力稀释与训练分布，位置编码修不了它，有效上下文小于标称窗口是常态。B、D、A 是三种方案的实际做法。本题选错误的。" },
  { q: "关于量化微调 (QLoRA)，正确的有？", o: ["A. 计算时临时反量化回 16-bit", "B. 外挂 LoRA 旁路进行训练", "C. 让单张消费级显卡（如 24GB）微调大模型成为可能", "D. 它会完全破坏原有模型的通用知识", "E. 先把基座模型量化（压缩）到 4-bit 存显存"], a: [0, 1, 2, 4], e: "D错误：QLoRA 冻结基座、只训练旁路，通用知识保留，被压坏的是数值精度而不是知识本身。A、B、C、E 成立：4-bit 存权重、计算时临时反量化、外挂 LoRA 训练、单卡 24GB 可跑。" },
  { q: "在推理模型的训练中，PRM（过程奖励模型）的主要作用是？", o: ["A. 帮助模型学会更严密的逻辑推演", "B. 对推理的每一个中间步骤打分", "C. 防止模型“过程全错，答案蒙对”", "D. 只用最终答案的得分作为奖励", "E. 它是一种可验证奖励（RLVR）的替代方案"], a: [0, 1, 2], e: "D错误（那是结果奖励模型）；E错误（PRM与RLVR互补）。" }
];

  { q: "下列有助于缓解大模型幻觉的做法有？", o: ["A. 允许模型回答不知道而不是强行编造", "B. 用 RAG 提供可溯源的参考资料", "C. 降低 temperature 并要求模型标注不确定性", "D. 要求回答引用检索到的原文", "E. 对高风险输出增加事实校验环节"], a: [0, 1, 2, 3, 4], e: "以上均为业界常用缓解手段，组合使用效果更好；但幻觉只能缓解，无法根除。" },

QUIZ_BANK.push(
  { q: "下列属于大模型评测基准的有？", o: ["A. 把训练集上的 loss 曲线当作公开评测基准", "B. GSM8K", "C. HumanEval", "D. ImageNet 原始分类任务", "E. MMLU"], a: [1, 2, 4], e: "D是图像分类经典数据集（2012 年），不是大模型语言评测基准；A错误：训练损失是内部指标，既不公开也不反映下游能力，不能当基准用。" },
  { q: "关于 Function Calling（工具调用），正确的有？", o: ["A. 函数定义会影响模型选择哪个工具", "B. 模型可以直接修改数据库", "C. 模型输出结构化的参数而非直接执行", "D. 实际执行由外部程序完成", "E. 工具定义写进系统提示后，模型会自己发起 HTTP 请求并回填结果"], a: [0, 2, 3], e: "B错误：模型只产出调用意图与参数，执行与权限控制在外部程序；E错误：模型只产出结构化参数，真正的执行由宿主程序完成。" },
  { q: "LLM 的 token 与字符的关系，正确的有？", o: ["A. token 是模型处理文本的最小单位", "B. 英文常用词通常一个 token", "C. 中文字符数与 token 数完全相等", "D. 一个汉字通常不是固定一个 token", "E. 空格与换行不占 token，排版可以随便加"], a: [0, 1, 3], e: "C错误：中文经 BPE 切分，token 数通常与字符数不等；E错误：空格与换行同样被编码并计费，长空白会把 token 预算吃掉。" },  { q: "下列属于大模型常见安全风险的有？", o: ["A. 显卡驱动版本与 CUDA 不匹配", "B. 训练数据投毒", "C. 梯度消失", "D. 提示词注入", "E. 越狱（Jailbreak）"], a: [1, 3, 4], e: "C是训练优化难题，不是安全风险；A错误：那是部署环境问题，不属于模型安全风险。" },

// 全库即抽题池：以后往 QUIZ_BANK 里加题就能被抽到，无需再动这里的截断逻辑
const EXAM_COUNT = 50; // 每次考试从整库随机抽 50 题，满分 100 分
let EXAM_QS = pickExamQuestions(); // 进入页面前先抽好本卷 50 题，避免首开显示 0 题
function pickExamQuestions() {
  const pool = QUIZ_BANK.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  return pool.slice(0, Math.min(EXAM_COUNT, pool.length));
}
function pointsPerQuestion() { return Math.round(100 / EXAM_QS.length); } // 题量变化时分值自动对齐满分
function gradeMessage(score) {
  let pool;

  return pool[Math.floor(Math.random() * pool.length)];
}

  { q: "关于在不推翻旧词表的前提下追加新 token（扩表），正确的有？", o: ["A. 输入输出权重绑定时，扩表会同时改动两边", "B. 扩表后旧 checkpoint 完全无法加载，必须从头预训练", "C. 常把新 token 的嵌入初始化为若干旧 token 嵌入的均值或组合，降低冷启动代价", "D. 保留旧 token id 不变，旧行的嵌入可以直接搬过去", "E. 新追加的 token 嵌入要额外训练一段才能收敛"], a: [0, 2, 3, 4], e: "B错误：扩表之所以可行，恰恰因为它只增行不改旧行，旧权重按 id 对齐继续用；只有整体换词表才会推倒重来。D 是它相对换词表的最大优势，E、A、C 是要付的工程细节。" },
  { q: "语料里混入 HTML 实体、零宽字符等控制符，可能带来哪些后果？", o: ["A. 分词器会自动丢弃所有非可见字符，不影响模型", "B. 它们会被编进字节，可能把同一个词切出不同结果", "C. 在入口把控制符统一转义成可见字符串，它们的影响就消失了", "D. 训练时学到的控制符分布与推理时不一致，导致输出乱码或格式漂移", "E. 不可见字符可被用来构造绕过关键词过滤的对抗输入"], a: [1, 3, 4], e: "A错误：分词器按配置处理字节，不会替你做清洗，未经配置的非可见字符照样进 id 序列。B 是分词层面的后果，D 是分布层面的，E 是安全层面的，清洗阶段要三头都管；C错误：转义只是换了字节写法，序列里仍然多出符号，切分与分布照旧被改变，还可能把原文结构破坏掉；控制符要在清洗阶段就删掉。" },
  { q: "关于分词器实现细节（预分词与合并顺序），正确的有？", o: ["A. 合并顺序由人工按语言学规则逐条手写", "B. Byte-level BPE 通常先按正则做预分词，再在片段内部做字节合并", "C. 预分词规则把标点、数字分组，避免跨标点学出无意义的合并", "D. 合并按学到的优先级从高到低反复应用，直到没有可合并的对", "E. 同一份文本在两个不同版本的分词器下可能得到完全不同的 id 序列"], a: [1, 2, 3, 4], e: "A错误：合并顺序就是训练分词器时按频率统计排出来的优先级表，不是人手写的规则表。B、C 解释了为什么 GPT-2 这类分词器不会把单词尾部和下一个词首标点合并，D 是推理时的执行方式，E 是 B 到 D 全部配置随版本变化的必然结果。" },
  { q: "词表大小（V）、初始符号数（S）、BPE 合并次数（M）的关系与扩表效果，正确的有？", o: ["A. 词表越大，模型的困惑度一定越低", "B. 词表大小只影响训练，不影响推理速度", "C. Byte-level 设定下初始符号数是 256，V 约等于 S 加上生效的合并次数", "D. 词表越大，平均每个 token 承载的语言片段越长，切出的序列越短", "E. 词表过大时长尾 token 的训练样本太少，嵌入学不充分"], a: [2, 3, 4], e: "A错误：困惑度是跨词表不可比的量，而且词表涨到一定程度后切分收益趋平，反而稀释每个 token 的训练样本。C 是 GPT-2 那个 5 万量级合并数对应约 5 万量级词表的算法；D、E 是同一枚硬币的两面；B错误：词表大小直接决定嵌入矩阵与输出层 softmax 的开销。" },
  { q: "大规模语料去重，精确哈希与 MinHash 类近似去重的分工，正确的有？", o: ["A. 近似去重能抓到改动少量文字重新发布的洗稿内容", "B. 近似去重的结果与精确去重完全一致", "C. 精确去重拿整篇文档指纹，只抓字节完全一致的重复", "D. MinHash 用多组哈希取最小值构成签名，用来估计集合的 Jaccard 相似度", "E. MinHash 配合 LSH 分桶，避开文档两两比较的平方级代价"], a: [0, 2, 3, 4], e: "B错误：近似去重带阈值和估计误差，牺牲一点召回与精度换规模，不可能与逐字节比对等价。C、D、E 是三者的定义与配合方式，A 是近似去重相对精确去重的唯一增量价值。" },
  { q: "预训练语料去重的常见粒度包括？", o: ["A. 做过文档级去重后，段落级重复就不必处理了", "B. URL 级：同一页面被反复抓取产生的重复", "C. 文档级：整篇完全一致或高度相似", "D. 段落与 n-gram 级：跨文档的大段重叠", "E. 采样与洗牌阶段复查：同一文本散在多个分片里会被重复采样放大"], a: [1, 2, 3, 4], e: "A错误：不同粒度抓的是不同形态的重复，洗稿站把同一段模板复制进成千上万篇不同标题的文档，文档级指纹完全抓不到。B 到 D 是自上而下的三层，E 是数据管线层面容易漏掉的一层。" },
  { q: "预训练语料不做去重的典型后果，正确的有？", o: ["A. 同一内容同时进训练集和评测集，分数虚高", "B. 多样性下降，等于花算力反复学同一段话", "C. 重复率压到 1% 以下时，重复对记忆化的影响小到可以不处理", "D. 去重还能挤掉虚假的 token 计数，让数据预算更接近真实信息量", "E. 重复样本更容易被逐字背诵，提高泄露训练原文的风险"], a: [0, 1, 3, 4], e: "C错误：没有这种普适安全阈值，危害取决于重复内容的长度、集中度与是否污染评测，1% 的巨型重复同样致命。E、A、B 是三类公认后果，D 常被忽略：脏 token 也计入预算就会误判数据量是否充足。" },
  { q: "网页语料的质量过滤，从启发式规则到模型化打分，正确的有？", o: ["A. 阈值拉得越高语料越干净，模型能力也一定越强", "B. 过滤过狠会让分布塌陷，长尾语言能力反而下降", "C. 启发式规则看符号占比、行均长度、模板噪声密度等信号", "D. 模型化过滤先用人工标注的高质量样本训练小分类器，再批量给全量语料打分", "E. 打分模型会把自己的风格偏好继承给语料，形成审美偏置"], a: [1, 2, 3, 4], e: "A错误：“干净”和“够用”是两回事，只留教科书式文本会让模型没见过脏世界的多样表达，鲁棒性和泛化一起掉。C、D 是两代过滤方法，E、B 是模型化过滤必须付的代价。" },
  { q: "把模型自己生成的数据混进下一轮训练，风险正确的有？", o: ["A. 控制比例、保留真实数据锚点、做溯源与去重是常规缓解手段", "B. 分布尾部信息逐代丢失，反复自食其后出现 model collapse", "C. 生成数据里的错误会被当成真值反复强化", "D. 合成数据适合补指令格式、推理链这类写法，不适合补长尾事实知识", "E. 给合成数据打上来源标签、可追溯之后，按 1:1 与真实数据混训是稳妥做法"], a: [0, 1, 2, 3], e: "E错误：标签只解决可追溯，不解决分布塌陷；占比要看任务与代际，不是标了就能放开用。B、C 是机制性风险，D 是业界对合成数据适用面的一致判断，A 是配套纪律。" },
  { q: "关于多来源语料的配比（data mixing），正确的有？", o: ["A. 按 token 配比和按文档条数配比结果不同，语言间长度差异必须折算", "B. 配比一旦定下，训练全程都不能再调整", "C. 高资源语言占比过高会挤占低资源语言的学习预算", "D. 常用小规模代理模型跑若干配比，再把结论外推到全量训练", "E. 各来源权重会明显影响代码、数学、多语言等定向能力"], a: [0, 2, 3, 4], e: "B错误：主流做法恰恰是在训练后段做配比调整（提高高质量来源比重），配比是可调度变量而非定死常量。D、E、A 是配比工程的三步，C 是零和的一面。" },
  { q: "预训练中的课程式数据安排（curriculum / annealing），正确的有？", o: ["A. 先通用语料后专项语料（代码、数学），可以在同等算力下换取更强的定向能力", "B. 单纯按质量从低到高排序，末期样本主导梯度，早期样本会被部分冲掉", "C. 课程学习只影响收敛速度，不影响最终能力", "D. 数据顺序会改变模型看到的上下文共现分布，不是中性安排", "E. 训练末期把学习率降下来的同时提高高质量数据占比，是公开实践中的常见做法"], a: [0, 1, 3, 4], e: "C错误：顺序本身就是训练信号的一部分，同样的数据换个顺序会训出不同模型，这与下一 token 预测的目标直接相关。E、A 是 annealing 与课程化的收益面，B 是它的坑，D 是原因。" },
  { q: "从 Common Crawl 一类原始抓取到可用训练语料，清洗环节通常包括？", o: ["A. 把原始 HTML 直接喂给模型，让模型自己学会忽略标签", "B. 解析 HTML，剥离导航、页脚、评论区等模板噪声", "C. 语言识别（LID）过滤非目标语种", "D. 对毒性内容与隐私串（邮箱、IP、密钥）做规则与模型检测", "E. 清洗只影响成本，对模型最终质量没有影响"], a: [1, 2, 3], e: "A错误：标签噪声会占掉大量 token 预算并教会模型输出 markup，清洗是数据侧的责任，不能推给模型。B、C、D 分别对应结构噪声、语种噪声、合规噪声三类；E错误：清洗直接改善验证损失与下游表现，是最划算的一层。" },
  { q: "高质量文本不够、只能重复使用语料时，正确的有？", o: ["A. 数据不够时应该优先加大参数量，而不是继续堆训练轮次", "B. 可以用改写或合成数据扩充，但要评估新引入的偏置", "C. 重复训练的收益逐次衰减，第二遍的价值明显高于第五遍", "D. 靠拉高重复次数换来的能力，通常远低于同等算力投在新数据上", "E. 重复次数越多，逐字背诵与隐私泄露风险越高"], a: [1, 2, 3, 4], e: "A错误：缩放定律的修正结论正是算力固定时参数与数据要同步扩展，光加参数会变成大模型欠训练。C、D 是数据受限区间的核心结论，E 是副作用，B 是常见补充手段及其代价。" },
  { q: "关于缩放定律从早期结论到后续修正，正确的有？", o: ["A. 后续修正指出参数与数据应大致同步扩展，训练 token 数约为参数量的 20 倍量级", "B. 损失对参数量、数据量、计算量各自近似满足幂律", "C. 幂律意味着翻倍投入一定换来等比例的能力提升", "D. 修正结论还把推理成本算进权衡，而不只看训练损失", "E. 早期结论认为算力固定时应把预算主要给参数量，模型越大越好"], a: [0, 1, 3, 4], e: "C错误：幂律说的是损失随投入次线性下降（收益递减），而能力还和评测指标的形状有关，损失小一段不等于能力强一档。A 与正文 c1_1 的 1:20 口径一致；D 是那次修正的动机之一。" },
  { q: "估算预训练算力时，正确的有？", o: ["A. 参数量和数据量各翻倍，所需算力大约涨到四倍量级", "B. 有效算力利用率（MFU）可以接近理论峰值的 100%", "C. 朴素实现的注意力开销随序列长度平方增长，长上下文预算要单算", "D. 实际工期还受集群规模、通信和故障重启影响，不只是 FLOPs 换算", "E. 常用近似是每个 token 每个参数约 6 次浮点运算（前向加反向）"], a: [0, 2, 3, 4], e: "B错误：MFU 明显低于芯片标称峰值，通信、气泡、检查点与重启都要吃掉一大块，这是大规模训练的常态而非意外。E、A 是 6ND 那套估算式的直接推论，C 是长上下文训练贵的根因，D 是它与现实之间的缺口。" },
  { q: "关于“计算最优（compute-optimal）”训练，下列说法正确的是？", o: ["A. 计算最优点与参数数据比例无关，只取决于算力总量", "B. 算力一定时，参数越多损失一定越低", "C. 计算最优点同时也是推理成本最低点", "D. 数据量足够大时，参数量就不是主要变量", "E. 给定算力下，参数量与数据量存在一个使损失近似最小的配比"], a: [4], e: "单选。E正确：计算最优说的就是给定算力下参数与数据存在一个使损失近似最小的配比。B错误：那是早期缩放结论的过度推广，算力一定时参数过大反而欠训练；C错误：把训练账和推理账混为一谈，计算最优只优化训练损失，长期服务的推理成本要靠故意偏小的模型去换；D错误：数据再多也填不出容量，优化步数同样受算力约束；A错误：它讲的正是给定算力下参数与数据的配比。" },
  { q: "同等算力下训一个远小于计算最优、但喂了多得多的数据的模型，正确的有？", o: ["A. 参数量压得过小会形成容量瓶颈，数据再加收益趋零", "B. 这种过度训练的小模型必然在所有评测上赢过大模型", "C. 在同一损失水平上比较，它的训练算力和推理算力都低于更大的模型", "D. 推理时参数更少、显存占用更小，长期服务成本被摊薄", "E. 训练一次、服务多年时，推理开销往往比训练开销更值得省"], a: [0, 2, 3, 4], e: "B错误：它只在同损失或同推理预算的口径下占优，需要海量参数承载的知识与容量时，小模型有天花板。C 是这条论证链的起点，D、E 是为什么要往小模型方向偏，A 是它的边界。" },
  { q: "按“训练 token 数约为参数量 20 倍”的口径，下列换算与理解正确的有？", o: ["A. 70B 参数的模型，按比例需要约 1.4 万亿 token 量级", "B. 这个比例描述的是同等算力下损失最优的配比，不是硬约束", "C. 该比例只约束参数与数据，与所用浮点算力无关", "D. 实践中常见模型明显超过这个比例，用更多数据换更小更好部署的模型", "E. 7B 参数的模型，对应约 1400 亿 token 量级的训练数据"], a: [0, 1, 3, 4], e: "C错误：算力约等于 6ND，参数与数据一旦定下，算力预算就跟着定了，三者本来就绑在一起。E、A 是 20 倍关系的两次直接换算（与正文 1:20 口径一致）；B、D 是“定律”与工程实践的距离。" },
  { q: "缩放定律在真实工程里的局限，正确的有？", o: ["A. 拟合出缩放曲线之后，按曲线外推到十倍规模可以直接采用，不必再做实测校准", "B. 换了架构、上下文长度或词表后，原来的曲线不能直接套用", "C. 幂律拟合的是验证损失，下游任务的真实能力与损失并不线性对应", "D. 把 token 数当唯一变量会忽略质量与去重，脏数据也被算进预算", "E. 拟合所用的规模区间之外外推过远，误差会被放大"], a: [1, 2, 3, 4], e: "A错误：缩放曲线的价值是给出候选配比，最后一公里仍要用真实训练去校准。C、D 是“目标量”和“输入量”两个口径的失真，E、B 是外推失效的两种原因。" },
  { q: "关于能力随规模出现的非线性提升（常称涌现能力），正确的有？", o: ["A. 换成连续的评测指标后，一些能力的增长曲线会平滑很多", "B. 换个提示措辞或示例顺序就消失的能力，算不上稳定能力", "C. 涌现能力说明缩放定律被证伪", "D. 工程上不能只靠“再大一点”赌某个能力自动出现，还要有针对性的数据", "E. 一部分“涌现”来自评测指标本身是离散的（如精确匹配），连续的小改进表现为突变"], a: [0, 1, 3, 4], e: "C错误：涌现是同一幂律在特定指标形状下的读数方式，不构成对缩放定律的反例。E、A、B 是对表观突变的三层祛魅（指标、提示、评测口径），D 是工程结论。" },
  { q: "拿未经对话微调的基座模型直接当聊天机器人用，会出现？", o: ["A. 因为它掌握的语言知识比对话模型少，所以答不好", "B. 同一道题换个提示措辞分数剧烈波动，因为它没学过稳定的应答模式", "C. 它更倾向续写问题而不是回答问题，因为训练目标是下一个 token", "D. 缺少拒绝行为，容易被诱导输出不当内容", "E. 指令前缀怎么写会显著影响输出格式，比如它可能接着把回答也编出来"], a: [1, 2, 3, 4], e: "A错误：知识主体在预训练阶段注入，对话微调改的是调用方式而非知识存量，基座的知识往往并不更少（对齐税甚至说明它本来更强）。C、D、B 都是“没学过问答这一格式”的不同表现，E 是基座最典型的失控方式。" },
  { q: "预训练验证损失持续下降，能推出什么、不能推出什么？", o: ["A. 不同评测指标对同一批 checkpoint 可能给出相反的排序", "B. 损失下降伴随评测高分时，也要排查基准污染", "C. 损失是充分统计量，看它就够了", "D. 能推出模型在验证语料上的下一 token 预测概率变高", "E. 不能直接推出数学、代码或工具调用能力提升"], a: [0, 1, 3, 4], e: "C错误：损失只覆盖“在验证分布上的可预测性”这一维，任务能力、格式遵从、安全性都得单独测。D 是唯一能被损失直接支撑的结论，E、A、B 是损失之外的三件必查事项。" },
  { q: "关于困惑度（Perplexity），正确的有？", o: ["A. 按 token 平均和按字符平均做长度归一，结论可能不同", "B. 它约等于交叉熵损失取指数，可理解为每个位置上的有效候选数", "C. 词表不同的两个模型，困惑度不能直接比较，因为每个 token 承载的信息量不同", "D. 困惑度越低，文本就一定越符合人类偏好", "E. 验证语料必须与训练语料去重，否则困惑度虚低"], a: [0, 1, 2, 4], e: "D错误：困惑度衡量的是可预测性，高度模板化、重复、无信息的文本反而极好预测，低困惑不等于高质量。注意方向：去重不干净会让模型“见过答案”，困惑度是虚低（数字好看）而不是虚高。B、C、A 是使用困惑度的三条边界条件。" },
  { q: "预训练验证集（held-out set）的设计要点，正确的有？", o: ["A. 验证集应直接放公开榜单原题，方便读数", "B. 损失在小数点后几位的波动可能只是抽样噪声，不能当结论", "C. 必须与训练集去重，否则验证损失被数据泄漏污染", "D. 分布要贴近目标语料，否则数字和能力脱钩", "E. 保留按来源划分的多个验证子集，能分辨某次配比调整伤到了谁"], a: [1, 2, 3, 4], e: "A错误：把榜单题放进验证集会形成污染，测的是背没背过而不是能力；榜单题应该只用于评测并定期轮换。C、D、E 是验证集三条工程纪律，B 是读数时的显著性常识。" },
  { q: "大规模预训练出现 loss spike（损失尖峰）时，合理的处理有？", o: ["A. 回滚到尖峰之前的 checkpoint 继续训练", "B. 梯度裁剪与学习率 warmup 能降低早期尖峰的概率", "C. 出现尖峰说明代码写错了，硬调超参压下去就行", "D. BF16 下仍可能出现 NaN/Inf，需要数值检测与自动停训", "E. 记录并定位尖峰对应的数据段，重启时跳过或给该段降权"], a: [0, 1, 3, 4], e: "C错误：绝大多数尖峰与数据分片或注意力集中度突变有关，先归因再处置，单纯压超参会把问题埋到后面。E、A 是业界标准的定位加回滚流程，B 是预防手段，D 是兜底监控。" },
  { q: "下列会直接威胁大模型训练稳定性的因素，正确的有？", o: ["A. 某个数据分片质量骤变（如突然混入大量重复文本）引发梯度范数突刺", "B. 归一化位置（Pre-Norm/Post-Norm）与深度共同影响早期可训练性", "C. z-loss 一类的正则项可约束 logits 幅度，缓解数值不稳定", "D. 训练精度换成 BF16，动态范围够宽，通常不必再为发散准备回滚点", "E. 学习率过大导致梯度范数抬升并迅速发散"], a: [0, 1, 2, 4], e: "D错误：BF16 只是把动态范围拉宽，超参失当或数据有毒照样发散。E、A 是两个最常见的发散入口，B 与已有结论“Pre-Norm 更稳”一致，C 是 PaLM 一系公开实践里的做法。" },
  { q: "基座模型不经参数更新就能靠上下文示例完成任务（in-context learning），正确的有？", o: ["A. 示例的顺序、措辞与格式对结果影响明显，评测必须固定模板", "B. 参数量越大，通常越能利用更多示例", "C. 这说明模型在训练时已经背过这些示例", "D. 少样本评测要连同示例数量一起报告，否则分数不可比", "E. 示例通过注意力影响后续预测，不改动任何权重"], a: [0, 1, 3, 4], e: "C错误：in-context learning 的价值正在于换没见过的新例子也能照做，如果分数来自背诵就说明评测被污染了。E 是机制，A、D 是它带来的评测口径要求，B 是常见趋势（用“通常”限定，小规模模型反而会被多示例干扰）。" },
  { q: "关于前沿模型训练的算力与能耗量级，合理的判断有？", o: ["A. 一次训练的总电耗必然大于模型全生命周期服务的总电耗", "B. 报告能效时要用统一口径（同一集群、同一 MFU）才有可比性", "C. 单次预训练常用 FLOPs 与 GPU·小时两个口径衡量", "D. 集群功耗要算上散热与网络配套，不能只看芯片理论值", "E. 折算到每 token 的能耗会随推理优化（量化、批处理）持续变化"], a: [1, 2, 3, 4], e: "A错误：训练是一次性投入，服务是多年持续投入，高频调用下推理侧总量往往更大，“必然”把量级关系说反了。C、D 是口径与配套开销，E、B 是能效结论为什么经常互相打脸。" },
  { q: "多语言预训练中调高某种语言的 token 占比，通常会带来？", o: ["A. 语言之间会互相迁移，一种语言的数据也能间接改善另一种语言的推理类任务", "B. 各语言平均分配就是最优配置，不需要实验", "C. 用 token 数而不是文档条数计量，才能避免长文本语言被高估", "D. 该语言相关任务分数上升，但可能挤占其他语言的训练预算", "E. 占比收益存在上限，超过某点后新增 token 的边际收益递减"], a: [0, 2, 3, 4], e: "B错误：均分只是一种先验，不同语言的信息密度、词表覆盖和数据质量差异极大，配比必须实测。D 是零和面，E 是边际收益形状，A 是跨语言迁移带来的意外红利，C 是计量口径。" },
  { q: "用同一套评测脚本比较两个分词器不同的模型，跨语言分数为什么不可信？", o: ["A. 序列更长会推高显存与延迟，间接改变能跑的 batch 与采样配置", "B. 把题目统一翻译成一种语言后，两套词表造成的切分差异也一并消除", "C. 报告时给出每题实际输入 token 数并按长度归一，能减轻这类偏差", "D. 同样字数的中文题占掉更多 token，先触发截断的一方实际看到的题目更少", "E. 固定 token 预算下每种语言能塞进的 few-shot 示例数量不同，而示例数本身就影响分数"], a: [0, 2, 3, 4], e: "B错误：同一语言在两个词表下的切分粒度照样不同，翻译只统一了语言，没统一 token 成本。D、E、A 是三种串扰路径（截断、示例数、运行配置），C 是可落地的补救口径。" },
  { q: "为改善中文能力同时做两件事：扩中文词表、上采样中文语料。正确的有？", o: ["A. 扩表后新 token 的嵌入是冷启动，需要足够训练量才能补上", "B. 这两项改动之后，新旧模型的困惑度仍可直接比较", "C. 词表变大稀释了每个 token 的样本数，长尾 token 可能学不充分", "D. 扩词表降低同一段中文的 token 数，等于间接放大了有效上下文", "E. 上采样提高中文在梯度中的比重，比单纯扩词表更直接影响能力"], a: [0, 2, 3, 4], e: "B错误：困惑度的分母变了——每个 token 承载的信息量不同，跨词表比较等于换单位还比数值。D、E 分别是“省 token”和“多喂梯度”两条独立路径，A、C 是扩表的隐性成本。" },
  { q: "预训练里加入较多代码与数学语料，观察到的现象包括？", o: ["A. 配比收益要用多个下游指标联合判断，不能只盯一个评测", "B. 业界公开做法是明确划出一部分预训练算力给代码语料，而不是顺手混进去", "C. 数学语料的量级远小于通用网页，通常需要上采样才能发挥作用", "D. 占比过高会挤压自然语言的多样性，通用对话与常识任务可能退化", "E. 代码数据只提升编程能力，对其他任务毫无迁移"], a: [0, 1, 2, 3], e: "E错误：结构化语料带来的形式化收益会外溢到推理类任务，这正是当初把它单独计比例的理由。B、C 是操作口径（量小的必须上采样才有效），D 是它的代价，A 是判据纪律。" },
  { q: "多语言模型号称覆盖上百种语言，这类说法要警惕的点有？", o: ["A. 同一句问候语在一种语言里可能是 1 个 token，在另一种里可能是好几个", "B. 用机器翻译把英文基准复制成多语言，会混入翻译腔和翻译错误", "C. 覆盖的语言种类越多，每种语言的能力必然越强", "D. 翻译式基准对形态复杂、语序差异大的语言尤其不公平", "E. 语言识别在方言与混排文本上并不可靠，统计出的占比本身可能失真"], a: [0, 1, 3, 4], e: "C错误：语言数只是词表与配比的覆盖口径，能力要靠每种语言各自的评测，覆盖不等于掌握。E、A 分别质疑统计口径和 token 成本口径，B、D 是翻译式基准的两类系统性失真。" },
  { q: "评估一次预训练的可行性，下列口径正确的有？", o: ["A. GPU 数量翻倍，完成时间就精确减半", "B. 序列长度上升后，注意力的平方开销让同样的算力预算处理更少 token", "C. 有效算力约等于集群峰值 FLOPs 乘以 MFU，后者明显低于 100%", "D. 只按芯片标称峰值估算，会严重低估实际工期", "E. 通信、检查点保存与故障重启都会吃掉可用时间"], a: [1, 2, 3, 4], e: "A错误：扩展受通信与并行切分效率限制，卡数翻倍带来的往往是次线性加速，甚至因流水线气泡得不偿失。C、D、E 是可行性估算的三个折扣项，B 提醒预算要按上下文长度重新算。" },
  { q: "SFT 阶段只用人工精修的「长而全面」回复做训练数据，会带来哪些后果？", o: ["A. 可以用长短配对的指令数据与按长度分桶采样来缓解", "B. 指令跟随能力会因此完全丧失", "C. 后续奖励模型也会给长回答高分，放大成 reward hacking 的一个来源", "D. 模型形成长度偏置，倾向用冗余篇幅回答简单问题", "E. 训练损失必然更高"], a: [0, 2, 3], e: "E错误：损失高低与回复长短没有必然关系，长回复条数少时平均损失反而可能更低；B错误：长度偏置改变的是回答风格分布，不会让模型听不懂指令。" },
  { q: "把多轮对话拼成一条序列做 SFT，关于拼接格式与损失掩码，正确的有？", o: ["A. 训练模板的角色标记必须与推理时拼接的模板完全一致", "B. 掩码做错会让模型学会替用户生成提问，出现角色串位", "C. 拼接格式对最终效果几乎没有影响", "D. 只在 assistant 回复段计算损失，user 与 system 段做掩码", "E. 对 user 段也计损失能让模型更懂用户意图，是推荐做法"], a: [0, 1, 3], e: "E错误：user 段是给定条件，对它做下一词预测等于教模型扮演用户，是常见事故；C错误：模板不一致会让推理时落入分布外，格式是 SFT 的硬约束。" },
  { q: "在 SFT 数据里加入大量统一措辞的安全拒绝样本，可能的副作用与对策包括？", o: ["A. 安全样本占比过高会挤压通用指令信号，专业能力轻微退化", "B. 应补充同话题的可答边界样本教它区分", "C. 拒答样本必须全部删掉才能避免过度拒答", "D. 模型把话题关键词与拒答强关联，误伤含同名词的合法提问", "E. 统一措辞的免责段落容易被背诵，近义提问输出几乎相同的拒答文本"], a: [0, 1, 3, 4], e: "C错误：删光安全样本会让有害请求直接得到回答，正确做法是控制配比并补边界样本，而不是清零。" },
  { q: "只用几千条指令数据训练时，关于训练轮次与能力退化，正确的有？", o: ["A. 表现为遇到相似提问直接复读训练集原句", "B. 用验证集上的指令跟随得分与早停把关，比只看训练损失可靠", "C. 同批数据反复过多还会导致输出风格坍缩、多样性下降", "D. 轮次过多会让模型背诵训练指令而不是泛化", "E. 数据少就应该把轮次拉到几十遍来补偿信息量"], a: [0, 1, 2, 3], e: "E错误：重复注入同一分布补不了信息量，只会加剧记忆化；数据量不足应当靠扩充来源与合成数据来补。" },
  { q: "提升指令数据多样性，有效的做法包括？", o: ["A. 按语义聚类采样，避免同一意图被重复堆量", "B. 引入不同来源模型生成的回复，减少单一风格主导", "C. 把同一问题的二十个近义改写全部塞进训练集", "D. 对任务类型、回复长度、语气风格分别做配比统计", "E. 对同一批文档反向合成多种问法的指令"], a: [0, 1, 3, 4], e: "C错误：近义改写只是表面扰动，语义高度同质，堆量会稀释有效梯度并加重记忆化。" },
  { q: "SFT 数据大量来自自家模型自我生成时，需要警惕的有？", o: ["A. 合成数据一律不可用，只能人工从零撰写", "B. 保留一定比例真实人类数据作为分布锚", "C. 对合成数据做去重、质量过滤与来源配比是常用缓解手段", "D. 生成分布尾部样本越来越少，长尾能力随自产轮次收窄", "E. 模型的错误会被当作正确答案反复训练，形成自我强化"], a: [1, 2, 3, 4], e: "A错误：数学、代码等有判分器的场景合成数据非常有效，问题在于无节制的自产自销，而不是合成本身。" },
  { q: "几千条指令数据训完，通用问答明显退化但业务题几乎全对，最可能的原因是？", o: ["A. batch size 太大", "B. 基座模型本身能力不够", "C. 学习率设得太小", "D. 数据覆盖过窄叠加训练轮次过多，模型记住了训练分布", "E. 没有对 user 段做损失掩码"], a: [3], e: "单选。业务题全对而旧能力忽然消失，是窄覆盖加多轮训练的典型记忆化组合。B错误：基座弱不会让原本具备的能力突然不见；C错误：学习率过小表现为欠拟合而不是背题；E错误：掩掉非 assistant 段本就是正确做法，与这种退化无因果；A错误：批大小与是否记住训练集没有直接关系。" },
  { q: "把通用模型微调成法律专岗后其他领域明显变差，合理的解释与缓解是？", o: ["A. 混入一定比例的通用指令数据可以兜底", "B. 全参微调比只训旁路参数更容易出现这种遗忘", "C. 上线前要对旧能力做回归评测，而不是只测专项指标", "D. 把微调学习率调大，专业能力涨得更快，同时能减少对通用能力的覆盖", "E. 单领域数据占比过高会造成通用能力的分布损失"], a: [0, 1, 2, 4], e: "D错误：加大学习率会加重遗忘，方向正好相反；缓解靠数据配比、更小的学习率或 LoRA 这类约束更新范围的手段。" },
  { q: "训练一个当裁判的奖励模型时，下列说法正确的有？", o: ["A. 裁判靠下一词预测的交叉熵学会打分", "B. 用同一提问下的优选与劣选成对数据，按 Bradley-Terry 型损失拟合偏好", "C. 通常在语言模型顶部接一个标量打分头，取末位 token 的隐状态出分", "D. 起点常选对齐程度较好的模型，避免让裁判从零状态学起", "E. 它容易学出长度与格式偏好，更长更工整的回答常常拿高分，即使内容并不更强"], a: [1, 2, 3, 4], e: "A错误：交叉熵是语言建模的目标；奖励模型优化的是成对偏好似然，自身不产出 token。" },
  { q: "相比 DPO，一次 PPO 式 RLHF 迭代的资源开销主要来自？", o: ["A. 训练期要同时驻留策略、参考、价值、奖励等多个模型", "B. 冻结的参考与奖励模型仍要前向计算，占用显存与带宽", "C. 生成阶段逐 token 解码，采样吞吐常成为整体瓶颈", "D. 每轮都要用当前策略在线采样生成大量回答", "E. 额外只需要一个奖励模型，显存与 SFT 差别不大"], a: [0, 1, 2, 3], e: "E错误：除裁判之外还有价值网络和冻结的参考模型要常驻，而且 rollout 本身就是额外的大头。" },
  { q: "关于 RLHF 中的 KL 约束与参考模型，正确的有？", o: ["A. 系数过大时策略贴着 SFT 不动，对齐效果出不来", "B. 参考模型的职责是把回复改写通顺后再送裁判打分", "C. 系数过小时奖励短期飙升，但输出容易跑偏、重复或退化", "D. KL 曲线突增通常提示要回调系数或回滚检查点", "E. KL 项惩罚策略偏离参考模型，抑制它钻裁判的空子"], a: [0, 2, 3, 4], e: "B错误：参考模型只提供对数概率作为距离基准，既不润色也不打分。" },
  { q: "奖励模型分数一路上升，下列哪些是 reward hacking 的典型征兆？", o: ["A. 多个独立奖励模型对同一批回答给出明显分歧的评分", "B. 裁判分数与人类偏好在任何阶段都严格一致", "C. 回答长度持续膨胀而内容越来越空", "D. 开头堆免责、复述提问来骗取「结构完整」加分", "E. 自动分数上升的同时人工盲评胜率下降"], a: [0, 2, 3, 4], e: "B说反了：自动分数与人类偏好脱钩正是 reward hacking 的定义；A 是 ensemble 裁判能暴露「策略只讨好某一个打分器」的信号。" },
  { q: "RLHF 训练出现崩溃征兆，下列观察与处置对应正确的是？", o: ["A. KL 突然飙升多因奖励信号过强或系数过小，应加强 KL 惩罚", "B. 生成长度断崖式下跌，可能是策略学会用极短回复规避打分", "C. 乱码与重复增多时应降学习率或回滚到上一个检查点", "D. 崩溃一定先在训练日志的标量曲线上暴露，不必检查采样样本", "E. 策略熵快速塌缩、输出趋于模板化，应减小更新幅度"], a: [0, 1, 2, 4], e: "D错误：退化通常先在 rollout 的具体回答里露头，标量指标要等崩了才动；调试必须先抽样读生成。" },
  { q: "关于 PPO 中的价值网络（评论家），正确的有？", o: ["A. 估计当前状态的价值，与回报组合成优势，降低梯度方差", "B. 起点权重通常复制自策略模型，便于早期估值准确", "C. 只在训练阶段需要，推理部署时不必保留", "D. 策略分布移动会让估值失准，需与策略同步更新", "E. 它负责判断回答对人类更有价值还是更有害"], a: [0, 1, 2, 3], e: "E错误：判断好坏是裁判（奖励模型）的职责；评论家只估计回报，不引入人类偏好。" },
  { q: "奖励模型是在旧策略生成的回答上训练的，由此可以推出？", o: ["A. 裁判一旦训练完成就应当冻结，全程不再更新", "B. 训练中没见过的回答风格，其分数不应视为可信", "C. 限制策略偏移与定期更新裁判，是同一个问题的两侧保险", "D. 策略跑得太远时，裁判面对新分布打分不可靠", "E. 需要周期性用新策略的样本补标并更新奖励模型"], a: [1, 2, 3, 4], e: "A错误：冻结的裁判会随策略远离训练分布而失效，业界常见做法是迭代补标重训；代价是要防止裁判被策略牵着走。" },
  { q: "关于 DPO「把奖励内化进模型」的数学直觉，正确的有？", o: ["A. 隐式奖励正比于 log(策略/参考)，因此参考模型仍是必需件", "B. 训练时不需要在线采样生成回答", "C. 它把奖励模型蒸馏成了一个独立的打分网络", "D. 把偏好概率写成两个回答对数概率之差的形式", "E. 模型自身的对数概率比就充当隐式奖励，不必再单独练裁判"], a: [0, 1, 3, 4], e: "C错误：DPO 不保留独立打分网络，奖励被吸收进策略参数本身，这正是它比 PPO 少养两个模型的原因。" },
  { q: "DPO 使用离线偏好数据，其分布外问题的表现与缓解包括？", o: ["A. 偏好数据量足够大，分布外问题就会自动消失", "B. 让两个候选都由当前策略采样生成，可缓解分布失配", "C. 标注员手写「标准答案」当 chosen，会拉大与模型自身分布的距离", "D. 混入只优化 chosen 的监督损失项，是常见的稳定手段", "E. 当 chosen 在模型下的概率本就低于 rejected，优化可能把两者一起压低"], a: [1, 2, 3, 4], e: "A错误：加量只降低统计噪声，解决不了「数据不来自当前策略」这一结构性失配，这是离线方法的固有局限。" },
  { q: "关于 DPO 中的 β 系数，正确的有？", o: ["A. β 偏小时策略更激进地拉开偏好差距，容易过拟合标注噪声", "B. β 就是优化器的学习率，两者可以互相替代", "C. β 偏大时训练贴近参考模型，对齐效果更弱但更稳", "D. β 的合理取值与偏好数据的噪声水平有关", "E. β 控制策略可以偏离参考模型多远，作用类似 KL 约束的强度"], a: [0, 2, 3, 4], e: "B错误：β 出现在损失函数里给对数概率比加权，与步长是两个独立超参；把它们混为一谈会同时改变约束强度和更新幅度，出问题无法归因。" },
  { q: "有些偏好优化变体去掉参考模型并对长度做归一化，其动机包括？", o: ["A. 未归一化的对数概率差让长回答系统性占便宜或吃亏，形成长度偏置", "B. 按每 token 平均对数概率比较，更贴近「比两个回答的质量」这一目标", "C. 这类做法牺牲了对参考分布的显式锚定，需要靠超参与早停防止跑偏", "D. 省掉常驻显存的参考模型前向，降低训练成本", "E. 去掉参考模型就能顺带完全避免通用能力遗忘"], a: [0, 1, 2, 3], e: "E说反了：失去参考模型的锚定更容易偏离初始分布、放大遗忘，这是该取舍的代价而不是收益。" },
  { q: "成对偏好标注成本高，于是出现直接用单条「有用/有害」标签训练的偏好优化变体。关于它们，正确的有？", o: ["A. 它需要一个基线（例如参考策略的期望对数概率）来划分好坏边界", "B. 因为没有第二个候选，这类方法不需要任何基线就能定标", "C. 单条标签不需要同一提问下的两个候选，数据采集更灵活", "D. 安全场景天然有「必须拒绝或可以回答」的绝对标签，适合这类方法", "E. 代价是失去成对比较提供的相对强弱信息，单位样本信息量更低"], a: [0, 2, 3, 4], e: "B错误：恰恰相反，单条标签必须靠基线才知道「多好算好」，缺了参照好坏无从判定，这也是它比成对数据更依赖超参的原因。" },
  { q: "偏好数据很干净，模型能把成对分数差拉到极大，此时可能出现的问题与对策是？", o: ["A. 训练指标很漂亮，但人工评测的多样性与稳健性下降，是典型表现", "B. 应该继续加大 β 把差距拉得更开来巩固效果", "C. 显式建模标注翻转率，也能缓解对单批偏好数据的过拟合", "D. 隐式奖励被无限拉大会让策略过度偏离参考分布", "E. 给偏好差距设一个目标值、超出不再加分，可以抑制这种过拟合"], a: [0, 2, 3, 4], e: "B错误：β 越大对偏离的惩罚越强，策略只会更保守，不会去「拉大差距」；巩固效果要靠约束差距目标值与增加数据多样性。" },
  { q: "DPO 训练中偏好准确率在涨，但两个候选的对数概率都在下降，最准确的解读是？", o: ["A. 属于正常现象，概率整体下降不影响最终质量", "B. 模型主要在学「避开差答案」，写作能力正在被削掉", "C. 说明学习率太小", "D. 说明偏好数据已经被完全学透", "E. 说明参考模型加载出错"], a: [1], e: "单选。差距扩大只要求 rejected 降得比 chosen 更快，双双下降意味着 chosen 侧也在退化，生成能力被削掉；常见处置是混入监督项、降低学习率，或改用更贴近策略分布的偏好数据。E错误：参考模型加载错误表现为梯度异常而非这种规律趋势；A错误：这是需要干预的病态；C错误：学习率小会表现为不动而非双降；D错误：学透的标志是曲线趋平，而非概率持续走低。" },
  { q: "关于「SFT 加离线偏好优化」与「SFT 加 RLHF」的取舍，正确的有？", o: ["A. 后者需要在线采样与多个模型同时驻留，成本和调试难度更高", "B. 要在有用、简洁、引用准确等多目标之间动态权衡时，在线 RL 更灵活", "C. 前者的上限受数据覆盖度限制，模型自己没写过的更好答法它教不会", "D. 前者的效果一定更好，因为它不会崩溃", "E. 前者训练稳定，显存与工程量显著更小"], a: [0, 1, 2, 4], e: "D错误：稳定不等于更强，不崩溃只说明好训练；能力上限取决于偏好数据是否覆盖了你真正想学的行为。" },
  { q: "可验证奖励（RLVR）适合哪些任务，边界在哪里？", o: ["A. 代码任务可以用测试用例充当验证器", "B. 开放式写作与摘要同样容易定义客观可验证的奖励", "C. 工具调用可用返回值与参数是否合规来判定", "D. 验证器本身会有假阴性，正确解法可能只因格式不符就被判错", "E. 数学题有唯一答案，可用规则或计算器判定对错"], a: [0, 2, 3, 4], e: "B错误：「这段摘要够不够忠实」难以机械化判定，硬套可验证奖励只会把模型推向讨好打分脚本。" },
  { q: "用可验证奖励训练推理模型时，关于解析与截断，正确的有？", o: ["A. 去掉长度上限之后，截断带来的负反馈也自然消失", "B. 判分脚本里的空格、单位、大小写等细节会直接改变奖励分布", "C. 答案必须按约定标签解析，解析失败即判错会白白惩罚正确的推理", "D. 思维链超长被截断时拿不到结果分，模型可能学会草草收尾", "E. 格式约束宜作为弱奖励项，与内容正确性分开计分"], a: [1, 2, 3, 4], e: "A错误：放开上限只是推迟截断，成本与延迟失控，且仍会出现「想到一半答不完」；要靠难度课程与思考预算来管，而不是无限放开。" },
  { q: "关于过程奖励模型（PRM）与结果奖励模型（ORM），正确的有？", o: ["A. 过程分数要与最终答案校验配合使用，否则会被步骤式胡诌利用", "B. 结果奖励只在最终答案处给分，稀疏但判定可靠", "C. 只看结果的奖励天然能防止「过程全错、答案蒙对」", "D. 过程奖励把功劳与责任分配到具体推理节点，缓解信用分配难题", "E. 过程奖励更容易被「步骤看着合理但实际错误」的推理骗过"], a: [0, 1, 3, 4], e: "C说反了：结果奖励只看终点，无法区分严密推导和瞎猜，这正是需要引入过程监督的理由。" },
  { q: "训练过程奖励模型需要「每一步对不对」的标签，常见的获取方式包括？", o: ["A. 人工逐步标注最准，但成本高且标注员之间判定不一", "B. 让模型自采样多条后续路径，能推进到正确答案的步骤记为正确，实现自动弱标注", "C. 用算术校验、代码执行这类规则检查器给可判定步骤自动打标签", "D. 从题目条件与最终答案反推关键中间量是否成立", "E. 把最终答案的对错平摊到每一步，就等价于过程标签"], a: [0, 1, 2, 3], e: "E错误：平摊只是把结果噪声平均化，会把蒙对的关键一步也标成正，训不出真正的过程判别力。" },
  { q: "在 RLVR 训练中，关于负样本与「全错批次」，正确的有？", o: ["A. 全错的批次应当加大惩罚力度，让模型牢牢记住教训", "B. 错误轨迹可用于构造偏好对或自我反思的素材，不必丢弃", "C. 若把答错额外计成长思考的代价，模型会学会少想止损，出现短回答退化", "D. 一组采样全错时组内没有好坏差异，优势为零，这批几乎不产生梯度", "E. 题目难度要落在模型偶尔能做对的区间，需要动态课程筛选"], a: [1, 2, 3, 4], e: "A错误：全错批次里没有相对较好的解，加重惩罚只会把概率压向无意义方向，甚至诱发提前收笔；正确做法是换题或调难度。" },
  { q: "经过可验证奖励训练后，模型仍会出现「过程错、答案对」，最合理的解释是？", o: ["A. 采样温度设得太高", "B. 思维链太长导致注意力丢失", "C. 过程奖励模型打分过严", "D. 奖励只校验最终答案，正确的过程并不是拿到奖励的必要条件", "E. 训练集里难题不够多"], a: [3], e: "单选。判分只看终点，「先猜对再补理由」同样得分，这类行为就会被训练出来；加上思维链本身仍是概率生成的文本，不保证逐步精确。E错误：难度不足影响的是正确率，不造成过程与答案脱节；A错误：温度只改变采样随机性，不改变奖励结构；B错误：注意力丢失通常导致答错而非蒙对；C错误：过程打分过严恰恰会抑制蒙对。" },
  { q: "关于推理模型训练后的思考长度行为，正确的有？", o: ["A. 训练后的思考长度完全由推理时的 effort 参数决定，与训练无关", "B. 数学可验证奖励带来的收益不一定迁移到通用写作与多轮对话", "C. 简单题也长篇大论，即过度思考", "D. 思考长度随题目难度伸缩，是奖励与采样共同塑造的结果", "E. 可以用长度惩罚或分档思考预算把简单题的思考压下来"], a: [1, 2, 3, 4], e: "A错误：推理时参数只是在模型已经学出的行为分布上做选择，能不能按难度自动伸缩是训练期形成的能力。" },
  { q: "关于强化学习训练期的采样设置，正确的有？", o: ["A. 训练期需要探索带来的分布差异，与推理期追求确定性的目标不同", "B. 算力紧张时可按题目难度分配样本数量，把预算留给偶尔能做对的题", "C. 同一道题的多个候选应当用贪心解码生成，这样奖励更稳定", "D. 采样毫无随机性时组内候选雷同，优势估计失去对比基础", "E. 温度过高会产生大量低质轨迹，浪费算力也拉低有效样本比例"], a: [0, 1, 3, 4], e: "C错误：候选雷同就没有好坏差异，梯度接近零；奖励稳定不等于有学习信号，这正是策略梯度需要组内方差的原因。" },
  { q: "关于「过度拒答」，正确的有？", o: ["A. 评测要同时统计误拒率与有害回答率，只看一个必然偏", "B. 补同话题的可答边界样本，比继续加大拒答数据更有效", "C. 要求模型说明拒答的具体理由，可以抑制它把整类问题一杆子打死", "D. 调成见敏感词就拒能让安全评分最好看，所以这种退化不会误导评测结论", "E. 安全训练容易把敏感话题词与拒答建立虚假关联，误伤合法提问"], a: [0, 1, 2, 4], e: "D错误：全拒答的模型安全分确实漂亮，这正是只看安全分的陷阱；有害率必须与有用率成对报告，否则等于奖励怯懦。" },
  { q: "关于对齐税（Alignment Tax），正确的有？", o: ["A. 评测应在对齐前后跑同一套题，差值才是税", "B. 对齐后部分能力基准分数下降，是常见代价", "C. 对齐税只出现在带安全过滤的模型上，纯能力提升不涉及", "D. 更隐蔽的是分布层面的损失：罕见但有价值的创造性回答被磨平", "E. 用更高质量、更多样的对齐数据可以减轻对齐税"], a: [0, 1, 3, 4], e: "C错误：任何改变输出分布的训练都要付代价，加长思考同样带来成本上升与风格变化的税，不是安全过滤专属。" },
  { q: "低资源语言上安全对齐更容易失效，原因与缓解包括？", o: ["A. 模型宣称支持上百种语言，对齐就自动覆盖了全部语言", "B. 关键语言需要单独准备偏好与安全边界数据，不能只做机器翻译", "C. 偏好与安全标注集中在英文，其他语言是能力被翻译过去而约束没跟上", "D. 切换语言能显著降低同一敏感请求的拒绝率，这是已知攻击面", "E. 低资源语言被分词切得更碎，等效训练信号密度更低"], a: [1, 2, 3, 4], e: "A错误：语言覆盖是能力问题，对齐覆盖是数据问题，多语言词表不等于多语言偏好数据。" },
  { q: "关于对齐所依据的价值观，正确的有？", o: ["A. 同一问题在不同法域下的合理答案不同，需要可配置的策略层而不是把答案写死", "B. 把争议话题的裁判权完全交给模型，会放大标注样本的偏向", "C. 记录标注指南的取舍与仲裁案例，是价值观可追溯的基础设施", "D. 偏好数据量足够大时，价值观上的分歧会被平均掉，最终收敛出唯一答案", "E. 标注人群的地域与职业分布，会被模型学成所谓普适价值观"], a: [0, 1, 2, 4], e: "D错误：数据量只能降低抽样噪声，消解不了真实的价值分歧；分歧应当被暴露和治理，而不是靠多数票掩盖。" },
  { q: "关于对齐与越狱（Jailbreak）的关系，正确的有？", o: ["A. 角色扮演、语言切换、超长上下文这些表层手法就能绕开拒答，说明行为层约束脆弱", "B. 把拒答训练得更强硬之后，外部护栏就成了冗余，可以省掉", "C. 纵深防御（输入输出分类器、工具权限、执行框架拦截）比单点强调模型自身对齐更可靠", "D. 对齐改变的是输出分布上的倾向，不等于删除底层能力", "E. 构造离训练分布很远的前缀，可以把模型推进未对齐的区域"], a: [0, 2, 3, 4], e: "B错误：模型侧对齐是概率性的、可被绕过，高危动作必须在代码层拦截，与本库「不能只靠提示词」的口径一致。" },
  { q: "对齐版本上线前的安全评测，最可靠的做法是？", o: ["A. 只测英文单轮直接提问", "B. 让模型自己评估有没有安全风险", "C. 只看上线后的用户投诉量", "D. 只用公开红队数据集跑一遍看通过率", "E. 在固定的同一题集上同时报有害率与误拒率，并另设含敏感词的正常任务集专测误伤"], a: [4], e: "单选。安全与误伤必须成对度量，且要用含敏感词的正常任务集把误伤单独暴露出来。D错误：公开集覆盖窄又容易被针对性优化，打不穿只说明当前这批攻击失效；A错误：多语言与多轮追问是主要漏点；B错误：模型自评系统性偏乐观；C错误：投诉是被看到的极小且有偏的样本，且严重滞后。" },
  { q: "模型顺着用户的错误前提往下答、用户一反问就立刻改口，关于这一现象正确的有？", o: ["A. 这属于对齐带来的行为问题，而不是知识缺失", "B. 评测时应专门构造用户给出错误前提的题目来量化它", "C. 在标注指南里明确惩罚迎合错误前提，比事后加一层拒答更有效", "D. 该现象只出现在开放写作类任务，数学和代码上不存在", "E. 偏好标注里自信、附和用户的回答常被排在前面，模型学到了讨好"], a: [0, 1, 2, 4], e: "D错误：可验证任务上同样存在——用户声称答案应该是 7 时，模型可能把正确的推导改成迎合 7，只是判分器能兜住一部分。" },
  { q: "让多人对同一批回答做偏好标注并统计一致性，关于它的意义正确的有？", o: ["A. 争议样本应当有仲裁流程，或者干脆丢弃，而不是强行平均", "B. 一致率高就一定说明标注质量高", "C. 上岗前先做标注资格考试与示例校准，再放量生产", "D. 一致率低说明指南含糊、任务过难或样本超出标注员能力", "E. 高噪声偏好会被裁判模型学成随机信号，进而放大成被策略利用的空子"], a: [0, 2, 3, 4], e: "B错误：系统性偏差下大家会一致地选错，例如都偏爱更长回答；一致性只度量稳定，不度量正确。" },
  { q: "一份能真正落地的偏好标注指南，应当包含？", o: ["A. 定期用同一批校准题检查不同标注员是否发生漂移", "B. 明确的优先级，例如安全高于事实准确、事实准确高于简洁", "C. 允许标注员按个人好恶自由判断，以保留答案的多样性", "D. 边界案例的正例与反例，而不是只写抽象原则", "E. 争议样本的升级仲裁路径并留存记录"], a: [0, 1, 3, 4], e: "C错误：个人好恶是噪声来源；多样性应当体现在题目分布上，而指南的目的正是让不同人对同一问题给出相近判断。" },
  { q: "关于标注员疲劳与漂移，正确的有？", o: ["A. 打散任务、限制连续时长、插入已知标准答案的样本题，可以持续质检", "B. 指南理解会随时间漂移，早期与后期批次不宜不加校正就直接混用", "C. 标注员数量足够多，疲劳带来的偏差就会被完全抵消", "D. 长时间工作后倾向选择更长或更眼熟的回答，判定阈值随疲劳移动", "E. 疲劳偏置在数据里会表现为长度与得票正相关这类可检测的模式"], a: [0, 1, 3, 4], e: "C错误：人多只降低彼此独立的随机噪声，疲劳偏置是系统性同向的，加人反而把同一偏差采得更密。" },
  { q: "让模型自己评估对齐效果时存在的偏差，正确的有？", o: ["A. 自评与人工盲评的相关性够高时，边界样本也可以交给自评，人工抽查能省则省", "B. 模型会系统性高估自己对安全边界的把握，声称已经拒绝而实际只是碰巧", "C. 自我报告的推理过程与真实计算路径不必然一致，不能当作机制证据", "D. 自评得分容易被提示措辞和角色扮演设定改变", "E. 用实际输出与判分记录这类行为证据，比用自述来度量对齐更可靠"], a: [1, 2, 3, 4], e: "A错误：相关性只说明平均趋势一致，而最危险的边界样本恰恰是模型自评最不准的地方，人工抽样不能省。" },
  { q: "用大模型做自动评审（LLM-as-judge）时，必须处理的偏置包括？", o: ["A. 长度与风格偏置：更长、排版更花的答案容易拿高分", "B. 自我偏好：评审模型偏爱自己或同族模型的输出", "C. 换一个更强的评审模型就能彻底去除这些偏置", "D. 应抽样与人工评审对齐，用一致率给自动分数标定可信区间", "E. 位置偏置：交换两个候选的顺序重测，结论不稳的样本判为无效"], a: [0, 1, 3, 4], e: "C错误：更强的评审模型仍有自身偏好，只能缓解；必须靠机制性去偏（随机化位置、控制长度）加人工锚点。" },
  { q: "不同训练阶段该上哪种对齐方法，合理的判断包括？", o: ["A. 数学、代码这类有判分器的能力，用可验证奖励比靠人类偏好更省标注", "B. 基座模型也听得懂指令，跳过 SFT 直接做 RLHF 更省事", "C. 冷启动先用 SFT 把对话格式和说话方式立起来", "D. 已有偏好数据、要低成本稳住风格时，离线偏好优化更划算", "E. 需要探索模型自己没写过的更好答法时，在线强化学习才有优势"], a: [0, 2, 3, 4], e: "B错误：本库第 3 节明确基座模型不懂对话格式；没有 SFT 冷启动，策略采出来的回答连可比较的结构都不稳定，裁判和价值网络都学不好。" },
  { q: "评测一个后训练版本是否真的更好，合理的做法包括？", o: ["A. 评测集要与训练数据做污染检查，重复题目会把对齐评成能力", "B. 同一套题在对齐前后各跑一次，才能把能力提升与对齐提升分开", "C. 公开榜单分数涨了，就说明对齐做得更好", "D. 分层评测：单轮指令跟随、多轮一致性、安全边界、长尾任务分别看", "E. 尽量用成对比较而不是绝对打分，绝对分对提示措辞太敏感"], a: [0, 1, 3, 4], e: "C错误：榜单混着能力、格式熟悉度和数据泄漏，而对齐的收益常体现在「不该答的不答、该拒的准拒」上，榜单对此几乎不敏感。" },
  { q: "关于 LoRA 的“低秩”假设，正确的有？", o: ["A. rank 越大效果一定单调变好，且不用担心过拟合", "B. LoRA 把要学的权重变化拆成 ΔW = B·A 两个窄矩阵相乘", "C. 秩 r 远小于隐藏维度 d，所以可训练参数远少于全参微调", "D. 训练时要显式存下一个完整的 d×d 的 ΔW 大矩阵", "E. 基座权重全程冻结，ΔW 只作为旁路叠加在输出上"], a: [1, 2, 4], e: "D错误：ΔW 从不落成 d×d 大矩阵，存储与训练都只碰 C、B 两个窄矩阵；A错误：rank 上去后容量与噪声一起涨，小数据集更容易过拟合，要按业务评测集来定。" },
  { q: "某 LoRA 实现按 h = (alpha/rank)·B·A 缩放旁路，当前 rank=16、alpha=32。下列说法正确的有？", o: ["A. 把 rank 改成 32、alpha 仍留 32，系数从 2 变成 1", "B. 把 alpha 改成 64、rank 留 16，系数变成 4，旁路贡献比原来大一倍", "C. alpha 指的是旁路新增矩阵的个数", "D. alpha 与 rank 同倍放大时系数不变，可训练参数也不会变", "E. 此时 h 的系数是 2"], a: [0, 1, 4], e: "C错误：alpha 只是一个缩放超参，矩阵个数由 target 模块与 rank 决定；D错误：系数确实不变，但每个旁路的参数是 2×d×r，rank 涨它就涨。E、A、B 三档都能从 32/16=2、32/32=1、64/16=4 直接算出。" },
  { q: "给一个模型挂 LoRA 时，旁路通常加在哪些地方？", o: ["A. 必须给全部线性层都加上，否则训不动", "B. 只加在词嵌入层就能达到同样的效果", "C. 加哪些模块、rank 取多少，要在业务评测集上做效果与显存的折衷", "D. 原论文以注意力的 q_proj、v_proj 为主要对象", "E. 除注意力投影外，也可以加在 FFN 的上/下投影矩阵上"], a: [2, 3, 4], e: "A错误：只给 q_proj、v_proj 加就是原论文里成立的常见配置，不存在全加不可；B错误：只调嵌入是另一类 PEFT，注意力与前馈投影上的旁路作用它接不住。" },
  { q: "一个 7B 模型：hidden=4096、32 层，每层对 q_proj 和 v_proj（都按 4096×4096 估）加 rank=16 的 LoRA。可训练参数怎么算？", o: ["A. 840 万约占 7B 的千分之一点二", "B. 合计约 1.07 G，因为旁路要把投影矩阵本身复制一份", "C. 可训练参数与 rank 无关，只由层数决定", "D. 单个投影是 4096×16 + 16×4096 ≈ 13.1 万", "E. 每层两个投影约 26.2 万，32 层合计约 840 万"], a: [0, 3, 4], e: "B错误：4096×4096×2×32 ≈ 1.07 G 是把这两个投影全参训练的量级，旁路只占其中极小一块；C错误：旁路参数是 2×d×r 的量，rank 从 16 翻到 32，可训练参数也跟着翻倍。" },
  { q: "同一个基座上同时维护多个任务的 LoRA 适配器，正确的有？", o: ["A. 一个基座配几十个适配器，比养几十个全参模型省显存也省运维", "B. 适配器一旦共存就必须重新全参训练才能把它们分开", "C. 按请求切换不同适配器，可以共享同一份基座权重", "D. 同一模块上同时挂多个适配器时，输出是各自 ΔW 的叠加，可能互相干扰", "E. 领域差距很大的两个适配器线性合并，通常比各自单独使用更好"], a: [0, 2, 3], e: "E错误：合并后常常两边都掉点，远不如各挂各的；B错误：分开只要按标识加载对应旁路，不需要退回去做全参训练。" },
  { q: "关于 LoRA 权重合并（merge）与不合并的差别，正确的有？", o: ["A. 不合并会明显降低生成质量", "B. 一个基座服务多租户时，不合并（按需加载旁路）更省显存", "C. 合并之后就不能再做任何后续训练", "D. 合并后推理的计算图与原模型同构，不引入额外算子", "E. 一旦合并，同一份权重就没法再按请求热切换别的任务适配器"], a: [1, 3, 4], e: "A错误：不合并只是多走一次窄矩阵乘法，数学路径等价，不会因为没合并就掉一档质量；C错误：合并后的模型照样能继续微调或再挂新的旁路。" },
  { q: "LoRA 擅长学什么、学不动什么，正确的有？", o: ["A. 让模型稳定按内部工具的参数协议输出，适合用 LoRA", "B. 基座完全不会的语言或符号体系，加几百条样本的旁路就能补上", "C. 输出格式、字段约束、语气这类行为风格，少量数据就有明显效果", "D. 把一整套新领域百科知识灌进模型，主要由 LoRA 完成", "E. 大规模新事实通常要靠继续预训练或检索增强，旁路微调更像在重新组织已有能力"], a: [0, 2, 4], e: "D错误：知识注入不是旁路微调的主场，与本库“注入新知识应使用 RAG”的口径一致；B错误：基座没有底层表征时，几百条数据只够学个表面格式，学不出这套能力。" },
  { q: "关于 LoRA 两个旁路矩阵的初始化，正确的有？", o: ["A. 若两个矩阵同时置零，梯度恒为零，旁路彻底学不动", "B. 初始化方式对最终效果没有影响", "C. 每轮训练结束都要把两个矩阵重新归零", "D. B 一般置零，使训练起点 ΔW 为零，不扰动基座", "E. A 用随机初始化，与 B 的零初始化配合才有非零梯度"], a: [0, 3, 4], e: "B错误：把 E 置零正是为了让起点等价于原模型，两端都随机则一上来就叠一层噪声；C错误：参数靠优化器持续更新，归零等于把训练成果全部清空。" },
  { q: "关于 QLoRA 的分页优化器（Paged Optimizer），下列说法错误的是？", o: ["A. 主要价值是长序列或 batch 突增时不让训练被 OOM 打断", "B. 它是一项常态提速手段，开启后每步吞吐一定更高", "C. 显存宽松时它不介入，日常训练的开销与未开启时基本一致", "D. 触发换出换入时要走 PCIe 搬运，那一步会明显变慢", "E. 用分页方式管理优化器状态，显存峰值超限时把状态块换出到 CPU 内存"], a: [1], e: "单选。B错误：它是防止爆显存的保险带，代价是偶发的 PCIe 搬运，不会稳定提升吞吐；E、A、D 是它的真实机制与副作用。" },
  { q: "关于 QLoRA 里的 4-bit NF4，正确的有？", o: ["A. 基座权重以 4-bit 存在显存里，做矩阵乘之前临时反量化回 BF16", "B. NF4 就是把权重四舍五入成整数的 INT4", "C. 存 4-bit、算 BF16，意味着矩阵乘本身就在 4-bit 精度上进行", "D. 每参数位宽从 16 位降到 4 位，权重显存大约压到四分之一", "E. NF4 假设权重近似正态分布，按分位点取码本，比等间距更贴合权重"], a: [0, 3, 4], e: "B错误：NF4 不是等间距的整数量化，而是按正态分布分位数设计的非均匀码本；C错误：真正参与乘法的是解压出来的 BF16，4-bit 只是存法。D 由 16/4=4 可算，E、A 是两条基本设定。" },
  { q: "关于 QLoRA 的双重量化（double quantization），正确的有？", o: ["A. 它能让 4-bit 权重再压缩四倍", "B. 它把权重从 4-bit 升回 8-bit 来换精度", "C. 收益体现在每参数平均位宽的小幅下降，不是数量级变化", "D. 它把第一轮量化产生的那批缩放常数再量化一次", "E. 目的是压掉“量化元数据本身”占用的那部分显存"], a: [2, 3, 4], e: "A错误：被再量化的是缩放因子这些常数，权重本身的 4-bit 位宽没有变化；B错误：方向说反，它不动权重位宽，只动元数据的存法。" },
  { q: "QLoRA 用 4-bit 基座训练 LoRA，下列说法正确的有？", o: ["A. 同样的 batch 与序列长度，单步通常比 BF16 基座更慢，换来的是省下的权重显存", "B. 反量化只在训练第一步做一次，之后一直用解压好的权重", "C. 反复反量化会把权重数值越弄越坏，几轮之后模型就废了", "D. 冻结的基座不需要梯度和优化器状态，省出来的显存主要给了激活与临时缓冲", "E. 计算前要把 4-bit 解回计算精度，这部分开销每一步都存在"], a: [0, 3, 4], e: "B错误：权重始终只存 4-bit，每一步用到时都要现场解压；C错误：反量化是把存好的量化值还原成近似的 BF16，基座本来就不被更新，不存在越训越坏。" },
  { q: "关于 LoRA/QLoRA 的学习率与训练动态，正确的有？", o: ["A. 基座是冻结的，所以学习率对旁路没有影响", "B. 旁路从随机初值学起，常用比全参微调更大的学习率", "C. 学习率过大时旁路会放大高频噪声，训练损失还在降但业务指标先掉", "D. 训练损失单调下降就说明超参安全，验证集可以省掉", "E. 出现这种不稳时，可以下调学习率，也可以减小 alpha 或 rank"], a: [1, 2, 4], e: "D错误：训练损失看不见遗忘与过拟合，必须留同口径的验证集和回归集；A错误：基座冻结不等于旁路不更新，学习率直接决定 ΔW 的更新幅度。" },
  { q: "7B 模型用 QLoRA 微调：基座权重 4-bit（每参数 0.5 字节），可训练旁路约 8.4M，按 BF16 权重+BF16 梯度+FP32 主权重+两个 FP32 Adam 状态共 16 字节/参数估。下列算式与结论正确的有？", o: ["A. 4-bit 只压缩权重这一项，激活与旁路状态的开销不会跟着按比例缩", "B. 基座权重约 7e9×0.5B ≈ 3.5GB", "C. 那 16 字节/参数作用在 8.4e6 上约 1.3GB", "D. 权重才 3.5GB，8GB 显存的卡跑长上下文绰绰有余", "E. 峰值显存主要由序列长度决定的激活与反量化临时缓冲决定，而不是权重"], a: [0, 1, 4], e: "C错误：8.4e6×16B 是一点三亿字节，也就是 0.13GB 量级，不是 1.3GB；D错误：权重装得下不等于跑得动，长序列的激活会立刻把余量吃光。B 是 7e9×0.5B ≈ 3.5GB，E、A 说明另两类开销的走向。" },
  { q: "单张消费级显卡微调 7B，关于显存瓶颈，正确的有？", o: ["A. 梯度累积可以把单步显存峰值降为零", "B. 激活重计算用一次额外前向换显存，能明显抬高可训练的序列长度", "C. 权重从 BF16 换成 4-bit，约省 7e9×(2-0.5)B ≈ 10.5GB，腾出的空间可以给激活与缓存", "D. OOM 时先降 micro batch 和 max_seq_length，比急着换更小的模型更对症", "E. 单步峰值显存由等效 batch 决定，与 micro batch 无关"], a: [1, 2, 3], e: "E错误：每步只跑一个 micro batch，峰值跟着 micro batch 和序列长度走，等效 batch 是累积出来的数字；A错误：累积只是把几个小步的梯度原地相加，省下的是为更大 batch 扩容的那部分。C 的省量是 7e9×1.5B ≈ 10.5GB，D、B 是实践里的处置顺序。" },
  { q: "关于 Prefix Tuning 与 Prompt Tuning，正确的有？", o: ["A. 虚拟前缀等于帮模型省上下文预算，长度可以随便加", "B. 前缀太短学不动、太长既占位置又容易训练不稳，是常见的调参折衷", "C. 前者在每一层注意力的 K、V 前面拼接可训练的虚拟 token", "D. 后者也在每一层注意力前插虚拟 token，只是长度更短", "E. 两者都不动基座权重，属于 PEFT"], a: [1, 2, 4], e: "D错误：只在输入侧动软提示的是 Prompt Tuning，逐层拼前缀的是 Prefix Tuning，两者别搞反；A错误：虚拟 token 要占序列位置，真实输入的预算反而被挤掉一块。C、E 是机制描述，B 是前缀长度怎么定的实践经验。" },
  { q: "关于 Adapter 模块这类 PEFT，正确的有？", o: ["A. 它和 LoRA 一样可以合并进原权重，做到推理零额外开销", "B. Adapter 的瓶颈维度越窄，能力恢复得越好", "C. 它与 LoRA 同属 PEFT 且参数量级相近，所以推理速度和原版完全一致", "D. 在子层之间插入“降维—非线性—升维”的瓶颈结构，基座保持冻结", "E. 它挂在残差路径上会引入逐 token 的额外算子，推理延迟通常高于合并后的 LoRA"], a: [3, 4], e: "A错误：瓶颈模块中间夹着非线性，乘不进 W，只能一直留在计算图里；C错误：正因为合不进去，它就比合并后的 LoRA 多一层逐 token 开销，速度不会和原版一样。D、E 说的正是它的结构与延迟代价；B错误：瓶颈越窄容量越小，恢复能力反而更差。" },
  { q: "关于只调词嵌入 / 只调偏置这类轻量 PEFT，正确的有？", o: ["A. 词表覆盖差的语言或新术语，实践上常要连嵌入和输出头一起解冻", "B. 只调嵌入几乎不占显存，因为词表不参与反向传播", "C. 参数量和显存开销最小，适合轻量的风格与格式迁移", "D. 能力上限也最低，改不动深层表征", "E. 想灌进一整套新领域知识，只调嵌入就够了"], a: [0, 2, 3], e: "E错误：与旁路微调同一个毛病，表层改动扛不住大规模知识注入；B错误：解冻嵌入同样要有梯度与优化器状态，而且是整张词表的量级。C、D 是它的定位，A 是词表覆盖差时的常见做法。" },
  { q: "在“全参微调 / LoRA / 只调嵌入”之间做选择，合理的判据有？", o: ["A. 显存是硬约束：全参要同时装权重、梯度和优化器状态", "B. 要按租户或任务热切换个性化，不适合全参，适合一个基座配多适配器", "C. 数据量足够大时，LoRA 与全参微调在任何任务上都会等价", "D. 任务分布与基座差得远、数据量大、要改深层能力时，倾向全参或继续预训练", "E. 只有几百到几万条样例、目标只是行为和格式时，应该直接上全参微调"], a: [0, 1, 3], e: "E错误：这种小数据场景全参既费显存又容易过拟合与遗忘，性价比远不如旁路；C错误：数据规模与任务深度是两回事，需要改深层表征时旁路容量有限。D、A、B 分别对应能力差距、显存约束与部署形态三条判据。" },
  { q: "关于灾难性遗忘的表现与检测，正确的有？", o: ["A. 只看训练损失曲线就能发现遗忘", "B. 只训旁路比全参微调更容易出现灾难性遗忘", "C. 调小学习率、按比例混回原分布数据、只训旁路，都是常用缓解手段", "D. 微调后旧任务与通用评测掉分、新任务也没涨多少，是典型表现", "E. 检测要留一组旧能力回归集，训练前后同口径各跑一遍"], a: [2, 3, 4], e: "A错误：遗忘发生在没参与训练的能力上，训练损失对它完全不敏感，必须靠外部回归集；B错误：方向说反，基座参数被动过才有大范围遗忘的风险，旁路恰恰是缓解手段。D、E、C 与本库“全参微调容易发生灾难性遗忘”的口径一致。" },
  { q: "关于 PEFT 在多语言场景的差异，正确的有？", o: ["A. 挂上 LoRA 之后，小语种表现必然反超高资源语言", "B. 指令数据里某种语言占比过高会挤压其他语言，需要按语言配比", "C. 评测要分语言切片，平均分容易掩盖单语种塌陷", "D. 小语种常被切成更多碎片 token，同样条数下有效信号更少", "E. 基座在小语种上表征本来就弱，所以旁路微调的天花板反而更高"], a: [1, 2, 3], e: "E错误：表征本来就弱，旁路只能重新组织已有能力，天花板只会更低；A错误：旁路不会凭空造出小语种能力，反超高资源语言没有依据。D 讲 token 切分带来的成本，B、C 是配比与评测上必须做的事。" },
  { q: "关于权重合并与冲突，正确的有？", o: ["A. 合并之后就再也没法补救，只能回炉重做全参微调", "B. 做了模型合并之后，两个模型的能力会同时保留", "C. 合并前后都要用业务评测集验证，损失曲线不足以定论", "D. 同一基座上的两个 LoRA 可以按系数线性相加，但领域越远冲突越明显", "E. 架构或词表不同的两份权重不能直接做逐元素合并"], a: [2, 3, 4], e: "A错误：合并后再补训一个小旁路正是常见的修补做法，不是走投无路；B错误：合并经常换来两边同时掉点，需要挑系数或者干脆分开服务。D、E、C 覆盖合并的可行方式、禁忌与验证要求。" },
  { q: "准备微调数据时，关于格式规范，正确的有？", o: ["A. 数据里的缩进、换行这类格式噪声模型学不会，不用清理", "B. 对话模板和特殊 token 必须与基座一致，否则模型学的是错位格式", "C. 通常只在 assistant 回复上计算损失，user 与 system 部分做 mask", "D. 超长样本截断时要小心把答案截掉，宁可重切或者丢弃", "E. 训练用一套模板、推理用另一套也可以，不影响效果"], a: [1, 2, 3], e: "E错误：模板错位会让模型在推理时找不到该续写的边界，掉点非常直接；A错误：这类噪声会被一并学成输出习惯，正是需要清理的部分。B、C、D 是数据格式阶段要逐条落实的事。" },
  { q: "微调数据按业务域配比时，合理的做法有？", o: ["A. 某一个域占绝对多数时，其他域容易被稀释掉分", "B. 每次改配比都要回到分域切片评测上验证了再定", "C. 为求均衡把所有域都下采样到相同条数，与线上分布无关", "D. 难样本重复十几遍没有副作用，上采样倍数越高越好", "E. 按线上流量与业务价值加权采样，而不是照原始条数堆"], a: [0, 1, 4], e: "C错误：均分条数只是把偏置换成另一个方向，训练分布仍然要对着线上真实分布来定；D错误：过度上采样会让模型背样本，并在该域上走向过拟合。E、A、B 是配比这件事的常规打法。" },
  { q: "留出验证集与防数据泄漏，正确的有？", o: ["A. 验证集和测试集是同一份，反复用它选超参并对外报指标就行", "B. 对有时序的业务，按时间切分比随机切分更贴近真实", "C. 同一用户或同一文档的样本不能同时出现在训练集和验证集", "D. 模板化生成的近重复样本会造成泄漏，让指标虚高", "E. 随机按行切分训练与验证集，足以杜绝数据泄漏"], a: [1, 2, 3], e: "E错误：按行随机切分挡不住近重复与同源样本，该泄漏还是泄漏；A错误：被反复拿来选超参的那份早就被过拟合了，对外报数要用没被看过的测试集。C、D、B 对应分组切分、去重与时间切分三个要点。" },
  { q: "关于微调超参搜索的预算安排，正确的有？", o: ["A. 预算一旦定下就必须把网格跑完，不能中途止损", "B. 先在小数据量或更小的模型上粗扫，把预算留给有希望的组合", "C. 同样预算下随机搜索通常比逐点网格更容易命中好组合", "D. 用训练损失选超参最省事，不必看业务评测集", "E. 学习率与 rank、alpha 相互影响，先单独扫再联合验证更省算力"], a: [1, 2, 4], e: "D错误：训练损失会奖励过拟合，选超参必须看验证集与业务指标；A错误：明显差的组合该早点停，凑满网格只是把算力浪费在没救的点上。B、C、E 是控预算与定顺序的判据。" },
  { q: "微调模型上线前的评测门禁，合理的有？", o: ["A. 门禁里要有安全项与格式项，比如拒答率和结构合法性", "B. 自动指标之外再留一批人工抽评", "C. 公开榜单分数更高就可以跳过业务评测直接上线", "D. 门禁只看总分就够，分域切片等上线后再补", "E. 与线上基线同口径对比，关键指标跌破阈值就直接拦住"], a: [0, 1, 4], e: "C错误：榜单与自家业务分布脱节，替代不了业务门禁，与本库“评测集应以自身业务为核心”的口径一致；D错误：上线前不做分域切片，就可能让某一块能力悄悄退步。" },
  { q: "上线后发现“某项能力掉了”，合理的定位手段有？", o: ["A. 一条用户投诉就足以定根因，不用再看日志与回放", "B. 按业务域与意图切片看指标，先确认是哪一块退化", "C. 把数据、超参、模板、模型版本的变更记录与指标时间线对齐", "D. 用固定回归集定期回放，隐性退化能更早暴露", "E. 总体平均分没掉，就说明没有任何能力退化"], a: [1, 2, 3], e: "E错误：总分是各域的加权平均，小域塌陷会被大域涨分掩盖；A错误：投诉只是线索，定根因要能复现并归因到某一次具体变更。B、C、D 是定位三件套。" },
  { q: "微调效果不达预期，值得先查的点有？", o: ["A. 训练是欠拟合还是过拟合，要看验证曲线而不是训练损失", "B. 数据质量与标注一致性，脏数据比少数据更致命", "C. 评测集测的是不是目标分布，指标可能压根测错了地方", "D. 基座本身没有的能力，靠加大微调数据量就能补出来", "E. 把 rank 从 16 提到 64，这类效果问题通常就解决了"], a: [0, 1, 2], e: "D错误：旁路微调是重新组织已有表征，基座没有的底子补不出来，与本库“注入新知识应使用 RAG”的口径一致；E错误：容量不是瓶颈时加大 rank 只带来噪声和过拟合。B、C、A 是排查的先后顺序，也与“数据质量比数量更重要”的说法一致。" },
  { q: "关于 INT8 / INT4 / FP8 这些位宽与用途，正确的有？", o: ["A. 8-bit 约等于每参数 2 字节，4-bit 约等于每参数 1 字节", "B. 位宽越低，权重体积与访存越小，量化误差也越大", "C. INT4 常见于推理侧省显存，不适合当成全参训练的计算精度", "D. FP8 就是 INT8，两者只是叫法不同", "E. BF16 与 FP16 都是 2 字节的半精度，是训练与推理常用的折衷"], a: [1, 2, 4], e: "D错误：FP8 是浮点，带指数位与尾数位，动态范围和舍入行为跟定点整数完全不同；A错误：8 bit 就是 1 字节、4 bit 是半个字节，2 字节对应的是 16-bit。B、C、E 是位宽选型的基本账。" },
  { q: "权重量化、激活量化、KV Cache 量化三者的误差来源，正确的有？", o: ["A. 三者误差完全等价，可以互相替代", "B. 只量化权重一般不用重训，激活量化常需要校准甚至感知训练", "C. 权重分布相对平稳，所以只做权重量化就不会引入任何误差", "D. 激活的数值范围随输入剧烈变化，还带离群值，量化更难", "E. 缓存量化的误差会随着历史 token 变多而摊到更多条目上"], a: [1, 3, 4], e: "C错误：平稳只意味着好量化，误差照样在，只是比激活更容易压住；A错误：三者作用在不同张量上，误差的表现形式和缓解手段都不一样，不能互相顶替。D、E、B 分别对应激活、缓存、校准三块的现实难度。" },
  { q: "关于 per-tensor、per-channel、per-group 的量化粒度，正确的有？", o: ["A. group size 只是打包格式偏好，对精度没有影响", "B. 粒度越细，要存的缩放因子越少，显存反而更省", "C. 缩放因子粒度越细，量化误差越小，但元数据和计算开销越大", "D. per-channel 给每个输出通道单独配缩放，比整张量共用一个更贴合分布", "E. per-group 把权重切成固定大小的块分别量化，是精度与开销的折衷"], a: [2, 3, 4], e: "A错误：group size 决定一块权重共用几个量级，跨度大的块共用一个缩放会被长尾值拖累，精度影响很明显；B错误：粒度越细要存的缩放因子越多，元数据正是变胖的那一侧。C、D、E 说的是这条折衷曲线。" },
  { q: "关于离群值（outlier）通道，正确的有？", o: ["A. 常见对策是让离群通道保留更高精度，做混合精度量化", "B. 首层、末层这类敏感层应该整体量化到最低位宽以省显存", "C. 校准数据的选取会影响结果，应尽量贴近线上输入分布", "D. 离群值只出现在权重里，激活里不会有", "E. 少数通道幅值远大于其余，统一缩放会把大部分值挤到极低的有效位"], a: [0, 2, 4], e: "B错误：实践里恰恰是这些敏感层常保留较高精度或干脆不量化，最低位宽先伤的就是它们；D错误：激活才是离群值的重灾区，这也是激活量化比权重量化更难的原因。E、A、C 是应对离群值与选校准数据的常规做法。" },
  { q: "量化前后要评估“掉了多少点”，正确的做法有？", o: ["A. 拿量化模型去比原版在不同提示词下的分数也可以接受", "B. 分任务、分长度看，代码与长文类任务通常最先掉", "C. 抽一条超长文本测一遍，就足以代表所有任务的量化损失", "D. 同一评测集、同一解码参数、同一模板，只换权重精度这一个变量", "E. 困惑度没变就可以宣布量化无损，不必再看下游任务"], a: [1, 3], e: "E错误：困惑度是被平均化的语言建模指标，对下游任务与长文定位不敏感，不能当无损证明；A错误：换了提示词就等于同时动了两个变量，掉点根本归因不到量化上。D、B 是同口径评测的两条硬要求；C错误：要分任务、分长度看，代码与长文类通常最先掉。" },
  { q: "关于 KV Cache 量化对长文的影响，正确的有？", o: ["A. 需要跨大量历史 token 做定位与检索的任务更容易先掉点", "B. 量化缓存会顺带把模型权重也压小", "C. 缓存位宽越低越好，精度上没有任何代价", "D. 位宽降低后占用仍随上下文长度线性增长，变的只是斜率", "E. 上下文窗口上限不变，变的是每个 token 缓存占的字节数"], a: [0, 3, 4], e: "B错误：KV Cache 量化只动缓存张量，权重体积一点没变，两者是独立的开关；C错误：省下来的是显存与带宽，代价就是历史数值被粗化。D、E 与本库 KV Cache 量化的口径一致，A 说的是误差最先在长距离定位上暴露。" },
  { q: "关于训练后量化（PTQ）与校准集，正确的有？", o: ["A. 位宽相同时，不同量化格式的精度可以认为一致", "B. 常见的权重量化方法靠一小批校准数据统计幅值分布，不做梯度更新", "C. 校准集要贴近线上真实输入分布，选歪了掉点更明显", "D. 量化后的模型必须重新评测，不能沿用原版的结论", "E. 量化后的基座最适合接着做全参微调，因为低比特梯度更稳定"], a: [1, 2, 3], e: "E错误：低比特权重上没法直接更新全部参数，主流做法是在量化基座外挂旁路训练；A错误：同为 4-bit，码本设计、粒度和对离群值的处理各不相同，掉点差距可以很大。B、C、D 是 PTQ 落地时的基本约束。" },
  { q: "端侧部署要选权重量化档位，下列做法错误的是？", o: ["A. 上线前在目标设备上实测显存占用与延迟", "B. 只看模型文件大小选最小的档位，不在业务评测集上逐任务比较", "C. 在同一评测集与同一解码参数下比较各档位的表现", "D. 在目标机型的真实内存与延迟约束下，按业务评测集逐档比较后再选", "E. 对结构化输出、工具调用和长文定位分别做回归"], a: [1], e: "单选。B错误：文件小只说明省了体积，掉点必须按任务量出来，档位不能只凭体积来选；C、E、A 是选型必须跑的三件事。" },
  { q: "关于激活重计算（gradient checkpointing），正确的有？", o: ["A. 重计算会改变梯度的数学结果，训练效果与不开时明显不同", "B. 可以只重算注意力这类选择性策略，与其他省显存手段搭配使用", "C. 前向时只存少量检查点，反向时把激活重新算出来，用算力换显存", "D. 激活显存只由参数量决定，与序列长度无关", "E. 开启后单步时间变长，换来的是能跑更长上下文或更大 batch"], a: [1, 2, 4], e: "D错误：激活是逐 token 产生的，序列长度和 micro batch 一涨它就涨，这正是长序列微调的痛点；A错误：重算出来的是同一批激活，梯度在数学上等价，差别只剩浮点误差。C、E、B 是它的机制、收益与常见搭配。" },
  { q: "关于梯度累积与等效 batch，正确的有？", o: ["A. 累积步数越多，参数更新的次数也越多，收敛自然更快", "B. 把等效 batch 做大时，学习率等超参通常要跟着重调", "C. 累积步数加够，就能把显存峰值降到零", "D. 等效 batch ≈ micro batch × 累积步数 × 数据并行的卡数", "E. 单步显存峰值由 micro batch 决定，不由等效 batch 决定"], a: [1, 3, 4], e: "A错误：同样数据量下，累积是把若干小步的梯度攒成一次更新，步数越多更新次数越少；C错误：峰值仍是那一次 micro batch 的激活与梯度，累积只是省下为更大 batch 扩容的那部分。D、E、B 是它的基本账与副作用。" },
  { q: "7B 模型单卡全参微调，同时保留 BF16 权重（2 字节）、BF16 梯度（2 字节）、FP32 主权重（4 字节）与 Adam 两个 FP32 状态（各 4 字节），合计 16 字节/参数。下列正确的有？", o: ["A. 同样 16 字节/参数只作用在 8.4M 的旁路上时约 0.13GB", "B. 优化器状态只在最后一步才需要，训练过程中可以先不分配", "C. 激活与临时缓冲已经算在这 16 字节/参数里，不必另算", "D. 仅这一项就约 7e9×16B ≈ 112GB，还没算激活", "E. 这解释了为什么单张 24GB 卡跑不动 7B 全参微调"], a: [0, 3, 4], e: "B错误：Adam 的动量与二阶矩每一步都要读写，是常驻显存，不是收尾才创建；C错误：这 16 字节只覆盖权重、梯度与优化器状态，激活要按序列长度另外算。D、E、A 由题面给的字节数直接乘得出。" },
  { q: "关于序列并行（长上下文切分），正确的有？", o: ["A. 它只在推理阶段有意义，训练阶段用不上", "B. 切开后通信与同步点变多，但这部分开销可以忽略", "C. 长上下文训练常把它与激活重计算、高效注意力算子搭配使用", "D. 单条序列长到一张卡放不下其激活时，才需要在序列维度上切开", "E. 它和数据并行解决的不是同一个问题：数据并行切 batch，序列并行切长度"], a: [2, 3, 4], e: "A错误：长序列训练同样扛不住激活显存，序列并行正是训练侧的手段之一；B错误：跨卡搬运激活的通信与同步是它的主要代价，收益必须和它一起算。D、E 是使用条件与定位，C 是常见搭配。" },
  { q: "关于优化器状态卸载与多卡取舍，正确的有？", o: ["A. 它适合卡不够但时间宽裕的训练，不适合追吞吐的场景", "B. 朴素数据并行不做切分时，每张卡都要存完整权重与优化器状态", "C. 把权重按层或按张量切开后，单卡上的参数占用不变，只是执行顺序不同", "D. 卡数越多，微调小模型一定越快，通信开销可以忽略", "E. 把优化器状态卸载到 CPU 能腾出显存，代价是每一步要过 PCIe 搬运"], a: [0, 1, 4], e: "C错误：切开就是要让每张卡只放一部分参数与状态，单卡占用确实下降，不是单纯换个执行顺序；D错误：模型不大时通信占比反而更高，卡加多了可能是负收益。E、A 是卸载的收益与代价，B 是朴素数据并行的现实。" },
  { q: "关于解码时 Logits 到 Token 的流程，正确的有？", o: ["A. Temperature 是在 Softmax 之后再对概率做缩放", "B. 采样只关心当前上下文最后一个位置的那一组 Logits", "C. 词表越大，这一步要算和排序的候选越多", "D. 模型最后一步对词表每个候选输出一个 Logit（未归一化分数）", "E. Logits 经 Softmax 变成概率分布后，才按采样策略选下一个 Token"], a: [1, 2, 3, 4], e: "A错误：Temperature 在 Softmax 之前缩放 Logits，不是对概率做后处理。" },
  { q: "关于 Temperature 与分布熵的关系，正确的有？", o: ["A. Temperature 为 0 时等价于贪心解码", "B. 温度只影响排序，不改变各候选之间的概率比例", "C. 温度调高会扩大模型词表的规模", "D. 温度调低，分布变尖锐，熵下降，Top_p 保留的候选随之变少", "E. 温度调高，分布被拉平，熵上升，长尾词更容易被选中"], a: [0, 3, 4], e: "B错误：温度除的是 Logits 的对数概率，T 变大会改变任意两候选的概率比值；C错误：词表是固定的，温度只改变分布形状。" },
  { q: "某步 Softmax 后（已按概率降序）六个候选的概率依次是 0.40、0.25、0.16、0.10、0.06、0.03。关于截断结果，正确的有？", o: ["A. Top-p=0.95 会保留全部 6 个候选", "B. Top-p 保留几个候选取决于候选个数，与累计概率无关", "C. Top-p=0.95 会保留 5 个候选（累计到 0.97 才够 0.95）", "D. Top-p=0.30 只需保留 1 个候选，因为最高的 0.40 已经超过 0.30", "E. Top-k=3 会保留 3 个候选，与这组概率到底有多陡无关"], a: [2, 3, 4], e: "A错误：加到第 5 个候选累计已达 0.97，超过 0.95 就停止，最后那个 0.03 被切掉；B错误：Top-p 的集合大小由累计概率决定，候选个数只是结果——同样这 6 个候选，p 从 0.95 降到 0.30，集合就从 5 个缩到 1 个。" },
  { q: "温度调高之后，Top_p 的候选集通常会怎样变化？", o: ["A. 想让截断强度不随温度漂移，可以改用固定名额的 Top_k 或相对阈值的 Min_p", "B. 温度调高后 Top_k 的候选名额会自动跟着变多", "C. 分布更平坦，要凑够累计概率 p 就得装进更多候选", "D. 等效于自动放宽了截断，低概率长尾词重新进入候选", "E. 候选集数量不变，只是内部顺序变了"], a: [0, 2, 3], e: "E错误：Top_p 是动态集合，形状一变集合大小就变；这也正是它和固定名额的 Top_k 的本质区别；B错误：Top_k 是固定名额，随分布形状变化的是 Top_p。" },
  { q: "模型对下一步“很有把握”（分布陡峭）与“很不确定”（分布平坦）时，Top_k 与 Top_p 的表现差异包括？", o: ["A. 哪种截断更严取决于当前分布形状，而不是参数名谁更高级", "B. 同一个请求内，不同 step 的截断强度可能不变，因为参数是一次性设定的", "C. 分布陡峭时，Top_k=50 会把几十个近乎为零的长尾词也按名额收进来", "D. 分布陡峭时，Top_p=0.9 可能只留下几个候选", "E. 分布平坦时，Top_p=0.9 需要装进很多候选才凑够 0.9"], a: [0, 2, 3, 4], e: "B错误：Top_p/Min_p 是逐步动态截断，同一个请求里模型一会儿笃定一会儿犹豫，候选集大小跟着分布形状浮动；Top_k 是固定名额、Top_p 是动态累计，两者的实际截断强度都随分布形状变化。" },
  { q: "关于 Top_k 与 Min_p，正确的有？", o: ["A. 温度趋近 0 时，Min_p 与 Top_k 都会把候选收缩到极少数", "B. Top_k 是绝对名额：永远最多留 K 个候选", "C. Min_p 是相对阈值：候选概率必须 ≥ Min_p × 最大概率", "D. 分布陡峭时 Top_k 与 Min_p 的行为完全一致，两者可以互相替代", "E. Min_p 的阈值随最大概率浮动，对分布形状更鲁棒"], a: [0, 1, 2, 4], e: "D错误：陡峭时 Top_k 仍会按名额收进一堆近乎为零的长尾词，Min_p 会把它们切掉，两者行为差别最大的恰恰是分布陡峭的时候；Min_p 是相对概率下限，与正文“对分布形状更鲁棒”的口径一致。" },
  { q: "关于贪心（Greedy）与 Beam Search 的搜索目标，正确的有？", o: ["A. Beam Search 维护 K 条部分序列，目标是找累积对数概率最高的完整序列", "B. 若 A 的概率 0.4 后接只能走低概率尾巴，B 的概率 0.35 后接 0.9 直接结束，则联合概率更高的是走 B 的短序列", "C. Beam Search 找出的序列就是全局最优解，无需再验证", "D. Beam Search 的累积分数天然按长度归一化，长短序列可以直接比较", "E. 贪心每步取局部最大，并不等价于最大化整句的联合概率"], a: [0, 1, 4], e: "C错误：束宽有限，真正最优的路径可能在中途就被剪掉，Beam Search 是启发式搜索不是精确全局最优；D错误：正是因为它不做长度归一化，长序列才会靠项数占便宜，所以需要额外的长度惩罚。" },
  { q: "Beam Search 中与 EOD（结束符）处理相关的问题，正确的有？", o: ["A. 完全禁止 EOD 可以杜绝提前结束，但代价是无法从输出本身判断长度，还可能把后续内容一并吐出来", "B. EOD 概率偏低时，用 max_tokens 或 stop 兜底会比等它自然收尾更常见", "C. 某条 beam 一旦输出 EOD，就应立即终止整个生成并把它作为最终结果返回", "D. 输出 EOD 只是把这条 beam 冻结为完成候选，仍需与仍在扩展的 beam 比较分数", "E. 累积对数概率不做长度归一化，会让更短的路径分数占优，模型容易过早收尾"], a: [0, 1, 3, 4], e: "C错误：EOD 只是把该 beam 冻结成候选，最终结果要在完成候选和未扩展候选之间比分数，立刻返回会丢掉更好的路径；其余四条都是 Beam Search 在长文本生成里被弃用的工程原因。" },
  { q: "关于 Logits、Softmax、Temperature、Top_p 的先后关系，正确的有？", o: ["A. 先做 Softmax 再用温度缩放概率，才是标准流程", "B. Temperature 在 Softmax 之前对 Logits 做缩放", "C. Top_p 的截断作用在归一化之后的概率分布上", "D. Temperature=0 时走贪心路径，会跳过 Top_k/Top_p 截断", "E. Top_p 直接在 Logits 上截断，与 Softmax 无关"], a: [1, 2, 3], e: "A把顺序说反了：温度是除在 Logits 上、发生在 Softmax 之前，否则等价于对概率做幂次变换，与正文“缩放 Logits”的口径不符；E错误：Top_p 作用在归一化之后的概率分布上。" },
  { q: "关于 reasoning_effort 与采样参数的互斥，符合当前正文口径的有？", o: ["A. 传了 reasoning_effort 之后 temperature 依然生效，只是优先级更低", "B. Temperature 与 reasoning_effort 作用在同一阶段，可以互相替代", "C. 部分模型（如 GPT-6 Astra）在推理模式下会直接拒绝 temperature 和 top_p，而不是悄悄忽略", "D. 要恢复采样控制，需要显式传 reasoning_effort 为 none", "E. 有些模型不支持 none，等于这条路根本走不通"], a: [2, 3, 4], e: "A错误：正文口径是“直接拒绝”，是报错而非降级生效；B错误：一个作用在解码选词、一个作用在内部思考预算，阶段不同。" },
  { q: "关于 n>1 与流式（streaming）的组合，正确的有？", o: ["A. 想逐条实时展示每个候选，工程上往往不如“n=1 并发多次请求”好控制", "B. n>1 比手动发 n 次请求更贵，因为前缀要重复计算 n 次", "C. n>1 会强制关闭缓存与流式，两者不能同时出现在请求里", "D. n>1 时同一前缀可复用一次 Prefill、再分别解码多个候选，账单按生成 token 的 n 倍计", "E. n>1 加 stream 时，多个候选的增量会混在同一条流里，客户端要自己分离和缓冲"], a: [0, 3, 4], e: "B说反了：n>1 的优势正是前缀只算一次；C错误：互斥的是 reasoning_effort 与采样参数，n 与 stream 是可以同时出现的，只是客户端处理更麻烦。" },
  { q: "关于 seed 与可复现性的边界，正确的有？", o: ["A. seed 不能消除 GPU 上浮点归约顺序与分块方式带来的非确定性", "B. 并发形态变化导致 batch 形状不同，可能走不同的数值路径", "C. 换一个集群、换个 region 或模型版本升级后，同 seed 仍不保证复现", "D. 模型版本一致时，同一个 seed 在任何并发形态下都能逐 token 复现", "E. 同 seed、同模型版本、同部署形态下，输出才近似可复现"], a: [0, 1, 2, 4], e: "D错误：seed 只锁采样随机数，锁不住 batch 形状与数值路径，必须把部署形态一起固定才谈得上近似复现；E、A、B、C 合起来正是“可复现性 = 锁定随机数 + 固定计算形态”这条口径。" },
  { q: "要让一个问答服务尽可能“同输入同输出”，工程上合理的做法有？", o: ["A. temperature 设为 0 就能消除部署形态带来的差异，不必固定集群", "B. 低温度或贪心，配合固定部署形态，减少随机选词与数值路径的漂移", "C. 结果落缓存：命中缓存直接返回上次答案", "D. 把 prompt 逐字节固定住，就可以不考虑硬件与驱动的差异", "E. 业务侧加幂等或去重键，防止重试造成重复副作用"], a: [1, 2, 4], e: "A错误：seed 只锁随机数，不锁版本与硬件形态，跨版本跨集群不保证一致；D错误：seed 只锁采样，部署形态、版本与数值路径仍会改变结果。" },
  { q: "关于超时与重试的工程陷阱，正确的有？", o: ["A. 流式响应中断后，无条件立刻原参数重试是最稳妥的做法", "B. 超时时请求一定还没开始执行，所以重试永远安全", "C. 客户端超时不代表服务端没执行，重试可能把转账、下单、发消息做两遍", "D. 有副作用的调用必须带幂等键，让服务端能去重", "E. 指数退避加抖动可以缓解服务恢复瞬间的重试风暴"], a: [2, 3, 4], e: "A错误：先确认副作用是否幂等，再做续传或整笔重试；B错误：网络抖动、网关超时都可能发生在服务端已执行之后。" },
  { q: "关于用参数获得确定性输出，正确的有？", o: ["A. 配 seed 可以锁住采样随机数，配合固定部署形态才有可复现性", "B. 调低 top-p 是在收窄候选集，不等于消除随机性", "C. 开启 Min_p 之后，输出就是确定性解码", "D. 把 top_p 设为 1 就等价于贪心解码", "E. 把 temperature 设为 0，走贪心路径，近似去掉采样随机性"], a: [0, 1, 4], e: "C错误：Min_p 是截断阈值，仍然在剩下的候选里随机抽样，与确定性无关；D错误：p=1 等于不作截断的全量采样，确定性要温度归零。" },
  { q: "把 Presence、Frequency、Repetition 三个惩罚同时拉到很高，可能出现？", o: ["A. 惩罚只作用于实义词，不会碰到标点和格式符", "B. 三个惩罚都靠减法实现，叠加效果完全线性可预测", "C. 括号、引号、逗号这类结构 Token 被一起压低，JSON 与代码容易畸形", "D. 为避开高频词硬换生僻说法，可读性下降", "E. 模型被迫不断换新表达，用词发散但可能偏离原意"], a: [2, 3, 4], e: "A错误：惩罚按“是否出现/出现几次”施加，不看词性，格式 Token 一样被压；B错误：Repetition Penalty 是乘法缩放（正 Logit 除以 γ），Presence 与 Frequency 才是减法，三者叠加不是线性叠加。" },
  { q: "关于惩罚参数与 Temperature 的同时调整，正确的有？", o: ["A. 惩罚与温度作用在完全相同的对象上，改一个等于改两个", "B. 温度拉高让分布变平坦、鼓励换词，惩罚拉高压制已出现的词，两者方向可能互相拉扯", "C. 多数场景只调其中一个即可", "D. 三个惩罚可以同时生效，但方向要一致，别互相抵消", "E. 温度与惩罚同时调高，输出更容易复现"], a: [1, 2, 3], e: "E错误：两个都推高只会让分布更难预测，而不是更稳定；A错误：温度缩放全部候选的 Logits，惩罚只作用于已出现过的 Token，作用对象不同。" },
  { q: "关于 no_repeat_ngram_size=3 这类硬约束，正确的有？", o: ["A. 代价是合法表述也会被卡住，句子可能生硬或不自然", "B. 它同时能消除跨请求、跨会话的重复", "C. 把该参数调大反而更容易造成句子断裂", "D. 它禁止任何已在输出里出现过的 3-gram 再次出现", "E. 它是硬性切断循环，而不是仅仅降低概率"], a: [0, 3, 4], e: "B错误：它只看本次已生成的内容，管不到别的请求；C错误：n 越大约束越松（要撞满一个更长的片段才被禁），调小才是把句子越绑越死。" },
  { q: "Beam Search 的长度惩罚与收尾行为，正确的有？", o: ["A. 长度惩罚把分数按长度归一化或打折，让长短序列可以公平比较", "B. 加了长度惩罚就一定能保证输出句子更短", "C. 收尾判分被纠正后，EOD 在与续写候选的比拼中更容易被采纳", "D. 长度惩罚只影响训练阶段，与解码无关", "E. 累积对数概率不做长度归一化，会更偏爱短序列"], a: [0, 2, 4], e: "B错误：它改变的是比较口径，最终选哪条还取决于各序列的概率，不是必然变短；D错误：长度惩罚是解码阶段的评分项（如 GNDEC），与训练无关。" },
  { q: "Temperature 长期设为 0 的链路出现复读，原因与治法正确的有？", o: ["A. 生产口诀是：出现复读机时优先调高 Repetition Penalty", "B. 第一步应该先把 temperature 拉到 1.5 打散", "C. Temperature 为 0 时 Top_k 与 Top_p 仍会正常参与截断", "D. 复读一定是检索链路坏了，与解码参数无关", "E. 贪心每步取 argmax，一旦进入高概率循环就难以跳出"], a: [0, 4], e: "B错误：正文口径是先加重复惩罚，直接拉高温度会同时放大真正需要的长尾低质词，往往更糟；C错误：温度为 0 时走贪心路径，会跳过 Top_k/Top_p 截断；D错误：检索出问题一般表现为答非所问，而不是同一段话反复输出。" },
  { q: "线上发现模型反复输出同一段话，合理的排查顺序包括？", o: ["A. 检查提示词本身是否在暗示重复（示例里塞了长段重复模板）", "B. 第一步就换更大的模型或安排重训", "C. 先把 temperature 调高制造多样性，其余都不用查", "D. 先看采样参数：是否 temperature 过低、top-p 过窄", "E. 再看惩罚项：repetition、presence、frequency 是否都是 0 或过小"], a: [0, 3, 4], e: "B、C 的顺序反了：重训最贵、调温度最容易引入新问题，二者都应放在解码参数与提示词这些低成本检查项之后。" },
  { q: "关于推理模型的“思考 Token”，正确的有？", o: ["A. 思考 Token 按输入 Token 计价，因为它来自模型内部", "B. 思考 Token 是服务端内部产生的，不该算进用户账单", "C. 思考 Token 通常计入输出 Token，一并计费", "D. 思考阶段也会拉长整段请求的总延迟", "E. 用户端看不到推理草稿，说明模型并没有真的逐 Token 生成它"], a: [2, 3], e: "B、A 的计费方向都错：它是模型生成出来的，按输出计费；E错误：看不到不等于没生成，正文说的“隐藏”指默认不把草稿展示出来，推理仍然是一步一步逐 Token 算出来的。" },
  { q: "关于 reasoning_effort 档位与“过度思考”，正确的有？", o: ["A. 日常通用场景用 medium 通常比 xhigh 更稳", "B. 延迟敏感的链路应该把档位拉满以保证质量", "C. 简单任务上过度思考可能表现为绕圈、反复自我否定，得分不一定更好", "D. 档位与任务难度无关，一律用最高档最省心", "E. 档位越高，思考 Token 越多，延迟与成本随之上升"], a: [0, 2, 4], e: "B、D 与正文口诀相反：延迟敏感→low，极难审计才用 xhigh；正文口径里高档位的边际收益可能为负，不是无条件更好。" },
  { q: "关于思考预算（effort 档位或思考 Token 上限）的理解，正确的有？", o: ["A. 给思考预算设上限，作用是控制最坏情况下的延迟与成本", "B. 简单题上把预算拉满，更可能只是想了更久而非答得更好", "C. 把档位调高，思考长度就会单调增加", "D. 思考预算和最大输出长度是同一回事，改一个就够", "E. 设了高档位不等于一定产生大量思考 Token，档位更像天花板而非地板"], a: [0, 1, 4], e: "C错误：达到天花板不代表必须用满，模型可能提前收敛；D错误：一个管内部推理阶段、一个管最终返回的输出长度，是两层上限。" },
  { q: "关于 CoT 与 CoD，正确的有？", o: ["A. CoT 的输出更短、更省钱", "B. CoT 把推理过程一步步写出来，出错能定位到具体步骤", "C. CoD 只留每一步的极简草稿，砍掉解释性内容", "D. CoD 大幅降低 Token 消耗与延迟，精度与 CoT 相近", "E. CoD 是 CoT 的训练前置阶段，模型要先学会 CoD 再学会 CoT"], a: [1, 2, 3], e: "E说反了：正文口径是模型先学会“写全”再学会“压缩”，完整 CoT 轨迹才是 RLVR 能分配奖励的前提；A错误：CoT 的问题正是输出长、延迟高、费用贵，省的是 CoD。" },
  { q: "关于 Logit_bias（对指定 Token 施加偏置），正确的有？", o: ["A. 给一个足够大的负值，实际就近似于禁止该 Token 出现", "B. 它会自动判断哪些 Token 该压，不需要事先指定", "C. 它是对指定 Token 的 Logits 做加法偏移，正值提高、负值压低", "D. 偏移发生在 Softmax 之前，等于人为改写这一步的候选分布", "E. 用它就能把违禁词永久排除，效果等同于安全过滤"], a: [0, 2, 3], e: "E错误：Logit_bias 只是加减分数、改变概率，不是硬拦截，负值给得不够大时违禁词仍可能冒出来，安全侧必须另有过滤；B错误：它要求显式指定被偏移的 Token，不会自己识别该压谁，这与惩罚参数按“是否出现/出现几次”自动施加的机制不同。" },
  { q: "关于推理轨迹的留痕与审计，正确的有？", o: ["A. CoD 的草稿比 CoT 更适合当审计底稿", "B. 需要复核、错了代价大的环节（如核对研报里某个营收占比结论），要能列出“找哪张表、取哪个数、怎么算”", "C. 完整轨迹便于人工复核，也便于回流成训练数据", "D. 是否把推理内容返回给用户取决于 API 形态：有的不返回、有的用单独字段返回、有的只给摘要", "E. 合规场景一律禁止保留推理轨迹"], a: [1, 2, 3], e: "E错误：正文把“极难审计”列为用最高档思考预算的场景，审计要的是留痕而不是销毁；A错误：CoD 只留关键中间结论，中间依据缺失，恰恰当不了底稿。" },
  { q: "下列场景与 CoT/CoD 的匹配，符合正文口径的有？", o: ["A. 医疗辅助诊断 → CoD（医生只看结论）", "B. 法律合同逐条比对 → CoT（中间推理就是工作底稿）", "C. 金融研报审核要逐步可复核 → CoT", "D. 客服工单批量分类 → CoD（量大、只要结论）", "E. 实时风控毫秒级判断 → CoT（先把千字推理写完再决定）"], a: [1, 2, 3], e: "E错误：实时风控要毫秒级出放行或拦截判断，不能等模型写完千字推理，正文把它列为 CoD 场景；A错误：鉴别诊断的每步依据都要留痕，只给结论医生无法采信，属于 CoT 场景。" },
  { q: "在同一批任务上给 CoT 与 CoD 做选型，主要该看什么？", o: ["A. 选型只看模型的上下文窗口有多大", "B. 出错的代价高不高", "C. 延迟与吞吐要求", "D. 模型的参数量大小", "E. 结论是否需要被人逐步复核"], a: [1, 2, 4], e: "D错误：正文的选型判断式只看两件事——要不要可回溯复核、是不是量大且延迟敏感，参数量既不决定轨迹写法，也不决定审计要求；A错误：要看结论是否需要逐步复核、出错代价与延迟要求。" },
  { q: "max_tokens 设得太小导致输出被拦腰截断，典型后果包括？", o: ["A. 代码块缺了闭合符号，diff 无法应用、编译不过", "B. 服务端会自动补齐未闭合的结构", "C. 正文停在半句，抽取字段时拿到残值", "D. 必须由下游自己检测截断并做降级处理", "E. JSON 少了收尾括号，下游解析直接报错"], a: [0, 2, 3, 4], e: "B错误：服务端只负责在预算用完时停下，不负责补全结构，补全属于下游或重试逻辑。" },
  { q: "针对输出可能被截断，下游合理的处理包括？", o: ["A. 对 JSON 做闭合校验，不通过就重问或走降级分支", "B. 判定被截断后重新发起请求，并给这一次留更宽的输出预算", "C. HTTP 状态 200 就说明内容完整", "D. 忽略结束原因，由前端把残缺的括号补全再交给下游", "E. 检查返回的结束原因是否为 max_tokens，而不是只看有没有报错"], a: [0, 1, 4], e: "C错误：200 只说明请求成功，内容仍可能因预算耗尽停在半句；D错误：前端硬补括号会造出一条模型从未生成过的“合法 JSON”，把截断伪装成正常结果，应当显式重试或降级。" },
  { q: "关于 stop（停止序列），正确的有？", o: ["A. 如果下游要靠结束标记来判定消息写完，就不要把该标记列进 stop", "B. 命中 stop 后不再继续生成，匹配串本身通常不会出现在返回内容里", "C. 它能控制“在哪里收尾”，但不能用来纠正已经生成出来的错误内容", "D. stop 会同时截断思考预算，两者是同一个开关", "E. 把 stop 设成模型可能自然输出的任意词，不会影响输出完整性"], a: [0, 1, 2], e: "D错误：stop 管输出侧的终止条件，思考预算管内部推理阶段，是两层上限；E错误：stop 命中即截断，选得太随意会把正文拦腰切掉。" },
  { q: "把模板的结束标记列进 stop，对工具调用（Function Calling）解析的影响，正确的有？", o: ["A. stop 只在纯文本输出里生效，对结构化调用字段没有影响", "B. 客户端要自己定义“消息完整”的条件，不能只靠流式的结束事件", "C. 温度设为 0 时，被截断的参数会被解析器自动补全", "D. 该标记是解析器判定“调用意图结束”的分界，被 stop 吃掉后缓冲区收不到分界信号", "E. 参数 JSON 会被拦腰截断，解析器只能拿到残串"], a: [1, 3, 4], e: "A错误：stop 作用于生成流本身，不区分输出的是散文还是调用片段；C错误：贪心只保证选词确定，不会替你补齐一段没被生成出来的闭合结构。" },
  { q: "关于约束解码与 JSON mode / Schema，正确的有？", o: ["A. 字段类型、必填项、枚举值可以靠 Schema 约束住", "B. 它能保证内容事实正确", "C. Schema 校验通过，就说明输出的值来自检索到的资料", "D. 格式与内容的正确性要分开保障，内容侧仍需检索与校验", "E. 它每步只在合法 Token 中采样，格式错误率大幅下降"], a: [0, 3, 4], e: "B错误：约束解码治格式、治不了内容，这是结构化输出最常见的误解；C错误：Schema 只检查类型、必填与枚举，值是不是编出来的它管不着；E、A、D 与正文“结构化只约束格式，内容正确性靠检索与校验”的口径一致。" },
  { q: "大批量子任务并发调用 API 时，合理的做法包括？", o: ["A. 区分可重试错误与不可重试错误：4xx 的参数或内容策略问题不该盲目重试", "B. 遇到 429 就立刻按原并发量重发，直到成功为止", "C. 无限重试会把瞬时限流拖成雪崩，也掩盖了真正的参数错误", "D. 命中限流（429）时按 Retry-After 或指数退避加抖动重试", "E. 用信号量限制在途请求数，而不是无限开协程"], a: [0, 2, 3, 4], e: "B错误：不降速、不加抖动的原样重发会持续压在同一个限流窗口上，是典型的自我 DDoS；D、E、A、C 是吞吐型任务的标准姿势。" },
  { q: "关于上下文缓存（Prompt Caching）的命中条件与收益，正确的有？", o: ["A. 语义相近的请求也能复用同一份前缀缓存", "B. 命中率取决于请求前缀的重叠程度，不是开关一开就全量生效", "C. 前缀必须逐字节完全匹配才能命中，同一段 System Prompt 换个标点就会失效", "D. 命中可降低首字延迟与调用成本", "E. 把长 System Prompt 固定在最前面、可变内容放在后面，命中率最高"], a: [1, 2, 3, 4], e: "A错误：正文口径是前缀必须完全匹配，语义相似不算命中；其余四条与“任何请求都能 100% 命中”的误解相对。" },
  { q: "按正文口径，缓存命中与数值层面的输出差异，说法正确的有？", o: ["A. 排查“同样输入结果不同”时，应该去看部署与计算形态，而不是先怀疑缓存偷偷改了模型", "B. 缓存命中会改写模型权重，让输出偏向新请求", "C. 缓存命中会改变词表，从而改变采样结果", "D. 缓存复用注意力中间结果时，数学结果等价，命中与否不会改写概率分布", "E. 实际服务里严格逐 Token 复现仍然很难，非确定性主要来自浮点归约顺序与 batch 形态"], a: [0, 3, 4], e: "B、C错误：缓存只是复用已算好的注意力中间结果，既不动权重也不动词表；这与正文“缓存只复用中间结果、概率分布不变”以及“输出数学上不变”的口径一致。" },
  { q: "某评测脚本发现“同 prompt 同 seed 两次结果不同”，合理的解释有？", o: ["A. seed 相同却出现差异，说明实现一定有 Bug", "B. temperature 设成 0 之后，两次输出不会出现任何差别", "C. 温度没设到 0，采样随机源仍在起作用", "D. 两次请求落到不同集群或不同 batch 形态，数值路径不同", "E. 提示词里拼进了时间戳、请求 ID 等可变内容，输入其实并不相同"], a: [2, 3, 4], e: "A错误：跨部署、跨版本的数值差异不是 Bug，seed 管不到；B错误：贪心去掉了选词的随机性，但去不掉浮点与 batch 形态带来的数值抖动。" },
  { q: "关于部署形态（并发数、batch 形状）对结果的影响，正确的有？", o: ["A. Continuous Batching 让请求随时进出批次，本身就是可变并发形态的来源之一", "B. 同一请求在不同并发形态下可能走不同的浮点归约与分块路径", "C. 严格回归测试要把部署形态一并固定下来", "D. 命中与否会改变概率分布，所以结果变化主要来自缓存", "E. 服务升级、算子实现变更，都可能让原本可复现的用例出现漂移"], a: [0, 1, 2, 4], e: "D错误：按正文口径缓存复用中间结果、数学上等价，不改变概率分布；真正需要盯的是浮点归约顺序与批次形状这类数值路径差异。" },
  { q: "关于 n-gram 硬禁止与三类惩罚的取舍，正确的有？", o: ["A. 两者可以组合：惩罚先降概率，硬约束再封掉反复出现的片段", "B. 惩罚是概率上的软约束，仍然可能重复；n-gram 禁止是硬约束，被禁的组合不再出现", "C. 硬约束更可靠，副作用是会切断合法表述，句子可能生硬", "D. 惩罚参数需要逐个调值，硬约束的参数更少、更容易解释", "E. n-gram 禁止会放大长尾低质词的概率，导致输出更乱"], a: [0, 1, 2, 3], e: "E说反了：被禁止的是已经出现过的片段，而不是低概率长尾词被抬上来；被禁的 Token 是从候选中移除，与调高温度把长尾捞进来是两回事。" },
  { q: "关于约束解码的副作用，正确的有？", o: ["A. Schema 太复杂时，合法路径的组合空间变大，推理负担上升", "B. 加了约束，内容质量一定比不加约束更好", "C. 约束改变的是可选 Token 的集合，不改变模型对事实的掌握", "D. 该填数字的位置只剩少数合法 Token，模型可能硬编一个看起来合规的值", "E. 在合法候选很少的位置上，容易写出语法正确但内容空洞的模板句"], a: [0, 2, 3, 4], e: "B错误：约束只保证格式合法，不能保证内容更好，甚至在强约束下更容易产出空洞套话。" },
  { q: "关于流式输出与“思考”阶段的体验，正确的有？", o: ["A. 首字延迟主要由 Prefill 决定，但长思考会拉长整体等待", "B. 开启 stream 就能降低模型的实际计算量", "C. 客户端超时设置要考虑思考时长，否则会在模型快出答案前掐断连接", "D. 推理模型可能在思考阶段迟迟不吐正文，用户会以为请求卡住", "E. 需要进度提示时，要么返回推理摘要，要么用占位状态，而不是干等"], a: [0, 2, 3, 4], e: "B错误：流式只是分块返回，不减少任何计算，反而可能因为要维持连接而多占资源。" },
  { q: "把任务路由到指令模型或推理模型（配合 effort 档位），合理的做法有？", o: ["A. 数学证明、复杂代码这类需要严密推演的任务走推理模型", "B. 工单批量分类这类量大、只问结论的任务，用推理模型拉满思考预算最划算", "C. 用 low 或 medium 档控制推理成本，把 xhigh 留给极难审计类任务", "D. 先按任务难度分级，再决定是否值得付出思考 Token 的成本", "E. 日常对话、翻译、写文案走指令模型更快更省"], a: [0, 2, 3, 4], e: "B错误：正文口径是推理模型贵且慢、不适合日常客服问答，批量分类该走快思考和草稿式写法（CoD），而不是把思考预算拉满。" },
  { q: "关于“Temperature 调高就更聪明、更有创造力”，正确的有？", o: ["A. 温度调低会提升模型的知识覆盖面", "B. 温度过高会把长尾低质量候选的概率抬上来", "C. 事实类问答把温度调高，不会提升事实正确率，只会提升跑偏概率", "D. 温度越高，模型的能力上限就越高", "E. 温度只改变分布形状，不改变模型学到的知识"], a: [1, 2, 4], e: "D错误：能力上限由模型与训练决定，温度只是在已有分布上做取舍；想要更靠谱的事实输出该靠检索与校验，不是加温度；A错误：温度不改知识，只改分布形状与采样。" },
  { q: "对外报告模型评测结果时，为什么要固定并公开采样参数？", o: ["A. 报告里应写明档位、温度、max_tokens 等配置", "B. 固定参数加固定部署形态，别人才能复现你的结论", "C. 同模型同版本跑出来的分数天然可比，采样配置可以不写", "D. 同一模型同一提示词，换个温度就可能从及格线上下翻盘", "E. Temperature、top-p、Min_p 会显著改变输出分布，参数不同的分数不可直接比较"], a: [0, 1, 3, 4], e: "C错误：正文的实测口径就是“同模型不同配置结果差很多”，采样配置是评测的一部分，不写等于不给对照组。" },
  { q: "关于 Self-Attention 里 Q、K、V 三个投影矩阵的本质，正确的有？", o: ["A. V 只是把输入映到另一个线性空间，本身不参与相关性打分", "B. 这三个矩阵的参数量随序列长度 n 增长", "C. 三者都是普通线性层（矩阵乘法），内部不含非线性激活", "D. 典型实现里 W_Q、W_K、W_V 各约 d_model×d_model，可以合并成一次大矩阵乘", "E. Q、K、V 必须共用同一个矩阵，只是换了三个名字"], a: [0, 2, 3], e: "E错误：Q/K/V 是三组独立权重，正是独立才让模型能分别学「怎么问」和「怎么答」；B错误：投影矩阵只由 hidden 维度决定，与 n 无关，随 n 增长的是注意力分数矩阵和计算量。C、D、A 成立：打分只用 Q·K，V 负责被搬运的内容，三者形状相同所以工程上常合并成一次 QKV GEMM 再切分。" },
  { q: "序列长度 n=1024、头数 h=16、每头维度 d_k=64，不计 batch，下列算式成立的是？", o: ["A. 序列长度翻倍时，分数矩阵的元素数只翻一倍", "B. 单头注意力分数矩阵是 1024×1024，约 1.0×10^6 个分数", "C. 单头 QK^T 的乘加次数约 1024×1024×64 ≈ 6.7×10^7", "D. h 个头的分数矩阵合计约 16×1024×1024 ≈ 1.7×10^7 个元素", "E. 分数矩阵是 1024×64，只有 6.5×10^4 个元素"], a: [1, 2, 3], e: "E错误：QK^T 是 (n×d_k) 乘 (d_k×n)，结果是 n×n，不是 n×d_k；A错误：元素数是 n²，n 翻倍则元素数变成四倍。B、C、D 自查：1024²≈1.05×10^6，单头点积约 1.05×10^6×64≈6.7×10^7，16 头合计约 1.7×10^7。" },
  { q: "长序列下注意力的平方开销最难扛，关于稀疏/局部（滑窗）注意力的取舍，正确的有？", o: ["A. 用了窗口注意力，模型能看到的最大上下文就被钉死在 w", "B. 每个 token 只看窗口内 w 个邻居，计算量从约 n² 降到约 n·w", "C. 相距超过 w 的两个 token 无法直接交互，只能靠逐层间接传递信息", "D. 窗口切掉了真正需要的长程依赖时精度会掉，不是纯免费加速", "E. 序列足够长时，局部注意力与全局注意力的表达能力等价"], a: [1, 2, 3], e: "E错误：跨窗口的远距离依赖只能多层间接传递，路径变长、信号变弱，并不等价；A错误：多层堆叠后有效感受野可以远大于单个 w，只是间接。B、C、D 是同一条取舍：省算力换的是「直接连接」，窗口大小本身也是影响精度的超参。" },
  { q: "hidden 维度 d_model=4096、多头数 h=32，关于多头切分与参数换算，正确的有？", o: ["A. 各头输出拼接后仍是 4096 维，再过一次 4096×4096 的输出投影融合", "B. 在 d_model 固定的前提下增加头数，会等比例增加注意力投影的总参数量", "C. 头数越多，单个头能表达的关系就越丰富", "D. 每头维度 d_k = 4096 / 32 = 128", "E. 若每头都跑满 4096 维再各自配一套投影，QKV 投影参数量会是现在的 32 倍"], a: [0, 3, 4], e: "B错误：头数增加时每头维度按比例缩小，Q/K/V 投影总参数仍是约 3×d_model²，变的是切分方式不是总量；C错误：头越多每头分到的维度越小，单头容量受限，多的是并行的角度而不是单头的表达力。D、E、A 成立：4096/32=128，拼接回 d_model 是多头不改变残差流宽度的前提。" },
  { q: "多头注意力末尾那个把拼接结果映回 d_model 的输出投影 W_O，正确的有？", o: ["A. 它给注意力子层补上了必需的非线性，缺了它整层就退化成线性变换", "B. 它让各头的子空间结果得以混合，否则各头信息互不相通", "C. 它是带可学习权重的线性层，参数量约 d_model²", "D. 没有它，多头就只是 h 份并列输出，无法当成同一个向量送进残差流", "E. 它和 softmax 作用相同，都是把数值归一化成概率"], a: [1, 2, 3], e: "E错误：W_O 不做任何归一化，归一化是 softmax 与 Norm 层的职责；A错误：W_O 是纯线性层，注意力子层的非线性主要来自 softmax 那一步，去掉 W_O 并不会让整层变成线性。B、C、D 成立：各头并行算完之后必须混合，才叫多头。" },
  { q: "softmax 让每个 query 对所有 key 的注意力权重之和为 1，这个性质带来的后果有？", o: ["A. 序列很长且分布接近均匀时，每个 token 分到的权重被摊薄到约 1/n", "B. 因为权重和为 1，把所有 V 整体缩放不影响注意力输出", "C. 权重和为 1 意味着每个头每步只能真正关注一个 token", "D. 注意力输出是各个 V 的凸组合，数值量级不会因 n 变大而失控", "E. 权重之间是竞争关系：给某个 key 多了，别的必然被压低"], a: [0, 3, 4], e: "B错误：凸组合保证的是不会超出 max|V| 这类边界，把 V 整体乘 2，输出照样乘 2，缩放并不免疫；C错误：和为 1 只约束总权重，分布可以是 0.6/0.3/0.1 的软混合。D、E、A 成立：这正是「注意力稀释」的数学来源，长上下文里关键 token 得靠显著性抢回权重。" },
  { q: "关于绝对位置编码与相对位置编码，正确的有？", o: ["A. 可学习的绝对位置编码天然能处理任意超过训练长度的序列", "B. 加上位置向量后，词向量原本的语义就被覆盖掉了", "C. 绝对方案给每个位置一个固定或可学的向量，与词向量相加后进入第一层", "D. 正余弦绝对位置编码由公式直接生成，不需要学习", "E. 相对类方案直接建模两个 token 差多远，对整体平移更鲁棒，超出训练长度时表现通常更好"], a: [2, 3, 4], e: "A错误：学来的位置表长度固定为最大训练长度，超出就没有对应行，只能截断或换手段；B错误：是相加融合，语义仍在同一个向量里，只是叠了一层位置色彩。C、D、E 是这条分界线：查表式的绝对编码卡在长度，相对类卡在「必须改注意力算式」。" },
  { q: "RoPE 让 q·k 的内积只与两个 token 的相对距离有关，其机制正确的有？", o: ["A. 各分片用不同 θ：低频分量转得慢负责长程，高频转得快负责近程", "B. RoPE 需要为每个位置学习一张位置向量表", "C. RoPE 只旋转 Q 和 K，不直接改动 V", "D. 它把位置 m 表示成对 q、k 的每二维分片旋转角度 mθ", "E. 两个旋转角相减后，内积里只剩下 m−n 这一项位置信息"], a: [0, 2, 3, 4], e: "B错误：RoPE 用固定旋转角公式，不引入可学的位置参数表，位置信息不额外占参数。D、E、A、C 成立：旋转的相对性让内积只依赖距离；V 不被旋转，位置只影响打分，不改动被搬运的内容本身。" },
  { q: "要把短上下文训好的 RoPE 模型扩展到更长输入，关于位置插值与基频调整这类手段，正确的有？", o: ["A. 这类手段改的是「位置到旋转角」的映射，通常仍要少量长文本继续训练才把新长度用好", "B. 做完位置插值后，模型区分相邻两个 token 的能力会提升", "C. 位置插值把新位置按比例压回训练时见过的坐标范围，等价于牺牲分辨率换长度", "D. 拉长低频分量的波长、调整基频 θ，能让长程旋转角不越过训练时见过的范围", "E. 高频保持、低频插值的分段做法，对短程能力的伤害比一刀切插值小"], a: [0, 2, 3, 4], e: "B错误：压缩坐标就是把原本 m 与 m+1 的间隔变小，短程区分度反而下降，所以才常只压低频、保留高频。C、D、E、A 是这一路子方法的共同骨架：不动结构、只改坐标映射，再补一点继续训练让模型习惯新分布。" },
  { q: "关于 ALiBi 这类「给注意力分数加距离偏置」的做法，正确的有？", o: ["A. 加上距离偏置后，模型就再也看不到远距离 token 了", "B. 它在 softmax 之前减去与距离成正比的惩罚，越远越不容易被注意", "C. 不同头用不同斜率，形成从近视到远视的头间分工", "D. 它不新增可学参数，也不依赖训练时见过的旋转角范围，长度外推通常更平稳", "E. 它与 RoPE 互斥，工程上不能叠加使用"], a: [1, 2, 3], e: "E错误：距离偏置只是一个加性项，常与旋转式编码叠加，不是二选一的互斥关系；A错误：偏置是软惩罚，远距离 token 只要内容相关性够高仍能压过衰减拿到高权重。B、C、D 成立：代价是它把「越近越重要」写成先验，对需要远距离引用的任务反而是负担。" },
  { q: "关于位置编码与上下文窗口上限的关系，正确的有？", o: ["A. RoPE 要为位置单独开一批额外维度，hidden 维度必须因此放大", "B. 用固定长度的可学位置表时，表的长度就是硬上限，超出就没有对应向量", "C. 旋转式或距离偏置式不查表，把窗口做长更多是算力与显存预算问题，而非编码方式本身卡死", "D. 推理到远大于训练长度的位置时，那些位置从未被训练过，注意力分数分布容易失真", "E. 窗口拉长只增大 KV Cache，注意力本身的计算量不变"], a: [1, 2, 3], e: "E错误：序列从 n 到 2n，分数矩阵元素数变成四倍，计算量同样平方增长，不只是缓存变大；A错误：RoPE 是对 Q、K 已有的维度两两分片做旋转，不新开维度也不加参数。B、C、D 成立：所以长上下文工作大多落在「换编码 + 补训练 + 扛住显存」三件事上。" },
  { q: "把句子里的词打乱顺序，Transformer 仍有部分理解能力但会退化。正确的有？", o: ["A. 词序全靠位置编码补，位置信号被插值压缩或变弱时，乱序的伤害更明显", "B. 内容匹配仍能建立词与词的联系，但「谁追谁」依赖顺序", "C. Decoder-Only 的因果掩码只认位置索引，不认语义顺序，乱序后每个位置照旧只看左边", "D. 打乱顺序会改变 token 数，从而改变注意力矩阵的形状", "E. 注意力本身是置换等变的：不给位置信息，词序对它完全不可见"], a: [0, 1, 2, 4], e: "D错误：乱序是同一批 token 换排列，n 不变，分数矩阵仍是 n×n。E、A、B、C 是同一条线：正因为注意力对顺序天生无感，位置编码才成了唯一抓手；而掩码只看索引，模型不会自动察觉「这句被搅乱了」。" },
  { q: "关于 LayerNorm 与 BatchNorm 的差别，正确的有？", o: ["A. BatchNorm 在变长序列上很难用：不同样本的同一位置并不同质，推理时 batch 还可能只有 1", "B. LayerNorm 的均值方差必须在整个 batch 上累加才准确", "C. 两者都有可学参数，因此完全等价、可以随意互换", "D. LayerNorm 沿特征维度归一化，逐 token 独立，样本之间互不影响", "E. BatchNorm 沿 batch 维度统计，同一个特征跨样本求均值方差"], a: [0, 3, 4], e: "B错误：LayerNorm 的统计量是对当前样本现算的，与 batch 无关，这正是它适应变长序列和 batch=1 推理的原因；C错误：都有仿射参数，但归一化轴不同导致行为差别很大，语言模型几乎一律用 LayerNorm/RMSNorm 系。D、E、A 成立：BatchNorm 还要额外维护跨 batch 的滑动统计量，推理时用的是那套统计量而不是现算。" },
  { q: "RMSNorm 相对 LayerNorm 省掉了什么，为什么敢省？", o: ["A. 经验上语言模型里中心化带来的收益很小，只保留长度归一就够稳", "B. RMSNorm 连可学的缩放参数也一起去掉，完全无可训练权重", "C. 因为 RMSNorm 不带 batch 维统计，它把归一化轴换成了 batch", "D. 省去了减均值的中心化步骤，只按均方根长度缩放", "E. 少算一次均值和对应的减法，算子更省访存与时间"], a: [0, 3, 4], e: "B错误：RMSNorm 仍保留逐特征的乘性缩放参数（通常不再带偏置），不是零参数；C错误：两者都沿特征维归一化，RMSNorm 改的是公式项，没有改归一化轴。D、E、A 成立：省下的那一步在解码这种访存受限的场景里特别值，因为它直接少一次全维归约和一次读写。" },
  { q: "把同一个几十层模型分别按 Pre-Norm（x = x + f(Norm(x))）与 Post-Norm（x = Norm(x + f(x))）实现，关于梯度与信息路径，正确的有？", o: ["A. Pre-Norm 层数很深时各层贡献被摊薄、残差流范数随层数增长，末端通常还要一次 final Norm 再进输出层", "B. 用了 Pre-Norm 就不需要学习率 warmup 和梯度裁剪了", "C. Post-Norm 根本训不出来，工程上已被彻底淘汰", "D. Pre-Norm 的主干是一条纯加法链路，梯度能沿恒等路径几乎无衰减回到浅层", "E. Post-Norm 每层输出都要过一次归一化，梯度往回传时被逐层缩放，深了容易训不动"], a: [0, 3, 4], e: "B错误：Pre-Norm 只是让深训更容易，warmup、梯度裁剪、学习率调度照常用；C错误：原始 Transformer 就是 Post-Norm，靠精细调参完全能训，只是规模一大就难伺候。D、E、A 是两者行为差别的机制解释，也说明为什么 Pre-Norm 更需要末端那一次归一化来收住累加出来的大范数。" },
  { q: "把 Transformer 看成一串「残差流」：一个 d_model 宽的向量在层间传递，每层往上写增量。这个视角正确的有？", o: ["A. 各层写入的增量彼此正交互不干扰，所以层的顺序可以任意打乱", "B. 每层做的是 x ← x + Δ，写的是对当前表示的一次修改，不是整体重写", "C. 注意力子层的增量表达「从别的 token 搬来的信息」，FFN 子层的增量表达「对本位置自身的加工结果」", "D. 因为是累加，某一层写偏了不会把前面的成果清零，结构上有一定冗余容错", "E. 残差流的宽度必须逐层翻倍，否则信息装不下"], a: [1, 2, 3], e: "E错误：残差流全程等宽（这正是残差能相加的前提），要变宽只能靠 FFN 内部升维再降维；A错误：各层增量在同一个向量上叠加、会互相干扰，层序是训练出来的因果顺序，打乱就废。B、C、D 成立：这个视角也是「哪一层负责什么」这类可解释性分析的基本坐标。" },
