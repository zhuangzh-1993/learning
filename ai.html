  { q: "关于注意力子层与 FFN 子层各自在残差流上写什么，正确的有？", o: ["A. 注意力子层的计算量与序列长度无关", "B. 注意力是唯一的 token 间信息交换通道，FFN 对每个位置独立作用", "C. FFN 对同一位置的 d_model 向量做一次升维再降维的非线性映射", "D. 把 FFN 换成恒等映射，模型只剩词间搬运，表达力大幅下降", "E. 去掉因果掩码后，FFN 子层仍然会造成前后信息泄漏"], a: [1, 2, 3], e: "E错误：FFN 逐位置独立、不跨 token 读写，泄漏只可能来自没有掩码的注意力；A错误：注意力分数矩阵是 n×n，序列越长这一项越吃算力。B、C、D 成立：「开会交换 + 各自消化」两件事缺一不可，一个负责通信，一个负责计算。" },
  { q: "关于 Transformer 里归一化出现的位置，正确的有？", o: ["A. 归一化层的均值与方差是从权重里读出的常量，与输入无关", "B. Pre-Norm 把归一化放在主干上，恒等路径因此被破坏", "C. 一个 Block 通常有两次归一化：注意力子层前一次、FFN 子层前一次", "D. 最后一层输出送进输出投影之前，往往还要再归一化一次，让 logits 尺度稳定", "E. 归一化层可学的缩放参数能在归一化之后把被压掉的量级重新放大"], a: [2, 3, 4], e: "A错误：均值方差是对当前输入现算的，只有缩放/平移参数可学；B错误：Pre-Norm 的归一化在旁路 f(·) 里，主干的 x 原封不动加回去，恒等路径完整，这正是它梯度好传的原因。C、D、E 成立：末端那次 Norm 常被忽略，但没有它，深层一路累加出来的大范数会把 logits 顶到分布外。" },
  { q: "d_model=4096、FFN 中间维 d_ff=11008 的 SwiGLU 型 FFN，关于结构与参数换算，正确的有？", o: ["A. 与两矩阵版 FFN 比，门控多出第三个矩阵，所以同样参数预算下中间维要缩到约 2/3", "B. 门那一路过 Swish 类激活后与另一路逐元素相乘，让网络自己决定放行哪些特征", "C. FFN 的参数量随序列长度 n 线性增长", "D. 上投影、门控、下投影三个矩阵合计约 3×d_model×d_ff", "E. 按 4096×11008≈4.5×10^7 估算，单层 FFN 约 1.35×10^8 参数"], a: [0, 1, 3, 4], e: "C错误：FFN 是逐位置的矩阵乘法，参数只由 d_model 与 d_ff 决定，n 变大变的是计算量和激活显存。D、E、A、B 成立：3×4096×11008≈1.35×10^8 是按题干维度的量级估算、不是某型号真值；d_ff≈8/3×d_model 正是为了对齐两矩阵版的预算。" },
  { q: "为什么说 FFN 通常吃掉 Transformer 大部分参数（常见约三分之二量级）？", o: ["A. d_ff 常取 d_model 的约四倍，一层 FFN 就约 8×d_model²，压得过约 4×d_model² 的注意力", "B. MoE 把 FFN 复制成多份专家后，这部分参数占比还会进一步抬高", "C. 注意力参数少，是因为它没有可学习权重", "D. FFN 参数量与层数无关，只由 hidden 维度决定", "E. FFN 有两到三个 d_model×d_ff 的大矩阵，注意力只有四个 d_model×d_model 级投影"], a: [0, 1, 4], e: "C错误：注意力有四组可学的 Q/K/V/O 投影，只是每个只有 d_model² 量级；D错误：每层都有一份 FFN，总参数当然随层数线性增长，「每层」才只由维度决定。E、A、B 就是那个「三分之二」的算术来源：8 比 4，不是玄学经验。" },
  { q: "关于 SwiGLU 与 ReLU/GELU 的关系，正确的有？", o: ["A. 把门那一路恒置为 1，门控结构就退化回普通单路 FFN", "B. SiLU 在负半轴有小幅下凹，不像 ReLU 那样把负值一刀切成零", "C. SwiGLU 是一种新的注意力打分方式，作用在 Q 和 K 之间", "D. GLU 家族的形式是一路过激活当门、另一路当值，逐元素相乘，SwiGLU 把门那路换成 SiLU", "E. 相比 ReLU 版 FFN，门控多出一个权重矩阵，所以中间维要按比例缩小才不超预算"], a: [0, 1, 3, 4], e: "C错误：SwiGLU 是 FFN 内部的激活/门控方式，与注意力打分毫无关系。D、E、A、B 成立：x·sigmoid(x) 的非单调下凹是它比硬截断更稳的原因之一；GELU、SiLU 都能写成 GLU 框架里的门控变体，差别就在门用哪个函数。" },
  { q: "把 FFN 解读成「键值记忆」：升维矩阵的行当匹配键、降维矩阵的行当存储值。这个视角正确的有？", o: ["A. 因此 FFN 存储的是 token 之间的依赖关系", "B. 一行的升维权重与对应降维权重配成一个「模式 → 输出向量」的槽位，激活强的行才贡献", "C. 用它解释知识编辑很自然：改一条知识大致就是改对应行的权重", "D. 这个解释有局限：单行独立记忆的假设过强，实际知识大量分散在多行、多层里", "E. 因此删掉某个 FFN 行就一定能精准抹掉某个事实，已被反复验证"], a: [1, 2, 3], e: "E错误：行与事实并非一一对应，直接删行改行常常伤及无关能力，这正是该解释的局限所在；A错误：跨 token 的依赖由注意力负责，FFN 只看当前位置的向量。B、C、D 成立：把它当成一个有用的近似模型，而不是字面真相。" },
  { q: "MoE 通常是在 FFN 这一侧动刀：把每层那一份 FFN 换成 N 份专家加一个 Router。正确的有？", o: ["A. Router 与内容无关，按轮转顺序轮流把 token 发给各专家", "B. 专家就是结构相同的 FFN 副本，训练后各自专精于不同的 token 子集", "C. Router 只决定每个 token 走哪几家专家，注意力层一般保持共享、不专家化", "D. 路由发生在逐位置上，同一 batch 里不同 token 访问不同专家权重，权重在显存里被反复搬运", "E. 把 FFN 换成专家后就不再需要非线性激活了"], a: [1, 2, 3], e: "E错误：每个专家内部仍是两层 MLP 加激活那一套，非线性一个都少不了；A错误：Router 拿当前 token 的隐状态算分数再取 Top-K，是内容驱动的，固定轮转既不可学也达不到按语义分工的目的。B、C、D 成立：D 正是 MoE 推理时带宽吃紧、权重复用率低的根源。" },
  { q: "d_model=2048、d_ff=8192、24 层、两矩阵 ReLU 版 FFN，关于参数换算成立的是？", o: ["A. 同层注意力的 Q/K/V/O 四投影约 4×2048² ≈ 1.7×10^7，所以 FFN 这一份比注意力大", "B. 把 d_ff 从 8192 砍到 4096，FFN 参数量随之减半", "C. 每层 FFN 的参数量与层数成正比", "D. 每层 FFN 约 2×2048×8192 ≈ 3.4×10^7 参数", "E. 24 层的 FFN 合计约 8×10^8 量级"], a: [0, 1, 3, 4], e: "C错误：每层 FFN 参数只由 d_model 和 d_ff 决定，随层数增长的是总量。D、E、A、B 自查：2×2048×8192≈3.4×10^7，×24≈8.1×10^8；四投影 4×2048²≈1.7×10^7，约为 FFN 的一半；中间维减半则两个矩阵各减半。" },
  { q: "关于输入词嵌入矩阵与输出投影共享权重（tied embeddings），正确的有？", o: ["A. 它把「这个词长什么样」和「这个词该被生成」绑成同一份表示，小模型上通常还顺带起正则作用", "B. 词表 V、hidden d 时，嵌入矩阵参数量约 V×d，输出投影就是它的转置", "C. 共享必然降低模型能力，所以所有大模型都不用它", "D. 一旦绑定就无法再单独更新输出端", "E. 共享省下一份 V×d 的大矩阵，词表越大省得越多"], a: [0, 1, 4], e: "C错误：从原始 Transformer 到不少中小模型一直在用共享权重，超大模型才常选择解绑，「必然降能力」不成立；D错误：常见做法是预训练时绑、继续训练或下游阶段解绑再各自更新，是否绑定是配置项，不是不可逆操作。E、A、B 成立：这也是为什么嵌入层在参数量账本里经常被单独列一项。" },
  { q: "一个 32 层、d_model=4096 的 Decoder-Only 模型（暂不计嵌入与 FFN 中间维），关于参数换算成立的是？", o: ["A. 估算时忽略偏置项会带来数量级的误差", "B. 注意力 Q/K/V/O 四个投影每层约 4×4096²，全模型约 32×4×4096²", "C. 4096²≈1.7×10^7，所以一个 d_model² 量级的矩阵就是千万参数级", "D. GQA 让 K、V 的头数少于 Q，可以把 K、V 投影做得比 Q 小，省掉这部分参数", "E. 只知道 hidden 维度就能唯一确定总参数量，层数和 FFN 中间维不影响"], a: [1, 2, 3], e: "E错误：总参数还要层数、d_ff 或专家数、词表与嵌入共同决定，单靠 d_model 定不出总量；A错误：偏置只有 d_model 量级，与 d_model² 的矩阵相比可以忽略，常规手推都省掉它们。B、C、D 成立：按题干数字 32×4×4096²≈2.1×10^9，是这一项的量级估算而非某型号真值。" },
  { q: "关于词表规模与 BPE 合并，正确的有？", o: ["A. 词表太大时尾部低频 token 样本稀少，容易欠训练", "B. 词表大小与注意力计算量无关，只影响显存", "C. 最终词表规模约等于初始符号集大小加上执行过的合并次数", "D. 词表越大，输入嵌入与输出投影的参数量线性增加", "E. 词表越大，常见串越可能被整块编码，同样文本的 token 数通常下降"], a: [0, 2, 3, 4], e: "B错误：词表变大会让同一段文本的 token 数 n 变小，注意力的 n² 开销随之下降，两者并非无关。C、D、E、A 成立：Byte-level 方案的初始符号集就是 256 个字节，多一轮合并就多一个新 token，规模就是这么涨上去的；代价是低频 token 见不到几次、那一行嵌入学不好。" },
  { q: "为什么语言模型在多数位置上只把概率给少数几个候选 token？", o: ["A. 交叉熵奖励「把概率质量堆到正确词」，模型被训练成这个形状", "B. 因为低频 token 在架构层面被禁止输出", "C. 模型容量越大，输出分布越接近在整个词表上的均匀分布", "D. 下一个词本身高度受限：语法、拼写、上下文共同排除了绝大多数词", "E. softmax 是指数放大器，分数差一点概率差一截，头部集中是常态"], a: [0, 3, 4], e: "B错误：没有任何「禁用词」机制，所有 token 都参与 softmax（除非采样侧显式掩码）；C错误：模型越强判断越确定，分布反而更尖、熵更低，不是更均匀。D、E、A 成立：这也是 Top-k/Top-p 截断几乎不伤质量的原因——长尾本来就没什么概率质量。" },
  { q: "一些模型在输出 logits 上做 soft-capping（形如 c·tanh(z/c)）来稳定训练，正确的有？", o: ["A. 上限锁死后，被压到边界附近的分数彼此之间的分辨率会变差", "B. 做了 soft-capping 就不再需要温度这类采样参数了", "C. 它把无界分数压进有限区间，防止个别 logit 爆炸把分布拉成极端 one-hot", "D. tanh 是光滑的，实现上一行算子就够，不必改动训练流程主体", "E. loss spike 常与个别位置分数过大有关，压上界是一种便宜的兜底手段"], a: [0, 2, 3, 4], e: "B错误：soft-capping 管的是数值安全，temperature 管的是分布形状与随机性，两者作用不重叠，采样参数照用。C、D、E、A 是同一条链：换来的是不炸，代价是饱和区里区分度下降，所以上限 c 要取足够大才不明显伤精度。" },
  { q: "关于输入端的 token embedding 查表，正确的有？", o: ["A. 嵌入矩阵可学习，训练后语义相近的词在同一空间里距离更近", "B. 送进第一层的是稠密向量，one-hot 只存在于词表索引这一层", "C. 词表 V 越大，取一次嵌入的时间开销越接近线性增长", "D. 嵌入层负责计算 token 之间的依赖关系", "E. 查表等价于把 one-hot 向量乘上一个 V×d 矩阵，但实现上直接按行取，不做满矩阵乘"], a: [0, 1, 4], e: "C错误：查表是按索引取一行，开销与 V 基本无关，V 撑大的是参数量和输出 softmax 那一步的算力；D错误：跨 token 的依赖是注意力的职责，嵌入层只做「符号 → 向量」的映射。E、A、B 成立：把 one-hot 乘矩阵写成查表，是所有推理框架的实际做法。" },
  { q: "大模型逐 token 解码（batch=1）时 GPU 算力常常用不满，原因是？", o: ["A. 这一步只做矩阵-向量乘，算术强度低：读很多字节只算很少次乘加", "B. 历史 KV Cache 也要整份读一遍才能算注意力，读的量随上下文变长而增加", "C. batch=1 会让 Tensor Core 硬件出错，只能退回标量计算", "D. 权重每步都要重新从磁盘加载，所以慢", "E. 每生成一个 token 都要把全部层的权重从显存搬进片上缓存，搬运时间远超计算时间"], a: [0, 1, 4], e: "C错误：Tensor Core 不会因 batch 小而报错，只是利用率低；D错误：权重常驻显存，只是每步都要重新读一遍，真去读磁盘才是灾难。E、A、B 成立：上下文越长每 token 的搬运量越大，带宽瓶颈越重，这就是解码常被叫作 memory-bound 的原因。" },
  { q: "关于算术强度（每读一字节做多少次乘加）与 batching，正确的有？", o: ["A. batch 足够大时，算力就不会成为瓶颈", "B. 提高 batch 时权重只读一次却服务多个请求，算术强度随之上升", "C. 算术强度低时，减少数据搬运的手段（算子融合、把权重放进更快的存储）比堆算力更有效", "D. batch 大到一定程度，KV Cache 显存和排队延迟会开始咬人，吞吐不是无限线性上升", "E. 单请求内把序列拉长不会改变算术强度"], a: [1, 2, 3], e: "E错误：矩阵-矩阵乘法的算术强度随共享维度增长，prefill 处理长序列正是把它摊成计算受限；A错误：batch 上去后瓶颈会翻面成算力受限，「永远不成为瓶颈」说反了。B、C、D 是同一条判据：先看瓶颈在搬还是在算，再决定优化什么。" },
  { q: "FlashAttention 靠分块与重算拿收益，关于它的机制与边界，正确的有？", o: ["A. 它把注意力的渐进复杂度从平方降成了线性", "B. 它靠近似地跳过部分分数来换取速度", "C. 它省的不是注意力的乘加次数，而是把 n×n 分数矩阵在 HBM 上写来读去的开销", "D. 分块加 online softmax 让它不必把完整分数矩阵物化，中间结果显存占用大幅下降", "E. 反向传播时靠保存的少量统计量边重算边反传，用重算换显存与访存"], a: [2, 3, 4], e: "A错误：n² 个分数照算，降的是 IO 而不是算术复杂度，真正降 FLOPs 的是稀疏/滑窗那条路线；B错误：它是精确计算，与朴素注意力数学上等价（只差浮点顺序带来的微小误差），不做近似丢弃。C、D、E 成立：所以它的收益在长序列时才最显眼，那正是 IO 最贵的地方。" },
  { q: "训练 Decoder-Only 模型时，关于激活值（activation）显存，正确的有？", o: ["A. 用了混合精度，激活显存就可以忽略不计", "B. 词表大小对训练显存没有影响，因为它不进入前向计算", "C. 反向传播要留存的中间激活随 batch、序列长度、层数一起增长", "D. 朴素实现下注意力分数矩阵那一份激活随 n² 增长，长序列训练时它是显存大户", "E. 梯度检查点用重算换显存，把必须留存的激活大幅压下去，代价是多算一遍前向"], a: [2, 3, 4], e: "A错误：混合精度省的是权重与梯度的位宽，反向必须留存的激活照样在，只是每个元素字节数变小；B错误：最后一层的 logits 是一份约 batch×n×V 的激活，词表越大这一份越吓人，工程上常把交叉熵分块计算来躲开它。C、D、E 成立：要留存的激活随 batch、序列长度、层数一起涨，其中注意力那一份在朴素实现下按 n² 涨（FlashAttention 正是把它换成不物化 + 重算），梯度检查点就是拿算力买显存。" },
  { q: "一个约 7×10^9 参数的模型，BF16 权重、32 层、d_model=4096、MHA（32 头），做粗估，下列算式成立的是？", o: ["A. 权重显存会随上下文长度增长", "B. 权重约需 7×10^9 × 2 字节 ≈ 14 GB", "C. 每 token 的 KV Cache 约 2×32×4096×2 字节 ≈ 0.5 MB", "D. 1 万 token 上下文的 KV 约 0.5 MB × 10^4 ≈ 5 GB 量级", "E. 若 K、V 的头数从 32 降到 8（GQA 式共享），上面这份 KV 按同比例降到约四分之一"], a: [1, 2, 3, 4], e: "A错误：权重是固定大小，随上下文增长的是 KV Cache。B、C、D、E 是一条能自查的换算链：BF16 每参数 2 字节故 7×10^9×2≈14 GB；KV 每 token = 2（K 与 V）× 层数 × 头维合计 × 位宽 = 2×32×4096×2 ≈ 5.2×10^5 字节；乘 10^4 得约 5 GB；头维降到 1/4 则这一份也降到 1/4。" },
  { q: "部署一台机器跑长文本高并发推理，显存里主要装的东西是哪些？", o: ["A. 上下文翻倍时，权重和 KV Cache 一起翻倍", "B. 权重是固定成本，搬进显存后就与并发数无关", "C. KV Cache 是可变成本，随并发数和上下文长度一起涨，常常先于权重把显存吃光", "D. 推理时的激活与临时缓冲比训练时小得多，但仍要按最大并发预留", "E. 并发翻倍时，权重占用也按比例翻倍"], a: [1, 2, 3], e: "E错误：权重只有一份，并发增加的是 KV 与激活，不按并发翻倍；A错误：KV Cache 随上下文线性翻倍，权重纹丝不动。B、C、D 成立：所以「还能开多少并发」本质是 KV 预算问题，这也是分页式 KV 管理和 KV 量化值钱的原因。" },
  { q: "Decoder-Only 做 next-token 训练时，关于损失落在哪些位置，正确的有？", o: ["A. 整段只在最后一个位置算一次损失，其余位置丢弃", "B. 因为各位置独立，一次前向可以并行监督整段的 n 次预测", "C. 第 t 个位置的输出用来预测第 t+1 个 token，损失是错位一位算的", "D. 序列第一个位置没有前文，不产生针对输入 token 的监督损失", "E. padding 与不参与监督的位置要 mask 掉，不能进损失的分母"], a: [1, 2, 3, 4], e: "A错误：每个可监督位置都有一份交叉熵，不是只算结尾那一处，否则等于把整段并行白白浪费掉。C、D、E、B 是标准写法：错位预测、首位置无监督、mask 剔除 padding，正因为位置间独立，一次前向就把 n 个预测全监督上了。" },
  { q: "训练时用 teacher forcing（直接喂真实前缀）而不是把模型自己的输出接回去，正确的有？", o: ["A. RNN 必须逐 token 展开，没法这样并行，是它训练慢的结构性原因", "B. 推理时前缀是模型自己生成的，误差会累积，这是 teacher forcing 带来的不一致", "C. 这种训练与推理输入分布的错位，就是曝光偏差（exposure bias）的来源", "D. 有了 teacher forcing 就不再需要因果掩码", "E. 用真实前缀后各位置互不依赖，整段可以一次并行前向，这是 Transformer 训练快的关键之一"], a: [0, 1, 2, 4], e: "D错误：并行前向能成立，恰恰是靠因果掩码把每个位置的未来信息挡掉，两者是一件事的两半。E、A、B、C 共同解释了「为什么训练便宜、推理却会漂移」，也是长文本生成里错误自我放大的根因。" },
  { q: "关于因果掩码在训练与推理时的不同形态，正确的有？", o: ["A. 推理必须每次重建完整的 n×n 掩码并归一化，这就是它慢的原因", "B. 因为只算一行，长上下文时每一步仍要读全部历史 KV，注意力访存量随 n 增长", "C. 训练时它是一张 n×n 的下三角掩码，一次前向同时监督 n 个位置", "D. 推理时新 token 只需对「自己及全部历史」算注意力，掩码退化成一行", "E. 只要前缀相同，推理算出的注意力权重与训练时一致"], a: [1, 2, 3, 4], e: "A错误：有 KV Cache 后推理只算「新一行」，历史 K/V 直接读缓存，不再重演 n×n。C、D、E、B 是同一条线：训练用整片下三角换并行，推理用一行换增量，代价是访存随上下文线性上升，数学上两者等价。" },
  { q: "实现注意力 softmax 时先减去每行最大值再取指数，关于这一步正确的有？", o: ["A. 归一化结果不变，因为分子分母同乘了 e 的负最大值次方", "B. 分块实现的 online softmax 里，这个最大值是随分块推进不断更新并回溯缩放旧项的", "C. 有了这一步，注意力的计算量就不再随序列长度平方增长", "D. 它等价于调温度：temperature 的作用就是改这个被减掉的最大值", "E. 它防的是数值溢出：把最大分数平移到 0，所有指数值落进 (0,1] 区间"], a: [0, 1, 4], e: "C错误：减最大值是逐行的常数平移，n² 个分数照样要算要读，复杂度一点没省；D错误：温度缩放的是除以 T 的分数尺度，与「减去最大值」是两回事，前者改变分布形状，后者只是数值稳定化。E、A、B 成立：这步是标准稳定化写法，代价是分数极大时旧块要按新的最大值回溯重缩放，FlashAttention 正是把这套统计量维护做成了分块形式。" },
  { q: "训练常把多条短样本拼进同一条长序列（sequence packing）来省 padding，正确的有？", o: ["A. 打包后单条序列更长，注意力的 n² 开销反而变小", "B. 拼接后要用掩码把不同样本隔开，否则模型会把上一段的尾巴当成本段上下文", "C. 不同样本拼在一起后，位置编码也要按段重置，不能一路累加下去", "D. 损失只在真实监督位上求和/求平均，padding 与不参与监督的位置要剔除", "E. 长短样本混训时按 token 数而非样本数做平均，梯度权重才不会畸形"], a: [1, 2, 3, 4], e: "A错误：单条序列变长时 n² 开销是涨的，打包省下的只是被 padding 占掉的无效算力，不是把平方项变小。B、C、D、E 是这套做法的四个必要条件：段间隔离、段内重置位置、剔除无监督位、按 token 归一。" },
  { q: "训练一次前向 vs 推理生成一个 token，计算上的差别正确的有？", o: ["A. 因为只算一行，Decode 阶段的矩阵乘退化成矩阵-向量乘，算术强度下降", "B. 训练对整段每个位置都算 logits 与损失，输出投影要跑 n 行", "C. 自回归生成每步只对新位置算一次 logits，输出投影只跑 1 行", "D. 训练要留激活供反向传播，推理算完就丢，这是训练更吃显存的主因之一", "E. 推理每步都要把整段前缀重算一遍，所以 KV Cache 没有意义"], a: [0, 1, 2, 3], e: "E错误：有 KV Cache 时历史只读不重算，这正是它的意义所在。B、C、D、A 串起来解释了两种成本结构：训练宽而并行、推理窄而串行，后者自然容易掉进带宽受限。" },
  { q: "用一条 10 万 token 的长序列做有监督微调（SFT），关于损失分母与梯度权重，正确的有？", o: ["A. 把不参与监督的位置（prompt 与 padding）从分母里剔除，才算得出正确的平均", "B. 不做归一时，同一个 batch 里样本长短悬殊会让梯度尺度抖动，通常要配梯度裁剪", "C. 序列很长时，按样本平均与按 token 平均的结果会趋同到可以忽略差别", "D. 按样本平均时，短样本里的每个 token 会拿到比长样本更大的梯度权重", "E. 按 token 平均时，长回答在损失里占的分量更大，短样本容易被稀释"], a: [0, 1, 3, 4], e: "C错误：两种归一方式给出的加权完全不同，序列越长、长短越悬殊差别越大，不存在「趋同」。D、E、A、B 是同一条工程线：分母里放什么，就等于告诉优化器哪些 token 重要，这一步选错，后面调学习率都救不回来。" },
  { q: "测试集上每位置平均交叉熵损失 L = ln 5（自然底数），关于困惑度的换算成立的是？", o: ["A. 若模型恰好在这 5 个候选上等概率分布，top-1 准确率约 1/5", "B. 把损失降为原来的一半（L = ln√5），PPL 变成 √5 ≈ 2.24", "C. 损失降一半，困惑度也降一半，也就是从 5 变成 2.5", "D. 困惑度 PPL = e^L = 5", "E. 这相当于平均每个位置有约 5 个势均力敌的候选"], a: [0, 1, 3, 4], e: "C错误：PPL = e^L，对 L 是指数关系不是线性关系，损失减半对应 PPL 开平方（5→约 2.24），不是 5→2.5。D、E、A、B 是同一条换算链：PPL 越接近 1 表示模型越确定，等于 1 就是每个位置都完全笃定。" },
  { q: "Transformer 里同时存在因果掩码、padding mask、loss mask 三种遮罩，正确的有？", o: ["A. padding mask 管「谁在场」，不让有效 token 去注意补位的空位", "B. loss mask 管「哪些位置算交叉熵」，与前两者不在同一个环节", "C. 三者可以在同一次前向里同时存在，功能互不替代", "D. 加了因果掩码之后，padding 位置对注意力与损失分母的影响可以忽略", "E. 因果掩码管「每个 query 能看哪些 key」，做法是把被遮的分数压成不可选"], a: [0, 1, 2, 4], e: "D错误：因果掩码只管顺序可见性，padding 若不被单独遮掉，仍会进注意力的归一化分母和损失分母，这正是长度悬殊的 batch 必须单独处理它的原因。E、A、B、C 成立：三张 mask 分别管可见性、谁在场、哪些位置算损失，实现上常常是三份不同的布尔张量。" },
  { q: "关于 Transformer 里的非线性都从哪里来，正确的有？", o: ["A. 门控 FFN 里两路逐元素相乘本身也是非线性运算", "B. Q/K/V 投影与 W_O 都是线性映射，单纯堆叠它们不会增加表达力", "C. 注意力子层的非线性主要来自 softmax 归一化那一步", "D. FFN 的激活函数是非线性主要来源，去掉它整块 FFN 就退化成一次线性变换", "E. 残差连接本身引入了强非线性，是模型表达力的主要来源"], a: [0, 1, 2, 3], e: "E错误：残差是加法融合，本身是线性操作，它的价值在「每层只学增量」和梯度直通路径，不在提供非线性。B、C、D、A 成立：多层纯线性矩阵乘会塌缩成一层，所以真正撑住深度的是激活、softmax 与门控这几个非线性点。" },
  { q: "关于 RoPE 的实现细节与代价，正确的有？", o: ["A. 旋转按二维分片进行，所以每头维度通常取偶数", "B. 它是纯乘法变换，不新增可学习的注意力参数", "C. 若所有分片用同一个 θ，内积会重新依赖绝对位置而不只是距离", "D. RoPE 只能用在 Decoder-Only 架构，用在 Encoder 上不成立", "E. 它作用在 Q 和 K 上，V 与输出投影不参与旋转"], a: [0, 1, 2, 4], e: "D错误：RoPE 只是给 Q、K 注入相对位置的一种变换，与用在哪种架构无关。E、A、B、C 成立：不同频率才能同时编码近程与长程，全部同频就退化成绝对位置依赖；不新增参数是它与查表式方案的重要差别，也意味着长度上限不再写死在参数形状里。" },
  { q: "一个 7×10^9 参数的模型跑在显存带宽 2×10^3 GB/s 的卡上，BF16 权重，粗算解码吞吐，成立的是？", o: ["A. 权重压到 4-bit 后，要搬的字节数按位宽比例下降，同一张卡的上限相应抬高", "B. 这个上限由参数量决定，跟显存带宽没关系", "C. batch=1 时每个 token 都要把约 14 GB 权重读一遍，上限约 2×10^3 ÷ 14 ≈ 1.4×10^2 token/s", "D. 把 batch 提到 8，权重那一次搬运被 8 个请求摊薄，聚合吞吐接近线性上涨，单请求逐 token 速度变化不大", "E. 上下文一长，每 token 还要额外读一份 KV Cache，实际吞吐必然低于 A 里那个只算权重的上限"], a: [0, 2, 3, 4], e: "B错误：这条式子里分母就是带宽——参数量只决定每 token 要搬多少字节，带宽决定每秒能搬多少，两者相除才是上限。A/B/C/D 是同一条账的四种改法：摊薄分母（加 batch）、减少每参数字节数（量化）、多加一份要读的 KV（只会更慢）。均为按题干数字的量级估算。" },
  { q: "同一个 MoE 层里 64 个专家只点亮 2 个，关于这一层的开销账，正确的有？", o: ["A. 因为只算 2 个专家，显存占用也约等于同规模稠密的 2/64", "B. 专家数从 64 增到 128、K 不变，单 Token 算力大致不变", "C. “参数量与计算量解耦”指总参数照存、单 Token 算力只按点亮的专家走", "D. 全部专家权重都要常驻显存，与本次点亮几个无关", "E. 小 batch 请求容易被“读全部权重”的带宽成本拖着走"], a: [1, 2, 3, 4], e: "A错误：MoE 省的是算力不是显存，权重常驻量跟着总参数走。" },
  { q: "关于 Top-K 路由（常见 K=2，另配 1 个常开专家）的机制，正确的有？", o: ["A. 路由决策逐 Token 作出，同一句话里不同 Token 可走不同专家", "B. 常开专家不参与 Top-K 竞争，每个 Token 都经过它", "C. K 越大，单 Token 的算力越小", "D. 被选中专家的输出一律等权相加后写回主干", "E. Router 对每个 Token 给全部专家打分，取前 K 个"], a: [0, 1, 4], e: "C错误：K 增大意味着每个 Token 多算几个专家，单 Token 算力反而上升。D错误：合并是门控加权求和，不是等权相加。" },
  { q: "容量因子（Capacity Factor）这个旋钮拧紧与拧松各自的代价，正确的有？", o: ["A. 拧紧：热门专家名额不够，溢出 Token 被直接丢弃", "B. 被丢弃的 Token 在该层输出为零，原向量靠残差带过去", "C. 拧松：给长期闲置的专家白留显存", "D. 拧紧会迫使 Router 把 Token 均分给每一个专家", "E. 推理时可用动态缓冲避免丢弃，代价是各步耗时不均"], a: [0, 1, 2, 4], e: "D错误：名额是按平均 Token 数乘容量因子算的，Token 依旧挤向热门专家，并不会被平摊到每一家。" },
  { q: "关于负载均衡辅助损失，正确的有？", o: ["A. 推理时也要保留，否则分布会立刻崩", "B. 它能让单 Token 的 FLOPs 下降", "C. 作用是把各专家的 Token 占比往均匀拉", "D. 它只在训练里起作用，推理时被移除", "E. 没有它，路由容易塌到少数专家，冷专家长期拿不到梯度"], a: [2, 3, 4], e: "A错误：辅助损失是训练目标的一项，推理不做反向传播，不需要也不能再算它。B错误：省算力来自稀疏激活，与这个损失项无关。" },
  { q: "训到后期发现十几个专家几乎零命中，合理的解释与排查有？", o: ["A. 冷专家不被选中就没有梯度，越学越差、越不被选，是饿死循环", "B. 路由是在训练里学出来的，学歪之后推理会将错就错", "C. 先查负载均衡系数的设置与该项损失是否已失效", "D. 零命中说明这些专家冗余，删掉即可无损上线", "E. 把 K 提到 4，冷专家就能被救活"], a: [0, 1, 2], e: "D错误：删专家动的是模型结构，得重新训练或校准，谈不上无损。E错误：K 变大只让每个 Token 多点亮几名，打分垫底的专家未必进得了视野，算力还得付钱。" },
  { q: "关于一个 MoE 层里的两次 All-to-All（dispatch 与 combine），正确的有？", o: ["A. 层数越多，全交换发生的次数越多", "B. 贵的是把激活搬去专家所在设备再搬回来的网络流量，不是矩阵乘", "C. 一组专家放进同一节点时这两趟最便宜", "D. 专家并行跨节点时，网卡可能取代算力成为瓶颈", "E. 只有训练才需要这两次交换，推理走单设备就不用"], a: [0, 1, 2, 3], e: "E错误：只要专家分散在不同设备上，推理同样要 dispatch 与 combine，只有单卡装下全部专家才谈得上绕开。" },
  { q: "专家并行与其他并行方式的关系，正确的有？", o: ["A. 它与 TP/PP/DP 可以正交组合", "B. 四种并行主要在分显存，专家并行额外决定 All-to-All 流量", "C. 用了专家并行就不需要数据并行", "D. 专家并行本身把单 Token 的 FLOPs 降了下来", "E. 专家并行切专家，张量并行切单个矩阵，流水线并行切层"], a: [0, 1, 4], e: "C错误：两者解决的是不同维度的问题，可以并存。D错误：降算力靠稀疏激活（只算 K 个专家），专家并行只是把它们摊到不同卡上。" },
  { q: "共享专家（常开专家）在结构上承担的角色，正确的有？", o: ["A. 每个 Token 都经过它，承担通用能力、给路由减压", "B. Top-K 选错时它提供一份保底输出", "C. 这一份计算不稀疏，是 MoE 里必须照付的算力", "D. 有了它就不必再管其余专家是否均衡", "E. 它必须挤进 Top-K 名额才生效"], a: [0, 1, 2], e: "D错误：常开专家不参与竞争，也替其他专家分不了账，负载仍要约束。E错误：它恰恰是因为不参与 Top-K 竞争才常开。" },
  { q: "某 MoE 每层 E=64、K=2，关于单 Token 前向算力的粗估，成立的有？", o: ["A. 注意力子层那一份不跟着专家数折，仍是稠密的那套开销", "B. 显存里的专家权重是 64 份，不因为只算 2 份而变小", "C. 把 K 从 2 提到 4，显存常驻量随之翻倍", "D. E 翻倍而 K 不变，总参数涨上去、单 Token 算力基本不动", "E. FFN 侧算力约按 K/E 的比例折下去"], a: [0, 1, 3, 4], e: "C错误：K 改的是每 Token 算几个专家，常驻量取决于 C，与 K 无关。" },
  { q: "某一层长期报出高溢出率，可能的含义有？", o: ["A. 残差既然能带过去，溢出对精度就没有影响", "B. 名额给少了，大量 Token 在这一层没有专家可去", "C. 这些 Token 在该层贡献为零，只能靠残差和后面的层补救", "D. 也可能是输入分布本身高度集中，不一定是路由算错", "E. 溢出说明专家数一定不够，唯一解是加专家"], a: [1, 2, 3], e: "E错误：放宽容量因子、调负载均衡系数、给热点专家加副本都是可试方向，加专家只是之一。A错误：残差只保证信息不被吞掉，补不回这一层本该做的变换。" },
  { q: "另一类作用在 Router 打分端的辅助损失，其目的与性质包括？", o: ["A. 它可以替代容量因子，从此不再丢 Token", "B. 这类辅助损失在推理时同样生效", "C. 防止路由 logits 爆炸", "D. 防止打分塌缩成少数专家恒定胜出", "E. 和负载均衡损失一样，推理时移除"], a: [2, 3, 4], e: "A错误：它管的是打分端的数值稳定，不改变每个专家单步能收多少 Token 的名额，溢出照旧；B错误：它靠反向传播起作用，推理期没有梯度。" },
  { q: "把稠密模型每层的 FFN 换成一份份专家加一个 Router，其余结构不动，改造后必然发生的是？", o: ["A. 每层多出 Router 打分与专家选择这一步", "B. 梯度只流过被点亮的专家，其余专家这一步拿不到更新", "C. 权重与优化器状态仍按全部专家参数占用显存", "D. 单 Token 算力下降是免费的，不必付任何代价", "E. 改造后精度一定高于原稠密模型"], a: [0, 1, 2], e: "D错误：代价是每层两次全交换的通信、负载均衡约束与可能的 Token 丢弃。E错误：路由学不好时 MoE 反而不如稠密，稀疏本身不送精度。" },
  { q: "MoE 的“稀疏”究竟疏在哪一层，正确的说法有？", o: ["A. 某 Token 一旦被分给某几层，后面就固定不再变", "B. 既然只点亮少数专家，推理时只需加载历史上被用过的那几个", "C. 疏在每层内部点亮的专家数量，不是只跑其中某几层", "D. 每个 Token 仍要依次经过全部层", "E. 注意力子层每个 Token 都得算，没有跳过一说"], a: [2, 3, 4], e: "A错误：路由是逐 Token 逐层各算各的，不存在一次定终身。B错误：下一个 Token 会点谁无法预知，全部专家都得常驻或可快速取回。" },
  { q: "显存和带宽都吃紧、并发也很低，此时在稠密与 MoE 之间怎么选，合理的判断有？", o: ["A. 小请求在 MoE 上更容易被权重带宽拖着走", "B. 既然 MoE 激活参数少，低并发也该优先选它", "C. 换成显存充足、吞吐优先的场景，结论才会偏向 MoE", "D. 这种条件下稠密更划算，不必为用不上的专家常驻买单", "E. MoE 要靠大 batch 才摊得平读全部权重的成本"], a: [0, 2, 3, 4], e: "B错误：激活少只省算力，显存照总参数占用，低并发时权重读取成本反而摊不平。" },
  { q: "推理阶段怎么处理训练时那几项辅助损失，正确的有？", o: ["A. 训练期路由学歪，推理的热冷专家分布就将错就错", "B. 要在推理服务里继续加负载均衡项，否则分布一定崩", "C. 推理期可以把 Router 换成轮询来强行均衡", "D. 全部移除，推理没有反向传播可用", "E. 移除后 Router 不再被往均匀方向拉，只靠训好的打分继续工作"], a: [0, 3, 4], e: "B错误：辅助损失只在训练起作用，推理期加不了也没有梯度可回传。C错误：轮询打乱的是内容驱动的路由，等于把训好的专家分工丢掉。" },
  { q: "线上跑一个 MoE 服务，值得盯的指标包括？", o: ["A. 只看总损失曲线就够，专家维度不必拆", "B. 某个专家长期满员，说明它的容量给得很富余", "C. 训练期看每个专家的利用率与溢出率", "D. 推理期看耗时与显存高线", "E. 把 Top-K 命中按专家计数画成热度直方图"], a: [2, 3, 4], e: "A错误：总分平稳可能掩盖一个专家饿死、另一个溢出的结构问题。B错误：满员恰恰意味着名额不够、正在往外丢 Token。" },
  { q: "热度直方图显示少数专家长期满员、其余几乎零命中，合理的处置有？", o: ["A. 删掉零命中专家来省显存，精度必然不受影响", "B. 把 Temperature 调低，让路由自己变均匀", "C. 给热专家加副本分摊流量", "D. 复查容量因子是否给得太紧", "E. 复查负载均衡系数是否过小、该项损失是否已失效"], a: [2, 3, 4], e: "A错误：删专家是改结构，得重训或重新校准，谈不上必然无损。B错误：Temperature 只管生成端的采样，路由靠打分排序，调温度调不动它。" },
  { q: "为了塞下全部专家权重，考虑给专家做量化或把它们卸载到外存，代价正确的有？", o: ["A. 卸载后被点亮的那几个专家要现取，取回延迟直接进关键路径", "B. 前提是全部专家常驻显存或可快速取回，取回慢就等于把路由卡住", "C. 量化之后所有 Token 承受的误差完全一致", "D. 卸载只在训练里可行，推理一律不允许", "E. 量化误差随 Token 落到不同专家上，扰动在样本间并不均匀"], a: [0, 1, 4], e: "C错误：不同 Token 走不同专家，被量化伤到的程度自然按路由分布摊开。D错误：推理同样可以边取边算，只是要为取回时间买单。" },
  { q: "MoE 训练里全局 batch 与容量因子的相互影响，正确的有？", o: ["A. 用梯度累积撑大等效 batch，并不会放大单个前向步里的名额", "B. batch 与容量因子互不相干，各调各的", "C. 把容量因子调到足够大，丢弃问题就消失且不必付代价", "D. 名额按本步平均 Token 数乘容量因子算，batch 变大名额随之变宽", "E. batch 太小时每专家分到的样本少，路由统计更抖，饥饿与溢出都更容易冒头"], a: [0, 3, 4], e: "B错误：名额的定义本身就挂着本步 Token 数。C错误：名额放宽等于给闲置专家照留显存。" },
  { q: "把专家并行铺到多个节点上，容易踩的坑有？", o: ["A. 部署上应尽量把一组专家收进同一节点", "B. 专家数与卡数不匹配时会出现整卡等待", "C. 节点堆得够多，全交换的代价就能忽略", "D. 跨节点部署后就不必再看溢出率了", "E. 每个 MoE 层的两次全交换都要过网卡，带宽可能先于算力打满"], a: [0, 1, 4], e: "C错误：节点越多，跨节点往返越频繁，流量只会更糟不会消失。D错误：溢出率是路由健康度指标，与部署形态无关，照样得盯。" },
  { q: "推理时按固定名额丢弃 Token，与改用动态缓冲不丢 Token，两种做法的取舍正确的有？", o: ["A. 动态缓冲能顺带把显存占用降下来", "B. 两种做法在精度上没有实质差别", "C. 固定名额实现简单、每步耗时稳定，但丢 Token 伤精度", "D. 动态缓冲避开了丢弃，代价是各步耗时不均", "E. 对延迟抖动敏感的链路更偏好固定名额那种确定性"], a: [2, 3, 4], e: "A错误：不丢就得为溢出 Token 留可变大小的暂存位，占用只会更活。B错误：丢与不丢正好是精度的差别所在。" },
  { q: "MoE 新版本上线前，比稠密版本多做哪些检查更值？", o: ["A. 总分不降就不必拆维度看", "B. 多采样几次就能掩盖路由不均", "C. 分领域看题集，路由偏置可能让某类题掉分而总分不动", "D. 盯低资源语言、代码这类长尾输入落到的专家是否长期满员", "E. 按激活参数量级而不是总参数量级去估算力，免得把成本算错一档"], a: [2, 3, 4], e: "A错误：均值会吸收掉结构性塌陷，专家维度和领域维度都得单独看。B错误：采样只改变生成端的运气，改不了哪个专家在丢 Token。" },
  { q: "关于指令模型与推理模型的差别，符合机制的有？", o: ["A. 指令模型走快思考，一次前向直接给答复", "B. 推理模型先在内部生成隐藏的思维链，再落到结论", "C. 这条思维链是靠可验证奖励、过程打分这类训练逼出来的，不是提示词加上去的", "D. 把 Temperature 调高，指令模型就有同等的多步推演能力", "E. 两者的差别其实只在参数量大小"], a: [0, 1, 2], e: "D错误：温度只是重塑下一步的概率分布，不会凭空多出多步推演。E错误：同尺寸基座上训法不同就能分成两类，与参数量无关。" },
  { q: "手上有一笔固定的推理算力预算想换成准确率，把单次思考拉长与多采样再投票这两条路线，正确的有？", o: ["A. 投票对答案离散、可两两比对的题（数学、选择）更见效", "B. 投票需要一个能归并多样本的判据，否则只是撞运气取众数", "C. 拉长思考多付的是思考 Token 与拿到结论前的等待，投票则要多付几份完整生成", "D. 两条路线在任何任务上收益相同", "E. 采样次数堆得够多，就不必再训练推理能力"], a: [0, 1, 2], e: "D错误：开放写作没有可比对的离散答案，投票归并不出东西。E错误：投票放大的是已有能力的稳定性，不会教出模型原本不会的推演。" },
  { q: "把推理模型接进多轮会话，关于上一轮的思考内容，正确的有？", o: ["A. 思考与回复混在同一段输出里时，解析要按标记切，否则会把草稿递到用户面前", "B. 默认只把最终回复接回历史，思考块不回流能省下上下文与费用", "C. 把思考块原样塞回下一轮，会明显抬高输入 Token 与延迟", "D. 思考内容能否取回、能否回传取决于接口是否显式支持，别假设模型读得懂自己的旧草稿", "E. 不回传思考，模型的推理能力就当场失效"], a: [0, 1, 2, 3], e: "E错误：每轮都从当前输入重新想，历史里没有旧草稿也照样能推。" },
  { q: "下列任务更值得交给会先想再答的慢思考模型，合理的有？", o: ["A. 每天几十万条、只出一个标签的模板化分类", "B. 日常寒暄与文案润色", "C. 多个硬约束要同时满足的排班、逻辑谜题", "D. 线索散在多处、必须串起来才能定位的取证类问题", "E. 有客观判分器的题，例如数学唯一解、代码跑测试"], a: [2, 3, 4], e: "A错误：这类量大、只要结论、延迟敏感，把预算花在思考上是亏的。B错误：单步就能写完的任务再加推理轨迹，只多出费用和延迟。" },
  { q: "关于推理模型写出的思维链与最终答案之间的关系，正确的有？", o: ["A. 思维链长度与准确率单调正相关", "B. 思维链本身也是生成的文本，不保证与答案因果一致，可能事后补理由", "C. 把它当审计证据之前，要抽查中间步骤是否真的支撑结论", "D. 思维链里算错的数字可能被后面的步骤一路沿用", "E. 思维链写得越详细，最终答案就一定越对"], a: [1, 2, 3], e: "E错误：详细不等于正确，长篇草稿里同样能带着错值走到底。A错误：超过某个难度点后继续加长只会绕圈，收益不单调。" },
  { q: "把完整推理轨迹当成交付给复核人的工作底稿，成立的说法有？", o: ["A. 每步显式写出，错了能定位到具体步骤，配合逐步打分便于纠正", "B. 金融、医疗、法律这类结论要被人背书，只给结果无法采信", "C. 留全轨迹也等于给训练期的奖励分配提供了可打分的对象", "D. 底稿写得越长，复核人的成本就越低", "E. 留了轨迹就不必再核对每步引用的原始数据"], a: [0, 1, 2], e: "D错误：长轨迹是把核对成本转嫁给复核人，越读越贵。E错误：步骤自洽不代表来源可靠，数字出处仍要回查。" },
  { q: "选 CoD（每步只留极简草稿）而不选 CoT，等于接受了哪些代价，正确的有？", o: ["A. 从此所有下游复核环节都能省掉", "B. 中间依据不落纸，出错时难以定位到底是哪一步崩的", "C. 压缩步数是拿能力上限换速度，难题上的准确率可能掉", "D. 换来的是更少的 Token 消耗与更低的延迟", "E. 逐步打分的校验器失去可打分的对象"], a: [1, 2, 3, 4], e: "A错误：省掉的只是模型侧的书写成本，人侧的复核与追溯反而更难。" },
  { q: "手里有个能给中间步骤打分的校验器，推理期能做的事有？", o: ["A. 给多条候选轨迹分别打分再择优，比单纯取众数更有依据", "B. 某一步被打低分时提前收手，省下后续的 Token", "C. 把低分片段回灌给模型做一次修订", "D. 它能顶替训练，模型不必再学会推理", "E. 校验器会打分就不会被模型钻空子"], a: [0, 1, 2], e: "D错误：校验器只能挑出做得好的轨迹，做不出来就是做不出来。E错误：打分器与被打分模型之间存在博弈，指标照样能被讨好。" },
  { q: "一套系统里同时留着指令模型和推理模型，合理的运维做法有？", o: ["A. 按任务分档：模板化高频走快模型，多步难题走慢模型", "B. 两条链路的输出结构与解析代码分开维护，别假设字段一致", "C. 换档时用同一批题集回归，免得快慢切换后质量落差没人发现", "D. 慢模型平均分更高时，就该把快模型全线撤掉", "E. 两类模型的接口与解析代码可以原样共用，不必区分"], a: [0, 1, 2], e: "D错误：慢模型在延迟、费用和格式遵循上未必占优，全线撤掉会伤高频链路。E错误：一边只有回复、一边可能带思考块，字段与解析并不对称。" },
  { q: "关于标称上下文窗口与真正用得上的长度之间的差距，正确的有？", o: ["A. 标称是位置与显存能容纳的上限，不等于这段材料会被真正用上", "B. 序列越长，Softmax 要把更多分数归一，每个相关片段摊到的权重越薄", "C. 中段材料的召回通常比头尾差，塞得进不代表用得上", "D. 没超窗口时，模型在该长度内的表现是均匀可用的", "E. 窗口标称值一旦公布，就等于给有效长度开了担保"], a: [0, 1, 2], e: "D错误：退化主要落在中段与超长区间，可用性并不均匀。E错误：标称只是容量，有效长度要靠实测题集去量。" },
  { q: "单条“大海捞针”式找回题不足以代表长文能力，原因有？", o: ["A. 它只考定位一条孤立信息，不考把多处材料合并成结论", "B. 针与周围文本没有关联，靠字面就能对上，绕过了长程整合", "C. 单针不冲突，多份互相矛盾的材料才真正考验取舍", "D. 它的结论可以平移给摘要、跨章节问答这类任务", "E. 把针固定放在中段测一次，结果就稳定可比"], a: [0, 1, 2], e: "D错误：找回与归纳是两种能力，找回高分不代表归纳可用。E错误：中段正是召回最差、方差最大的一段，单点结果不稳。" },
  { q: "从读一篇文章升级到读一整本书，任务发生质变，真正需要满足的条件有？", o: ["A. 头尾之外的中段材料要被真正纳入，而不是靠位置优势蒙混", "B. 单靠窗口变长不够，往往还要外部检索或分批归纳来补注意力的短板", "C. 把窗口再拉长一个数量级，这类任务就能做对", "D. 提示里写上“请通读全文”，细节就能覆盖齐全", "E. 把散在多处的说法归并成一个一致结论，而不只是找回原句"], a: [0, 1, 4], e: "C错误：窗口是容量，归并与抗稀释不是靠倍数解决的。D错误：一句指令改变不了注意力在长序列上的分配方式。" },
  { q: "把上下文一路塞到接近窗口上限，通常要付出的代价有？", o: ["A. KV Cache 随长度线性变长，既占显存又压并发", "B. 无关材料一起进来会稀释注意力，塞得多不等于答得好", "C. 端到端成本与输入长度保持严格线性", "D. 塞满只是慢一点，精度不受影响", "E. 注意力打分是 n×n，长度翻倍这块开销变四倍，预填充阶段最先撞墙"], a: [0, 1, 4], e: "C错误：二次项让总成本超线性，线性项只是其中一部分。D错误：多塞进来的噪声本身就在扣精度。" },
  { q: "不换更长窗口的模型，只靠工程手段提高超长材料的利用率，合理的有？", o: ["A. 把最可能被追问的段落集中堆在中段", "B. 调高 Temperature 让模型更仔细地读细节", "C. 先检索筛选再喂，把无关材料挡在窗口之外", "D. 分批归纳再合并，把一次超长拆成多次可控长度", "E. 把最关键的约束与结论要求放到开头或结尾，避开召回最差的中段"], a: [2, 3, 4], e: "A错误：中段正是注意力最薄的地方，把关键料堆那里是自找漏读。B错误：温度改的是生成端的采样陡度，改不了对已读材料的注意力分配。" },
  { q: "要比较两个模型的长文能力，比单针更可靠的题集设计包括？", o: ["A. 需要跨多处材料合并作答的聚合型题目", "B. 关键信息在头、中、尾分别布点，看退化曲线而不是单点", "C. 沿输入长度做梯度扫描，同一任务在不同长度下各测一遍", "D. 只测最长那一档就足够下结论", "E. 直接比较两家公布的窗口标称值"], a: [0, 1, 2], e: "D错误：单档测不出从哪一长度开始塌，也看不出是题型不适配还是长度不适配。E错误：标称值是容量参数，不是能力分数。" },
  { q: "把一本长书先分段做摘要、再拿摘要回答问题，这种做法的特性有？", o: ["A. 除摘要外还要保留回查原文的路径，例如出处与页码", "B. 分段摘要后的信息总量与原文等价", "C. 每段摘要够长时，无须再回查原文", "D. 把单次超长换成多次可控长度，绕开注意力稀释", "E. 摘要是有损压缩，细节型问题会在压缩里丢掉"], a: [0, 3, 4], e: "B错误：归一压缩的代价就是细节流失，不可能等量。C错误：摘要再长也不是原文，落到具体数字仍要回查。" },
  { q: "上下文里同时塞进新旧两版互相矛盾的规章，正确的说法有？", o: ["A. 矛盾材料只影响 Token 开销，不影响结论", "B. 模型没有默认的裁决规则，可能任选其一，也可能折中，答案不稳", "C. 应在提示里显式给出生效时间与优先级，或干脆只喂当前版本", "D. 冲突点落在中段时更容易被忽略，落在头尾更容易被采纳", "E. 材料里带了日期，模型就会以最新那份为准"], a: [1, 2, 3], e: "E错误：日期只是又一段文本，没有被显式指定为裁决依据时不保证生效。A错误：两份都进窗口时，结论会在两版之间漂。" },
  { q: "按“输出是什么”来选模型形态，正确的有？", o: ["A. 只要一个标签或一个相似度分数，双向编码器类模型就够，不必上生成", "B. 要产出任意长度的文本，用 Decoder-Only 这一代形态", "C. 先读懂再写出这类结构，Encoder-Decoder 也有它的位置", "D. 分类任务只能用生成式模型，编码器形态已经不适用", "E. 任务一复杂，就该把所有形态串成一条固定流水线"], a: [0, 1, 2], e: "D错误：判断式恰恰相反，只输出理解结果时编码器类更省。E错误：复杂度不是串链的理由，链路越长故障域和成本越大。" },
  { q: "站在选型角度，多模态语言模型相对纯语言模型改的是什么，正确的有？", o: ["A. 主干仍是自回归语言模型，视觉侧负责把图变成能接龙的表示", "B. 加的是输入通路与对齐，训练目标还是预测下一个 Token", "C. 选型时要回头看纯文本能力有没有被侵蚀，不能只测图文题", "D. 挂着多模态标签，图表读数和 OCR 就一定可靠", "E. 加了视觉通路后文本侧就换了一套解码机制，不再受采样参数影响"], a: [0, 1, 2], e: "D错误：标签只说明有视觉通路，密集数字与细线图表仍是常见失分点。E错误：视觉动的只是输入通路，文本侧仍是同一套自回归解码与采样。" },
  { q: "做语音助手，用“识别→语言模型→合成”三段拼接还是端到端语音模型，正确的判断有？", o: ["A. 端到端在准确率上一定占优", "B. 上了端到端就不需要任何文字记录来做合规复核", "C. 拼接方案每段能独立换模型、独立验收，出错可定位到某一段", "D. 端到端省掉中间文本，链路更短，但可留痕的中间产物也更少", "E. 拼接里前一段的错误会被后一段当成既定事实继续用"], a: [2, 3, 4], e: "A错误：省掉中间步骤不等于更准，两路各有失分点。B错误：不留痕反而是端到端方案要额外补的短板，不是它能省掉的事。" },
  { q: "关于嵌入模型在模型谱系里的位置，正确的有？", o: ["A. 它把一段文本压成定长向量，输出不是文本，不做生成", "B. 追求的是同一段文本在向量空间里可比较，句向量走的是双向编码那一路", "C. 它与生成式模型不等价：召回靠它，组织回答靠生成式", "D. 维度越大，检索精度必然越高", "E. 它可以顶替生成模型直接写答复"], a: [0, 1, 2], e: "D错误：维度主要影响开销与表达容量，精度取决于训练目标与领域适配。E错误：它不产出文本，回答环节仍需生成式模型。" },
  { q: "给下面几类需求配对模型形态，合理的有？", o: ["A. 毫秒级的是否判断 → 先让模型写完一整段推理轨迹再取结论", "B. 语义去重、相似问召回 → 嵌入模型", "C. 长文档摘要、自由问答 → Decoder-Only 生成模型", "D. 输入是语音、输出是文字纪要 → 语音识别接语言模型，或直接支持语音输入的模型", "E. 每一步都要留痕的审核 → 能显式写出中间步骤的生成模型，而不是只出一个标签"], a: [1, 2, 3, 4], e: "A错误：延迟敏感的单步判断，把预算花在写轨迹上是倒置的。" },
  { q: "把语音、图像、文本都收进一个端到端模型，与用多个专职模型编排相比，正确的有？", o: ["A. 单模型里短板模态会拉低整体，且不容易定位问题出在哪一模态", "B. 单模型在成本上必然低于编排", "C. 用一个大一统模型后，就不必再按模态分别建评测集", "D. 单模型少掉中间转换，跨模态信息更完整地进到同一次推演里", "E. 编排方案每段可独立替换与验收，故障域更小"], a: [0, 3, 4], e: "B错误：一个模型要常驻全部模态的能力，成本取决于负载与规模，谈不上必然更省。C错误：模态能力不均衡，评测恰恰要按模态拆开。" },
  { q: "关于语义切块（按标题、段落边界）与固定 Token 数硬切，正确的有？", o: ["A. 语义切块以标题、段落、列表为边界，让每个块读起来是一段完整的话", "B. 固定长度切块实现简单、块长可控，工程上并非一无是处", "C. 把切块改成语义切块，检索召回率会明显提升", "D. 语义切块后各块长度自然一致，Top-K 拼装更好算", "E. 固定长度切块可能把一句话或一个操作步骤从中间截断，片段自身语义不完整"], a: [0, 1, 4], e: "C错误：切块只决定网眼大小，召回还受嵌入模型、查询表达与是否混合检索影响，单改切块不保证提升；D错误：语义切块的块长天然参差（一句引言很短、附录一段很长），仍需设长度上限做二次拆分。" },
  { q: "关于切块的重叠窗口（chunk overlap），正确的有？", o: ["A. 重叠率过高时 Top-K 可能被同一页的近似副本占满，实际覆盖的信息量反而下降", "B. 重叠必须取块长的一半才有效，小于这个值没有意义", "C. 设了重叠之后就可以省掉检索结果的去重步骤", "D. 适度重叠能救回被边界切断的内容，降低答案正好跨两块导致的漏检", "E. 重叠会让同一句话出现在多个块里，索引体积与重复命中随之增加"], a: [0, 3, 4], e: "B错误：常见做法只取块长的一两成，取一半会把重复命中和体积一起放大，并不存在必须值；C错误：重叠正是近重复片段的来源之一，仍需去重或用 MMR 打散，否则名次被同一段内容刷满。" },
  { q: "文档里的表格在切块与检索时容易出问题，正确的处理与原因包括？", o: ["A. 常见补救是让每行自带表头（写成“列名: 值”），或小表整表作为一块", "B. 很大的明细表更适合走结构化通路（SQL 或表格工具），而不是硬挤进向量召回", "C. 表格属于结构化数据，向量检索对它的召回通常比自然段落更好", "D. 页眉页脚与水印对切块没有影响，原样保留即可", "E. 表格被拉平成逐行文本后，列名与数值的对应关系容易丢失"], a: [0, 1, 4], e: "C说反了：拉平后的表格在向量空间里像一串稀疏 token，往往比自然段更难召回，这正是需要混合检索与结构化通路的原因；D错误：每页重复的页眉页脚彼此高度相似，容易被高分召回并污染片段，入库前应剥离。" },
  { q: "对代码仓库做切块入库时，合理的做法包括？", o: ["A. 用语法树（AST）确定边界，能避免把 if 和它的 else 分到两块", "B. 块上保留文件路径、函数名等上下文，片段不完整也能定位回去", "C. 缩进和空行属于噪声，切块前应统一删掉", "D. import 语句与类型声明与回答问题无关，应当从块中剥离", "E. 按函数、类、方法等语法边界切，而不是按固定行数硬切"], a: [0, 1, 4], e: "C错误：多数语言的缩进本身就是结构信息，删掉后既难读也容易错判归属；D错误：import 和类型声明常是唯一说明这个符号从哪来的信息，剥离后更难判断依赖关系。" },
  { q: "切块时保留元数据与文档层级（标题路径、页码、版本、时间），作用包括？", o: ["A. 元数据越多越好，把整篇正文复制进每个块的附加字段就行", "B. 片段带上“篇-章-节”路径，可补回孤立片段丢掉的主语与限定条件", "C. 时间、部门、密级这类条件可交给元数据过滤，不必为此把内容切得更碎", "D. 答案里的页码与段落定位依赖这些字段，否则无法溯源核对", "E. 元数据只影响前端展示，对召回质量没有影响"], a: [1, 2, 3], e: "E错误：标题路径本身参与关键词与向量检索，会直接改变召回结果；A错误：整篇正文冗余进每块会让块向量被全文语义平均化、区分度下降，存储与去重成本也一起暴涨。" },
  { q: "关于父子块（small-to-big：小块负责被检索、大块负责喂模型），正确的有？", o: ["A. 用了父子块就不再需要重排", "B. 用细粒度子块提升定位精度，命中后送回其父块或整段补足上下文", "C. 它把召回单元的粒度与生成单元的粒度解耦，不必在两者之间二选一", "D. 代价是要维护块间引用关系，拼装时更容易顶到上下文预算", "E. 父块越大越好，干脆把整篇文档当作父块"], a: [1, 2, 3], e: "E错误：过大的父块把无关内容一起塞给模型，稀释注意力并抬高成本，通常要给父块设长度上限；A错误：父子块解决给多少上下文，重排解决先给哪几条，两件事不能互替。" },
  { q: "切块粒度对召回与成本的影响是双向的，正确的有？", o: ["A. 块过大时一条里混着多个主题，向量被平均，命中后还夹带噪声", "B. 固定 Top-K 下块越大，拼装进上下文的字数越多、生成成本越高", "C. 块切得越小，端到端准确率就单调上升", "D. 块越碎，向量条目数越多，索引体积与候选比较量随之上升", "E. 块越碎，单条语义越聚焦，Top-K 捞回的内容更贴合问题"], a: [0, 1, 3, 4], e: "C不成立：过碎会切断上下文，模型拿到的是缺主语的半句话，召回与忠实度可能同时下降，收益并不单调。" },
  { q: "文档入库前的预处理，合理的做法包括？", o: ["A. 清洗规则只需首次全量导入执行一次，后续增量可以跳过", "B. 剥离页眉页脚、页码、目录、免责声明等每页重复的样板内容", "C. 扫描件先做 OCR，并标记识别失败的页面，避免静默入库成空块", "D. 近重复内容要去重，否则 Top-K 会被同一份材料的多个副本占位", "E. 空块和超长块可以不管，检索时自然不会命中"], a: [1, 2, 3], e: "E错误：超长块语义宽泛，容易什么都沾一点边而被高分召回，空块还可能白吃名额，必须在入库校验里拦掉；A错误：增量必须走同一套清洗，否则脏数据从增量口子持续进入，库质量随时间退化。" },
  { q: "关于嵌入模型的维度与向量开销，正确的有？", o: ["A. 把两个模型的向量都放进同一个索引，就能自动取长补短", "B. 维度越高，单条向量的存储体积与检索时的距离计算开销越大", "C. 维度只是容量，与训练目标不匹配时高维也可能在业务上表现差", "D. 同一批文档必须用同一模型编码，不同模型的向量空间互不兼容", "E. 维度越高，检索召回率一定越高"], a: [1, 2, 3], e: "E错误：维度收益很快饱和，决定效果的是训练语料与目标函数而不是位数；A错误：不同模型各维含义完全不同，混检等于拿两套坐标系比距离，只能全库重编码后重建索引。" },
  { q: "线上准备更换嵌入模型（升级版本或换供应商），正确的说法有？", o: ["A. 只换查询侧、沿用旧文档向量，结果会出现系统性偏差", "B. 迁移期可双索引并行，用检索指标灰度对比后再切流量", "C. 把模型名与版本写进元数据，便于回滚和定位片段的编码来源", "D. 换模型只影响新入库文档，老文档的向量可以继续正常使用", "E. 需要对全库文档重新编码并重建索引，是一次离线大工程"], a: [0, 1, 2, 4], e: "D错误：新旧向量不可互相比较，老库不重编码就等于失效，这正是换型即重建的由来。" },
  { q: "嵌入模型的最大输入长度会影响什么？正确的有？", o: ["A. 超过上限时模型必定抛出错误，不会悄悄少编码", "B. 超出上限的部分常被静默截断，长文档尾部语义进不了向量", "C. 截断会让答案位于长文后半部分的查询更容易漏检", "D. 支持更长输入的模型通常伴随更高的显存与推理成本", "E. 把块长直接设成模型上限最划算，不必再管段落边界"], a: [1, 2, 3], e: "E错误：顶到上限的块会把整节内容平均成一个向量，定位反而变粗，上限不是目标块长；A错误：多数实现是截断或内部池化而非报错，静默截断比报错更危险。" },
  { q: "关于内积、余弦相似度与欧氏距离在向量检索中的关系，正确的有？", o: ["A. 因此在归一化向量上，三种度量的排序结果单调一致", "B. 不归一化时内积还包含模长信息，模长大的向量更容易拿到高分", "C. 选哪种度量与索引实现无关，任何向量库都能等价支持三者", "D. 余弦相似度对向量方向的差异不敏感", "E. 向量做 L2 归一化后，欧氏距离的平方等于 2 减去 2 倍余弦相似度"], a: [0, 1, 4], e: "C错误：HNSW、IVF 等库常只实现其中若干种，量化索引对度量的支持更有限，度量要匹配索引能力；D说反了：余弦恰好只看方向、忽略模长，所以它对方向差异敏感、对长度不敏感。" },
  { q: "关于 HNSW 索引的参数与代价，正确的有？", o: ["A. 把 ef 调到最小就能在不损失召回的前提下加快查询", "B. 每层邻居数 M 越大查询越快，因为一步能跳得更远", "C. 查询时的候选队列长度 ef 调大，召回率上升、单次查询延迟也上升", "D. 构建参数（如 efConstruction、每层邻居数 M）调大能提升图质量，代价是构建时间与内存", "E. 图索引的连接结构需常驻内存，向量规模大时内存是主要约束之一"], a: [2, 3, 4], e: "A错误：ef 过小会让搜索提前困在入口附近，召回明显下滑，速度是拿精度换的，不存在免费的加速；B错误：M 越大每步要访问的邻居越多，查询更慢、内存更高，它换来的是图的可导航性与召回。" },
  { q: "关于 IVF（倒排聚类）类索引，正确的有？", o: ["A. 靠调参可以同时做到最高召回、最小内存和最快查询", "B. IVF 不需要训练阶段，向量导入后即可直接检索", "C. 聚类中心数 nlist 太小，每个桶内候选仍然很多，加速效果有限", "D. 查询时探测的桶数 nprobe 越大召回越高，接近全库扫描时加速优势消失", "E. 向量落在两个桶的边界附近时，少探几个桶会稳定漏掉真正的近邻"], a: [2, 3, 4], e: "A错误：精度、内存、速度三者互相牵制，提升其一通常以另两者为代价，只能按业务定优先级；B错误：IVF 要先用样本训练聚类中心、建好桶结构，否则分区没有意义。" },
  { q: "向量相似度容易“看走眼”的场景包括？", o: ["A. 出现这类误判就应放弃向量检索，只用关键词匹配", "B. 两句结论相反但话题相同，向量位置可能很近", "C. 问句与对应陈述句说的是同一件事，相似度常低于两段同话题文本", "D. 只改动一个数字或型号，向量距离的变化可能小于普通改写的噪声", "E. 换用更强的嵌入模型就能彻底消除这类误判"], a: [1, 2, 3], e: "E错误：这是表示学习的结构性局限，更强模型只能缓解，仍需混合检索与重排补位；A错误：方向相反，该把语义召回与 BM25、结构化过滤、重排组合使用，而不是丢掉语义能力。" },
  { q: "关于 BM25 关键词检索与向量检索的分工，正确的有？", o: ["A. 向量检索能捞到说法不同但意思相近的段落，正好补上 BM25 的盲区", "B. 查询里出现生僻专有名词时，应该关掉向量只走 BM25", "C. 两路的分数可以直接相加得到最终名次，不需要额外处理", "D. 产品型号、法条编号、报错码这类稀有一致词，BM25 往往更稳", "E. BM25 靠词频与稀有度打分，对换了说法、没出现原词的查询无能为力"], a: [0, 3, 4], e: "B错误：关掉向量会丢掉同义改写的那批答案，正确做法是两路都召、由融合与重排定序；C错误：BM25 分数无上界、余弦相似度有界，量纲不可比，直接相加会被一路主导，要用 RRF 这类基于名次的融合或先做归一化。" },
  { q: "关于 RRF（倒数排名融合），正确的有？", o: ["A. 用了 RRF 之后，两路各自漏掉的内容会被补回", "B. RRF 保留了分数差值，因此比归一化加权更精确", "C. 它只看每条结果在各路榜单里的名次，不看原始分数", "D. 名次越靠前贡献越大，落到长尾位置时增量很小", "E. 因为不必比较不同量纲的分数，再加一路召回很容易"], a: [2, 3, 4], e: "A错误：融合只能重排已经捞上来的候选，两路都漏掉的内容不在候选集里，救不回来，得回去改切块或加召回通路；B错误：RRF 恰恰是丢掉分数、只用名次，好处是免量纲对齐，代价是抹平了分差大小。" },
  { q: "混合检索上线后召回仍然不好，可能的原因包括？", o: ["A. 融合后截得太狠，重排拿到的候选池太浅", "B. 两路混合总比单路好，看不出差别说明评测有问题", "C. 关键词一路分数天然更高会永远压过语义一路，所以应当删掉它", "D. 两路各取 Top-N 后候选高度重叠，融合只是把同一批内容排了两遍", "E. 中文分词没配好，关键词一路退化成噪声来源"], a: [0, 3, 4], e: "B错误：某一路质量很差或候选高度重叠时，融合可能不升反降，要用标注集分别量两路和融合后的 Recall@k 再决定；C错误：名次融合不存在谁永远压谁，删掉关键词一路反而把型号、编号类查询全丢了。" },
  { q: "关于重排（Rerank）为何能降低幻觉，机制上正确的有？", o: ["A. 有了重排，模型就不需要再标注引用来源", "B. 重排模型把问题与片段放在一起做交叉打分，比两侧独立编码更精细", "C. 它把真正对口的少数片段顶到前面，模型不必在杂料里自行取舍", "D. 排在前面的片段更相关也更少互相矛盾，答案与依据对不上的概率下降", "E. 重排会顺手改写片段内容，把不确定的表述删掉"], a: [1, 2, 3], e: "E错误：重排只调整顺序与取舍，不改写片段文本，改写内容属于别的环节；A说反了：重排让依据更集中，正好配合强制引用，而不是取消引用。" },
  { q: "给链路加 Rerank 的代价，正确的有？", o: ["A. 重排模型通常比向量召回更耗算力，整体延迟明显抬升", "B. 成本主要取决于送进去的候选规模，控制 Top-N 是最直接的调节手段", "C. 因为只处理已经召回的候选，重排对端到端延迟基本没有影响", "D. 重排模型的输入长度无关紧要，长片段整条送进去即可", "E. 要对每条候选做一次前向计算，候选数越多开销线性上升"], a: [0, 1, 4], e: "C错误：重排是在召回之后串行再走一遍候选集，是链路上真实的新增耗时，必须实测；D错误：重排模型同样有输入长度上限，过长片段会被截断或需要拆分，长文本还会进一步放大开销。" },
  { q: "以下哪些场景通常不必额外挂 Rerank？", o: ["A. 查询多为精确匹配（编号、型号、字段名），关键词一路已足够", "B. 对首字延迟极敏感，且实测重排带来的端到端提升有限", "C. 有人抱怨答案不准时，直接加一层 Rerank 就是对的处置", "D. 候选来自多路融合、名次不确定时不用重排，交给融合就行", "E. 库很小、Top-K 已能覆盖全部内容，检索结果本身没什么歧义"], a: [0, 1, 4], e: "C错误：要先分清是网没撒对还是鱼跑了，切块与查询表达的问题加 Rerank 也救不回；D不成立：RRF 只看名次、不做内容级判断，多路候选恰恰是重排最有价值的地方。" },
  { q: "关于召回条数与相似度阈值的设定，正确的有？", o: ["A. Top-K 越大答案一定越准，因为给模型的材料更多", "B. 设了阈值就不需要评测，阈值本身就是质量的证明", "C. 固定 Top-K 在库里根本没有相关内容时，照样会返回一堆低质片段", "D. 单靠相似度阈值卡控，对长度和话题都不同的查询很难有统一门槛", "E. 常见做法是召回稍深的候选池，再由重排截断出真正送进模型的少数几条"], a: [2, 3, 4], e: "A错误：候选越多越容易夹带无关或互相矛盾的片段，模型利用质量下降、成本还同步上升；B错误：阈值只是工程约束，合不合适要用标注集上的 Recall@k 与命中率来验。" },
  { q: "BM25 打分机制的关键点，正确的有？", o: ["A. 文档长度会参与归一化，避免长文因为词数多而天然占优", "B. BM25 能理解同义词，所以不接嵌入也能做语义检索", "C. BM25 需要先训练参数，冷启动比向量检索慢", "D. 词项越稀有（逆文档频率越大），命中它对相关性的贡献越大", "E. 词频存在饱和效应，同一词重复很多遍不会线性抬高分数"], a: [0, 3, 4], e: "B错误：它是纯词面统计匹配，同义改写完全覆盖不到，这正是混合检索要补的洞；C错误：BM25 不训练模型，统计量来自语料本身，工程上只是要为文档库建倒排索引。" },
  { q: "关于 HyDE（先让模型写一篇假设答案，再拿它去检索），正确的有？", o: ["A. HyDE 最适合关键词清晰、一句话就能精确命中的短查询", "B. 用了 HyDE 就不必再评测检索质量", "C. 它把问句与文档不像的错配，换成假文档与真文档更像的匹配", "D. 参与检索的是假设文档的向量，假设文本本身通常不进上下文", "E. 模型对该领域一无所知时，编出的假文档会把检索整体带偏"], a: [2, 3, 4], e: "A错误：这类短查询关键词一路就够，HyDE 更适合描述模糊、需要铺陈语境的难题；B错误：假文档会带来原文没有的词，必须拿标注集和原始查询对比 Recall@k，否则可能是负收益。" },
  { q: "把复合问题拆成子问题分别检索，正确的有？", o: ["A. 做了子问题拆解，最终答案的正确率就会提高", "B. 对比类、多跳类问题拆成单跳后，每一跳都更容易命中对应片段", "C. 各子查询分别召回，再汇总去重后交给模型作答", "D. 代价是检索次数与延迟成倍上升，简单问题不值得拆", "E. 拆分粒度越细越好，拆到词一级最准"], a: [1, 2, 3], e: "E错误：过细的查询丢失整体意图，捞回一堆碎片反而拼不出答案；A不成立：拆解本身可能拆错方向，每一跳的漏检还会累积到最后的答案里。" },
  { q: "多轮会话里做检索，为什么必须先补全查询？", o: ["A. 把整段对话历史原样拼成查询最好，信息量最全", "B. 模型足够强时，可以不改写直接拿原始追问去检索", "C. “那它有什么副作用”这类追问直接拿去检索，缺主语几乎无法命中", "D. 要把上文出现的实体、时间范围补进一个可独立理解的查询再检索", "E. 补全时顺手把上文确定的筛选条件写进元数据过滤，可减少无关召回"], a: [2, 3, 4], e: "A错误：历史里的寒暄、纠错和无关话题会稀释查询语义，通常只取最近若干轮或抽取关键实体；B错误：这不是模型能力问题，检索器收到缺主语的短查询就是缺信息，生成端再强也定位不到。" },
  { q: "查询改写常见的失败模式包括？", o: ["A. 用大模型做改写，检索指标不会倒退", "B. 改写失败无解，只能要求用户按标准句式提问", "C. 把口语改成书面术语后与文档用词反而不一致，召回下降", "D. 改写时引入了原文没有的新概念，检索目标被带偏", "E. 改写丢掉了限定条件（时间、地区、产品线），召回变宽变杂"], a: [2, 3, 4], e: "A错误：改写是链路上新增的一次可能出错的变换，要和原始查询做对比评测，保留原查询并行召回是常见兜底；B错误：责任不该转嫁给用户，可以回退、双路召回，或在提示里约束不得增删实体。" },
  { q: "关于“要不要做查询改写”，最合理的判断是？", o: ["A. 接上大模型改写，答案质量会提升", "B. 改写会改变用户意图，所以永远不该做", "C. 所有查询一律改写，流程统一最省事", "D. 先量原始查询的检索指标，确认表达是短板时才引入改写", "E. 改写只是关键词一路需要的，向量一路不用管"], a: [3], e: "单选。C错误：一律改写会白增延迟与出错面；E错误：向量一路同样受指代与表达影响；A、B错误：说法过于绝对，改写既可能提升也可能倒退，只能靠指标判断；D正确：先量指标，确认表达是短板才引入改写。" },
  { q: "针对用户问法与文档写法对不上的词汇鸿沟，合理的工程手段有？", o: ["A. 用改写把内部黑话翻成文档里的规范表述，再两路一起召回", "B. 完全交给嵌入模型自动解决，不需要词表也不需要改写", "C. 唯一可行的办法是要求用户改用标准术语提问", "D. 维护同义词与缩写表，在关键词一路做查询扩展", "E. 入库时给片段补上别名、旧称等可检索字段"], a: [0, 3, 4], e: "B错误：训练里没见过的缩写与内部黑话，嵌入覆盖并不稳定，词表与改写是低成本补位；C错误：把成本转嫁给用户不现实，工程应当适配用户说法而不是反过来。" },
  { q: "给大模型写查询改写的提示词，合理的约束包括？", o: ["A. 让模型顺手把用户问题答了，再把回答当查询用", "B. 改写结果必须与原查询差异越大越好，越多样板越有效", "C. 明确不得增删实体、时间与数量，防止改写引入新信息", "D. 要求输出多个候选查询而不是唯一标准答案，扩大召回面", "E. 保留原始查询一并检索，改写失败时有兜底"], a: [2, 3, 4], e: "A错误：模型先作答会把它的猜测写进查询，语料里本没有的答案会带着检索去找不存在的依据；HyDE 是有意为之且有对应风险，混在通用改写里只会放大；B错误：差异过大等于换了问题，召回反而散开。" },
  { q: "下面哪些查询是向量检索答不好、GraphRAG 更占优的？", o: ["A. 这批材料整体在讲什么趋势这类全局归纳", "B. 答案分散在彼此不相似、但实体相连的片段里，靠语义相似度捞不全", "C. 一句话就能定位的单点事实题，例如某参数的默认值", "D. 刚上线、每天大量新增与删除的文档库最该先上 GraphRAG", "E. 要跨多份文档串两跳以上才能落地的关系型问题"], a: [0, 1, 4], e: "C错误：这种一跳事实题向量或关键词就够，建图纯属多付成本；D错误：GraphRAG 的构建 token 开销高一个数量级、增量更新也贵，它更适合相对静态的中小库做深度问答。" },
  { q: "关于 GraphRAG 的构建与维护，正确的有？", o: ["A. 图建好之后基本不用维护，属于一次性静态资产", "B. 上了图就可以把向量索引撤掉，省一份开销", "C. 实体、关系、事件的抽取要靠模型逐段跑，是一次全库扫描式的高成本投入", "D. 需要预生成社区或模块摘要，才答得好全局归纳类问题", "E. 抽取质量取决于语料本身，同名实体与缩写歧义会让图连错边"], a: [2, 3, 4], e: "A错误：文档增删改都要重跑抽取并更新社区划分，图的代价是持续性的；B错误：图擅长关系与归纳，精确片段定位与关键词命中仍要靠向量与 BM25，实务上是多通路并存。" },
  { q: "关于代理式检索（Agentic RAG）与固定一次检索的取舍，正确的有？", o: ["A. 单跳事实题套上循环，只是多付延迟与费用", "B. 循环里的错误不会累积，因为每轮都能见到新证据", "C. 用了 Agentic RAG 就不需要再单独做检索评测", "D. 由模型自决要不要检索、检索几轮、是否改写查询、换哪个检索器", "E. 多跳、对比、归纳类问题，检索到发现缺口再补查的循环上限更高"], a: [0, 3, 4], e: "B说反了：前一轮选错的查询方向会带歪后续，错误会累积，这也是延迟成倍的原因之一；C错误：通路变多以后更要分别量每条通路的贡献，否则说不清是哪一步在起作用。" },
  { q: "同一个知识库里不同用户可见范围不同，权限过滤的正确做法是？", o: ["A. 先召回 Top-K 再删掉不可见内容，会让真正可用的片段数量不足", "B. Rerank 与图遍历不必管权限，前面已经过滤过一次就行", "C. 在提示词里写清不得引用无权文档，就已经足够", "D. 入库时给每个片段带上所有者、部门、密级等元数据", "E. 查询时按身份把过滤条件下推到召回之前，只在许可子集里检索"], a: [0, 3, 4], e: "B错误：各阶段的候选集都必须在许可子集内取，否则要么材料不够要么发生泄露；C错误：权限不能靠提示词约束模型，必须在检索层用代码保证，与本库不能只靠提示词的口径一致。" },
  { q: "元数据过滤用得不好的典型表现包括？", o: ["A. 加上元数据过滤以后，召回率只会变好不会变差", "B. 字段齐全时，取值口径不必再检查", "C. 过滤条件太严，许可范围内明明有答案却检索不到，表现为答不上来", "D. 时间字段缺失或格式不统一，按时间筛选时整批文档被漏掉", "E. 过滤后可用候选远小于设定深度，需要按过滤结果动态调整召回条数"], a: [2, 3, 4], e: "A错误：过滤是在缩小可命中的集合，召回率可能下降，要评估剩下的内容是否还够回答问题；B错误：字段齐不等于值可用，同一含义写成多种格式等于这个字段不存在。" },
  { q: "要求答案给出可核对的引用字段（片段编号、页码、章节），为什么能降幻觉？", o: ["A. 引用字段只是给合规看的，对答案质量没有约束作用", "B. 模型必须把结论落到具体依据上，凭空补全的空间被压小", "C. 可以程序化校验每句有无依据，忠实度指标才有产出方式", "D. 用户能一键回到原文核对，错误被发现得快，也更容易归因", "E. 有了引用字段，模型就不会再编造内容了"], a: [1, 2, 3], e: "E错误：模型仍可能挂个片段号去支持原文里没有的结论，即引用幻觉，需要自动校验引用与原文是否真的对应；A不成立：它是链路里少数能机器检查忠实度的抓手，不只是展示层的事。" },
  { q: "关于是否引入 GraphRAG、Agentic RAG 这类进阶形态，合理的判断包括？", o: ["A. 厂商宣传支持时，就应当一步到位把链路做满", "B. 基础链路还没做对时，也一定值得先把进阶形态堆上", "C. 先用标注集确认瓶颈在检索通路，而不在切块或答案生成", "D. 每加一层都要能单独量出增益，否则只是加了无法归因的复杂度", "E. 延迟与费用预算是硬约束，循环检索与图遍历都可能顶到上限"], a: [2, 3, 4], e: "A错误：外部宣传不构成技术依据，选型要由自己的问题分布和指标决定；B说反了：基础环节的漏洞会被上层机制放大，应该先把切块、混合检索、重排这三件便宜的事做对。" },
  { q: "企业知识分散在文档、工单系统和代码库三处，检索层的合理设计包括？", o: ["A. 每一路用自己的索引与过滤条件，结果再统一融合与重排", "B. 结构化数据走查询工具，文档走向量与关键词，各用所长", "C. 三路结果直接拼进上下文，谁先谁后没有关系", "D. 都接进同一个向量索引之后，来源差异就不必再管", "E. 按问题类型做路由，决定查哪几路，而不是每次都全库扫"], a: [0, 1, 4], e: "C错误：片段顺序影响模型对材料的利用，各路可信度与新鲜度也不同，必须排序并标注来源；D错误：把工单和代码硬塞进同一个文本向量索引，会同时丢掉结构化字段与权限语义，精度反而下降。" },
  { q: "关于 Recall@k、MRR、nDCG 与端到端准确率的分工，正确的有？", o: ["A. 检索指标达标以后，端到端准确率自然跟着达标", "B. 三个检索指标报一个就够，多报没有意义", "C. 端到端准确率分不清是网没撒对还是鱼跑了，无法定位出问题的环节", "D. MRR 看第一条相关结果排多前，反映依据是不是很快就被捞到", "E. nDCG 同时考虑相关性分档与名次折减，用来评估整体排序质量"], a: [2, 3, 4], e: "A错误：检索好而答案错，说明问题在拼装或生成，两层责任必须分开看；B错误：三者侧重不同（捞回多少、第一条排哪、整体排序质量），只报一个会掩盖短板，例如 Recall@k 很高但 MRR 很差就是排序缺位。" },
  { q: "标注集上 Recall@k 已经不错，但 MRR 偏低，合理的判断与对策是？", o: ["A. 应该调高生成端温度，让模型自己去利用排在后面的材料", "B. 相关内容被召回了却排在候选池后段，没进入最终送进模型的几条", "C. 排序质量不够，融合权重或重排环节需要调整", "D. 融合只看名次、不做内容级判断，相关片段可能被一批长尾副本挤下去", "E. 说明切块粒度完全错了，应当推倒重做切块"], a: [1, 2, 3], e: "E错误：Recall@k 好说明网眼已经捞到东西，问题出在排序而不是切块；A说反了：温度调高只会让模型更容易脱开依据，正解是把该看的材料排到前面。" },
  { q: "线上反馈检索看起来没问题但答案是错的，合理的排查顺序是？", o: ["A. 命中不等于被用上，接着查拼装：片段有无被预算截断、是否全堆在中段", "B. 再查生成侧：强制引用、先摘要后作答、降温度、换更强模型做对照组", "C. 人工目测几条结果就可以确认检索没问题", "D. 第一步就该换更大的生成模型，成本高但最省事", "E. 先别接受检索没问题这个前提，用标注集跑 Recall@k 与 MRR 复核"], a: [0, 1, 4], e: "C错误：主观目测挑的都是典型例子，容易把偶例当结论，要用标注集上的统计量判断；D错误：排查应由便宜到贵，换模型不可归因；最后还要怀疑评测本身，例如问题有歧义或标注只给了单一来源。" },
  { q: "关于忠实度（Faithfulness）评测，正确的有？", o: ["A. 可以用答案句子被片段支持的比例来量化，作为可回归的指标", "B. 检索指标都达标而忠实度低，责任在生成侧，即没看材料或直接编", "C. 忠实度高就说明答案符合客观事实", "D. 忠实度只能靠人工通读判断，无法自动化", "E. 它量的是答案每句能否在给定片段里找到依据，与客观事实正确性是两件事"], a: [0, 1, 4], e: "C错误：模型可以完全依据一段过时资料作答，忠实度满分而结论已失效，事实性要靠语料新鲜度与外部校验；D错误：可用引用对齐、句子级支持判定等方式自动打分，人工抽检的作用是校准这套自动判定。" },
  { q: "关于知识库的版本管理与失效内容处理，正确的有？", o: ["A. 归档、删除与权限变更要同步到索引，只增不删会让库逐渐失真", "B. 重排模型够新时，旧版本片段会自然排到最后", "C. 文档版本属于内部事务，不必写进元数据", "D. 文档改版后要更新对应片段并撤换旧版本，否则新旧内容会一起被召回", "E. 新旧片段并存时，模型可能拿着过时那条作答，形成时效性错误"], a: [0, 3, 4], e: "B错误：重排按与问题的相关性打分，不看谁更新或更权威，旧版本若恰好写得更贴合提问反而会胜出；C错误：版本与生效时间是过滤和溯源的依据，不写出来就没法在检索层排除已废止内容。" },
  { q: "给 RAG 链路做成本归因，应该统计哪些量？", o: ["A. 只看月度总成本即可，不必按请求做归因", "B. 每个回答平均触发几次检索、几轮改写、几次重排", "C. 每次检索送进重排的候选规模与片段总字数", "D. 嵌入调用在查询侧与增量入库侧各自的花费", "E. 只统计大模型的输入输出 token 就够，检索侧开销可以忽略"], a: [1, 2, 3], e: "E错误：循环检索与重排的开销会随轮数堆起来，漏掉检索侧就等于漏掉最贵的一环；A错误：没有按请求的归因就找不出哪类问题贵，也就无法定向降本，例如限制某类题型不走多轮。" },
  { q: "RAG 系统上线后，防止检索质量悄悄退化的做法包括？", o: ["A. 评测集一旦建立就永久冻结，改动会失去可比性", "B. 定期用固定标注集回归，把 Recall@k 与忠实度画成可比曲线", "C. 线上埋点记录零命中查询、无结果率与用户追问率作为弱信号", "D. 文档源变更、嵌入或重排模型升级都要灰度对比后再全量", "E. 用户没投诉，就说明链路没有退化"], a: [1, 2, 3], e: "E错误：沉默不等于没问题，退化通常先体现在指标上，等投诉已经晚了；A错误：评测集要跟着真实问题分布更新，更新时保留历史子集或分版记录，兼顾可比性与代表性，而不是永久冻结。" },
  { q: "同一批任务里模型总是选错工具或干脆不调工具，从工具定义层面排查，合理的有？", o: ["A. 参数 schema 把字段列全，模型就能填出合法参数", "B. 两个工具的描述语义重叠时，选中哪个接近抛硬币，先划清边界再谈换模型", "C. 描述里写清「什么时候不该用我」，比只写「我能干什么」更能压住误选", "D. 工具名本身就是强信号，带动作和对象的命名比 handle_data 这种含糊名字更容易被选对", "E. 描述写得越长越细，选中率就必然越高"], a: [1, 2, 3], e: "E错误：描述变长也变贵——每个工具的定义都要进上下文且每轮重发，冗余措辞还会稀释关键判别信息，实践标准是「够区分即可」；A错误：字段名只给出形状，取值范围、格式、何时该留空得靠 enum、pattern 和说明补，光列字段照样漏填错填。B、C、D 成立：选择靠语义匹配，边界、反例、命名都是在给这个匹配提供抓手。" },
  { q: "模型产出的工具调用参数在真正执行前，客户端合理的处理有？", o: ["A. 参数正确性交给模型自觉，提示词里写一句「务必填写正确」就够了", "B. 重试必须有次数上限，超限就判定失败并上报，否则容易陷入报错与重试的死循环", "C. 校验失败时把具体错误（哪个字段、期望什么格式）回喂给模型，比只回「调用失败」更容易一次改对", "D. 对高危字段（目标路径、金额、收件人）单独设白名单或二次确认，不能只看格式合法", "E. 先按 JSON Schema 本地校验，缺必填字段或类型不对就别把这次调用发出去"], a: [1, 2, 3, 4], e: "A错误：提示词只是概率性约束，格式与取值边界必须由代码兜住，这和「权限不能只靠提示词」是同一件事。E、B、C、D 成立：模型输出的只是调用意图，执行前的确定性校验与有界重试属于执行框架的职责，回喂的错误信息还要具体到字段。" },
  { q: "关于一轮内并行发起多个工具调用，正确的有？", o: ["A. 模型有时会误判依赖关系，把本该串行的两个调用并发发出去，执行前值得按参数来源检查一遍", "B. 两个并行调用改同一资源时，终态取决于谁后落盘，需要锁或改成串行", "C. 并发度足够高时，工具调用的先后顺序对最终状态没有影响", "D. 彼此无依赖的只读调用适合并行，能把多次串行等待压成一次往返", "E. 有依赖的调用（先查出 ID、再按 ID 改）不能并行，后一个的参数来自前一个的返回"], a: [0, 1, 3, 4], e: "C错误：并发只消除等待时间，不消除语义依赖，副作用的执行顺序照样决定最终状态。D、E、A、B 是同一条：能不能并行取决于数据依赖和写冲突，而不是技术上能不能同时发出去。" },
  { q: "自主循环的终止设计，合理的有？", o: ["A. 最大迭代次数是兜底护栏，触顶时要把任务标记为未完成并留痕，而不是静默交出半成品", "B. 达到上限时把最早的几轮上下文裁掉继续跑，等价于放宽上限，没有额外代价", "C. 同一工具、同一参数被反复调用是典型的空转征兆，可以用去重或冷却策略打断", "D. 时间预算应按整轮任务分配，而不是只给单次模型调用设超时", "E. 除了模型自己宣布完成，还应有外部可验证判据：测试通过、目标文件存在、返回码为零"], a: [0, 2, 3, 4], e: "B错误：裁掉历史等于丢掉「为什么走到这一步」的依据，模型更容易从头再来或反复做同一件事，正确处置是收敛并交人工。E、A、C、D 成立：终止条件必须是多路的——成功判据、护栏、空转检测、总预算，缺一个就有对应的翻车方式。" },
  { q: "长任务里上下文被工具输出挤爆，清理旧结果时正确的做法有？", o: ["A. 失败调用的报错信息应当立刻从上下文里删掉，免得模型照着错误信息学坏", "B. 大输出（整份日志、全量列表）落盘留引用，上下文里只放路径与摘要，需要时按需读回", "C. 已被后续步骤消费掉的结果可以压成一句结论，原始 JSON 没必要每轮重发", "D. 裁剪会破坏前缀缓存命中，所以策略上应尽量只动尾部，别每轮都改历史开头", "E. 最近一轮的工具结果可以放心删掉，模型需要时会自己重新调一次"], a: [1, 2, 3], e: "E错误：最新的结果往往正是当前决策的依据，删掉之后模型只能凭记忆瞎猜或多跑一次工具，成本和错误率一起上升；A错误：报错是模型换策略的唯一线索，删掉它等于让同一次失败重新发生，该瘦身的是体积巨大的成功输出，不是失败痕迹。B、C、D 成立：清理标准是「后面还会不会被引用」，而不是「够不够旧」。" },
  { q: "Agent 跑到第 40 步因进程崩溃中断，关于恢复策略，正确的有？", o: ["A. 恢复时跳过哪些步骤，应以「这步有没有副作用、有没有留下可核对的产物」为准", "B. 从头重跑总是更安全，因为它保证了状态一致", "C. 已发出的通知、已提交的订单这类非幂等步骤，恢复时不能盲目重放，要先查外部真实状态", "D. 检查点越细恢复越快，但写状态的开销也越大，要按单步失败代价取舍", "E. 能不能断点续作，取决于步骤状态有没有持久化，只活在内存上下文里就没有恢复可言"], a: [0, 2, 3, 4], e: "B错误：从头重跑会把已完成的外部副作用再做一遍，重复发通知、重复扣款就是这么来的，一致性并不更好。E、A、C、D 成立：可恢复性是设计出来的，不是重试重试就有的。" },
  { q: "循环里同一类错误连续出现三次，最合理的处置是？", o: ["A. 把报错原样回传让它再试一次，这是自我修正的标准做法", "B. 调高采样温度，让它换几种写法试试", "C. 跳过这一步继续往下走，最后整体看结果", "D. 把最大迭代次数翻倍，多给几次机会总会成功", "E. 判定当前策略缺信息或缺能力：换手段（补检索、换工具、再拆任务）或升级人工"], a: [4], e: "单选。D错误：次数翻倍的典型结局是把同一个错误多犯几遍，预算烧光而状态不变；A错误：原样回传只对偶发失败和参数错有效，对系统性缺信息无效，连续三次同类失败本身就是信号；B错误：温度只改变措辞分布，不会补上它不知道的事实；C错误：带着缺口继续往下走，错误会在下游步骤放大，最终产物更难定位到是哪一步坏的。" },
  { q: "关于在循环层面对「本轮允许调哪些工具」做工程约束，正确的有？", o: ["A. 写操作要确认、读操作直通，这类分级是循环层的护栏，不该指望模型自觉", "B. 按阶段裁剪可见工具集（只读阶段不暴露写操作），既降低误调也缩小进上下文的 schema 体积", "C. 是否允许并行、是否必须调某个工具，这类约束是自由度与可预测性之间的可调旋钮", "D. 在只该收尾的阶段强制禁止调用，比在提示词里写「不要再调工具」更可靠", "E. 工具集合在会话开始时定下就不能再动，运行中裁剪必然让模型报错"], a: [0, 1, 2, 3], e: "E错误：按阶段动态增删工具是常规做法，协议层也支持工具列表变更，关键是变化幅度要小且要给出说明，而不是绝对不能动。D、A、B、C 成立：把「不该发生的调用」交给代码约束，比交给提示词的概率稳得多。" },
  { q: "关于 MCP 里 Resources 与 Tools 两类原语的分工，正确的有？", o: ["A. 本该是 Resource 的读取动作塞进 Tool，会让「拿上下文」也变成一次调用往返", "B. Resources 是只读的上下文来源（文件、工单、配置），Tools 是可能带副作用的动作", "C. 把「查数据」做成 Resource、把「写数据」做成 Tool，符合最小权限的切法", "D. Resource 必须由模型显式调用才能读到，宿主不能预先把它拼进上下文", "E. 两者区别只是命名习惯，实现上完全可以互换"], a: [0, 1, 2], e: "D错误：可被引用、可预先注入正是 Resource 与 Tool 的分界，它不需要一次调用往返；E错误：能不能缓存、要不要审批、出错算谁的，三条处理路径都不同，混用等于主动放弃这层区分。B、C、A 成立：分界的实用价值就在于「数据」和「动作」的权限与审计要求天然不一样。" },
  { q: "MCP server 收到调用请求后，合理的自我约束有？", o: ["A. 每次调用记录调用方、参数摘要、结果与耗时，出问题才能定位到具体一步", "B. 即使参数完全合法，server 也有权拒绝它认为不安全的调用", "C. 参数合法就意味着业务上安全，server 不必再作判断", "D. 高危工具应在准入与确认机制上设卡，而不是只在工具描述里写一句「请谨慎使用」", "E. 不能假设客户端已经校验过：类型、取值范围、路径穿越这类检查要在 server 侧再做一遍"], a: [0, 1, 3, 4], e: "C错误：合法只保证能解析，不保证该执行，一条格式完全正确的删除命令照样是事故。E、A、B、D 是同一条：server 是唯一真正动手的一方，校验和审计不能外包给模型或宿主。" },
  { q: "同时接入多个 MCP server 后常见的工程问题，正确的有？", o: ["A. 工具越多，选错或干脆不调用的概率越高，按角色裁剪接入范围是常规手段", "B. 不同 server 提供同名工具时，宿主一般靠命名空间或前缀区分，模型看到的是改写后的长名字", "C. 名字被加前缀后语义信号会变弱，原本清晰的动词被淹没在限定词里", "D. 两个 server 都能干同一件事时，选中率下降、行为不稳定，需要在描述里写明分工或按场景只启用一个", "E. 多接一个 server 只增加能力，不增加任何上下文负担"], a: [0, 1, 2, 3], e: "E错误：每个工具的名字与 schema 都要进上下文并每轮重发，这是实打实的输入成本。B、C、D、A 成立：重名与功能重叠不会报错，只会悄悄变差，所以很难在联调阶段被抓出来。" },
  { q: "为压制「几十个工具全量塞进上下文」造成的 schema 膨胀，合理的做法有？", o: ["A. 膨胀的代价不只是花钱，还包括选择质量下降和任务上下文被挤占", "B. 工具数量不是问题，反正现代模型上下文窗口足够长", "C. 先只暴露少量高频工具，其余通过一个检索入口按描述查找到后再动态挂载", "D. 按阶段或技能包分组，每轮只带上当前任务真正需要的那一组", "E. 精简 schema：砍掉模型用不上的字段，把冗长说明压成一句可判别的话"], a: [0, 2, 3, 4], e: "B错误：窗口够长不等于塞满无害，工具说明会挤掉真正的任务信息，而且这些内容每轮都要重新计入输入。C、D、E、A 成立：这一层本质就是按需加载上下文，思路与常驻、按需、检索的分层一致。" },
  { q: "第三方 MCP server 的工具描述被当成攻击面，工程上合理的处置有？", o: ["A. 描述内容会随 server 版本更新而变，需要锁版本并把变更送审查", "B. 接入走准入流程：审 server 来源、审工具清单、审描述文案，而不是运行时随手加一个", "C. 能外发数据、能执行命令的工具，其描述变更应当按高危改动触发告警", "D. 描述格式合法就不必人工评审，模型自己会分辨恶意内容", "E. 描述会被原样拼进模型看到的工具定义，等于拿到了接近系统提示词的地位，不能当普通文案对待"], a: [0, 1, 2, 4], e: "D错误：模型对「来自工具定义」的文本天然少怀疑，这正是它比网页里捡来的内容更危险的地方，注入防御的结论在这里同样成立。E、A、B、C 是同一条：把工具描述当代码管，评审、锁版本、监控变更。" },
  { q: "工具调用可能跑很久（拉大报表、触发一次构建），关于超时与长任务处理，正确的有？", o: ["A. 判超时时按总时长设阈值，比按有没有新进展设阈值更合理", "B. 把客户端超时设得比后端最长耗时更大，就万无一失了", "C. 长任务返回的部分结果应当保留，模型可据此决定继续等、换路径还是交人工", "D. 超时只代表这一侧不再等待，不代表远端没有在执行，直接重发可能造成重复作业", "E. 长任务更适合拆成提交与查询两个工具，让模型拿任务 ID 轮询，而不是把一个调用挂在那里"], a: [2, 3, 4], e: "A错误：总时长阈值会把仍在推进的长任务误杀、把已经卡死的调用放过，有进度信号时就该按进展判超时；B错误：更长的超时是把失败变成挂起，占着循环和整轮预算，上游网关与并发限制也不会因为你设大就跟着放大。D、E、C 成立：长任务的解法是把同步等待改造成可恢复的异步状态。" },
  { q: "会话中途 MCP server 的工具集合发生变化（新增、下线、改 schema），合理的处理有？", o: ["A. 正在执行的那次调用要有明确策略：按旧 schema 跑完还是中止，不能留下半套参数", "B. 工具列表变化只影响新会话，进行中的会话不受影响", "C. 变更后模型历史里仍写着旧的工具说明，可能长期误导后续几轮", "D. 频繁变更不利于复现问题，排查期间应当把 server 版本固定下来", "E. 缓存了工具列表的宿主应监听变更通知并刷新，否则模型会继续调已经下线的工具"], a: [0, 2, 3, 4], e: "B错误：变更对进行中的会话同样生效，这正是循环里必须处理的不确定性来源之一。E、A、C、D 成立：共性在于模型的世界观来自上下文快照，快照过期行为就会漂移，而调试需要可复现。" },
  { q: "Parallelization 的投票变体（同一任务多份输出取多数）在哪些情况下不涨反亏？", o: ["A. 任务难度远超模型能力时，多采几份得到的只是分布更散的噪声", "B. 投票把延迟和 token 按份数放大，涨幅不明显时性价比直接转负", "C. 采样次数加到足够多，模型的系统性偏差会被抹平", "D. 各候选的错误高度相关时，投票只是把「共识性的错」固化成结论", "E. 投票只能用在有唯一标准答案的任务上，开放性写作一律不能碰"], a: [0, 1, 3], e: "C错误：多次采样能压掉随机错，压不掉共同错，偏差来自模型本身而不是来自某一次抽样；E错误：开放任务同样可以多次生成再按维度择优，只是判据从「答案是否一致」换成打分聚合，不是禁区。D、A、B 成立：投票买到的是方差抑制，前提是错误彼此独立，而且要为这份独立性付费。" },
  { q: "Routing 模式里上游分类把请求分错类目，后果与缓解说法正确的有？", o: ["A. 分错类目只影响这一条请求，对整体质量没有系统性影响", "B. 两类错分的代价不对称，阈值该按业务损失定，而不是按总体准确率定", "C. 分类准确率过九成，路由就比统一用强模型省钱", "D. 给路由层单独建评测集并按类目看混淆矩阵，比只盯一个总准确率更能暴露坑", "E. 置信度低时走兜底路径（统一交给强模型或转人工），比强行选一条分支更划算"], a: [1, 3, 4], e: "A错误：分错的请求会一路走完下游分支，错的检索、错的模板、错的回答全都被计入同一件事，用户感知到的正是这类整体塌方；C错误：省多少取决于错误类目的流量占比与错分后的返工成本，准确率高但错的那批集中在高价值场景，账照样亏。E、B、D 成立：路由层本质是个 classifier，要按 classifier 的方式评测和兜底。" },
  { q: "关于五大工作流模式的适用边界与常见错配，正确的有？", o: ["A. 评估-优化的前提是「好坏讲得清」，缺可执行标准时循环只是在两种口味之间来回摆", "B. 路由适合用在完全没有分类信号的开放任务上，让模型自由决定走哪条链", "C. 编排-工作者的价值在于子任务无法预先枚举，代价是分解质量取决于中心模型", "D. 分段并行与投票的区别只在于并行度大小，与子任务能否独立无关", "E. 步骤本来就能枚举清楚的活，不必交给编排器动态分解，固定链路更便宜也更好定位"], a: [0, 2, 4], e: "D错误：分段（sectioning）要求子任务彼此独立，投票（voting）恰恰是对同一个任务取多份，两者的分界是任务结构而不是并发数；B错误：没有分类信号就没有路由的输入，硬做只会退化成一次额外的模型调用，那种场景该用动态决策或干脆单次调用。E、A、C 成立：模式不是越花哨越好，能预定义就用预定义，说不清标准就别上闭环。" },
  { q: "下列场景里，更应当钉死成固定工作流而不是交给自主循环的有？", o: ["A. 生成营销活动文案初稿：没有固定步骤，多出几版让人挑更合适", "B. 月结对账：步骤固定，每一步都要留下能对证的证据链", "C. 把批量工单按模板转成结构化记录：字段可枚举，输出还要过 schema 校验", "D. 排查一个从未见过的线上故障：现象发散，需要边试边缩小范围", "E. 按制度发放补偿：金额规则写死在条文里，超出规则必须转人工，路径要求可复现"], a: [1, 2, 4], e: "D错误：路径不可预知的探索任务正是自主循环的用武之地，钉死流程反而把聪明的做法挡在门外；A错误：这里没有需要审计的确定路径，也不需要复现，多生成再人工择优比编排更省。B、C、E 成立：共同特征是步骤可枚举、要求可复现，而且出问题必须能在日志里指认到具体哪一步。" },
  { q: "编排器-工作者模式里，「把各分支结果汇总回中心模型」这一步的代价，正确的有？", o: ["A. 中心模型看到的常是工作者自述的结论而非原始证据，出错时难以复核", "B. 汇总本身是一次长输入调用，多份中间结果拼回去，成本又拉回来一截", "C. 工作者越多总成本必然越低，因为任务被平摊掉了", "D. 每个分支的上下文都要先压缩再交回去，压缩窗口就是丢信息的窗口", "E. 要求所有工作者统一输出 JSON，汇总阶段就不会引入新错误"], a: [0, 1, 3], e: "E错误：统一格式只解决「能不能解析」，解决不了两份结论互相冲突、或者结论本身就是错的；C错误：分支数增加时，固定开销与汇总输入都在涨，平摊的是单步工作量而不是总量。D、A、B 成立：汇总层的典型病灶是信息有损加上责任转移，设计时要显式规定交回什么、证据留在哪里。" },
  { q: "评估-优化循环跑了几轮仍不收敛，值得怀疑的点有？", o: ["A. 分数在两个维度之间来回摆，这轮改好的地方正是下轮被扣分的地方，说明标准彼此冲突", "B. 把最大轮数调大，这类循环最终会收敛", "C. 反馈只有分数没有可执行的修改点，生成器等于在随机游走", "D. 评估标准写得越抽象，循环收敛得越快，因为留给模型的自由度更大", "E. 评估器与生成器同源、偏好一致，对同一类问题天然看不出毛病"], a: [0, 2, 4], e: "D错误：抽象标准（再专业一点、更流畅一点）让模型每轮都能自认为已达标，是不收敛的常见根因，不是加速器；B错误：不收敛的原因在判据与反馈质量上，加轮数只是把同一个震荡多跑几遍，预算翻倍而已。E、A、C 成立：这三条分别对应裁判不可信、目标函数自相矛盾、梯度方向缺失，都要靠改评估器或改标准来治。" },
  { q: "在提示链的中间步骤加程序化检查门（Gate），说法正确的有？", o: ["A. Gate 加得越多，链条准确率就越逼近百分之百，因为每次拦截都在纠错", "B. 用确定性代码校验格式、必填项、引用是否存在，比再叫模型自审一次更可复现", "C. 每个 Gate 都增加一次延迟和一个失败出口，链条越长越要提前设计「不过门怎么办」", "D. 一旦流程里出现 Gate 判断分支，这套编排就变成自主 Agent 了", "E. Gate 的价值是把错误挡在早期，免得后面几步在错误前提上继续加工"], a: [1, 2, 4], e: "A错误：Gate 自身有误杀率，拦下来的东西要么回炉要么转人工，堆到后面整体通过率反而掉下来；D错误：分支由代码按预设规则决定，流程控制权仍在代码手里，判断标准是模型会不会在没有新指令时自己推进下一步。E、B、C 成立：Gate 是拿确定性换可定位，代价是延迟与需要设计回退路径。" },
  { q: "想用路由把简单问题分给小模型、难题给强模型来压成本，落地时要警惕的有？", o: ["A. 该先量基线：统一用强模型的成本是多少，加路由后省多少、错多少，再决定这一层值不值", "B. 路由层自己也是一次模型调用，它的延迟和费用要计进总账", "C. 路由准确率够高之后，下游就不需要再做质量监控和兜底了", "D. 「看起来短」与「实际简单」并不同源，一句话的业务问题可能牵扯最多上下文", "E. 难题被分给小模型是质量事故，简单题被分给强模型只是多花钱，两者不该用同一个阈值衡量"], a: [0, 1, 3, 4], e: "C错误：分错的那批永远存在，而恰恰是漏网的难题最伤体验，下游要留出「答得勉强」的二次升级通道。D、E、A、B 成立：这一层的收益是省在批量上的，成本是错在个案上的，没有基线数据和兜底就上线，通常先亏后知。" },
  { q: "给 Agent 组织上下文时按常驻、按需、检索三层来放内容，划分判据合理的有？", o: ["A. 越关键的内容越应该放进检索层，因为反正随时都能取回来", "B. 每轮都用得到、且一改就影响全局行为的内容，才值得占常驻预算", "C. 只在某类任务里才需要的操作步骤与命令细节，挂成按需加载，别长期挤占窗口", "D. 体量大、变更频繁、只与少数问题相关的知识走检索，不要塞进指令层", "E. 分层带来的隐性收益是每层的更新节奏和审核强度可以各不相同"], a: [1, 2, 3, 4], e: "A错误：检索层的代价是「可能取不到」——召回失败、片段切坏、查询没对上，关键约束放这里等于赌检索质量，所以最硬的红线要放常驻。B、C、D、E 成立：三层不是按重要程度排，而是按使用频率、体积与变更速度排。" },
  { q: "子 Agent 向主循环汇报结果，粒度上常见的坑有？", o: ["A. 合适的结构是结论、关键证据的位置、未解决项，细节留在可回读的文件里", "B. 把整段执行日志原样贴回去，主上下文几轮就被灌满，后面每一步都在为噪声付费", "C. 汇报越简短越好，主模型需要时会自己再去查一遍", "D. 只回一句「已完成」，主控既无法判断可信度，也无从决定下一步", "E. 漏掉「执行了哪些不可逆动作」，等到需要回滚时才发现手里没有线索"], a: [0, 1, 3, 4], e: "C错误：主控通常不会去查，也不该去查——它没有子 Agent 的现场，重查等于把刚才的工作再做一遍，缺的信息只能靠汇报方补全。B、D、E、A 成立：汇报是跨上下文边界的唯一通道，太厚挤爆窗口，太薄让下游失去判断依据。" },
  { q: "多个执行体并行改同一批文件，关于冲突与处置，正确的有？", o: ["A. 按文件或模块划清写入范围，或者各自在隔离副本里改完再合并，是两类常规解法", "B. 合并时的冲突应交给掌握全局上下文的一方裁决，让子 Agent 各自决定会越改越乱", "C. 两个执行体用同一个模型，写入就不会互相冲突", "D. 后写入的一方会覆盖前者，而且不会报错，往往只能靠事后 diff 才发现", "E. 写冲突只发生在同一次工具调用内，跨轮次的先后写入是安全的"], a: [0, 1, 3], e: "E错误：写入是持久化到外部系统的，跟是不是同一次调用无关，第 3 轮和第 30 轮的两次全量写照样是后者覆盖前者；C错误：冲突来自共享的存储状态，与模型是否同源毫无关系。D、A、B 成立：并行度越高越要在编排层显式约定谁有权写哪一块，以及冲突谁来合。" },
  { q: "多 Agent 协作时把规格与任务状态放进共享库，实际价值在于？", o: ["A. 出错时能回溯「当时是按哪一版做的」，而不是只能追问当时的提示词", "B. 把提示词里的一段话变成可版本化、可 diff 的对象，评审成本因此前移", "C. 有了共享规格就不再需要验收，执行体会自动对齐", "D. 各执行体对「做成什么样」有同一个依据，不至于人手一份自己的理解", "E. 这套机制只对十几个 Agent 以上的大型系统有意义，两三个执行体用不上"], a: [0, 1, 3], e: "E错误：价值与 Agent 数量无关，两个执行体就已经可能各自脑补出不同版本的需求，共享库首先是防漂移；C错误：规格只是判据，判据不会自己执行，验收动作仍然必须由人或测试来落地。D、A、B 成立：共享的是唯一真相来源与状态可见性，这两样也正是并行工作不退化成重复劳动的前提。" },
  { q: "把一个粗粒度 Agent 拆成几个子 Agent 后成本不降反升，可能的原因有？", o: ["A. 汇总调用可以省掉，让各子 Agent 直接对最终产物负责即可", "B. 拆得足够细，每步上下文变小，总 token 会随之下降", "C. 并行只缩短墙钟时间，不减少总计算量，而账单看的是后者", "D. 每个子 Agent 都要重发自己的系统提示与工具定义，固定开销按份数叠加", "E. 交接要把上下文压成文字，压不掉的就只能重查，重复劳动变成额外的检索与调用"], a: [2, 3, 4], e: "A错误：总得有人把各分支拼成一个答案，省掉这一步就变成把冲突直接抛给用户，或者干脆没人负责；B错误：单步上下文确实变小，但固定开销、交接与汇总都是新增项，多数拆分的净效果是总量上升。D、E、C 成立：拆分的收益主要在质量与隔离，指望它直接省钱通常要失望。" },
  { q: "让子 Agent 在干净上下文里跑任务（而不是共享主对话），正确的有？", o: ["A. 子 Agent 看不到主对话里的隐含约定，交接说明必须显式写全，否则它会按自己的理解做完", "B. 隔离后更难复现问题：出错时手里只剩一份汇报，没有当时的完整现场", "C. 同时跑多个子 Agent 会让在途上下文成倍增加，峰值成本与限流压力一起上来", "D. 上下文一旦隔离，两个子 Agent 给出的结论就天然彼此一致", "E. 主循环不被长输出污染，隔离的首要价值是质量与可维护性，不是省钱"], a: [0, 1, 2, 4], e: "D错误：恰恰相反，隔离让两边各自推理、互不知情，结论冲突的概率上升，所以才需要统一规格与一次汇总核对。E、A、B、C 成立：隔离是把噪声挡在门外，代价是共享的信息也得重新付一遍，两头都要算。" },
  { q: "线上多 Agent 系统出错后定位特别慢，原因与对策合理的有？", o: ["A. 这类问题主要靠把日志级别开到最详细来治，trace 的结构并不重要", "B. 把每一跳的输入、输出、耗时与所用版本落成一条可回放的链路，才是可持续的做法", "C. 把 Agent 数量减到 1 个，这类定位困难就消失了", "D. 错误常出在交接处：上游给了个格式合法但内容错的结论，单看任一 Agent 的输出都不像有问题", "E. 每步都由模型决定，没有输入快照就几乎无法复现，重放成本高"], a: [1, 3, 4], e: "A错误：海量原始日志没有边界与关联，反而更难看出是哪一跳坏的，需要的是按调用链组织起来的结构；C错误：单体流程一样会出现「这一步输出错了」的问题，减 Agent 只是少了交接类故障，不等于可定位。D、E、B 成立：多 Agent 的调试成本来自边界多、状态散、不可复现，三者都要靠编排层留痕来兜。" },
  { q: "长任务跑到中途把前几十轮压缩成一段摘要，常见的失真有？", o: ["A. 摘要写得足够详细，就不必再保留原始记录的可回读入口", "B. 压缩点应选在有外部产物可回读的位置（提交、落盘之后），而不是随手每十轮一次", "C. 摘要保得住结论，丢掉的常是精确量：路径、版本号、报错原文，而下一步往往正好要用它们", "D. 压缩之后模型并不知道自己丢了信息，会照着摘要里残留的印象继续往下编", "E. 摘要由同一个模型生成，它对「什么算重要」的判断可能与后续步骤的需要不一致"], a: [1, 2, 3, 4], e: "A错误：摘要永远是有损压缩，被省掉的那一行恰恰可能是下一步的唯一依据，所以保留可回读的原始产物比把摘要写长更重要。C、D、E、B 成立：失真的根源是「谁判断重要性」与「信息还能不能拿回来」，选对压缩点能把损失关在可恢复的范围内。" },
  { q: "一个跑二十轮的工具循环，token 消耗远大于二十次独立的单轮问答，原因有？", o: ["A. 命中前缀缓存后，历史那部分就不必再按输入计费，循环长度对账单的影响可以忽略", "B. 轮数越多，最近几轮的输入里就越可能塞满早已无用的中间结果", "C. 每轮输出很短时，总成本主要由输出累加决定，与历史长度关系不大", "D. 每轮都要把此前的完整历史重新作为输入发一遍，累计输入随轮数近似平方增长", "E. 工具返回值往往比模型的自然语言输出长得多，一次大输出会长期挂在历史里"], a: [1, 3, 4], e: "A错误：缓存改变的是重复计算与一部分单价，历史仍占着窗口位置和整轮预算，长轮的账单照样被它撑起来；C错误：这类循环的账单大头恰恰是每轮重发的输入，输出短并不会让它变便宜。D、E、B 成立：放大来自循环结构本身，所以控制轮数和控制单轮长度同样重要。" },
  { q: "工具调用失败后要重试，关于幂等的处理，正确的有？", o: ["A. 重试要带幂等键，让服务端认出这是同一个意图，避免重复扣款或重复建单", "B. 没收到响应就等于远端没有执行，可以放心原样重发", "C. 服务端回了成功状态码，就说明业务一定办成了，不必再核对", "D. 退避加抖动，避免同一批失败请求在同一时刻集体重发，把下游彻底打垮", "E. 失败要分清三种：没发出去、发出去了没收到响应、收到响应但业务没成，三者的重试语义完全不同"], a: [0, 3, 4], e: "B错误：没收到响应是最危险的一类，请求很可能已经在远端执行成功、只是回程丢了，直接重发就是重复副作用，正确做法是先回查外部状态；C错误：传输层成功只说明请求被接住了，业务是否达成要看返回内容里的状态字段，必要时还得再查一次。E、A、D 成立：幂等是设计出来的，靠键与状态查询保证，不靠运气。" },
  { q: "Agent 服务要保 SLA，超时或超载时的降级设计，合理的有？", o: ["A. 超时阈值设得足够长，就不需要降级设计", "B. 降级路径要事先定义并可测：换更小的模型、回退固定工作流、返回部分结果并转人工，而不是临时兜圈", "C. 降级换用更小的模型不必额外验证，反正只是质量略差一点", "D. 回退到固定工作流的前提，是这条不依赖模型动态决策的路径本来就覆盖该场景", "E. 降级要在指标里可见：降级率、降级后的完成率，否则系统带病运行没人知道"], a: [1, 3, 4], e: "C错误：没验证过的降级等于一次无人评审的上线，平时不触发、一触发就全线变差，照样要走回归；A错误：拉长超时只是把失败推迟成挂起，SLA 该超还是超，请求在队列里堆得只会更久。B、D、E 成立：降级的本质是预先决定「保不住质量时保什么」，并且要可观测、可回退。" },
  { q: "评测一个已经上线的 Agent，最该当主指标的是？", o: ["A. 用户对单次回答的点赞率，样本越大越可信", "B. 平均端到端延迟，因为它最贴近用户体验", "C. 平均完成任务所需的步数，越少说明系统越聪明", "D. 有外部可验证判据的任务完成率，并按任务难度分层统计", "E. 工具调用总次数，因为它直接反映做了多少工作"], a: [3], e: "单选。C错误：步数可以被反向优化——少做几步就少犯几个错，但任务并没有做成；E错误：调用次数是成本指标，多调也可能是瞎调，不能代表质量；A错误：点赞衡量的是满意度，用户往往看不出中间哪一步其实走错了，事情办没办成才是关键；B错误：延迟是 SLA 指标，快而错不是好。D 成立：主指标必须落在可验证的完成上，而且要分层看，否则会被大量简单任务稀释。" },
  { q: "从「单步正确率会随步数连乘」这个事实出发，工程上成立的推论有？", o: ["A. 人工检查点该压在不可逆、难回滚、影响面大的动作之前，而不是均匀分布", "B. 检查点越密整体完成率越高，因为每一道都能拦住错误", "C. 把长任务切成可独立验收的短段，收益在于错误能在段内被发现，而不是靠运气跑完全程", "D. 单步准确率提得足够高，任意长的任务都能全自动跑完，不必留人工", "E. 缩短关键路径本身就是提效手段：能一步拿到的信息别绕三步去猜"], a: [0, 2, 4], e: "B错误：每道检查自带延迟与误杀，拦下来的要回炉或转人工，密到一定程度整体通过率反而掉下来；D错误：单步再高也扛不住步数连乘，而且不可逆动作的风险不能靠概率达标豁免，这正是长任务必须留人工兜底的理由。E、A、C 成立：少跑几步、把检查点放在代价最高的位置、把长度切到能验收的粒度，是真能拉高完成率的三条手段。" },
  { q: "几百个 Agent 任务并发跑，撞上供应方速率限制后，合理的做法有？", o: ["A. 客户端对速率限制无能为力，把超时调大就行", "B. 把重试次数与重试预算当成两个独立配额来管，避免一批任务全在退避里反复排队却没有进展", "C. 公平调度值得做：别让一个离线大批量把配额吃光，把交互型请求全挤在队列里", "D. 在编排层设全局并发上限与排队，而不是让每个任务各自猛重试，否则失败重试会形成二次流量尖峰", "E. 按供应方返回的速率信息退避，并给整批任务留下可续跑的队列状态或游标"], a: [1, 2, 3, 4], e: "A错误：超时调大只会让请求更久地占住并发额度，速率限制是配额问题而不是等待问题，必须在调用侧做流量整形。D、E、B、C 成立：批量任务的失败是相关的（同一时刻一起被限），所以退避、预算、队列状态与公平性都要在编排层统一管，交给每个任务自己处理只会放大尖峰。" },
  { q: "给 Agent 功能做成本核算与归因，合理的做法有？", o: ["A. 人工审核的时间不该计入成本，那是固定工资，与单次任务无关", "B. 平摊到「每次对话」是够用的粒度，任务复杂度的差异会被平均掉", "C. 成本要和完成率放在一起看，单位成本下降也可能只是任务被悄悄做少了", "D. 单次任务成本要含输入输出 token、工具与检索调用，以及失败重跑的那部分，只记成功那次会低估", "E. 按功能、租户、用户三个维度打标，才能回答「哪一块在烧钱」，只有总量数字没法决策"], a: [2, 3, 4], e: "A错误：人审往往是这条链路里最贵的可变成本之一，不算它就会得出「自动化一定更便宜」的错误结论，越是需要检查点的功能越要先算这笔账；B错误：平均值掩盖长尾，一个长任务可能抵得上一百次闲聊，不按任务与租户拆开就找不到成本来源。D、E、C 成立：核算的目的是能定位、能做取舍，而不是产出一个总数。" },
  { q: "给一次 Agent 任务设成本预算与止损线，合理的有？", o: ["A. 单步成本足够低时，整轮任务可以不设预算上限", "B. 预算应按任务类型分档，简单问答和长程重构共用一个上限会两头不讨好", "C. 超预算率本身是有用的指标，它能暴露哪类任务的拆解方式有问题", "D. 触顶时要输出已完成部分与未竟事项，而不是只留一句「预算用完了」", "E. 单任务要有预算上限（token 或费用），触顶就收敛并交人工，而不是等它自然结束"], a: [1, 2, 3, 4], e: "A错误：单步便宜、轮数失控照样能把账单拉平，预算约束的对象是整条链路而不是某一步。E、B、C、D 成立：预算是护栏的一种，价值不只在省钱，触顶时留下什么直接决定人工接手还要花多少力气。" },
  { q: "按正文口径给团队挑编排平台，判断合理的有？", o: ["A. 平台选定后就不必再管提示词和检索质量，这些由平台内置解决", "B. 选型前先列硬约束：数据能否出域、要不要自托管、流程定义能否导出，再比功能清单", "C. 要把 AI 接进十几个既有系统的流程里、还要能自托管，n8n 这类节点驱动、集成面最广的更贴合", "D. 重点是应用编排加知识库、要给企业做 LLMOps 治理，Dify 主打的就是这一段", "E. 想快速搭个多智能体 demo 上线到自家生态，Coze 这类轻量低代码更省工时"], a: [1, 2, 3, 4], e: "A错误：平台提供的是编排与集成的骨架，效果仍取决于工具描述、检索质量和提示词，这三样换哪个平台都得自己磨。C、D、E、B 成立：三者的定位差别在跨系统流程自动化、应用编排与知识库、轻量快速搭智能体，先按硬约束筛掉不合格的，再比功能清单，比照着宣传页挑靠谱。" },
  { q: "把 Agent 平台与模型一起自托管，动机与代价说法正确的有？", o: ["A. 部署到私有环境后就不必再做权限控制，内网本身就是一层隔离", "B. 代价不只是机器钱，还包括推理优化、版本升级与可用性值守这些长期投入", "C. 跑在私有环境里，注入与越狱的风险就消失了", "D. 自托管前要先确认吞吐与延迟能满足 SLA，否则合规达标但体验不可用", "E. 数据不出域是常见硬约束，涉及内部代码、客户资料或受监管数据时尤其成立"], a: [1, 3, 4], e: "A错误：权限控制防的正是「已经合法进来的东西做了不该做的动作」，内网里跑的 Agent 一样会被脏内容驱动去删库外发；C错误：风险来自输入内容与动作边界，跟网络位置无关，私有化改变的只是数据落在谁的机器上。E、B、D 成立：自托管换来数据主权与更完整的审计面，付出的是运维与优化能力，这笔账要两边一起算。" },
  { q: "在低代码平台上反复迭代工作流，关于版本与回滚，合理的做法有？", o: ["A. 发布前后跑同一批回归样例，把完成率与成本变化留下数，而不是只看演示能不能跑", "B. 版本号要能对应「当时用的提示词与模型档位」，否则事后无法解释行为为什么变了", "C. 平台自带的运行日志已经够细，不需要再按业务维度聚合指标", "D. 回滚时把画布切回上一版，行为就会回到从前", "E. 画布式改动难以肉眼评审，关键流程发布前应把流程定义导出来做 diff"], a: [0, 1, 4], e: "C错误：运行日志记的是单次调用，业务要回答的是「这条流程今天比昨天差了多少」，这层聚合通常得自己搭；D错误：行为由流程、提示词、模型档位、工具版本共同决定，只回滚画布而模型或工具已升级，照样回不到原样。E、A、B 成立：Agent 系统的版本化必须覆盖这四层，否则变更不可解释、事故不可回退。" },
  { q: "哪些情况下不该把流程压在低代码平台上，而应回到代码实现？", o: ["A. 要在平台之外做统一评测与灰度发布，流程只是被验证的对象之一", "B. 分支复杂到画布上要靠海量连线和补丁节点才能表达，评审与 diff 都已经不可维护", "C. 流程一旦要调用外部接口，低代码平台就基本无能为力，只能回到代码实现", "D. 需要自定义工具、复杂状态机或精细的失败恢复策略，平台的扩展点够不着", "E. 团队靠 PR 与代码评审协作，而流程只能在画布上改、改完没有历史记录"], a: [0, 1, 3, 4], e: "C错误：调用外部接口恰恰是这类平台的强项，现成连接器通常比手写更省事，这一条构不成回到代码的理由。B、D、E、A 成立：判断线在于复杂度、可控性与工程流程能否被平台承载——承载不了时就该把编排逻辑收回代码，而不是在画布上硬堆。" },
  { q: "担心被某个 Agent 平台锁定，成本更可控的做法有？", o: ["A. 提示词、规格与评测集放在平台外的版本库里，平台只当执行器", "B. 定期验证流程定义和运行日志能否导出，别到真要迁移时才发现拿不出来", "C. 模型与工具调用尽量走抽象层或标准协议，换平台时不必逐节点重写", "D. 业务规则写成平台无关的规格或代码，画布里只保留编排与调用", "E. 选开源平台就没有锁定问题，数据与流程天然可迁移"], a: [0, 1, 2, 3], e: "E错误：开源只保证拿得到源码，锁定的常见形态是数据格式、运维路径和已经砸进去的二次开发投入，这些不会因为协议开放就自动可迁移。A、B、C、D 成立：抗锁定的实质是把决策依据（规格、提示词、评测集）留在自己手里，只把执行外包给平台，并且定期验证退路真的走得通。" },
  { q: "线上效果不好，团队第一反应是换平台或换模型。更该先排查的有？", o: ["A. 换成更高档位的模型，上下文与工具的问题就不存在了", "B. 提示词与规格本身的歧义，会被更强的模型放大而不是被它自动修正", "C. 工具与知识库的接入质量：描述含糊、召回不准，换平台时这份脏输入会原样跟过去", "D. 有没有可验证的完成判据与评测集，没有它任何「换了确实变好」的判断都只是印象", "E. 平台知名度不够高，用户不信任，所以完成率上不去"], a: [1, 2, 3], e: "E错误：完成率是系统质量问题，与品牌认知没有因果关系，把原因挂到知名度上会错过所有可修的点；A错误：更强的模型读的仍是同一份含糊规格和同一堆劣质工具描述，它能多救一点，救不了结构性缺陷。C、D、B 成立：先拿同一批任务量出基线，再决定换什么，顺序反了就只能靠感觉反复折腾。" }
);

QUIZ_BANK.push(
  { q: "按 16×16 patch 的口径估算视觉 token 数，下列换算正确的有？", o: ["A. 边长翻倍时，patch 数变成四倍", "B. 800×600 的图按 16×16 切正好切满，不需要缩放或补边", "C. 1024×1024 切成 64×64 = 4096 个 patch", "D. 512×512 切成 32×32 = 1024 个 patch", "E. 768×768 切成 48×48 = 2304 个 patch"], a: [0, 2, 3, 4], e: "B错误：600÷16=37.5 除不尽，得先 resize 或 pad 到能被 patch 边长整除。C、D、E、A 是同一套算法：token 数等于（宽÷边长）×（高÷边长），所以线性尺寸翻倍就是块数乘四。" },
  { q: "一张 896×896 的图按 14×14 切 patch，展平后的视觉 token 数最接近？", o: ["A. 16384", "B. 1024", "C. 2048", "D. 4096", "E. 8192"], a: [3], e: "单选。896÷14=64，64×64=4096，和正文里 1024×1024 配 16×16 是同一个量级：更密的网格配上更小的画幅，两边正好抵消。B 与 C 低了一个到半个数量级，相当于把每维的格数当成了总块数；E 与 A 则多乘了一个二或四的系数，常见于把边长当成面积来翻倍。" },
  { q: "关于 patch 网格与图像内容的关系，正确的有？", o: ["A. 一个物体可能只落两三块，也可能铺上百块，块数不携带「这是一个物体」的信息", "B. 细于一个 patch 的笔画在块内被平均掉，容易被抹平成一片纹理", "C. 物体在图里平移半个 patch，网格的切分结果就跟着变，这套表示并不平移不变", "D. 网格只认识「第几行第几列这块」，不认识「这几块拼起来是一只手」", "E. 模型能自动把相邻同色的块合并成物体，所以边界不对齐不影响判断"], a: [0, 1, 2, 3], e: "E错误：网格边界与物体边界毫无对齐关系，合并靠的是后续注意力自己猜，没有任何机制保证合对，这正是计数和定位出错的根子。C、D、A、B 成立：ViT 只负责把图裁成块并展平投影，语义分组不是切分阶段提供的能力。" },
  { q: "要读清一页文档扫描图里的小字，用高分辨率切块（tiling）而不是整页缩小。关于 tiling，正确的有？", o: ["A. tiling 只是把图分开算，视觉 token 总量不变，成本没有增加", "B. 各块的空间位置要一并交给模型，否则它不知道块之间怎么挨着", "C. 跨块被切开的表格线与字容易拼错，重叠切或按版面结构切能缓解", "D. 每个块都按整图的输入尺寸编码，块数翻倍时图像部分的输入量也大致翻倍", "E. 整页缩到默认输入尺寸会先抹掉笔画，模型读不回已经丢掉的像素"], a: [1, 2, 3, 4], e: "A错误：每块各自展开成一串 patch 再相加，总量按块数放大，正文里「文档扫描、长截图最容易撑爆窗口」说的就是这个。E、B、C、D 成立：tiling 是用输入预算换笔画可分辨，代价是 token 暴涨、位置信息要补齐、跨块接缝要处理。" },
  { q: "一次请求放一张 1024×1024 的图（16×16 patch）加 2000 token 的提示，按正文口径，正确的有？", o: ["A. 裁块、ViT 编码、投影这些一次性并行算完，相当于多模态版的 Prefill", "B. 视觉 token 不进 KV Cache，它们在编码阶段用完就丢", "C. 多轮会话每轮都重发同一张图，窗口占用和成本会逐轮叠加", "D. 把图缩到 512×512 只省文本预算，图像 token 数是固定的", "E. 视觉 token 约 4096，比这段文本还长，缩略图级别的占用也有一千多 token"], a: [0, 2, 4], e: "B错误：视觉 token 拼进序列后与文本 token 是同一种东西，一样占上下文窗口、一样进 KV Cache；D错误：边长从 1024 缩到 512，块数从 64×64 变成 32×32，图像 token 从 4096 降到 1024，省的正是图像这一侧而不是文本侧。E、A、C 成立：4096 已长过 2000 的提示，缩略图级也有一千多 token；裁块到投影一次性并行，相当于多模态版 Prefill；每轮重发同一张图，就把这份占用重新算一遍。" },
  { q: "启发式规则（词表、符号密度、长度阈值、重复标点）这条过滤路线，特性正确的有？", o: ["A. 它会误伤口语化的好文本，以及代码与文档混排的内容", "B. 内容农场可以针对规则反向优化，把符号密度和长度做成刚好过线的样子", "C. 规则改动要挂版本号，配合被过滤样本留档，事后才查得动是哪条规则删错", "D. 规则写得足够细之后，人工抽检校准可以取消", "E. 快、便宜、可解释，能说清每一条为什么被删"], a: [0, 1, 2, 4], e: "D错误：正文的工程做法是定期手工抽检校准，规则越细越容易在没想到的体裁上误杀，而误杀率只能靠抽查被过滤样本看出来。E、A、B、C 成立：可解释与便宜是它相对模型打分的优势，代价是脆——一边误伤好文本，一边被农场绕过，这两头都靠「删了什么、删了多少、抽样看过误杀吗」这三问兜住。" },
  { q: "用分类器给文档打质量分（质量标签或借用奖励模型），已知的副作用包括？", o: ["A. 标签来自哪个领域，打分就偏向哪个领域，换个领域阈值就不成立", "B. 它比规则细，能学出「像好文档」的整体特征", "C. 换一批领域标签重训分类器，旧阈值不能直接沿用，得重新校准", "D. 分类器分数是连续值，所以按分数排序切一刀比按领域分别调更合理", "E. 容易把文风当质量：模板化的正式腔拿高分"], a: [0, 1, 2, 4], e: "D说反了：连续值只解决了排序，不解决偏置。全局一刀会把某个领域的整体水平当成质量差，正文对毒性过滤也明确要求阈值按领域和语言分别调，全局一个阈值必然在某些子集上误杀。E、A、B、C 成立：这正是分类器路线细过规则的同时继承的偏置，重训之后阈值不沿用是同一件事的另一面。" },
  { q: "回收的反馈信号要分流进不同训练目标，正确的有？", o: ["A. 为了格式统一，所有在线反馈都该先整理成 SFT 样本再入库", "B. 有唯一正解的任务走 SFT", "C. 只有相对好坏、无法自动判分的走偏好对，也就是 DPO 那一路", "D. 结果能被程序验证的走 RLVR", "E. 判断式一句话：有没有标准答案决定走 SFT 还是偏好对，能不能自动验证决定要不要走 RLVR"], a: [1, 2, 3, 4], e: "A错误：把只有相对好坏的数据硬做成 SFT，等于凭空给一个「唯一正解」，模型学到的是被强行定标的偏好，正文的分流逻辑就是先分目标再入库。B、C、D、E 成立：三条通道各对应一类可验证性，选错通道比选错超参更伤。" },
  { q: "关于语料四个进料口的成本、质量与法律特征，正确的有？", o: ["A. 合成数据格式极好但事实不保证，成本是把标注费换成推理算力", "B. 模型权重开源，不构成「它用到的语料可以商用」的证据", "C. 公开爬取单位成本极低，主要花算力，但质量方差大、法律状态最模糊", "D. 授权采购单价高，换来来源清楚、可审计可追溯，适合专业领域补强", "E. 用户数据分布最贴业务，可以直接进训练集，不必再管同意与退出机制"], a: [0, 1, 2, 3], e: "E错误：用户数据的门槛恰恰在授权与退出机制上，受服务协议、同意范围和删除权约束，不是拿到就能练。C、D、A、B 成立：四个进料口各有各的成本—质量—法律三角，爬取便宜但来路不清，采购贵但有质检单，用户数据贴业务但合规成本高，合成数据规整但事实不保证。" },
  { q: "把一份素材的可训练性按许可证拆开看，正确的有？", o: ["A. 公开可下载的语料默认可以用于商业模型训练", "B. 带 NonCommercial 条款的素材进不了商用模型", "C. 「源码开源」与「语料许可」是两码事，不能互相推断", "D. 要分开问三件事：能不能公开下载、能不能改和再分发、能不能用于商业训练与推理产出", "E. 带 NoDerivatives 条款的素材，用它训练出来的权重本身就站在衍生品的位置上"], a: [1, 2, 3, 4], e: "A错误：可下载只回答了第一层权利，后面两层要单独查，这正是「开源不等于可商用训练」这个常见误读的落点。D、E、B、C 成立：三层权利要逐条判，衍生条款和非商业条款各自构成硬约束，别人权重开源与他用的语料能否商用之间没有推理关系。" },
  { q: "要让语料库经得起许可与来源审计，工程上必须留下的东西包括？", o: ["A. 用户数据的同意范围与撤回记录，能反查到派生样本", "B. 每条样本的 license 标签", "C. 可溯源的来源记录：这一条从哪个来源、哪一批次进来", "D. 总量足够大时，抽样标注一部分来源就够审计用了", "E. 过滤规则挂版本号，库存按原始层、清洗层、训练层分层留存"], a: [0, 1, 2, 4], e: "D错误：审计是按条目追问的，抽样标签无法证明任何一件事，缺的那部分照样是风险敞口。B、C、E、A 成立：许可证标签加来源记录是正文点名的两样东西，版本化与分层留存让「指标没变好」能回溯到具体规则和批次，反向索引则是删除权能落地的前提。" },
  { q: "给低质量数据更高的采样权重，指望它多贡献知识。关于配比里的采样与切分，正确的有？", o: ["A. 泛网页占比越高，模型答题格式越稳定，因为见得杂", "B. 领域这一刀切的是网页、百科、代码、论文、书、论坛各占多少", "C. 给低质数据多曝光不等于多学，它只会挤掉好数据的份额", "D. 采样按重要性加权，比各来源均摊更符合「多花的 token 要买能力」的目的", "E. 切质量档的意义之一，是让精选数据负责严谨与格式，泛数据负责知识与表达的多样性"], a: [1, 2, 3, 4], e: "A说反了：格式的稳定性来自精选材料在低学习率下的精读，泛网页负责的是知识面铺开，把权重堆到它身上只会稀释前者。C、D、E、B 成立：配比通常沿领域、语言、长度、质量档四个维度切，采样用加权而不是均摊。" },
  { q: "按正文口径，同一段内容中文消耗的 token 往往是英文的 1.5～2 倍。关于语言这一刀的比例换算，正确的有？", o: ["A. 语言维度只影响词表覆盖情况，不影响算力与 API 成本", "B. 同一篇文章的中英翻译稿，在 n-gram 层面不构成近重复，MinHash 加 LSH 那套抓不到它", "C. 中文更吃 token，意味着同一个上下文窗口能装下的中文正文更少", "D. 一份记作 1000 万 token 的英文材料，做成等价内容的中文训练时，预算要按 1500～2000 万 token 计", "E. 配比时按文档篇数折算就能估出 token 成本，不必区分语种"], a: [1, 2, 3], e: "E错误：篇数相同的中文与英文，token 量差一到两倍，按篇折算会系统性低估中文侧的预算，中文占比是直接换算成算力与 API 成本的。A错误：语言占比改变的是同一份内容要花多少 token 来喂，这是算力口径，词表只是其中一小部分。D、B、C 成立：D 是 1.5～2 倍的直接乘算；B 提醒跨语言重复得靠语义或对齐手段另做，签名去重对它无能为力。" },
  { q: "语料配比里的「长度」这一刀，值得单独盯的理由包括？", o: ["A. 过滤规则改完之后，长度分布前后应该几乎没有变化，所以不必记录", "B. 长文承担的是跨段指代与篇章结构这类短片段拿不到的信息密度", "C. 长文占比太低，模型处理整段文档就会不稳", "D. 长文可能在清洗时被切坏或整段过滤掉，长度分布能提前暴露这件事", "E. 把长文档统一截断到固定长度，等于免费扩充了短文本语料，没有代价"], a: [1, 2, 3], e: "E错误：截断把上下文切断，跨段指代和结构信息一起丢掉，这是拿长文档能力换条数，不是免费午餐。A错误：长度阈值最容易误伤长文，改规则前后必须留长度分布这条读数，「应该不变」属于想当然。C、D、B 成立：看板里的长度分布就是用来判断长文是否被切坏或过滤掉的，正文把这列为常看指标。" },
  { q: "训练后期（退火阶段）通常同时换料与降学习率。关于这套安排，正确的有？", o: ["A. 只降学习率不换料，等于用低学习率继续精读泛网页，格式稳定性的收益拿不到", "B. 换料和学习率是两个完全独立的旋钮，改一个不影响另一个", "C. 课程学习的思路是先泛料打底建立通用能力，再在低学习率下精读高质量数据", "D. 退火阶段换料的主要动机是降低数据管理的存储成本", "E. 越往后越把海量泛网页换成精选教材、专业数据与结构化材料"], a: [0, 2, 4], e: "B错误：正文的口径是「同时把学习率降下来」，高质量料配低学习率才构成精读，两件事是一套动作。D错误：换料买的是格式稳定性与事实密度，与存储成本无关，精选材料通常还更贵。E、A、C 成立：早期泛网页铺能力、后期精选料定规范，这个次序就是课程学习与退火要换料的原因。" },
  { q: "要给合成数据设闸，下面哪些控制手段站得住？", o: ["A. 必须有外部判据：单元测试、验证器、可核对事实", "B. 换不同家族的模型来生成，避免模型反复读自己写的作文", "C. 定期跑一组纯真实数据对照组做消融，指标一退化就下调合成配比", "D. 把生成温度调低，合成数据的事实可靠性就有保证", "E. 设占比上限，合成只用来补真实语料稀缺的地方"], a: [0, 1, 2, 4], e: "D错误：降温只让输出更一致、更模板化，一致不等于正确，同一个错误反而更稳定地重复出现；只靠模型自评自信度等于自己给自己批卷。E、A、B、C 成立：这四条正是正文给出的控闸组合——占比上限、外部判据、跨家族生成、纯真实数据对照消融。" },
  { q: "关于合成数据占比失控后的症状与成因，正确的有？", o: ["A. 每批改用更大的模型生成，自食其尾的风险就消失了", "B. 合成数据格式整齐，所以可以按格式合格率来确认它的事实正确性", "C. 外在表现包括文风趋同、长尾表达消失，幻觉被循环强化成像是共识", "D. 成因之一是模型生成内容已经躺在网络语料里，爬取侧剔不干净", "E. 风险是分布收窄加上错误模式自我放大，而不是单纯的样本量不足"], a: [2, 3, 4], e: "A错误：换更大的模型仍然是同一家族在写，读它写的作文照样自我强化，缓解要靠跨家族生成与外部判据，参数数量不解决分布收窄。B错误：格式极好与事实不保证是同一行的两半，合格率只能筛出漂亮，筛不出对。C、D、E 成立：再拿合成数据大规模训练下一代，量够大也不会让风险自己消失。" },
  { q: "从公开网页快照这一头进料，下列说法成立的有？", o: ["A. 授权采购单价高，好处是每一批都带着可审计的来路", "B. 除了抓取本身的算力，还要处理 robots 协议与 TDM 权利声明", "C. 量大但质量方差极大：噪声、内容农场文、模板页混在一起", "D. 各地司法口径对文本与数据挖掘的规定基本一致，不必按地域区别处理", "E. 内容农场的页面高度模板化，靠精确哈希就能整簇清掉"], a: [0, 1, 2], e: "D错误：正文写明各地司法口径不一致，这正是爬取侧法律状态最模糊的原因。E错误：农场页彼此只差标题、导航和广告位，一个字符不同摘要就全变，精确哈希抓不住近重复，得靠 MinHash 加 LSH 那套。B、C、A 成立：来路不清与噪声密度是爬取的固有代价，采购用价格换可追溯。" },
  { q: "语料侧的看板要像车间一样盯进料流动，值得常看的指标包括？", o: ["A. 可训练覆盖度：license 明确的 token 占多大比例", "B. 盯住总 token 数与总条数就够，其余维度属于锦上添花", "C. 重复率，并且分文档内、文档间、跨批次三层看", "D. 有毒比例与 PII 命中率按领域分开看，全局均值会骗人", "E. 新料与库存的重叠度，用来回答这批新数据带来多少新增信息"], a: [0, 2, 3, 4], e: "B错误：总量只说明「有多少」，不说明「坏在哪」，重复率、语种与长度分布、毒性命中率、来源贡献度、覆盖度与重叠度才是能看出料坏了的那几组读数。C、D、E、A 成立：全局均值会把某个语种或某个来源的塌方平均掉，按来源的贡献度还用来决定下一批怎么加权。" },
  { q: "清洗流水线每一段的输出量都要记进看板。下面哪些读数算「规则误伤」的信号？", o: ["A. 抽查被过滤样本时按规则分组看，比随机抽查更容易定位是哪条规则删错了", "B. 某一段之后输出量相对上一段的缩水，比历史同类批次大得多", "C. 某一语种样本量在过滤后骤降，而全局指标几乎没动", "D. 缩水率越高说明过滤越有效，数据越少就越干净", "E. 被过滤样本按规则分组留档，抽检发现误杀集中在口语化文本与代码文档混排的内容"], a: [0, 1, 2, 4], e: "D说反了：缩水率异常首先怀疑规则误伤，正文把「输出量都记进看板、缩水率异常说明规则误伤」写成了流水线注意项。B、C、E、A 成立：某条规则悄悄清掉一个语种时全局指标完全看不出来，所以每段输出量入看板、被删样本留档、按规则分组看误杀率，这三件事凑齐才谈得上可回溯。" },
  { q: "关于「用户数据」这个进料口，正确的有？", o: ["A. 它的合规成本比爬取低，所以单位成本也是四路里最低的", "B. 它的分布最贴真实业务，是后训练与迭代微调的主要闭环来源", "C. 同一批来源里质量两极，既有高质量追问也有大量无信息量输入", "D. 进训练集受服务协议、同意范围与删除权约束", "E. 来自真实用户，就不需要再走与爬取料同等的质量过滤"], a: [1, 2, 3], e: "E错误：贴真实分布不等于天然干净，用户输入同样要过毒性、PII 与格式归一，只是阈值要按领域和语种分别调。A错误：用户数据的单位成本是「中」，贵在合规成本上；四路里成本最低的是公开爬取。B、C、D 成立：分布贴合业务与合规硬门槛是同一枚硬币的两面。" },
  { q: "关于 MinHash 签名能估什么、不能估什么，正确的有？", o: ["A. 签名相等比例是 0.8，就能推出两篇文档有 80% 的字符相同", "B. 整篇哈希只要差一个字符摘要就完全不同，这正是近重复要另起一套算法的原因", "C. 签名给出的是相似度估计，删不删、留哪一份还要由阈值与簇策略决定", "D. 两个签名在相同位置上相等的比例，是这两篇文档 n-gram 集合 Jaccard 相似度的无偏估计", "E. 签名由多份随机哈希各取最小值拼成，用的哈希份数越多，单次估计的抖动越小"], a: [1, 2, 3, 4], e: "A错误：Jaccard 是交集大小除以并集大小，作用在 n-gram 集合上，不携带字符数或字数信息，两者不能互相换算。D、E、B、C 成立：把文档看成 n-gram 集合、用多份随机哈希的最小值当代表，相等位置比例就是这个相似度的无偏估计；精确哈希抓不了「只差一个标题一段广告」的近重复。" },
  { q: "LSH 在近似去重里解决的问题与它自带的代价，正确的有？", o: ["A. 落进同一桶只是必要条件，桶内仍要真算一次相似度再决定留一", "B. 分桶的段数越多，召回一定越高而且不需要付出额外成本", "C. 把签名切成若干段、随机打乱后重新分桶，只有某段完全一致的文档才会进同一桶比对", "D. 它把「所有文档两两比较」的量级压成「只比候选对」", "E. 候选对变少既是它的收益也是它的漏检来源：相似度略低于阈值的近重复可能永远碰不到一起"], a: [0, 2, 3, 4], e: "B错误：段数与每段行数是这套里互相拉扯的两个旋钮，改它们会同时改召回、误报和比较次数，没有只涨召回不付费的做法。C、D、E、A 成立：LSH 的逻辑是用分桶把天文数字的两两比较过滤成候选对，代价是概率性漏检，进了同桶的对子仍要复核。" },
  { q: "去重流水线的顺序是：全量文档、正文抽取与归一、精确哈希去重、MinHash 签名、LSH 出候选对、近重复簇留一。关于这个次序，正确的有？", o: ["A. 应该先跑 MinHash 再跑精确哈希，粗筛永远放在精筛前面", "B. 最后统一跑一遍近似去重，前面的正文抽取与归一可以省掉", "C. 先归一再哈希：模板噪声没剥掉时，两篇正文相同的页面会因为导航不同而哈希不同", "D. 精确哈希成本极低，应当无脑先跑，把完全一致的文档清掉再谈近似", "E. 近似去重放在最后，是因为它是整条链里最贵的一段，前面每清掉一份都让它更省"], a: [2, 3, 4], e: "A说反了：这套顺序是按单位成本排的，哈希便宜到近乎免费，先把完全一致的一次清光，才轮到签名和分桶这对贵工具。B错误：不归一的话，导航、广告、页眉的差异会一路带进 n-gram 集合，Jaccard 被压低、该并的簇并不起来，等于把近重复漏给最贵的一段去猜。C、D、E 成立：每一段的输出量还要记进看板，缩水率异常就说明规则误伤。" },
  { q: "去重要分文档内、文档间、跨批次三层做。关于三层各自抓什么，正确的有？", o: ["A. 三层用同一套签名就够，签名跑密了不必分开看", "B. 文档内抓的是同一篇里的重复段落、模板句、页眉页脚和抓坏的列表", "C. 文档内这类属于噪声密度问题，处理方式是就地删掉，而不是拿去跟别的文档比", "D. 文档间的主战场是跨站转载、SEO 镜像站和论坛复制粘贴", "E. 跨批次最容易出的事故，是只在新批次内部去重、忘了和旧库存比对，同一批网页被反复计账"], a: [1, 2, 3, 4], e: "A错误：三层抓的对象和成本结构不一样，文档内就地删、文档间靠签名与分桶、跨批次要和历史库存比，混成一层必然漏掉跨批次这条最容易出事的路。B、C、D、E 成立：正文把跨批次写成最常见的事故，重复率指标也因此要分三层报，不能只给一个总数。" },
  { q: "旧库存 100 亿 token，新一轮增量抓来 20 亿 token，与新批次和历史库存的交叉比对显示重叠率 25%（按 token 计）。关于这笔账，正确的有？", o: ["A. 库存总量变成 120 亿 token，其中与旧内容重合的约 5 亿", "B. 有效新增约 15 亿 token：20 ×（1 - 0.25）= 15", "C. 若只在新批次内部去重而不与旧库比，训练时排的是 20 亿，实到 15 亿，虚高 5 亿", "D. 虚高的比例是 5 ÷ 20 = 25%，也就是说排给重复内容的算力占这批的四分之一", "E. 重叠率 25% 说明这批新料质量差，应该下调它的质量分"], a: [0, 1, 2, 3], e: "E错误：重叠率说的是新料与库存的重复程度，与单篇好坏无关，把两件事混起来会让看板上的重复率去背质量分的锅，实际该做的是去重而不是下调质量档。B、C、D、A 成立：100 加 15 是实到库存，5 亿是重复部分，虚高比例按这批的量算就是四分之一，正文把「新料与库存的重叠度」列为常看指标，就是为了提前回答这批到底带来多少新增信息。" },
  { q: "两篇文档的 5-gram 集合交集有 60 个、并集有 140 个，用 100 位 MinHash 签名、判重阈值设 0.8，下面哪一项推算站得住？", o: ["A. 140 个位置相等，因为并集才是比较对象", "B. 无法估计，MinHash 只能给出「是否相同」的布尔结论", "C. 约 43 个位置相等，阈值 0.8 下不会被判近重复", "D. 60 个位置相等，会被判近重复", "E. 80 个位置相等，正好卡在阈值上"], a: [2], e: "单选。Jaccard = 60 ÷ 140 ≈ 0.4286，100 位签名里每个位置相等的概率就是这个相似度，期望相等数约 43；0.4286 远低于 0.8，阈值不变就不判重。D 把集合交集大小当成了相等位置数；E 把判重阈值当成了估计结果；A 用并集当分子，方向错了，并集是分母；B 与算法性质相反，签名相等比例本来就是相似度的无偏估计，不是布尔判同。" },
  { q: "某个来源的内容九成是互相转载。跑完近重复簇留一后，它在训练集里的文档数掉了八成。关于这个现象，正确的有？", o: ["A. 该来源此前的贡献度是被转载放大过的，去重后的读数才接近它的真实信息量", "B. 按来源加权的配比要重算，旧权重是按含重复的库存定的", "C. 如果跨批次重复率同时飙高，可能说明增量抓取又在抄同一批页面，该回头看抓取策略", "D. 文档数骤降一定意味着留一规则误伤，必须回滚这一轮去重", "E. 文档数掉八成是预期收益，这些转载原本在反复曝光同一份信息"], a: [0, 1, 2, 4], e: "D错误：这里下降的对象恰好是重复内容，回滚等于把放大过的曝光量请回来；真要怀疑误伤，看的是被过滤样本按规则分组的抽检结果，不是总条数。E、A、B、C 成立：留一是每簇保留一份，不是整簇删除，所以原创那一份仍在；变的是它不再被复制品淹没，来源贡献度与配比都得按清洗后的库存重算。" },
  { q: "拿一个小模型算困惑度来做语料过滤，关于它的动机与副作用，正确的有？", o: ["A. 正文给的定位是它只做异常检测，不当主力过滤器", "B. 小模型算困惑度的成本可以忽略，所以全量语料逐条打分没有代价", "C. 动机是不需要标注，实现成本在三条路里最低", "D. 副作用是把新领域、新文风当成噪声砍掉，恰好砍在模型最缺的长尾知识上", "E. 打分过高或过低都值得看：过高常是乱码或拼接，过低常是模板与重复"], a: [0, 2, 3, 4], e: "B错误：困惑度过滤省的是标注费，不省推理费，全量语料逐条过一遍模型是实打实的算力开销，正文把合成数据的成本说成「推理费换成算力」也是同一本账。C、D、E、A 成立：不需要标注是它唯一的动机，砍长尾是它最贵的副作用，所以工程做法是规则粗筛、分类器细分、困惑度只抓异常。" },
  { q: "三条过滤路线混着用时，正文给出的工程做法包括？", o: ["A. 定期手工抽检校准，别只看分数分布自己稳定就放心", "B. 被过滤的样本要留档，抽查时按规则分组看误杀率", "C. 每条规则都要能回答三问：删掉了什么、删了多少、抽样看过误杀吗", "D. 三条路的分数应该先归一化再取平均，合成一个总分一刀切", "E. 规则做粗筛、分类器做细分、困惑度只做异常检测"], a: [0, 1, 2, 4], e: "D错误：归一化取平均会把三条路各自的偏置混成一个更难解释的数，出了误杀也定位不到是哪条规则；正文的分工是各司其职而不是加权融合。E、A、B、C 成立：这套做法的共同点是每条规则都可追问、可回溯，库存还要按原始层、清洗层、训练层分层留存。" },
  { q: "关于毒性过滤与 PII 处理，正确的有？", o: ["A. 训练集里的 PII 只有在模型主动联网时才会造成泄露事故", "B. 毒性过滤的目标不是删脏话，而是删不可训内容与攻击模板", "C. 阈值要按领域和语言分别调，全局一个阈值必然在某些语种上误杀", "D. PII 扫描要覆盖邮箱、电话、密钥与证件号这些形态", "E. 删掉的 PII 数量要留数，因为删除本身就改变了分布"], a: [1, 2, 3, 4], e: "A错误：正文的口径是训练集里的个人信息本身就是泄露事故的源头，触发方式是模型把这些内容复述出来，与它有没有网络访问无关。B、C、D、E 成立：毒性这块删的是不可训练的东西和攻击模板，不是粗口本身；PII 侧除了扫描范围，还要留删除计数，否则某个语种的样本被删薄了都看不出原因。" },
  { q: "格式归一这块活儿，说法正确的有？", o: ["A. 全半角与 Unicode 统一只是排版洁癖，对训练没有实际影响", "B. 包括模板噪声剥离、Unicode 与全半角统一、代码缩进保留", "C. 代码缩进要在归一里保住，压平缩进等于把结构信息抹掉", "D. 长文档的切分策略决定模型能不能用好整篇材料", "E. 这里的切分属于语料工程，与 RAG 侧的 Chunking 不是一回事，谈的时候不能混"], a: [1, 2, 3, 4], e: "A错误：字符形态不统一会把同一个词拆成多个不同的 token 序列，稀释有效样本，归一是在省 token，不是排版洁癖。B、C、D、E 成立：正文把这三件事列在同一节里，并特别点名句法层面的切分与检索侧 Chunking 是两个环节，一个决定训练时见过什么，一个决定推理时喂进什么。" },
  { q: "去重与「模型记住题目」的关系，正确的有？", o: ["A. 把评测集换成未公开的新题之后，语料里的旧榜题面可以留在训练集中", "B. 评测基准一旦进了训练语料，模型能背题，分数虚高但能力没变", "C. 清洗流水线必须包含一步与评测集、题库的交叉去重，把公开榜单题面从语料里剔掉", "D. 自建黄金集与影子集的题永远不能进训练", "E. 同一件事有两面：榜单侧测「有没有背过」，语料侧负责「根本没背过」"], a: [1, 2, 3, 4], e: "A错误：换题只解决当前这次考试的分数可信，语料里那些题面训练出的仍然是背题能力，而且下一轮换血时又会掉分，正文说的正是榜单污染与换血掉分这对现象。B、C、D、E 成立：交叉去重是清洗的固定一步，黄金集与影子集要从头到尾不进训练，否则你测到的是记忆而不是能力。" },
  { q: "要证明一次清洗真的有效，实验设计上的要求包括？", o: ["A. 对比要在同一 token 预算下做，去重省下的 token 本身就是收益", "B. 清洗后条数变少、验证损失同时下降，足以把改善归因给质量提升", "C. 参数量、token 预算、学习率调度、其余数据全部锁死，只换清洗策略这一件事", "D. 同时看三类读数：验证损失、下游任务、输出侧症状（复读率、模板句输出率）", "E. 按来源与语种分子集看，也要看长尾，不然某条规则悄悄清掉一个语种，全局指标可能完全不动"], a: [0, 2, 3, 4], e: "B错误：数据变少本身就会改训练动态，一边减少数据量一边宣称质量提升，是正文点名的设计不自律；验证损失下降也可能只是任务变简单。C、D、E、A 成立：只有消融实验能证明清洗有效，输出侧症状是下游任务分数之外的一读数，能抓住文风层面的变化。" },
  { q: "为什么说清洗与去重是「最划算的一层」？", o: ["A. 同一份 token 预算，少练重复与垃圾，验证损失和下游任务都会变好看", "B. 清洗过的库存能长期复用，收益会累积", "C. 脏数据的代价也是复利的：重复放大记忆化，噪声教出坏文风", "D. 这层做完就能减少达到同样效果所需的算力，因此可以让缩放定律的结论失效", "E. 不用重训架构、不用调学习率就能拿收益"], a: [0, 1, 2, 4], e: "D错误：清洗改变的是同一算力下喂进去的内容质量，不推翻损失与算力、数据量之间的经验关系，只是让你在同一预算下买到更多能力。E、A、B、C 成立：正文把这层的回报归为不用动架构、同一预算少练垃圾、库存复用收益累积，反过来说重复与噪声也会一路跟着复利。" },
  { q: "做文档内去重时，抓到一篇里同一段落连续出现四次、页脚在正文里被重复了三十遍。关于这类样本的处理，正确的有？", o: ["A. 这类重复若不清，会直接抬高模型复读与模板句输出的倾向", "B. 文档内清干净之后，再去跑跨文档的签名比较，正文抽取的噪声少，Jaccard 更可信", "C. 同一篇里重复四次，等于这条内容被采了四次，应当按权重抵充它的采样份额", "D. 这属于文档内的噪声密度问题，就地删重复部分，整篇不必因此出局", "E. 抓坏的列表也会造成同一段落反复出现，得和模板句一起归到文档内这一层"], a: [0, 1, 3, 4], e: "C错误：文档内的重复是同一份内容在一条样本里被写了好几遍，是噪声密度，不是采样次数，拿它去抵采样份额等于把模板垃圾算成有效曝光。D、E、A、B 成立：正文把重复段落、模板句、页眉页脚、抓坏的列表都归在这一层，处理方式就是就地删，而脏正文带进后续签名比较会污染相似度。" },
  { q: "给生产日志里回收的反馈信号按可信度排座次，正确的有？", o: ["A. 人工干预点是定位题：它标出模型能力边界的准确位置，适合拿去定向补数据", "B. 排最高的是结果能自动验证：测试通过、单据跑通、补丁被合入", "C. 编辑距离与回改 diff 是第二强的一档，它同时给了方向和答案", "D. 点赞比采纳率硬，因为点赞是显式表态，而采纳可能只是用户懒得改", "E. 采纳、留存、放弃，以及人工干预发生在哪一步，属中间一档"], a: [0, 1, 2, 4], e: "D说反了：正文的口径是采纳率比点赞硬，理由是采纳有外部动作，而点赞受长度、自信、排版这些表面特征支配。B、C、E、A 成立：档位从可自动验证的结果往下依次是编辑距离与回改、采纳与干预、点赞点踩，越往下越便宜，也越容易骗人。" },
  { q: "关于点赞点踩这类显式评分，正确的有？", o: ["A. 长度、自信、排版这些表面特征就能推动它，所以便宜但容易骗人", "B. 把点赞与点踩做成对称的两个标签，就能去掉这些表面偏置", "C. 它适合用来做「翻牌率」类比里的摆盘信号，不适合当厨房改菜单的依据", "D. 它测的是讨喜，不是正确", "E. 拿它当优化目标，模型会先学会变长、变自信"], a: [0, 2, 3, 4], e: "B错误：点踩同样受表面特征支配，把两个方向对称起来只是让噪声有了正负号，判据本身仍然与正确性无关，要去偏置得换成可验证的结果或编辑距离。D、E、A、C 成立：正文用顾客反馈改菜单打比方——翻牌率只说明这道菜在这盏灯下挺诱人，清盘、打包、亲手改调味配方才是能照着改厨房的信号。" },
  { q: "用户把模型草稿改成终稿的那次 diff 常被低估，关于这条信号正确的有？", o: ["A. 统计平均编辑距离一个数就够，不必看具体改了哪一段", "B. 回改发生在哪一段，就指出模型在那一段不行，这是能力边界的位置信息", "C. 编辑距离越小就说明用户越满意，可以直接当质量分用", "D. diff 里被删掉的部分同样是信号：它说明模型写了不该写的东西", "E. 一次 diff 同时给两件事：原答案不够好，以及更好的答案长什么样"], a: [1, 3, 4], e: "A错误：把 diff 压成一个标量就把最值钱的位置信息丢了，正文强调人工干预点适合定向补数据，靠的正是改在哪一段。C错误：距离小可能只是风格微调，也可能是用户放弃改造直接重写别处，满意度要结合是否采纳与留存一起看，不能由距离单独代言。E、B、D 成立：这一档信号强于采纳类，因为它自带更好的那一份答案。" },
  { q: "线上只盯「采纳率」这一个指标做优化，最该担心的是什么？", o: ["A. 采纳率与人工干预点完全无关，看它没有任何信息", "B. 采纳是用户的外部动作，所以它就是标准答案，不存在偏差", "C. 采纳率是代理指标，模型变得冗长、自信时它可能照涨，而留存或工单量在恶化", "D. 采纳率在技术上统计不出来，日志里没有这个字段", "E. 采纳率越高一定说明用户越不满意，两者是反向关系"], a: [2], e: "单选。这正是正文列的第二种失效——指标漂移：代理指标被优化目标绑架，症状就是采纳率涨而留存或工单量恶化，对策是在线与离线指标绑着看并加护栏指标。D 与事实相反，采纳是有明确埋点定义的动作；E 把关系说成严格反向，采纳率高也可以是真的好，只是不能单独作数；A 过绝对，采纳属中间一档信号，与干预点同属日志侧；B 是过度信任：采纳只说明这次被接受，区分不了对与看着顺眼。" },
  { q: "判断标注预算该怎么花，正确的有？", o: ["A. 单价足够低的简单任务可以不写标注规范，靠标注员常识判断", "B. 一致性高的标注，一定比为一致性低但由领域专家做的标注更可用", "C. 标注单价随任务类型差几十倍很正常：判断一句话是否礼貌几乎免费，判一段代码是否正确要付专业工时", "D. 真正要算的是返工率——标错的比例乘以重标成本", "E. 便宜批量标注如果整批系统性误读了规范，返工成本会远超省下的单价"], a: [2, 3, 4], e: "A错误：简单任务的规范照样要写清边界，否则误伤的是同一批高频样本，而且 Kappa 之类的一致性读数连「规格是否可执行」都判不出来。B错误：一致只说明大家按同一套理解在做，那套理解本身可能是错的，专业判断的价值恰恰在于能不能定住正确答案。C、D、E 成立：所以算账要算到返工率这一层，而不是只看每条多少钱。" },
  { q: "把答案已知的题混进任务流（金标题），关于它的作用与边界，正确的有？", o: ["A. 它防不了系统性的规范误读：所有人都按同一份错理解作答，金标题也会被判成对", "B. 金标题命中率可以当成标注质量分，用来给标注员排座次", "C. 金标题要随机混入，且答案不能出现在规范示例里，否则等于漏题", "D. 它和双人独立标注加仲裁不能互相替代", "E. 它用来测标注员有没有真在看，能抓偷懒与漂移"], a: [0, 2, 3, 4], e: "B错误：命中率只证明这条任务被认真做了，不证明这个标注员的理解与你要的一致，把它当质量分会奖励最会照规范猜心思的人。A 之所以成立：规范误读要靠争议仲裁加裁决回写来防，这是正文点名的分工。E、C、D 成立：金标题的定位就是防偷懒与漂移，防不了整体跑偏，替代不了双人标注，也替代不了仲裁。" },
  { q: "关于双人独立标注、一致性检验与争议仲裁，正确的有？", o: ["A. 分歧题交专家仲裁，且裁决必须回写标注规范，否则下一个标注员还会在同样的题上分歧", "B. 一致性很低时，首先该怀疑任务规范写得含糊，而不是先换标注员", "C. 仲裁结论只用于当次裁决，不必回写文档，免得规范越改越长", "D. 两名标注员结论不一致时，把两人的分数取平均就是最终标签", "E. 双人独立标注加一致性检验，Kappa 这类读数说明的是规格是否可执行"], a: [0, 1, 4], e: "C错误：不回写等于把同一道题的成本付第二遍、第三遍，仲裁的价值一半在裁决本身，一半在把边界写进规范。D错误：偏好标签与判断类标签不是数值量，取平均只会得出一个谁都没给过的答案，正确处置是进仲裁队列。E、A、B 成立：一致性低首先是指向规格的红灯，规范可执行性解决了之后才谈得上人的问题。" },
  { q: "被拒采的样本与被改写的回答，入库时正确的做法有？", o: ["A. 拒采样本配上同一上下文里被认可的更好答案，就是完整的一对偏好数据", "B. 改写后的终稿更适合当训练目标，因为它是用户认可的那一份结果", "C. 只需统计被拒次数，不必保留当时展示给用户的原文", "D. 一次拒采就足以判定这类任务整体不行，可以直接下调这类数据的采样权重", "E. 拒采不是噪声：它是「当前模型这样输出、用户不接受」这条成对证据的一半"], a: [0, 1, 4], e: "C错误：不留下当时的原文，配对关系就断了，这条样本既做不成偏好对，也无法复现，只剩一个没有上下文的计数。D错误：单条拒采的成因太多——表达风格、上下文缺失、用户当下需求变了，要定位问题得看拒采集中在哪一类以及人工干预点在哪。E、A、B 成立：被拒的那一侧加被认可的那一侧正好构成偏好对，改写终稿则是可直接用于 SFT 的目标。" },
  { q: "把「被采纳的模型输出」直接当正确答案回灌训练，关于它的问题，正确的有？", o: ["A. 没有外部判据时，采纳区分不了「对」和「看着顺眼」", "B. 给被采纳的样本加上更大的权重，就能把它变成可靠的标准答案", "C. 回灌前该先问有没有更强的信号可用，比如程序验证结果或人工范例", "D. 模型会把自己现有的毛病学得更扎实", "E. 正样本只来自当前模型的输出分布，稀有表达会进一步被挤掉"], a: [0, 2, 3, 4], e: "B错误：权重只改变这批样本说话的声音大小，不改变它们来源同一分布这件事，加权重反而让毛病学得更狠。D、E、A、C 成立：正文把这条列为飞轮里最危险的做法，配套的对策是外部判据、人工范例占比下限、定期用非闭环数据做对照。" },
  { q: "关于用户数据进训练集的授权与退出机制，正确的有？", o: ["A. 入库前做过一次匿名化，就不需要从用户到派生样本的反向索引", "B. 需要明示授权，并且给出可选粒度：按功能或按会话 opt-in", "C. 退出机制不能只做成「从现在起不再采集」，还必须能从后续批次里清除派生样本", "D. 后者要求你有从用户、会话到派生样本的反向索引", "E. 这笔债要在飞轮上线前还，否则删除请求来了只能装作处理过"], a: [1, 2, 3, 4], e: "A错误：匿名化不解决「用户要求清除其数据时你找不找得到衍生样本」这个问题，找不到就没法从后续批次里剔干净，正文要求的是可撤回加反向索引。B、C、D、E 成立：默认用户输入属于用户，授权要明示、粒度可选、退出要能追溯回来，这四件事是一条链。" },
  { q: "飞轮跑出「自我强化偏差」时，症状与对策的对应关系正确的有？", o: ["A. 对策还包括引入外部判据，并定期用非闭环数据做对照", "B. 提高闭环数据的采样频率，样本量上去后偏差会自行消解", "C. 症状包括文风趋同、稀有表达减少、同类错误反复出现", "D. 成因是正样本只来自当前模型的输出分布", "E. 对策之一是给人工范例设一个占比下限"], a: [0, 2, 3, 4], e: "B错误：加大同一分布的采样量只会把自我强化做得更彻底，问题在来源单一，不在数量不足。C、D、E、A 成立：这一失效的三条对策正文都列了——外部判据、人工范例占比下限、非闭环数据对照，共同点是往闭环里注入模型自己产不出的信息。" },
  { q: "线上指标显示采纳率连续上涨，同期次周留存下滑、工单量上升。关于这组读数，正确的有？", o: ["A. 采纳率在涨就说明优化有效，留存与工单的波动属于统计噪声", "B. 这是指标漂移的典型症状：代理指标被优化目标绑架", "C. 模型可能只是变得冗长、自信，而这两样恰好推高采纳率", "D. 处置方式是把在线指标与离线指标绑着看", "E. 应该加「不该涨的别涨」这类护栏指标"], a: [1, 2, 3, 4], e: "A错误：留存与工单量恶化正是被代理指标吃掉的那部分真实质量，把它们当噪声就等于确认了自己正在被单一指标绑架。B、C、D、E 成立：正文对这第二种失效给的对策就是在离线指标绑着看，再加护栏指标卡住不该动的量。" },
  { q: "关于「把日志当真相」这种失效，正确的有？", o: ["A. 照日志改了三版而用户行为反而变差，是它的典型症状", "B. 对策是留一小批人工专家标注，定期核对代理指标与真实质量是否相关", "C. 用户面对烂答案时的绕路行为，会被日志记成「这么用是合理的」", "D. 日志量足够大，就等价于信号可靠，不需要再请人工核对", "E. 日志记录的是「在当前模型下用户怎么应对」，它本身不是正确答案的分布"], a: [0, 1, 2, 4], e: "D错误：体量放大的是同一个系统性偏差，正文专门留人工专家标注这条对策，就是要定期验证代理指标与真实质量到底还相关不相关。E、A、B、C 成立：日志是应对记录而不是标准答案，把应对当真相，改的方向就会顺着当前模型的缺陷走。" },
  { q: "下列哪些条件下数据飞轮根本不成立，不该假装在转？", o: ["A. 日活只有几百条且全用同一个模板，有效样本近似于零", "B. 反馈不可验证：既没有程序判据，也买不起高质量人工判据", "C. 改进无法回灌：模型和数据实际上都动不了", "D. 目前只有编辑距离信号而还没有点赞数据", "E. 任务本身没人能说清什么叫好答案，比如创意与战略判断，日志里没有可学习的信号"], a: [0, 1, 2, 4], e: "D 不构成否决：飞轮要的三件事是流量覆盖真实分布、反馈可验证、改进能回灌，编辑距离在正文的分级里本来就强于点赞，缺点赞不影响飞轮成立。E、A、B、C 成立：三个条件要同时满足才谈得上转，缺哪一条都只剩「我们有海量日志」这句空话，此时该用规格、自建评测集和人工范例驱动迭代。" }
