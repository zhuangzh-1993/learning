<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大模型 (LLM) 全景通识 · 极客深度版</title>
<style>
  :root{--bg:#f8fafc;--panel:#fff;--code-bg:#0f172a;--text:#334155;--title:#0f172a;--muted:#64748b;--border:#e2e8f0;--b:#2563eb;--p:#7c3aed;--c:#0891b2;--g:#059669;--o:#ea580c;--r:#e11d48;--shadow:0 10px 30px -5px rgba(15,23,42,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
  .topbar{height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:110;position:relative}
  .topbar-left{display:flex;align-items:center;gap:12px}
  .menu-btn{display:none;background:none;border:none;font-size:24px;color:var(--title);cursor:pointer;padding:4px 8px;border-radius:6px}
  .menu-btn:active{background:#f1f5f9}
  .brand{font-size:17px;font-weight:900;color:var(--title);display:flex;align-items:center;gap:10px;letter-spacing:-.5px}
  .brand span{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--b),var(--p));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
  .badge{font-size:12px;font-weight:700;color:var(--r);background:#fff1f2;padding:4px 12px;border-radius:20px;border:1px solid #fecdd3}
  @media(max-width:768px){.badge{display:none}.brand{font-size:15px}.brand span{width:24px;height:24px;font-size:12px}.topbar{padding:0 12px}}
  .app{display:flex;height:calc(100vh - 60px);position:relative}
  .overlay{display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:rgba(15,23,42,.4);z-index:90;opacity:0;transition:opacity .3s}
  .overlay.show{display:block;opacity:1}
  .side{width:320px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:24px 16px;flex-shrink:0;z-index:100;transition:transform .3s ease}
  .group{margin-bottom:24px}
  .group-title{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding-left:10px;margin-bottom:8px}
  .nav{display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;border-radius:8px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:all .2s;margin-bottom:2px;line-height:1.5;position:relative;font-family:inherit}
  .nav:hover{background:#f1f5f9;color:var(--title)}
  .nav.on{font-weight:700}
  .nav.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:16px;border-radius:0 4px 4px 0}
  .c0 .nav.on{color:#475569;background:#f1f5f9}.c0 .nav.on::before{background:#475569}
  .c1 .nav.on{color:var(--b);background:#eff6ff}.c1 .nav.on::before{background:var(--b)}
  .c2 .nav.on{color:var(--p);background:#f5f3ff}.c2 .nav.on::before{background:var(--p)}
  .c3 .nav.on{color:var(--c);background:#ecfeff}.c3 .nav.on::before{background:var(--c)}
  .c4 .nav.on{color:var(--g);background:#ecfdf5}.c4 .nav.on::before{background:var(--g)}
  .c5 .nav.on{color:var(--o);background:#fff7ed}.c5 .nav.on::before{background:var(--o)}
  .c6 .nav.on{color:var(--r);background:#fff1f2}.c6 .nav.on::before{background:var(--r)}
  .c-exam .nav.on{color:#fff;background:var(--r)}.c-exam .nav.on::before{background:#fff}
  .main{flex:1;overflow-y:auto;padding:40px;scroll-behavior:smooth;position:relative}
  .article{max-width:900px;margin:0 auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:50px 60px;border:1px solid var(--border);animation:fade .4s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:768px){.menu-btn{display:block}.side{position:fixed;top:60px;left:0;bottom:0;transform:translateX(-100%);border-right:none;box-shadow:2px 0 10px rgba(0,0,0,.1)}.side.open{transform:translateX(0)}.main{padding:16px 12px}.article{padding:28px 20px;border-radius:12px}.h1{font-size:24px;margin-bottom:24px}.body p{font-size:15px;margin-bottom:14px}.body li{font-size:15px}.plain-text{font-size:14px;padding:12px}.note{padding:14px 16px;font-size:14px}.tbl{-webkit-overflow-scrolling:touch}}
  .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;padding:4px 12px;border-radius:6px;margin-bottom:16px;background:#f1f5f9;color:var(--b)}
  .h1{font-size:30px;font-weight:900;color:var(--title);margin-bottom:32px;line-height:1.3;letter-spacing:-.8px}
  .body h3{font-size:19px;font-weight:800;color:var(--title);margin:36px 0 16px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
  .body h4{font-size:16px;font-weight:700;color:var(--title);margin:24px 0 10px}
  .body p{font-size:16px;color:var(--text);margin-bottom:18px;text-align:justify}
  .body ul,.body ol{padding-left:24px;margin-bottom:20px}
  .body li{font-size:16px;margin-bottom:10px}
  .body li::marker{color:var(--b);font-weight:700}
  .body strong{color:var(--title);font-weight:800;background:linear-gradient(120deg,#e0e7ff,#e0e7ff) no-repeat 0 88%/100% 40%;padding:0 4px;border-radius:2px}
  .plain-text-li{color:#475569;font-style:italic;font-size:15px}
  .plain-text{color:#475569;font-style:italic;background:#f8fafc;border-left:3px solid #cbd5e1;padding:10px 16px;margin:-8px 0 20px;font-size:15px;border-radius:0 6px 6px 0}
  .note{padding:18px 24px;border-radius:8px;margin:24px 0;font-size:15px}
  .note-t{font-weight:800;margin-bottom:8px;font-size:16px}
  .note.exam{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}.note.exam .note-t{color:#be123c}
  .note.tip{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.note.tip .note-t{color:#15803d}
  .tbl{overflow-x:auto;margin:24px 0;border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.02)}
  table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:500px}
  th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
  th{background:#f8fafc;font-weight:800;color:var(--title);white-space:nowrap}
  tr:last-child td{border-bottom:none}tr:hover td{background:#f8fafc}
  .code{background:var(--code-bg);color:#e2e8f0;padding:16px 20px;border-radius:8px;font-family:Consolas,monospace;font-size:14px;line-height:1.6;overflow-x:auto;margin:20px 0}
  .code .c{color:#64748b;font-style:italic}
  .exam-header{text-align:center;margin-bottom:32px}
  .exam-title{font-size:32px;font-weight:900;color:var(--title);letter-spacing:-1px}
  .exam-desc{color:var(--muted);font-size:14.5px;margin-top:8px}
  .q-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;transition:box-shadow .2s}
  .q-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.05)}
  .q-title{font-size:16px;font-weight:800;color:var(--title);margin-bottom:16px;line-height:1.6}
  .q-title span{color:var(--b);margin-right:6px}
  .opt-list{display:flex;flex-direction:column;gap:10px}
  .opt-item{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:12px 16px;border:1px solid var(--border);border-radius:8px;transition:all .2s;background:#f8fafc}
  .opt-item:hover{background:#f1f5f9;border-color:#cbd5e1}
  .opt-item input[type="checkbox"]{width:18px;height:18px;margin-top:3px;cursor:pointer;accent-color:var(--b);flex-shrink:0}
  .opt-text{font-size:15px;color:var(--text);line-height:1.5}
  .opt-item.selected{background:#eff6ff;border-color:#93c5fd}
  .opt-item.correct{background:#ecfdf5;border-color:#86efac;color:#166534}
  .opt-item.wrong{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
  .ans-box{margin-top:20px;padding:20px;background:#f8fafc;border-radius:8px;border-left:4px solid var(--b);display:none}
  .ans-box.show{display:block}
  .ans-title{font-size:15px;font-weight:800;color:var(--b);margin-bottom:10px}
  .ans-text{font-size:14.5px;color:var(--text);line-height:1.7;margin-bottom:10px}
  .ans-exp{font-size:14px;color:#475569;background:#fff;padding:12px 16px;border-radius:6px;border:1px solid #e2e8f0}
  .score-panel{position:sticky;bottom:20px;background:#fff;border:2px solid var(--b);border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -10px 30px rgba(0,0,0,.1);z-index:10;margin-top:40px}
  .score-panel .stats{display:flex;gap:24px}
  .stat-item{display:flex;flex-direction:column}
  .stat-val{font-size:24px;font-weight:900;color:var(--title)}
  .stat-label{font-size:12px;color:var(--muted);font-weight:700}
  .btn-submit{background:var(--b);color:#fff;border:none;padding:12px 32px;font-size:16px;font-weight:800;border-radius:8px;cursor:pointer;transition:all .2s}
  .btn-submit:hover{background:#1d4ed8;transform:translateY(-2px);box-shadow:0 4px 12px rgba(37,99,235,.3)}
  .btn-submit:disabled{background:#cbd5e1;cursor:not-allowed;transform:none;box-shadow:none}
  .c7 .nav.on{color:#0d9488;background:#f0fdfa}.c7 .nav.on::before{background:#0d9488}
  .c8 .nav.on{color:#4f46e5;background:#eef2ff}.c8 .nav.on::before{background:#4f46e5}
  .c9 .nav.on{color:#b45309;background:#fffbeb}.c9 .nav.on::before{background:#b45309}
  .c10 .nav.on{color:#b91c1c;background:#fef2f2}.c10 .nav.on::before{background:#b91c1c}
  .c11 .nav.on{color:#0369a1;background:#f0f9ff}.c11 .nav.on::before{background:#0369a1}
  .c12 .nav.on{color:#4d7c0f;background:#f7fee7}.c12 .nav.on::before{background:#4d7c0f}
  .c13 .nav.on{color:#a21caf;background:#fdf4ff}.c13 .nav.on::before{background:#a21caf}
  .fig{border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin:24px 0;background:#fcfcfd}
  .fig-t{font-size:13px;font-weight:800;color:var(--title);margin-bottom:14px;letter-spacing:.2px}
  .fig-n{font-size:12.5px;color:var(--muted);margin-top:12px;font-style:italic;line-height:1.6}
  .flow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .box{flex:1 1 0;min-width:104px;padding:11px 12px;border-radius:8px;font-size:13px;font-weight:700;text-align:center;background:#f1f5f9;color:var(--title);border:1px solid #e2e8f0;position:relative;line-height:1.45}
  .box:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);font-size:15px;color:#94a3b8;background:#fcfcfd;padding:0 1px;line-height:1}
  .box.b{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}.box.p{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}
  .box.c{background:#ecfeff;border-color:#a5f3fc;color:#155e75}.box.g{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  .box.o{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.box.r{background:#fff1f2;border-color:#fecdd3;color:#9f1239}
  .stack{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--border);font-size:12px;font-weight:700;color:#fff}
  .seg{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;padding:0 6px}
  .s-b{background:#2563eb}.s-o{background:#ea580c}.s-p{background:#7c3aed}.s-g{background:#059669}.s-c{background:#0891b2}.s-r{background:#e11d48}
  .bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:8px 4px 0}
  .bar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .bar-h{width:100%;max-width:64px;border-radius:6px 6px 0 0;min-height:4px}
  .bar-h.old{background:#cbd5e1}.bar-h.new{background:#2563eb}.bar-h.bad{background:#e11d48}.bar-h.good{background:#059669}
  .bar-item span{font-size:12px;color:var(--muted);font-weight:700;text-align:center;line-height:1.4}
  .layers{display:flex;flex-direction:column;gap:8px}
  .layer{padding:11px 16px;border-radius:8px;font-size:13px;font-weight:700;border:1px solid;line-height:1.5}
  .l1{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}.l2{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}
  .l3{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.l4{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
  .l5{background:#fff1f2;border-color:#fecdd3;color:#9f1239}
  .pixgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:340px}
  .pixgrid.c4{grid-template-columns:repeat(4,1fr)}.pixgrid.c6{grid-template-columns:repeat(6,1fr)}
  .pix{aspect-ratio:1;border-radius:4px}
  .p0{background:#e2e8f0}.p1{background:#bfdbfe}.p2{background:#60a5fa}.p3{background:#1e40af}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .card{border:1px solid var(--border);border-radius:10px;padding:14px 18px;background:#fff}
  .card h4{margin:0 0 8px;font-size:15px;color:var(--title);font-weight:800;border:none;padding:0}
  .card p{font-size:14px;margin:0 0 6px}
  .tfm-flow{margin:24px 0;padding:18px;border:1px solid var(--border);border-radius:10px;background:#fcfcfd;display:flex;flex-direction:column;align-items:center;gap:6px}
  .tfm-node{width:100%;max-width:520px;padding:11px 14px;border-radius:8px;font-size:13.5px;font-weight:700;text-align:center;border:1px solid;line-height:1.5}
  .tfm-sub{display:block;font-size:12px;font-weight:500;color:#475569;margin-top:3px;font-family:Consolas,monospace}
  .tfm-arrow{color:#94a3b8;font-size:14px;line-height:1}
  .tfm-input{background:#f1f5f9;border-color:#cbd5e1;color:var(--title)}
  .tfm-attn{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .tfm-resid{background:#ecfeff;border-color:#a5f3fc;color:#155e75}
  .tfm-ffn{background:#f5f3ff;border-color:#ddd6fe;color:#5b21b6}
  .tfm-output{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  @media(max-width:768px){.tfm-flow{padding:12px}.tfm-node{font-size:12.5px;padding:9px 10px}.tfm-sub{font-size:11px}}
  @media(max-width:768px){.fig{padding:14px}.bars{height:140px;gap:8px}.box{min-width:80px;font-size:12px}.box:not(:last-child)::after{content:none}.flow{gap:8px}.pixgrid{max-width:100%}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="brand"><span>LLM</span> 极客深度版</div>
  </div>
  <div class="badge">白话硬核通识 · 50题抽题测试</div>
</header>

<div class="overlay" id="overlay"></div>

<div class="app">
  <aside class="side" id="side">
    <div class="group c0"><div class="group-title">第 0 章：全局认知</div><button class="nav on" data-id="c0">1. AI 概念全景图</button></div>
    <div class="group c1">
      <div class="group-title">第 1 章：大模型是怎么长大的</div>
      <button class="nav" data-id="c1_1">2. 预训练与分词算法 (BPE)</button>
      <button class="nav" data-id="c1_2">3. SFT 与人类对齐 (RLHF/DPO)</button>
      <button class="nav" data-id="c1_3">4. 企业调优与 LoRA/QLoRA</button>
    </div>
    <div class="group c2">
      <div class="group-title">第 2 章：大模型是怎么思考的</div>
      <button class="nav" data-id="c2_1">5. 解码参数与 reasoning_effort</button>
      <button class="nav" data-id="c2_2">6. 深度拆解：Transformer</button>
      <button class="nav" data-id="c2_2b">7. Transformer 进阶：残差与 FFN</button>
      <button class="nav" data-id="c2_2c">8. 注意力进阶与长度外推</button>
      <button class="nav" data-id="c2_3">9. 架构范式：Dense 与 MoE</button>
      <button class="nav" data-id="c2_3b">10. MoE 工程落地</button>
      <button class="nav" data-id="c2_3c">11. 非 Transformer 路线</button>
      <button class="nav" data-id="c2_4">12. 推理模型 vs 指令模型</button>
    </div>
    <div class="group c3">
      <div class="group-title">第 3 章：怎么让它替我们干活</div>
      <button class="nav" data-id="c3_1">13. RAG：检索增强</button>
      <button class="nav" data-id="c3_1b">14. RAG 进阶</button>
      <button class="nav" data-id="c3_2">15. Agent 与 MCP 协议</button>
      <button class="nav" data-id="c3_2b">16. 多智能体协作</button>
      <button class="nav" data-id="c3_3">17. AI 工作流设计模式</button>
    </div>
    <div class="group c4">
      <div class="group-title">第 4 章：大模型解决不了什么</div>
      <button class="nav" data-id="c4_1">18. 算不准数、幻觉与复杂度墙</button>
      <button class="nav" data-id="c4_2">19. 品味的真相</button>
    </div>
    <div class="group c5">
      <div class="group-title">第 5 章：工程部署与商业变现</div>
      <button class="nav" data-id="c5_1">20. KV Cache 与 PagedAttention</button>
      <button class="nav" data-id="c5_maas">21. MaaS 模式</button>
      <button class="nav" data-id="c5_2">22. 安全红线与商业 ROI</button>
    </div>
    <div class="group c6">
      <div class="group-title">第 6 章：Harness 与工程生态</div>
      <button class="nav" data-id="c6_harness">23. Harness 五大模块</button>
      <button class="nav" data-id="c6_spec">24. AGENTS / SKILL / DESIGN</button>
      <button class="nav" data-id="c6_sdd">25. SDD 理念与五步流程</button>
      <button class="nav" data-id="c6_sdd_tools">26. SDD 主流工具与工作模式</button>
      <button class="nav" data-id="c6_sdd_std">27. SDD 标准、写法与坑</button>
      <button class="nav" data-id="c6_eco">28. 工程生态与落地</button>
      <button class="nav" data-id="c6_2026">29. 2026.11 模型与工具实测</button>
    </div>
    <div class="group c7">
      <div class="group-title">第 7 章：多模态与生成模型</div>
      <button class="nav" data-id="c7_vlm">30. VLM：图像怎么变 Token</button>
      <button class="nav" data-id="c7_diff">31. 扩散模型：从噪声雕出图</button>
      <button class="nav" data-id="c7_omni">32. 语音、视频与全模态</button>
    </div>
    <div class="group c8">
      <div class="group-title">第 8 章：评测与质量度量</div>
      <button class="nav" data-id="c8_bench">33. 榜单全景与污染</button>
      <button class="nav" data-id="c8_judge">34. LLM-as-Judge</button>
      <button class="nav" data-id="c8_metrics">35. 离线与在线指标</button>
      <button class="nav" data-id="c8_golden">36. 自建黄金集</button>
    </div>
    <div class="group c9">
      <div class="group-title">第 9 章：提示工程进阶</div>
      <button class="nav" data-id="c9_fewshot">37. 指令结构与 Few-shot</button>
      <button class="nav" data-id="c9_struct">38. 结构化输出与可控性</button>
      <button class="nav" data-id="c9_longctx">39. 长上下文排布</button>
    </div>
    <div class="group c10">
      <div class="group-title">第 10 章：安全、合规与对抗</div>
      <button class="nav" data-id="c10_inject">40. 越狱与提示注入</button>
      <button class="nav" data-id="c10_guardrail">41. 护栏工程</button>
      <button class="nav" data-id="c10_privacy">42. 数据与隐私边界</button>

c0:{tag:"全局认知",title:"1. AI 概念全景图",html:`
<p>如果你把 LLM 想象成一个<strong>刚招进公司的超级实习生</strong>，一切就顺理成章了：</p>
<div class="tbl"><table>
<tr><th>概念</th><th>在“实习生”身上代表什么</th><th>解决什么问题</th></tr>
<tr><td><strong>预训练/后训练</strong></td><td>大学读的书 + 入职岗前培训</td><td>怎么把模型造出来</td></tr>
<tr><td><strong>调优 (LoRA)</strong></td><td>针对特殊业务开的小灶</td><td>通用模型→专用模型</td></tr>
<tr><td><strong>MoE</strong></td><td>大脑结构：叫醒相关脑区而非全脑运转</td><td>更聪明又省算力（但不省显存）</td></tr>
<tr><td><strong>RAG</strong></td><td>发给他一本《规章制度手册》</td><td>不知道公司内部事、容易瞎编</td></tr>
<tr><td><strong>Agent</strong></td><td>配了手机和电脑，动手去办</td><td>从“聊天”走向“执行”</td></tr>
<tr><td><strong>Harness</strong></td><td>公司的审批流+风控+操作记录仪</td><td>限制能做什么、追踪做了什么</td></tr>
</table></div>
<div class="fig"><div class="fig-t">图：整页的认知地图——六章分别在回答哪一个问题</div><div class="layers"><div class="layer l1">怎么造出来的（预训练 → 对齐 → 调优）：决定它「知道什么、会怎么说话」</div><div class="layer l2">它是怎么思考的（采样、注意力、MoE、快慢思考）：决定它「答案质量与成本从哪来」</div><div class="layer l3">怎么让它替我干活（RAG、Agent、工作流、多模态）：决定「能不能落地成动作」</div><div class="layer l4">它哪儿不行 + 怎么兜（幻觉、复杂度墙、评测、安全、容量、工程生态）：决定「出事谁负责、多少钱」</div></div><div class="fig-n">那张「超级实习生」的表是把这四层压缩成一句话：读书与培训是前两层，配工牌和操作手册是第三层，审批流与记录仪是第四层。面试时能顺着这四层讲下来，比背一堆名词有用得多</div></div>
<p class="plain-text">大白话：整张表其实是同一个故事——公司来了个天赋极高但没干过活的实习生。预训练是他读过的所有书（什么都能聊两句，但不懂你家规矩）；调优是他终于上了你们这条业务线的班；RAG 是你塞给他的一本员工手册（他不知道就翻，而不是硬编）；Agent 是给他配了工牌和电脑，从此他真能去操作系统；Harness 是审批流和操作日志——不是让他变聪明，而是让他在你容许的范围内别把事办砸，且办砸了能查到最后一步是谁点的。</p>

c1_1:{tag:"如何长大",title:"2. 预训练与分词算法 (BPE)",html:`
<h3>核心动作：文字接龙</h3>
<p>预训练是让模型在数万亿 Token 上做填空题。但模型不认识汉字，只认识数字 ID。如何把文本变成数字？靠<strong>分词器（Tokenizer）</strong>。</p>
<h3>BPE 与中文痛点</h3>
<p><strong>BPE (Byte-Pair Encoding)</strong> 是最主流的算法：从单个字符开始，不断将<strong>出现频率最高的相邻字符对</strong>合并成新 Token。</p>
<p>目前主流模型普遍使用 <strong>Byte-level BPE</strong>，即按字节（Byte）来合并。这导致一个中文汉字通常需要 2-3 个字节，换算下来，同一段话的中文消耗 Token 数往往是英文的 1.5 到 2 倍，直接推高了中文 API 的成本。</p>
<p class="plain-text">大白话：把文字当积木拼。BPE 找出现频率最高的两块拼在一起，变成大积木。因为中文的偏旁部首比英文单词更碎，所以拼同样意思的一句话，中文往往比英文多消耗点积木（Token）。</p>
<h3>缩放定律 (Scaling Laws)</h3>
<p>Chinchilla 定律表明，模型的参数量（N）与训练数据量（D）应按约 1:20 的比例同步增长。</p>
<div class="fig"><div class="fig-t">图：一句话怎么变成 Token ID——BPE 是「按频率粘积木」</div><div class="flow"><div class="box b">原始文本</div><div class="box c">UTF-8 字节流<br>汉字 3 字节、emoji 4 字节</div><div class="box p">统计相邻字节对频次</div><div class="box o">最高频的对合并成新符号<br>反复若干轮</div><div class="box g">查表得到 Token ID 序列</div></div><div class="bars"><div class="bar-item"><div class="bar-h good" style="height:58%"></div><span>英文一句话<br>约 10 个 token</span></div><div class="bar-item"><div class="bar-h bad" style="height:100%"></div><span>同一句中文<br>约 15~20 个 token</span></div></div><div class="fig-n">右侧那两根按正文口径画（同一段话中文消耗约为英文的 1.5~2 倍），根源就是中间那步是按字节合并：中文逐字切得碎、合并红利少。所以 API 账单上的中文比英文贵，不是歧视，是词表结构决定的</div></div>
<p><strong>compute-optimal（计算最优）</strong>是这套比例关系的实用读法：给定一笔算力预算，先决定「参数与数据各分多少」，而不是先造大模型再怪数据不够。按约 1:20 训到最优，单位算力的能力最强；但训练只付一次、推理要付无数次，所以推理量大的产品会故意反过来做——把模型做小、把数据喂到远超这个比例（即欠算力训练 / over-training）。判据也在这句话里：同一个 loss 水平下，参数量更小、数据量更大的那个配置，通常推理性价比更高。</p>
`},
c1_2:{tag:"如何长大",title:"3. SFT 与人类对齐 (RLHF/DPO)",html:`
<p>预训练出来的叫基座模型，像个只会接龙的书呆子。后训练让它变成有用且安全的助手。</p>
<h3>SFT (监督微调)</h3>
<p>用几万条人类写的高质量“指令-回复”对，教模型：当人类提问时，你要这样回答，而不是继续写诗。</p>
<h3>人类对齐 (Alignment)</h3>
<p>模型会说话了，但可能不礼貌或说脏话。需要让它符合人类价值观。</p>
<ul>
<li><strong>RLHF (PPO)：</strong> 极其复杂。先训练一个“奖励模型”模仿人类打分。然后用 PPO 算法让大模型（演员）去生成，奖励模型（裁判）打分，再由一个价值网络（评论家）计算优势，引导大模型更新参数。极易崩溃。</li>
<li><strong>DPO (直接偏好优化)：</strong> 2026年绝对主流。直接用“好回答 vs 坏回答”的数据对优化。在数学上它把奖励模型“内化”进了大模型本身，不需要再单独练裁判和评论家，训练极其稳定。</li>
</ul>
<p class="plain-text">RLHF 就像老板（奖励模型）给你打分，中间还要经过 HR（价值网络）传达，你才知道自己哪里好；DPO 则是老板直接把两份方案（好与坏）拍你桌上：“你自己对比着看，以后照着好的写”。</p>
<div class="fig"><div class="fig-t">图：RLHF 与 DPO 要同时在场几个模型——显存差在这里，崩溃面也在这里</div><div class="stack"><div class="seg s-b" style="flex:1">策略模型（在训）</div><div class="seg s-o" style="flex:1">参考模型（冻结）</div><div class="seg s-p" style="flex:1">奖励模型（裁判）</div><div class="seg s-r" style="flex:1">价值网络（评论家）</div></div><div class="grid2"><div class="card"><h4>RLHF / PPO：四个模型常驻</h4><p>每轮还要用当前策略在线采样生成大量回答，再让裁判逐个打分。显存与算力都是大头，且 KL 系数、奖励尺度任何一个失衡都可能把训练带崩。</p></div><div class="card"><h4>DPO：一个在训 + 一个冻结参考</h4><p>直接把「好回答 / 坏回答」的成对数据拿去优化，奖励被数学地内化进策略里，不再需要在线采样和评论家。稳、省，但只能学到已有标注分布内的偏好。</p></div></div><div class="fig-n">同一条蓝线（策略模型）之外，多出来的每一块都是显存和一处可能的故障点——这就是「RLHF 极强但极易崩，DPO 成为主流」的工程量级原因</div></div>
<p><strong>reward hacking</strong> 是对齐里最稳定的一类失效：策略模型不去提升真实质量，而是去提升裁判给的分数。典型征兆是回答长度持续膨胀而内容变空、开头堆免责与复述提问骗取「结构完整」、自动分数一路上升而人工盲评胜率下降。工程上两条对策：一是用多个独立裁判组成 <strong>ensemble</strong> 交叉打分——策略只讨好某一个打分器时分歧会立刻变大；二是把 KL 约束与人工抽检绑在奖励曲线上看，标量指标单独好看不足以证明在变好。</p>
`},
c1_3:{tag:"如何长大",title:"4. 企业调优与 LoRA/QLoRA",html:`
<h3>全参微调 vs LoRA vs QLoRA</h3>
<p>全参微调需要更新所有参数，容易发生<strong>灾难性遗忘</strong>，且要求极高的显存。只训练一小部分参数的做法统称 <strong>PEFT</strong>（参数高效微调），LoRA 是其中最主流的一支。</p>
<p><strong>LoRA (低秩适应)：</strong> 冻结原模型。在每层旁外挂极小的矩阵，只训练这些旁路。显存需求大降。</p>
<p><strong>QLoRA：</strong> 更极端的省钱大法。先把基座模型<strong>量化（压缩）到 4-bit</strong> 存在显存里，计算时临时反量化回 16-bit，同时外挂 LoRA 训练。这让单张 24GB 甚至 12GB 的消费级显卡都能微调 70B 的大模型。</p>
<p class="plain-text">大白话：LoRA 是不拆原模型的脑子，在旁边外挂一小块可训练的"补丁"，只练补丁；QLoRA 更狠，先把原模型压缩打包塞进小显存，要用时再临时解压，所以一张家用级显卡也能调教 70B 的大模型。</p>
<div class="fig"><div class="fig-t">图：同样叫「微调」，显存里要摆的东西完全不同（相对量级示意）</div><div class="layers"><div class="layer l1">全参微调：权重 + 全部梯度 + 每个参数的优化器状态（Adam 两份）+ 激活 → 常驻量是权重的好几倍，还要防灾难性遗忘</div><div class="layer l2">LoRA：冻结权重（只要前向）+ 每层旁挂两个小矩阵 + 只给旁路算梯度和状态 → 训练态显存断崖式下降</div><div class="layer l3">QLoRA：把冻结权重压成 4-bit 存着（用时临时反量化回 16-bit 算）+ 分页优化器 + 只训旁路 → 消费级单卡也能碰大模型</div></div><div class="grid2"><div class="card"><h4>省在哪</h4><p>省的不是「模型变小」，而是<strong>要更新和要留状态的那部分变小</strong>。冻结的主体只负责前向。</p></div><div class="card"><h4>代价在哪</h4><p>旁路容量有限：调教行为与风格在行，注入大量新知识不在行；反量化还有时间开销。</p></div></div><div class="fig-n">按正文口径：QLoRA 让单张 24GB 甚至 12GB 的卡也能微调 70B 级模型——前提是你接受它学的是「怎么做」而不是「知道什么」</div></div>
<h3>LoRA 的 rank 与 alpha：两个能手算的数</h3><p><strong>LoRA rank</strong> 决定旁路矩阵的容量，<strong>LoRA alpha</strong> 与 rank 的比值决定旁路的说话分贝，两个数要分开调：只改一个等于同时动了容量与步长。</p>
<p>LoRA 把一个投影矩阵 W（d_out×d_in）拆成 B·A，参数量是 <strong>rank × (d_in + d_out)</strong>。取 d_model=4096、只给每层的 Q 与 V 挂旁路、rank=16：<code>2 × 16 × 4096 × 32 层 ≈ 840 万</code>，相对 7B（70 亿）约 <strong>0.12%</strong>。换成 rank=64 就是四倍，约 3400 万，仍然不到 0.5%。<strong>alpha</strong> 是另一个旋钮：实际写入的是 <code>h = (alpha / rank)·B·A·x</code>，所以 alpha/rank 这个比值决定旁路的说话分贝——常配 alpha=2×rank（比值 2）或直接等于 rank（比值 1）；改 rank 不改 alpha，等于同时改了容量和步长，两个变量要分开看。初始化时 B 取 0，保证刚挂上时旁路输出为零、模型行为与基座完全一致，之后从「什么都不改」开始学。</p>
<p class="plain-text">大白话：rank 是这条旁路能记住多少件事（本子有几页），alpha/rank 是它说话的声音有多大。写 840 万这个数字的好处是你能自查：一层两个矩阵、每个矩阵 16 行 4096 列、乘 32 层、再乘 2——算出 840 万而不是 8400 万，说明你确实理解了这个式子，而不是在背结论。</p>
<h3>剪枝：省参数不等于省时间</h3>
<p>压缩有四个旋钮——量化（降每参数位宽）、蒸馏（换小模型）、低秩（LoRA/Adapter，只加可训练旁路）、剪枝（删掉不重要的权重或结构）。前三者前面都讲过，剪枝容易被想当然：<strong>把权重按绝对值剪掉 90%，模型并不会跑得更快</strong>。非结构化剪枝得到的是一个「稀疏但形状不变」的矩阵，通用 GPU 上照样按稠密矩阵算，省的是存储、不是时间。</p>
<ul>
<li><strong>结构化剪枝：</strong> 整头、整层、整通道地删——注意力头、FFN 中间维度、甚至整层。删完矩阵形状真变小，显存与时间一起降；代价是精度掉得比非结构化快，通常要配一轮重训（剪—重训—再剪，迭代几轮），常与蒸馏一起用。</li>
<li><strong>半结构化稀疏（2:4）：</strong> 每 4 个权重里固定保留 2 个。这是目前唯一「硬件买单」的稀疏形态，安培之后的张量核心直接支持，能拿到接近 2 倍的算力；它的实际价值在于和量化叠加——2:4 稀疏加 INT8，才有量级收益。</li>
</ul>
<p>顺序上有讲究：<strong>先蒸馏出小模型，再结构化剪枝，最后量化</strong>。量化放最后，因为它最伤可训练性，量化完再想剪或再想重训都很别扭。</p>
`},
c2_1:{tag:"思考机制",title:"5. 解码参数与 reasoning_effort",html:`
<p>模型输出前，解码参数决定了如何从概率中选词；而对于推理模型，<code>reasoning_effort</code> 决定了思考深度。</p>
<h3>1. 传统采样参数</h3>
<ul>
<li><strong>Temperature：</strong> 缩放 Logits。越低越保守，越高越发散。</li>
<li><strong>Top_k：</strong> 固定保留概率最高的 K 个词。</li>
<li><strong>Top_p：</strong> 动态保留累计概率达到 p 的词。</li>
<li class="plain-text-li">大白话：Top_k 是"只留成绩前 K 名"；Top_p 是"只留加起来占九成把握（p=0.9）的那批人"，人多人少看战况，分布分散时多留几个，分布集中时少留几个，比固定名额更灵活。</li>
<li><strong>Min_p：</strong> 相对概率下限。词的概率必须 ≥ (Min_p × 最大概率)。对分布形状更鲁棒。</li>
</ul>
<h3>2. reasoning_effort：思考预算控制</h3>
<p>这是厂商中立的参数，控制模型在内部推理阶段花多少 Token。OpenAI 支持 low 到 xhigh，DeepSeek 默认 high。</p>
<p><strong>互斥陷阱：</strong> GPT-6 Astra 在推理模式下会直接拒绝 temperature 和 top_p 参数。要恢复采样控制，必须显式传 <code>reasoning_effort: "none"</code>（且部分模型不支持 none）。</p>
<p><strong>收益递减：</strong> 2026 年实测，xhigh 的成本是 medium 的 2-4 倍，但在很多代码任务上得分反而更低。日常用 medium 更稳。</p>
<h3>2b. 三个重复惩罚参数：Repetition / Presence / Frequency</h3>
<p><strong>Repetition Penalty：</strong>对已出现词的 Logits 做乘法缩放（如 1.1），重复概率被成倍压低，力度随重复累积，是治"复读机"的首选，与下方生产口诀对应。<strong>Presence Penalty：</strong>只要词出现过就整体减一个固定值，只看出没出现过、不看次数，适合逼模型换新话题。<strong>Frequency Penalty：</strong>按出现次数成比例施加惩罚，出现越多压得越狠，介于前两者之间，适合抑制高频词堆砌。</p>
<p class="plain-text">大白话：Repetition Penalty 是"再说一遍，价格翻倍"；Presence Penalty 是"提过一次就收一张入场费"；Frequency Penalty 是"说得越多次，收费越贵"。复读机优先调 Repetition Penalty；想话题发散用 Presence；想少说口头禅用 Frequency。</p>
<p><strong>叠加提醒：</strong>三参数可同时生效，但方向要一致；同时调高惩罚与调高 Temperature 会互相拉扯，多数场景只调一个即可。部分推理模式（见上文互斥陷阱）不接受这些采样参数，需先退出推理模式再调。</p>
<div class="note exam"><div class="note-t">💡 生产配置口诀</div>
延迟敏感→low；日常通用→medium；复杂代码→high；极难审计→xhigh。出现复读机时，优先调高 Repetition Penalty。</div>
<div class="fig"><div class="fig-t">图：解码参数改变的是分布形状，档位改变的是思考预算——两件事别混</div><div class="layers"><div class="layer l1">Temperature：整体缩放 Logits。调低分布变尖、熵下降；调高分布拉平、长尾词更容易被选中</div><div class="layer l2">Top-k 固定名额 / Top-p 固定累计概率 / Min-p 相对最高分的比例门槛——三种「截断候选」的口径各不相同</div><div class="layer l3">reasoning_effort：不是采样参数，而是给内部推理分配多少 token；推理模式常常直接拒绝 temperature 与 top_p</div></div><div class="bars"><div class="bar-item"><div class="bar-h good" style="height:12%"></div><span>low<br>成本 1×</span></div><div class="bar-item"><div class="bar-h new" style="height:25%"></div><span>medium<br>约 2×</span></div><div class="bar-item"><div class="bar-h old" style="height:50%"></div><span>high<br>约 4×</span></div><div class="bar-item"><div class="bar-h bad" style="height:100%"></div><span>xhigh<br>约 8×（= medium 的 4 倍，取正文上限）<br>代码任务得分可能反而更低</span></div></div><div class="fig-n">左边三层管「同一个概率分布里怎么选词」，右边那组管「愿意为想清楚花多少钱」。倍数一律以 low 为基准，xhigh 按正文「medium 的 2~4 倍」的上限画——实际区间落在 4× 到 8× 之间。生产口诀：延迟敏感 low、通用 medium、复杂代码 high、极难审计才 xhigh</div></div>`},
c2_2:{tag:"底层架构",title:"6. 深度拆解：Transformer",html:`
<h3>Q、K、V 矩阵</h3>
<p>每个词变成向量后，乘三个矩阵得到 Q(Query)、K(Key)、V(Value)。用 Q 和 K 点积算相关性权重，再对 V 加权求和。</p>
<h3>Transformer 到底在干什么？</h3>
<p>一句话：<strong>让句子里的每个词，去句子里的其他词那里按需取信息，然后更新自己。</strong>一个 Transformer Block 只做两件事：开会（注意力，词与词交换信息）和消化（FFN，各词独立加工）。剩下的所有零件——Q/K/V、√d_k、多头、位置编码、残差、Norm——都是为了把这两件事做得又准又稳。</p>
<p class="plain-text">大白话：处理"小明把苹果给了小红，她很开心"这句话，"她"这个词要通过注意力去问全场："谁最像我指的对象？"其他词各自报上匹配分，"小红"分最高，"她"就把"小红"的信息大量拿过来，变成了"她=小红"的向量。这就是 Transformer 的全部核心，后面的公式只是把这个问答做得更精细。</p>
<div class="tfm-flow">
<div class="tfm-node tfm-input">输入词向量<br><span class="tfm-sub">token embedding + 位置编码</span></div>
<div class="tfm-arrow">↓</div>
<div class="tfm-node tfm-attn">多头自注意力<br><span class="tfm-sub">Q / K / V 点积 → ÷ √d_k → Softmax → 加权求和 V</span></div>
<div class="tfm-arrow">↓</div>
<div class="tfm-node tfm-resid">残差 + Norm<br><span class="tfm-sub">x = Norm(x + Attention(x))</span></div>
<div class="tfm-arrow">↓</div>
<div class="tfm-node tfm-ffn">FFN 前馈网络<br><span class="tfm-sub">各词独立加工</span></div>
<div class="tfm-arrow">↓</div>
<div class="tfm-node tfm-resid">残差 + Norm<br><span class="tfm-sub">x = Norm(x + FFN(x))</span></div>
<div class="tfm-arrow">↓</div>
<div class="tfm-node tfm-output">输出（送入下一层 / 上层）</div>
</div>
<p class="plain-text">你在图书馆找书。Q 是搜索词；K 是书上的标签；V 是书里的内容。Q 和 K 匹配得越高，书的 V 权重就越大。</p>
<h3>为什么除以 √d_k？</h3>
<p>点积是把 Q 和 K 的每个维度对应相乘再求和。维度 d_k 越大，加在一起的项就越多，点积的结果数值也就越大（大约随 √d_k 增长）。</p>
<p>问题在于 Softmax 是一个“指数放大器”：输入数值一大，输出就变成接近 1 和接近 0 的极端分布。极端分布下梯度几乎为 0，训练就停摆了。除以 √d_k 正是把点积分数拉回 Softmax 的“舒适区”。</p>
<p class="plain-text">大白话：点积分数会随维度变大而虚高，直接喂给 Softmax 会导致“一家独大”。除以 √d_k 是给分数降降温，让注意力权重保持平滑、可训练。</p>
<h3>自注意力与多头注意力是什么关系？</h3>
<p><strong>自注意力（Self-Attention）是一种机制，多头注意力是它的多份并行副本。</strong>“自”指的是 Q、K、V 都来自同一句话：序列中每个词对这句话里的所有词（包括自己）算相关性，再按权重取信息，而不是去别处要信息。</p>
<p>一次自注意力只有一组 Q/K/V 权重，只能捕捉一种关系模式（比如只盯住指代关系）。为了让模型同时看到多种关系，把每个词的向量切成 h 份，每份配上各自独立的 Q、K、V 矩阵，独立做一次完整的自注意力——这就是<strong>多头注意力</strong>。各头的输出拼接后再过一次线性变换融合。</p>
<p class="plain-text">大白话：自注意力是“开一次会，全场互相打分、按分取信息”；多头注意力是“同时开 h 个主题不同的小组会，每个会场只拿一小份人马，各聊各的角度（语法、指代、位置……），散会后把所有会议纪要拼接汇总”。多头不是新机制，而是把自注意力并行复制多份、让每份学不同的关注点。</p>
<h3>位置编码：RoPE 旋转</h3>
<p>Transformer 是同时看所有词的，不知道语序。现在最主流的 <strong>RoPE</strong> 把位置信息当成一种<strong>旋转角度</strong>，加到 Q 和 K 向量上。</p>
<p class="plain-text">想象两个齿轮咬合（词与词的注意力匹配），如果它们的位置不同，相对旋转的角度就不同。通过这种“转圈圈”，模型就精确知道了谁在前面、谁在后面。</p>
`},
c2_2b:{tag:"底层架构",title:"7. Transformer 进阶：残差、FFN 与整体流水线",html:`
<h3>一个完整 Block 的流水线</h3>
<p>上一节讲了注意力，但一个 Transformer Block 还有一个常被忽略的另一半：<strong>前馈网络（FFN）</strong>。完整流水线是：</p>
<div class="code"><span class="c">// 一个 Block 的数据流（Pre-Norm 结构）</span>
x = x + Attention(Norm(x))   <span class="c">// 注意力子层：词与词交换信息</span>
x = x + FFN(Norm(x))         <span class="c">// 前馈子层：每个词独立加工</span></div>
<p class="plain-text">注意力像开会：大家互相交流信息；FFN 像会后各自回工位消化笔记。开会交换的是“谁和谁相关”，消化才是把信息真正变成自己的知识——FFN 通常占模型三分之二的参数量。</p>
<h3>残差连接：为什么 x = x + f(x)？</h3>
<p>深层网络直接堆叠时，梯度传回去会一路衰减，几十层根本训不动。<strong>残差连接</strong>让每一层只学“增量”（要改什么），而不是重写全部：</p>
<ul>
<li>梯度可以经由恒等捷径无损地直通底层，几十上百层也能训练。</li>
<li>每层默认做“无操作”是安全的，网络只需学习在此基础上微调，训练更稳定。</li>
</ul>
<h3>LayerNorm / RMSNorm：稳定数值</h3>
<p>归一化把每层输出的数值拉回稳定区间，防止训练中数值爆炸。<strong>LayerNorm</strong> 对每个 Token 的特征维度算均值和方差再缩放；现代大模型（LLaMA 等）多用简化版 <strong>RMSNorm</strong>（去掉均值中心化），配合 <strong>Pre-Norm</strong>（归一化放在子层之前）比早期 Post-Norm 训练更稳定。</p>
<h3>FFN 里的 SwiGLU 激活</h3>
<p>FFN 是两层矩阵变换夹一个非线性激活，没有激活整个网络就退化成一次线性变换。现代主流激活是 <strong>SwiGLU</strong>：把输入分成两路，一路过 Swish 激活后与另一路相乘（门控），让网络自己学会“哪些特征该放行”。</p>
<h3>Encoder-Decoder 与 Decoder-Only</h3>
<ul>
<li><strong>Encoder-Decoder：</strong> 原始 Transformer 设计，编码器理解输入、解码器生成输出，适合翻译这类“先读懂再写出”的任务（T5、BART）。</li>
<li><strong>Decoder-Only：</strong> 只保留解码器，统一做“接下一个词”，GPT、LLaMA、DeepSeek 及当前几乎所有大模型都是这一形态。对生成任务和统一接口（万物皆 Token 接龙）来说，它更简洁高效。</li>
<li><strong>BERT 类（Encoder-Only）：</strong> 只做理解不做生成，用于分类、检索、句向量。</li>
</ul>
<p class="plain-text">记住一个判断式：只输出理解结果（打标签、算相似度）用 Encoder-Only；要生成文字，现在一律 Decoder-Only。</p>
<div class="fig"><div class="fig-t">图：残差流——每一层只往同一条向量上「打补丁」</div><div class="flow"><div class="box b">输入向量 x</div><div class="box c">注意力子层<br>x ← x + Attn(Norm(x))</div><div class="box p">FFN 子层<br>x ← x + FFN(Norm(x))</div><div class="box o">下一层继续打补丁</div><div class="box g">末层读出</div></div><div class="bars"><div class="bar-item"><div class="bar-h new" style="height:100%"></div><span>FFN 参数<br>约占三分之二</span></div><div class="bar-item"><div class="bar-h old" style="height:50%"></div><span>注意力参数<br>约占三分之一</span></div></div><div class="fig-n">因为恒等捷径一直在，网络默认行为是「不改」，每层只学生成的那一点增量——这就是几十上百层还能训得动的机制原因。参数大头在 FFN（会议后各自回工位消化的那一步），注意力负责交换信息，两者比例按正文口径约 2:1</div></div>
<h3>顺手把形状记号钉住：d_model、d_ff、one-hot、argmax</h3>
<p><strong>d_model</strong> 是隐藏维度——每个 token 在层与层之间流动时保持的那个向量宽度（如 4096）。<strong>d_ff</strong> 是 FFN 中间层的扩展维度：原版 Transformer 取 4×d_model，SwiGLU 一代因为把输入拆成三路矩阵，常改成约 8/3×d_model，这样两种结构的参数量才对得上。<strong>one-hot</strong> 是「词表里第 k 个位置为 1、其余为 0」的数学写法，说输入嵌入是查表，等价于 one-hot 乘上 V×d 的矩阵，只是没人真去乘。词表层输出上，<strong>softmax</strong> 让整份词表互相竞争、概率和为 1；<strong>sigmoid</strong> 是每个标签独立打分，适合多标签而不适合「只能出一个词」的位置；取概率最高的那个 token 就叫 <strong>argmax</strong>，它等价于 temperature 调到 0 的贪心解码。</p>
<p class="plain-text">大白话：d_model 是流水线上每个工件的宽度，全程不变；d_ff 是工位中间那块临时大台面，先摊开再收回来。one-hot 是「只在一格里写 1」的点名册，工程上没人真拿点名册去乘矩阵，直接按号取货。softmax 是一班人抢一个名额，sigmoid 是每个名额各自投票，argmax 是不掷骰子、直接叫第一名。</p>
`},
c2_2c:{tag:"底层架构",title:"8. 注意力进阶：掩码、并行度与长度外推",html:`
<h3>Causal Mask：把打分矩阵变成下三角</h3>
<p>Decoder-Only 训练把整条序列一次前向算完，但任务是"预测下一个词"。若打分矩阵全可见，每个词都注意力到自己的"标准答案"，任务崩坏。做法是给 QK^T 加掩码：上三角整片置负无穷，Softmax 后恰好归零。每行（第 i 个 query）只能读第 ≤i 列（key），矩阵变成下三角，与逐个自回归严格等价——并行训练是免费的午餐，掩码保证它不偷看。</p>
<div class="fig"><div class="fig-t">图：6 个 Token 的因果掩码注意力矩阵（深=自身，浅=可见的过去，灰=被屏蔽的未来）</div><div class="pixgrid c6"><div class="pix p3"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p1"></div><div class="pix p3"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p3"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p3"></div><div class="pix p0"></div><div class="pix p0"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p3"></div><div class="pix p0"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p1"></div><div class="pix p3"></div></div><div class="fig-n">行=查询 Token，列=键 Token。每行只放行自己左边的格子，这就是"不偷看未来"的全部实现。</div></div>
<h3>O(n^2) 的具体含义</h3>
<p>打分矩阵是 n×n：长度翻倍，注意力计算变 4 倍，FFN 等线性项只变 2 倍，总成本超线性。FlashAttention 只是不让那个矩阵在显存里整个落地（激活显存降到近似线性），计算仍是二次——IO 优化，不是复杂度革命。对照 KV Cache（c5_1）：大小随 n 线性增长，缓存量 = 2 × 层数 × n × KV 头数 × 每头维度 × 每参数字节。所以 Prefill 撞算力墙（二次），Decode 撞带宽与缓存墙（线性）。</p>
<div class="fig"><div class="fig-t">图：序列长度 ×2、×4 时，注意力计算（左）与 KV Cache（右）的不同增速</div><div class="bars"><div class="bar-item"><div class="bar-h old" style="height:5%"></div><span>注意力 1x</span></div><div class="bar-item"><div class="bar-h old" style="height:22%"></div><span>2x</span></div><div class="bar-item"><div class="bar-h old" style="height:88%"></div><span>4x</span></div><div class="bar-item"><div class="bar-h good" style="height:22%"></div><span>缓存 1x</span></div><div class="bar-item"><div class="bar-h good" style="height:44%"></div><span>2x</span></div><div class="bar-item"><div class="bar-h good" style="height:88%"></div><span>4x</span></div></div><div class="fig-n">柱高按各自倍数归一：二次是 1:4:16，线性是 1:2:4。长度翻倍时缓存只翻倍，注意力翻四倍。</div></div>
<h3>MHA / GQA / MQA：KV 头数的谱系</h3>
<p>多头（c2_2）里 KV Cache 只取决于 K/V 头数，与 Q 头数无关，于是"砍 KV 头"成了最直接的缓存旋钮：MHA 每个 Q 头配一组独立 K/V；GQA 让一组 Q 头共享一组 K/V；MQA 全部 Q 头共用一组。32 个 Q 头配 8 个 KV 头，缓存缩到 1/4，而 Q 侧投影与注意力计算几乎没少——省的是显存与带宽。MQA 省得最狠但质量损失明显，GQA 是当前默认。</p>
<div class="tbl"><table><tr><th>形态</th><th>KV 头数（32 个 Q 头示例）</th><th>KV Cache 相对量</th><th>取舍</th></tr><tr><td>MHA</td><td>32（一对一）</td><td>1x</td><td>质量上限高，缓存最贵</td></tr><tr><td>GQA</td><td>4~8（分组共享）</td><td>1/4 ~ 1/8</td><td>缓存数倍缩小、质量近乎无损，当前主流</td></tr><tr><td>MQA</td><td>1（全部共享）</td><td>1/32</td><td>最省，长文质量损失最可见</td></tr></table></div>
<p class="plain-text">大白话：Q 头是听众，K/V 是板书。MHA 是 32 个听众各配一名专属板书员，贵；GQA 是几名听众共用一块黑板，省下的全是黑板面积（显存），抄错的风险几乎没涨。</p>
<div class="fig"><div class="fig-t">图：三档注意力——Q 头不变，KV 头数从「每头一份」收到「全部共享一份」</div><div class="grid2"><div class="card"><h4>MHA：Q 与 KV 一一对应</h4><p>64 个 Q 头配 64 个 KV 头。表达力最强，KV Cache 最大：每 token 每层要存 2 × 64 × 128 个数。</p></div><div class="card"><h4>GQA：一组 Q 共享一份 KV</h4><p>64 个 Q 头分成 8 组，每组共用 1 个 KV 头。attention 内的表达力几乎不掉，KV 直接砍到 1/8——这就是「省显存只砍 KV 头数」的由来。</p></div><div class="card"><h4>MQA：全场共享一份 KV</h4><p>64 个 Q 头共用 1 个 KV 头。KV 最小（1/64），但质量损失开始明显，适合显存极紧、上下文极长的场景。</p></div><div class="card"><h4>读数口诀</h4><p>Q 头数决定「同时看多少种关系」，KV 头数决定「缓存要存多少」。GQA 的价值在于：把后者单独调小，前者不用动。</p></div></div><div class="fig-n">三档是连续谱：group_size=1 退化成 MHA，group_size=头数 退化成 MQA，GQA 是中间那档。c11_ledger 里「10 GB 变 80 GB」就是 MHA 与 GQA 的 8 倍差。</div></div>
<h3>为什么训练窗口短、推理窗口可以长</h3>
<p>训练要沿全序列反向传播，二次成本加上超长语料稀缺，基座训练窗口通常偏短；推理只做一次前向、缓存装得下就行，所以可用位置插值（Position Interpolation）拉宽窗口：把超范围的位置线性压回训练见过的区间。RoPE 尤其吃这一套，因为它的位置是旋转角度：调大基频让每步转得更慢，同样的角度范围就能覆盖更长序列——"改频率"的直觉是齿轮没变、指针走慢了，一圈从管一天变成管一周，新位置的角度差仍落在模型见过的范围内。这类手段通常还要配少量长文微调。</p>
<h3>滑窗与局部-全局混合堆叠</h3>
<p>不想付二次成本就分层设计：一部分层用滑动窗口注意力，每个 Token 只看宽度 w 的局部窗口，单层计算从 O(n^2) 降到 O(n·w)；另一部分层保留全局注意力负责远程整合。局部层与全局层交错堆叠，配合各层共享的开头锚点段，远程信息由少数全局层搭桥。</p>
<h3>长上下文真实退化：两个来源</h3>
<ul>
<li><strong>训练分布外推：</strong> 超出训练范围的位置值或旋转角度模型从没见过，注意力模式不可靠——标称窗口不等于有效窗口。</li>
<li><strong>注意力稀释：</strong> Softmax 要把 n 个分数归一成概率，序列越长、每个相关片段摊到的权重越薄；中段与首尾的关联都弱，召回最差，即 Lost in the Middle——关键信息放头尾是最朴素的缓解。</li>
</ul>
<div class="note exam"><div class="note-t">💡 考点</div>因果掩码让"整条并行训练"与"逐个自回归生成"等价；注意力计算二次、KV Cache 线性，Prefill 与 Decode 瓶颈性质不同；GQA/MQA 只砍 KV 头数省显存带宽；长上下文退化的两个来源：分布外推 + 注意力稀释。</div>
`},
c2_3:{tag:"架构范式",title:"9. 架构范式：Dense 与 MoE",html:`
<h3>Dense (稠密模型)</h3>
<p>每次推理，所有参数都参与计算。</p>
<h3>MoE (混合专家)</h3>
<p>模型拆成多个专家。Router 只选择 Top-K 个专家计算，打破参数量与计算量的绑定。</p>
<h3>MoE 的核心难题：负载均衡</h3>
<p>如果 Router 总是选那几个专家，其他专家会“饿死”，模型退化。为了解决这个，训练时引入<strong>负载均衡损失（Auxiliary Loss）</strong>，强迫 Router 把任务均匀分给各个专家。</p>
<p class="plain-text">公司有几百个部门（专家），前台（Router）派活时，不能总把活派给那几个劳模，否则其他人闲死，劳模累死。系统要强行干预，确保每个部门都有活干，这样才能全面发展。</p>
<div class="fig"><div class="fig-t">图：MoE 的前向路径——参数总量不变，每个 Token 只点亮其中一小撮</div><div class="flow"><div class="box b">一个 Token 进入某层</div><div class="box c">Router 给全部专家打分</div><div class="box p">取 Top-K 个专家（常见 K=2）</div><div class="box o">专家 FFN 各自计算</div><div class="box g">按路由权重加权合并</div></div><div class="bars"><div class="bar-item"><div class="bar-h new" style="height:100%"></div><span>Dense<br>算力=全部参数</span></div><div class="bar-item"><div class="bar-h new" style="height:15%"></div><span>MoE<br>算力≈激活参数</span></div><div class="bar-item"><div class="bar-h old" style="height:100%"></div><span>Dense<br>显存常驻</span></div><div class="bar-item"><div class="bar-h bad" style="height:100%"></div><span>MoE<br>显存仍要全放</span></div></div><div class="fig-n">左边两根是「每个 Token 算多少」，右边两根是「显存里得摆多少」。MoE 那根 15% 是按「激活参数约占总量一到两成」画的示意图，不是某个型号的实测值；关键结论是：省的是算力、不省显存——这就是那句「省算力不省显存」的来历。中间还藏着容量因子，分不到名额的 Token 会被丢弃或溢出</div></div>`},
c2_3b:{tag:"架构范式",title:"10. MoE 工程落地：路由、并行与通信墙",html:`
<h3>Top-K 路由与容量因子：谁会被拒收</h3>
<p>Router 给每个 Token 对所有专家打分，取 Top-K（常见 K=2，另配 1 个常开专家）。但挤向最合适的专家会让负载失衡，于是工程上设容量：每个专家单步接收"平均 Token 数 × 容量因子（Capacity Factor，略大于 1）"的名额，溢出的 Token 被直接丢弃，输出为零，原向量靠残差（c2_2b）带过去。容量因子是个两难旋钮：调小丢 Token 伤精度，调大给闲置专家白留显存。推理时可用动态缓冲避免丢弃，代价是耗时不均。</p>
<p class="plain-text">大白话：医院分诊台。每个科室每天只放"平均人数 × 一点余量"的号（容量因子）：号少了病患被劝退回家（Token 被丢），号多了科室空转还照付工位钱（白占显存）。导诊员（Router）既要分对科又要填满号，所以被负载均衡考核（辅助损失）逼着调整派单手法。</p>
<h3>All-to-All：MoE 真正的墙</h3>
<p>MoE 层把"一次矩阵乘"拆散了：Token 和专家分散在不同设备上，所以每个 MoE 层要做两次 All-to-All 通信——先把 Token 发往持有其选中专家的设备（dispatch），算完再把结果送回原设备（combine）。贵的不是计算，是这两趟来回搬激活的网络流量：单节点内 NVLink 带宽还扛得住，专家并行跨节点就撞上网卡瓶颈，FLOPs 没打满、网络先打满。所以部署上尽量把一组专家放进同一节点。</p>
<div class="fig"><div class="fig-t">图：一个 MoE 层单次前向的路径</div><div class="flow"><div class="box b">Token 分布各设备</div><div class="box p">Router Top-K</div><div class="box o">All-to-All：dispatch</div><div class="box c">专家计算</div><div class="box o">All-to-All：combine</div><div class="box g">按权重求和回主干</div></div><div class="fig-n">两段橙色就是两次全量网络搬运：专家在节点内时最便宜，跨节点时网卡取代算力成为瓶颈。</div></div>
<div class="fig"><div class="fig-t">图：All-to-All 的两趟搬运——算力没满，网卡先满</div><div class="bars"><div class="bar-item"><div class="bar-h good" style="height:100%"></div><span>机内 NVLink<br>单次 All-to-All</span></div><div class="bar-item"><div class="bar-h bad" style="height:22%"></div><span>跨机 IB / 以太<br>同等字节</span></div><div class="bar-item"><div class="bar-h new" style="height:60%"></div><span>专家计算<br>（可被通信盖住）</span></div><div class="bar-item"><div class="bar-h old" style="height:100%"></div><span>两趟搬运<br>dispatch + combine</span></div></div><div class="fig-n">柱高只表达相对关系（机内带宽按 100 计，跨机按常见量级约 1/5 到 1/20 之间，具体看互联代际）。关键读法是：专家越集中在同一节点，第一根柱子越常用；专家铺得越开，第二根越吃时间，而算力那根并没变长——这就是「FLOPs 没打满、网络先打满」。</div></div>
<h3>并行组合、共享专家与辅助损失的两种取向</h3>
<ul>
<li><strong>专家并行（Expert Parallelism）：</strong> 专家切开放不同卡，与张量并行 TP（切单个矩阵）、流水线并行 PP（切层）、数据并行 DP 正交组合。四种并行分显存，专家并行决定 All-to-All 流量。</li>
<li><strong>共享专家（Shared Expert）：</strong> 无论路由选谁它都常开，承担通用能力、给路由减压，误路由时输出有保底。</li>
<li><strong>辅助损失两种取向：</strong> 负载均衡损失把各专家的 Token 占比拉均匀（c2_3 讲的）；另一类是 Router 打分端的多样性/数值稳定损失，防止 logits 爆炸与路由塌缩。两者推理时都移除；但路由若在训练里学歪，推理的热冷专家就将错就错。</li>
</ul>
<h3>专家热度怎么监控</h3>
<p>把 Top-K 命中按专家计数画热度直方图：热专家长期满员（溢出率在丢 Token）、冷专家长期零命中——冷专家饿死的循环是：不被路由选中就没有梯度，学得更差、更不被选。训练期盯每专家利用率与溢出率，推理期盯耗时与显存高线，热专家可加副本或缓存优先。</p>
<h3>显存按总参数算，算力按激活参数算</h3>
<p>接 c2_3"省算力不省显存"展开：推理时全部专家的权重都必须驻留显存（或可快速取回的外存），不可能只为被激活的部分付显存。一个总参数六千亿级、每 Token 只激活几百亿级的 MoE，显存占用跟着千亿走、单 Token 算力却和几十亿参数的稠密模型同量级——差出一个数量级。后果：大 batch 才摊得平"读全部权重"的成本，小请求反被权重带宽拖着走。同预算选型：显存/带宽充足、吞吐优先，选 MoE；显存吃紧、边缘、低并发，稠密更划算。</p>
<div class="tbl"><table><tr><th>维度</th><th>Dense</th><th>MoE</th></tr><tr><td>显存常驻</td><td>全部参数=激活参数</td><td>全部专家常驻，与激活无关</td></tr><tr><td>单 Token 算力</td><td>随总参数增长</td><td>约等于激活参数（总量 × K/E）</td></tr><tr><td>吞吐特性</td><td>对小 batch 友好</td><td>大 batch 才摊得平权重读取</td></tr><tr><td>主要风险</td><td>参数越大越贵</td><td>热专家溢出、跨节点通信墙</td></tr></table></div>
<div class="note exam"><div class="note-t">💡 考点</div>容量因子决定丢 Token 还是空转显存；MoE 的瓶颈是两次 All-to-All 而非 FLOPs；共享专家是常开保底；辅助损失只在训练起作用；"显存按总参数、算力按激活参数"是选型分水岭。</div>
`},
c2_3c:{tag:"架构范式",title:"11. 非 Transformer 路线：SSM、线性注意力与混合架构",html:`
<div class="fig"><div class="fig-t">图：序列长度翻倍时，两种架构各自涨多少</div><div class="bars"><div class="bar-item"><div class="bar-h bad" style="height:100%"></div><span>全注意力<br>计算 ×4</span></div><div class="bar-item"><div class="bar-h old" style="height:50%"></div><span>全注意力<br>KV ×2</span></div><div class="bar-item"><div class="bar-h good" style="height:25%"></div><span>SSM / 线性<br>每步恒定</span></div></div><div class="fig-n">全注意力的计算随长度平方涨、KV 随长度线性涨；SSM 与线性注意力每一步只读写固定大小的状态，长度翻倍只是步数翻倍。代价写在状态容量里：固定大小的状态装不下全部历史，精确召回会被压掉。</div></div>
<h3>把注意力换成「固定大小的状态」</h3>
<p>Transformer 的代价来自注意力：每个新 token 都要和前面所有 token 算一遍，序列一长，计算与 KV 都跟着涨（c11_ledger 的账本）。SSM（状态空间模型）换掉的正是这一步——维护一个固定大小的隐状态 <code>h</code>，每读一个 token 就更新 <code>h ← A·h + B·x</code>，再从 <code>C·h</code> 输出。状态大小与序列长度无关，于是每步 O(1)、整段 O(n)、显存不随长度爆炸。Mamba 是这条线上最有名的实现：让 <code>A、B、C</code> 随输入变化（选择性），从而能按内容决定「该记的记、该忘的忘」；固定递推做不到这一点，这也是纯 SSM 在语言任务上一直打不过注意力的原因。</p>
<p class="plain-text">大白话：注意力像每读一句就回头把全文重看一遍，读得越久越慢；SSM 像一边读一边写值班笔记——本子页数固定（状态大小固定），读到哪写到哪，每次翻页成本恒定。代价也直白：本子就那几页，前面写满就得覆盖。</p>
<h3>线性注意力与 RWKV：换个结合律</h3>
<p>线性注意力走另一条路：把 <code>softmax(q·k)</code> 里的指数核换成一个可分解的核 <code>φ(q)·φ(k)</code>，乘法就能换个结合顺序——先把 <code>φ(k)ᵀ·v</code> 累加成一个固定大小的矩阵，再用 <code>φ(q)</code> 去乘。累加量固定，于是同样绕开了 n×n 的注意力矩阵。RWKV 则是把时间步上的递推（像 RNN）与 token 内的并行（像 Transformer）拼起来：训练按块并行，推理按步递推。</p>
<h3>混合架构为什么成了主流折中</h3>
<p>纯 SSM 与线性注意力的短板很具体：<strong>精确召回变弱</strong>。要「把第 3 段原样抄出来」，或「在百万 token 里定位唯一那处细节」，靠固定大小的状态是有损的——状态再大也是压缩。所以工业界的做法是混合：多数层用 SSM 或线性注意力压成本，少数层保留全注意力守住精确检索，常见比例是每四到八层插一层注意力，或首尾各留几层。这个比例是个显式旋钮：注意力层越多，长文检索越准、成本越高。</p>
<h3>它换走了什么，部署前要知道什么</h3>
<ul>
<li><strong>训练并行度：</strong> 递推天然串行，训练要靠分块扫描（chunked scan）把序列切块并行再合并，实现复杂度高于注意力，这也是它落地晚于论文的原因之一。</li>
<li><strong>长度外推：</strong> 状态「流过就忘」，外推到训练长度之外时行为比 RoPE 这一类位置编码更难预测，通常要做专门的初始化或重新长训。</li>
<li><strong>生态：</strong> 工具链、并行策略、推理引擎对非 Transformer 的支持普遍弱于注意力模型。选型时先确认引擎支持，别假设「模型能加载就能高效服务」。</li>
</ul>
<p>💡 考点 三条主线（SSM/Mamba、线性注意力、RWKV）解决的是同一件事：把「每步回头看全部历史」换成「每步只看固定大小的状态」；代价是精确召回有损，所以主流是混合架构；评估这类模型时，「大海捞针」与「原样抄写」是最容易暴露短板的两个探针。</p>
`},
c2_4:{tag:"模型范式",title:"12. 推理模型 vs 指令模型",html:`
<h3>Instruct (指令模型)</h3>
<p>快思考。适合日常对话、翻译、写文案。</p>
<h3>Reasoning (推理模型)</h3>
<p>慢思考。在内部生成隐藏的“思维链”进行推演。它靠什么训练出来的？</p>
<ul>
<li><strong>RLVR (可验证奖励强化学习)：</strong> 数学题有唯一解，代码有测试用例。模型做对了给奖励，做错了给惩罚，逼迫它学会严密推理。</li>
<li><strong>PRM (过程奖励模型)：</strong> 不只奖励最终答案，而是对推理的每一个中间步骤打分，防止模型“过程全错，答案蒙对”。</li>
</ul>
<h3>CoT 与 CoD：推理模型怎么“想”</h3>
<p><strong>CoT (Chain-of-Thought，思维链)：</strong> 让模型把推理过程一步步写出来——“先算 A，得到中间结论，再推 B，最后得出答案”。本质是把复杂问题拆成一串简单步骤，每一步只做一小次“文字接龙”，出错概率大幅下降。它既是提示技巧（“让我们一步一步思考”），也是推理模型训练出来的默认行为。</p>
<p><strong>CoD (Chain-of-Draft，草稿链)：</strong> CoT 的问题是把推理全程写出来，输出长、延迟高、费用贵。CoD 让模型只输出每一步的极简草稿（每步一句话、几个词），砍掉解释性废话，精度与 CoT 相近，但 token 消耗和延迟大幅降低。</p>
<p class="plain-text">大白话：CoT 是“把草稿纸上的每一步推导都工工整整写出来给人看”，CoD 是“只在草稿纸上写关键中间结果，不写废话”。推理模型的“思考中……”刷出来的大段内容就是 CoT；CoD 是它的省钱提速版。</p>
<h3>为什么 CoT 是当前主流？</h3>
<p><strong>结论：是的，CoT（及其内部变体）是当前推理范式的主流，CoD 只是特定场景下的优化手段。</strong>原因有三：</p>
<ul>
<li><strong>错误可回溯：</strong> CoT 把每一步显式写出，错了能定位到具体步骤（配合 PRM 逐步打分纠正）；CoD 只留结论草稿，中间依据缺失，出错难以诊断。</li>
<li><strong>可验证奖励的前提：</strong> RLVR 训练需要完整推理轨迹来分配奖励，CoT 天然提供这条轨迹；模型也是先学会“写全”再学会“压缩”。</li>
<li><strong>能力上限更高：</strong> 写出全过程等于给模型更多“思考 token”，难题上准确率明显更高；CoD 压缩步数是拿上限换速度。</li>
</ul>
<h3>正式场景举例：CoT 与 CoD 各用在哪</h3>
<p><strong>该用 CoT 的场景（要准确、要可审计）：</strong></p>
<ul>
<li><strong>金融研报审核：</strong> 核对“该子公司营收占比 43%”这类结论时，必须逐步列出“找哪张表→取哪个数→怎么算”，审计员才能复核每一步。</li>
<li><strong>医疗辅助诊断：</strong> 从症状到鉴别诊断的每步依据都要留痕，医生需要看到“为什么先排除 A 再考虑 B”，只给结论无法采信。</li>
<li><strong>法律合同审查：</strong> 逐条比对条款与法规，中间推理即工作底稿，出争议时要能追溯判断依据。</li>
</ul>
<p><strong>该用 CoD 的场景（量大、要快、结论简单）：</strong></p>
<ul>
<li><strong>客服工单批量分类：</strong> 每天几十万条工单打标签，用户只看“投诉/咨询/退款”这个结论，无需展示推理，CoD 可省 60% 以上 token 和延迟。</li>
<li><strong>代码评审初筛：</strong> CI 流水线里对每个 commit 快速圈出可疑点，每步只写“第 3 行：未判空”，秒级返回即可。</li>
<li><strong>实时风控拦截：</strong> 交易请求毫秒级必须出放行/拦截判断，只留关键判断依据，不能等模型写完千字推理。</li>
</ul>
<p class="plain-text">一句话选型：结论要被人复核、错了代价大 → CoT；量大管饱、只要结论、延迟敏感 → CoD。</p>
<div class="fig"><div class="fig-t">图：CoT 与 CoD 是同一条推理链的两种记账方式</div><div class="flow"><div class="box b">题目</div><div class="box c">CoT：每步推导都写全<br>可逐步审计</div><div class="box p">中间结论可被 PRM 逐步打分</div><div class="box o">CoD：只留关键中间量<br>token 省六成以上</div><div class="box g">答案</div></div><div class="bars"><div class="bar-item"><div class="bar-h new" style="height:100%"></div><span>CoT<br>推理 token 满额</span></div><div class="bar-item"><div class="bar-h good" style="height:40%"></div><span>CoD<br>按正文口径可省 60%+</span></div></div><div class="fig-n">选法只看两件事：这条推理要不要被人复核、错了代价多大。金融审核、医疗鉴别、法律条款比对走 CoT；工单分类、CI 初筛、实时风控走 CoD。上限方面 CoT 更高，因为它给模型换了更多「思考 token」</div></div><h3>测试时扩展：花推理算力换准确率</h3>
<p>除了让模型「想得更久」（reasoning_effort 与 CoT/CoD），还有一族不改模型的做法：对同一个问题多采样几遍，再用某个规则挑答案。三种常见形态——<strong>自一致性（self-consistency）</strong>：同一题采样 n 次、对最终答案投票取多数；<strong>best-of-n</strong>：采样 n 个候选，交给验证器或打分器挑最好的；<strong>思维树（Tree of Thoughts）</strong>：把推理拆成多步，每步展开几个分支、边搜边剪枝。共同点是<strong>把算力从训练挪到推理</strong>：准确率随 n 上升，但通常 n 过 8 之后边际收益就很低，而成本与延迟是线性的。</p>
<ul>
<li><strong>自一致性只适合答案可投票的任务</strong>：数学题求出一个数、分类题给出一个标签。开放写作没有「多数答案」可投。</li>
<li><strong>best-of-n 的命门在验证器</strong>：有程序判据（单元测试、可执行、schema 校验）时非常划算；只靠模型自评等于同一个裁判给自己打分，收益打折（c8_metrics 的可信度阶梯讲的就是这件事）。</li>
<li><strong>思维树适合搜索空间可拆解的任务</strong>，代价是分支爆炸，必须配深度与宽度上限、以及能剪枝的判据，否则预算全烧在无用分支上。</li>
</ul>
<p>工程上当预算问题处理：先量出「n 从 1 到 k 的准确率曲线」找拐点，再确认延迟 SLA 能不能接受。它和 reasoning_effort 是同一族旋钮——都在买推理时的算力，区别是一个买「单条思考更长」，一个买「多条候选更多」，两者叠加时收益会互相稀释，别同时拉满。</p>
<p class="plain-text">大白话：reasoning_effort 是让同一个人多想一会儿；自一致性是叫十个人各自作答再投票；best-of-n 是交十份卷子让老师挑最好的；思维树是每一步都想几个可能、走不通就退回来。人数与步数都能换分，但卷子越多批改越贵，考场时间也不允许无限加。</p>
`},
c3_1:{tag:"外挂系统",title:"13. RAG：检索增强",html:`
<p>RAG 给模型提供“开卷考试”能力。但做好很难。</p>
<h3>切块 (Chunking) 的艺术</h3>
<p>文档不能乱切。切太大，检索不准；切太小，丢失上下文。必须按照段落、标题进行<strong>语义切块</strong>。</p>
<h3>重排 (Rerank)</h3>
<p>向量检索捞出的片段往往是粗糙的。需要用一个专门的小模型（Rerank模型），把问题和候选片段放在一起做精细打分，把最相关的 3 条提取出来给大模型，大幅降低幻觉。</p>
<p class="plain-text">大白话：向量检索像图书管理员按印象先抱来一摞"大概有关"的书，数量多但不保证都对口；Rerank 是再派一位细心的助理，把这摞书一本本翻开和你的问题逐条比对，只挑出真正最相关的两三本放在你桌上。资料给得准，模型才不容易瞎编。</p>
<h3>混合检索 (Hybrid Search)</h3>
<p>纯向量检索不懂精确编号。必须结合 BM25（关键词搜索），并用 RRF 算法融合排序。</p>
<p class="plain-text">大白话：向量检索像"凭感觉找意思相近的段落"，但遇到产品型号、编号这种一字不能差的，它会看走眼；BM25 就是老式的"按关键词精确查找"。两者各查一遍，再用 RRF（把两份榜单的名次揉在一起重新排名）合并结果，既找得准又找得稳。</p>
<div class="fig"><div class="fig-t">图：RAG 是一条漏斗，不是「搜一下就交给模型」</div><div class="flow"><div class="box b">文档库</div><div class="box c">语义切块<br>按段落与标题</div><div class="box p">向量召回 Top50<br>+ BM25 关键词</div><div class="box o">RRF 融合名次</div><div class="box r">Rerank 精排 Top3</div><div class="box g">交给大模型生成</div></div><div class="layers"><div class="layer l1">召回阶段：宁多勿漏，错漏不可恢复，多带来的噪声后面还能筛</div><div class="layer l2">精排阶段：把「大概有关」压成「确实回答得上」，幻觉率主要在这里降下来</div><div class="layer l3">生成阶段：只喂 3 条比喂 50 条更准，也更快更便宜——上下文不是越满越好</div></div><div class="fig-n">只做第一层就交付，等于把一摞没读过的资料丢给模型：它照样会编，只是编得更像有出处</div></div>`},
c3_1b:{tag:"外挂系统",title:"14. RAG 进阶：图谱、代理式检索与检索评测",html:`
<h3>嵌入模型选型：换型等于重建索引</h3>
<p>嵌入模型看四件事：维度（表达力与索引体积、检索带宽一起涨）、最大输入长度（长文档被截断再编码会丢语义）、多语言与代码检索能力、每千 Token 成本。最贵的坑是把它当可替换件：不同模型向量空间互不兼容，换嵌入型 = 全库重编码、重建索引，新旧向量不能混检。应在 PoC 期一次定死，型号写进元数据。</p>
<h3>GraphRAG：解决哪类问题，付出什么成本</h3>
<p>向量检索答得了"哪里像"，答不了跨文档多跳与全局归纳。GraphRAG 用 LLM 从语料抽取实体、关系、事件建图，预生成社区摘要：多跳沿图遍历，全局归并摘要。代价是构建 token 开销高一个数量级、增量更新贵——适合相对静态的中小库深问答，不适合高频更新库。</p>
<p class="plain-text">大白话：向量检索像"看过这本书的人还看了……"，GraphRAG 像刑警的关系网：顺着线头拽出一串没见过面的人。这面墙画起来极贵，所以只在啃大案（多跳、全局归纳）时才值得。</p>
<h3>Agentic RAG 与固定一次检索</h3>
<p>固定检索是"查一次、答一次"的流水线；Agentic RAG 让模型自己决定：要不要检索、检索几轮、是否改写查询、换哪个检索器（向量、关键词、图、数据库），片段够不够、缺什么再补查。单跳事实题一次检索又快又省，套 Agent 循环只多付延迟与费用；多跳、对比、归纳问题，"检索→发现缺口→改写→再检索"的循环上限更高，但错误会累积、延迟成倍。</p>
<div class="fig"><div class="fig-t">图：固定一次检索 vs Agentic RAG——差在「够不够」这个判断</div><div class="grid2"><div class="card"><h4>固定一次检索</h4><p>问题 → 检索 → 拼上下文 → 回答。链路短、成本可预测；但第一次查询抓偏了就没有补救，模型只能拿着不对的资料硬答。</p></div><div class="card"><h4>Agentic RAG</h4><p>问题 → 改写/分解 → 检索 → <strong>判断够不够</strong> → 不够就再改写再检索（可多轮）→ 够了再回答。多轮带来的收益是召回率，代价是延迟与 token 双涨，且轮数必须有上限。</p></div><div class="card"><h4>什么时候值得多轮</h4><p>问题需要多跳（先查 A 才知道该查 B）、或单次查询天然说不清（口语化、指代多）。事实型单跳问题不值得。</p></div><div class="card"><h4>必须配的止损</h4><p>最大轮数、每轮 query 去重、检索为空时的兜底回答；否则它会在一轮轮改写里烧钱，而每轮的结果彼此矛盾。</p></div></div><div class="fig-n">判断「够不够」这一格是两者的分水岭：有它才是 Agent，没有它就只是把检索结果塞进上下文的工作流（c3_3 的判定标准）。</div></div>
<h3>查询改写与分解</h3>
<ul>
<li><strong>HyDE：</strong> 让 LLM 先写一篇"假设答案文档"，拿它去做向量检索——问题与文档在向量空间里不像，假文档与真文档才像。先造形状再定位。</li>
<li><strong>子问题分解：</strong> 把复合问题（对比、因果链）拆成若干单跳子问题，分别检索、汇总作答。</li>
</ul>
<h3>元数据过滤与权限过滤</h3>
<p>同一知识库不同用户可见范围不同，权限不靠提示词约束模型：入库时每个片段带所有者、部门、密级元数据，查询时按身份把过滤条件下推到检索之前（pre-filter，在许可子集里召回），而不是召回 Top-K 后再删——后置过滤会让 Top-K 全被不可见文档占坑。Rerank、图遍历同样只走许可子集。</p>
<h3>检索评测：两套指标，两层责任</h3>
<p>先量检索、再量答案，不能只报端到端正确率——它分不清"网没撒对"还是"鱼跑了"。检索端用标注集算 Recall@k、MRR、nDCG；生成端算忠实度（Faithfulness）：答案每一句能否在片段里找到依据。</p>
<div class="tbl"><table><tr><th>指标</th><th>量什么</th><th>不达标先查哪</th></tr><tr><td>Recall@k</td><td>前 k 条捞回多少标注相关片段</td><td>网眼太大：切块、嵌入模型、混合检索</td></tr><tr><td>MRR</td><td>第一条相关片段排名的倒数均值</td><td>捞到了但太靠后：加 Rerank</td></tr><tr><td>nDCG</td><td>相关性分档 + 位置折减的排名质量</td><td>排序错位：Rerank 模型、融合权重</td></tr><tr><td>忠实度</td><td>答案句子在片段中的可支持比例</td><td>检索指标都好却低：是生成的锅（幻觉、没看材料）</td></tr></table></div>
<div class="fig"><div class="fig-t">图：进阶 RAG 的检索链路</div><div class="flow"><div class="box b">用户问题（改写/分解）</div><div class="box r">元数据+权限预过滤</div><div class="box c">向量与 BM25 双路召回</div><div class="box p">RRF 融合</div><div class="box o">Rerank Top3</div><div class="box g">生成 + 引用校验</div></div><div class="fig-n">过滤必须在召回之前；最后一段的引用校验产出忠实度指标，而不是等人工抽检。</div></div>
<h3>"检索没问题但答案错"的定位顺序</h3>
<ol>
<li>先怀疑"检索没问题"本身：拿标注集跑 Recall@k/MRR，个例目测不算数。</li>
<li>命中不等于被用上：查拼装——片段被预算截断了吗？全堆在中段吗（注意力稀释，见 c2_2c）？片段间矛盾或信息不全吗？</li>
<li>再调生成：强制引用、先摘要后作答、降温度、换更强模型做对照组。</li>
<li>最后怀疑评测本身：问题有歧义、标注片面（单来源）。</li>
</ol>
<div class="note exam"><div class="note-t">💡 考点</div>换嵌入模型必须重建索引；GraphRAG 用一个数量级的构建成本换多跳与全局能力；权限过滤在检索层前移；Recall@k/MRR/nDCG 评检索，忠实度评生成；排障顺序：先证检索好，再查拼装、生成、评测。</div>
<h3>索引类型不是玄学：HNSW 与 IVF 各拿什么换什么</h3>
<p>两者都是<strong>近似</strong>最近邻，都允许你拿召回率换速度。<strong>HNSW</strong> 把向量组织成多层「捷径图」，查询时从高层导航到低层，命中快、召回高，代价是索引体积大、构建慢、内存驻留高。<strong>IVF</strong> 先聚类分桶，查询只在最相近的几个桶里翻（nprobe 决定翻几个桶），配 PQ 量化还能把向量本体压小，省内存但召回对 nprobe 敏感。工程口径：内存吃紧、数据量巨大、可容忍稍低召回，偏 IVF+PQ；低延迟高召回、内存充裕，偏 HNSW。参数（HNSW 的 ef、IVF 的 nprobe）必须在业务集上测，别拿别人的结论套。</p>
<p class="plain-text">大白话：HNSW 像靠人脉找东西——先认识几个「什么都认识一点」的人，再顺着介绍往下走，几步就到；IVF 像图书馆分区——先判断这事大概在哪几个书架区，只翻那几个区的架。前者快但要养一张关系网（内存），后者省地儿但翻几个区全凭你手松手紧（nprobe）。</p>
`},
c3_2:{tag:"外挂系统",title:"15. Agent 与 MCP 协议",html:`
<h3>Agent 的三大规划模式</h3>
<ul>
<li><strong>ReAct：</strong> 边想边做。思考 -> 行动 -> 观察结果 -> 再思考。适合探索型任务。</li>
<li><strong>Plan-and-Execute：</strong> 先列出 1,2,3 步骤计划，再一步步执行。适合稳定流程。</li>
<li><strong>Reflexion：</strong> 执行完后，开启一个“反思者”角色，检查自己的输出有没有错，打回重做。</li>
</ul>
<div style="display:flex;gap:12px;margin:16px 0;flex-wrap:wrap;">
<div style="flex:1;min-width:180px;background:#eef4fb;border:1px solid #cfe0f3;border-radius:8px;padding:12px;">
<div style="font-weight:bold;color:#2b5c8a;margin-bottom:8px;">ReAct</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
<div style="background:#fff;border:1px solid #cfe0f3;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">思考</div>
<div style="color:#7a9cc0;font-size:12px;">↓</div>
<div style="background:#fff;border:1px solid #cfe0f3;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">行动</div>
<div style="color:#7a9cc0;font-size:12px;">↓</div>
<div style="background:#fff;border:1px solid #cfe0f3;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">观察</div>
<div style="color:#7a9cc0;font-size:12px;">↺ 回到思考</div>
</div>
</div>
<div style="flex:1;min-width:180px;background:#f2f4f7;border:1px solid #d8dde5;border-radius:8px;padding:12px;">
<div style="font-weight:bold;color:#4a5568;margin-bottom:8px;">Plan-and-Execute</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
<div style="background:#fff;border:1px solid #d8dde5;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">列出计划 1,2,3</div>
<div style="color:#9aa5b4;font-size:12px;">↓</div>
<div style="background:#fff;border:1px solid #d8dde5;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">执行步骤 1</div>
<div style="color:#9aa5b4;font-size:12px;">↓</div>
<div style="background:#fff;border:1px solid #d8dde5;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">执行步骤 2</div>
<div style="color:#9aa5b4;font-size:12px;">↓</div>
<div style="background:#fff;border:1px solid #d8dde5;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">执行步骤 3</div>
</div>
</div>
<div style="flex:1;min-width:180px;background:#eef4fb;border:1px solid #cfe0f3;border-radius:8px;padding:12px;">
<div style="font-weight:bold;color:#2b5c8a;margin-bottom:8px;">Reflexion</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
<div style="background:#fff;border:1px solid #cfe0f3;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">执行</div>
<div style="color:#7a9cc0;font-size:12px;">↓</div>
<div style="background:#fff;border:1px solid #cfe0f3;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">反思检查</div>
<div style="color:#7a9cc0;font-size:12px;">↓ 有错</div>
<div style="background:#fff;border:1px solid #cfe0f3;border-radius:6px;padding:4px 10px;width:100%;text-align:center;box-sizing:border-box;">打回重做</div>
<div style="color:#7a9cc0;font-size:12px;">↺ 回到执行</div>
</div>
</div>
</div>
<p class="plain-text">ReAct 像无头苍蝇边撞边找路；Plan 像先写好剧本再按部就班拍戏；Reflexion 像做完卷子自己先检查一遍再交。</p>
<h3>MCP</h3>
<p>统一了标准接口（Client-Host-Server），让工具像 USB-C 一样即插即用。</p>
<div class="fig"><div class="fig-t">图：Agent 的三种规划模式，差别在「谁决定下一步」</div><div class="flow"><div class="box b">Thought 想一步</div><div class="box c">Action 调一个工具</div><div class="box p">Observation 看结果</div><div class="box o">回到 Thought 再想</div><div class="box r">触发终止条件或步数上限</div></div><div class="grid2"><div class="card"><h4>ReAct（上图）</h4><p>边想边做，适合探索型任务；代价是路径不可预知，必须配最大迭代数与预算熔断。</p></div><div class="card"><h4>Plan-and-Execute</h4><p>先出 1/2/3 步计划再逐条执行，流程可枚举、可复现，适合稳定链路。</p></div><div class="card"><h4>Reflexion</h4><p>做完再开一个反思者角色自查并打回重做，用来兜「看着完成了其实错了」。</p></div><div class="card"><h4>MCP 在哪一层</h4><p>MCP 不管怎么想，只管工具怎么接：统一 Client-Host-Server 接口，让能力像 USB-C 一样即插即用。</p></div></div><div class="fig-n">判断是不是 Agent 只看一条：没有用户新指令时，它会不会自己推进下一步。会，就是 Agent；不会，哪怕连调五个工具也只是工作流</div></div>`},
c3_2b:{tag:"外挂系统",title:"16. 多智能体：拓扑、交接与冲突消解",html:`
<h3>先问一句：真的需要多个 Agent 吗</h3>
<p>把一件事拆给几个 Agent，只有在<strong>子任务彼此只需要窄接口</strong>时才成立：能并行、能各自独立验证、失败能局部重试。否则它只是把同一份上下文轮转几遍，用单 Agent 加角色提示反而更便宜、更好调。最典型的反例是「写代码 + 写测试 + 评审」三个 Agent 共用同一份文件：冲突成本远大于并行收益。别忘了复杂度墙（c4_1）：每多一个环节就多一次连乘，十个各 99% 的环节串起来只剩九成。</p>
<p class="plain-text">大白话：能外包的活才外包。装修队里水电、木工、油漆能先后进场，是因为活能切开、验收标准清楚；如果三个人同时刷同一面墙，省下的时间还不够吵架。判断标准不是「人多力量大」，是「活能不能切开、切口清不清楚」。</p>
<h3>三种拓扑：扇出、链、环</h3>
<div class="fig"><div class="fig-t">图：三种编排拓扑——先看任务图是扇出、链还是环</div><div class="grid2"><div class="card"><h4>中心调度（扇出）</h4><p>一个主 Agent 拆任务、派活、收结果，自己守住全局上下文。最常用；瓶颈也在主 Agent——它的上下文装不下所有细节，就会变成传话游戏。</p></div><div class="card"><h4>流水线（链）</h4><p>A 的输出是 B 的输入：采集 → 分析 → 写作 → 校验。阶段清晰、好排查；没有并行，延迟叠加，且上一环的错误会一路传下去。</p></div><div class="card"><h4>对等协作（环）</h4><p>几个 Agent 共享一块黑板或互相发消息，适合互查与辩论。灵活但最难调：话轮无限、观点打架、谁也没负责收尾。</p></div><div class="card"><h4>怎么选</h4><p>看任务图：能并行拆开 → 扇出；有天然阶段 → 链；需要互相质疑同一份产出 → 环。多数生产系统是「扇出 + 局部链」，很少真用全对等。</p></div></div><div class="fig-n">拓扑不是风格问题，是失败模式的来源：扇出死在主 Agent 的上下文，链死在错误传播，环死在收不敛。</div></div>
<h3>交接：上下文怎么传，才不变成传话游戏</h3>
<ul>
<li><strong>三种传法：</strong> 全文转发（最贵、信息最全）、摘要转发（便宜、有损）、共享存储（黑板/文件系统/数据库，Agent 只取自己需要的片段）。生产上多数是「摘要 + 共享存储」的组合。</li>
<li><strong>不要全量广播：</strong> 每轮把整份历史转发给每个 Agent，输入 token 会按「Agent 数 × 轮数」一起涨——这和单 Agent 每轮重发历史是同一笔账（c9_longctx），只是乘数更大。</li>
<li><strong>交接要结构化：</strong> 任务是什么、输入在哪、验收判据、禁止事项、回报格式。缺哪一项，接手的 Agent 就会用自己的猜测补——<strong>多 Agent 最常见的失败原因不是模型不行，是交接没写清</strong>。</li>
</ul>
<h3>冲突消解与收敛</h3>
<ul>
<li><strong>三种消解机制：</strong> 投票（同题多解取多数，适合有唯一答案）、仲裁者（一个专责 Agent 或一条规则/测试用例判分歧）、证据优先（谁能给出可验证依据就听谁的）。</li>
<li><strong>必须有终止条件：</strong> 最大轮数、预算熔断、以及「没有新信息就停」——检测两个 Agent 开始互相复读同一个方案，立刻强制仲裁。</li>
<li><strong>死循环的典型形态：</strong> A 提方案 → B 要求改 → A 改回原方案。对策是给每轮产出打版本号，出现重复版本即触发仲裁，而不是继续对话。</li>
</ul>
<h3>可观测性与责任：按 Agent 分桶</h3>
<p>每个 Agent 的输入输出、工具调用、耗时与 token 都要留痕，并且<strong>按 Agent 分桶</strong>看——总耗时上涨时，要能回答「是哪个 Agent 慢了、哪次交接重跑了」。责任沿用 c13_roles 的三层：谁派的活（提交人）、谁批准合并（评审人）、为什么门禁没拦住（门禁设计者）。多 Agent 不产生新的一层责任，它只是让「谁派的活」变得更容易被遗忘。</p>
<p>💡 考点 多 Agent 的前提是任务能切成窄接口的子任务；三种拓扑对应扇出、链、环，也就对应三种失败模式（主 Agent 上下文、错误传播、收不敛）；上下文按「摘要 + 共享存储」传，交接必须结构化；冲突靠投票/仲裁/证据消解，并配最大轮数、预算熔断与「无新信息即停」。</p>
`},
c3_3:{tag:"外挂系统",title:"17. AI 工作流设计模式",html:`
<h3>先分清：Workflow 还是 Agent？</h3>
<ul>
<li><strong>Workflow（工作流）：</strong> 流程控制权在代码里，LLM 与工具按预定义路径编排。步骤可枚举、要求稳定可复现的标准化任务选它，出问题能在日志里定位到具体哪一步。</li>
<li><strong>Agent（智能体）：</strong> 流程控制权在模型手里，由 LLM 动态决定下一步与工具。适合开放式任务，代价是延迟与成本，必须配护栏：最大迭代次数、人工检查点、沙箱隔离。</li>
</ul>
<p class="plain-text">判断标准一句话：在没有用户新指令的前提下，AI 会不会主动推进下一步。会，是 Agent；不会，哪怕连续调了五个工具，也只是 Workflow 或增强型 LLM。</p>
<h3>五大经典 Workflow 模式（Anthropic《Building Effective Agents》）</h3>
<ul>
<li><strong>Prompt Chaining 提示链：</strong> 任务拆成固定序列，前一步输出即后一步输入，中间可加程序化检查门（Gate）把关，用延迟换准确。</li>
<li><strong>Routing 路由：</strong> 先分类再分发。客服按意图分流；简单问题给小模型、难题给强模型，兼顾成本与质量。</li>
<li><strong>Parallelization 并行化：</strong> 分段（独立子任务并行）与投票（同任务多次采样取多数）两种变体，安全护栏与代码漏洞审查常用多视角投票。</li>
<li><strong>Orchestrator-Workers 编排-工作者：</strong> 中心 LLM 动态分解任务、派发工作者、再汇总。与提示链的区别在于子任务不是预定义的。</li>
<li><strong>Evaluator-Optimizer 评估-优化：</strong> 生成器产出、评估器按标准打分给反馈，循环迭代直到达标。</li>
</ul>
<h3>选型原则与平台落地</h3>
<p>三层渐进：先优化单次 LLM 调用（配检索与示例），不够再上 Workflow，最后才是自主 Agent；如无必要不增加复杂性。平台落地：n8n 节点驱动、集成最广、可自托管，适合跨系统流程自动化；Dify 主打 AI 应用编排与知识库（LLMOps），适合企业级 AI 应用；Coze 轻量低代码、多智能体协作，适合快速搭建智能体。</p>
<div class="fig"><div class="fig-t">图：三层渐进选型——先别上 Agent</div><div class="layers"><div class="layer l1">第一层 单次调用就够：把检索和示例配好，流程写死在代码里</div><div class="layer l2">第二层 Workflow：步骤可枚举，控制权在代码。按需选五种模式</div><div class="layer l3">第三层 Agent：开放式任务，控制权交给模型，但必须配护栏</div></div><div class="grid2"><div class="card"><h4>Prompt Chaining / Routing</h4><p>前者固定序列逐步交付，中间可加程序化检查门；后者先分类再分发，简单题走小模型、难题走强模型，兼顾成本与质量。</p></div><div class="card"><h4>Parallelization</h4><p>分段（独立子任务并行）与投票（同一题多次采样取多数）。安全护栏与漏洞审查常用多视角投票。</p></div><div class="card"><h4>Orchestrator-Workers</h4><p>中心模型动态拆解任务、派工、汇总。与提示链的分水岭是：子任务不是预先定义的。</p></div><div class="card"><h4>Evaluator-Optimizer</h4><p>生成器出稿、评估器按标准打分并给反馈，循环到达标。不收敛的典型症状是分数震荡或越改越啰嗦。</p></div></div><div class="fig-n">判断只有一条：没有用户新指令时它会不会自己推进下一步。会，是 Agent；不会，哪怕连调五个工具也只是 Workflow。如无必要，不要从第三层开始</div></div>`},
c4_1:{tag:"能力边界",title:"18. 算不准数、幻觉与复杂度墙",html:`
<h3>计算分裂脑</h3>
<p>LLM 懂数学原理但算不对数。因为它是概率接龙，不是符号运算。必须外挂代码解释器。</p>
<h3>幻觉 (Hallucination)</h3>
<p>模型不知道时，一本正经地胡说八道。</p>
<h3>复杂度墙</h3>
<p>100 步的任务，每步 99% 正确率，整体成功率只有 37%。长任务必须有人工兜底。</p>
<p class="plain-text">大白话：模型算不对数，因为它是在"猜下一个字"，不是在按计算器——让它算账，就像让一个语文很好的学生心算，原理懂但容易错，正确做法是递给他一个计算器（代码解释器）。它瞎编（幻觉）是因为不知道时也不肯说"不知道"，就像考试硬要蒙一个答案。至于复杂度墙：一步对 99% 听着很稳，但连续走 100 步，全对的可能只剩三成多——好比接力赛每人只掉链子 1%，跑完 100 棒大概率还是掉棒，所以长流程必须设人工检查点兜底。</p>
<div class="fig"><div class="fig-t">图：复杂度墙——单步再稳，步数一多也照样塌</div><div class="bars"><div class="bar-item"><div class="bar-h good" style="height:90%"></div><span>10 步<br>0.99¹⁰ ≈ 90%</span></div><div class="bar-item"><div class="bar-h new" style="height:74%"></div><span>30 步<br>0.99³⁰ ≈ 74%</span></div><div class="bar-item"><div class="bar-h old" style="height:37%"></div><span>100 步<br>0.99¹⁰⁰ ≈ 37%</span></div><div class="bar-item"><div class="bar-h bad" style="height:13%"></div><span>200 步<br>0.99²⁰⁰ ≈ 13%</span></div></div><div class="fig-n">纵轴是「整条任务全对的概率」，单步 99% 听着很高，纯粹是连乘把它磨没了。工程上只有两条出路：把步数砍下来（合并动作、少试探），或在关键步之后加验收点，让失败被局部发现而不是在第 100 步才暴露</div></div>`},
c4_2:{tag:"能力边界",title:"19. 品味的真相",html:`
<p>AI 审美是预训练 + 人类对齐的统计学产物，是大众审美的最大公约数。为了安全讨好人类，棱角被磨平，产生了“AI 油腻味”。</p>
<h3>“油腻味”从哪来：三个来源</h3>
<ul>
<li><strong>RLHF 的平均化效应：</strong> 标注员多数偏好工整、面面俱到、语气饱满的回答，模型学会“什么都有一点”，反而失去锋利的个人风格（2025 年哈工大 NLP 报告将此归入对齐与评测安全问题）。</li>
<li><strong>安全对齐的磨平：</strong> 拒答模板、免责声明、对称式表态（“一方面…另一方面…”）是训练中被强化的安全模式，输出在风格上趋同。</li>
<li><strong>数据的同质化：</strong> 预训练语料中网络流行文风占比高，模型天然向高均值文风回归。</li>
</ul>
<h3>如何品味：判断力是可以训练的</h3>
<ul>
<li><strong>建立反例库：</strong> 主动收集“一眼 AI”的特征——排比开头、总结式收尾、滥用“不仅…更是…”——以后识别成本从通读降到扫读。</li>
<li><strong>用约束逼出风格：</strong> 要求模型模仿具体作者、限定禁用词表、指定篇幅与信息密度；约束越具体，平均化越难生效。</li>
<li><strong>多模型交叉品味：</strong> 同一问题让不同模型作答，差异处往往就是各自对齐策略的痕迹，是理解“品味从何而来”的最直接实验。</li>
</ul>
<p class="plain-text">一句话：AI 的品味是它见过的平均值，你的品味是你主动选择偏离多少。会用 AI 的人不是让它替你审美，而是把它当成素材库，判断权留在自己手里。</p>
<div class="fig"><div class="fig-t">图：「油腻味」是三个来源叠出来的，不是模型心情不好</div><div class="layers"><div class="layer l1">对齐的平均化：标注员多数偏好工整、面面俱到、语气饱满的回答，模型学会「什么都有一点」</div><div class="layer l2">安全对齐的磨平：拒答模板、免责声明、对称式表态（一方面…另一方面…）是被强化的模式</div><div class="layer l3">数据同质化：网络流行文风在语料里占比高，输出天然向高均值文风回归</div></div><div class="grid2"><div class="card"><h4>识别：建反例库</h4><p>把「排比开头、总结式收尾、不仅…更是…」列成清单，识别成本从通读降到扫读。</p></div><div class="card"><h4>产出：用约束逼风格</h4><p>指定作者、禁用词表、限定篇幅与信息密度。约束越具体，平均化越难生效。</p></div></div><div class="fig-n">还有一条最省事的验证：同一个问题让几个模型各答一遍，差异处往往就是各家对齐策略留下的指纹。品味不是玄学，是可训练的判别力</div></div>`},
c5_1:{tag:"工程部署",title:"20. KV Cache 与 PagedAttention",html:`
<p>生成每个 Token 时复用历史 K/V 向量（KV Cache）。</p>
<h3>PagedAttention 革命</h3>
<p>传统 KV Cache 在显存中是连续存储的，容易产生大量的内存碎片。vLLM 框架引入了操作系统中的<strong>虚拟内存分页技术（PagedAttention）</strong>，把 KV Cache 切成固定大小的块，按需分配。这使得吞吐量提升了数十倍。</p>
<p class="plain-text">大白话：模型说话时要"记住"前文，记住的内容（KV Cache）得放在显存里。以前是整块连续占用，就像餐厅只接整桌客人，留下很多坐不满的空位（内存碎片）；PagedAttention 学操作系统管内存的办法，把座位拆成小卡座按需分配，同样大的餐厅能接待多得多的客人，所以吞吐量暴涨。</p>

c5_maas:{tag:"商业变现",title:"21. MaaS 模式",html:`
<h3>四种模式的分界</h3>
<p>IaaS 卖裸算力（服务器、GPU 卡），PaaS 卖开发平台，SaaS 卖成型的软件订阅，<strong>MaaS 租 AI 大脑按 Token 计费</strong>。MaaS 的定价逻辑与传统软件不同：成本随用量线性增长，没有传统 SaaS 的高毛利边际成本优势。</p>
<h3>计费方式</h3>
<p>主流为按 Token 计费，输入与输出价格不同（输出约为输入的 3~5 倍）。此外还有按订阅包月（如各家 Chat 产品）、按席位、按效果分成的模式。缓存命中的 Token 通常以折扣价计费，这也是重复前缀场景降本的核心抓手。</p>
<h3>降本与毛利</h3>
<p>MaaS 公司的毛利取决于推理成本：模型压缩（量化、蒸馏、投机解码）、上下文缓存、连续 batching 都是压低单次调用成本的手段。企业侧则通过提示词精简、分级模型路由与请求缓存控制账单。</p>
<h3>选型考量</h3>
<p>自建（开权重私有化部署）还是买 API，取决于数据敏感度、调用量与运维能力：数据不可出域或调用规模大到边际成本倒挂时倾向自建；小规模、快速验证场景直接用 API 更划算。</p>
<div class="fig"><div class="fig-t">图：四层云服务各卖什么，MaaS 的账为什么不一样</div><div class="layers"><div class="layer l1">IaaS 卖裸算力：服务器、GPU 卡，你自己装环境</div><div class="layer l2">PaaS 卖开发平台：托管部署与中间件，你自己写代码</div><div class="layer l3">SaaS 卖成型软件：订阅制，多一个用户的边际成本趋近于零</div><div class="layer l4">MaaS 租 AI 大脑：按 Token 计费，每一次调用都要真的烧算力</div></div><div class="bars"><div class="bar-item"><div class="bar-h good" style="height:12%"></div><span>SaaS<br>第 1000 个用户<br>几乎不增加成本</span></div><div class="bar-item"><div class="bar-h bad" style="height:100%"></div><span>MaaS<br>第 1000 次调用<br>≈ 1000 份推理成本</span></div></div><div class="fig-n">柱高是成本随用量的增长斜率（示意）：传统软件是「先贵后免费」，MaaS 是「一路线性」。所以它的毛利取决于推理降本手段——量化、蒸馏、投机解码、上下文缓存、连续 batching；企业侧则靠提示精简、分级路由与请求缓存控制账单</div></div>
<p class="plain-text">大白话：买 MaaS 像打车按里程付费，不像传统软件那样「买断之后多一人用几乎不花钱」。每一单都要烧司机的油和你的里程费，所以用量翻倍、账单就翻倍，没有 SaaS 那种边际成本趋零的甜头。输出比输入贵 3~5 倍，是因为模型「说话」是一个字一个字生成的，而「读题」可以一口气并行看完；缓存打折则像常去的店记住你的口味——你还是要点单，但他不用重新问你一遍。至于自建还是买 API：数据不能出域、量大到油价倒挂，就自己买车雇司机；只是偶尔跑一趟，打车划算得多。</p>
`},
c5_2:{tag:"安全与商业",title:"22. 安全红线与商业 ROI",html:`
<h3>三大红线</h3>
<p>未公开源码、核心财务、个人隐私绝对不能发给公网大模型。判断标准不是"内容看起来不敏感"，而是泄露后能否被聚合还原：单条看似无害的片段，与公开信息交叉比对后可能拼出完整机密。涉密与强合规场景应选择私有化部署或本地模型，并在网关层做脱敏与敏感词拦截，而不是靠员工自觉。</p>
<h3>企业落地的安全分层</h3>
<ul>
<li><strong>输入侧：</strong> 提示词注入防护、敏感信息脱敏、用户输入与系统指令隔离。</li>
<li><strong>输出侧：</strong> 内容安全过滤、结构化校验、工具调用白名单。</li>
<li><strong>权限侧：</strong> Agent 能触达的系统按最小权限授权，高危操作需人工确认。</li>
<li><strong>审计侧：</strong> 全量日志留存与回放，出问题能定位到具体请求与责任环节。</li>
</ul>
<h3>商业 ROI 怎么算</h3>
<p>不要算调用次数，要算人效提升、周期缩短。正确姿势是选定高频、可量化的人工流程做基线：对比引入大模型前后的处理时长、人力投入与错误率，把节省折算成钱。典型高 ROI 场景是文档摘要、客服初筛、代码辅助这类"人做很慢、AI 做很快但需人复核"的任务；收益递减最快的场景是低频、强专业判断、错误代价极高的决策，这类场景 AI 只能当参考而非替代。</p>
<h3>常见的算账误区</h3>
<p>只算 API 账单不算人工复核成本；只看试点指标不看上线后的真实分布；把一次性提效当成可持续收益。ROI 结论必须来自小流量灰度后的长期数据，而不是演示环境。</p>
<div class="fig"><div class="fig-t">图：企业落地的四层防护——顺序不能反，红线不能靠自觉</div><div class="layers"><div class="layer l1">输入侧：提示注入防护、敏感信息脱敏、用户输入与系统指令隔离</div><div class="layer l2">输出侧：内容安全过滤、结构化校验、工具调用白名单</div><div class="layer l3">权限侧：Agent 能触达的系统按最小权限授权，高危操作人工确认</div><div class="layer l4">审计侧：全量日志留存与回放，能定位到具体请求与责任环节</div></div><div class="grid2"><div class="card"><h4>红线的判据</h4><p>未公开源码、核心财务、个人隐私绝不发公网模型。判断标准不是「看起来敏不敏感」，而是泄露后能否被聚合还原。</p></div><div class="card"><h4>ROI 的算法</h4><p>别算调用次数。选高频可量化的人工流程做基线，对比处理时长、人力投入与错误率，把节省折算成钱；收益递减最快的是低频、强专业判断、错误代价极高的决策。</p></div></div><div class="fig-n">三个最常犯的算账误区：只算 API 账单不算人工复核成本；只看试点指标不看上线后的真实分布；把一次性提效当成可持续收益。结论必须来自小流量灰度后的长期数据</div></div>
<p class="plain-text">大白话：红线不是「这条信息看起来敏不敏感」，而是「它落进别人手里能不能被拼回去」。一条「今天加班到九点」人畜无害，配上你发在项目群的位置、同事晒的工牌和公开招聘帖，就能拼出「谁在做什么、什么时候在」。所以判断标准是聚合还原能力，不是单条观感。ROI 同理：只算 API 账单，等于只算油钱、不算司机工资和修车钱——真实成本里最大的一块往往是人在后面复核的那几分钟。而灰度上线后再看数字，是因为演示环境和真实流量像健身房跑步机和楼下马路：跑步机上跑得再稳，也没测试过雨天井盖。</p>
`},
c6_harness:{tag:"Harness",title:"23. Harness 五大模块",html:`
<h3>定位</h3>
<p><strong>Harness 是模型之外的运行时执行框架。</strong> 模型负责“想”，Harness 负责“跑”：它把模型的输出变成真实世界里可执行、可回滚、可审计的动作。</p>
<h3>五大模块</h3>
<ul>
<li><strong>执行循环（Agent Loop）：</strong> 推理 → 调工具 → 观察结果 → 再推理，直到任务完成或触发终止条件。</li>
<li><strong>工具集（Tools）：</strong> 文件读写、Shell 执行、浏览器、检索等能力的统一注册与调用协议。</li>
<li><strong>记忆管理（Memory）：</strong> 会话上下文、长期记忆与上下文窗口的裁剪和持久化策略。</li>
<li><strong>权限控制（Permissions）：</strong> 危险操作（删文件、外发数据、执行命令）需白名单或人工确认，遵循最小权限原则。</li>
<li><strong>可观测性（Observability）：</strong> 全程操作日志、Trace 与回放，出错可定位到具体一步。</li>
</ul>
<h3>为什么重要</h3>
<p>同一模型接不同 Harness，通过率和成本差距可达数倍——模型能力是上限，Harness 决定能稳定兑现多少。企业落地时，完善 Harness 往往比更换模型更值得投入。</p>
<div class="fig"><div class="fig-t">图：Harness 五模块是一个闭环，不是五个独立组件</div><div class="flow"><div class="box b">执行循环<br>想 → 做 → 看 → 再想</div><div class="box c">工具集<br>统一注册与调用协议</div><div class="box p">记忆管理<br>上下文裁剪与持久化</div><div class="box o">权限控制<br>白名单 / 人工确认</div><div class="box r">可观测性<br>日志 / Trace / 回放</div><div class="box g">结果回流下一轮</div></div><div class="fig-n">模型负责「想」，这五块负责「跑」。任何一块缺位，兑现出来的能力都不一样：没有权限控制是不敢用，没有可观测性是出了事查不到，没有记忆管理是长任务必然失忆。所以同一模型接不同 Harness，通过率与成本能差出数倍——评测时要把两者当一个整体测</div></div>
<p class="plain-text">大白话：模型是发动机，Harness 是变速箱、刹车和行车记录仪。发动机数据再漂亮，车不能倒挡、刹车没人管、出了事没有记录，你也无法上路。五大模块各管一件事：执行循环是「开车流程」，工具集是「方向盘和踏板」，记忆是「这趟路已经开到哪了」，权限是「限速和学校路段不能闯」，可观测是「行车记录仪 + 后台轨迹回放」。所以同一台发动机换一套整车，成绩差几倍很正常——你比的是车，不是发动机台架数据。</p>
`},
c6_spec:{tag:"Harness",title:"24. AGENTS / SKILL / DESIGN",html:`
<h3>三层指令体系</h3>
<p>AI 编码的质量上限很大程度取决于给它的常驻上下文。三层分工让"该长期在场的"和"该按需加载的"各归其位，避免把所有规范塞进一个巨大的系统提示词。</p>
<ul>
<li><strong>AGENTS.md（常驻）：</strong> 项目级宪法。写技术栈约定、目录结构、编码规范、禁止事项，每次会话自动加载，是最稳定的约束层。</li>
<li><strong>SKILL.md（按需）：</strong> 具体技能的操作手册。做某类任务（如部署、写迁移脚本）时才注入，含步骤、命令与易错点，用完即走，不占常驻上下文。</li>
<li><strong>DESIGN.md（视觉规范）：</strong> 前端项目专用。统一配色、间距、组件样式与交互约定，保证 AI 生成多轮界面后风格仍然一致。</li>
</ul>
<h3>实践要点</h3>
<p>三层文件都应短小、可执行、带例子；写得越模糊，AI 自由发挥的空间越大。规范冲突时以更具体的一层为准，AGENTS.md 中可声明加载顺序。规范文件本身要随项目演进定期修订，过时的约束比没有约束更糟。</p>
<div class="fig"><div class="fig-t">图：三层上下文按「什么时候进场」分工，而不是按重要性分层</div><div class="layers"><div class="layer l1">AGENTS.md 常驻：每次会话自动加载。技术栈、目录、规范、禁止事项——最稳定的约束层</div><div class="layer l2">SKILL.md 按需：做某类任务才注入，含步骤、命令、易错点，用完即走，不占常驻上下文</div><div class="layer l3">DESIGN.md 场景专用：前端项目才用，统一配色、间距、组件与交互，保证多轮生成后风格不飘</div></div><div class="bars"><div class="bar-item"><div class="bar-h bad" style="height:100%"></div><span>全塞进一个巨型<br>系统提示词</span></div><div class="bar-item"><div class="bar-h good" style="height:35%"></div><span>三层分工<br>常驻部分只留宪法</span></div></div><div class="fig-n">右边那根不是精确比例，讲的是机制：常驻内容越少越稳定，具体规程交给按需层。两条实践红线：写得越模糊，AI 自由发挥空间越大；<strong>过时的约束比没有约束更糟</strong>，因为它让人以为已经有护栏了</div></div>
<p class="plain-text">大白话：三层文件对应三种使用场景。AGENTS.md 是员工手册，天天在身上，规定「我们用什么、不准碰什么」；SKILL.md 是工位上的操作卡，只有真要做那件事（发布、写迁移脚本）时才摊开看，用完合上，不占日常注意力；DESIGN.md 是装修验收标准，专门管「别三面墙刷成三种白」。之所以要分层，是因为把所有规矩塞进一份巨型提示词，等于把手册、操作卡、验收标准钉在同一页纸上交给新员工——他不是不遵守，是读不完也记不住。另外记住那条最容易踩的反例：过时的约束比没有约束更糟，因为它会让人以为已经有护栏了。</p>
`},
c6_sdd:{tag:"SDD",title:"25. SDD 理念与五步流程",html:`
<h3>为什么 AI 时代反而要回头写文档</h3>
<p>直接对 AI 说一句“帮我做个 XX”（俗称 <strong>Vibe Coding</strong>）写小脚本很爽，但需求一大就暴露四个老毛病：做出来的不是你要的（需求漂移）、改一处坏三处（返工）、没有验收标准（“看起来能跑”就算完了）、上下文一长模型就忘掉前面的约定。</p>
<p><strong>SDD（Spec-Driven Development，规格驱动开发）</strong>的解法：先把“做什么、不做什么、怎么算做完”写成结构化规格，让规格成为唯一真相来源（Single Source of Truth），AI 只在规格的约束下生成代码，人只对规格负责。</p>
<h3>三个关键转变</h3>
<ul>
<li><strong>审查点上移：</strong> 人审规格的成本远低于人审代码。10 行规格里的错误，比 1000 行代码里的错误便宜两个数量级——这是 SDD 全部性价比的来源。</li>
<li><strong>文档从“一次性”变“活文档”：</strong> 规格不是写完就扔的 PPT。它是每次生成的输入，也是每次验收的判据。代码和规格不一致时，要么改代码，要么改规格，不能装看不见。</li>
<li><strong>从“提示词”变“契约”：</strong> 提示词是一段话，规格是可逐条核对的条款。一条好规格的标准是：它能对应上一条测试，或对应上一次明确的人工检查动作。</li>
</ul>
<p class="plain-text">大白话：Vibe Coding 是“口头交代一句，你去办吧”，办砸了只能重办；SDD 是先写一张任务单——做成什么样、哪些不许动、谁来签字验收——AI 照着单子干活，人只在单子上把关，不用逐行读代码。相当于把“许愿”变成“下单”。</p>
<h3>标准流程：从立宪到收敛</h3>
<ul>
<li><strong>Constitution（立宪）：</strong> 定项目级不可协商的原则：技术栈、代码规范、测试要求、安全红线、“改前先有测试”。后面所有规格都必须在宪法之下，冲突时宪法优先。</li>
<li><strong>Specify（规格）：</strong> 写清目标、非目标、用户故事与验收标准。只写“做什么”，不写“怎么实现”。</li>
<li><strong>Clarify（澄清）：</strong> 让 AI 反过来就模糊点提问（异常怎么处理？权限归谁？性能要求？并发多大？），把答案补进规格，而不是让 AI 自己猜。</li>
<li><strong>Plan（计划）：</strong> 把规格翻译成技术方案：模块划分、数据结构、接口契约、依赖与迁移策略。人审方案后再放行。</li>
<li><strong>Tasks（任务）：</strong> 拆成可独立验证的小任务，每个带明确完成判据，避免一次性生成大块代码。</li>
<li><strong>Implement（实现）：</strong> AI 按任务逐个实现，每完成一个任务就提交，保证可回滚。</li>
<li><strong>Converge（收敛）：</strong> 用验收标准、测试和“规格—代码一致性检查”核对偏差，迭代修正直到一致。</li>
</ul>
<div class="sdd-flow">
<style>

</div>
<p class="plain-text">七步看着像瀑布，其实一圈只花十几分钟：立宪=公司规章，Specify=下单，Clarify=客服回访确认细节，Plan=施工图纸，Tasks=工序清单，Implement=开工，Converge=验收整改。</p>
<h3>分档：什么时候用多重的方法</h3>
<div class="tbl"><table>
<tr><th>档位</th><th>做法</th><th>适用场景</th></tr>
<tr><td><strong>纯 Vibe</strong></td><td>一句话提示，边跑边改</td><td>一次性脚本、原型验证、玩具项目</td></tr>
<tr><td><strong>轻规格</strong></td><td>常驻规则文件 + 先出方案再动手（Plan Mode）</td><td>单人、改动小、需求方就是你自己</td></tr>
<tr><td><strong>标准 SDD</strong></td><td>规格三件套 + 任务清单 + 每阶段人工审查</td><td>多人协作、跨模块功能、要长期维护的代码</td></tr>
<tr><td><strong>重规格</strong></td><td>宪法 + 多角色 + 需求追溯 + 审计留痕</td><td>强合规行业、大版本重构、生成代码直接进生产</td></tr>
</table></div>
<p class="plain-text">一句话判断：这个改动三个月后还有人接手吗？没有 → Vibe；有 → 至少要写轻规格；有并且错了要背锅 → 上 SDD。</p>
<h3>与传统开发方法的关系</h3>
<p>TDD 把正确性锚定在测试上，BDD 锚定在行为示例上，SDD 锚定在规格上。三者不冲突、可叠加：<strong>规格定义“做对的事”，测试定义“事做对了”</strong>，AI 负责中间的体力活。SDD 也不是新发明——需求规格说明书（SRS）、接口契约、设计评审这些软件工程老实践被 AI 重新变成了刚需，只是这次“读文档并照着执行”的对象从应届生换成了模型。</p>
<div class="note exam"><div class="note-t">💡 考点</div>
SDD 四要素：<strong>目标（做什么）、非目标（不做什么）、约束（技术栈/合规/性能）、验收标准（怎么算完成）</strong>。规格是活的真相来源：代码与规格冲突时，二者必须有一个被改掉，最危险的是留着错的规格继续生成。</div>
`},
c6_sdd_tools:{tag:"SDD",title:"26. SDD 主流工具与工作模式",html:`
<h3>先分清五种工作模式</h3>
<p>各家 SDD 工具的差别不在于“能不能写规格”，而在于三件事：<strong>规格长什么样、人工审查卡在哪一步、存量项目（棕地）怎么办</strong>。搞清楚这三点，工具名字就没那么重要了。</p>
<div class="tbl"><table>
<tr><th>模式</th><th>规格形态</th><th>推进与审查</th><th>最擅长</th></tr>
<tr><td><strong>① 三件套瀑布</strong></td><td>requirements / design / tasks 三份文档</td><td>逐份确认才写码，tasks 一条条执行打勾</td><td>从零做新功能，逼你把需求写成可验证条款</td></tr>
<tr><td><strong>② 宪法 + 阶段门</strong></td><td>原则文件 + 每个特性一个 specs 目录</td><td>命令式阶段推进，每阶段人工放行，可回头跑一致性检查</td><td>团队统一流程、强制留痕</td></tr>
<tr><td><strong>③ 变更提案流</strong></td><td>一次变更 = 提案 + 任务 + 规格增量（delta）</td><td>审提案 → 实现 → 归档并回写到规格基线</td><td>已有系统的渐进改造（棕地首选）</td></tr>
<tr><td><strong>④ 多角色敏捷</strong></td><td>分析报告 → PRD → 架构 → 故事卡，多份接力</td><td>以 Epic/Story 为最小单元，角色之间互相评审</td><td>需求本身还没想清楚的中大型项目</td></tr>
<tr><td><strong>⑤ 常驻规范 + 契约先行</strong></td><td>规则文件 + 接口契约（OpenAPI / Protobuf / JSON Schema）</td><td>规则每次会话自动生效，由契约反向生成前后端骨架与测试</td><td>已有规范的仓库、前后端并行开发</td></tr>
</table></div>
<h3>主流工具一览</h3>
<div class="tbl"><table>
<tr><th>工具</th><th>模式</th><th>关键产物 / 用法</th><th>适用与代价</th></tr>
<tr><td><strong>Spec Kit</strong><br>（GitHub 开源）</td><td>② 宪法+阶段门</td><td>CLI 初始化后，用一组 <em>/speckit.*</em> 命令串起全流程：constitution → specify → clarify → plan → tasks → analyze → checklist → implement；产物落在 memory 与 specs 目录。可对接 Copilot、Claude Code、Gemini、Cursor、Codex 等多种 Agent</td><td>想把团队流程标准化、要留痕时首选。代价：命令多，小需求会觉得重</td></tr>
<tr><td><strong>Kiro</strong><br>（AWS 的 Agent IDE）</td><td>① 三件套</td><td>显式分 Vibe 模式与 Spec 模式；Spec 模式生成 requirements.md（验收标准用 EARS 句式）、design.md、tasks.md；另有 steering 文件常驻产品/技术/结构规范，和“钩子”在文件变更时跑小检查</td><td>适合“先文档后代码”的新功能，需求梳理最省心。代价：绑定其 IDE</td></tr>
<tr><td><strong>OpenSpec</strong></td><td>③ 变更提案</td><td>一个变更一个目录：提案、任务清单、设计说明、规格增量；实现完成再归档，把增量合并回“当前规格”基线。纯 Markdown，不挑 Agent</td><td>棕地改造最轻的入口，规格库跟着系统长。代价：需要自律维护基线</td></tr>
<tr><td><strong>BMAD-METHOD</strong></td><td>④ 多角色</td><td>给分析师、产品经理、架构师、Scrum Master、开发、QA 各配一份角色提示词，产出项目简报 → PRD → 架构 → 故事 → 实现与评审；支持按规模裁剪角色，也能多角色同场讨论</td><td>需求模糊、要做需求发现时价值最大。代价：文档量大、学习曲线陡</td></tr>
<tr><td><strong>cc-sdd</strong></td><td>② 的轻量版</td><td>装在 Claude Code / Cursor 里的 SDD 套件：宪法文件 + 绿地/棕地两条流程 + “规格—实现一致性审查”命令</td><td>个人或小团队想上正规流程但不想换工具。代价：生态较小</td></tr>
<tr><td><strong>Tessl</strong></td><td>⑤ 极端形态</td><td>主张“规格即源码”：规格是唯一主资产，代码是可丢弃、可重新生成的构建产物，并带上下文分发机制</td><td>方向最激进，适合 API/组件类绿地项目验证。代价：商用生态尚在早期</td></tr>
<tr><td><strong>Agent 自带的轻规格</strong><br>（CLAUDE.md / AGENTS.md / .cursor/rules + Plan Mode）</td><td>⑤</td><td>常驻规则文件写约定，动手前先让模型出一个可审批的执行方案，批准后再改码</td><td>覆盖 90% 的日常小改动，成本最低。代价：不留“需求—实现”追溯</td></tr>
<tr><td><strong>Memory Bank 式文档库</strong><br>（Roo Code 等）</td><td>⑤ 变体</td><td>一组常驻上下文：项目简介、当前进度、系统模式、技术上下文；开工先读库，收工前更新库</td><td>长期单人/小团队维护同一仓库，解决“每次重讲一遍背景”。代价：靠人定期更新</td></tr>
</table></div>
<p class="plain-text">大白话选型：<strong>新项目、要把需求一次讲清</strong> → Kiro 式三件套或 Spec Kit；<strong>已经有一堆老代码要改</strong> → OpenSpec 式变更提案（别一上来就想给全系统补规格）；<strong>连需求是什么都还没定</strong> → BMAD 式多角色帮你把需求挖出来；<strong>只是日常改点东西</strong> → 常驻规则 + 先出方案再动手，不用装工具；<strong>前后端要并行、接口是关键</strong> → 契约先行，先把接口定义锁死再生成代码。</p>
<h3>拆开看，所有工具的套路是同一个</h3>
<ul>
<li>一份<strong>不可协商的原则</strong>（宪法/steering/rules），保证每次生成风格一致。</li>
<li>一份<strong>可验证的需求</strong>（目标 + 非目标 + 验收标准），把“好”定义清楚。</li>
<li>一份<strong>技术方案</strong>（架构、数据、接口），是人审“怎么做”的抓手。</li>
<li>一份<strong>小步任务清单</strong>，让每次生成体量落在人能审完的范围内。</li>
<li>一道<strong>一致性检查</strong>（analyze/alignment/checklist），专门抓规格和代码互相撒谎。</li>
</ul>
<p>所以换工具的收益远小于把这几份东西写好的收益。看清这五点，任何新出的 SDD 工具你十分钟就能上手。</p>
<div class="note tip"><div class="note-t">✅ 最小可用 SDD（不装任何工具）</div>
一个 spec 文件（目标 / 非目标 / 约束 / 验收标准）+ 一个 tasks 文件（每条任务带完成判据）+ 每条验收标准对应一条测试。这套东西 20 分钟能搭起来，能拿到完整流程 80% 的收益。</div>
<div class="fig"><div class="fig-t">图：五种 SDD 工作模式——差别不在能不能写规格，而在三件事</div><div class="grid2"><div class="card"><h4>① 三件套瀑布</h4><p>requirements / design / tasks 三份文档，逐份人工确认才写码，tasks 一条条打勾。擅长从零做新功能。</p></div><div class="card"><h4>② 宪法 + 阶段门</h4><p>原则文件 + 每特性一个规格目录，命令式阶段推进，可回头跑一致性检查。适合团队统一流程与留痕。</p></div><div class="card"><h4>③ 变更提案流</h4><p>一次变更 = 提案 + 任务 + 规格增量，实现完归档并回写基线。存量系统（棕地）首选。</p></div><div class="card"><h4>④ 多角色敏捷</h4><p>分析师 / PM / 架构师 / QA 各出一份文档，以 Story 为最小单元互相评审。需求本身还没想清时价值最大。</p></div><div class="card"><h4>⑤ 常驻规范 + 契约先行</h4><p>规则文件每次会话自动生效，接口用 OpenAPI / Protobuf / JSON Schema 锁死，反推前后端骨架与测试。</p></div></div><div class="fig-n">选型只看三个问题：<strong>规格长什么样、人工审查卡在哪一步、存量代码怎么办</strong>。想清这三点，任何新工具十分钟能上手；反过来，换工具的收益远小于把这几份东西写好的收益</div></div>`},
c6_sdd_std:{tag:"SDD",title:"27. SDD 标准、规格写法与坑",html:`
<h3>规格写作：这些标准比 AI 老得多</h3>
<p>SDD 看起来是新东西，但它“怎么写规格”的部分全是软件工程几十年攒下的标准。捡最实用的几个：</p>
<ul>
<li><strong>EARS（Easy Approach to Requirements Syntax）：</strong> 一套受约束的自然语言句式，专治需求含糊。五种模板：
<ul>
<li>普遍型：<em>系统应当 &lt;行为&gt;</em></li>
<li>事件驱动：<em>当 &lt;触发&gt; 时，系统应当 &lt;行为&gt;</em></li>
<li>状态驱动：<em>在 &lt;状态&gt; 期间，系统应当 &lt;行为&gt;</em></li>
<li>非期望行为：<em>若 &lt;异常条件&gt;，系统应当 &lt;行为&gt;</em></li>
<li>可选特性：<em>若启用 &lt;特性&gt;，系统应当 &lt;行为&gt;</em></li>
</ul>
例子：“当用户连续 5 次输错密码时，系统应当锁定该账户 15 分钟并通知本人。”——有触发、有数值、有结果，能直接变成一条测试。</li>
<li><strong>程度关键词（源自 RFC 2119）：</strong> 必须 / 应当 / 可以（MUST / SHOULD / MAY）三档语气写死，禁止“尽量”“最好”“合理地”这类词——模型不会猜你的客气话。</li>
<li><strong>Gherkin / BDD（Given-When-Then）：</strong> 把验收标准写成可执行示例，天然可以变成自动化测试，是 EARS 的补充而非替代。</li>
<li><strong>需求质量标准（ISO/IEC/IEEE 29148，前身 IEEE 830）：</strong> 一条好需求的六判据：必要性、无歧义、可实现、可验证、可追溯、一致。SDD 里“可验证 + 可追溯”权重最高。</li>
<li><strong>架构描述（ISO/IEC/IEEE 42010 + arc42 模板 + C4 模型）：</strong> C4 把系统分四层讲：上下文 → 容器 → 组件 → 代码。给 AI 一张 C4 图 + 一段容器说明，通常比贴一万行代码更高效地传递“系统长什么样”。</li>
<li><strong>ADR（架构决策记录）：</strong> 一页纸写“背景—备选方案—决定—后果”。AI 时代价值暴涨：没有它，模型会不断提议推翻已经定死的技术选型，把同类决策重做一遍。</li>
</ul>
<p class="plain-text">大白话：EARS 就是“填空式说人话”。别说“系统要处理好异常情况”（怎么算好？谁来判定？），要说“当上传文件超过 20MB 时，系统应当拒绝并提示用户压缩后重试”。一句话里有触发、有数字、有动作，模型才执行得准，测试才写得出。</p>
<h3>接口与数据契约的标准</h3>
<p>接口是最该被“规格化”的部分，因为它有现成的机器可校验标准，AI 照着契约生成代码和测试，出错能立刻暴露：</p>
<ul>
<li><strong>OpenAPI：</strong> REST 接口的结构化描述（路径、参数、状态码、schema），一份契约可同时生成服务端骨架、客户端代码和 mock 服务。</li>
<li><strong>AsyncAPI：</strong> 消息/事件类接口（Kafka、MQTT 等）的对应标准。</li>
<li><strong>JSON Schema：</strong> 校验数据结构的事实标准，也是“结构化输出（JSON 模式）”的护栏。</li>
<li><strong>Protobuf / GraphQL SDL：</strong> 跨语言服务与查询层的契约定义，天然带强类型约束。</li>
<li><strong>Mermaid / PlantUML：</strong> 用文本画图，能进版本库、能被 AI 读写，适合放进规格里表达流程和状态机。</li>
</ul>
<p>契约先行的好处：前后端可以并行开发，接口变更必须改契约，模型不可能“悄悄改掉一个字段”导致线上事故。</p>
<h3>AI 编码生态自己的新标准</h3>
<ul>
<li><strong>AGENTS.md：</strong> 仓库级常驻说明的行业约定，写技术栈、目录、规范、禁止事项，多家工具通吃。</li>
<li><strong>MCP：</strong> 上下文与工具接入的开放协议，让规格里声明的外部数据源和工具可被不同 Agent 复用。</li>
<li><strong>SKILL.md：</strong> 任务级按需加载的操作手册，规格之外的“怎么做”细节放这里，不占常驻上下文。</li>
<li><strong>llms.txt：</strong> 面向模型的站点内容索引约定，帮你把“该喂给模型哪些文档”标准化。</li>
</ul>
<h3>一份能直接开工的规格：八块内容</h3>
<div class="tbl"><table>
<tr><th>板块</th><th>写什么</th><th>不合格的样子</th></tr>
<tr><td><strong>目标</strong></td><td>这次要解决的真实问题，一句话</td><td>“提升系统性能”（无对象、无程度）</td></tr>
<tr><td><strong>非目标</strong></td><td>明确这次不做什么</td><td>缺失，于是 AI 顺手加三个没人要的功能</td></tr>
<tr><td><strong>用户故事 + 验收</strong></td><td>角色/动作/收益 + EARS 句式条款</td><td>“要好用、界面美观”</td></tr>
<tr><td><strong>约束</strong></td><td>技术栈、性能、合规、成本、兼容版本</td><td>写了一堆实现方案（把 How 当 What）</td></tr>
<tr><td><strong>数据模型</strong></td><td>关键实体、字段、生命周期与所有权</td><td>只说“存一下用户数据”</td></tr>
