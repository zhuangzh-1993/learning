  { q: "哪些情况下不该把流程压在低代码平台上，而应回到代码实现？", o: ["A. 要在平台之外做统一评测与灰度发布，流程只是被验证的对象之一", "B. 分支复杂到画布上要靠海量连线和补丁节点才能表达，评审与 diff 都已经不可维护", "C. 流程一旦要调用外部接口，低代码平台就基本无能为力，只能回到代码实现", "D. 需要自定义工具、复杂状态机或精细的失败恢复策略，平台的扩展点够不着", "E. 团队靠 PR 与代码评审协作，而流程只能在画布上改、改完没有历史记录"], a: [0, 1, 3, 4], e: "低代码适合连接器与简单编排；复杂度、状态机、失败恢复与 PR 评审超出画布能力时回代码。答案 A、B、D、E。C错误：调用外部接口恰恰是这类平台的强项，现成连接器通常比手写更省事，这一条构不成回到代码的理由。B、D、E、A 成立：判断线在于复杂度、可控性与工程流程能否被平台承载——承载不了时就该把编排逻辑收回代码，而不是在画布上硬堆。", t: 15, n: {"A": "要在平台外做统一评测与灰度，流程只是被验证的对象", "B": "分支复杂到画布要靠海量连线，评审与 diff 已不可维护", "C": "调用外部接口恰恰是这类平台的强项，现成连接器通常比手写更省事，这一条构不成回到代码的理由。", "D": "需要自定义工具与精细失败恢复，平台扩展点够不着", "E": "团队靠 PR 协作，而流程只能在画布上改还没历史"}, d: "中" },
  { q: "担心被某个 Agent 平台锁定，成本更可控的做法有？", o: ["A. 提示词、规格与评测集放在平台外的版本库里，平台只当执行器", "B. 定期验证流程定义和运行日志能否导出，别到真要迁移时才发现拿不出来", "C. 模型与工具调用走抽象层或标准协议，换平台时不用逐节点重写", "D. 业务规则写成平台无关的规格或代码，画布里只保留编排与调用", "E. 选开源平台就没有锁定问题，数据与流程天然可迁移"], a: [0, 1, 2, 3], e: "抗锁定靠把规格、提示词、评测集留在平台外，并定期验证导出与迁移；开源不等于不锁定。答案 A、B、C、D。E错误：开源只保证拿得到源码，锁定的常见形态是数据格式、运维路径和已经砸进去的二次开发投入，这些不会因为协议开放就自动可迁移。A、B、C、D 成立：抗锁定的实质是把决策依据（规格、提示词、评测集）留在自己手里，只把执行外包给平台，并且定期验证退路真的走得通。", t: 3, n: {"A": "提示词、规格与评测集放在平台外的版本库", "B": "定期验证流程定义与日志能否导出", "C": "模型与工具调用走抽象层或标准协议", "D": "业务规则写成平台无关的规格或代码", "E": "开源只保证拿得到源码，锁定的常见形态是数据格式、运维路径和已经砸进去的二次开发投入，这些不会因为协议开放就自动可迁移。"}, d: "中" },
  { q: "灰度发布的合理顺序是什么？", o: ["A. 直接全量切换", "B. 先删旧版再发新版", "C. 只在周末发布", "D. 小流量验证，再扩大流量，并保留回滚方案", "E. 先扩大流量，再补小流量验证"], a: [3], e: "单选。答案 D。A 错误：那会把故障面放到最大；B 错误：删旧版等于放弃回滚；C 错误：时间点不降低风险；E 错误：顺序反了，小流量验证必须在前。D：灰度用流量比例控制风险，回滚用旧版本兜底。", t: 15, n: {"A": "那会把故障面放到最大。", "B": "删旧版等于放弃回滚。", "C": "时间点不降低风险。", "D": "灰度用流量比例控制风险，回滚用旧版本兜底。", "E": "顺序反了，小流量验证必须在前。"}, d: "低" },
  { q: "关于冒烟集（smoke set），下列说法正确的有？", o: ["A. 冒烟集通常是最小、跑得最快的评测集", "B. 冒烟集用于在每次改动后快速发现明显退化", "C. 冒烟集是最大最全、只在年度评审时跑的题集", "D. 冒烟集只使用公开榜单题目", "E. 冒烟集覆盖全部业务线的全量题目"], a: [0, 1], e: "答案 A、B。A 正确：冒烟集的特点就是小而快。B 正确：它的用途是每次改动都跑一遍，用最小成本尽早发现明显退化。C 错误：最大最全、低频运行是回归集或全量评测的角色。D 错误：公开题目无法覆盖自家业务，冒烟集通常来自业务关键用例。E 错误：覆盖全量业务是回归集或全量评测，不是冒烟集。", t: 0, n: {"A": "最小最快", "B": "每次改动跑一遍", "C": "那是回归/全量评测", "D": "公开题不覆盖业务", "E": "全量不是冒烟集"}, d: "低" },
  { q: "关于开放权重（open weights）与开源代码的区别，下列说法正确的有？", o: ["A. 开放权重指模型权重可下载、可使用", "B. 开放权重不等于公开训练数据与训练代码", "C. 代码开源与权重开放是两件不同的事，许可也可能不同", "D. 开放权重要求必须公开全部训练语料", "E. 开源了代码就意味着同时开放了模型权重"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：开放权重说明权重可获取。B 正确：多数开放权重模型并不公开语料与训练代码。C 正确：权重、代码、数据是三件事，各有各的许可。D 错误：权重开放不要求公开训练语料。E 错误：代码开源与权重开放是两套许可，开源代码不等于开放权重。", t: 7, n: {"A": "权重可下载", "B": "不含数据与训练代码", "C": "三件事、两套许可", "D": "不要求公开语料", "E": "代码开源≠权重开放"}, d: "低" },
  { q: "要给合成数据设闸，下面哪些控制手段站得住？", o: ["A. 必须有外部判据：单元测试、验证器、可核对事实", "B. 换不同家族的模型来生成，避免模型反复读自己写的作文", "C. 定期跑一组纯真实数据对照组做消融，指标一退化就下调合成配比", "D. 把生成温度调低，合成数据的事实可靠性就有保障", "E. 设占比上限，合成只用来补真实语料稀缺的地方"], a: [0, 1, 2, 4], e: "合成数据要设占比上限、外部判据、跨家族生成、纯真实数据对照；降温与自评不解决事实。答案 A、B、C、E。D错误：降温只让输出更一致、更模板化，一致不等于正确，同一个错误反而更稳定地重复出现；只靠模型自评自信度等于自己给自己批卷。E、A、B、C 成立：这四条正是正文给出的控闸组合——占比上限、外部判据、跨家族生成、纯真实数据对照消融。", t: 9, n: {"A": "必须有外部判据：单测、验证器、可核对事实", "B": "换不同家族生成，避免反复读自己写的作文", "C": "定期跑纯真实数据对照组做消融", "D": "降温只让输出更一致、更模板化，一致不等于正确，同一个错误反而更稳定地重复出现；只靠模型自评自信度等于自己给自己批卷。", "E": "设占比上限，只补真实语料稀缺处"}, d: "中" },
  { q: "合成数据的主要风险是什么？", o: ["A. 只会占用更多存储，不影响模型行为", "B. 风险只在训练阶段，部署后就消失", "C. 教师模型越强，合成数据就越没有风险", "D. 混入真实数据后，分布收窄问题自动消失", "E. 分布收窄、继承教师错误、自我强化"], a: [4], e: "单选。答案 E。A 错误：合成数据会改变训练分布，直接影响模型行为；B 错误：训练期学到的偏置会带进部署，不会自动消失；C 错误：强教师的错误更隐蔽，学生照样继承，还会自我强化；D 错误：混合能缓解但不能消除分布收窄，配比与去重仍要管。E：分布收窄、继承教师错误、自我强化是三大主风险。", t: 9, n: {"A": "合成数据会改变训练分布，影响模型行为。", "B": "训练期偏置会带进部署。", "C": "强教师的错误更隐蔽，学生照样继承。", "D": "混合能缓解但不能消除分布收窄。", "E": "分布收窄、继承教师错误、自我强化。"}, d: "低" },
  { q: "关于用户数据作为训练语料来源，下列说法正确的有？", o: ["A. 它的分布最贴近真实业务场景", "B. 它是后训练与迭代微调的主要来源之一", "C. 它来自真实用户，天然干净，无需质量过滤", "D. 它进训练集受服务协议与用户同意范围约束", "E. 它在四路来源里单位成本最低，比公开爬取还便宜"], a: [0, 1, 3], e: "答案 A、B、D。A 正确：用户数据直接来自真实使用场景，分布最贴业务。B 正确：它是后训练与迭代微调闭环的主要进料。D 正确：使用用户数据受服务协议、同意范围与删除权约束。C 错误：真实用户输入同样混杂无信息量内容与敏感信息，仍需毒性、PII 与格式过滤。E 错误：用户数据贵在合规成本，单位成本居中；四路里最便宜的是公开爬取。", t: 0, n: {"A": "分布最贴真实业务", "B": "后训练与微调的主要来源", "C": "仍需质量过滤", "D": "受协议与同意范围约束", "E": "最便宜的是公开爬取"}, d: "低" },
  { q: "关于毒性过滤与 PII（个人可识别信息）处理，下列说法正确的有？", o: ["A. PII 扫描要覆盖邮箱、电话、密钥与证件号等形态", "B. 训练集里的 PII 只有在模型主动联网时才会造成泄露", "C. 毒性过滤的主要目标是删除不可训内容与攻击模板", "D. PII 指的是模型的参数权重", "E. 删除的 PII 数量要留计数，便于追踪语料分布的变化"], a: [0, 2, 4], e: "答案 A、C、E。A 正确：邮箱、电话、密钥、证件号都是 PII 扫描的典型形态。C 正确：毒性过滤删的是不可训练内容与攻击模板，不是简单删脏话。E 正确：删除本身改变分布，留计数才能追踪。B 错误：训练集里的 PII 被模型记住后可能在输出中复述出来，与是否联网无关。D 错误：PII 是个人可识别信息，如姓名、电话、证件号，不是模型权重。", t: 5, n: {"A": "扫描覆盖邮箱电话密钥证件号", "B": "泄露与联网无关", "C": "删不可训内容与攻击模板", "D": "PII 是个人信息非权重", "E": "删除计数要留存"}, d: "低" },
  { q: "标注质量控制的核心手段是什么？", o: ["A. 双人独立标注、一致性检验、金标题与仲裁", "B. 提高标注单价，让标注员更仔细", "C. 只抽最长的样本复核，短样本默认合格", "D. 让同一个标注员标完全部数据，保证口径一致", "E. 以标注速度排名作为质量依据"], a: [0], e: "单选。答案 A。B 错误：单价激励的是速度不是质量，质量要靠交叉验证机制；C 错误：抽样要按风险分层，只抽长样本会漏掉短样本里的系统性歧义；D 错误：单人标完无法暴露规格歧义，一致性检验需要独立双标；E 错误：速度是产能指标，与正确率无关。A：双标、一致性、金标题与仲裁构成质控闭环。", t: 9, n: {"A": "双标、一致性、金标题与仲裁构成质控闭环。", "B": "单价激励的是速度不是质量。", "C": "只抽长样本会漏掉短样本里的系统性歧义。", "D": "单人标完无法暴露规格歧义。", "E": "速度是产能指标，与正确率无关。"}, d: "低" },
  { q: "关于点赞点踩这类显式评分，正确的有？", o: ["A. 长度、自信、排版这些表面特征就能推动它，所以便宜但容易骗人", "B. 把点赞与点踩做成对称标签，表面偏置会被去掉", "C. 它适合用来做「翻牌率」类比里的摆盘信号，不适合当厨房改菜单的依据", "D. 它测的是讨喜，不是正确", "E. 拿它当优化目标，模型会先学会变长、变自信"], a: [0, 2, 3, 4], e: "点赞点踩测讨喜不测正确，受长度/自信/排版影响；要配可验证结果或编辑距离。答案 A、C、D、E。B错误：点踩同样受表面特征支配，把两个方向对称起来只是让噪声有了正负号，判据本身仍然与正确性无关，要去偏置得换成可验证的结果或编辑距离。A、C、D、E 成立：点赞点踩就像一道菜的「翻牌率」，只说明摆盘诱人、讨人喜欢；可验证结果（测试通过、单据跑通）与编辑距离才是能照着改进系统的信号。", t: 0, n: {"A": "长度、自信、排版这些表面特征就能推动它", "B": "点踩同样受表面特征支配，把两个方向对称起来只是让噪声有了正负号，判据本身仍然与正确性无关，要去偏置得换成可验证的结果或编辑距离。", "C": "适合当摆盘信号，不适合当改菜单的依据", "D": "它测的是讨喜，不是正确", "E": "拿它当目标，模型会先学会变长变自信"}, d: "中" },
  { q: "线上只盯「采纳率」这一个指标做优化，最该担心的是什么？", o: ["A. 采纳率与人工干预点无关，看它没有信息", "B. 采纳是用户的外部动作，所以它就是标准答案，不存在偏差", "C. 采纳率是代理指标，模型变得冗长、自信时它可能照涨，而留存或工单量在恶化", "D. 采纳率在技术上统计不出来，日志里没有这个字段", "E. 采纳率越高说明用户越不满意，两者是反向关系"], a: [2], e: "单选。采纳率是代理指标，模型变冗长变自信时它会照涨，真实质量要看留存与工单。答案 C。A 错误：干预点位置正是它的诊断价值；B 错误：采纳受排版与懒得改影响，不是标准答案；D 错误：日志里通常有这个字段；E 错误：方向说反了。", t: 15, n: {"A": "干预点位置正是它的诊断价值", "B": "采纳受排版与懒得改影响，不是标准答案", "C": "采纳率是代理指标，模型变冗长变自信时它会照涨，而留存可能恶化", "D": "日志里通常有这个字段", "E": "方向说反了"}, d: "高" },
  { q: "把答案已知的题混进任务流（金标题），关于它的作用与边界，正确的有？", o: ["A. 它防不了系统性的规范误读：大家都按同一份错理解作答，金标题也会被判对", "B. 金标题命中率可以当成标注质量分，用来给标注员排座次", "C. 金标题要随机混入，且答案不能出现在规范示例里，否则等于漏题", "D. 它和双人独立标注加仲裁不能互相替代", "E. 它用来测标注员有没有真在看，能抓偷懒与漂移"], a: [0, 2, 3, 4], e: "金标题测有没有在看，防不了规范误读；它替代不了双人标注与仲裁。答案 A、C、D、E。B错误：命中率只证明这条任务被认真做了，不证明这个标注员的理解与你要的一致，把它当质量分会奖励最会照规范猜心思的人。A 之所以成立：规范误读要靠争议仲裁加裁决回写来防，这是正文点名的分工。E、C、D 成立：金标题的定位就是防偷懒与漂移，防不了整体跑偏，替代不了双人标注，也替代不了仲裁。", t: 0, n: {"A": "它防不了系统性的规范误读", "B": "命中率只证明这条任务被认真做了，不证明这个标注员的理解与你要的一致，把它当质量分会奖励最会照规范猜心思的人。", "C": "金标题要随机混入，答案不能出现在规范示例里", "D": "与双人独立标注加仲裁不能互相替代", "E": "它测的是标注员有没有真在看"}, d: "中" },
  { q: "关于双人独立标注、一致性检验与争议仲裁，正确的有？", o: ["A. 分歧题交专家仲裁，且裁决必须回写标注规范，否则下一个标注员还会在同样的题上分歧", "B. 一致性很低时，首先该怀疑任务规范写得含糊，而不是先换标注员", "C. 仲裁结论只用于当次裁决，回写文档会让规范越改越长", "D. 两名标注员结论不一致时，把两人的分数取平均就是最终标签", "E. 双人独立标注加一致性检验，Kappa 这类读数说明的是规格是否可执行"], a: [0, 1, 4], e: "双人标注测规格是否可执行，分歧要仲裁并回写规范；一致性低先改规范不是换人。答案 A、B、E。C错误：不回写等于把同一道题的成本付第二遍、第三遍，仲裁的价值一半在裁决本身，一半在把边界写进规范。D错误：偏好标签与判断类标签不是数值量，取平均只会得出一个谁都没给过的答案，正确处置是进仲裁队列。E、A、B 成立：一致性低首先是指向规格的红灯，规范可执行性解决了之后才谈得上人的问题。", t: 9, n: {"A": "分歧题交仲裁，且裁决要回写规范", "B": "一致性很低时先怀疑规范含糊", "C": "不回写等于把同一道题的成本付第二遍、第三遍，仲裁的价值一半在裁决本身，一半在把边界写进规范", "D": "偏好标签与判断类标签不是数值量，取平均只会得出一个谁都没给过的答案，正确处置是进仲裁队列。", "E": "Kappa 说明的是规格是否可执行"}, d: "中" },
  { q: "关于用户数据进训练集的授权与退出机制，正确的有？", o: ["A. 入库前做过一次匿名化，就不需要从用户到派生样本的反向索引", "B. 需要明示授权，并且给出可选粒度：按功能或按会话 opt-in", "C. 退出机制不能只做成「从现在起不再采集」，还必须能从后续批次里清除派生样本", "D. 后者要求你有从用户、会话到派生样本的反向索引", "E. 这笔债要在飞轮上线前还，否则删除请求来了只能装作处理过"], a: [1, 2, 3, 4], e: "用户数据授权要明示、粒度可选、可退出，并能从后续批次清除派生样本。答案 B、C、D、E。A错误：匿名化不解决「用户要求清除其数据时你找不找得到衍生样本」这个问题，找不到就没法从后续批次里剔干净，正文要求的是可撤回加反向索引。B、C、D、E 成立：默认用户输入属于用户，授权要明示、粒度可选、退出要能追溯回来，这四件事是一条链。", t: 9, n: {"A": "匿名化不解决「用户要求清除其数据时你找不找得到衍生样本」这个问题，找不到就没法从后续批次里剔干净，正文要求的是可撤回加反向索引。", "B": "要明示授权，并给按功能或会话的 opt-in", "C": "退出不只停采，还要清除派生样本", "D": "需要从用户到派生样本的反向索引", "E": "这笔债要在飞轮上线前还"}, d: "中" },
  { q: "关于灾难性遗忘（catastrophic forgetting），下列说法正确的有？", o: ["A. 灾难性遗忘指微调新任务后，旧任务能力明显下降", "B. 灾难性遗忘是模型微调时需要防范的现象", "C. 灾难性遗忘指显存被清空", "D. 灾难性遗忘指训练数据被删除", "E. 灾难性遗忘指模型在新任务上准确率上升"], a: [0, 1], e: "答案 A、B。A 正确：灾难性遗忘的定义就是学新忘旧，旧能力明显退化。B 正确：微调时控制数据配比等就是为了防范它。C 错误：显存清空是资源释放，与遗忘无关。D 错误：删除训练数据是数据管理问题，不是模型能力退化。E 错误：新任务准确率上升是学习收益或正向迁移，不是遗忘。", t: 9, n: {"A": "学新忘旧", "B": "微调需防范", "C": "那是资源释放", "D": "那是数据管理", "E": "那是学习收益"}, d: "低" },
  { q: "一个 AI 功能的责任字段通常包括什么？", o: ["A. 只写模型名称", "B. 只写服务器 IP", "C. 只写用户数量", "D. 模型谁选、提示词谁改、数据谁供、上线谁批、回滚到哪版", "E. 只写回滚命令"], a: [3], e: "单选。答案 D。A 错误：名称不等于责任人；B 错误：IP 不能回答谁签字；C 错误：用户量是运营指标；E 错误：回滚只是五格之一。D：五格填不满，这个功能就不该上线。", t: 15, n: {"A": "名称不等于责任人。", "B": "IP 不能回答谁签字。", "C": "用户量是运营指标。", "D": "五格填不满，这个功能就不该上线。", "E": "回滚只是五格之一。"}, d: "低" },
  { q: "关于「把日志当真相」这种失效，正确的有？", o: ["A. 照日志改了三版而用户行为反而变差，是它的典型症状", "B. 对策是留一小批人工专家标注，定期核对代理指标与真实质量是否相关", "C. 用户面对烂答案时的绕路行为，会被日志记成「这么用是合理的」", "D. 日志量大，就等价于信号可靠，不需要再请人工核对", "E. 日志记录的是「在当前模型下用户怎么应对」，它本身不是正确答案的分布"], a: [0, 1, 2, 4], e: "日志记录的是用户在当前模型下的应对，不是正确答案分布；要留人工专家校准。答案 A、B、C、E。D错误：体量放大的是同一个系统性偏差，正文专门留人工专家标注这条对策，就是要定期验证代理指标与真实质量到底还相关不相关。E、A、B、C 成立：日志是应对记录而不是标准答案，把应对当真相，改的方向就会顺着当前模型的缺陷走。", t: 0, n: {"A": "照日志改了三版而用户行为反而变差", "B": "留一小批人工专家标注，定期核对相关性", "C": "用户面对烂答案的绕路，会被记成合理用法", "D": "体量放大的是同一个系统性偏差，正文专门留人工专家标注这条对策，就是要定期验证代理指标与真实质量到底还相关不相关。", "E": "日志记录的是用户怎么应对，不是正确答案的分布"}, d: "中" },
  { q: "关于回归集，下列说法正确的有？", o: ["A. 回归集用于发布前确认旧能力没有被改坏", "B. 回归集是评测资产，不参与模型训练", "C. 回归集的作用是自动生成训练数据", "D. 回归集可以替代线上监控与告警", "E. 回归集主要用于新模型选型时的初筛排序"], a: [0, 1], e: "答案 A、B。A 正确：回归集守的是已有能力，防止改一处坏一片。B 正确：评测集不拿来训练，这是基本分工。C 错误：回归集只做评测，不生成数据。D 错误：离线回归与线上监控是两套机制，不能互相替代。E 错误：选型初筛可用公开榜，回归集的职责是守住旧能力。", t: 0, n: {"A": "守旧能力防改坏", "B": "评测不训练", "C": "不生成数据", "D": "不替代线上监控", "E": "选型初筛另有渠道"}, d: "低" },
  { q: "从生产日志抽题建评测集，抽样时要注意什么？", o: ["A. 只抽最简单的题", "B. 覆盖高频问题、边界情况与不同业务分布", "C. 只抽最长的输入", "D. 只抽点赞最多的回答", "E. 只抽最近的十条"], a: [1], e: "单选。答案 B。A 错误：会高估模型能力；C 错误：长输入不代表全部分布；D 错误：点赞有偏，不能代表整体；E 错误：十条无法覆盖分布。B：抽样要分层，覆盖比条数重要。", t: 4, n: {"A": "会高估模型能力。", "B": "抽样要分层，覆盖比条数重要。", "C": "长输入不代表全部分布。", "D": "点赞有偏，不能代表整体。", "E": "十条无法覆盖分布。"}, d: "高" },
  { q: "要区分「模型真会做」和「它背过这道题」，可操作的验证手段包括", o: ["A. 提高采样温度多试几次，反复总能答对就说明不是背的", "B. 看首个作答 token 的概率，概率极高就说明它真的会做", "C. 只给题号或极短线索，要求模型复述完整题面与解析；一字不差说明它记住的是文本", "D. 把题里的数字、实体名、选项顺序换掉再跑一遍，成绩大幅跳水说明靠记忆", "E. 让它先讲清解题方法，再换一道同方法的新题验证能不能迁移"], a: [2, 3, 4], e: "背题识别靠换题面、换数字、换问法、给短线索复述；看温度和首 token 概率会把记忆与能力混在一起。答案 C、D、E。A错误：背过的题换个温度照样对，多采样只会把记忆和择优混在一起，反而更难判断。B错误：首 token 概率极高恰恰是背过题面的典型信号，不是能力的证据。", t: 4, n: {"A": "背过的题换个温度照样对，多采样只会把记忆和择优混在一起，反而更难判断", "B": "首 token 概率极高恰恰是背过题面的典型信号，不是能力的证据", "C": "只给题号要求复述，一字不差说明记住的是文本", "D": "换数字、实体与选项顺序再跑一遍", "E": "先讲方法，再换同方法的新题验证迁移"}, d: "中" },
  { q: "标注规范（rubric）应该写成什么？", o: ["A. 形容词越多越好", "B. 只写一句「质量要高」", "C. 只写一个总分，不写判据", "D. 把评分标准写成一段散文", "E. 可判定的条款，并配正例与反例"], a: [4], e: "单选。答案 E。A 错误：不可判定的描述没法验收；B 错误：太模糊，标注员无法一致执行；C 错误：没有判据就没有可复现的打分；D 错误：散文仍可能不可判定。E：规格是给人和模型的接口，必须可判定。", t: 4, n: {"A": "不可判定的描述没法验收。", "B": "太模糊，标注员无法一致执行。", "C": "没有判据就没有可复现的打分。", "D": "散文仍可能不可判定。", "E": "规格是给人和模型的接口，必须可判定。"}, d: "高" },
  { q: "为什么说「错误分布的变化」比总分更能证明变好？", o: ["A. 总分更客观", "B. 它说明弱项迁移与修复位置", "C. 分布不需要采样", "D. 总分根本不能计算", "E. 分布比总分更容易算"], a: [1], e: "单选。答案 B。A 错误：总分会被平均掉细节；C 错误：分布同样需要样本；D 错误：总分可以算，只是信息量少；E 错误：易算不是它更有证明力的原因。B：通过率给自己看，分布给评审看。", t: 15, n: {"A": "总分会被平均掉细节。", "B": "通过率给自己看，分布给评审看。", "C": "分布同样需要样本。", "D": "总分可以算，只是信息量少。", "E": "易算不是它更有证明力的原因。"}, d: "中" },
  { q: "采纳率单独上涨、其他指标未核对时，正确的解读是？", o: ["A. 它可能掩盖质量问题、次周留存下降与工单上升", "B. 采纳是用户的外部动作，采纳率高说明内容的客观正确率也高", "C. 平均采纳率上涨，说明各用户群体的体验都在变好", "D. 采纳率上升的阶段，工单量与人工复核量会同步下降", "E. 采纳率持续上涨时，其他质量指标可以停采，节省埋点成本"], a: [0], e: "单选。答案 A。B 错误：采纳受排版、自信与用户懒得改影响，是代理信号不是正确性判据；C 错误：平均值掩盖分组差异，部分人群体验可能在变差；D 错误：模型变冗长变自信时采纳率可能照涨，工单与人工干预反而上升；E 错误：单一代理指标当优化目标会被带偏，停采其他指标等于拆掉仪表盘。A：单指标上涨要和留存、工单、人工抽检一起读。", t: 15, n: {"A": "单指标上涨要和留存、工单、人工抽检一起读。", "B": "采纳受排版与懒得改影响，是代理信号不是正确性判据。", "C": "平均值掩盖分组差异，部分人群体验可能变差。", "D": "模型变冗长变自信时采纳率可能照涨，工单反而上升。", "E": "单一代理指标当优化目标会被带偏，其他指标是仪表盘。"}, d: "高" },
  { q: "关于精确率（precision），下列说法正确的有？", o: ["A. 精确率是被判为正的样本里，真正为正的比例", "B. 精确率是真正为正的样本里，被判为正的比例", "C. 精确率常与召回率一起使用，两者需要兼顾", "D. 精确率衡量生成文本的平均长度", "E. 精确率衡量模型回答被用户采纳的比例"], a: [0, 2], e: "答案 A、C。A 正确：精确率的定义是「报出来的有多少是真的」。C 正确：精确率与召回率是一对指标，通常要一起看，F1 就是两者的调和平均。B 错误：真正为正里被判为正的比例是召回率的定义。D 错误：文本长度不是分类指标。E 错误：采纳率是线上业务指标，不是精确率。", t: 0, n: {"A": "判正中真正为正的比例", "B": "那是召回率", "C": "与召回率兼顾", "D": "长度不是分类指标", "E": "采纳率是线上指标"}, d: "低" },
  { q: "要排查裁判是不是只在奖励长度，合理的做法包括", o: ["A. 把答案填充到同一字数再评，长度偏差就处理掉了", "B. 把裁判换成更强的模型，长度偏差会自己消失", "C. 在评分标准里明写冗长扣分，把简洁单独成一维", "D. 统计胜率与答案长度的相关系数，相关性很强就说明裁判被长度绑架", "E. 做截断对照：把长答案尾部截掉再评一次，分数大跌说明赢在篇幅不在内容"], a: [2, 3, 4], e: "长度偏置要用标准、截断对照、相关性统计来查；换更强裁判或填充字数都不解决。答案 C、D、E。A错误：填充只对齐了字符数，还引入噪声；真正与长度高度相关的是信息量，硬凑等长反而把差异洗掉。B错误：更强的模型同样有长度偏好，这是裁判自身的属性，只能靠标准和控制变量治。", t: 0, n: {"A": "填充只对齐了字符数，还引入噪声；真正与长度高度相关的是信息量，硬凑等长反而把差异洗掉", "B": "更强的模型同样有长度偏好，这是裁判自身的属性，只能靠标准和控制变量治", "C": "评分标准里明写冗长扣分，把简洁单独成一维", "D": "统计胜率与长度的相关系数", "E": "做截断对照：把长答案尾部截掉再评"}, d: "中" },
  { q: "关于召回率（recall），下列说法正确的有？", o: ["A. 召回率是真正为正的样本里，被判为正的比例", "B. 召回率是被判为正的样本里，真正为正的比例", "C. 召回率常与精确率一起用于评估分类或检索效果", "D. 召回率衡量模型的响应速度", "E. 召回率衡量训练损失的下降幅度"], a: [0, 2], e: "答案 A、C。A 正确：召回率的定义是「该找到的找到了多少」。C 正确：召回率与精确率是一对指标，常一起评估分类或检索。B 错误：判正样本中真正为正的比例是精确率的定义。D 错误：响应速度是延迟指标。E 错误：损失下降是训练过程指标，与召回率无关。", t: 0, n: {"A": "真正为正中被找到的比例", "B": "那是精确率", "C": "与精确率成对使用", "D": "那是延迟指标", "E": "那是训练指标"}, d: "低" },
  { q: "一份稳得住的裁判 rubric，写法上应当", o: ["A. 每个档位配正反锚例，并包含边界示例", "B. 要求裁判先摘出证据句，再下结论", "C. 最后加一条「综合质量主观总评」收口，越靠主观越能反映真实水平", "D. 裁判模型与提示词版本连同评测集一起冻结，改动走版本", "E. 一条只判一件事，写成二元可核对的观察项"], a: [0, 1, 3, 4], e: "rubric 要一维一事、正反锚例、先摘证据再判；综合主观总评会把偏差混回去。答案 A、B、D、E。C错误：综合总评会把前面所有维度的偏差重新混回一杯，正是标准歧义的来源；要合成也得用固定权重的程序化规则，不能让裁判自由发挥。", t: 0, n: {"A": "每档配正反锚例，并包含边界示例", "B": "要求先摘证据句再下结论", "C": "综合总评会把前面所有维度的偏差重新混回一杯，正是标准歧义的来源；要合成也得用固定权重的程序化规则，不能让裁判自由发挥", "D": "裁判模型与提示词版本连同评测集冻结", "E": "一条只判一件事，写成二元可核对项"}, d: "中" },
  { q: "关于 Goodhart 定律在 AI 指标上的含义，下列说法正确的有？", o: ["A. Goodhart 定律指指标一旦成为目标，就容易被优化到失真", "B. Goodhart 定律提醒不要把单一指标当作唯一的优化目标", "C. Goodhart 定律认为指标越多越好", "D. Goodhart 定律认为指标无法量化计算", "E. Goodhart 定律认为指标只能上升不能下降"], a: [0, 1], e: "答案 A、B。A 正确：Goodhart 定律的核心是「指标成为目标后就不再是好指标」，考核什么就会被找最省力的达标路径。B 正确：它的基本启示是避免单一指标被刷到失真，要多角度衡量。C 错误：定律没说指标越多越好，指标过多还会互相冲突。D 错误：指标可以计算，定律说的是被目标扭曲。E 错误：指标可以下降，与定律内容无关。", t: 15, n: {"A": "指标成目标即失真", "B": "别只盯单一指标", "C": "并非越多越好", "D": "指标可以计算", "E": "指标可以下降"}, d: "低" },
  { q: "裁判选强模型还是便宜模型，合理的判断有", o: ["A. 两种裁判跑出的趋势曲线可以互相替换着看，各自内部自洽即可", "B. 裁判预算应全押在最强模型上，因为裁判越贵结论越可靠", "C. 强裁判判得准、能遵循长 rubric，但贵且慢，且更容易与前沿候选同源，自偏好风险最高", "D. 便宜裁判跑得动全量回归，但对长 rubric 遵循差、噪声大，容易把格式像好答案当成内容好", "E. 分层是常见折中：便宜裁判跑冒烟与粗筛，强裁判跑发布门与争议样本，小比例人评做校准"], a: [2, 3, 4], e: "强裁判准但贵、慢、易与候选同源；便宜裁判噪声大；分层是常见折中。答案 C、D、E。A错误：换裁判等于换量具，两条曲线的整体水位和斜率都不同，混着看会把裁判变更读成模型变更。B错误：结论可靠性来自偏差控制、锚例和人评校准，不是单价；越强的前沿模型与候选越可能同源，自偏好反而更重。", t: 0, n: {"A": "换裁判等于换量具，两条曲线的整体水位和斜率都不同，混着看会把裁判变更读成模型变更", "B": "结论可靠性来自偏差控制、锚例和人评校准，不是单价；越强的前沿模型与候选越可能同源，自偏好反而更重", "C": "强裁判准、能遵循长 rubric，但贵且更容易与候选同源", "D": "便宜裁判跑得动全量，但对长 rubric 遵循差、噪声大", "E": "分层是常见折中：便宜跑冒烟，强跑发布门"}, d: "中" },
  { q: "关于让生成答案的模型同时当裁判（同一模型配同一份提示词），正确的有？", o: ["A. 固定随机种子可以消掉同源自评的偏差", "B. 缓解办法是裁判换模型家族、两家族交叉裁判，关键结论回落到人评", "C. 策略学会讨好裁判：评测分数上涨，人评与投诉同步恶化", "D. 这在强化学习里就是奖励被套路，与评测里的同源偏置是同一件事的两面", "E. 同一模型最了解自己的输出分布，自评天然无偏"], a: [1, 2, 3], e: "同源自评会奖励讨好：分数涨、人评与投诉恶化；换家族、交叉裁判、人评兜底。答案 B、C、D。E错误：了解自己的分布只会让它更认得出、也更偏爱自己的风格，「无偏」恰好说反了。A错误：种子只固定随机性，同源是系统性偏差，锁种子只是把偏差稳定地留在结果里。", t: 1, n: {"A": "种子只固定随机性，同源是系统性偏差，锁种子只是把偏差稳定地留在结果里", "B": "换模型家族或交叉裁判，关键结论回落到人评", "C": "分数涨而人评与投诉同时恶化", "D": "与强化学习里的奖励套路是同一件事的两面", "E": "了解自己的分布只会让它更认得出、也更偏爱自己的风格，「无偏」恰好说反了"}, d: "中" },
  { q: "关于裁判的格式语气偏差与分数漂移，正确的有", o: ["A. 剥掉样式做纯文本对照，可以检验分数到底是不是格式带来的", "B. 同一答案在不同批次拿到不同分，说明这道题本身有歧义", "C. 必须用打分制时，锁住锚例、同一批次不混裁判版本，能压住漂移", "D. 排版整齐、分点清晰、语气自信就容易被加分，即使内容有错", "E. 把事实性单独成一维并且先判，能减少好排版掩盖错内容"], a: [0, 2, 3, 4], e: "格式语气会加分，漂移先查裁判版本/提示词/锚例；事实性单独成维并先判。答案 A、C、D、E。B错误：批次间漂首先是分数漂移，要查裁判版本、提示词、锚例和同批混跑的题目；题目歧义是另一回事，它会同时拉低人与人一致率。", t: 0, n: {"A": "剥掉样式做纯文本对照，检验分数是否来自格式", "B": "批次间漂首先是分数漂移，要查裁判版本、提示词、锚例和同批混跑的题目；题目歧义是另一回事，它会同时拉低人与人一致率", "C": "锁住锚例，同批不混裁判版本", "D": "排版整齐、分点清晰就容易被加分", "E": "事实性单独成一维并且先判"}, d: "中" },
  { q: "关于 F1 分数，下列说法正确的有？", o: ["A. F1 是精确率与召回率的调和平均", "B. F1 用于综合平衡精确率与召回率，避免只看一头", "C. F1 是两个模型分数的算术平均", "D. F1 是精确率与召回率的差值", "E. F1 是显存占用与吞吐的比值"], a: [0, 1], e: "答案 A、B。A 正确：F1 的定义就是精确率与召回率的调和平均。B 正确：调和平均对低值更敏感，能防止只刷高其中一个指标。C 错误：F1 不涉及模型之间的平均。D 错误：F1 是调和平均，不是差值。E 错误：显存与吞吐的比值是资源效率类指标，不是 F1。", t: 0, n: {"A": "P 与 R 的调和平均", "B": "平衡两项指标", "C": "不是模型间平均", "D": "不是差值", "E": "不是资源指标"}, d: "低" },
  { q: "关于重排（rerank），下列说法正确的有？", o: ["A. 重排对召回阶段得到的候选集重新打分", "B. 重排的目标是把最相关的结果排到前面", "C. 重排的作用是重新训练嵌入模型", "D. 重排的作用是重建整个向量索引", "E. 重排的作用是压缩输入 token"], a: [0, 1], e: "答案 A、B。A 正确：重排发生在召回之后，对候选重新打分。B 正确：目的是让最相关的排在前面，提升最终送入上下文的质量。C 错误：重排模型与嵌入模型是两件事，重排不训练嵌入。D 错误：重排不改索引，只调整候选顺序。E 错误：重排是排序操作，不是 token 压缩。", t: 2, n: {"A": "对召回候选重新打分", "B": "最相关排前面", "C": "不训练嵌入", "D": "不重建索引", "E": "不是压缩"}, d: "低" },
  { q: "人审检查点最该留在哪些动作前？", o: ["A. 所有读取动作", "B. 所有查询", "C. 所有日志", "D. 不可逆、高代价、模型低置信的动作", "E. 所有模型不确定的回答"], a: [3], e: "单选。答案 D。A 错误：全量人审会让流程瘫痪；B 错误：查询通常低风险；C 错误：日志不是动作；E 错误：低置信只是判据之一，仍要看代价与可逆性。D：人审放错位置，要么拖慢流程，要么关键动作没人看。", t: 15, n: {"A": "全量人审会让流程瘫痪。", "B": "查询通常低风险。", "C": "日志不是动作。", "D": "人审放错位置，要么拖慢流程，要么关键动作没人看。", "E": "低置信只是判据之一，仍要看代价与可逆性。"}, d: "高" },
  { q: "双人独立标注的主要价值是什么？", o: ["A. 比单人标注更快", "B. 比单人标注更便宜", "C. 可以替代仲裁", "D. 发现规格歧义与标注不一致", "E. 能直接给出最终业务结论"], a: [3], e: "单选。答案 D。A 错误：双标是两份人力，单条耗时只会更长；B 错误：成本约翻倍，买的是质量不是省钱；C 错误：双标暴露分歧，分歧仍要仲裁收敛；E 错误：标注产出的是数据，业务结论要另做判断。D：独立双标的价值是暴露规格歧义与不一致。", t: 4, n: {"A": "双标是两份人力，耗时更长。", "B": "成本约翻倍，买的是质量。", "C": "分歧仍要仲裁收敛。", "D": "暴露规格歧义与不一致。", "E": "标注产出数据，不是业务结论。"}, d: "低" },
  { q: "线上用采纳率与编辑距离衡量生成质量，关于两者口径，正确的有", o: ["A. 把「用户没点拒绝」当成采纳，会系统性高估采纳率", "B. 采纳率是建议被直接采用的比例，受任务难度影响大，跨功能不可比", "C. 编辑距离小不等于质量好：用户懒得改、将就用，也算改动小", "D. 编辑距离要按输出长度归一，否则长文本天然显得改得多", "E. 两者方向是一致的，盯住一个即可"], a: [0, 1, 2, 3], e: "采纳率与编辑距离会反着走：将就用、原样接受废话都会骗过单一指标。答案 A、B、C、D。E错误：两者会反着走——用户改了一堆但照样用（采纳率掉、价值没掉），或原样接受一份没人看的废话（采纳率涨、价值为零），所以还要配人工干预率一起看。", t: 0, n: {"A": "把「没点拒绝」当采纳，会系统性高估", "B": "采纳率受任务难度影响大，跨功能不可比", "C": "编辑距离小不等于质量好", "D": "编辑距离要按长度归一", "E": "两者会反着走——用户改了一堆但照样用（采纳率掉、价值没掉），或原样接受一份没人看的废话（采纳率涨、价值为零），所以还要配人工干预率一起看"}, d: "中" },
  { q: "关于 AUC，下列说法正确的有？", o: ["A. AUC 常用于衡量二分类模型把正样本排在负样本前面的能力", "B. AUC 评估的是排序能力，不依赖某一个具体的分类阈值", "C. AUC 常用于衡量代码生成的通过率", "D. AUC 常用于衡量摘要与参考文本的重叠度", "E. AUC 常用于衡量模型回答的平均延迟"], a: [0, 1], e: "答案 A、B。A 正确：AUC 反映的是正样本得分排在负样本之前的能力。B 正确：AUC 基于 ROC 曲线下面积，考察整体排序而非单一阈值。C 错误：代码生成用 pass@k 一类指标。D 错误：文本重叠用 ROUGE 一类指标。E 错误：延迟是性能指标，与 AUC 无关。", t: 0, n: {"A": "正样本排前的能力", "B": "不依赖单一阈值", "C": "代码用 pass@k", "D": "重叠用 ROUGE", "E": "延迟是性能指标"}, d: "低" },
  { q: "关于 ROUGE 与 BLEU，下列说法正确的有？", o: ["A. ROUGE 与 BLEU 衡量生成文本与参考文本的表面重叠程度", "B. ROUGE 常用于摘要评测，BLEU 常用于机器翻译评测", "C. ROUGE/BLEU 分数高不代表内容的事实一定正确", "D. ROUGE/BLEU 是衡量首字延迟的性能指标", "E. ROUGE/BLEU 通过执行结果判断工具调用是否成功"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：两者都基于词面/n-gram 重叠计算。B 正确：ROUGE 的传统场景是摘要，BLEU 的传统场景是机器翻译。C 正确：重叠度高不等于内容对，事实与逻辑要另测。D 错误：首字延迟是 TTFT 等性能指标，与文本重叠无关。E 错误：工具调用要看执行结果与参数校验，不是文本重叠指标。", t: 0, n: {"A": "衡量词面重叠", "B": "摘要用 ROUGE、翻译用 BLEU", "C": "重叠高≠事实对", "D": "延迟另有指标", "E": "工具调用看执行结果"}, d: "低" },
  { q: "关于在线指标的口径，正确的有", o: ["A. 在线实验又慢又贵，不适合用来挡每次提交的回归，那部分该交给离线集", "B. 人工干预率（转人工、重试、改写提示词、放弃）是最便宜的负面信号", "C. 单位有效任务成本要把失败重试与人工复核成本算进总成本，分母只数成功完成的任务，否则 ROI 会算虚", "D. 完成率与留存是端到端价值，但要看几周量级的周期，不能当天定论", "E. 一次线上实验可以同时改多个变量，样本够大时分得清归因"], a: [0, 1, 2, 3], e: "在线实验慢且贵，一次只验一个变量；离线挡回归，在线看端到端价值，成本要把重试与人工算进总成本（分子），分母是成功完成的任务数。答案 A、B、C、D。E错误：线上实验一次只能验一个变量，多变量混在一起，大样本也只是把混淆估得更精确，归因依然做不出来。", t: 15, n: {"A": "在线实验慢且贵，挡回归该交给离线集", "B": "人工干预率是最便宜的负面信号", "C": "单位任务成本要把重试与人工成本算进总成本（分子），分母是成功完成的任务数", "D": "完成率与留存要看几周量级，不能当天定论", "E": "线上实验一次只能验一个变量，多变量混在一起，大样本也只是把混淆估得更精确，归因依然做不出来"}, d: "中" },
  { q: "对外汇报一次模型评测结果时，按正文口径必须给出的三要素是", o: ["A. 把榜单名次与参数量报清楚就算完整", "B. 模型名称、榜单名次、参数量", "C. 温度、top_p、max_tokens", "D. 提示词全文、API 单价、上线日期", "E. 指标定义、样本量与置信区间、离线还是在线"], a: [4], e: "单选。评测结论要能复核：指标定义、样本量与区间、离线还是在线，三样缺一不可。答案 E。A 错误：缺指标定义与置信区间，名次无法判断可信度；B 错误：名次回答不了「这个数怎么测的、有多可信」，而且跨榜名次本来就不可比；C 错误：采样参数是必须固定并公开的实验条件，属于指标定义的一部分，顶替不了样本量与区间；D 错误：提示词全文通常涉密，单价与上线日期与结论可信度无关，正文要求的三要素里没有这些。", t: 0, n: {"A": "缺指标定义与置信区间，名次无法判断可信度", "B": "名次回答不了「这个数怎么测的、有多可信」，而且跨榜名次本来就不可比", "C": "采样参数是必须固定并公开的实验条件，属于指标定义的一部分，顶替不了样本量与区间", "D": "提示词全文通常涉密，单价与上线日期与结论可信度无关，正文要求的三要素里没有这些", "E": "指标定义、样本量与置信区间、离线还是在线"}, d: "低" },
  { q: "什么情况下应优先用固定流程而不是 Agent？", o: ["A. 任务完全开放", "B. 步骤可枚举、要求可复现、需要审计", "C. 目标经常变化", "D. 无法验证结果", "E. 需要频繁改步骤的任务"], a: [1], e: "单选。答案 B。A 错误：开放任务才更需要 Agent 的灵活性；C 错误：变化频繁时固定流程容易僵化；D 错误：无法验证时 Agent 也更难刹车；E 错误：频繁变化更适合 Agent 的灵活性。B：能写死的流程，通常更便宜也更好定位。", t: 15, n: {"A": "开放任务才更需要 Agent 的灵活性。", "B": "能写死的流程，通常更便宜也更好定位。", "C": "变化频繁时固定流程容易僵化。", "D": "无法验证时 Agent 也更难刹车。", "E": "频繁变化更适合 Agent 的灵活性。"}, d: "低" },
  { q: "金标题（gold question）的作用是什么？", o: ["A. 用来训练模型", "B. 用来生成向量", "C. 混入答案已知的题，检测标注员有没有认真看", "D. 用来压缩日志", "E. 用来替代黄金集"], a: [2], e: "单选。答案 C。A 错误：金标题用于质控，不用于训练；B 错误：它与向量化无关；D 错误：日志压缩是另一类处理；E 错误：金标题是质控手段，不是评测集。C：金标题测的是「有没有在看」，不是「懂不懂业务」。", t: 4, n: {"A": "金标题用于质控，不用于训练。", "B": "它与向量化无关。", "C": "金标题测的是「有没有在看」，不是「懂不懂业务」。", "D": "日志压缩是另一类处理。", "E": "金标题是质控手段，不是评测集。"}, d: "低" },
  { q: "评测集为什么要做版本管理？", o: ["A. 让评测文件更大", "B. 减少输入 token", "C. 提高采样温度", "D. 让评测结果永远不变", "E. 题目与判据的变化可追溯，结果可比较"], a: [4], e: "单选。答案 E。A 错误：文件大小不是目的；B 错误：版本管理不负责压缩；C 错误：温度与评测集版本无关；D 错误：版本管理是让变化可追溯，不是冻结结果。E：题集一变，历史分数就不能直接横比。", t: 4, n: {"A": "文件大小不是目的。", "B": "版本管理不负责压缩。", "C": "温度与评测集版本无关。", "D": "版本管理是让变化可追溯，不是冻结结果。", "E": "题集一变，历史分数就不能直接横比。"}, d: "低" },
  { q: "防止评测集污染的做法包括什么？", o: ["A. 把题目发到公网收集答案", "B. 让模型背下所有题目", "C. 密封题集、控制外发、用新鲜题复测", "D. 只用几年前的老题", "E. 把训练集和评测集合并"], a: [2], e: "单选。答案 C。A 错误：这等于主动制造污染；B 错误：背题测到的是记忆；D 错误：老题更容易进训练语料；E 错误：合并等于主动污染。C：题面进过语料，分数就会虚高。", t: 4, n: {"A": "这等于主动制造污染。", "B": "背题测到的是记忆。", "C": "题面进过语料，分数就会虚高。", "D": "老题更容易进训练语料。", "E": "合并等于主动污染。"}, d: "低" },
  { q: "评测集什么时候需要更新？", o: ["A. 每天把所有题换一遍", "B. 永远不更新", "C. 业务变化、题目失效或线上分布漂移时", "D. 只在模型降价时更新", "E. 等模型下线再更新"], a: [2], e: "单选。答案 C。A 错误：频繁换题会让历史结果不可比；B 错误：业务会变，题会失效；D 错误：价格与题集有效性无关；E 错误：那时评测已经失去意义。C：更新要有版本与失效标记，不能悄悄换题。", t: 4, n: {"A": "频繁换题会让历史结果不可比。", "B": "业务会变，题会失效。", "C": "更新要有版本与失效标记，不能悄悄换题。", "D": "价格与题集有效性无关。", "E": "那时评测已经失去意义。"}, d: "低" },
  { q: "评测集的版本管理，正确的有", o: ["A. 各模型都做对或都做错的题区分度接近零，是淘汰候选", "B. 为了让趋势好看，可以把历史版本做错的题从回归集里删掉", "C. 数据集带版本号与变更日志，题目只增不改", "D. 直接改题目内容而不换版本，历史报告立刻不可比", "E. 失效题（依赖的接口下线、事实已过时）应当退役但不删除，保留可追溯"], a: [0, 2, 3, 4], e: "评测集只增不改、带版本与变更日志；失效题退役不删除，改题面不换版本会让历史不可比。答案 A、C、D、E。B错误：那是改考卷迎合模型，趋势曲线当场失去意义；做错要保留、要复盘，只在题目本身失效时才走退役流程并记录原因。", t: 4, n: {"A": "所有人都对或都错的题区分度接近零", "B": "那是改考卷迎合模型，趋势曲线当场失去意义；做错要保留、要复盘，只在题目本身失效时才走退役流程并记录原因", "C": "带版本号与变更日志，只增不改", "D": "直接改题会让历史报告不可比", "E": "失效题退役但不删，保留可追溯"}, d: "中" },
  { q: "把评测回归接进 CI 当发布门禁，合理的设计有", o: ["A. 每次提交都跑全量黄金集上万条，越全越安全", "B. 门禁失败要能下钻到失败样本与 Trace，否则只剩一个没法行动的数字", "C. 阈值要按噪声定：几百条样本上把「跌 1 分」设成红线，会天天误拦", "D. 分层设线：冒烟集硬阻断，回归集看关键意图不劣化，安全与权限这类风险面零容忍", "E. 固定随机种子、解码参数与题目版本，门禁才谈得上可复现"], a: [1, 2, 3, 4], e: "CI 门禁按噪声定阈值、分层设线、失败可下钻、固定种子与版本；全量黄金集不该塞进每次提交。答案 B、C、D、E。A错误：跑得越勤的集子越小；全量黄金集该放在发布前或夜间任务，硬塞进每次提交只会让人开始无条件重跑和忽略门禁。", t: 15, n: {"A": "跑得越勤的集子越小；全量黄金集该放在发布前或夜间任务，硬塞进每次提交只会让人开始无条件重跑和忽略门禁", "B": "门禁失败要能下钻到失败样本与 Trace", "C": "阈值按噪声定，几百条上把「跌 1 分」当红线会天天误拦", "D": "分层设线：冒烟硬阻断，安全面零容忍", "E": "固定种子、解码参数与题目版本"}, d: "中" },
  { q: "从生产日志抽题进黄金集，来源记录与脱敏环节，正确的有", o: ["A. 进集前做去标识化：姓名、证件号、密钥、内部域名都要处理", "B. 用户原话里的行业黑话和错别字可以顺手改通顺，题目更好读", "C. 密钥和内部域名只影响观感、不影响答题，可以原样保留", "D. 脱敏会改变分布，所以进集前不做脱敏", "E. 记下时间窗、渠道与筛选方式，否则这份分布无法复现，后续漂移也没法解释"], a: [0, 4], e: "进黄金集要脱敏但保真：黑话错别字别改，密钥域名要替换，记录时间窗与筛选方式。答案 A、E。B错误：黑话、错别字、中英混杂正是线上真实分布的样子，洗成通顺书面语等于把考卷改成练习题，测出来的分数不再代表线上。C错误：密钥与内部域名一旦进集就扩大了泄露面，必须替换成虚构占位，不能以「不影响答题」为由保留；D错误：保真与脱敏可以并存，敏感信息必须处理。", t: 5, n: {"A": "进集前做去标识化：姓名、证件号、密钥、内部域名", "B": "黑话、错别字、中英混杂正是线上真实分布的样子，洗成通顺书面语等于把考卷改成练习题，测出来的分数不再代表线上", "C": "密钥与内部域名一旦进集就扩大了泄露面，必须替换成虚构占位，不能以「不影响答题」为由保留", "D": "保真与脱敏可以并存，敏感信息必须处理", "E": "记下时间窗、渠道与筛选方式，否则分布无法复现"}, d: "中" },
  { q: "一份提示分成指令、上下文、示例、待处理输入与输出要求几段，关于它们的排列，正确的有？", o: ["A. 示例排在指令之前，指令容易被当成示例文本被模仿", "B. 输出要求塞在提示中段，比贴在末尾更稳", "C. 整段提示被当成一个序列续写，谁挨着生成点谁的话语权大", "D. 静态规则与动态资料混排即可，模型能自己分清主次", "E. 待处理输入贴近生成点，任务不容易被示例带偏"], a: [0, 2, 4], e: "提示段序按生成点远近：指令/示例在前，待处理输入与输出要求贴末尾；静态与动态别混排。答案 A、C、E。B错误：离生成点越近越不会被读丢，输出要求贴末尾比塞中间稳；D错误：静态规则与动态资料混排会互相稀释，正文口径是别混排。", t: 1, n: {"A": "示例排在指令前面，指令容易被当成示例文本去模仿", "B": "离生成点越近越不会被读丢，输出要求贴末尾比塞中间稳", "C": "整段提示被当成一个序列续写，越靠近生成点话语权越大", "D": "静态规则与动态资料混排会互相稀释，正文口径是别混排", "E": "待处理输入贴近生成点，任务不容易被示例带偏"}, d: "中" },
  { q: "挑选 Few-shot 示例时，符合正文口径的有？", o: ["A. 反例补上形容词说不清的那部分边界", "B. 示例数量越多，任务表现单调提升", "C. 同一类连给十条，模型会自己补齐其它形态", "D. 四个形态差异大的示例，通常胜过八个同分布的示例", "E. 边界样本把决策线写进提示"], a: [0, 3, 4], e: "示例要形态多样、覆盖边界；数量超过覆盖面只加 token 与偏置，同分布堆量只锚一个模式。答案 A、D、E。B错误：示例超出覆盖需要之后主要增加 token 开销和分布偏置；C错误：十条同分布通常只锚定一个模式，换个形态照样靠猜。", t: 1, n: {"A": "反例补上了形容词说不清的那部分边界", "B": "示例超出覆盖需要之后主要增加 token 开销和分布偏置", "C": "十条同分布通常只锚定一个模式，换个形态照样靠猜", "D": "四个形态差异大的示例，通常胜过八个同分布的", "E": "边界样本把决策线直接写进提示"}, d: "中" },
  { q: "关于示例顺序与近因偏置，合理的做法有？", o: ["A. 最像当前输入的示例放在最后一条", "B. 示例顺序随意即可，位置对结果没有可观察的影响", "C. 后面的示例影响更大，这是 In-Context Learning 的位置效应", "D. 位置效应只出现在小模型上，强模型不受距离生成点远近的影响", "E. 多条示例让类别轮换排列，别把同一类固定在末尾"], a: [0, 2, 4], e: "示例有近因效应：最像当前输入的放最后，类别轮换，别把同一类固定在末尾。答案 A、C、E。B错误：近因偏置是真实存在的位置效应，随意排列可能让末条恰好把输出带偏；D错误：这是提示作为序列续写的物理事实，不由模型尺寸豁免。", t: 0, n: {"A": "最像当前输入的示例放最后一条", "B": "近因偏置是真实存在的位置效应，随意排列可能让末条恰好把输出带偏", "C": "后面的示例影响更大，这是位置效应", "D": "这是提示作为序列续写的物理事实，不由模型尺寸豁免", "E": "类别轮换排列，别把同一类固定在末尾"}, d: "中" },
  { q: "情感分类的提示里十条示例有七条标负面，中性文本常被判成负面。关于这个现象，正确的有？", o: ["A. 把七条负面挪到前面可以解决偏斜", "B. 加一句「注意别偏向负面」可以抵消分布带来的影响", "C. 偏斜的来源是示例的标签分布，不是模型没见过中性文本", "D. 这是标签分布偏斜，示例的标签先验盖过了输入本身", "E. 类别配平优先，宁可少给示例也别偏科"], a: [2, 3, 4], e: "示例标签分布会变成先验，七比三会把中性判成负面；配平比提醒有效。答案 C、D、E。A错误：位置只改变近因权重，七比三的统计比例仍在起作用，配平才是治本；B错误：模型抄的是示例里的形状与分布，一句提醒抵不过统计先验。", t: 0, n: {"A": "位置只改变近因权重，七比三的统计比例仍在起作用，配平才是治本", "B": "模型抄的是示例里的形状与分布，一句提醒抵不过统计先验", "C": "偏斜来自示例的标签分布", "D": "示例的标签先验盖过了输入本身", "E": "类别配平优先，宁可少给也别偏科"}, d: "高" },
  { q: "关于「格式靠示例而不是形容词传达」，正确的有？", o: ["A. System Prompt 里写清了格式要求，示例的格式影响可以被它抵消", "B. 想改输出风格，换示例比追加形容词更省力", "C. 「简洁专业别啰嗦」规定的是气质，不是形状", "D. 给一条理想输出，通常比三条风格形容词更能固定格式", "E. 示例里的标点、字段顺序、段落长度都会被模仿"], a: [1, 2, 3, 4], e: "格式靠示例传达：示例离生成点近、会被逐字模仿；形容词只规定气质，不规定形状。答案 B、C、D、E。A 错误：示例离生成点更近，格式打架时通常是示例赢，所以两处要写成一件事。", t: 0, n: {"A": "示例离生成点更近，格式打架时通常是示例赢，所以两处要写成一件事", "B": "想改风格，换示例比追加形容词更省力", "C": "「简洁专业」规定的是气质，不是形状", "D": "一条理想输出比三条形容词更能固定格式", "E": "示例里的标点与字段顺序都会被模仿"}, d: "中" },
  { q: "什么情况下不给示例（Zero-shot）反而更划算？正确的有？", o: ["A. 上下文预算紧张时，示例的机会成本可以忽略", "B. 任务定义清楚、模型本来就会（翻译、抽字段、总结）", "C. 示例会占 token、引入分布偏置，还会锁住答案风格", "D. 任务难时应当先加示例，把标准说清是次要的", "E. 先分清难的是「把标准说清」还是「模型不会做」"], a: [1, 2, 4], e: "zero-shot 更划算的情形：任务定义清楚且模型本来就会，示例只带来 token、偏置与风格锁定。答案 B、C、E。D错误：标准不清要靠指令加验收条款，示例治的是形状不是能力；A错误：示例每轮重复发送，预算越紧这笔开销越显眼。", t: 0, n: {"A": "示例每轮重复发送，预算越紧这笔开销越显眼", "B": "任务清楚、模型本来就会的，示例是负担", "C": "示例占 token、引入偏置，还锁住风格", "D": "标准不清要靠指令加验收条款，示例治的是形状不是能力", "E": "先分清难的是说清标准还是模型不会做"}, d: "中" },
  { q: "示例里的「风格泄漏」可能表现在哪些方面？", o: ["A. 输出长度跟着示例的冗长程度走，与任务要求无关", "B. 示例里带错的事实被当成依据复述出来", "C. 示例给得越多，泄漏的概率越低", "D. 把示例标成 Input 与 Output，泄漏就被杜绝了", "E. 示例中的具体实体名、日期出现在了对新输入的回答里"], a: [0, 1, 4], e: "示例会把表面特征一起带进来：长度、事实、实体名与日期都可能泄漏到新回答。答案 A、B、E。C 错误：可抄的表面特征随示例增多而增多；D 错误：显式标注只划清输入输出边界，内容与语气照抄不误。", t: 0, n: {"A": "输出长度跟着示例的冗长程度走", "B": "示例里带错的事实会被当成依据复述", "C": "可抄的表面特征随示例增多而增多", "D": "显式标注只划清输入输出边界，内容与语气照抄不误", "E": "示例里的实体名与日期会漏进新回答"}, d: "中" },
  { q: "把示例排进提示时，关于输入与输出的边界，正确的有？", o: ["A. 示例与真实待处理输入之间要有明确分隔，免得示例被当成待处理内容", "B. 示例只给输入不给输出，同样能锚定期望形状", "C. 示例的结束方式要与期望输出的结束方式一致，否则模型不知道何时停", "D. 示例的输入与输出要显式标注，边界不能全靠猜", "E. 示例与待处理输入混排能省 token，且不影响结果"], a: [0, 2, 3], e: "示例要划清输入输出边界：分隔、显式标注、结束方式一致，混排会被当成待处理内容。答案 A、C、D。B 错误：没有输出部分的示例只是又一道题，形状无从锚定；E 错误：混排会让模型把示例当成待处理内容。", t: 0, n: {"A": "示例与真实输入之间要有明确分隔", "B": "没有输出部分的示例只是又一道题，形状无从锚定", "C": "示例的结束方式要与期望输出一致", "D": "示例的输入与输出要显式标注", "E": "混排会让模型把示例当成待处理内容"}, d: "中" },
  { q: "关于在提示里使用反例，正确的有？", o: ["A. 给了反例就可以省掉正例", "B. 反例把决策边界写进提示，那是形容词说不清的部分", "C. 反例也要给完整的输入输出对，只标「这个不对」模型学不到该怎么处理", "D. 反例比例过高会把示例集的标签分布带偏", "E. 反例必须排在最前面，模型才学得会拒绝"], a: [1, 2, 3], e: "反例划边界、正例给形状，两者都要给完整输入输出；数量与位置别过头。答案 B、C、D。E错误：位置规则不因反例改变，把拒绝类样本压到末尾反而可能把输出锚在拒绝上；A错误：反例划边界、正例给形状，缺正例就只剩「不能怎样」。", t: 0, n: {"A": "反例划边界、正例给形状，缺正例就只剩「不能怎样」", "B": "反例把决策边界写进提示", "C": "反例也要给完整输入输出对", "D": "反例比例过高会带偏标签分布", "E": "位置规则不因反例改变，把拒绝类样本压到末尾反而可能把输出锚在拒绝上"}, d: "中" },
  { q: "把同一条要求同时写进指令和示例，效果与风险，正确的有？", o: ["A. 指令与示例冲突时，模型通常更信指令", "B. 重复的内容额外占 token，还把风格锁得更死", "C. 指令与示例同时存在时，遵守率会更高", "D. 两者一致时是强化锚定，输出更稳", "E. 两者冲突时模型常跟着示例走，冲突面被放大"], a: [1, 3, 4], e: "指令与示例要一致：一致时是强化锚定，冲突时模型常跟示例走，重复反而放大冲突。答案 B、D、E。C错误：两者不一致时反而互相拆台，重复本身不等于可靠；A错误：冲突时模型常跟着示例走，冲突面被放大。", t: 1, n: {"A": "冲突时模型常跟着示例走，冲突面被放大", "B": "重复内容额外占 token，还把风格锁得更死", "C": "两者不一致时反而互相拆台，重复本身不等于可靠", "D": "两者一致时是强化锚定，输出更稳", "E": "两者冲突时模型常跟着示例走，冲突面被放大"}, d: "中" },
  { q: "关于结构化输出中用枚举（enum）约束 status 字段，下列说法正确的有？", o: ["A. 枚举把字段取值限定在一个预定义的有限集合内", "B. 用了枚举之后，字段里的值就自动真实可信", "C. 取值空间收窄后，下游程序更容易写分支处理逻辑", "D. 枚举只能用于数字字段，不能用于字符串字段", "E. 枚举是 JSON Schema 中常见的一种约束方式"], a: [0, 2, 4], e: "答案 A、C、E。A 正确：枚举的定义就是限定取值的有限集合。C 正确：取值集合小而确定，下游分支才写得全。E 正确：enum 是 JSON Schema 的标准关键字。B 错误：枚举管取值是否合法，不管取值是否属实，内容真实性要靠业务校验。D 错误：枚举同样适用于字符串，status 取 \"ok\"/\"error\" 这类字符串枚举正是典型用法。", t: 0, n: {"A": "枚举=限定取值集合", "B": "枚举不管值是否属实", "C": "取值收窄便于下游分支", "D": "枚举可用于字符串", "E": "JSON Schema 标准关键字"}, d: "低" },
  { q: "关于 JSON Schema 中 required 与可空字段，下列说法正确的有？", o: ["A. required 用于声明哪些字段必须出现在输出里", "B. required 字段可以随意省略而不影响校验", "C. 可空字段需要在 schema 里明确允许 null 取值", "D. required 表示该字段的值必须是字符串类型", "E. 把所有字段都设为 required 是公认的最佳实践"], a: [0, 2], e: "答案 A、C。A 正确：required 的定义就是列出必须出现的字段。C 正确：允许 null 要在类型里显式声明，否则填 null 会被判非法。B 错误：缺了 required 字段就通不过 schema 校验，这正是它的作用。D 错误：required 管字段是否必须出现，与值的类型无关，类型由 type 关键字管。E 错误：required 应只锁真必需的字段，锁太多会逼模型对缺失信息硬填编造。", t: 0, n: {"A": "required=必须出现的字段", "B": "缺 required 字段校验不过", "C": "可空要显式允许 null", "D": "类型由 type 管", "E": "只锁真必需字段"}, d: "低" },
  { q: "关于 LLM-as-judge（模型裁判），下列说法正确的有？", o: ["A. LLM-as-judge 指用另一个模型按评分标准给输出打分或做比较", "B. LLM-as-judge 适合大规模粗筛，关键结论仍需人工评测校准", "C. LLM-as-judge 指用人类标注员逐条打分", "D. LLM-as-judge 指用编译器检查代码能否运行", "E. LLM-as-judge 指用规则引擎逐条匹配关键词"], a: [0, 1], e: "答案 A、B。A 正确：模型裁判就是让一个 LLM 依据评分标准给输出打分或两两比较。B 正确：它的定位是低成本大规模评测，重要结论要用人评校准。C 错误：人工逐条打分是人工评测，不是模型裁判。D 错误：编译器检查是执行式验证。E 错误：规则匹配关键词不是让模型当裁判。", t: 0, n: {"A": "模型按标准打分/比较", "B": "粗筛为主，人评校准", "C": "那是人工评测", "D": "那是执行式验证", "E": "那是规则匹配"}, d: "低" },
  { q: "基座模型与对话模型的区别是什么？", o: ["A. 基座的知识一定更少", "B. 基座只会续写，对话模型经过指令微调，会按格式回答", "C. 对话模型不能生成文本", "D. 两者只是名字不同", "E. 基座模型完全不能生成连贯文本"], a: [1], e: "单选。答案 B。A 错误：知识主要在预训练阶段注入，基座并不更少；C 错误：对话模型正是用来生成回答的；D 错误：对话微调改变了调用方式与行为；E 错误：基座能续写，只是不按对话格式回答。B：预训练给知识，后训练教怎么用。", t: 1, n: {"A": "知识主要在预训练阶段注入，基座并不更少。", "B": "预训练给知识，后训练教怎么用。", "C": "对话模型正是用来生成回答的。", "D": "对话微调改变了调用方式与行为。", "E": "基座能续写，只是不按对话格式回答。"}, d: "低" },
  { q: "结构化输出校验失败后，重试策略合理的有？", o: ["A. 回灌报错时要提防外部数据里的文本被当成指令执行", "B. 重试次数越多，最终通过率单调上升", "C. 把校验器的报错原样喂回模型，比原样重试更有效", "D. 同提示同温度原样重试，大概率复现同一个错", "E. 重试时降低 Temperature，必要时只重生成失败的字段"], a: [0, 2, 3, 4], e: "校验失败要回灌具体错误、降温、必要时逐字段重生成；原样重试会复现同一个错，加次数无用。答案 A、C、D、E。B错误：失败多来自结构或理解问题，在同一坑里反复采样没有用，连着几次仍失败就该改 schema 或换策略。", t: 12, n: {"A": "回灌报错时，外部文本可能被当成指令执行", "B": "失败多来自结构或理解问题，在同一坑里反复采样没有用，连着几次仍失败就该改 schema 或换策略", "C": "把校验器的报错喂回去，比原样重试有效", "D": "同参数同温度重试，大概率复现同一个错", "E": "降温度，必要时只重生失败的那几个字段"}, d: "中" },
  { q: "模型产出的函数调用参数出现幻觉，典型表现包括？", o: ["A. 参数类型合法，值却来自上下文里不存在的实体", "B. 开启函数调用之后参数值就可靠了，只需校验字段是否齐备", "C. 「缺信息就留空并说明」这类提示条款能部分抑制参数幻觉", "D. 编造并不存在的 ID、路径或枚举值，把参数填满", "E. 把 schema 里根本没有的参数名也一并传出去"], a: [0, 2, 3, 4], e: "函数调用只保证参数结构，不保证值真实：实体、ID、路径、枚举都可能被编出来。答案 A、C、D、E。B 错误：约束解码只保证语法合法与字段齐备，值真不真不在它管辖范围。", t: 4, n: {"A": "类型合法，值却来自上下文里不存在的实体", "B": "约束解码只保证语法合法与字段齐备，值真不真不在它管辖范围", "C": "「缺信息就留空」能部分抑制参数幻觉", "D": "编造不存在的 ID、路径或枚举值", "E": "连 schema 里没有的参数名也传出去"}, d: "中" },
  { q: "token 是什么？", o: ["A. 一个汉字固定等于一个 token", "B. 一个英文单词固定等于一个 token", "C. 模型处理文本的最小单位，可能是一个字、词的一部分或几个字节", "D. 一个字节固定等于一个 token", "E. 一个 token 固定等于四个字符"], a: [2], e: "单选。答案 C。A 错误：中文常见一两个 token，生僻字会被拆碎；B 错误：常用词常是一个 token，但不是固定规律；D 错误：一个 token 可能由多个字节合并而成；E 错误：token 与字符没有固定换算。C：token 是切分单位，不等于字符数。", t: 1, n: {"A": "中文常见一两个 token，生僻字会被拆碎。", "B": "常用词常是一个 token，但不是固定规律。", "C": "token 是切分单位，不等于字符数。", "D": "一个 token 可能由多个字节合并而成。", "E": "token 与字符没有固定换算。"}, d: "低" },
  { q: "BPE 分词的核心做法是什么？", o: ["A. 从字符或字节出发，反复合并出现频率最高的相邻对", "B. 依赖外部词典逐词查询", "C. 按语法树递归切分", "D. 只按空格和标点切分", "E. 把整段文本直接映射成一个向量"], a: [0], e: "单选。答案 A。B 错误：BPE 的合并表训练时统计好，运行时查表；C 错误：BPE 只看频率，不理解语法；D 错误：那会把词和子词结构丢掉；E 错误：那是嵌入，不是分词。A：BPE 是纯频率合并，不理解语义。", t: 1, n: {"A": "BPE 是纯频率合并，不理解语义。", "B": "BPE 的合并表训练时统计好，运行时查表。", "C": "BPE 只看频率，不理解语法。", "D": "那会把词和子词结构丢掉。", "E": "那是嵌入，不是分词。"}, d: "低" },
  { q: "关于 schema 与提示的配合，合理的说法有？", o: ["A. schema 已经写对，提示里的取值口径可由校验兜住", "B. null、空字符串、字段缺失三种空值语义要在提示里区分，否则会混用", "C. 字段描述写得含糊，模型会按自己的理解补全字段语义", "D. 字段名本身就是提示，evidence 比 info 更能诱导模型给出证据", "E. 输出格式要求贴近生成点末尾，比埋在提示中段稳"], a: [1, 2, 3, 4], e: "schema 与提示各管一半：类型靠 schema，空值语义、字段含义与格式位置靠提示。答案 B、C、D、E。A 错误：schema 管类型与枚举，业务口径和缺信息怎么办仍要靠提示说明。", t: 1, n: {"A": "schema 管类型与枚举，业务口径和缺信息怎么办仍要靠提示说明", "B": "null、空串、字段缺失三种语义要在提示里分清", "C": "字段描述含糊，模型会按自己的理解补全语义", "D": "字段名本身就是提示，evidence 比 info 更能诱导给出证据", "E": "输出格式贴末尾，比埋在提示中段稳"}, d: "中" },
  { q: "一份两万 token 的提示里既有硬约束又有关键资料，位置怎么安排更稳？正确的有？", o: ["A. 把中段的关键资料加粗强调，读取稳定性就上来了", "B. 硬约束放最前，关键资料放末尾", "C. 首段与末段召回最好、中段最弱，呈 U 形", "D. 开头有格式上的先天优势，结尾紧邻生成点", "E. 按资料收集的先后顺序摊开即可，位置不影响读取"], a: [1, 2, 3], e: "长提示里硬约束放最前、关键资料放末尾；中段召回最弱，加粗不解决问题。答案 B、C、D。E错误：正文口径是关键两页夹在开头和结尾，别按收资料的先后摊开；A错误：中间丢失是注意力层面的稀释，与排版标记无关。", t: 13, n: {"A": "中间丢失是注意力层面的稀释，与排版标记无关", "B": "硬约束放最前，关键资料放末尾", "C": "首尾召回最好、中段最弱，呈 U 形", "D": "开头有格式优势，结尾紧邻生成点", "E": "正文口径是关键两页夹在开头和结尾，别按收资料的先后摊开"}, d: "高" },
  { q: "为了让提示前缀缓存多吃到命中，提示内部该怎么排？正确的有？", o: ["A. 开头塞一个时间戳或会话 ID，会让整段前缀每次重算", "B. 工具列表顺序随机排一下没关系，不影响命中", "C. 顺序稳定才能复用重复部分，命中的 token 通常按折扣价计费", "D. 把不变的挪到最前并保持逐字节不变，收益大于删几百字修辞", "E. 系统提示、项目规范、工具 schema 这类逐字节一致的内容放最前"], a: [0, 2, 3, 4], e: "前缀缓存只认逐字节一致的前缀：静态内容放最前，时间戳与会话 ID 往后放。答案 A、C、D、E。B 错误：命中靠的是前缀完全一致，顺序一变一致性就没了。", t: 6, n: {"A": "开头塞时间戳或会话 ID，整段前缀每次都要重算", "B": "命中靠的是前缀完全一致，顺序一变一致性就没了", "C": "顺序稳定才能复用，命中的 token 按折扣价计", "D": "不变的挪到最前并保证逐字节一致", "E": "系统提示、规范、工具 schema 放最前"}, d: "高" },
  { q: "半静态层（本轮检索片段）在提示里怎么排，合理的有？", o: ["A. 片段给得越多答案越准，二十个半相关通常强过三个强相关", "B. 资料到一定规模，先回到检索而不是继续加长", "C. 编号写进提示后，出处字段才能被程序化核对", "D. 每个片段带编号与出处，让模型能引用而不是靠位置猜", "E. 片段顺序固定，有助于复用重复部分"], a: [1, 2, 3, 4], e: "检索片段要带编号出处、顺序稳定，资料多时先回检索而不是继续加长。答案 B、C、D、E。A 错误：塞二十个半相关片段，往往比只给三个强相关的更容易答错。", t: 2, n: {"A": "塞二十个半相关片段，往往比只给三个强相关的更容易答错", "B": "资料多到一定规模，先回检索而不是加长提示", "C": "编号写进提示，出处字段才能被程序化核对", "D": "每条带编号与出处，模型能引用而不是靠位置猜", "E": "片段顺序固定，有助于复用重复部分"}, d: "高" },
  { q: "一份三万 token 的提示，调用没有任何报错，答案质量却明显比三千 token 时差，最合理的解释是？", o: ["A. Temperature 太高，采样随机性压过了长度的影响", "B. 超出窗口被截断，属于读不完", "C. 注意力稀释：读了但读不准，质量随长度下滑", "D. 缓存没命中，导致同一个提示给出不同答案", "E. 把温度调低，三千 token 时的质量就回来了"], a: [2], e: "单选。不报错但质量随长度下滑，是注意力稀释；截断会表现为结尾缺失或结构不闭合。答案 C。A 错误：温度只改变随机性，与长度带来的单调变差没有因果；B 错误：超出窗口是读不完，会表现为结尾缺失或结构不闭合；D 错误：缓存命中影响的是时延与计费口径，解释不了质量随长度的稳定退化；E 错误：这是注意力稀释，与采样随机性无关。", t: 1, n: {"A": "温度只改变随机性，与长度带来的单调变差没有因果", "B": "超出窗口是读不完，会表现为结尾缺失或结构不闭合", "C": "不报错、质量随长度下滑是注意力稀释的特征", "D": "缓存命中影响的是时延与计费口径，解释不了质量随长度的稳定退化", "E": "这是注意力稀释，与采样随机性无关"}, d: "高" },
  { q: "多轮会话里用摘要替换旧轮次，正确的做法与代价有？", o: ["A. 压缩有损，要留下能回捞原文的引用", "B. 摘要丢掉的关键约定，后续每一轮都看不见它", "C. 窗口够大时摘要可以省掉，长度本身不影响答案质量", "D. 工具输出可以截断，保留路径与关键行即可", "E. 摘要只留事实与决定，把寒暄和重复的中间过程换掉"], a: [0, 1, 3, 4], e: "摘要替换旧轮次要保留回捞路径：它是有损压缩，丢掉的常是路径、版本号与报错原文。答案 A、B、D、E。C 错误：窗口够大不等于读得准，注意力稀释让质量随长度下滑。", t: 13, n: {"A": "压缩有损，要留下能回捞原文的引用", "B": "摘要丢掉的约定，后面每一轮都看不见", "C": "窗口够大不等于读得准，注意力稀释让质量随长度下滑", "D": "工具输出可截断，保留路径与关键行", "E": "只留事实与决定，把寒暄与重复过程换掉"}, d: "中" },
  { q: "长上下文导致的退化有两种，正确的说法有？", o: ["A. 注意力稀释是读了但读不准，不报错，质量随长度下滑", "B. 这两种退化会通过接口报错暴露出来", "C. 日志里没有错误，就证明提示长度是安全的", "D. 判断是不是只是截断，可以看结尾是否完整、结构是否闭合", "E. 超出窗口是读不完，会被截断，看得见"], a: [0, 3, 4], e: "长上下文退化有两种：超出窗口会被截断且看得见，注意力稀释不报错但读不准。答案 A、D、E。B 错误：稀释不报错；C 错误：无错误只排除了读不完这一类，读不准恰恰是静默的。", t: 6, n: {"A": "注意力稀释是读了但读不准，不报错", "B": "稀释不报错", "C": "无错误只排除了读不完这一类，读不准恰恰是静默的", "D": "判断是不是截断，看结尾是否完整、结构是否闭合", "E": "超出窗口是读不完，会被截断，看得见"}, d: "中" },
  { q: "工具 schema 是每轮的固定开销，合理的处理有？", o: ["A. 工具描述写长一点对预算没影响，反正不进对话", "B. 常驻内容要精选，逐字节一致才能同时省预算又保住缓存命中", "C. 工具数量涨上去之后，膨胀的只是提示前缀，回答质量不受影响", "D. 注册的工具越多，每轮重复发送的 token 越多", "E. 能按需注入的工具就别常驻，这正是常驻规范与按需技能分层的理由"], a: [1, 3, 4], e: "工具 schema 每轮进上下文：能按需注入就别常驻，常驻部分要逐字节稳定。答案 B、D、E。A错误：工具描述就是 schema 文本，每轮都要算 token；C错误：前缀膨胀一边挤占任务预算、一边稀释注意力，两头都会坏。", t: 1, n: {"A": "工具描述就是 schema 文本，每轮都要算 token", "B": "常驻内容要精选，且逐字节一致才能同时省预算又保缓存", "C": "前缀膨胀一边挤占任务预算、一边稀释注意力，两头都会坏", "D": "注册的工具越多，每轮重复发送的 token 越多", "E": "能按需注入的就别常驻，这正是分层的目的"}, d: "中" },
  { q: "要瘦身一份越来越长的系统提示，合理的做法有？", o: ["A. 不常驻的规范移到按需层，而不是全塞在系统提示里", "B. 条款越多越安全，冗余不会干扰判断", "C. 删完要重跑回归，确认原来不是靠冗余条款兜底", "D. 末尾的输出要求与出处格式要保留，它们贴着生成点起作用", "E. 先删重复的形容词式要求，保留可执行的约束与验收条款"], a: [0, 2, 3, 4], e: "提示瘦身先删重复的形容词，保留可执行约束与验收条款；删完要跑回归。答案 A、C、D、E。B 错误：冗余既占预算又稀释注意力，越多并不越安全。", t: 1, n: {"A": "不常驻的规范移到按需层，不要全塞进系统提示", "B": "冗余既占预算又稀释注意力，越多并不越安全", "C": "删完要重跑回归，确认原先不是靠冗余条款兜底", "D": "末尾的输出要求与出处格式要保留，它们贴着生成点起作用", "E": "先删形容词式要求，保留可执行的约束与验收条款"}, d: "中" },
  { q: "关于会话内提示逐轮增长的后果，合理的有？", o: ["A. 早期达成的约定越到后面越容易被读丢", "B. 历史增长只增加费用，不影响答案质量", "C. 按需注入工具与技能能压住每轮的固定开销", "D. 摘要替换旧轮次同时改善预算占用与中段稀释", "E. 每轮把全量历史重发一次，累计 token 随轮数按平方量级增长"], a: [0, 2, 3, 4], e: "会话逐轮增长会同时推高成本与稀释注意力；按需注入工具、摘要旧轮次都能压。答案 A、C、D、E。B 错误：长度上升还带来注意力稀释，费用只是其中一头。", t: 13, n: {"A": "早期约定越到后面越容易被读丢", "B": "长度上升还带来注意力稀释，费用只是其中一头", "C": "按需注入工具能压住每轮固定开销", "D": "摘要替换旧轮次同时改善预算与中段稀释", "E": "每轮重发全量历史，累计 token 按平方量级涨"}, d: "中" },
  { q: "把提示当作资产做版本管理，合理的做法有？", o: ["A. 线上紧急时在控制台热改提示，不留记录也可以接受", "B. 示例集与 schema 要一起版本化，否则回滚不完整", "C. 每次改动记一句动机与验收结论，便于事后归因", "D. 提示进版本库，与代码一起提 PR，可 diff、可回滚", "E. 提示版本号要能与它所用的模型版本、数据集版本对上"], a: [1, 2, 3, 4], e: "提示是资产：进版本库、可 diff、可回滚，示例与 schema 一起版本化。答案 B、C、D、E。A 错误：无痕热改让故障无法归因，回滚也找不到目标状态，事后至少要补记录与评审。", t: 0, n: {"A": "无痕热改让故障无法归因，回滚也找不到目标状态，事后至少要补记录与评审", "B": "示例集与 schema 要一起版本化", "C": "每次改动记一句动机与验收结论", "D": "提示进版本库，与代码一起提 PR", "E": "提示版本号要与模型、数据集版本对上"}, d: "中" },
  { q: "提示改动也要跑离线回归，合理的说法有？", o: ["A. 只看一条样例变好了就上，容易按下葫芦浮起瓢", "B. 提示只是文本，像代码那样安排测试的必要性不高", "C. 回归集全绿说明线上风险很低，灰度指标的参考价值有限", "D. 一段提示常被多个任务共用，改动会牵动其它任务", "E. 提示改动在一两条样例上验证通过就可以上线"], a: [0, 3], e: "提示改动要像代码一样回归：作用面广、失败静默、多任务共用，离线绿也要看线上。答案 A、D。B错误：文本改动的作用面和代码一样广，而且失败是静默的；C错误：离线回归覆盖不到真实分布与多轮组合，线上指标仍要看；E错误：一段提示常被多个任务共用，要看回归集。", t: 4, n: {"A": "只看一条变好就上，容易按下葫芦浮起瓢", "B": "文本改动的作用面和代码一样广，而且失败是静默的", "C": "离线回归覆盖不到真实分布与多轮组合，线上指标仍要看", "D": "一段提示常被多个任务共用，改动会外溢", "E": "一段提示常被多个任务共用，要看回归集"}, d: "中" },
  { q: "提示与模型版本耦合，合理的说法有？", o: ["A. 针对旧模型弱点写的补丁，在新模型上可能只剩噪声", "B. 提示没变时，换模型不需要重新评测", "C. 效果好坏是提示与模型的联合结果，两个版本要成对记录", "D. 换模型后原提示的遵守率可能变化，提示不是与模型无关的常量", "E. 模型升级要把提示一起纳入回归，而不是只测模型"], a: [0, 2, 3, 4], e: "提示与模型是联合体：换模型要重跑回归，旧补丁可能只剩噪声。答案 A、C、D、E。B 错误：真正被测的是提示与模型的组合，模型一换结论就可能翻。", t: 0, n: {"A": "针对旧模型弱点的补丁，在新模型上可能只剩噪声", "B": "真正被测的是提示与模型的组合，模型一换结论就可能翻", "C": "效果是提示与模型的联合结果", "D": "换模型后遵守率会变，提示不是与模型无关的常量", "E": "模型升级要把提示一起纳入回归"}, d: "中" },
  { q: "提示文件本身也是攻击面，把它当作可被篡改的代码来管，合理的管控有？", o: ["A. 运行时有权限控制，提示内容被改就不影响安全边界", "B. 提示文件要有 owner 与变更审批，改动走评审", "C. 第三方模板引入前要审读里面有没有改变行为的指令", "D. 构建时对提示模板与 AGENTS.md 做来源与完整性校验，与依赖锁定一个思路", "E. 提示被篡改属于误操作，改回来即可，走安全事件流程的收益有限"], a: [1, 2, 3], e: "提示文件是行为的一部分：评审、owner、完整性校验、按安全事件处理。答案 B、C、D。E错误：提示被篡改等于行为被篡改，应按事件处理并回滚；A错误：权限控制不能只靠提示词，但提示是执行链的一环，被改会改变模型对指令与数据的判别。", t: 0, n: {"A": "权限控制不能只靠提示词，但提示是执行链的一环，被改会改变模型对指令与数据的判别", "B": "提示文件要有 owner 与变更审批", "C": "第三方模板引入前要审读有没有改变行为的指令", "D": "构建时对模板与 AGENTS.md 做来源与完整性校验", "E": "提示被篡改等于行为被篡改，应按事件处理并回滚"}, d: "中" },
  { q: "什么时候该改检索或数据，而不是继续改提示？正确的有？", o: ["A. 线上指标下滑时，第一反应应当是多加几条提示条款", "B. 错误来自资料没召回或召回错，改提示措辞通常无效", "C. 模型缺领域知识时该补数据或上检索，而不是加形容词", "D. 输出格式不稳定时，优先调 schema 与示例，不必动知识库", "E. 先定位失败发生在哪一层，再决定动检索、schema 还是提示"], a: [1, 2, 3, 4], e: "先定位失败在哪一层：检索召回错就改检索，格式不稳就改 schema，缺知识就补数据。答案 B、C、D、E。A 错误：提示条款不是万能旋钮，没定位到失败层就加条款，只会把提示越写越长。", t: 2, n: {"A": "提示条款不是万能旋钮，没定位到失败层就加条款，只会把提示越写越长", "B": "资料没召回或召回错，改提示措辞通常无效", "C": "模型缺领域知识就补数据或上检索", "D": "格式不稳先调 schema 与示例", "E": "先定位失败发生在哪一层，再决定动哪里"}, d: "中" },
  { q: "怀疑问题不在提示措辞时，合理的验证手段有？", o: ["A. 把长提示分段裁剪做对照，定位到底哪一段在起作用", "B. 多改几版措辞轮流上线，总能撞出好的那一版", "C. 看失败样本是否集中在某个输入分布，而不是整体退化", "D. 比较前先固定采样参数，否则差异可能来自解码随机性", "E. 用另一个更强的模型跑同一提示，区分提示问题与模型能力问题"], a: [0, 2, 3, 4], e: "怀疑提示时要做对照：分段裁剪、固定采样参数、按输入分布看失败、换模型区分能力。答案 A、C、D、E。B 错误：不受控的措辞搜索既慢又无法归因，改完也说不清是哪一处起了作用。", t: 4, n: {"A": "把长提示分段裁剪做对照，定位是哪一段在起作用", "B": "不受控的措辞搜索既慢又无法归因，改完也说不清是哪一处起了作用", "C": "看失败是否集中在某个输入分布", "D": "比较前先固定采样参数", "E": "换更强的模型跑同一提示，区分提示与能力"}, d: "中" },
  { q: "提示与评测集一起演化，正确的有？", o: ["A. 提示改动记录与评测集版本一起存，能复盘哪次改动引入了问题", "B. 线上坏 case 要回流成回归集条目，否则同类错误反复出现", "C. 提示里每加一条新规则，最好配一个能判定的例子", "D. 评测集定稿之后不能再改，否则历史分数不可比", "E. 加新条目时保留旧的基线子集，分数才能跨版本对齐"], a: [0, 1, 2, 4], e: "提示与评测集一起演化：改动留痕、坏 case 回流、新规则配可判定例子、保留基线子集。答案 A、B、C、E。D 错误：评测集要随业务增长，保持可比的办法是固定基线子集，而不是禁止新增。", t: 4, n: {"A": "提示改动与评测集版本一起存", "B": "线上坏 case 回流成回归条目", "C": "每条新规则配一个可判定的例子", "D": "评测集要随业务增长，保持可比的办法是固定基线子集，而不是禁止新增", "E": "保留旧基线子集，分数才能跨版本对齐"}, d: "中" },
  { q: "直接注入与间接注入的区别是什么？", o: ["A. 攻击者直接输入，还是通过文档、邮件或工具返回值带入", "B. 中文攻击还是英文攻击", "C. 训练阶段还是推理阶段", "D. 图像攻击还是语音攻击", "E. 攻击者有没有使用工具"], a: [0], e: "单选。答案 A。B 错误：语言不是区分标准；C 错误：两者都发生在推理输入侧；D 错误：媒介不是本质区别；E 错误：是否使用工具不是直接与间接的分界。A：间接注入的入口在模型替你读回来的内容里。", t: 5, n: {"A": "间接注入的入口在模型替你读回来的内容里。", "B": "语言不是区分标准。", "C": "两者都发生在推理输入侧。", "D": "媒介不是本质区别。", "E": "是否使用工具不是直接与间接的分界。"}, d: "低" },
  { q: "同样内容的中文通常比英文更费 token，主要原因是什么？", o: ["A. 一个汉字常占多个 UTF-8 字节，合并后同样内容仍常比英文多花 token", "B. 中文语法比英文复杂，所以更费 token", "C. 模型会先把中文翻译成英文再处理，多出一层开销", "D. 中文没有词表，只能逐字编码", "E. 中文的 Unicode 码位比英文更短"], a: [0], e: "单选。答案 A。B 错误：语法复杂度不决定编码效率；C 错误：模型直接编码中文 token，没有内部翻译步骤，费不费 token 由分词器的切分决定；D 错误：现代模型都有覆盖中文的词表；E 错误：汉字通常占更多字节，不是更短。A：中文按字节切分，UTF-8 下常是三个字节一个字。", t: 1, n: {"A": "中文按字节切分，UTF-8 下常是三个字节一个字。", "B": "语法复杂度不决定编码效率。", "C": "模型直接编码中文 token，没有内部翻译步骤，费不费 token 由分词器的切分决定。", "D": "现代模型都有覆盖中文的词表。", "E": "汉字通常占更多字节，不是更短。"}, d: "低" },
  { q: "MCP 是什么？", o: ["A. 给工具与上下文定统一接口的协议", "B. 一种模型网络结构", "C. 一种权重量化方法", "D. 一种评测基准", "E. 一种模型压缩格式"], a: [0], e: "单选。答案 A。B 错误：架构是 Transformer 等，不是 MCP；C 错误：量化是数值精度问题；D 错误：MCP 不用于打分；E 错误：压缩格式是 GGUF、safetensors 一类。A：MCP 让工具接入有统一协议，但注册进来不等于可信。", t: 3, n: {"A": "MCP 让工具接入有统一协议，但注册进来不等于可信。", "B": "架构是 Transformer 等，不是 MCP。", "C": "量化是数值精度问题。", "D": "MCP 不用于打分。", "E": "压缩格式是 GGUF、safetensors 一类。"}, d: "低" },
  { q: "前十轮单轮看都无害，一轮一步把边界往外推。关于多轮渐进诱导，正确的有？", o: ["A. 因为摘要压缩会掉字，所以摘要里没出现敏感词就等于安全", "B. 违规发生在最后一句，所以只对最后一句做判定即可", "C. 风险不在单个轮次的字面违规，而在允许范围被逐步外推", "D. 有效缓解是每轮独立做一次安全判定，不继承前轮的放行结论", "E. 只看第一轮或只看整段对话累计摘要，正是正文点名的无效缓解"], a: [2, 3, 4], e: "多轮渐进诱导的风险在趋势而非单句；每轮独立判定、带累积意图，摘要与首轮审都不行。答案 C、D、E。A错误：摘要把逐步试探压成一段正常对话，掉掉的恰好是那句往外挪一点的措辞，这是摘要做安全判定的失效方式。B错误：最后一句往往字面无害（继续刚才那个话题再说一点点），拦它要看的是趋势而非末句。", t: 13, n: {"A": "摘要把逐步试探压成一段正常对话，掉掉的恰好是那句往外挪一点的措辞，这是摘要做安全判定的失效方式", "B": "最后一句往往字面无害（继续刚才那个话题再说一点点），拦它要看的是趋势而非末句", "C": "风险不在单轮字面违规，而在允许范围被逐步外推", "D": "每轮独立做安全判定，不继承前轮放行", "E": "只看第一轮或只看累计摘要，正是无效缓解"}, d: "高" },
  { q: "越狱（jailbreak）指什么？", o: ["A. 破解模型权重文件", "B. 删除训练数据", "C. 提高推理速度", "D. 让模型回答得更长", "E. 用话术绕开模型的拒答与安全边界"], a: [4], e: "单选。答案 E。A 错误：那是权重窃取或逆向；B 错误：那是数据破坏；C 错误：越狱不提升性能；D 错误：长度与越狱无关。E：越狱是把模型推到训练分布之外，不是破解密码。", t: 5, n: {"A": "那是权重窃取或逆向。", "B": "那是数据破坏。", "C": "越狱不提升性能。", "D": "长度与越狱无关。", "E": "越狱是把模型推到训练分布之外，不是破解密码。"}, d: "低" },
  { q: "在系统提示词里写一句绝不允许把数据发到外部地址，为什么不算防御？正确的有？", o: ["A. 真正止血的写法是这个外发工具根本没注册，或收件人不在白名单里，模型想调也没有入口", "B. 这句话和攻击语在同一条 token 流里竞争权重，模型可以被骗到不遵守它", "C. 写进提示词改变的是概率，写进运行时改变的才是可能", "D. 把这句话从 user 移到 system 位置，就变成硬约束", "E. 同一条规则重复三遍并加粗，就等价于工具白名单"], a: [0, 1, 2], e: "提示词是概率约束，写进运行时才是硬约束；白名单与工具注册才挡得住外发。答案 A、B、C。D错误：位置只影响优先级与权重，不改变它可以被说服这个本质，正文把提示词层面的承诺归为概率修正。E错误：措辞强度与重复次数仍是概率修正，只要还存在一句能顶过去的话术，保证就不成立；白名单是结构性的，没有注册就没有调用入口。", t: 1, n: {"A": "真正止血的是工具根本没注册，或收件人不在白名单", "B": "这句提示和攻击语在同一条 token 流里竞争权重", "C": "写进提示词改的是概率，写进运行时改的才是可能", "D": "位置只影响优先级与权重，不改变它可以被说服这个本质，正文把提示词层面的承诺归为概率修正", "E": "措辞强度与重复次数仍是概率修正，只要还存在一句能顶过去的话术，保证就不成立；白名单是结构性的，没有注册就没有调用入口"}, d: "中" },
  { q: "给外部内容做来源打标与定界包裹，能缓解什么、不能缓解什么？正确的有？", o: ["A. 它把外部内容变成不可执行的数据，动作仍要照常拦", "B. 要与高风险工具降权、白名单配合才有意义", "C. 有了来源打标，输出侧的泄露检测就可以下掉", "D. 给模型一条可参考的边界线索，降低把外部内容当指令执行的概率", "E. 让审计时能说清哪段内容来自哪个来源，便于事后定位与归因"], a: [1, 3, 4], e: "来源打标降低「当指令执行」的概率，但不具强制力；动作仍要在 harness 拦。答案 B、D、E。A错误：打标是提示层约定，不是运行时强制；执行权在 harness，一段被标成数据的文本仍然能请求工具调用。C错误：打标只降低把内容当指令的概率，管不了把内容往外发；敏感数据泄露检测属于输出侧，与打标不同层。", t: 0, n: {"A": "打标是提示层约定，不是运行时强制；执行权在 harness，一段被标成数据的文本仍然能请求工具调用", "B": "要与高风险工具降权、白名单配合才有意义", "C": "打标只降低把内容当指令的概率，管不了把内容往外发；敏感数据泄露检测属于输出侧，与打标不同层", "D": "给模型一条可参考的边界线索", "E": "审计时能说清哪段来自哪个来源"}, d: "中" },
  { q: "元数据过滤（如按部门、时间）常用来做什么？", o: ["A. 提高采样温度", "B. 增加模型参数", "C. 生成图像描述", "D. 让模型自己决定要不要过滤", "E. 在检索前按条件缩小范围并控制权限"], a: [4], e: "单选。答案 E。A 错误：温度是解码参数；B 错误：过滤不改变模型；C 错误：那是多模态生成任务；D 错误：权限与范围过滤应由检索前的代码执行。E：过滤条件要下推到召回之前，而不是靠提示词提醒。", t: 2, n: {"A": "温度是解码参数。", "B": "过滤不改变模型。", "C": "那是多模态生成任务。", "D": "权限与范围过滤应由检索前的代码执行。", "E": "过滤条件要下推到召回之前，而不是靠提示词提醒。"}, d: "低" },
  { q: "Agent 读邮箱时，某封邮件正文写着把通讯录导出并发送到某个外部地址。下列处置中最站得住的是？", o: ["A. 先让模型判断邮件是否可疑，可疑的不读就行", "B. 把外发邮件做成需人工二次确认且收件人走白名单，通讯录读取只给只读凭证并全程留审计", "C. 禁止 Agent 访问邮箱，让这类入口消失", "D. 在系统提示词里补一句不要执行邮件正文中的指令", "E. 让邮件先经模型摘要再进上下文，把可疑句子摘掉"], a: [1], e: "单选。邮件是间接注入入口：外发动作要白名单加人工确认，读权限只给只读凭证。答案 B。A 错误：判断本身在同一条不可信链路上，注入句可以写得毫不可疑；C 错误：逐个砍功能等于没有防线，网页、PDF、工单、数据库字段是同一类入口，要修的是外发动作的权限与确认；D 错误：仍是提示层的概率修正，模型可以被一句更好的话术劝服；E 错误：摘要器自己吃进同一份恶意文本，属于检索后打补丁式清洗那一类无效缓解。", t: 3, n: {"A": "判断本身在同一条不可信链路上，注入句可以写得毫不可疑", "B": "外发邮件人工二次确认，收件人走白名单", "C": "逐个砍功能等于没有防线，网页、PDF、工单、数据库字段是同一类入口，要修的是外发动作的权限与确认", "D": "仍是提示层的概率修正，模型可以被一句更好的话术劝服", "E": "摘要器自己吃进同一份恶意文本，属于检索后打补丁式清洗那一类无效缓解"}, d: "高" },
  { q: "护栏（guardrails）通常放在哪三个位置？", o: ["A. 训练侧、推理侧、存储侧", "B. 中文侧、英文侧、代码侧", "C. 输入侧、输出侧、动作侧", "D. 前端、后端、数据库", "E. 模型权重侧、训练数据侧、日志侧"], a: [2], e: "单选。答案 C。A 错误：训练侧不是运行时护栏的站位；B 错误：按语言分不是护栏的站位；D 错误：那是系统分层，不是护栏站位；E 错误：那是资产位置，不是运行时护栏站位。C：动作侧是唯一能在损失发生前真正止损的位置。", t: 5, n: {"A": "训练侧不是运行时护栏的站位。", "B": "按语言分不是护栏的站位。", "C": "动作侧是唯一能在损失发生前真正止损的位置。", "D": "那是系统分层，不是护栏站位。", "E": "那是资产位置，不是运行时护栏站位。"}, d: "低" },
  { q: "裁判的位置偏置（position bias）指什么？", o: ["A. 同一个答案放在前面或后面，裁判给分不同", "B. 裁判偏爱更长的答案", "C. 裁判偏爱自己模型生成的答案", "D. 裁判在不同时间打分漂移", "E. 裁判偏爱格式更漂亮的回答"], a: [0], e: "单选。答案 A。B 错误：那是长度偏置；C 错误：那是自偏好；D 错误：那是分数漂移；E 错误：那是格式或语气偏置。A：成对比较时要交换顺序各评一次，抵消位置影响。", t: 0, n: {"A": "成对比较时要交换顺序各评一次，抵消位置影响。", "B": "那是长度偏置。", "C": "那是自偏好。", "D": "那是分数漂移。", "E": "那是格式或语气偏置。"}, d: "低" },
  { q: "关于护栏在输入侧、输出侧、动作侧三个站位，正确的有？", o: ["A. 输出侧常见检查包括毒性合规分类、JSON Schema 结构化校验、系统提示词与敏感数据泄露检测", "B. 输入侧拦得越严，输出侧与动作侧就越可以简化", "C. 用小模型给大模型守门已是标配，调用成本与主模型差一个数量级", "D. 动作侧拦在工具调用参数落地之前，是唯一能真正止血的防线", "E. 生成错了可以重说，转账发出去收不回来，这是动作侧优先的理由"], a: [0, 2, 3, 4], e: "三层各管一类风险：输入挡改写、输出把质量、动作侧在参数落地前止血；不能互相替代。答案 A、C、D、E。B错误：三层各管一类风险，入口拦不住的改写与越权要靠动作侧白名单，把入口收紧只是把误杀率抬上去，换不来后两层可以下岗。", t: 5, n: {"A": "输出侧查毒性、schema、提示词与敏感数据泄露", "B": "三层各管一类风险，入口拦不住的改写与越权要靠动作侧白名单，把入口收紧只是把误杀率抬上去，换不来后两层可以下岗", "C": "小模型守门，成本与主模型差一个数量级", "D": "动作侧拦在参数落地之前，是唯一能真正止血的", "E": "生成错了能重说，转账发出去收不回来"}, d: "中" },
  { q: "裁判的长度偏置指什么？", o: ["A. 裁判倾向给更长的回答更高分", "B. 裁判只看回答开头", "C. 裁判不检查输出格式", "D. 裁判只评中文回答", "E. 裁判偏爱自己训练数据里的答案"], a: [0], e: "单选。答案 A。B 错误：那是截断或注意力问题；C 错误：那是格式遵从问题；D 错误：那是语言覆盖问题；E 错误：那是自偏好或数据偏置，不是长度。A：长度偏置会让模型学会写长而不写对。", t: 0, n: {"A": "长度偏置会让模型学会写长而不写对。", "B": "那是截断或注意力问题。", "C": "那是格式遵从问题。", "D": "那是语言覆盖问题。", "E": "那是自偏好或数据偏置，不是长度。"}, d: "低" },
  { q: "为什么在系统提示词里写「不要泄露」不算强防御？", o: ["A. 提示词只是概率约束，可以被绕过", "B. 提示词会被自动加密", "C. 提示词不占 token", "D. 模型看不见系统提示词", "E. 提示词写在代码里就会自动生效"], a: [0], e: "单选。答案 A。B 错误：提示词通常以明文进入上下文；C 错误：系统提示同样计费；D 错误：系统提示就在上下文里；E 错误：写在哪里不改变它只是概率约束。A：强制力要放在模型之外，提示词只能降低概率。", t: 5, n: {"A": "强制力要放在模型之外，提示词只能降低概率。", "B": "提示词通常以明文进入上下文。", "C": "系统提示同样计费。", "D": "系统提示就在上下文里。", "E": "写在哪里不改变它只是概率约束。"}, d: "中" },
  { q: "关于最小权限与工具白名单，正确的有？", o: ["A. 参数范围写进注册信息之后，模型给出的参数即合规", "B. 默认拒绝、逐个注册、并约束参数范围", "C. 工具在白名单里时，它的参数可以直接信任模型给的值", "D. 只给只读凭证与短时令牌：查询工具不许写，写账号不许删", "E. 白名单拦得住越权调用，拦不住合法工具被诱导滥用"], a: [1, 3, 4], e: "白名单挡越权调用，挡不住合法工具被诱导滥用；参数级范围、分级与确认仍要有。答案 B、D、E。C错误：合法工具被诱导滥用正是白名单的盲区，收件人地址、金额、目标路径这些字段还要在参数级再过一遍。A错误：注册信息约束的是可选范围与校验规则，模型仍能在规则内挑出最坏的合法值（比如合法域名下别人的邮箱），所以后面还要有分级与确认。", t: 0, n: {"A": "注册信息约束的是可选范围与校验规则，模型仍能在规则内挑出最坏的合法值（比如合法域名下别人的邮箱），所以后面还要有分级与确认", "B": "默认拒绝、逐个注册，并约束参数范围", "C": "合法工具被诱导滥用正是白名单的盲区，收件人地址、金额、目标路径这些字段还要在参数级再过一遍", "D": "只给只读凭证与短时令牌", "E": "白名单拦得住越权，拦不住合法工具被诱导滥用"}, d: "中" },
  { q: "不可逆操作的二次确认，下列做法符合工程要求的是？", o: ["A. 工具调用都弹窗确认，一步不漏", "B. 把确认弹窗做成是/否两个按钮就满足要求", "C. 只读查询也要人审，因为查询同样可能泄露数据", "D. 弹一句 AI 准备给你发送邮件，是否继续，由用户点确认", "E. 确认界面展示实际参数（收件人地址、金额、目标路径），而不是模型的转述"], a: [4], e: "单选。二次确认要展示真实参数，只设在不可逆、高代价、低置信的动作前；按钮形式不解决问题。答案 E。A 错误：确认点放多了流程瘫痪，审批疲劳会把确认变成橡皮图章，等于没有；B 错误：关键在展示真实参数，按钮形式不解决转述问题；C 错误：只读泄露靠权限过滤、字段脱敏与访问审计处理，不该挤占人审预算；人审位置留给不可逆、高代价、低置信三类动作；D 错误：正文要求展示实际参数而不是 AI 转述，转述环节本身就可被污染。", t: 0, n: {"A": "确认点放多了流程瘫痪，审批疲劳会把确认变成橡皮图章，等于没有", "B": "关键在展示真实参数，按钮形式不解决转述问题", "C": "只读泄露靠权限过滤、字段脱敏与访问审计处理，不该挤占人审预算；人审位置留给不可逆、高代价、低置信三类动作", "D": "正文要求展示实际参数而不是 AI 转述，转述环节本身就可被污染", "E": "确认界面要展示实际参数，而不是模型的转述"}, d: "高" },
  { q: "AI 生成代码为什么仍需人工评审？", o: ["A. 模型生成的代码无法编译运行", "B. 人工评审主要是为了统一缩进与命名风格", "C. 评审可以替代测试", "D. 模型生成速度太慢", "E. 测试覆盖不到权限、并发与安全等问题"], a: [4], e: "单选。答案 E。A 错误：生成的代码通常能编译运行，风险在逻辑、权限与安全边界；B 错误：风格问题交给 lint 工具即可，不是 AI 代码必须人工评审的核心原因；C 错误：评审与测试互补，不能互相替代；D 错误：评审解决正确性与边界，不是速度。E：测试绿不等于逻辑对，更不等于权限与边界对。", t: 14, n: {"A": "生成的代码通常能编译运行，风险在逻辑、权限与安全边界。", "B": "风格问题交给 lint 工具即可，不是 AI 代码必须人工评审的核心原因。", "C": "评审与测试互补，不能互相替代。", "D": "评审解决正确性与边界，不是速度。", "E": "测试绿不等于逻辑对，更不等于权限与边界对。"}, d: "中" },
  { q: "给一个可能失控的 Agent 设预算与速率熔断，正确的有？", o: ["A. 重试风暴会撞上供应方速率限制，熔断与退避要一起设计", "B. 把上限设到接近配额或上下文上限，以免误伤正常任务", "C. 失控 Agent 的账单按分钟累积，所以超限即停并告警", "D. 迭代次数、token 花费、API 调用量要分开设上限，三者不成正比", "E. 熔断线设好之后，失控循环就不会发生"], a: [0, 2, 3], e: "预算与熔断是止损：迭代、token、调用量分开设限，熔断不防发生，根因靠终止条件。答案 A、C、D。E错误：熔断是止损手段，不阻止循环发生，它做的是在损失继续扩大前掐断并告警，根因还要靠终止条件设计解决。B错误：贴着配额设上限等于没有熔断——真失控时正好把额度吃光，还会挤掉同一账号或同一租户下的正常流量。", t: 3, n: {"A": "熔断与退避要一起设计", "B": "贴着配额设上限等于没有熔断——真失控时正好把额度吃光，还会挤掉同一账号或同一租户下的正常流量", "C": "失控 Agent 的账单按分钟涨，超限即停并告警", "D": "迭代次数、token、调用量三个上限分开设", "E": "熔断是止损手段，不阻止循环发生，它做的是在损失继续扩大前掐断并告警，根因还要靠终止条件设计解决"}, d: "中" },
  { q: "PII 指什么？", o: ["A. 公开的公司年报", "B. 可识别到具体个人的信息", "C. 模型的参数", "D. 脱敏后无法重识别的聚合统计", "E. 用户自己公开的昵称"], a: [1], e: "单选。答案 B。A 错误：公司年报是法人公开信息，定位不到个人；C 错误：模型参数是权重，不是个人信息；D 错误：无法重识别的聚合统计已匿名化，不再是 PII；E 错误：昵称是否属于 PII 要看可识别性，它是具体例子而不是定义。B：判据是可识别性，能直接或间接定位到个人。", t: 5, n: {"A": "公司年报定位不到个人。", "B": "判据是可识别性。", "C": "模型参数不是个人信息。", "D": "无法重识别的聚合统计已匿名化。", "E": "昵称要看可识别性，是例子不是定义。"}, d: "低" },
  { q: "关于 PII（个人可识别信息）的三种形态，下列说法正确的有？", o: ["A. 直接标识符（手机号、邮箱、银行卡号）单个字段就能定位到具体人", "B. 准标识符（区县、出生日期、科室）组合起来足以重标识到个人", "C. 由行为推断出的敏感标签（健康、婚育状况）不算个人信息", "D. 不含姓名与身份证号的文本不算含 PII", "E. PII 的判据是可识别性，而不是有没有出现姓名"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：直接标识符的定义就是单字段可定位到人。B 正确：准标识符单个不显眼，组合可重标识，这是它的定义特征。E 正确：判据是可识别性，姓名不是必要条件。C 错误：推断出的健康、婚育等敏感标签同样属于个人信息，且往往更敏感。D 错误：区县加出生日期加科室这类组合就能定位到人，不含姓名照样可能是 PII。", t: 5, n: {"A": "直接标识符单字段定位", "B": "准标识符组合可重标识", "C": "推断标签也是个人信息", "D": "无姓名也可能是 PII", "E": "判据是可识别性"}, d: "低" },
  { q: "最小权限原则在 Agent 里指什么？", o: ["A. 给所有权限方便调试", "B. 只给管理员权限", "C. 权限越少模型越聪明", "D. 给模型更长的系统提示", "E. 只给完成任务所必需的权限"], a: [4], e: "单选。答案 E。A 错误：调试权限不应带到生产；B 错误：那是最小权限的反面；C 错误：权限与模型智力无关；D 错误：提示长度不替代权限控制。E：权限按任务裁剪，写操作与读操作分开。", t: 5, n: {"A": "调试权限不应带到生产。", "B": "那是最小权限的反面。", "C": "权限与模型智力无关。", "D": "提示长度不替代权限控制。", "E": "权限按任务裁剪，写操作与读操作分开。"}, d: "低" },
  { q: "开源许可证里的 NonCommercial 条款意味着什么？", o: ["A. 可以随意商用", "B. 只能用于训练，不能推理", "C. 只限制研究，不限制商用", "D. 条款只约束模型下载，不约束推理服务收费", "E. 不能直接用于商业用途"], a: [4], e: "单选。答案 E。A 错误：NC 正是排除商用；B 错误：条款约束的是用途，不是阶段；C 错误：说反了；D 错误：NC 约束的是用途，包括推理服务收费。E：商用前要把许可证逐条读完，不能只看「开源」两个字。", t: 7, n: {"A": "NC 正是排除商用。", "B": "条款约束的是用途，不是阶段。", "C": "说反了。", "D": "NC 约束的是用途，包括推理服务收费。", "E": "商用前要把许可证逐条读完，不能只看「开源」两个字。"}, d: "低" },
  { q: "按正文的出域判据，下列哪种情形算数据出域？", o: ["A. 调用第三方 API 后，服务方能从流水里还原出系统提示词与检索文档，因此它实际持有这些数据", "B. 内容经过 DLP 网关处理过，出域深度的审批压力随之下降", "C. 只有把数据库整表交给供应商才算，发文本不算", "D. 提示词只是模型输入不是用户数据，不进 DLP 范围", "E. 只是文本、不含数据库记录，所以最多算敏感信息外发，不算出域"], a: [0], e: "单选。出域看的是服务方能否从流水还原内容，不是机房在谁家、是不是文本。答案 A。B 错误：网关只是执行环节，哪类数据、能到什么深度、由谁审批这张表仍然要先定，否则脱敏范围靠现场判断；C 错误：判据看的是能否还原，不是有没有搬库；一次调用就带走了提示词与文档；D 错误：系统提示词里写着业务逻辑，本身就是商业秘密，正文把提示词与补全列为需要出域前脱敏的敏感形态；E 错误：不因只是文本而减轻，批量按权限检索等于批量复制。", t: 5, n: {"A": "服务方能从流水还原出提示词与文档，就等于持有这些数据", "B": "网关只是执行环节，哪类数据、能到什么深度、由谁审批这张表仍然要先定，否则脱敏范围靠现场判断", "C": "判据看的是能否还原，不是有没有搬库；一次调用就带走了提示词与文档", "D": "系统提示词里写着业务逻辑，本身就是商业秘密，正文把提示词与补全列为需要出域前脱敏的敏感形态", "E": "不因只是文本而减轻，批量按权限检索等于批量复制"}, d: "低" },
  { q: "幻觉的准确定义是什么？", o: ["A. 输出里出现语法错误", "B. 说得像真的，但与客观事实或给定材料不符", "C. 请求超过服务超时时间", "D. 模型拒绝回答敏感问题", "E. 模型输出与参考答案措辞不同"], a: [1], e: "单选。答案 B。A 错误：语法错误是语言能力问题，不是幻觉；C 错误：超时是服务故障，不是幻觉；D 错误：拒答是安全行为，不是幻觉；E 错误：措辞不同不等于幻觉，关键在事实与材料。B：幻觉的关键是「像真的但不对」，不是所有错误都算。", t: 0, n: {"A": "语法错误是语言能力问题，不是幻觉。", "B": "幻觉的关键是「像真的但不对」，不是所有错误都算。", "C": "超时是服务故障，不是幻觉。", "D": "拒答是安全行为，不是幻觉。", "E": "措辞不同不等于幻觉，关键在事实与材料。"}, d: "低" },
  { q: "用户提出删除其全部数据的请求，落到工程上意味着什么？正确的有？", o: ["A. 下一轮重训的清单要能复核，否则删除承诺无法验证", "B. 训练语料与历史备份归别的团队管，不在删除流程范围内", "C. 模型输出里不再出现那条信息，删除动作就算完成", "D. 要能在训练集里定位到具体样本，并留下剔除记录", "E. 向监管提交一句已完成删除的声明，追溯样本的要求可以放宽"], a: [0, 3], e: "删除权要能定位样本、留剔除记录；权重层证明拿不到，已分发副本要受控。答案 A、D。C错误：抑制输出倾向不等于删除完成，正文把它列为做得到的那半边，做得到的部分还得靠留痕交付。E错误：拿不出可追溯的剔除记录，承诺就只是声明，因为权重层面的证明本来就拿不到。B错误：管不到已分发副本、衍生缓存与历史备份是能力边界，不是裁剪范围的理由；副本受控分发、退役有销毁记录正是为了把这几处纳进流程。", t: 0, n: {"A": "下一轮重训的清单要能复核", "B": "管不到已分发副本、衍生缓存与历史备份是能力边界，不是裁剪范围的理由；副本受控分发、退役有销毁记录正是为了把这几处纳进流程", "C": "抑制输出倾向不等于删除完成，正文把它列为做得到的那半边，做得到的部分还得靠留痕交付", "D": "要能在训练集里定位样本并留下剔除记录", "E": "拿不出可追溯的剔除记录，承诺就只是声明，因为权重层面的证明本来就拿不到"}, d: "高" },
  { q: "事实性幻觉与忠实性幻觉的区别是什么？", o: ["A. 事实性对中文，忠实性对英文", "B. 事实性发生在训练，忠实性发生在推理", "C. 两者是同一个概念", "D. 事实性对世界，忠实性对本次给定的材料", "E. 事实性发生在推理，忠实性发生在训练"], a: [3], e: "单选。答案 D。A 错误：语言不是区分标准；B 错误：两者都可能在推理输出里出现；C 错误：一个对世界，一个对材料，成因与治法不同；E 错误：两者都发生在推理输出侧。D：先分清对世界还是对材料，才能选对修法。", t: 0, n: {"A": "语言不是区分标准。", "B": "两者都可能在推理输出里出现。", "C": "一个对世界，一个对材料，成因与治法不同。", "D": "先分清对世界还是对材料，才能选对修法。", "E": "两者都发生在推理输出侧。"}, d: "低" },
  { q: "关于第三方权重的采购纪律与验证步骤（格式之外的部分），正确的有？", o: ["A. 来自知名托管平台的权重可以省掉同源对比与触发测试", "B. 核对校验和与签名、加载前扫一遍异常序列化内容，属于采购纪律", "C. 换格式只是缩小攻击面，格式安全的权重照样能藏行为后门", "D. 校验和与签名对得上，就说明这套权重没有行为后门", "E. 下载模型就是安装软件：先查来路是原作者组织，还是来路不明的搬运"], a: [1, 2, 4], e: "第三方权重按软件供应链审：来源、签名、同源对比、触发测试；校验和不证明无后门。答案 B、C、E。D错误：校验和与签名证明的是没被改动，不证明原作者诚实，更证明不了行为层面有没有后门。A错误：平台声誉不是验证手段，正文列的验法全是体力活——同源对比、触发测试、自建探针，一步都不能靠名声代替。", t: 7, n: {"A": "平台声誉不是验证手段，正文列的验法全是体力活——同源对比、触发测试、自建探针，一步都不能靠名声代替", "B": "核对校验和与签名，加载前扫异常序列化内容", "C": "换格式只缩小攻击面，格式安全的权重也能藏后门", "D": "校验和与签名证明的是没被改动，不证明原作者诚实，更证明不了行为层面有没有后门", "E": "先查来路是不是原作者组织"}, d: "中" },
  { q: "把数据集也当供应链标的来审，正确的有？", o: ["A. 授权有上游声明，可除名留痕属于过度工程", "B. 最终评测分数没掉，追查投毒的收益有限", "C. 来源、授权、可除名留痕三件事都要审", "D. 训练集投毒与语料投毒是一回事的两端", "E. 入库检查包含抽样人工复核"], a: [2, 3, 4], e: "数据集也是供应链：来源、授权、可除名留痕、抽样复核；分数不是投毒检测器。答案 C、D、E。B错误：投毒往往不体现在总分上，标签翻转与定向样本能在不伤整体指标的前提下改掉某类行为，所以分数不是投毒检测器。A错误：不能除名就意味着后续的删除请求与授权撤回没有杠杆，正文把可除名留痕列为入库检查项之一。", t: 5, n: {"A": "不能除名就意味着后续的删除请求与授权撤回没有杠杆，正文把可除名留痕列为入库检查项之一", "B": "投毒往往不体现在总分上，标签翻转与定向样本能在不伤整体指标的前提下改掉某类行为，所以分数不是投毒检测器", "C": "来源、授权、可除名留痕都要审", "D": "训练集投毒与语料投毒是同一件事的两端", "E": "入库检查包含抽样人工复核"}, d: "中" },
  { q: "给 AI 执行环境设权限的合理做法是什么？", o: ["A. 默认管理员权限", "B. 默认拒绝、按需授权、读写分离、网络白名单", "C. 关闭日志", "D. 允许访问所有文件", "E. 给 AI 一个共享管理员账号"], a: [1], e: "单选。答案 B。A 错误：那等于不设防；C 错误：没有日志就无法追溯；D 错误：权限应最小化；E 错误：共享账号无法审计，也违背最小权限。B：沙箱限范围，但限不住合法工具被诱导滥用。", t: 14, n: {"A": "那等于不设防。", "B": "沙箱限范围，但限不住合法工具被诱导滥用。", "C": "没有日志就无法追溯。", "D": "权限应最小化。", "E": "共享账号无法审计，也违背最小权限。"}, d: "低" },
  { q: "引用幻觉指什么？", o: ["A. 引用格式不统一", "B. 引用数量太少", "C. 参考文献排版错误", "D. 引用编号不是从 1 开始", "E. 标了出处，但出处并不支持该说法"], a: [4], e: "单选。答案 E。A 错误：格式问题不等于内容不支持；B 错误：数量少不是引用幻觉；C 错误：排版是格式问题；D 错误：编号顺序是格式问题，不是引用幻觉。E：有引用不等于可信，要逐条核对支持关系。", t: 0, n: {"A": "格式问题不等于内容不支持。", "B": "数量少不是引用幻觉。", "C": "排版是格式问题。", "D": "编号顺序是格式问题，不是引用幻觉。", "E": "有引用不等于可信，要逐条核对支持关系。"}, d: "低" },
  { q: "线上换掉第三方 embedding 模型后，靠相似度阈值判风险的那条链路会发生什么？正确的有？", o: ["A. 索引全量重建之后阈值保持原值即可，两者互不相干", "B. 索引要全量重建、阈值要在新分布上重校准，缺一步这条链路就不可用", "C. 相似度数值整体变小，说明新模型更差", "D. 向量空间整体漂移，旧库向量与新查询向量混检，相似度不是读错，是没法读", "E. 新旧向量各占一半时，原来那条阈值既不能说偏高也不能说偏低，判风险等于蒙眼"], a: [1, 3, 4], e: "换 embedding 等于换坐标系：索引全量重建、阈值在新分布重校准，缺一不可。答案 B、D、E。C错误：数值变化是坐标系换了，不是质量掉了；拿旧尺子读新空间才会得出这种结论。A错误：重建索引解决的是可比性，阈值是在新分布上重新取点，两件事一起做完链路才恢复。", t: 0, n: {"A": "重建索引解决的是可比性，阈值是在新分布上重新取点，两件事一起做完链路才恢复", "B": "索引要全量重建、阈值要在新分布上重校准", "C": "数值变化是坐标系换了，不是质量掉了；拿旧尺子读新空间才会得出这种结论", "D": "空间整体漂移，新旧向量混检时相似度没法读", "E": "新旧各占一半时，原阈值既不能说高也不能说低"}, d: "高" },
  { q: "扩大词表通常会带来什么？", o: ["A. 上下文窗口会一起变大", "B. 模型的参数量会随之变小", "C. 常见片段更可能整体成为一个 token，序列变短", "D. 模型准确率会随之更高", "E. 词表越大，上下文窗口越小"], a: [2], e: "单选。答案 C。A 错误：窗口由位置与显存预算决定，与词表无关；B 错误：词表变大会让嵌入与输出层更大，参数量只增不减；D 错误：词表只是切分方式，不是能力本身；E 错误：词表与上下文窗口无关。C：词表覆盖越好，常见内容越省 token。", t: 1, n: {"A": "窗口由位置与显存预算决定，与词表无关。", "B": "词表变大会让嵌入与输出层更大，参数量只增不减。", "C": "词表覆盖越好，常见内容越省 token。", "D": "词表只是切分方式，不是能力本身。", "E": "词表与上下文窗口无关。"}, d: "低" },
  { q: "一套开源权重号称通过了全部公开安全基准，团队准备接进生产。按正文口径，最该补的是？", o: ["A. 把温度调低，并在系统提示词里加一句行为约束", "B. 什么都不用补，公开基准全过就是安全证明", "C. 补做触发词对比与同源权重比对，锁版本后重跑红队回归并重新校准护栏阈值", "D. 换成只存张量而不存序列化对象的权重格式即可", "E. 通过危险题集之后，同源比对、红队回归等其余验证可以省掉"], a: [2], e: "单选。公开安全基准不等于安全证明：要补触发词对比、同源权重比对、红队回归与阈值重校准。答案 C。A 错误：温度与提示词都属于概率修正，既发现不了后门也证明不了没有后门；正文给的入库流程是先验货、再校准，两步不能合并成试一试；B 错误：基准分数高不能当安全证明，触发词型后门在常规评测里完全隐形；正文的口径是危险题集必须过，只过高分题集不算数；D 错误：换格式只是缩小攻击面，格式安全的权重照样能藏行为后门；E 错误：危险题集只是其中一关，还需要同源比对、触发词测试、红队回归与阈值重校准。", t: 15, n: {"A": "温度与提示词都属于概率修正，既发现不了后门也证明不了没有后门；正文给的入库流程是先验货、再校准，两步不能合并成试一试", "B": "基准分数高不能当安全证明，触发词型后门在常规评测里完全隐形；正文的口径是危险题集必须过，只过高分题集不算数", "C": "补做触发词对比与同源权重比对，锁版本后重跑红队回归", "D": "换格式只是缩小攻击面，格式安全的权重照样能藏行为后门", "E": "危险题集只是其中一关，还需要同源比对、触发词测试、红队回归与阈值重校准"}, d: "高" },
  { q: "下列哪种做法最能直接减少模型编造事实？", o: ["A. 把 temperature 调到最大", "B. 让回答尽量长", "C. 删除系统提示词", "D. 接入 RAG，并要求回答引用检索到的原文", "E. 把检索结果全部删掉，让模型自由发挥"], a: [3], e: "单选。答案 D。A 错误：温度越高随机性越强，不会减少编造；B 错误：长回答不会自动变正确；C 错误：去掉约束通常让行为更不稳定；E 错误：删材料只会增加编造。D：给材料并强制引用，是把「凭记忆」换成「照材料说」。", t: 0, n: {"A": "温度越高随机性越强，不会减少编造。", "B": "长回答不会自动变正确。", "C": "去掉约束通常让行为更不稳定。", "D": "给材料并强制引用，是把「凭记忆」换成「照材料说」。", "E": "删材料只会增加编造。"}, d: "低" },
  { q: "「允许模型回答不知道」为什么能缓解幻觉？", o: ["A. 让模型参数变多", "B. 减少输出 token", "C. 提高采样温度", "D. 让模型在不确定时给一个最可能的猜测", "E. 降低模型强行编造的压力"], a: [4], e: "单选。答案 E。A 错误：参数量与是否允许说不知道无关；B 错误：这只影响成本，不解决编造动机；C 错误：提高温度会增加随机性；D 错误：这正是强行编造，不是缓解。E：给模型一个体面的出口，它就不必用编造填满答案。", t: 0, n: {"A": "参数量与是否允许说不知道无关。", "B": "这只影响成本，不解决编造动机。", "C": "提高温度会增加随机性。", "D": "这正是强行编造，不是缓解。", "E": "给模型一个体面的出口，它就不必用编造填满答案。"}, d: "低" },
  { q: "KV Cache 的显存占用随什么增长？", o: ["A. 只随模型文件大小增长", "B. 只随磁盘容量增长", "C. 只随用户总数增长", "D. 随上下文长度与并发数增长", "E. 只随 batch size 增长"], a: [3], e: "单选。答案 D。A 错误：权重是另一笔账；B 错误：磁盘与显存是两回事；C 错误：用户总数不等于同时在飞的并发；E 错误：batch 通过并发影响 KV，但不是唯一变量。D：长上下文与高并发下，KV 常先于权重撞墙。", t: 6, n: {"A": "权重是另一笔账。", "B": "磁盘与显存是两回事。", "C": "用户总数不等于同时在飞的并发。", "D": "长上下文与高并发下，KV 常先于权重撞墙。", "E": "batch 通过并发影响 KV，但不是唯一变量。"}, d: "低" },
  { q: "把 temperature 调低，能保证事实正确吗？", o: ["A. 能，温度为零就不会出错", "B. 不能，它只降低随机性，不保证事实正确", "C. 能，温度为零等于查数据库", "D. 只对中文提问有效", "E. 能，只要把 top-p 也调到最小"], a: [1], e: "单选。答案 B。A 错误：温度为零只是 greedy，仍可能错；C 错误：模型没有检索动作，不是数据库；D 错误：温度是全局采样参数，不分语言；E 错误：top-p 与温度都只控制随机性。B：温度管的是「怎么选」，不管「知不知道」。", t: 0, n: {"A": "温度为零只是 greedy，仍可能错。", "B": "温度管的是「怎么选」，不管「知不知道」。", "C": "模型没有检索动作，不是数据库。", "D": "温度是全局采样参数，不分语言。", "E": "top-p 与温度都只控制随机性。"}, d: "低" },
  { q: "贪心解码是什么？", o: ["A. 每一步取概率最高的 token", "B. 每一步随机抽一个 token", "C. 每一步取概率最低的 token", "D. 每一步取两个 token 平均", "E. 每一步保留多条候选路径"], a: [0], e: "单选。答案 A。B 错误：那是采样；C 错误：那会选出最不可能的字符；D 错误：token 不能这样平均；E 错误：那是 beam search。A：贪心稳定但长文本容易重复。", t: 11, n: {"A": "贪心稳定但长文本容易重复。", "B": "那是采样。", "C": "那会选出最不可能的字符。", "D": "token 不能这样平均。", "E": "那是 beam search。"}, d: "低" },
  { q: "continuous batching 相对原生 batching 改的是什么？正确的有？", o: ["A. 短请求提前结束也只占着卡空转，这是原生批处理的浪费", "B. 原生是整批进出：攒满一批一起跑，要等最长那条生成完才能换人", "C. 它让每条请求的 KV 不再需要占用显存", "D. 改成请求级：某条序列吐出结束符就立刻出批", "E. 新请求要等当前整批全部跑完才有机会补位"], a: [0, 1, 3], e: "continuous batching 把整批进出改成请求级进出（调度粒度细到每个生成步，文献里也称迭代级调度），提高利用率但制造碎片；KV 不会因此消失。答案 A、B、D。C 错误：KV 照旧要存，改的只是进出批的粒度，并不减 KV 这笔账；E 错误：那正是原生整批做法的描述，continuous batching 让新请求在下一个调度点就补位。B 与 A 是它要解决的两个症状（整批等待、空占位置），D 是它的机制，而这个机制同时也是显存碎片的来源。", t: 12, n: {"A": "原生批处理里短请求结束后仍占着卡空转", "B": "原生是整批进出：攒满一批一起跑，要等最长那条", "C": "KV 照旧要存，改的只是进出批的粒度，并不减 KV 这笔账", "D": "改成请求级：吐结束符就立刻出批", "E": "那正是原生整批做法的描述，continuous batching 让新请求在下一个调度点就补位。"}, d: "中" },
  { q: "前缀缓存要保住命中，拼 prompt 的工程做法有哪些？（命中条件本身不在此重考）", o: ["A. 把时间戳放在系统提示之前，让缓存内容更“新鲜”", "B. 多轮对话只在尾部追加，别重排历史", "C. 静态系统提示、工具定义、少样本示例放最前面", "D. 会变的用户内容、时间戳、随机 ID 都往后放，别插在中间", "E. 命中部分按原价计费，折扣只作用于输出 token"], a: [1, 2, 3], e: "前缀缓存要求逐字节一致：静态内容在前、可变内容在后、历史只在尾部追加。答案 B、C、D。E错误：命中部分按折扣价计费，具体折扣各家不同，别拿别家的数字套；A错误：时间戳放前面会让第一个 token 就变化，从它起全部重算，等于把整段静态前缀全废掉。C、D、B 是同一条原则的三个应用：会变的东西越靠后、历史只在尾部追加，能被复用的前缀就越长。", t: 6, n: {"A": "时间戳放前面会让第一个 token 就变化，从它起全部重算，等于把整段静态前缀全废掉。", "B": "多轮对话只在尾部追加，不重排历史", "C": "静态系统提示、工具定义、少样本放最前", "D": "会变的内容一律往后放", "E": "命中部分按折扣价计费，具体折扣各家不同，别拿别家的数字套"}, d: "中" },
  { q: "batching 的主要收益与代价是什么？", o: ["A. 提升吞吐，但可能增加排队与单请求延迟", "B. 降低吞吐也降低延迟", "C. 会改变每个请求的输出内容", "D. 会让显存占用减半", "E. 会让模型参数量翻倍"], a: [0], e: "单选。答案 A。B 错误：批处理通常不是这个方向；C 错误：调度不改变采样结果；D 错误：batch 越大，KV 占用通常越高；E 错误：batching 不改变模型权重。A：batching 是用延迟换吞吐，不是白拿。", t: 6, n: {"A": "batching 是用延迟换吞吐，不是白拿。", "B": "批处理通常不是这个方向。", "C": "调度不改变采样结果。", "D": "batch 越大，KV 占用通常越高。", "E": "batching 不改变模型权重。"}, d: "低" },
  { q: "重试为什么可能放大故障？", o: ["A. 重试能绕过服务端的限流配额", "B. 重试会让后续请求自动走缓存", "C. 重试会提高精度", "D. 失败请求反复打到已经过载的服务上", "E. 重试会自动切换到备用机房"], a: [3], e: "单选。答案 D。A 错误：重试同样消耗配额，高频重试反而触发更严的限流；B 错误：重试是重新发起完整请求，不会自动命中缓存；C 错误：重试只重复请求；E 错误：重试不会自动换机房，除非路由策略显式配置。D：重试要有上限、退避与幂等保护。", t: 12, n: {"A": "重试同样消耗配额，高频重试反而触发更严的限流。", "B": "重试是重新发起完整请求，不会自动命中缓存。", "C": "重试只重复请求。", "D": "重试要有上限、退避与幂等保护。", "E": "重试不会自动换机房，除非路由策略显式配置。"}, d: "低" },
  { q: "投机解码的收益边界在哪里？正确的有？", o: ["A. 草稿被拒只是那几个 token 白算，不会多花别的时间", "B. 并发越高收益越大，因为草稿可以并行验证", "C. 批开大后算力已接近饱和，草稿那部分不再是免费的算力，高并发场景收益明显缩水", "D. 它被列为压低单次调用成本的手段，但别指望在满载机器上白拿", "E. 收益全看接受率：代码、模板、翻译这类可预测任务接受率高"], a: [2, 3, 4], e: "收益看接受率与是否满载：可预测任务接受率高，高并发算力饱和时草稿不再免费。答案 C、D、E。A错误：草稿被拒就得重来，起草和验证两笔都花了，正文原话是反而多花了起草和验证；B错误：说反了，批开大以后算力不再富余，收益缩水而不是更大。E 是收益的第一决定因素（任务可预测性决定接受率，创造性写作就低），C 是它与 batching 的冲突，D 是它的定位：压单次成本的手段，前提是不满载。", t: 12, n: {"A": "草稿被拒就得重来，起草和验证两笔都花了，正文原话是反而多花了起草和验证", "B": "说反了，批开大以后算力不再富余，收益缩水而不是更大。", "C": "批开大后算力接近饱和，草稿不再是免费的算力", "D": "它是压低单次成本的手段，但满载机器上别指望白拿", "E": "收益全看接受率，代码、模板、翻译这类可预测任务高"}, d: "中" },
  { q: "关于峰谷比与“按峰值配卡”，正确的有？", o: ["A. 峰谷比只影响用户体验，不影响单 token 成本", "B. 超出容量时的处理顺序应当是写死的、能演练的", "C. 日内波动 3 倍以上时，自建集群一天里大部分时间在闲置", "D. 把卡买够之后，峰谷闲置会被摊平，利用率指标的参考价值有限", "E. 按峰值配卡是最贵的一种保守"], a: [1, 2, 4], e: "峰谷比决定自建的分母：波谷闲置推高单 token 成本；按峰值配卡最贵，超出容量靠预案。答案 B、C、E。D错误：卡买得越多，分子（月度总成本）变大而分母不变，闲置只会更贵，利用率恰恰是自建的三条判据之一；A错误：峰谷比决定的是分母——实际处理的有效 token 数，波谷闲置会把自建的单 token 成本抬高，它从来不只是体验问题。C 是量级判断，E 是结论，B 是同一节的另一半：容量不够时靠预案，不靠当场拍脑袋。", t: 0, n: {"A": "峰谷比决定的是分母——实际处理的有效 token 数，波谷闲置会把自建的单 token 成本抬高，它从来不只是体验问题。", "B": "超出容量时的处理顺序要写死并能演练", "C": "日内波动 3 倍以上时，自建一天里大半时间闲置", "D": "卡买得越多，分子（月度总成本）变大而分母不变，闲置只会更贵，利用率恰恰是自建的三条判据之一", "E": "按峰值配卡是最贵的保守"}, d: "中" },
  { q: "容量不够时的降级预案，符合正文口径的有？", o: ["A. 再往后是分级路由切小模型、关闭思考档位或压低 max_tokens、只回缓存/兜底答案", "B. 最后两条降档要提前在评测里确认质量底线，别到故障当天才发现没测过", "C. 超出容量时先限流、别让请求进队列", "D. 限流要返回明确返回码加 Retry-After，别让客户无限重试", "E. 客户重试不消耗我方容量，让它们自己重试就好"], a: [0, 1, 3], e: "降级顺序：排队带超时→限流→切小模型→压档位→回缓存；顺序要写死、可演练。答案 A、B、D。C错误：正文的顺序是排队在前（带超时，超时就落到限流），不是先限流、把排队跳过去；E错误：重试本身就在烧你的卡，无限重试会把容量问题放大成雪崩，所以才要明确返回码加 Retry-After。D 是限流那一级的写法，A 是后面几级，B 是对降档质量的预演要求——这套顺序得能演练，别到故障当天现编。", t: 6, n: {"A": "再往后是分级路由、关思考档、只回缓存或兜底", "B": "降档的质量底线要提前在评测里确认", "C": "正文的顺序是排队在前（带超时，超时就落到限流），不是先限流、把排队跳过去", "D": "限流返回明确返回码加 Retry-After", "E": "重试本身就在烧你的卡，无限重试会把容量问题放大成雪崩，所以才要明确返回码加 Retry-After。"}, d: "中" },
  { q: "买 API 与私有化部署的主要取舍是什么？", o: ["A. API 一定更贵", "B. 私有化一定更准", "C. API 省运维但数据出域，私有化可控但交付运维成本高", "D. 两者没有区别", "E. 私有化部署不需要运维"], a: [2], e: "单选。答案 C。A 错误：规模与利用率不同，结论会变；B 错误：部署形态不决定模型能力；D 错误：数据边界与运维责任差别很大；E 错误：私有化把运维责任接了过来。C：选型要同时算钱、算数据边界、算谁来运维。", t: 7, n: {"A": "规模与利用率不同，结论会变。", "B": "部署形态不决定模型能力。", "C": "选型要同时算钱、算数据边界、算谁来运维。", "D": "数据边界与运维责任差别很大。", "E": "私有化把运维责任接了过来。"}, d: "低" },
  { q: "离线评测与在线实验的区别是什么？", o: ["A. 离线用 CPU，在线用 GPU", "B. 离线用固定题集，在线看真实流量的指标", "C. 离线测价格，在线测速度", "D. 两者没有区别", "E. 离线看质量，在线只看成本"], a: [1], e: "单选。答案 B。A 错误：硬件不是区分标准；C 错误：两者都可以测多项指标；D 错误：数据来源与决策方式都不同；E 错误：在线同样要看质量。B：离线可复现，在线看真实分布，二者互补。", t: 0, n: {"A": "硬件不是区分标准。", "B": "离线可复现，在线看真实分布，二者互补。", "C": "两者都可以测多项指标。", "D": "数据来源与决策方式都不同。", "E": "在线同样要看质量。"}, d: "低" },
  { q: "视觉 token 的成本由什么决定？", o: ["A. 由图像分辨率与切块方式决定的 token 数", "B. 由图片文件大小决定", "C. 由图片的文件格式（JPEG/PNG）决定", "D. 由用户提问长度决定", "E. 由模型参数量决定"], a: [0], e: "单选。答案 A。B 错误：KB 数与 token 数不成比例；C 错误：文件格式只影响字节数，不改变切块后的 token 数；D 错误：提问长度是另一笔输入；E 错误：视觉 token 数由图像切分决定。A：图像按 patch 切分，分辨率越高 token 越多。", t: 10, n: {"A": "图像按 patch 切分，分辨率越高 token 越多。", "B": "KB 数与 token 数不成比例。", "C": "文件格式只影响字节数，不改变切块后的 token 数。", "D": "提问长度是另一笔输入。", "E": "视觉 token 数由图像切分决定。"}, d: "低" },
  { q: "为什么视觉编码器可以直接复用，语言模型却必须再训练，正确的有", o: ["A. 词表里没有「图像 patch」这一项，拼进序列后语言模型得先学会读它", "B. 因为视觉编码器的参数量比语言模型小", "C. 复用可行的前提之一是视觉侧已经在大规模图文对上做过训练", "D. 视觉侧预训练学到的是通用感知特征，「认出物体」这类能力可迁移", "E. 语言模型权重服从的是文本 token 的条件分布，从没吃过视觉向量这一路输入"], a: [0, 2, 3, 4], e: "视觉编码器已在大规模图文对上习得通用特征，可复用；语言模型没见过图像 patch，必须学会读新输入。答案 A、C、D、E。B错误：谁大谁小不是能否复用的判据，很多视觉分支参数量并不小；决定因素是特征是否已通用、语言侧是否需要适配新输入模态。", t: 10, n: {"A": "词表里没有「图像 patch」，拼进序列后得先学会读它", "B": "谁大谁小不是能否复用的判据，很多视觉分支参数量并不小；决定因素是特征是否已通用、语言侧是否需要适配新输入模态", "C": "复用前提是视觉侧已在大规模图文对上训练过", "D": "视觉预训练学的是通用感知特征，可迁移", "E": "语言模型权重服从文本条件分布，没吃过视觉向量"}, d: "中" },
  { q: "A/B 测试的基本做法是什么？", o: ["A. 让全部用户同时用新版本", "B. 把流量分成两组，比较新旧版本的指标", "C. 只跑一遍离线题集", "D. 只听取专家意见", "E. 把两组指标做成同一张报表就算 A/B"], a: [1], e: "单选。答案 B。A 错误：那是一次性全量发布，不是 A/B；C 错误：离线评测不是 A/B 测试；D 错误：专家意见不能替代流量实验；E 错误：没有随机分流与对照，不算 A/B。B：随机分流加对照，才能把差异归因到版本。", t: 0, n: {"A": "那是一次性全量发布，不是 A/B。", "B": "随机分流加对照，才能把差异归因到版本。", "C": "离线评测不是 A/B 测试。", "D": "专家意见不能替代流量实验。", "E": "没有随机分流与对照，不算 A/B。"}, d: "低" },
  { q: "接了 RAG 之后答案仍然出错，常见原因是什么？", o: ["A. 模型参数量太小", "B. 没有召回相关内容、片段被截断，或模型没有照材料回答", "C. 显卡型号太旧", "D. 用户提问字数太少", "E. 解码温度设得太低"], a: [1], e: "单选。答案 B。A 错误：参数规模不是这类错误的直接解释；C 错误：硬件影响速度，不决定忠实性；D 错误：短问题也可以答对，关键在材料与生成；E 错误：温度只改变分布形状，调低温度并不保证照材料回答，不是这类错误的常见原因。B：RAG 出错要分段查：召回、拼装、生成。", t: 2, n: {"A": "参数规模不是这类错误的直接解释。", "B": "RAG 出错要分段查：召回、拼装、生成。", "C": "硬件影响速度，不决定忠实性。", "D": "短问题也可以答对，关键在材料与生成。", "E": "温度只改变分布形状，调低温度不保证照材料回答。"}, d: "低" },
  { q: "VLM 数物体个数容易出错，最主要的原因是哪一条", o: ["A. 图像编码器的分辨率太低", "B. 语言模型不认识中文量词", "C. 没有「逐个枚举再累加」的机制，数量只能靠注意力隐式聚合", "D. 把问题改成「数一数」的措辞可以解决", "E. 词表里没有数字 token，没法输出数量"], a: [2], e: "单选。VLM 没有逐个枚举再累加的计数机制，物体一多就退化成猜一个合理数。答案 C。A 错误：升分辨率能缓解但改不了「无枚举机制」这一根因；B 错误：错的是数量不是词，中文量词本身没问题；D 错误：缺的是逐个枚举再累加的机制，措辞不解决；E 错误：数字是普通词表 token，卡点在视觉侧的证据组织方式。", t: 10, n: {"A": "升分辨率能缓解但改不了「无枚举机制」这一根因", "B": "错的是数量不是词，中文量词本身没问题", "C": "同一个物体可能占 3 块也可能占 300 块，模型没有计数结构，物体一多就退化成「猜个看着合理的数」", "D": "缺的是逐个枚举再累加的机制，措辞不解决", "E": "数字是普通词表 token，卡点在视觉侧的证据组织方式"}, d: "中" },
  { q: "OCR 适合解决什么问题？", o: ["A. 生成艺术图像", "B. 从图片中逐字识别文字", "C. 训练语言模型", "D. 压缩视频", "E. 把图片放大到更高分辨率"], a: [1], e: "单选。答案 B。A 错误：那是图像生成；C 错误：OCR 不训练语言模型；D 错误：那是视频编码；E 错误：放大不等于识别文字。B：密集小字与精确计数交给专用工具更稳。", t: 10, n: {"A": "那是图像生成。", "B": "密集小字与精确计数交给专用工具更稳。", "C": "OCR 不训练语言模型。", "D": "那是视频编码。", "E": "放大不等于识别文字。"}, d: "低" },
  { q: "扩散模型生成图像的基本思路是什么？", o: ["A. 从数据库检索现成图片", "B. 用规则拼接像素", "C. 从噪声出发，逐步去噪生成图像", "D. 直接复制训练图片", "E. 从文字直接查表得到像素"], a: [2], e: "单选。答案 C。A 错误：那是检索式生成；B 错误：规则拼接难以按文字条件创作；D 错误：那是复制，不是生成；E 错误：扩散不是查表。C：正向加噪是预设规则，反向每步预测噪声。", t: 10, n: {"A": "那是检索式生成。", "B": "规则拼接难以按文字条件创作。", "C": "正向加噪是预设规则，反向每步预测噪声。", "D": "那是复制，不是生成。", "E": "扩散不是查表。"}, d: "低" },
  { q: "让 VLM 读图表、仪表盘上的数值，容易错在哪里，正确的有", o: ["A. 从柱子高低反推具体数值要靠多步比较，模型常按视觉印象估数", "B. 数字本身往往是小字，笔画受损后读数连字带数一起错", "C. 表格那种跨行跨列的对齐关系，不在对比学习考的东西里", "D. 读图准不准只由语言模型侧决定，与输入图像质量无关", "E. 坐标轴刻度与网格线被切进 patch，细密刻度容易被抹平"], a: [0, 1, 2, 4], e: "图表读数错在视觉证据：分辨率、patch 切分、跨行跨列对齐；不是语言模型单方面能补的。答案 A、B、C、E。D错误：证据在图像侧就被抹掉时，再强的语言模型也只能猜；正文明写 OCR 靠高分辨率训练样本补，不是架构自带的能力。", t: 10, n: {"A": "从柱高反推数值要多步比较，模型常按印象估", "B": "数字往往是小字，笔画受损就带字带数一起错", "C": "跨行跨列的对齐关系不在对比学习里", "D": "证据在图像侧就被抹掉时，再强的语言模型也只能猜；正文明写 OCR 靠高分辨率训练样本补，不是架构自带的能力", "E": "细密刻度被切进 patch 后容易被抹平"}, d: "中" },
  { q: "按正文口径，搭一条「VLM + 专职工具」的混合链路，合理的设计有", o: ["A. 为了省 token 把分辨率统一压低，读字任务照此跑", "B. 先用 OCR 或检测器产出结构化证据，再把结果当文本喂给语言模型推理", "C. 让模型自己决定要不要调用 OCR，显式编排的必要性下降", "D. 允许模型在证据不足时回答「看不清」，而不是逼它硬猜", "E. 工具结果与模型自述不一致时记成失败样本回流，用来定位错在哪一段"], a: [1, 3, 4], e: "VLM+工具要显式编排：先 OCR/检测拿结构化证据，再交给语言模型推理；别压低分辨率。答案 B、D、E。A错误：读字恰恰最吃分辨率，压低输入会把笔画抹平，省下的那点 token 会以错答的形式还回去；C错误：证据产出要显式编排并可核查，否则无法定位错在哪一段。", t: 10, n: {"A": "读字恰恰最吃分辨率，压低输入会把笔画抹平，省下的那点 token 会以错答的形式还回去", "B": "先用 OCR 或检测器产出结构化证据，再当文本喂给模型", "C": "证据产出要显式编排并可核查，否则无法定位错在哪一段", "D": "允许它回答「看不清」，而不是硬猜", "E": "工具与自述不一致时记成失败样本回流"}, d: "高" },
  { q: "扩散模型的正向加噪过程为什么不需要训练，正确的有", o: ["A. 因为正向过程可逆，反向只是把它精确解出来", "B. 正向过程也算损失，只是权重给得小", "C. 它按预设噪声表逐步掺高斯噪声，规则是写死的", "D. 每一步从干净图到带噪图都有解析形式，不需要学", "E. 加到最后与随机噪声无异，所以采样起点可以直接从随机分布取"], a: [2, 3, 4], e: "扩散正向加噪是预设规则、有解析形式、无须训练；反向去噪才需要网络。答案 C、D、E。A错误：正向加噪是有损的，反向只能靠模型近似去噪——真可逆就不必训练反向网络了；B错误：训练目标只有反向那一步（给定带噪图与步数预测掺入的噪声），正向没有可学参数也没有损失项。", t: 10, n: {"A": "正向加噪是有损的，反向只能靠模型近似去噪——真可逆就不必训练反向网络了", "B": "训练目标只有反向那一步（给定带噪图与步数预测掺入的噪声），正向没有可学参数也没有损失项", "C": "按预设噪声表逐步掺噪，规则是写死的", "D": "每一步从干净图到带噪图都有解析形式", "E": "加到最后与随机噪声无异，起点可直接抽"}, d: "中" },
  { q: "关于扩散模型在反向每一步预测的对象，正确的有", o: ["A. 文本条件与时间步一起作为输入提供给网络", "B. 每一步都看见整幅图，而不是逐块接龙", "C. 预测下一段离散 codebook token 上的概率分布", "D. 预测这张图对应的文字描述 caption", "E. 给定带噪图与当前步数，预测这一步掺入的噪声并减掉"], a: [0, 1, 4], e: "扩散每步预测噪声并从带噪图减去；它是连续回归，不是 codebook 接龙或 caption 预测。答案 A、B、E。C错误：逐 token 接龙是自回归图像生成的机制；扩散每步是对连续值的回归，把两者混为一谈就会误以为它也有词表和 softmax；D错误：caption 是条件或评测对象，不是去噪目标。", t: 10, n: {"A": "文本条件与时间步一起作为输入", "B": "每步看见整幅图，而不是逐块接龙", "C": "逐 token 接龙是自回归图像生成的机制；扩散每步是对连续值的回归，把两者混为一谈就会误以为它也有词表和 softmax", "D": "caption 是条件或评测对象，不是去噪目标", "E": "给定带噪图与步数，预测这一步掺入的噪声并减掉"}, d: "中" },
  { q: "关于去噪步数这个旋钮，正确的有", o: ["A. 超过约几十步，质量几乎不再往上走", "B. 早期步定构图，中后期步修轮廓纹理与细节", "C. 步数加够多可以替代分辨率，把细节补回来", "D. 步数太少会留噪点与涂抹感", "E. 每多一步就多一次完整前向，成本线性上涨"], a: [0, 1, 3, 4], e: "步数管收敛，分辨率管细节；步数太多收益饱和，太少会留噪点。答案 A、B、D、E。C错误：步数管的是收敛得干不干净，能容纳多少细节由分辨率决定；latent token 数不变，再多次迭代也补不出被压缩掉的像素级信息。", t: 0, n: {"A": "超过几十步，质量几乎不再往上走", "B": "早期步定构图，中后期修轮廓与细节", "C": "步数管的是收敛得干不干净，能容纳多少细节由分辨率决定；latent token 数不变，再多次迭代也补不出被压缩掉的像素级信息", "D": "步数太少会留噪点与涂抹感", "E": "每多一步就多一次完整前向，成本线性涨"}, d: "中" },
  { q: "「错误分布」相比一个总分，多告诉了你什么？", o: ["A. 模型的参数量有多大", "B. 错误集中在哪些类型、哪些输入上", "C. 训练一共花了多少钱", "D. 供应商叫什么名字", "E. 模型的回答平均有多长"], a: [1], e: "单选。答案 B。A 错误：参数量是静态属性；C 错误：那是成本账；D 错误：那是采购信息；E 错误：长度不是错误分布。B：总分告诉你「差多少」，分布告诉你「差在哪」。", t: 0, n: {"A": "参数量是静态属性。", "B": "总分告诉你「差多少」，分布告诉你「差在哪」。", "C": "那是成本账。", "D": "那是采购信息。", "E": "长度不是错误分布。"}, d: "低" },
  { q: "要把一张文生图的输出复现出来，需要固定哪些东西，正确的有", o: ["A. prompt、引导强度等采样参数也要保持一致", "B. seed 固定后画面就由 seed 单独决定，prompt 的影响被覆盖", "C. seed 决定起点那张噪声图，必须存下来", "D. 同 seed 但换了调度器或步数，结果不会一致", "E. 把 prompt 存下来，seed 每次随机也能复现"], a: [0, 2, 3], e: "复现文生图要固定 prompt、CFG、步数、调度器与 seed；seed 只决定起点噪声。答案 A、C、D。B错误：seed 只锁住起点那张噪声，内容仍由条件与采样参数驱动；正文的分工是多样性来自 seed 与调度器，可控性来自 CFG 与步数；E错误：起点噪声决定构图，seed 必须一起存。", t: 10, n: {"A": "prompt 与引导强度等采样参数也要一致", "B": "seed 只锁住起点那张噪声，内容仍由条件与采样参数驱动；正文的分工是多样性来自 seed 与调度器，可控性来自 CFG 与步数", "C": "seed 决定起点那张噪声图，必须存下来", "D": "换调度器或步数，结果不会一致", "E": "起点噪声决定构图，seed 必须一起存"}, d: "中" },
  { q: "语音助手的三段式链路通常指什么？", o: ["A. 训练 → 推理 → 评测", "B. ASR → LLM → TTS", "C. 输入 → 输出 → 日志", "D. 量化 → 蒸馏 → 剪枝", "E. 摄像头 → 屏幕 → 云端"], a: [1], e: "单选。答案 B。A 错误：那是生命周期；C 错误：那是数据流；D 错误：那是模型压缩；E 错误：那是硬件链路，不是语音三段式。B：三段式可审计、可接 RAG，端到端则少了中间文本。", t: 10, n: {"A": "那是生命周期。", "B": "三段式可审计、可接 RAG，端到端则少了中间文本。", "C": "那是数据流。", "D": "那是模型压缩。", "E": "那是硬件链路，不是语音三段式。"}, d: "低" },
  { q: "VLM 数物体个数容易错，主要缺什么？", o: ["A. 图像分辨率太低", "B. 缺少逐个枚举再累加的机制", "C. 文本太长", "D. 缺少专门输出数字的解码头", "E. 缺少更大的词表"], a: [1], e: "单选。答案 B。A 错误：分辨率只是变量之一；C 错误：文本长度不是计数错误的主因；D 错误：数字就是普通词表 token，计数卡在没有逐个枚举的机制，不在输出头；E 错误：计数不是词表问题。B：模型在用注意力隐式聚合，不是在逐个点数。", t: 10, n: {"A": "分辨率只是变量之一。", "B": "模型在用注意力隐式聚合，不是在逐个点数。", "C": "文本长度不是计数错误的主因。", "D": "数字就是普通词表 token，计数卡在枚举机制，不在输出头。", "E": "计数不是词表问题。"}, d: "中" },
  { q: "发布门禁（gate）的作用是什么？", o: ["A. 让发布流程更快", "B. 不达到约定指标就不允许发布", "C. 替代所有人工评审", "D. 自动生成发布说明", "E. 把发布说明写得更详细"], a: [1], e: "单选。答案 B。A 错误：门禁可能让发布更慢，但更稳；C 错误：门禁替代不了判断与责任；D 错误：那是另一类工具；E 错误：文档不构成门禁。B：门禁把「能不能发」变成可执行的检查，而不是感觉。", t: 0, n: {"A": "门禁可能让发布更慢，但更稳。", "B": "门禁把「能不能发」变成可执行的检查，而不是感觉。", "C": "门禁替代不了判断与责任。", "D": "那是另一类工具。", "E": "文档不构成门禁。"}, d: "低" },
  { q: "生成一段 CRUD 只要几分钟之后，团队的瓶颈并没有消失而是移动了。按正文口径，它移到了哪里", o: ["A. 移到了需求积压：周产能在涨，积压和没人认领的产物也在涨", "B. 哪里都没移，产能上来瓶颈自然就消化了", "C. 需求定义这一端：这段代码该不该存在、怎样算定义清楚，一点没变快", "D. 后端的集成与长期维护：三年后谁敢改它，照样没人接", "E. 移到了敲代码的手速，Agent 终究比人写得慢"], a: [0, 2, 3], e: "CRUD 变快后瓶颈移到需求定义、集成与长期维护；写代码手速不再是瓶颈。答案 A、C、D。E错误：写样板代码正是被接管得最干净的一段，手速不再是瓶颈。B错误：生成变快只压掉中间那一段，前后两端都没变，积压反而跟着产能一起涨。", t: 15, n: {"A": "瓶颈移到需求积压：产能涨，积压也在涨", "B": "生成变快只压掉中间那一段，前后两端都没变，积压反而跟着产能一起涨", "C": "需求定义清楚这一步一点没变快", "D": "后端的集成与长期维护照样没人接", "E": "写样板代码正是被接管得最干净的一段，手速不再是瓶颈"}, d: "高" },
  { q: "过去集成是人写代码时的副产品，现在必须变成有 owner 的显式动作。关于这一变化的原因与表现，正确的有", o: ["A. Agent 各生成一块时，错误码各写各的、依赖被重复引入", "B. 把接口文档喂给每个 Agent，集成这件事就不再需要人做", "C. 两处相似实现各自演化，最后没人敢合并", "D. 集成做得快不快，取决于模型的代码补全延迟", "E. 以前写代码的人顺手就读到别人的接口，集成是副产物"], a: [0, 2, 4], e: "Agent 各自生成会带来错误码、依赖与相似实现的分叉；集成要变成有 owner 的显式动作。答案 A、C、E。B错误：文档喂进去不等于对齐，错误码仍会各写各的，正文要的是有人认领这个动作。D错误：集成是决策与合并的工作量，跟单次补全的延迟没有关系。", t: 0, n: {"A": "Agent 各生成一块，错误码各写各的、依赖被重复引入", "B": "文档喂进去不等于对齐，错误码仍会各写各的，正文要的是有人认领这个动作", "C": "两处相似实现各自演化，最后没人敢合并", "D": "集成是决策与合并的工作量，跟单次补全的延迟没有关系", "E": "以前写代码的人顺手读到别人的接口，集成是副产物"}, d: "中" },
  { q: "审查点上移之后，资深工程师的日常产出也跟着换。关于这些产出，不恰当的有", o: ["A. 按能独立验证的粒度切任务", "B. 把技术栈、目录约定、禁止事项与合规红线写成约束", "C. 把自己练成读 diff 最快的人，靠阅读速度覆盖产量", "D. 亲自重写 Agent 的产出，把质量攥在自己手里", "E. 把“能做出来就行”换成能通过的判据：触发条件、数值边界、明确反例"], a: [2, 3], e: "审查点上移后，资深工程师的产出是切分、约束与判据；靠读 diff 速度或亲自重写不可规模化。答案 C、D。E成立：它正是三件可复用产出里的第一件。A成立：切错粒度会让人审不动，于是跳过审查。B成立：约束写得客气，模型就用它见过的平均值来补。C错误：读得再快也只是在消费产出，能留给团队复用的还是判据、切分和约束这三样。D错误：逐段重写不沉淀任何资产，同类错误照样在下一处冒出来。", t: 0, n: {"A": "按能独立验证的粒度切任务，正是该做的", "B": "把约束写成文档，正是该做的", "C": "读得再快也只是在消费产出，能留给团队复用的还是判据、切分和约束这三样", "D": "逐段重写不沉淀任何资产，同类错误照样在下一处冒出来", "E": "换成可判的判据，正是该做的"}, d: "中" },
  { q: "任务切分要按能独立验证的粒度来切，切错的代价很直接。关于切分粒度，正确的有", o: ["A. 切分粒度只影响体感，不影响返工率与首次验收通过率", "B. 切得越细越好，审查成本可以忽略", "C. 一次吐八百行，没人审得动，结果就是跳过审查", "D. 单次产出越长，一次失败要返工的决策越多", "E. 切分粒度由模型的上下文上限决定，跟人没关系"], a: [2, 3], e: "切分按可独立验证的粒度，不是按 token 上限；太细增加集成与决策次数。答案 C、D。E错误：能独立验证是判据尺度，不是 token 尺度；按上限切出来的块往往混着一堆决策。A错误：审不动就跳过审查，返工和线上兜底跟着涨，这两项恰好都会在指标上露头；B错误：过细会增加集成与决策次数，粒度要按可验证性定。", t: 4, n: {"A": "审不动就跳过审查，返工和线上兜底跟着涨，这两项恰好都会在指标上露头", "B": "过细会增加集成与决策次数，粒度要按可验证性定", "C": "一次吐八百行，没人审得动，结果就是跳过审查", "D": "产出越长，一次失败要返工的决策越多", "E": "能独立验证是判据尺度，不是 token 尺度；按上限切出来的块往往混着一堆决策"}, d: "中" },
  { q: "AI 生成的代码出了线上事故，按正文口径，可执行的责任落在哪里", o: ["A. 只落在按下合并键的提交人，另外两层不参与复盘", "B. 落在批准引入 AI 工具的管理层", "C. 自动减免，因为没人逐行写过这段代码", "D. 落在提交人、评审人、门禁设计者三层，缺一层就退化成没人负责", "E. 落在模型及其供应商，因为错误内容是它生成的"], a: [3], e: "单选。AI 代码事故的责任在三层：提交人、评审人、门禁设计者，缺一层就没人负责。答案 D。A 错误：提交人只是三层之一，前两层追人，第三层追系统；B 错误：把责任推给决策层，等于当前三层都没人认领；C 错误：提交即背书，代码不是人逐行写的这件事不构成免责；E 错误：模型没有账户、不上 on-call，也不能被复盘，责任落不到它头上。", t: 15, n: {"A": "提交人只是三层之一，前两层追人，第三层追系统", "B": "把责任推给决策层，等于当前三层都没人认领", "C": "提交即背书，代码不是人逐行写的这件事不构成免责", "D": "落在提交人、评审人、门禁设计者三层", "E": "模型没有账户、不上 on-call，也不能被复盘，责任落不到它头上"}, d: "高" },
  { q: "同一类错误第二次仍然被合进主干。按正文口径，正确的处置是", o: ["A. 门禁设计者要对为什么这类错误能一路通过流水线负责", "B. 要求评审人逐行读完 AI 生成的每一行代码，作为修复手段", "C. 责任从又一次按下合并的工程师，转移到设计门禁的人", "D. 复盘要问缺哪条检查、谁补、几天内补上", "E. 仍然只追究提交人，因为他读得不够仔细"], a: [0, 2, 3], e: "同类错误第二次仍合入，应追门禁设计而不是只追提交人；补检查而不是加大人力。答案 A、C、D。E错误：第一次可以追人，第二次还能合进来就该追系统，否则同一个错误会一直追到下一个提交人头上。B错误：逐行读完不可规模化，要补的是那条缺失的检查，不是加大人力。", t: 0, n: {"A": "门禁设计者要为「为什么能一路通过流水线」负责", "B": "逐行读完不可规模化，要补的是那条缺失的检查，不是加大人力", "C": "责任从按下合并的人转移到设计门禁的人", "D": "复盘要问缺哪条检查、谁补、几天内补", "E": "第一次可以追人，第二次还能合进来就该追系统，否则同一个错误会一直追到下一个提交人头上"}, d: "高" },
  { q: "一个人加 Agent 写完整个模块，个体尺度成立、组尺度会爆炸。关于它崩在哪里，正确的有", o: ["A. 模块规模不到八百行就不会出这个问题", "B. 个体尺度确实成立：决策都在作者脑子里，跑通即完成", "C. 组尺度崩在知识不成文：八百行整洁代码里埋着二十次没写下来的取舍", "D. 接手的人只能重写，而且比当初写出来更慢，因为没人告诉他坑在哪", "E. 这类模块的代码质量低于团队平均值"], a: [1, 2, 3], e: "个人+Agent 的模块在团队尺度崩在知识不成文；能跑不等于能接手。答案 B、C、D。E错误：崩的不是质量而是可解释性，代码能跑、写得整洁也照样没人能接手。A错误：八百行只是举例，债的多少看没写下来的取舍数量，跟行数的关系不是阈值。", t: 3, n: {"A": "八百行只是举例，债的多少看没写下来的取舍数量，跟行数的关系不是阈值", "B": "个体尺度所有决策都在作者脑子里，跑通即完成", "C": "组尺度崩在知识不成文，二十次取舍没写下来", "D": "接手的人只能重写，而且比当初写出来更慢", "E": "崩的不是质量而是可解释性，代码能跑、写得整洁也照样没人能接手"}, d: "高" },
  { q: "一个模块背上了知识债，正文给出的可观察信号包括", o: ["A. 作者休假一周，问题开始排队", "B. 那一行代码所有权名单上只有一个名字", "C. 找不到一份记录来解释当初为什么这么选", "D. 单元测试覆盖率为零", "E. 只有作者能改这个模块"], a: [0, 1, 2, 4], e: "知识债的信号是没人能解释：只有作者能改、作者休假就排队、找不到选型记录；覆盖率低是另一类问题。答案 A、B、C、E。D错误：覆盖率低是质量问题。知识债的四个信号都指向没人能解释，而不是没被测过；覆盖率高但只有作者能改，一样是债。", t: 14, n: {"A": "作者休假一周，问题开始排队", "B": "所有权名单上只有一个名字", "C": "找不到一份记录解释当初为什么这么选", "D": "覆盖率低是质量问题。知识债的四个信号都指向没人能解释，而不是没被测过；覆盖率高但只有作者能改，一样是债", "E": "只有作者能改这个模块"}, d: "中" },
  { q: "关于知识债的定义及其与代码债、技术债的区分，下列说法正确的有？", o: ["A. 知识债的典型形态是代码能跑，但没人能解释当初的取舍", "B. 知识债指的是重复代码、混乱命名这类代码结构问题", "C. 技术债写在代码结构里，知识债写在没落地的取舍里", "D. 把代码写整洁、命名规范就能消除知识债", "E. 知识债只出现在小团队，大团队不会有"], a: [0, 2], e: "答案 A、C。A 正确：能跑但没人解释得清，是知识债的定义性形态。C 正确：技术债在结构里，知识债在没写下来的取舍里，这是两者的区分。B 错误：重复代码、混乱命名属于代码债/技术债的范畴，不是知识债。D 错误：整洁只降低阅读成本，解释不了当初为什么这样选型，消不掉知识债。E 错误：知识债与团队规模无关，大团队同样会积累没写下来的取舍。", t: 14, n: {"A": "能跑但没人能解释", "B": "结构问题属代码债", "C": "技术债在结构、知识债在取舍", "D": "整洁消不掉知识债", "E": "与团队规模无关"}, d: "低" },
  { q: "正文认为会定义验收比会提示更值钱，给出的机制包括", o: ["A. 提示写得够清楚时，模型能替团队决定什么算做完", "B. 什么算做完是价值判断，模型只会让选定的那条路看起来更像样", "C. 验收定义写下来就变成团队资产，能复用、能被门禁执行", "D. 口头提示只留在一个人脑子里，人一走就没了", "E. 提示词技巧会贬值：每一代模型都更擅长把含糊意图补全"], a: [1, 2, 3, 4], e: "验收定义是价值判断与团队资产：能复用、能被门禁执行；提示技巧会随模型贬值。答案 B、C、D、E。A 错误：它补的是意图的空白，给不出价值判断，把做完的标准交给它等于没有标准。", t: 15, n: {"A": "它补的是意图的空白，给不出价值判断，把做完的标准交给它等于没有标准", "B": "什么算做完是价值判断，模型只会让选定的路更像样", "C": "验收定义写下来就是团队资产，能被门禁执行", "D": "口头提示只留在一个人脑子里", "E": "提示词技巧会贬值，模型越来越会补全含糊意图"}, d: "中" },
  { q: "按 token 计费时，输入与输出的单价通常怎样？", o: ["A. 输入通常更贵", "B. 输入输出完全同价", "C. 输出通常更贵，因为逐 token 生成更慢", "D. 输出通常免费", "E. 输入输出都按字符数计费"], a: [2], e: "单选。答案 C。A 错误：多数 API 是输出更贵；B 错误：两者成本结构不同；D 错误：输出通常是最贵的一段；E 错误：计费单位是 token，不是字符。C：输出逐 token 生成，输入可并行 Prefill，成本不同。", t: 7, n: {"A": "多数 API 是输出更贵。", "B": "两者成本结构不同。", "C": "输出逐 token 生成，输入可并行 Prefill，成本不同。", "D": "输出通常是最贵的一段。", "E": "计费单位是 token，不是字符。"}, d: "低" },
  { q: "关于大模型 API 失败请求的计费口径，下列说法正确的有？", o: ["A. 计费看服务端是否实际产生消耗，而不是客户端是否收到响应", "B. SDK 抛异常的请求没有消耗 token，所以不计费", "C. 已在服务端开始生成 token 的请求，即使业务处理失败，输入与已生成输出通常仍计费", "D. 各供应商对失败请求的计费规则完全一致，没有差异", "E. 参数校验失败、在网关早期就被拒掉的请求，一般不产生推理消耗"], a: [0, 2, 4], e: "答案 A、C、E。A 正确：计费口径的基本事实是以服务端消耗为准。C 正确：已开始推理的请求，输入与已生成输出通常照常计费。E 正确：网关早期拒绝的请求没有进入推理，一般不产生消耗。B 错误：SDK 抛异常时服务端可能已完成推理，消耗照样计费。D 错误：各供应商计费细则存在差异，需按各家文档确认，并非一致。", t: 12, n: {"A": "以服务端消耗为准", "B": "SDK 异常也可能已计费", "C": "已开始生成通常计费", "D": "各家规则有差异", "E": "早期拒绝一般不耗推理"}, d: "低" },
  { q: "关于模型版本锁定与下线风险，下列说法都成立的是？", o: ["A. 生产链路要锁到具体快照版本，并把版本名写进日志与评测元数据", "B. 下线通常有预告窗口，真正费事的是提示、工具 schema 与评测基线要一起重跑", "C. 锁定版本之后单价与配额也可能随快照不同，报价要按版本分别记", "D. 换代要留回滚路径，旧版本至少并行到新版本通过灰度评测", "E. 用别名或最新指针拿到的模型会随时间变化，同一份提示在不同日期可能打到不同权重"], a: [0, 1, 2, 3, 4], e: "五项皆成立：E 是版本别名的语义，它指向的东西会变；A 对应正文那句把模型名与版本写进元数据、便于回滚与定位来源；B 是换代的工作量真相，改的不只是模型名；C 是账单口径，按版本记价才能解释同一功能在不同月份的单价差；D 与灰度口径一致，ROI 与质量结论都要来自小流量灰度后的长期数据。", t: 0, n: {"A": "A 对应正文那句：把模型名与版本写进元数据，便于回滚与定位来源", "B": "下线有预告窗口，费事的是提示、schema 与基线一起重跑", "C": "锁定版本后单价与配额也可能随快照不同", "D": "换代要留回滚，旧版并行到新版通过灰度", "E": "用别名拿到的模型会随时间变化"}, d: "中" },
  { q: "灰度发布是什么？", o: ["A. 一次性把所有流量切到新版本", "B. 先删除旧版本再发布", "C. 只在夜间发布就算灰度", "D. 先让小流量使用新版本，确认后再逐步放大", "E. 先在小范围发，但不保留旧版本"], a: [3], e: "单选。答案 D。A 错误：那是全量发布；B 错误：删旧版等于放弃回滚；C 错误：时间点不是灰度，流量比例才是；E 错误：没有回滚方案不算完整灰度。D：小流量先试，是为了把故障面控制在可承受范围。", t: 0, n: {"A": "那是全量发布。", "B": "删旧版等于放弃回滚。", "C": "时间点不是灰度，流量比例才是。", "D": "小流量先试，是为了把故障面控制在可承受范围。", "E": "没有回滚方案不算完整灰度。"}, d: "低" },
  { q: "把一个任务拆给多个 Agent 之前，最该先判断什么？", o: ["A. Agent 数量越多越好", "B. 所有 Agent 必须用同一个模型", "C. 所有上下文必须全量广播", "D. 所有 Agent 必须同时启动", "E. 子任务能并行、能独立验证、失败能局部重试"], a: [4], e: "单选。答案 E。A 错误：活切不开时人多反而互相踩；B 错误：同不同模型不是拆分前提；C 错误：全量广播会让成本按 Agent 数放大；D 错误：启动时序不是拆分前提。E：拆分的收益在并行，成本在交接。", t: 3, n: {"A": "活切不开时人多反而互相踩。", "B": "同不同模型不是拆分前提。", "C": "全量广播会让成本按 Agent 数放大。", "D": "启动时序不是拆分前提。", "E": "拆分的收益在并行，成本在交接。"}, d: "高" },
  { q: "为什么回滚方案必须在发布前准备好？", o: ["A. 让新版本发布得更快", "B. 减少新版本需要跑的评测项", "C. 出问题时能快速切回上一版", "D. 提高离线评测分数", "E. 让旧版本在新版本上线后自动下线删除"], a: [2], e: "单选。答案 C。A 错误：回滚方案不负责加速发布；B 错误：回滚方案不减免评测义务，新版本该跑的评测一项不能少；D 错误：回滚是运维手段，不改变分数；E 错误：回滚恰恰要求旧版本保留可用，删掉旧版本等于自断退路。C：没有回滚方案的上线，本质是在赌。", t: 0, n: {"A": "回滚方案不负责加速发布。", "B": "回滚方案不减免评测义务。", "C": "没有回滚方案的上线，本质是在赌。", "D": "回滚是运维手段，不改变分数。", "E": "回滚要求旧版本保留可用，删掉等于自断退路。"}, d: "低" },
  { q: "提示词为什么要做版本管理？", o: ["A. 让提示词变得更长", "B. 减少输入 token", "C. 提高采样温度", "D. 把提示词存进聊天记录里", "E. 让改动可追溯、可回滚、可复现"], a: [4], e: "单选。答案 E。A 错误：版本管理与长度无关；B 错误：版本管理不负责压缩；C 错误：温度是解码参数，不是提示词版本；D 错误：聊天记录不是版本管理。E：提示词是资产，改动必须能对应到评测结果。", t: 0, n: {"A": "版本管理与长度无关。", "B": "版本管理不负责压缩。", "C": "温度是解码参数，不是提示词版本。", "D": "聊天记录不是版本管理。", "E": "提示词是资产，改动必须能对应到评测结果。"}, d: "低" },
  { q: "为了抗故障，同一功能同时接两家供应商做冗余。关于这条路，下列说法正确的是？", o: ["A. 接第二家最贵的一步是把错误码统一，其余部分可自动兼容", "B. 双供应商天然互相验证，输出不一致恰好能用来判断哪家更准", "C. 两家结果不一致只说明需要一条判据来裁决，它本身不代表哪家更准", "D. 两家的缓存与限流配额在一个键空间里天然互通，切换不用重建客户端状态", "E. 冗余到位之后，业务侧对输出的校验可以简化"], a: [2], e: "单选。双供应商只解决可用性：提示与 schema 要等价迁移，不一致要判据，缓存与配额各自独立。答案 C。A 错误：真正贵的是提示与工具 schema 的等价迁移和双跑成本，错误码只是最表层的一件事；B 错误：不一致可能两边都对、也可能两边都错，没有第三判据时它只是一个信号，不构成裁判；D 错误：两家的缓存键空间、配额与计费各自独立，前缀缓存也不跨供应商复用，客户端状态要分开管；E 错误：冗余解决的是可用性，输出正确性仍要靠自己的校验与评测。", t: 12, n: {"A": "真正贵的是提示与工具 schema 的等价迁移和双跑成本，错误码只是最表层的一件事", "B": "不一致可能两边都对、也可能两边都错，没有第三判据时它只是一个信号，不构成裁判", "C": "两家不一致只说明需要一条裁决判据，不代表谁更准", "D": "两家的缓存键空间、配额与计费各自独立，前缀缓存也不跨供应商复用，客户端状态要分开管", "E": "冗余解决的是可用性，输出正确性仍要靠自己的校验与评测"}, d: "高" },
