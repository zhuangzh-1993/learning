  { q: "关于 RAG（检索增强生成），下列说法正确的有？", o: ["A. RAG 的基本流程是先从知识库检索相关片段，再让模型基于片段生成回答", "B. RAG 可以在不修改模型参数的情况下利用外部知识库的知识", "C. RAG 的做法是先微调模型权重，再让模型凭记忆回答", "D. RAG 只靠模型参数里的记忆回答，不查外部资料", "E. RAG 的全称是 Retrieval-Augmented Generation（检索增强生成）"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：先检索、后生成是 RAG 的基本链路。B 正确：RAG 靠外挂知识库补充知识，不改模型参数。E 正确：RAG 即 Retrieval-Augmented Generation。C 错误：先微调再凭记忆回答是微调路线，不是 RAG。D 错误：只靠参数记忆正是 RAG 想避免的做法，RAG 类比开卷考试，先查资料再回答。", t: 2, n: {"A": "先检索、后生成", "B": "外挂知识库，不改参数", "C": "那是微调路线", "D": "闭卷正是 RAG 要避免的", "E": "RAG=检索增强生成"}, d: "低" },
  { q: "关于限流（rate limiting），下列说法正确的有？", o: ["A. 限流控制单位时间内的请求量，保护服务不被压垮", "B. 触发限流时通常返回明确的错误码（如 429）与 Retry-After 等重试提示", "C. 限流的作用是提高模型的回答精度", "D. 限流的作用是限制单个请求的最大 token 数", "E. 限流可以扩大模型的上下文窗口"], a: [0, 1], e: "答案 A、B。A 正确：限流就是控制单位时间请求量、保护服务。B 正确：规范做法是返回明确状态码（如 429）并带 Retry-After 等重试指引。C 错误：限流不改变模型能力与精度。D 错误：限制单请求 token 数是 max_tokens 或长度限制，不是限流。E 错误：上下文窗口由模型决定，限流改不了。", t: 12, n: {"A": "控请求量、保服务", "B": "429 + Retry-After", "C": "限流不改精度", "D": "那是 max_tokens", "E": "窗口由模型决定"}, d: "低" },
  { q: "下列关于大语言模型评测基准的说法，正确的有？", o: ["A. MMLU 是评测模型多学科知识能力的基准", "B. GSM8K 是评测数学推理能力的基准", "C. HumanEval 是评测代码生成能力的基准", "D. ImageNet 是评测大模型中文写作能力的基准", "E. CUDA 是评测大语言模型综合能力的公开基准"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：MMLU 测多学科知识。B 正确：GSM8K 是小学数学应用题推理基准。C 正确：HumanEval 测代码生成。D 错误：ImageNet 是图像分类基准，不评测中文写作。E 错误：CUDA 是 NVIDIA 的并行计算平台，不是评测基准。", t: 0, n: {"A": "MMLU=多学科知识", "B": "GSM8K=数学推理", "C": "HumanEval=代码生成", "D": "ImageNet 是图像分类基准", "E": "CUDA 是计算平台，不是基准"}, d: "低" },
  { q: "关于 Function Calling（工具调用），下列说法正确的有？", o: ["A. Function Calling 让模型输出结构化的工具调用参数", "B. 函数的实际执行由外部程序完成", "C. 函数定义通常包含函数名、功能描述与参数说明", "D. Function Calling 指模型自己直接执行代码并修改数据库", "E. Function Calling 是一种压缩模型权重的算法"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：模型产出的是结构化的调用意图与参数。B 正确：真正的执行发生在外部宿主程序。C 正确：函数定义一般由名称、描述、参数 Schema 组成。D 错误：模型不直接执行代码或改数据库，执行与权限控制在外部程序。E 错误：Function Calling 与权重压缩无关。", t: 3, n: {"A": "模型输出结构化调用参数", "B": "执行在外部程序", "C": "定义含名称、描述、参数", "D": "模型不直接执行代码", "E": "与权重压缩无关"}, d: "低" },
  { q: "关于 LLM 的 token，下列说法正确的有？", o: ["A. token 是模型处理文本的基本单位", "B. 常见英文单词通常对应一个 token", "C. 空格与换行也会占用 token", "D. 一个汉字在任何模型中都恒等于一个 token", "E. token 只能是完整的单词，不能是词的一部分"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：token 是模型处理文本的基本切分单位。B 正确：高频英文词多数就是一个 token。C 正确：空白字符同样被编码并计入 token 数。D 错误：中文切分因模型词表而异，一个汉字可能对应一个或多个 token。E 错误：子词分词允许 token 是词的一部分，如词根、后缀。", t: 1, n: {"A": "token=文本基本单位", "B": "常见英文词多为一个 token", "C": "空白也占 token", "D": "汉字与 token 不是一一对应", "E": "子词 token 可以是词的一部分"}, d: "低" },
  { q: "关于大模型的常见安全风险，下列说法正确的有？", o: ["A. 提示词注入是大模型的常见安全风险之一", "B. 越狱（Jailbreak）指诱导模型绕过安全限制", "C. 训练数据投毒属于大模型安全风险", "D. 梯度消失属于大模型的内容安全风险", "E. 显存不足属于一种越狱攻击手段"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：提示词注入是典型安全风险。B 正确：越狱就是诱导模型绕过安全限制。C 正确：数据投毒属于安全风险。D 错误：梯度消失是训练中的优化问题，不是内容安全风险。E 错误：显存不足是硬件资源问题，与越狱攻击无关。", t: 5, n: {"A": "提示词注入=安全风险", "B": "越狱=绕过安全限制", "C": "数据投毒=安全风险", "D": "梯度消失是训练问题", "E": "显存不足是资源问题"}, d: "低" },
  { q: "关于大模型评测基准（benchmark），下列说法正确的有？", o: ["A. 评测基准用统一的题集和指标，横向比较模型在某类能力上的水平", "B. 基准分数可以作为模型选型的参考之一", "C. 公开基准可以替代自建业务评测集", "D. 基准分数直接决定模型 API 的价格", "E. 评测基准可以替代人工验收与线上监控"], a: [0, 1], e: "答案 A、B。A 正确：统一题集与指标，横向可比，这是基准的核心作用。B 正确：基准是选型参考。C 错误：公开题集分布与业务不同，替代不了自建评测集。D 错误：价格由成本与市场决定，与基准分数无直接关系。E 错误：验收与监控各有职责，基准替代不了。", t: 0, n: {"A": "统一题集指标，横向可比", "B": "选型参考", "C": "替代不了自建评测集", "D": "价格与分数无直接关系", "E": "替代不了验收与监控"}, d: "低" },
  { q: "关于开源模型生态，下列说法正确的有？", o: ["A. 开放权重模型可以下载后私有化部署", "B. Llama、Qwen、DeepSeek 等系列提供开放权重", "C. 开源许可证可能包含对商用的限制条款", "D. 开放权重意味着训练数据也一并公开", "E. 开放权重模型不允许用于任何商业场景"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：开放权重可下载并在自有环境部署。B 正确：Llama、Qwen、DeepSeek 都提供开放权重。C 正确：部分许可证对商用附有限制条款。D 错误：权重与训练数据是两回事，多数开放权重模型并不公开训练语料。E 错误：许多开放权重许可证允许商用，部分附带条件，并非一律禁止。", t: 7, n: {"A": "开放权重可私有化部署", "B": "Llama/Qwen/DeepSeek 开放权重", "C": "许可证可能限制商用", "D": "权重开放不等于数据公开", "E": "多数许可证允许商用"}, d: "低" },
  { q: "关于 Guardrails（护栏），下列说法正确的有？", o: ["A. 护栏是对模型输入输出进行运行时检查的机制", "B. 护栏可用于拦截有害或违规输出", "C. 护栏可用于校验结构化输出的格式", "D. 护栏是一种加速模型预训练的技术", "E. 护栏通过修改模型参数来替代对齐训练"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：护栏是推理侧的运行时检查机制。B 正确：拦截有害输出是护栏的典型用途。C 正确：格式校验也是护栏的常见用途。D 错误：护栏作用于推理输入输出侧，与预训练速度无关。E 错误：护栏不修改模型参数，也替代不了对齐训练。", t: 5, n: {"A": "护栏=运行时输入输出检查", "B": "拦截有害输出", "C": "校验输出格式", "D": "护栏与预训练无关", "E": "护栏不改参数、不替代对齐"}, d: "低" },
  { q: "关于大模型推理时的 batching，正确的有？", o: ["A. batching 可以显著提升 GPU 利用率", "B. batch 越大，单请求延迟跟着下降", "C. batching 会改变每个请求的输出内容", "D. Continuous Batching 允许请求随时加入与退出批次", "E. 静态 batching 中短请求会等待同批最长请求"], a: [0, 3, 4], e: "batching 用吞吐换延迟：同批请求共享一次权重搬运，利用率上去；batch 越大排队与单请求延迟越差。答案 A、D、E。B 错误：batch 增大会推高排队与计算竞争，延迟通常上升；C 错误：批处理只影响调度与吞吐，不改变采样分布，不会系统性改变输出内容（批内数值误差带来的轻微漂移另当别论）。", t: 12, n: {"A": "batching 显著提升 GPU 利用率", "B": "batch 增大会推高排队与计算竞争，延迟通常上升。", "C": "批处理只影响调度与吞吐，不改变采样分布，不会系统性改变输出内容（批内数值误差带来的轻微漂移另当别论）", "D": "Continuous Batching 允许请求随时进出批次", "E": "静态 batching 里短请求要等最长的那个"}, d: "中" },
  { q: "关于 Embedding 模型的选型，合理的考量包括？", o: ["A. 只看通用榜单 C-MTEB 排名即可", "B. 在目标领域数据上评测检索效果", "C. 优先选参数量最大的，参数量越大检索效果越好", "D. 关注模型支持的最大输入长度", "E. 对比检索延迟与部署成本"], a: [1, 3, 4], e: "嵌入选型看目标领域检索效果、输入长度与延迟成本，不看通用榜排名或参数量。答案 B、D、E。A错误：通用榜单与垂直领域表现常脱节，必须业务评测；C错误：检索效果要看目标领域评测与延迟成本，参数量不是判据。", t: 2, n: {"A": "通用榜单与垂直领域表现常脱节，必须业务评测", "B": "要用目标领域的真实查询去评检索效果", "C": "检索效果要看目标领域评测与延迟成本，参数量不是判据", "D": "最大输入长度决定长文档会不会被截", "E": "延迟与部署成本是可选项的硬约束"}, d: "中" },
  { q: "关于 RAG 中的文档解析，下列说法正确的有？", o: ["A. 扫描件通常需要 OCR 才能提取文字", "B. PDF 中的表格与页眉页脚是常见的解析难点", "C. 纯文本文档通常比 PDF 更容易解析", "D. OCR 指的是把文字转换成语音的技术", "E. 文档解析指的是对模型权重进行量化的过程"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：扫描件是图像，需要 OCR 识别文字。B 正确：表格结构与页眉页脚干扰是 PDF 解析的常见难点。C 正确：纯文本没有版面问题，解析最简单。D 错误：OCR 是光学字符识别，把文字转语音的是 TTS。E 错误：文档解析是从文档中提取文本内容，与权重量化无关。", t: 2, n: {"A": "扫描件要先 OCR", "B": "表格、页眉页脚是难点", "C": "纯文本最易解析", "D": "OCR 是识字，TTS 才是转语音", "E": "解析是提取文本，不是量化"}, d: "低" },
  { q: "关于思维链（CoT），下列说法正确的有？", o: ["A. CoT 的全称是思维链（Chain of Thought）", "B. CoT 让模型先输出中间推理步骤再给出答案", "C. 提示词中加一句『一步一步思考』可以触发 Zero-shot CoT", "D. CoT 是一种减小模型体积的压缩技术", "E. 使用 CoT 会减少模型的输出 token 数量"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：CoT 即 Chain of Thought，思维链。B 正确：CoT 的形态就是先推理步骤后答案。C 正确：『Let's think step by step』是 Zero-shot CoT 的经典触发语。D 错误：CoT 是提示与推理方式，不是模型压缩技术。E 错误：CoT 会多输出推理步骤，输出 token 增加而非减少。", t: 11, n: {"A": "CoT=思维链", "B": "先推理步骤后答案", "C": "『一步一步思考』触发 Zero-shot CoT", "D": "CoT 不是压缩技术", "E": "CoT 增加输出 token"}, d: "低" },
  { q: "关于模型上下文窗口与 RAG 的关系，正确的有？", o: ["A. RAG 可控制注入内容的成本与来源", "B. 把窗口开到最大之后，切块与检索的必要性下降", "C. 上下文再长，检索质量差照样答错", "D. RAG 负责把相关知识放进上下文，二者互补", "E. 长上下文出现后，RAG 的位置被取代了"], a: [0, 2, 3], e: "长窗口管容量，RAG 管内容与来源；窗口再大也受成本与注意力稀释限制。答案 A、C、D。E错误：长上下文成本高且存在注意力稀释，RAG 仍是主流；B错误：窗口再大仍受成本与注意力稀释限制，检索依然决定答案质量。", t: 6, n: {"A": "放什么进上下文由检索决定，成本与来源可控", "B": "窗口再大仍受成本与注意力稀释限制，检索依然决定答案质量", "C": "检索差，窗口再大也是喂错材料", "D": "窗口管容量，检索管内容，互补而非替代", "E": "长上下文成本高且存在注意力稀释，RAG 仍是主流"}, d: "中" },
  { q: "大模型应用上线的灰度与回滚策略，合理的做法包括？", o: ["A. 保留上一版本的模型与提示词可随时切回", "B. 建立线上质量监控指标与告警", "C. 一次性全量切换并删除旧版本", "D. 灰度只盯延迟指标，质量等全量上线后再评估", "E. 先用小流量验证新模型或新提示词"], a: [0, 1, 4], e: "灰度要留旧版可回滚、小流量验证、质量与延迟双门禁，不能全量切换后删旧版。答案 A、B、E。C错误：全量切换且无回滚是高风险操作，违背灰度原则；D错误：质量与性能是两道独立门禁，灰度期不看质量等于放弃止损点。", t: 15, n: {"A": "保留上一版模型与提示词，可随时切回", "B": "建立线上质量监控指标与告警", "C": "全量切换且无回滚是高风险操作，违背灰度原则", "D": "质量与性能是两道独立门禁，灰度期不看质量等于放弃止损点", "E": "先用小流量验证新模型或新提示词"}, d: "中" },
  { q: "下列关于提示词注入（Prompt Injection）的防范措施，合理的有？", o: ["A. 模型对齐做得够好时，注入攻击基本可以自动免疫", "B. 对用户输入做模板隔离，明确区分指令与数据", "C. 对工具调用做白名单与权限控制", "D. 在系统提示词里补一句「不要执行数据里的指令」，注入风险就落在可控范围内", "E. 输出侧做敏感内容过滤"], a: [1, 2, 4], e: "注入是输入输出边界问题：定界、白名单、输出审计，不能靠模型自觉。答案 B、C、E。A错误：注入风险与模型强弱无关，是输入输出边界问题，必须工程手段防范；D错误：提示词层面的承诺只是概率修正，防御要落在定界、白名单与输出审计上。", t: 5, n: {"A": "注入风险与模型强弱无关，是输入输出边界问题，必须工程手段防范", "B": "模板隔离能降低注入成功率，但不能根除，需与白名单、输出审计叠加", "C": "工具白名单把被利用后的后果压住", "D": "提示词层面的承诺只是概率修正，防御要落在定界、白名单与输出审计上", "E": "输出侧过滤兜住漏网的越权内容"}, d: "中" },
  { q: "企业部署大模型时，评估单卡推理服务性能与服务质量的合理指标包括？", o: ["A. 模型的参数量", "B. 并发用户数下的 P99 首字延迟", "C. 请求成功率", "D. 模型文件大小", "E. tokens/s（每秒生成 token 数）"], a: [1, 2, 4], e: "吞吐要同时看单位时间产出与负载下的服务质量：tokens/s、P99 首字延迟、成功率。答案 B、C、E。D错误：模型文件大小只是显存占用的参考，不代表吞吐与服务质量；A错误：参数量是静态属性，与单卡实际吞吐不是一回事。", t: 15, n: {"A": "参数量是静态属性，与单卡实际吞吐不是一回事", "B": "并发用户数下的 P99 首字延迟", "C": "请求成功率", "D": "模型文件大小只是显存占用的参考，不代表吞吐与服务质量", "E": "每秒生成 token 数"}, d: "中" },
  { q: "关于大模型幻觉的类型，下列说法正确的有？", o: ["A. 事实性幻觉指输出与客观事实不符", "B. 忠实性幻觉指输出与给定资料不符", "C. 引用幻觉指编造不存在的出处", "D. 幻觉指模型推理服务发生超时", "E. 幻觉指输出中出现语法错误"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：事实性幻觉就是与客观事实不符。B 正确：忠实性幻觉是与给定资料不符。C 正确：编造不存在的引用出处是引用幻觉。D 错误：超时是服务层故障，不是幻觉。E 错误：语法错误属于语言质量问题，幻觉指内容看似可信但与事实或依据不符。", t: 4, n: {"A": "事实性幻觉=违背客观事实", "B": "忠实性幻觉=违背给定资料", "C": "引用幻觉=编造出处", "D": "超时是服务故障", "E": "语法错误不是幻觉"}, d: "低" },
  { q: "关于大模型微调数据的质量，下列说法正确的有？", o: ["A. 微调数据的质量通常比单纯的数量更重要", "B. 含错误标签的样本会对微调效果产生负面影响", "C. 微调数据的分布应与目标应用场景保持一致", "D. 数据清洗指的是给模型增加参数量的操作", "E. 微调数据必须全部由人工手写，不能使用模型生成的数据"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：微调中数据质量通常比数量更关键。B 正确：错误标签会把错误行为教给模型。C 正确：数据分布应贴近目标场景。D 错误：数据清洗是去除噪声与错误样本，与模型参数量无关。E 错误：模型生成的合成数据经过质量筛选后被广泛用于微调，并非只能人工手写。", t: 9, n: {"A": "质量比数量重要", "B": "错标签有负面影响", "C": "分布贴近目标场景", "D": "清洗是去噪声，不是加参数", "E": "合成数据也可用于微调"}, d: "低" },
  { q: "使用大模型生成代码时，合理的工程实践包括？", o: ["A. 对生成代码做静态检查与安全扫描", "B. 生产环境直接部署未经审查的生成代码", "C. 生成的代码必须经人工审查与测试", "D. 用单元测试验证生成代码的行为", "E. 单元测试通过即可直接上线，人工审查可以省略"], a: [0, 2, 3], e: "生成代码要静态检查、人工审查、单测验证三件套；测试通过不能替代审查。答案 A、C、D。B错误：生成代码可能有逻辑与安全缺陷，审查与测试不可省略；E错误：测试覆盖不到权限、并发与安全，审查不能省。", t: 14, n: {"A": "对生成代码做静态检查与安全扫描", "B": "生成代码可能有逻辑与安全缺陷，审查与测试不可省略", "C": "必须经人工审查与测试", "D": "用单元测试验证行为", "E": "测试覆盖不到权限、并发与安全，审查不能省"}, d: "中" },
  { q: "大模型在企业落地时，成本优化的可行手段包括？", o: ["A. 把 max_tokens 压得很小，用截断换成本", "B. 每个请求都用最大模型并拉满思考预算", "C. 对高频重复请求做缓存", "D. 按任务难度分级选用不同规模的模型", "E. 精简提示词，减少输入 token"], a: [2, 3, 4], e: "成本优化要动账单大头：缓存、按难度选模型、精简输入；截断和拉满大模型只会带来失败与返工。答案 C、D、E。A 错误：截断会让任务失败，返工与重试反而更贵；B 错误：与成本优化目标相反，应按需分配算力。", t: 7, n: {"A": "截断会让任务失败，返工与重试反而更贵", "B": "与成本优化目标相反，应按需分配算力", "C": "高频重复请求做缓存", "D": "按难度分级选不同规模的模型", "E": "精简提示词，减少输入 token"}, d: "中" },
  { q: "关于向量数据库，下列说法正确的有？", o: ["A. 向量数据库以相似度检索为核心能力", "B. 向量检索的结果通常附带相似度分数", "C. 向量数据库常用 ANN（近似最近邻）索引加速检索", "D. 向量数据库的核心能力是事务处理与 SQL 联表查询", "E. 向量检索只能做精确的字符串匹配"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：向量数据库的核心就是相似度检索。B 正确：检索结果一般带相似度分数。C 正确：ANN 索引是向量库的常见加速手段。D 错误：事务与 SQL 联表查询是关系数据库的强项，不是向量库的核心能力。E 错误：向量检索基于语义相似度、通常是近似最近邻，不是精确字符串匹配。", t: 2, n: {"A": "核心=相似度检索", "B": "结果带相似度分数", "C": "常用 ANN 索引", "D": "事务与联表是关系库的强项", "E": "向量检索是相似度，不是精确匹配"}, d: "低" },
  { q: "关于多模态模型的训练，正确的有？", o: ["A. 视觉编码器可以冻结只训练连接层", "B. 图文对齐训练只需要视觉编码器，文本侧不参与", "C. 图文数据的配比影响各模态能力", "D. 多模态模型只能理解图像不能理解文字", "E. 常用图文对数据做对齐训练"], a: [0, 2, 4], e: "多模态训练常冻结视觉编码器、训连接层；图文配比影响能力，文本侧也参与对齐。答案 A、C、E。D说反了：多模态语言模型的核心正是同时理解文字与图像；B错误：对齐训练至少要训练连接层（projector），许多方案还会同时训练文本侧；「只需要视觉编码器」恰恰说反了——视觉编码器反而常被冻结。", t: 10, n: {"A": "可以冻结视觉编码器，只训连接层", "B": "对齐训练至少训连接层，文本侧常一起训；视觉编码器反而常被冻结", "C": "图文配比会影响各模态能力", "D": "多模态恰恰是图文都能读", "E": "常用图文对做对齐训练"}, d: "中" },
  { q: "关于 Agent 与普通问答的区别，下列说法正确的有？", o: ["A. Agent 能调用工具，并根据工具返回决定下一步行动", "B. 小模型也可以驱动 Agent，是否 Agent 与参数规模无关", "C. Agent 指一类参数量特别大的模型架构", "D. Agent 只有联网才算，调用本地工具不算 Agent", "E. 判断是否 Agent 的依据是回答是否足够长"], a: [0, 1], e: "答案 A、B。A 正确：Agent 的核心是工具调用加『行动—观察—再行动』的循环。B 正确：Agent 是一种工作方式，小模型也能驱动。C 错误：Agent 不是模型架构，与参数量大小无关。D 错误：Agent 可以调用本地工具，联网不是定义。E 错误：回答长度不是判据。", t: 3, n: {"A": "工具调用+行动循环", "B": "小模型也能当 Agent", "C": "Agent 不是架构", "D": "本地工具也算", "E": "长度不是判据"}, d: "低" },
  { q: "关于模型微调中的过拟合，下列说法正确的有？", o: ["A. 过拟合指模型在训练集上表现好、在未见数据上表现差", "B. 训练损失持续下降而验证损失回升是过拟合的典型信号", "C. 过拟合指模型在训练集和验证集上都表现很差", "D. 过拟合意味着模型的参数量过少", "E. 训练损失与验证损失同步下降是过拟合的典型信号"], a: [0, 1], e: "答案 A、B。A 正确：过拟合的定义就是训练集好、泛化差。B 正确：训练与验证损失分叉是过拟合的典型信号。C 错误：训练集和验证集都差更接近欠拟合，不是过拟合。D 错误：过拟合不是参数量过少的意思，恰恰常见于模型把训练集背下来的情形。E 错误：两者同步下降是正常收敛，不是过拟合信号。", t: 9, n: {"A": "过拟合=训练好、泛化差", "B": "训练降、验证升=典型信号", "C": "两边都差是欠拟合", "D": "过拟合与参数量过少无关", "E": "同步下降是正常收敛"}, d: "低" },
  { q: "关于 ReAct 与 Plan-and-Execute 的对比，正确的有？", o: ["A. Plan-and-Execute 遇到意外需要重规划", "B. ReAct 适合目标明确、路径可预知的任务", "C. ReAct 每步都结合观察调整下一步", "D. Plan-and-Execute 不产出中间观察，所以不需要重规划", "E. Plan-and-Execute 先产出整体计划再执行"], a: [0, 2, 4], e: "ReAct 边走边看，Plan-and-Execute 先计划再执行、遇意外要重规划。答案 A、C、E。B说反了：路径可预知更适合 Plan-and-Execute；ReAct 适合需要边探索边行动的任务；D错误：执行中遇到意外必须重规划，这正是它的一环。", t: 3, n: {"A": "计划式遇到意外要重规划", "B": "目标明确、路径可预知，正是计划式的适用面", "C": "ReAct 每步结合观察调整下一步", "D": "执行中遇到意外必须重规划，这正是它的一环", "E": "先产出整体计划再执行"}, d: "中" },
  { q: "企业大模型应用的评测数据集构建，正确的做法包括？", o: ["A. 建立答案质量的人工评级标准", "B. 尽量使用公开榜单题目，客观性更有保障", "C. 覆盖真实用户的高频问题类型", "D. 包含边界与对抗样例", "E. 评测集越大越好，凑够几千条自然就覆盖了业务"], a: [0, 2, 3], e: "评测集要以自身业务为核心，覆盖高频、边界与对抗；公开榜与堆量都不解决问题。答案 A、C、D。B错误：公开榜单与业务分布脱节，评测集应以自身业务为核心；E错误：覆盖与分层比条数重要，同分布堆量不解决问题。", t: 0, n: {"A": "建立答案质量的人工评级标准", "B": "公开榜单与业务分布脱节，评测集应以自身业务为核心", "C": "覆盖真实高频问题", "D": "包含边界与对抗样例", "E": "覆盖与分层比条数重要，同分布堆量不解决问题"}, d: "中" },
  { q: "关于 Long Context 与 KV Cache 的关系，正确的有？", o: ["A. MLA、GQA 等技术可压缩 KV Cache", "B. KV Cache 占用与批处理并发数成正比", "C. KV Cache 可以无限期保留而不占资源", "D. KV Cache 的显存占用只与模型参数量有关", "E. 上下文越长 KV Cache 显存占用越大"], a: [0, 1, 4], e: "KV 随长度与并发涨、请求结束即释放；与权重是两笔账，长并发要容量管理。答案 A、B、E。C错误：KV Cache 是显存资源，请求结束即释放，长并发场景必须做容量管理；D错误：它随上下文长度与并发数线性增长，与权重是两笔账。", t: 6, n: {"A": "MLA、GQA 这类技术能压缩 KV Cache", "B": "KV 占用与并发数成正比", "C": "KV Cache 是显存资源，请求结束即释放，长并发场景必须做容量管理", "D": "它随上下文长度与并发数线性增长，与权重是两笔账", "E": "上下文越长，KV 越占显存"}, d: "中" },
  { q: "下列关于蒸馏与量化的组合，正确的有？", o: ["A. 蒸馏后的模型不能再量化", "B. 蒸馏减小模型规模，量化降低单参数位宽", "C. 二者可以叠加使用进一步压缩部署成本", "D. 蒸馏会损失部分能力，量化也会带来少量精度损失", "E. 蒸馏与量化都只作用于推理，不影响训练成本"], a: [1, 2, 3], e: "蒸馏减规模、量化降位宽，两者维度不同可叠加，也都带来能力损失；蒸馏本身要训练。答案 B、C、D。A 错误：蒸馏与量化作用于不同维度，完全可组合；E 错误：蒸馏本身就是一次训练，训练成本跑不掉。", t: 8, n: {"A": "蒸馏与量化作用于不同维度，完全可组合", "B": "蒸馏减规模，量化降单参数位宽", "C": "两者可叠加，进一步压缩部署成本", "D": "蒸馏与量化都会带来一定的能力损失", "E": "蒸馏本身就是一次训练，训练成本跑不掉"}, d: "中" },
  { q: "Agent 系统中工具调用的结果校验，合理的做法包括？", o: ["A. 把报错信息原样回传给模型让其自我修正", "B. 假设工具调用总是成功", "C. 对工具返回值做结构校验与异常处理", "D. 工具返回 HTTP 200 就代表业务办成了，返回体可以不校验", "E. 连续失败时切换策略或上报人工"], a: [0, 2, 4], e: "工具是外部系统，失败是常态：返回值要校验，HTTP 200 不等于业务成功。答案 A、C、E。B错误：工具是外部系统，失败是常态，必须显式处理；D错误：HTTP 200 只说明请求被接住，业务是否成功要看返回体，必须校验。", t: 3, n: {"A": "报错原样回传，让它自己修正", "B": "工具是外部系统，失败是常态，必须显式处理", "C": "返回值要做结构校验与异常处理", "D": "HTTP 200 只代表请求被接住，业务是否成功要看返回体", "E": "连续失败就切策略或转人工"}, d: "中" },
  { q: "关于中文分词与 LLM token，下列说法正确的有？", o: ["A. 中文文本的 token 数不等于汉字数", "B. 词表对中文的覆盖程度会影响中文的编码效率", "C. 中文专有名词可能被 BPE 拆成多个 token", "D. 所有大模型中一个汉字都固定对应一个 token", "E. 中文不需要分词，直接以像素形式输入模型"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：token 数与汉字数不是一一对应。B 正确：词表中文覆盖越好，同样文本切出的 token 通常越少。C 正确：专有名词常不在词表中，会被拆成多段。D 错误：中文切分因模型词表而异，一个汉字可能对应一个或多个 token。E 错误：中文文本同样要切分成 token 输入模型，不是以像素形式输入。", t: 1, n: {"A": "token 数≠汉字数", "B": "中文覆盖影响编码效率", "C": "专有名词常被拆碎", "D": "汉字与 token 非固定一对一", "E": "中文也要切 token，不是像素"}, d: "低" },
  { q: "关于大模型的 JSON 模式（结构化输出），下列说法正确的有？", o: ["A. JSON 模式让模型输出合法的 JSON 格式文本", "B. 结构化输出便于下游程序按字段解析取值", "C. JSON 输出常用于函数调用的参数传递", "D. 开启 JSON 模式可以保证输出内容的事实正确性", "E. JSON 模式是一种提升模型参数量的训练方法"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：JSON 模式约束输出为合法 JSON。B 正确：结构化字段便于程序直接解析。C 正确：函数调用参数常以 JSON 传递。D 错误：JSON 模式只约束格式，内容正确性仍需检索与校验保障。E 错误：JSON 模式是输出格式约束，不是训练方法，也不改变参数量。", t: 11, n: {"A": "输出合法 JSON", "B": "便于程序按字段解析", "C": "常用于函数调用参数", "D": "只管格式，不管事实正确", "E": "不是训练方法、不加参数"}, d: "低" },
  { q: "关于大模型的红队测试（Red Teaming），下列说法正确的有？", o: ["A. 红队测试指主动攻击模型以发现安全漏洞", "B. 提示词注入与越狱尝试是红队测试的常见内容", "C. 敏感信息泄露是红队测试关注的场景之一", "D. 红队测试指对模型推理速度进行压力测试", "E. 红队测试是一种预训练数据标注方法"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：红队测试就是主动攻击以暴露安全问题。B 正确：注入与越狱是红队的常规项目。C 正确：敏感信息泄露属于红队覆盖面。D 错误：速度压测属于性能评测，不是安全红队。E 错误：红队是安全评测手段，与预训练数据标注无关。", t: 5, n: {"A": "红队=主动攻击找漏洞", "B": "注入与越狱是常规项", "C": "关注敏感信息泄露", "D": "速度压测是性能评测", "E": "红队不是数据标注"}, d: "低" },
  { q: "关于 SFT（监督微调），下列说法正确的有？", o: ["A. SFT 是用人工标注的问答对做监督微调", "B. SFT 主要教模型对话格式与按指令回答的方式", "C. SFT 指用偏好数据做强化学习", "D. SFT 指把模型权重压缩到 4-bit", "E. SFT 主要负责注入大量新知识，而不是教回答方式"], a: [0, 1], e: "答案 A、B。A 正确：SFT 就是用标注问答对做监督微调。B 正确：SFT 教『怎么答』——对话格式与指令跟随。C 错误：用偏好数据做强化学习是 RLHF 或 DPO。D 错误：把权重压到 4-bit 是量化。E 错误：说反了，SFT 主要教调用方式与格式，不负责注入大量新知识。", t: 9, n: {"A": "标注问答对监督微调", "B": "教格式与怎么答", "C": "那是 RLHF/DPO", "D": "那是量化", "E": "分工说反了"}, d: "低" },
  { q: "拿未经对话微调的基座模型直接当聊天机器人用，会出现？", o: ["A. 因为它掌握的语言知识比对话模型少，所以答不好", "B. 同一道题换个提示措辞分数剧烈波动，因为它没学过稳定的应答模式", "C. 它更倾向续写问题而不是回答问题，因为训练目标是下一个 token", "D. 缺少拒绝行为，容易被诱导输出不当内容", "E. 指令前缀怎么写会显著影响输出格式，比如它可能接着把回答也编出来"], a: [1, 2, 3, 4], e: "基座的知识不少，缺的是问答格式与拒绝行为；它更倾向续写而不是回答。答案 B、C、D、E。A错误：知识主体在预训练阶段注入，对话微调改的是调用方式而非知识存量，基座的知识往往并不更少（对齐税甚至说明它本来更强）。C、D、B 都是“没学过问答这一格式”的不同表现，E 是基座最典型的失控方式。", t: 9, n: {"A": "知识主体在预训练阶段注入，对话微调改的是调用方式而非知识存量，基座的知识往往并不更少（对齐税甚至说明它本来更强）。", "B": "换个提示措辞分数剧烈波动", "C": "更倾向续写问题而不是回答", "D": "缺少拒绝行为，容易被诱导", "E": "指令前缀显著影响输出格式"}, d: "高" },
  { q: "关于预训练验证损失持续下降这一现象，下列解读与应对正确的有？", o: ["A. 不同评测指标对同一批 checkpoint 可能给出相反的排序", "B. 损失下降伴随评测高分时，也要排查基准污染", "C. 损失是充分统计量，其余指标的参考价值有限", "D. 能推出模型在验证语料上的下一 token 预测概率变高", "E. 不能直接推出数学、代码或工具调用能力提升"], a: [0, 1, 3, 4], e: "验证损失只说明下一词概率变高；任务能力、格式与安全要单独测，还要防污染。答案 A、B、D、E。C错误：损失只覆盖“在验证分布上的可预测性”这一维，任务能力、格式遵从、安全性都得单独测。D 是唯一能被损失直接支撑的结论，E、A、B 是损失之外的三件必查事项。", t: 4, n: {"A": "不同指标对同一批 checkpoint 可能给出相反排序", "B": "分数上去的同时必须排查基准污染", "C": "损失只覆盖“在验证分布上的可预测性”这一维，任务能力、格式遵从、安全性都得单独测。", "D": "只能推出在验证语料上的下一词概率变高", "E": "数学、代码、工具调用不必然跟着提升"}, d: "高" },
  { q: "SFT 阶段只用人工精修的「长而全面」回复做训练数据，关于其后果与缓解，正确的有？", o: ["A. 可以用长短配对的指令数据与按长度分桶采样来缓解", "B. 指令跟随能力会因此明显受损", "C. 后续奖励模型也会给长回答高分，放大成 reward hacking 的一个来源", "D. 模型形成长度偏置，倾向用冗余篇幅回答简单问题", "E. 训练损失更高"], a: [0, 2, 3], e: "只用长回复训练会带来长度偏置与冗长，后续奖励模型也会放大；不是损失变高。答案 A、C、D。E错误：损失高低与回复长短没有必然关系，长回复条数少时平均损失反而可能更低；B错误：长度偏置改变的是回答风格分布，不会让模型听不懂指令。", t: 9, n: {"A": "用长短配对数据与按长度分桶采样缓解", "B": "长度偏置改变的是回答风格分布，不会让模型听不懂指令", "C": "奖励模型也会偏爱长回答，放大成 reward hacking", "D": "形成长度偏置，简单问题也用冗余篇幅", "E": "损失高低与回复长短没有必然关系，长回复条数少时平均损失反而可能更低"}, d: "高" },
  { q: "按正文口径，会话记忆、偏好记忆、事实记忆应该怎么分层存放？", o: ["A. 全部放云端", "B. 全部放内存", "C. 全部写进模型权重", "D. 会话在内存、偏好在本地可删、事实在云端按合同保留", "E. 全部塞进系统提示词随请求携带，不需要单独的存储与删除机制"], a: [3], e: "单选。答案 D。A 错误：会把最敏感的一层也带出设备；B 错误：设备重启就丢了；C 错误：写权重不可删除也不可追溯；E 错误：提示词只是载体不是存储，会话结束即丢，也做不到分层保留期与可删除。D：分层存放，才能同时兼顾体验、离线与隐私。", t: 13, n: {"A": "会把最敏感的一层也带出设备。", "B": "设备重启就丢了。", "C": "写权重不可删除也不可追溯。", "D": "分层存放，才能同时兼顾体验、离线与隐私。", "E": "提示词只是载体不是存储，会话结束即丢，做不到分层保留与可删除。"}, d: "低" },
  { q: "在 SFT 数据里加入大量统一措辞的安全拒绝样本，可能的副作用与对策包括？", o: ["A. 安全样本占比过高会挤压通用指令信号，专业能力轻微退化", "B. 应补充同话题的可答边界样本教它区分", "C. 拒答样本必须删掉才能避免过度拒答", "D. 模型把话题关键词与拒答强关联，误伤含同名词的合法提问", "E. 统一措辞的免责段落容易被背诵，近义提问输出几乎相同的拒答文本"], a: [0, 1, 3, 4], e: "拒答样本要控配比、补同话题的可答边界；全删会让有害请求失去拦截，全用统一措辞又会过拒与背模板。答案 A、B、D、E。C 错误：删光安全样本会让有害请求直接得到回答，正确做法是控制配比并补边界样本，而不是清零。", t: 9, n: {"A": "安全样本占比过高会挤压通用指令信号", "B": "补同话题的可答边界样本，教它区分", "C": "删光安全样本会让有害请求直接得到回答，正确做法是控制配比并补边界样本，而不是清零", "D": "话题关键词与拒答强关联，误伤合法提问", "E": "免责段落被背诵，近义提问输出几乎相同的拒答"}, d: "高" },
  { q: "提升指令数据多样性，有效的做法包括？", o: ["A. 按语义聚类采样，避免同一意图被重复堆量", "B. 引入不同来源模型生成的回复，减少单一风格主导", "C. 把同一问题的二十个近义改写一起塞进训练集", "D. 对任务类型、回复长度、语气风格分别做配比统计", "E. 对同一批文档反向合成多种问法的指令"], a: [0, 1, 3, 4], e: "多样性要动语义与来源：按意图聚类、换生成家族、按任务/长度/语气配比；近义改写只是表面扰动。答案 A、B、D、E。C 错误：近义改写只是表面扰动，语义高度同质，堆量会稀释有效梯度并加重记忆化。", t: 1, n: {"A": "按语义聚类采样，避免同一意图被重复堆量", "B": "混入不同来源模型的回复，减少单一风格主导", "C": "近义改写只是表面扰动，语义高度同质，堆量会稀释有效梯度并加重记忆化", "D": "对任务类型、长度、语气分别做配比统计", "E": "对同一批文档反向合成多种问法"}, d: "中" },
  { q: "几千条指令数据训完，通用问答明显退化但业务题几乎全对，最可能的原因是？", o: ["A. batch size 太大", "B. 基座模型本身能力不够", "C. 学习率设得太小", "D. 数据覆盖过窄叠加训练轮次过多，模型记住了训练分布", "E. 没有对 user 段做损失掩码"], a: [3], e: "单选。少量数据训到业务全对、通用全崩，典型是覆盖窄加轮次多，模型记住了训练分布。答案 D。A 错误：批大小与是否记住训练集没有直接关系；B 错误：基座弱不会让原本具备的能力突然不见；C 错误：学习率过小表现为欠拟合而不是背题；E 错误：掩掉非 assistant 段本就是正确做法，与这种退化无因果。", t: 1, n: {"A": "批大小与是否记住训练集没有直接关系", "B": "基座弱不会让原本具备的能力突然不见", "C": "学习率过小表现为欠拟合而不是背题", "D": "数据覆盖窄加上轮次过多，模型记住了训练分布", "E": "掩掉非 assistant 段本就是正确做法，与这种退化无因果"}, d: "高" },
  { q: "把通用模型微调成法律专岗后其他领域明显变差，合理的解释与缓解是？", o: ["A. 混入一部分通用指令数据可以兜底", "B. 全参微调比只训旁路参数更容易出现这种遗忘", "C. 上线前要对旧能力做回归评测，而不是只测专项指标", "D. 把微调学习率调大，专业能力涨得更快，同时能减少对通用能力的覆盖", "E. 单领域数据占比过高会造成通用能力的分布损失"], a: [0, 1, 2, 4], e: "单领域微调会带来通用能力遗忘：混通用数据、降学习率、只训旁路，上线前跑旧能力回归。答案 A、B、C、E。D错误：加大学习率会加重遗忘，方向正好相反；缓解靠数据配比、更小的学习率或 LoRA 这类约束更新范围的手段。", t: 9, n: {"A": "混入一定比例通用指令数据兜底", "B": "全参微调比只训旁路更容易遗忘", "C": "上线前对旧能力做回归评测", "D": "加大学习率会加重遗忘，方向正好相反；缓解靠数据配比、更小的学习率或 LoRA 这类约束更新范围的手段", "E": "单领域占比过高造成通用能力损失"}, d: "高" },
  { q: "给 AI 的规格里，验收条款应该写成什么？", o: ["A. 形容词越多越好", "B. 只写「做好看点」", "C. 只写截止日期", "D. 可判定的条件、数值范围与正反例", "E. 写清「尽快完成」"], a: [3], e: "单选。答案 D。A 错误：不可判定的描述没法验收；B 错误：太模糊，无法测试；C 错误：日期不是质量条款；E 错误：没有可判定标准。D：规格是给 AI 的接口，写不清就会返工。", t: 14, n: {"A": "不可判定的描述没法验收。", "B": "太模糊，无法测试。", "C": "日期不是质量条款。", "D": "规格是给 AI 的接口，写不清就会返工。", "E": "没有可判定标准。"}, d: "高" },
  { q: "奖励模型分数一路上升，下列哪些是 reward hacking 的典型征兆？", o: ["A. 多个独立奖励模型对同一批回答给出明显分歧的评分", "B. 裁判分数与人类偏好在各阶段都严格一致", "C. 回答长度持续膨胀而内容越来越空", "D. 开头堆免责、复述提问来骗取「结构完整」加分", "E. 自动分数上升的同时人工盲评胜率下降"], a: [0, 2, 3, 4], e: "reward hacking 的定义就是自动分与人类偏好脱钩；集成裁判能暴露只讨好单一打分器的策略。答案 A、C、D、E。B说反了：自动分数与人类偏好脱钩正是 reward hacking 的定义；A 是 ensemble 裁判能暴露「策略只讨好某一个打分器」的信号。", t: 9, n: {"A": "多个独立奖励模型对同一批回答分歧明显", "B": "严格一致说明没在 hacking，正是反例", "C": "长度持续膨胀而内容越来越空", "D": "开头堆免责、复述提问骗结构分", "E": "自动分涨的同时人工盲评胜率下降"}, d: "高" },
  { q: "关于预训练与 SFT 的分工，下列说法正确的有？", o: ["A. 预训练负责注入知识与语言能力", "B. SFT 负责教模型调用知识的方式与对话格式", "C. SFT 通常在预训练得到的基座模型上继续训练", "D. SFT 可以跳过预训练，从零训练出助手模型", "E. 两者的分工是预训练教对话格式、SFT 注入知识"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：预训练读海量文本，注入知识与语言能力。B 正确：SFT 教怎么当助手——调用方式与格式。C 正确：SFT 是在基座上继续训练。D 错误：没有预训练基座，SFT 无从谈起。E 错误：分工说反了，预训练注入知识，SFT 教格式。", t: 9, n: {"A": "预训练注入知识", "B": "SFT 教方式与格式", "C": "SFT 在基座上继续训练", "D": "没有基座就没有 SFT", "E": "分工说反"}, d: "低" },
  { q: "微调数据质量与数量的关系是什么？", o: ["A. 数量比质量更值得优先投入", "B. 质量只影响训练速度，不影响效果", "C. 数据越多效果越好，错标的影响可以忽略", "D. 质量比数量更重要，错标会直接教坏模型", "E. 错标在大数据量下会被自动纠正"], a: [3], e: "单选。答案 D。A 错误：低质量数据再多也只是把错误模式学得更牢，优先级反了；B 错误：错标直接改变学习目标，影响的是效果不是速度；C 错误：错标不会被数量稀释，反而随数据量被学得更充分；E 错误：训练没有自动纠错机制，错标要靠清洗与抽检发现。D：质量优先，错标会直接教坏模型。", t: 9, n: {"A": "低质量数据再多也只是把错误模式学得更牢。", "B": "错标改变学习目标，影响效果不是速度。", "C": "错标不会被数量稀释。", "D": "质量优先，错标会直接教坏模型。", "E": "训练没有自动纠错机制，错标要靠清洗与抽检。"}, d: "低" },
  { q: "经过可验证奖励训练后，模型仍会出现「过程错、答案对」，最合理的解释是？", o: ["A. 采样温度设得太高", "B. 思维链太长导致注意力丢失", "C. 过程奖励模型打分过严", "D. 奖励只校验最终答案，正确的过程并不是拿到奖励的必要条件", "E. 训练集里难题不够多"], a: [3], e: "单选。只校验最终答案时，过程对不是拿奖励的必要条件，模型可以蒙对。答案 D。A 错误：温度只改变采样随机性，不改变奖励结构；B 错误：注意力丢失通常导致答错而非蒙对；C 错误：过程打分过严恰恰会抑制蒙对；E 错误：难度不足影响的是正确率，不造成过程与答案脱节。", t: 4, n: {"A": "温度只改变采样随机性，不改变奖励结构", "B": "注意力丢失通常导致答错而非蒙对", "C": "过程打分过严恰恰会抑制蒙对", "D": "奖励只校验最终答案，过程对不是拿奖励的必要条件", "E": "难度不足影响的是正确率，不造成过程与答案脱节"}, d: "高" },
  { q: "关于 temperature（温度）参数，下列说法正确的有？", o: ["A. temperature 控制采样分布的平滑程度与随机性", "B. 温度越高，输出通常越随机、越多样", "C. temperature 是用于调整模型参数量的架构参数", "D. temperature 用于控制上下文窗口的大小", "E. temperature 是控制训练轮数的训练参数"], a: [0, 1], e: "答案 A、B。A 正确：温度只改变采样分布的形状。B 正确：高温拉平分布，输出更随机多样；低温更集中。C 错误：参数量由架构决定，与温度无关。D 错误：上下文窗口由模型决定，温度改不了。E 错误：温度是推理时的采样参数，不是训练参数。", t: 11, n: {"A": "调分布平滑与随机性", "B": "高温更随机多样", "C": "参数量由架构决定", "D": "窗口与温度无关", "E": "温度是推理参数"}, d: "低" },
  { q: "关于对齐税（Alignment Tax），下列说法正确的有？", o: ["A. 对齐税指对齐训练带来的部分能力下降等代价", "B. 对齐后某些能力基准分数下降是对齐税的常见表现", "C. 使用更高质量的对齐数据可以减轻对齐税", "D. 对齐税指调用大模型 API 时支付的商业费用", "E. 对齐训练只提升各项能力，不带来任何代价"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：对齐税是对齐训练付出的能力代价。B 正确：部分基准分数下降是常见表现。C 正确：更高质量、更多样的对齐数据能减轻这一代价。D 错误：对齐税是能力层面的代价，不是商业收费。E 错误：对齐在提升安全性的同时可能牺牲部分能力表现，并非没有代价。", t: 9, n: {"A": "对齐税=对齐的能力代价", "B": "表现为部分基准掉分", "C": "高质量对齐数据可减轻", "D": "不是 API 商业费用", "E": "对齐有代价，并非只赚不赔"}, d: "低" },
  { q: "关于提示注入（prompt injection），下列说法正确的有？", o: ["A. 提示注入的本质是把不可信的数据混进了指令通道", "B. 攻击指令可能藏在模型读取的网页、文档等外部内容里", "C. 提示注入的成因是模型参数量太大", "D. 提示注入的成因是训练数据太少", "E. 提示注入指模型输出的格式不规范"], a: [0, 1], e: "答案 A、B。A 正确：注入是指令与数据的边界问题——不可信数据被当成指令执行。B 正确：网页、文档等外部内容都是常见注入载体。C 错误：参数规模不是注入的成因，注入与模型强弱无关。D 错误：数据量不改变指令与数据的边界。E 错误：格式不规范是生成质量问题，不是提示注入。", t: 5, n: {"A": "不可信数据混进指令通道", "B": "网页文档是常见载体", "C": "与参数量无关", "D": "与数据量无关", "E": "格式问题不是注入"}, d: "低" },
  { q: "对齐版本上线前的安全评测，最可靠的做法是？", o: ["A. 只测英文单轮直接提问", "B. 让模型自己评估有没有安全风险", "C. 只看上线后的用户投诉量", "D. 只用公开红队数据集跑一遍看通过率", "E. 在固定的同一题集上同时报有害率与误拒率，并另设含敏感词的正常任务集专测误伤"], a: [4], e: "单选。安全评测要固定同一题集，同时看有害率与误拒率，并用含敏感词的正常任务测误伤。答案 E。A 错误：多语言与多轮追问是主要漏点；B 错误：模型自评系统性偏乐观；C 错误：投诉是被看到的极小且有偏的样本，且严重滞后；D 错误：公开集覆盖窄又容易被针对性优化，打不穿只说明当前这批攻击失效。", t: 5, n: {"A": "多语言与多轮追问是主要漏点", "B": "模型自评系统性偏乐观", "C": "投诉是被看到的极小且有偏的样本，且严重滞后", "D": "公开集覆盖窄又容易被针对性优化，打不穿只说明当前这批攻击失效", "E": "同一题集上同时报有害率与误拒率，另设正常任务集测误伤"}, d: "高" },
  { q: "模型顺着用户的错误前提往下答、用户一反问就立刻改口，关于这一现象正确的有？", o: ["A. 这属于对齐带来的行为问题，而不是知识缺失", "B. 评测时应专门构造用户给出错误前提的题目来量化它", "C. 在标注指南里明确惩罚迎合错误前提，比事后加一层拒答更有效", "D. 该现象只出现在开放写作类任务，数学和代码上不存在", "E. 偏好标注里自信、附和用户的回答常被排在前面，模型学到了讨好"], a: [0, 1, 2, 4], e: "迎合用户错误前提是对齐带来的行为问题，不是知识缺失；评测要专门构造错误前提题。答案 A、B、C、E。D错误：可验证任务上同样存在——用户声称答案应该是 7 时，模型可能把正确的推导改成迎合 7，只是判分器能兜住一部分。", t: 0, n: {"A": "属对齐带来的行为问题，不是知识缺失", "B": "专门构造错误前提题来量化它", "C": "标注指南里明确惩罚迎合，比事后加拒答有效", "D": "可验证任务上同样存在——用户声称答案应该是 7 时，模型可能把正确的推导改成迎合 7，只是判分器能兜住一部分", "E": "偏好标注里自信附和的回答常被排前面"}, d: "高" },
  { q: "用大模型做自动评审（LLM-as-judge）时，关于偏置及其处理，正确的有？", o: ["A. 长度与风格偏置：更长、排版更花的答案容易拿高分", "B. 自我偏好：评审模型偏爱自己或同族模型的输出", "C. 换更强的评审模型，这些偏置会消失", "D. 应抽样与人工评审对齐，用一致率给自动分数标定可信区间", "E. 位置偏置：交换两个候选的顺序重测，结论不稳的样本判为无效"], a: [0, 1, 3, 4], e: "裁判偏置要用机制去偏：换序、换家族、人工锚定；换更强模型不等于偏置消失。答案 A、B、D、E。C 错误：更强的评审模型仍有自身偏好，只能缓解；必须靠机制性去偏（随机化位置、控制长度）加人工锚点。", t: 0, n: {"A": "长度与风格偏置：更长更花更容易拿高分", "B": "自我偏好：偏爱自己或同族输出", "C": "更强的评审模型仍有自身偏好，只能缓解；必须靠机制性去偏（随机化位置、控制长度）加人工锚点", "D": "抽样与人工对齐，用一致率给分数标定", "E": "位置偏置：换序重测，不稳的样本判无效"}, d: "中" },
  { q: "评测一个后训练版本是否真的更好，合理的做法包括？", o: ["A. 评测集要与训练数据做污染检查，重复题目会把对齐评成能力", "B. 同一套题在对齐前后各跑一次，才能把能力提升与对齐提升分开", "C. 公开榜单分数涨了，就说明对齐做得更好", "D. 分层评测：单轮指令跟随、多轮一致性、安全边界、长尾任务分别看", "E. 尽量用成对比较而不是绝对打分，绝对分对提示措辞太敏感"], a: [0, 1, 3, 4], e: "后训练评测要防污染、对齐前后同题对比、分层看能力与安全，不能只看公开榜涨分。答案 A、B、D、E。C错误：榜单混着能力、格式熟悉度和数据泄漏，而对齐的收益常体现在「不该答的不答、该拒的准拒」上，榜单对此几乎不敏感。", t: 9, n: {"A": "评测集要与训练数据做污染检查", "B": "对齐前后各跑一次，才能分开两种提升", "C": "榜单混着能力、格式熟悉度和数据泄漏，而对齐的收益常体现在「不该答的不答、该拒的准拒」上，榜单对此几乎不敏感", "D": "分层评测：单轮、多轮、安全、长尾分开看", "E": "用成对比较，别用绝对打分"}, d: "中" },
  { q: "关于 LoRA 的“低秩”假设，正确的有？", o: ["A. rank 越大效果越好，而且不用担心过拟合", "B. LoRA 把要学的权重变化拆成 ΔW = B·A 两个窄矩阵相乘", "C. 秩 r 远小于隐藏维度 d，所以可训练参数远少于全参微调", "D. 训练时要显式存下一个完整的 d×d 的 ΔW 大矩阵", "E. 基座权重全程冻结，ΔW 只作为旁路叠加在输出上"], a: [1, 2, 4], e: "LoRA 学的是低秩 ΔW=B·A，不落 d×d 大矩阵；rank 越大越容易过拟合。答案 B、C、E。D错误：ΔW 从不落成 d×d 大矩阵，存储与训练都只碰 B、A 两个窄矩阵；A错误：rank 上去后容量与噪声一起涨，小数据集更容易过拟合，要按业务评测集来定。", t: 9, n: {"A": "rank 上去后容量与噪声一起涨，小数据集更容易过拟合，要按业务评测集来定", "B": "把权重变化拆成两个窄矩阵相乘", "C": "秩远小于隐藏维度，可训参数远少于全参", "D": "ΔW 从不落成 d×d 大矩阵，存储与训练都只碰 B、A 两个窄矩阵", "E": "基座冻结，ΔW 只作为旁路叠加"}, d: "中" },
  { q: "关于训练语料去重，下列说法正确的有？", o: ["A. 去重能降低模型对重复样本的逐字记忆化", "B. 去重有助于提高训练数据的多样性", "C. 去重有助于避免评测污染", "D. 去重的主要目的是让训练集分布更接近评测集", "E. 去重能减少模型的参数量"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：重复样本会被逐字背诵，去重降低记忆化。B 正确：去掉重复，多样性提高，token 预算也不再虚高。C 正确：去重（含对评测集的去重）有助于避免评测污染。D 错误：去重是降重复，不是拉近训练集与评测集的分布，刻意接近评测集反而是污染。E 错误：去重处理的是数据，不改变模型规模。", t: 9, n: {"A": "降低逐字记忆化", "B": "提高多样性", "C": "有助于避免评测污染", "D": "不是拉近评测分布", "E": "不改模型规模"}, d: "低" },
  { q: "关于训练数据配比，下列说法正确的有？", o: ["A. 数据配比指不同来源、语言和任务在训练集中的比例", "B. 数据配比影响模型的能力倾向，决定哪些能力被强化、哪些被挤掉", "C. 数据配比指模型层数与注意力头数的比例", "D. 数据配比指学习率曲线的形状", "E. 数据配比指每个 batch 里样本的排列顺序"], a: [0, 1], e: "答案 A、B。A 正确：配比就是来源、语言、任务在训练集中的占比。B 正确：配比决定模型更像谁、哪些能力被挤掉。C 错误：层数与头数是架构参数，不是数据配比。D 错误：学习率曲线是优化调度。E 错误：样本排列顺序不是配比，配比是比例而非顺序。", t: 9, n: {"A": "来源/语言/任务的比例", "B": "决定能力倾向", "C": "那是架构参数", "D": "那是优化调度", "E": "顺序不是配比"}, d: "低" },
  { q: "在“全参微调 / LoRA / 只调嵌入”之间做选择，合理的判据有？", o: ["A. 显存是硬约束：全参要同时装权重、梯度和优化器状态", "B. 要按租户或任务热切换个性化，不适合全参，适合一个基座配多适配器", "C. 数据量上来之后，LoRA 与全参微调在各种任务上的效果差距会自行消失", "D. 任务分布与基座差得远、数据量大、要改深层能力时，倾向全参或继续预训练", "E. 只有几百到几万条样例、目标只是行为和格式时，应该直接上全参微调"], a: [0, 1, 3], e: "全参贵的在显存与遗忘，LoRA 适合小数据与热切换；改深层表征仍要全参或继续预训练。答案 A、B、D。E错误：这种小数据场景全参既费显存又容易过拟合与遗忘，性价比远不如旁路；C错误：数据规模与任务深度是两回事，需要改深层表征时旁路容量有限。D、A、B 分别对应能力差距、显存约束与部署形态三条判据。", t: 9, n: {"A": "显存是硬约束：全参要同时装权重、梯度与优化器状态", "B": "要按租户或任务热切换，适合一个基座配多个适配器", "C": "数据规模与任务深度是两回事，需要改深层表征时旁路容量有限。", "D": "分布差得远、数据量大、要改深层能力时倾向全参或继续预训练", "E": "这种小数据场景全参既费显存又容易过拟合与遗忘，性价比远不如旁路"}, d: "中" },
  { q: "关于灾难性遗忘的表现与检测，正确的有？", o: ["A. 只看训练损失曲线足以发现遗忘", "B. 只训旁路比全参微调更容易出现灾难性遗忘", "C. 调小学习率、按比例混回原分布数据、只训旁路，都是常用缓解手段", "D. 微调后旧任务与通用评测掉分、新任务也没涨多少，是典型表现", "E. 检测要留一组旧能力回归集，训练前后同口径各跑一遍"], a: [2, 3, 4], e: "遗忘发生在没参与训练的能力上，训练损失看不出来；要留旧能力回归集。答案 C、D、E。A错误：遗忘发生在没参与训练的能力上，训练损失对它完全不敏感，必须靠外部回归集；B错误：方向说反，基座参数被动过才有大范围遗忘的风险，旁路恰恰是缓解手段。D、E、C 与本库“全参微调容易发生灾难性遗忘”的口径一致。", t: 9, n: {"A": "遗忘发生在没参与训练的能力上，训练损失对它完全不敏感，必须靠外部回归集", "B": "方向说反，基座参数被动过才有大范围遗忘的风险，旁路恰恰是缓解手段。", "C": "调小学习率、混回原分布、只训旁路都是常用缓解", "D": "旧任务与通用评测掉分、新任务也没涨，是典型表现", "E": "留一组旧能力回归集，训练前后同口径各跑一遍"}, d: "中" },
  { q: "关于微调数据的格式规范，下列说法正确的有？", o: ["A. 微调数据的对话模板应与基座模型保持一致", "B. SFT 通常只在 assistant 回复部分计算损失", "C. 微调数据通常组织成 system/user/assistant 等角色的对话格式", "D. 训练与推理可以各用一套互不相关的对话模板而不影响效果", "E. 数据中的特殊 token 可以随意替换成普通词语"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：模板与基座一致是 SFT 的基本要求。B 正确：通常只对 assistant 段算损失，user 与 system 部分做 mask。C 正确：对话数据按 system/user/assistant 角色组织。D 错误：模板错位会让模型在推理时找不到正确的续写边界，直接影响效果。E 错误：特殊 token 承担对话边界语义，随意替换会破坏格式。", t: 9, n: {"A": "模板与基座一致", "B": "只在 assistant 段算损失", "C": "按角色组织对话数据", "D": "模板错位直接掉效果", "E": "特殊 token 不能随意替换"}, d: "低" },
  { q: "评测集里的黄金集通常由谁标注？", o: ["A. 双人独立标注，分歧再仲裁", "B. 模型自动生成，不需要人看", "C. 按用户点赞数决定", "D. 按训练损失高低决定", "E. 由产品经理按经验挑几条"], a: [0], e: "单选。答案 A。B 错误：黄金集要的是权威判据，不能只靠自评；C 错误：点赞受表面特征影响，不等于正确；D 错误：训练损失不是答案质量标签；E 错误：经验挑选不能替代双人标注与仲裁。A：黄金集的价值在判据可靠，不在数量多。", t: 4, n: {"A": "黄金集的价值在判据可靠，不在数量多。", "B": "黄金集要的是权威判据，不能只靠自评。", "C": "点赞受表面特征影响，不等于正确。", "D": "训练损失不是答案质量标签。", "E": "经验挑选不能替代双人标注与仲裁。"}, d: "低" },
  { q: "微调模型上线前的评测门禁，合理的有？", o: ["A. 门禁里要有安全项与格式项，比如拒答率和结构合法性", "B. 自动指标之外再留一批人工抽评", "C. 公开榜单分数更高就可以跳过业务评测直接上线", "D. 门禁先看总分，分域切片等上线后再补", "E. 与线上基线同口径对比，关键指标跌破阈值就直接拦住"], a: [0, 1, 4], e: "发布门禁要安全项、格式项、人工抽评、分域切片与线上基线对比；公开榜不能替代。答案 A、B、E。C错误：榜单与自家业务分布脱节，替代不了业务门禁，与本库“评测集应以自身业务为核心”的口径一致；D错误：上线前不做分域切片，就可能让某一块能力悄悄退步。", t: 9, n: {"A": "门禁要有安全项与格式项，比如拒答率与结构合法性", "B": "自动指标之外再留一批人工抽评", "C": "榜单与自家业务分布脱节，替代不了业务门禁，与本库“评测集应以自身业务为核心”的口径一致", "D": "上线前不做分域切片，就可能让某一块能力悄悄退步", "E": "与线上基线同口径对比，跌破阈值就拦住"}, d: "中" },
  { q: "上线后发现“某项能力掉了”，合理的定位手段有？", o: ["A. 一条用户投诉就足以定根因，不用再看日志与回放", "B. 按业务域与意图切片看指标，先确认是哪一块退化", "C. 把数据、超参、模板、模型版本的变更记录与指标时间线对齐", "D. 用固定回归集定期回放，隐性退化能更早暴露", "E. 总体平均分没掉，说明能力没有退化"], a: [1, 2, 3], e: "能力掉了要按域切片、对齐变更时间线、用固定回归集回放；总分与单条投诉都不够。答案 B、C、D。E错误：总分是各域的加权平均，小域塌陷会被大域涨分掩盖；A错误：投诉只是线索，定根因要能复现并归因到某一次具体变更。B、C、D 是定位三件套。", t: 0, n: {"A": "投诉只是线索，定根因要能复现并归因到某一次具体变更。", "B": "按业务域与意图切片，先确认哪块退化", "C": "变更记录与指标时间线对齐", "D": "固定回归集定期回放，隐性退化更早暴露", "E": "总分是各域的加权平均，小域塌陷会被大域涨分掩盖"}, d: "高" },
  { q: "微调效果不达预期，值得先查的点有？", o: ["A. 训练是欠拟合还是过拟合，要看验证曲线而不是训练损失", "B. 数据质量与标注一致性，脏数据比少数据更致命", "C. 评测集测的是不是目标分布，指标可能压根测错了地方", "D. 基座本身没有的能力，靠加大微调数据量可以补出来", "E. 把 rank 从 16 提到 64，这类效果问题通常就解决了"], a: [0, 1, 2], e: "微调不达预期先查验证曲线、数据质量与评测分布；加 rank 或堆数据补不出基座没有的能力。答案 A、B、C。D错误：旁路微调是重新组织已有表征，基座没有的底子补不出来，与本库“注入新知识应使用 RAG”的口径一致；E错误：容量不是瓶颈时加大 rank 只带来噪声和过拟合。B、C、A 是排查的先后顺序，也与“数据质量比数量更重要”的说法一致。", t: 9, n: {"A": "看验证曲线判断欠拟合还是过拟合，而不是训练损失", "B": "数据质量与标注一致性，脏数据比少数据更致命", "C": "评测集未必测的是目标分布，指标可能测错了地方", "D": "旁路微调是重新组织已有表征，基座没有的底子补不出来，与本库“注入新知识应使用 RAG”的口径一致", "E": "容量不是瓶颈时加大 rank 只带来噪声和过拟合。"}, d: "高" },
  { q: "关于模型量化（Quantization），下列说法正确的有？", o: ["A. 量化用更低位数表示权重或激活，例如把 FP16 转成 INT8/INT4", "B. 量化能降低显存占用与带宽开销", "C. 量化指删除模型的一部分层", "D. 量化指把模型权重从 FP16 换成 FP32", "E. 低位量化可能带来一定的精度损失"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：量化就是降低权重或激活的数值精度。B 正确：低精度更省显存与带宽。E 正确：量化是拿精度换空间，压得太低会损失效果，落地后要重测。C 错误：删除部分层是剪枝，不是量化。D 错误：FP16 换 FP32 是升精度，方向反了。", t: 8, n: {"A": "低位数表示权重/激活", "B": "省显存与带宽", "C": "那是剪枝", "D": "那是升精度", "E": "可能有精度损失"}, d: "低" },
  { q: "关于知识蒸馏（Distillation），下列说法正确的有？", o: ["A. 蒸馏用大模型的输出分布训练更小的学生模型", "B. 学生学的是教师的输出分布与行为套路，不是全部知识的逐字复制", "C. 蒸馏指把教师的参数直接复制给一个更大的模型", "D. 蒸馏指对教师模型自身再做一遍预训练", "E. 学生模型可能继承教师模型的错误与幻觉"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：蒸馏是大教小，用教师输出分布训练学生。B 正确：学生学的是分布与套路，能力通常会打折。E 正确：学生的错会与教师的错一致，幻觉一并继承。C 错误：方向反了，蒸馏是教更小的模型，也不是直接复制参数。D 错误：蒸馏训练的是学生，不是把教师再训一遍。", t: 8, n: {"A": "教师分布教小学生", "B": "学分布套路，非逐字复制", "C": "方向反且非复制参数", "D": "训的是学生不是教师", "E": "错误与幻觉会继承"}, d: "低" },
  { q: "关于激活重计算（gradient checkpointing），正确的有？", o: ["A. 重计算会改变梯度的数学结果，训练效果与不开时明显不同", "B. 可以只重算注意力这类选择性策略，与其他省显存手段搭配使用", "C. 前向时只存少量检查点，反向时把激活重新算出来，用算力换显存", "D. 激活显存只由参数量决定，与序列长度无关", "E. 开启后单步时间变长，换来的是能跑更长上下文或更大 batch"], a: [1, 2, 4], e: "激活重计算用一次额外前向换显存，梯度等价；激活随序列与 micro batch 涨。答案 B、C、E。D错误：激活是逐 token 产生的，序列长度和 micro batch 一涨它就涨，这正是长序列微调的痛点；A错误：重算出来的是同一批激活，梯度在数学上等价，差别只剩浮点误差。C、E、B 是它的机制、收益与常见搭配。", t: 12, n: {"A": "重算出来的是同一批激活，梯度在数学上等价，差别只剩浮点误差。", "B": "可只重算注意力这类选择性策略，配合其他省显存手段", "C": "前向只存少量检查点，反向重算激活，用算力换显存", "D": "激活是逐 token 产生的，序列长度和 micro batch 一涨它就涨，这正是长序列微调的痛点", "E": "单步变慢，换来更长上下文或更大 batch"}, d: "中" },
  { q: "关于 Temperature 与分布熵的关系，正确的有？", o: ["A. Temperature 为 0 时等价于贪心解码", "B. 温度只影响排序，不改变各候选之间的概率比例", "C. 温度调高会扩大模型词表的规模", "D. 温度调低，分布变尖锐，熵下降，Top_p 保留的候选随之变少", "E. 温度调高，分布被拉平，熵上升，长尾词更容易被选中"], a: [0, 3, 4], e: "温度缩放全部 logits、改变概率比值：调高变平、调低变尖，词表不变。答案 A、D、E。B错误：温度缩放的是 logits，T 变大会改变任意两候选的概率比值；C错误：词表是固定的，温度只改变分布形状。", t: 11, n: {"A": "温度为 0 等价于贪心", "B": "温度缩放的是 logits，T 变化会改变任意两候选的概率比值", "C": "词表是固定的，温度只改变分布形状", "D": "温度调低则分布变尖、熵下降、Top_p 候选变少", "E": "温度调高则分布拉平、长尾词更容易被选中"}, d: "中" },
  { q: "要让一个问答服务尽可能“同输入同输出”，工程上合理的做法有？", o: ["A. temperature 设为 0 之后，部署形态带来的差异消失，集群固定与否影响不大", "B. 低温度或贪心，配合固定部署形态，减少随机选词与数值路径的漂移", "C. 结果落缓存：命中缓存直接返回上次答案", "D. 把 prompt 逐字节固定住，就可以不考虑硬件与驱动的差异", "E. 业务侧加幂等或去重键，防止重试造成重复副作用"], a: [1, 2, 4], e: "确定性要温度归零、固定部署形态、缓存结果；温度归零只去掉采样随机性，prompt 固定也只锁输入。答案 B、C、E。A错误：温度设为 0 只消除采样随机性，不同集群、硬件与内核的浮点数值路径仍可能让结果漂移，部署形态必须固定；D错误：prompt 逐字节固定只保证输入一致，硬件、驱动与推理版本带来的数值差异仍会改变输出。B、C、E 成立：低温/贪心加固定部署减少漂移，缓存命中直接复用上次答案，幂等键防重试副作用。", t: 0, n: {"A": "温度归零只去掉采样随机性，硬件与数值路径的差异仍在，集群与部署形态必须固定", "B": "低温度或贪心加固定部署，减少漂移", "C": "结果落缓存，命中就直接返回上次答案", "D": "prompt 固定只锁输入，硬件、驱动与版本带来的数值差异仍会改变输出", "E": "业务侧加幂等键，防重试造成重复副作用"}, d: "中" },
  { q: "关于请求超时设置，下列说法正确的有？", o: ["A. 超时设置避免请求无限等待，超过时限就及时失败", "B. 超时是止损机制，不是性能优化手段", "C. 超时设置能提高模型的回答质量", "D. 超时设置用于延长模型的上下文长度", "E. 超时设置是训练超参数，影响训练轮数"], a: [0, 1], e: "答案 A、B。A 正确：超时给请求设止损点，到点失败，避免无限等待。B 正确：超时是止损，不提升性能。C 错误：超时不改变模型能力与回答质量。D 错误：上下文长度由模型决定，与超时无关。E 错误：超时是调用侧的客户端/服务参数，与训练无关。", t: 12, n: {"A": "避免无限等待，及时失败", "B": "止损而非优化", "C": "不改回答质量", "D": "与上下文无关", "E": "与训练无关"}, d: "低" },
  { q: "关于用参数获得确定性输出，正确的有？", o: ["A. 配 seed 可以锁住采样随机数，配合固定部署形态才有可复现性", "B. 调低 top-p 是收窄候选集，不等于去掉随机性", "C. 开启 Min_p 之后，输出就是确定性解码", "D. 把 top_p 设为 1 就等价于贪心解码", "E. 把 temperature 设为 0，走贪心路径，近似去掉采样随机性"], a: [0, 1, 4], e: "温度归零才是贪心；top-p 收窄候选、Min_p 仍是随机抽样，p=1 等于不截断。答案 A、B、E。C错误：Min_p 是截断阈值，仍然在剩下的候选里随机抽样，与确定性无关；D错误：p=1 等于不作截断的全量采样，确定性要温度归零。", t: 11, n: {"A": "seed 锁住采样随机数，配合固定部署才可复现", "B": "调低 top-p 是收窄候选集，不等于消除随机性", "C": "Min_p 是截断阈值，仍然在剩下的候选里随机抽样，与确定性无关", "D": "p=1 等于不作截断的全量采样，确定性要温度归零", "E": "温度设为 0 走贪心，近似去掉采样随机性"}, d: "中" },
  { q: "把 Presence、Frequency、Repetition 三个惩罚同时拉到很高，可能出现？", o: ["A. 惩罚只作用于实义词，不会碰到标点和格式符", "B. 三个惩罚都靠减法实现，叠加效果线性可预测", "C. 括号、引号、逗号这类结构 Token 被一起压低，JSON 与代码容易畸形", "D. 为避开高频词硬换生僻说法，可读性下降", "E. 模型被迫不断换新表达，用词发散但可能偏离原意"], a: [2, 3, 4], e: "三个惩罚同时拉高会压到标点与结构 token，造成 JSON/代码畸形与用词发散。答案 C、D、E。A错误：惩罚按“是否出现/出现几次”施加，不看词性，格式 Token 一样被压；B错误：Repetition Penalty 是乘法缩放（正 Logit 除以 γ），Presence 与 Frequency 才是减法，三者叠加不是线性叠加。", t: 11, n: {"A": "惩罚按“是否出现/出现几次”施加，不看词性，格式 Token 一样被压", "B": "Repetition Penalty 是乘法缩放（正 Logit 除以 γ），Presence 与 Frequency 才是减法，三者叠加不是线性叠加。", "C": "括号、引号、逗号被一起压低，JSON 与代码容易畸形", "D": "为避开高频词硬换生僻说法，可读性下降", "E": "被迫不断换新表达，用词发散但可能偏离原意"}, d: "高" },
  { q: "关于惩罚参数与 Temperature 的同时调整，正确的有？", o: ["A. 惩罚与温度作用在相同的对象上，改一个等于改两个", "B. 温度拉高让分布变平坦、鼓励换词，惩罚拉高压制已出现的词，两者方向可能互相拉扯", "C. 多数场景只调其中一个即可", "D. 三个惩罚可以同时生效，但方向要一致，别互相抵消", "E. 温度与惩罚同时调高，输出更容易复现"], a: [1, 2, 3], e: "温度作用于全部候选、惩罚只压已出现的 token；方向不一致会互相抵消。答案 B、C、D。E错误：两个都推高只会让分布更难预测，而不是更稳定；A错误：温度缩放全部候选的 Logits，惩罚只作用于已出现过的 Token，作用对象不同。", t: 11, n: {"A": "温度缩放全部候选的 Logits，惩罚只作用于已出现过的 Token，作用对象不同", "B": "温度拉高鼓励换词，惩罚压制已出现的词，方向会互相拉扯", "C": "多数场景只调其中一个即可", "D": "三个惩罚可同时生效，但方向要一致", "E": "两个都推高只会让分布更难预测，而不是更稳定"}, d: "中" },
  { q: "关于推理模型的思考 Token，下列说法正确的有？", o: ["A. 思考 Token 是推理模型生成的中间推理内容", "B. 思考 Token 通常计入输出 Token 一并计费", "C. 思考阶段会增加请求的总延迟", "D. 思考 Token 由用户手动提供，属于输入的一部分", "E. 思考 Token 是服务端预置的固定模板，并非模型生成"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：思考 token 是模型生成的中间推理内容。B 正确：它属于输出，按输出 token 计费。C 正确：思考阶段拉长整段请求的延迟。D 错误：思考 token 是模型生成的输出，不是用户提供的输入。E 错误：思考内容是模型逐 token 生成的，不是预置模板，只是默认不展示给用户。", t: 11, n: {"A": "思考 token=中间推理内容", "B": "计入输出计费", "C": "增加总延迟", "D": "是模型输出，不是用户输入", "E": "逐 token 生成，不是预置模板"}, d: "低" },
  { q: "关于 top-p 采样，下列说法正确的有？", o: ["A. top-p 采样只从累积概率达到 p 的候选集合里采样", "B. top-p 又叫核采样（nucleus sampling），保留的候选数量随概率分布动态变化", "C. top-p 指按概率从高到低取固定 k 个候选", "D. top-p 指每次只取概率最高的那一个 token", "E. top-p 指按输出长度对生成文本做截断"], a: [0, 1], e: "答案 A、B。A 正确：top-p 按累积概率 p 圈定候选再采样。B 正确：核采样的候选集大小随分布动态变化，比固定 top-k 更自适应。C 错误：取固定 k 个是 top-k 采样。D 错误：只取概率最高的一个是贪心解码。E 错误：按长度截断是长度限制，与采样策略无关。", t: 11, n: {"A": "累积概率 p 圈候选", "B": "核采样，候选数动态", "C": "那是 top-k", "D": "那是贪心", "E": "长度截断是另一回事"}, d: "低" },
  { q: "关于思考预算（effort 档位或思考 Token 上限），下列说法正确的有？", o: ["A. 思考预算用于限制模型内部推理的长度", "B. effort 档位是设置思考预算的一种常见方式", "C. 设置思考预算上限有助于控制延迟与成本", "D. 思考预算与最大输出长度是同一个参数", "E. 思考预算用于设置模型词表的大小"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：思考预算限制的是内部推理阶段的长度。B 正确：effort 档位是常见的预算设置方式。C 正确：设上限可以控制延迟与成本。D 错误：思考预算管内部推理阶段，最大输出长度管最终返回长度，是两个不同参数。E 错误：思考预算与词表大小无关。", t: 11, n: {"A": "限制内部推理长度", "B": "effort 档位是常见方式", "C": "上限控制延迟与成本", "D": "与最大输出长度是两个参数", "E": "与词表大小无关"}, d: "低" },
  { q: "关于 CoT 与 CoD，正确的有？", o: ["A. CoT 的输出更短、更省钱", "B. CoT 把推理过程一步步写出来，出错能定位到具体步骤", "C. CoD 只留每一步的极简草稿，砍掉解释性内容", "D. CoD 大幅降低 Token 消耗与延迟，精度与 CoT 相近", "E. CoD 是 CoT 的训练前置阶段，模型要先学会 CoD 再学会 CoT"], a: [1, 2, 3], e: "CoT 写全、CoD 压缩：CoD 省 token 与延迟，代价是中间依据不落纸。答案 B、C、D。E错误：CoD 是推理时的提示策略，不是训练阶段，不存在「先学 CoD 再学 CoT」的前置关系；A错误：CoT 的问题正是输出长、延迟高、费用贵，省的是 CoD。", t: 11, n: {"A": "CoT 的问题正是输出长、延迟高、费用贵，省的是 CoD", "B": "CoT 一步步写出来，出错能定位到具体步骤", "C": "CoD 只留极简草稿，砍掉解释性内容", "D": "CoD 大幅降低 token 与延迟，精度接近 CoT", "E": "CoD 是推理时的提示策略，不是 CoT 的训练前置阶段"}, d: "中" },
  { q: "在同一批任务上给 CoT 与 CoD 做选型，主要该看什么？", o: ["A. 选型只看模型的上下文窗口有多大", "B. 出错的代价高不高", "C. 延迟与吞吐要求", "D. 模型的参数量大小", "E. 结论是否需要被人逐步复核"], a: [1, 2, 4], e: "CoT/CoD 选型只看两件事：结论要不要逐步复核、量大不大且延迟敏不敏感。答案 B、C、E。D错误：正文的选型判断式只看两件事——要不要可回溯复核、是不是量大且延迟敏感，参数量既不决定轨迹写法，也不决定审计要求；A错误：要看结论是否需要逐步复核、出错代价与延迟要求。", t: 11, n: {"A": "要看结论是否需要逐步复核、出错代价与延迟要求", "B": "看错误代价高不高", "C": "看延迟与吞吐要求", "D": "正文的选型判断式只看两件事——要不要可回溯复核、是不是量大且延迟敏感，参数量既不决定轨迹写法，也不决定审计要求", "E": "看结论要不要被人逐步复核"}, d: "中" },
  { q: "针对输出可能被截断，下游合理的处理包括？", o: ["A. 对 JSON 做闭合校验，不通过就重问或走降级分支", "B. 判定被截断后重新发起请求，并给这一次留更宽的输出预算", "C. HTTP 状态 200 就说明内容完整", "D. 忽略结束原因，由前端把残缺的括号补全再交给下游", "E. 检查返回的结束原因是否为 max_tokens，而不是只看有没有报错"], a: [0, 1, 4], e: "截断要看结束原因与结构是否闭合；200 不代表内容完整，前端补括号会伪造合法 JSON。答案 A、B、E。C错误：200 只说明请求成功，内容仍可能因预算耗尽停在半句；D错误：前端硬补括号会造出一条模型从未生成过的“合法 JSON”，把截断伪装成正常结果，应当显式重试或降级。", t: 0, n: {"A": "对 JSON 做闭合校验，不通过就重问或降级", "B": "判定被截断后重发，并给更宽的输出预算", "C": "200 只说明请求成功，内容仍可能因预算耗尽停在半句", "D": "前端硬补括号会造出一条模型从未生成过的“合法 JSON”，把截断伪装成正常结果，应当显式重试或降级", "E": "看结束原因是不是 max_tokens，而不是只看有没有报错"}, d: "中" },
  { q: "关于 stop（停止序列）参数，下列说法正确的有？", o: ["A. stop 用于设置让生成终止的字符串", "B. 生成内容命中 stop 序列时，模型停止继续生成", "C. 命中的 stop 匹配串本身通常不出现在返回内容中", "D. stop 参数的作用是提高模型的采样温度", "E. 设置 stop 后模型会忽略该序列并继续生成到长度上限"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：stop 就是停止序列参数。B 正确：命中即终止生成。C 正确：匹配串本身通常被截掉，不在返回内容里。D 错误：采样温度由 temperature 控制，stop 管的是终止条件。E 错误：命中 stop 会截断生成，不会被忽略。", t: 11, n: {"A": "stop=停止序列", "B": "命中即终止生成", "C": "匹配串通常不在返回里", "D": "温度由 temperature 控制", "E": "命中 stop 会截断，不会被忽略"}, d: "低" },
  { q: "关于预训练的核心任务与产出，下列说法正确的有？", o: ["A. 预训练的核心任务是在海量文本上做下一词预测", "B. 预训练产出的是基座模型", "C. 按人类偏好给回答打分是预训练的核心任务", "D. 教模型按对话格式回答是预训练的核心任务", "E. 预训练通常以自监督方式学习，不需要人工标注的问答对"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：预训练就是海量文本上的文字接龙。B 正确：产出是基座模型。E 正确：下一词预测的标签来自文本本身，是自监督，无需人工标注问答对。C 错误：按偏好打分属于后训练的偏好对齐阶段。D 错误：教对话格式是 SFT 的事。", t: 1, n: {"A": "海量文本下一词预测", "B": "产出基座模型", "C": "那是偏好对齐", "D": "那是 SFT", "E": "自监督，无需标注问答"}, d: "低" },
  { q: "关于上下文缓存（Prompt Caching）的命中条件与收益，正确的有？", o: ["A. 语义相近的请求也能复用同一份前缀缓存", "B. 命中率取决于请求前缀的重叠程度，不是开关一开就全量生效", "C. 前缀要逐字节匹配才能命中，同一段 System Prompt 换个标点就失效", "D. 命中可降低首字延迟与调用成本", "E. 把长 System Prompt 固定在最前面、可变内容放在后面，命中率最高"], a: [1, 2, 3, 4], e: "前缀缓存只认逐字节一致的前缀：语义相近不算命中，静态内容放最前，可变内容往后放。答案 B、C、D、E。A错误：正文口径是前缀必须完全匹配，语义相似不算命中；其余四条与“任何请求都能 100% 命中”的误解相对。", t: 12, n: {"A": "正文口径是前缀必须完全匹配，语义相似不算命中；其余四条与“任何请求都能 100% 命中”的误解相对", "B": "命中率取决于前缀重叠程度，不是开关一开就全量生效", "C": "前缀要逐字节完全匹配，换个标点就失效", "D": "命中降低首字延迟与调用成本", "E": "长 System Prompt 固定在最前、可变内容放后面"}, d: "中" },
  { q: "关于约束解码的副作用，正确的有？", o: ["A. Schema 太复杂时，合法路径的组合空间变大，推理负担上升", "B. 加了约束之后，内容质量比不加约束更好", "C. 约束改变的是可选 Token 的集合，不改变模型对事实的掌握", "D. 该填数字的位置只剩少数合法 Token，模型可能硬编一个看起来合规的值", "E. 在合法候选很少的位置上，容易写出语法正确但内容空洞的模板句"], a: [0, 2, 3, 4], e: "约束解码只改可选 token 集合，治语法不治内容；复杂 schema 增加负担，候选太少会逼出空洞值。答案 A、C、D、E。B 错误：约束只保证格式合法，不能保证内容更好，甚至在强约束下更容易产出空洞套话。", t: 14, n: {"A": "schema 太复杂时合法路径变多，推理负担上升", "B": "约束只保证格式合法，不能保证内容更好，甚至在强约束下更容易产出空洞套话", "C": "约束只改可选 token 集合，不改事实掌握", "D": "该填数字的位置只剩少数候选，可能硬编一个", "E": "合法候选很少时，容易写出空洞的模板句"}, d: "中" },
  { q: "关于“Temperature 调高就更聪明、更有创造力”，正确的有？", o: ["A. 温度调低会提升模型的知识覆盖面", "B. 温度过高会把长尾低质量候选的概率抬上来", "C. 事实类问答把温度调高，不会提升事实正确率，只会提升跑偏概率", "D. 温度越高，模型的能力上限就越高", "E. 温度只改变分布形状，不改变模型学到的知识"], a: [1, 2, 4], e: "温度只改分布形状，不改知识：调高抬长尾噪声，事实正确率不会上升。答案 B、C、E。D错误：能力上限由模型与训练决定，温度只是在已有分布上做取舍；想要更靠谱的事实输出该靠检索与校验，不是加温度；A错误：温度不改知识，只改分布形状与采样。", t: 11, n: {"A": "温度不改知识，只改分布形状与采样", "B": "温度过高会把长尾低质量候选抬上来", "C": "事实问答调高温度只提升跑偏概率", "D": "能力上限由模型与训练决定，温度只是在已有分布上做取舍；想要更靠谱的事实输出该靠检索与校验，不是加温度", "E": "温度只改分布形状，不改模型学到的知识"}, d: "中" },
  { q: "对外报告模型评测结果时，为什么要固定并公开采样参数？", o: ["A. 报告里应写明档位、温度、max_tokens 等配置", "B. 固定参数加固定部署形态，别人才能复现你的结论", "C. 同模型同版本跑出来的分数天然可比，采样配置可以不写", "D. 同一模型同一提示词，换个温度就可能从及格线上下翻盘", "E. Temperature、top-p、Min_p 会显著改变输出分布，参数不同的分数不可直接比较"], a: [0, 1, 3, 4], e: "采样参数是评测条件的一部分：温度、top-p、max_tokens 不同，分数不可直接比较，报告要写清。答案 A、B、D、E。C错误：正文的实测口径就是“同模型不同配置结果差很多”，采样配置是评测的一部分，不写等于不给对照组。", t: 4, n: {"A": "写明档位、温度、max_tokens 这些配置", "B": "固定参数与部署形态，别人才复现得出", "C": "正文的实测口径就是“同模型不同配置结果差很多”，采样配置是评测的一部分，不写等于不给对照组", "D": "换个温度就可能从及格线上下翻盘", "E": "参数不同，分数不可直接比较"}, d: "中" },
  { q: "评测集分层（冒烟、回归、影子、黄金）的意义是什么？", o: ["A. 层数越多分数一定越高", "B. 只用黄金集就足够", "C. 分层只是为了省存储", "D. 不同层回答不同问题，不能互相替代", "E. 四层必须每次全跑"], a: [3], e: "单选。答案 D。A 错误：分层不直接提高分数；B 错误：黄金集小且贵，不适合每次改动都跑；C 错误：分层是决策流程，不是存储优化；E 错误：全跑成本高，应按改动与发布阶段选择。D：越靠近发布，用越权威的评测集。", t: 4, n: {"A": "分层不直接提高分数。", "B": "黄金集小且贵，不适合每次改动都跑。", "C": "分层是决策流程，不是存储优化。", "D": "越靠近发布，用越权威的评测集。", "E": "全跑成本高，应按改动与发布阶段选择。"}, d: "低" },
  { q: "关于 TPOT（Time Per Output Token），下列说法正确的有？", o: ["A. TPOT 指生成阶段每个 token 之间的平均间隔", "B. TPOT 影响流式输出时『字往外冒得快不快』的体感", "C. TPOT 指从发起请求到收到第一个 token 的首字延迟", "D. TPOT 指首字之后到生成结束的总时间", "E. TPOT 是训练阶段的损失指标"], a: [0, 1], e: "答案 A、B。A 正确：TPOT 是生成阶段每个 token 的平均间隔。B 正确：它决定字出来得跟不跟得上。C 错误：首字延迟是 TTFT。D 错误：TPOT 是平均每 token 间隔，不是总时间。E 错误：TPOT 是推理服务指标，与训练损失无关。", t: 6, n: {"A": "每 token 平均间隔", "B": "决定出字体感", "C": "那是 TTFT", "D": "不是总时间", "E": "与训练损失无关"}, d: "低" },
  { q: "关于指令模型与推理模型，下列说法正确的有？", o: ["A. 指令模型通常直接生成答复", "B. 推理模型先生成内部思考内容，再给出结论", "C. OpenAI o 系列、DeepSeek-R1 属于推理模型的代表", "D. 指令模型与推理模型的区别仅在于参数量大小", "E. 把 Temperature 调高就能让指令模型变成推理模型"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：指令模型直接生成答复，不做隐藏推演。B 正确：推理模型先在内部生成思考内容，再落到结论。C 正确：o 系列与 DeepSeek-R1 是推理模型的代表。D 错误：两类模型的差别在训练方式与推理路径，与参数量大小无关，同一规模的基座可以训成其中任一类。E 错误：Temperature 只调整采样的随机性，调高温度不会带来多步内部推演能力。", t: 11, n: {"A": "指令模型直接生成答复", "B": "推理模型先思考后结论", "C": "o 系列、DeepSeek-R1 是代表", "D": "差别在训法与推理路径，不在参数量", "E": "调温度不能变出推理能力"}, d: "低" },
  { q: "手上有一笔固定的推理算力预算想换成准确率，把单次思考拉长与多采样再投票这两条路线，正确的有？", o: ["A. 投票对答案离散、可两两比对的题（数学、选择）更见效", "B. 投票需要一个能归并多样本的判据，否则只是撞运气取众数", "C. 拉长思考多付的是思考 Token 与拿到结论前的等待，投票则要多付几份完整生成", "D. 两条路线在各类任务上收益相当", "E. 采样次数堆得够多，再训练推理能力的必要性下降"], a: [0, 1, 2], e: "两条买准确率的路：拉长思考多付输出 token，投票多付完整候选；投票要有可归并判据。答案 A、B、C。D错误：开放写作没有可比对的离散答案，投票归并不出东西。E错误：投票放大的是已有能力的稳定性，不会教出模型原本不会的推演。", t: 11, n: {"A": "投票对可两两比对的离散答案更见效", "B": "投票需要能归并多样本的判据，否则只是撞运气", "C": "拉长思考多付思考 token，投票多付几份完整生成", "D": "开放写作没有可比对的离散答案，投票归并不出东西", "E": "投票放大的是已有能力的稳定性，不会教出模型原本不会的推演"}, d: "中" },
  { q: "下列任务更值得交给会先想再答的慢思考模型，合理的有？", o: ["A. 每天几十万条、只出一个标签的模板化分类", "B. 日常寒暄与文案润色", "C. 多个硬约束要同时满足的排班、逻辑谜题", "D. 线索散在多处、必须串起来才能定位的取证类问题", "E. 有客观判分器的题，例如数学唯一解、代码跑测试"], a: [2, 3, 4], e: "慢思考适合多约束、跨线索、可验证的难题；模板分类、寒暄、单步任务不值得花思考 token。答案 C、D、E。A错误：这类量大、只要结论、延迟敏感，把预算花在思考上是亏的。B错误：单步就能写完的任务再加推理轨迹，只多出费用和延迟。", t: 11, n: {"A": "这类量大、只要结论、延迟敏感，把预算花在思考上是亏的", "B": "单步就能写完的任务再加推理轨迹，只多出费用和延迟", "C": "多个硬约束要同时满足的排班与谜题", "D": "线索散在多处、必须串起来的取证类问题", "E": "有客观判分器的题，例如唯一解与跑测试"}, d: "中" },
  { q: "关于推理模型写出的思维链与最终答案之间的关系，正确的有？", o: ["A. 思维链长度与准确率单调正相关", "B. 思维链本身也是生成的文本，不保证与答案因果一致", "C. 把它当审计证据之前，要抽查中间步骤是否真的支撑结论", "D. 思维链里算错的数字可能被后面的步骤一路沿用", "E. 思维链写得越详细，最终答案越对"], a: [1, 2, 3], e: "思维链是生成的文本，不保证与答案因果一致；当审计证据要抽查步骤，错值会一路沿用。答案 B、C、D。E错误：详细不等于正确，长篇草稿里同样能带着错值走到底。A错误：超过某个难度点后继续加长只会绕圈，收益不单调。", t: 11, n: {"A": "超过某个难度点后继续加长只会绕圈，收益不单调", "B": "思维链本身也是生成的，不保证与答案因果一致", "C": "当审计证据前，要抽查中间步骤是否真支撑结论", "D": "中间算错的数字会被后面的步骤一路沿用", "E": "详细不等于正确，长篇草稿里同样能带着错值走到底"}, d: "中" },
  { q: "把完整推理轨迹当成交付给复核人的工作底稿，成立的说法有？", o: ["A. 每步显式写出，错了能定位到具体步骤，配合逐步打分便于纠正", "B. 金融、医疗、法律这类结论要被人背书，只给结果无法采信", "C. 留全轨迹也等于给训练期的奖励分配提供了可打分的对象", "D. 底稿写得越长，复核人的成本就越低", "E. 留了轨迹，核对每步原始数据的必要性下降"], a: [0, 1, 2], e: "完整轨迹适合当复核底稿：能定位错步、支持逐步打分，但会推高复核成本，原始数据仍要回查。答案 A、B、C。D错误：长轨迹是把核对成本转嫁给复核人，越读越贵。E错误：步骤自洽不代表来源可靠，数字出处仍要回查。", t: 12, n: {"A": "每步显式写出，错了能定位到具体步骤", "B": "金融、医疗、法律这类结论要人背书，只给结果无法采信", "C": "留全轨迹也给训练期的奖励分配提供了可打分对象", "D": "长轨迹是把核对成本转嫁给复核人，越读越贵", "E": "步骤自洽不代表来源可靠，数字出处仍要回查"}, d: "高" },
  { q: "一套系统里同时留着指令模型和推理模型，合理的运维做法有？", o: ["A. 按任务分档：模板化高频走快模型，多步难题走慢模型", "B. 两条链路的输出结构与解析代码分开维护，别假设字段一致", "C. 换档时用同一批题集回归，免得快慢切换后质量落差没人发现", "D. 慢模型平均分更高时，就该把快模型全线撤掉", "E. 两类模型的接口与解析代码可以原样共用，区分的收益有限"], a: [0, 1, 2], e: "快慢模型并存要按任务分档、解析代码分开、换档回归；慢模型不是全面替代。答案 A、B、C。D错误：慢模型在延迟、费用和格式遵循上未必占优，全线撤掉会伤高频链路。E错误：一边只有回复、一边可能带思考块，字段与解析并不对称。", t: 11, n: {"A": "高频模板走快模型，多步难题走慢模型", "B": "两条链路的输出结构与解析代码分开维护", "C": "换档要用同一批题回归，免得质量落差没人发现", "D": "慢模型在延迟、费用和格式遵循上未必占优，全线撤掉会伤高频链路", "E": "一边只有回复、一边可能带思考块，字段与解析并不对称"}, d: "中" },
  { q: "关于标称上下文窗口与真正用得上的长度之间的差距，正确的有？", o: ["A. 标称是位置与显存能容纳的上限，不等于这段材料会被真正用上", "B. 序列越长，Softmax 要把更多分数归一，每个相关片段摊到的权重越薄", "C. 中段材料的召回通常比头尾差，塞得进不代表用得上", "D. 没超窗口时，模型在该长度内的表现是均匀可用的", "E. 窗口标称值一旦公布，就等于给有效长度开了担保"], a: [0, 1, 2], e: "标称窗口是容量上限，有效长度要看中段召回与注意力稀释；没超窗也不等于均匀可用。答案 A、B、C。D错误：退化主要落在中段与超长区间，可用性并不均匀。E错误：标称只是容量，有效长度要靠实测题集去量。", t: 6, n: {"A": "标称是位置与显存的上限，不等于真的用得上", "B": "序列越长，归一化把权重摊得越薄", "C": "中段召回最差，塞得进不代表用得上", "D": "退化主要落在中段与超长区间，可用性并不均匀", "E": "标称只是容量，有效长度要靠实测题集去量"}, d: "中" },
  { q: "单条“大海捞针”式找回题不足以代表长文能力，原因有？", o: ["A. 它只考定位一条孤立信息，不考把多处材料合并成结论", "B. 针与周围文本没有关联，靠字面就能对上，绕过了长程整合", "C. 单针不冲突，多份互相矛盾的材料才真正考验取舍", "D. 它的结论可以平移给摘要、跨章节问答这类任务", "E. 把针固定放在中段测一次，结果就稳定可比"], a: [0, 1, 2], e: "大海捞针只考单点定位，不考跨材料归并、冲突取舍与长程整合，不能代表长文能力。答案 A、B、C。D错误：找回与归纳是两种能力，找回高分不代表归纳可用。E错误：中段正是召回最差、方差最大的一段，单点结果不稳。", t: 0, n: {"A": "它只考定位一条孤立信息", "B": "针与周围没有关联，靠字面就能对上", "C": "单针不冲突，多份互相矛盾才考验取舍", "D": "找回与归纳是两种能力，找回高分不代表归纳可用", "E": "中段正是召回最差、方差最大的一段，单点结果不稳"}, d: "中" },
  { q: "从读一篇文章升级到读一整本书，任务发生质变，真正需要满足的条件有？", o: ["A. 头尾之外的中段材料要被真正纳入，而不是靠位置优势蒙混", "B. 单靠窗口变长不够，往往还要外部检索或分批归纳来补注意力的短板", "C. 窗口再拉长一个数量级之后，这类任务会做对", "D. 提示里写上“请通读全文”，细节会覆盖齐全", "E. 把散在多处的说法归并成一个一致结论，而不只是找回原句"], a: [0, 1, 4], e: "读整本书要中段被真正纳入、跨处归并成结论，往往还要检索或分批归纳；加窗口与提示不够。答案 A、B、E。C错误：窗口是容量，归并与抗稀释不是靠倍数解决的。D错误：一句指令改变不了注意力在长序列上的分配方式。", t: 0, n: {"A": "中段材料要被真正纳入，而不是靠位置优势", "B": "单靠窗口不够，还要外部检索或分批归纳", "C": "窗口是容量，归并与抗稀释不是靠倍数解决的", "D": "一句指令改变不了注意力在长序列上的分配方式", "E": "把散在多处的说法归并成一个一致结论"}, d: "中" },
  { q: "Prefill 与 Decode 的瓶颈分别是什么？", o: ["A. Prefill 偏算力，Decode 偏显存带宽", "B. 两者都偏网络带宽", "C. 两者都偏磁盘读写", "D. Prefill 偏带宽，Decode 偏算力", "E. 两者都主要受显存容量限制，与带宽无关"], a: [0], e: "单选。答案 A。B 错误：网络会影响分布式场景，但不是这两个计算阶段的本质瓶颈；C 错误：推理主要不靠磁盘；D 错误：正好说反了；E 错误：显存容量决定装不装得下模型与 KV，是容量约束不是速度瓶颈，Decode 的速度瓶颈在带宽。A：首字慢与逐字慢是两种病，要先分清阶段。", t: 6, n: {"A": "首字慢与逐字慢是两种病，要先分清阶段。", "B": "网络会影响，但不是计算阶段的本质瓶颈。", "C": "推理主要不靠磁盘。", "D": "正好说反了。", "E": "显存容量是装不装得下的约束，不是速度瓶颈。"}, d: "低" },
  { q: "不换更长窗口的模型，只靠工程手段提高超长材料的利用率，合理的有？", o: ["A. 把最可能被追问的段落集中堆在中段", "B. 调高 Temperature 让模型更仔细地读细节", "C. 先检索筛选再喂，把无关材料挡在窗口之外", "D. 分批归纳再合并，把一次超长拆成多次可控长度", "E. 把最关键的约束与结论要求放到开头或结尾，避开召回最差的中段"], a: [2, 3, 4], e: "提利用率靠检索筛选、分批归纳、关键料放头尾；堆中段或调温度都没用。答案 C、D、E。A错误：中段正是注意力最薄的地方，把关键料堆那里是自找漏读。B错误：温度改的是生成端的采样陡度，改不了对已读材料的注意力分配。", t: 6, n: {"A": "中段正是注意力最薄的地方，把关键料堆那里是自找漏读", "B": "温度改的是生成端的采样陡度，改不了对已读材料的注意力分配", "C": "先检索筛选，把无关材料挡在窗口外", "D": "分批归纳再合并，把一次超长拆成多次可控长度", "E": "关键约束放开头或结尾，避开召回最差的中段"}, d: "中" },
  { q: "把一本长书先分段做摘要、再拿摘要回答问题，这种做法的特性有？", o: ["A. 除摘要外还要保留回查原文的路径，例如出处与页码", "B. 分段摘要后的信息总量与原文等价", "C. 每段摘要够长时，无须再回查原文", "D. 把单次超长换成多次可控长度，绕开注意力稀释", "E. 摘要是有损压缩，细节型问题会在压缩里丢掉"], a: [0, 3, 4], e: "分段摘要是先压缩再回答：用多次可控长度绕开稀释，但摘要本身有损，细节必须留回查路径。答案 A、D、E。B 错误：归一压缩的代价就是细节流失，不可能等量；C 错误：摘要再长也不是原文，落到具体数字仍要回查。", t: 0, n: {"A": "要保留回查原文的路径，例如出处与页码", "B": "归一压缩的代价就是细节流失，不可能等量", "C": "摘要再长也不是原文，落到具体数字仍要回查", "D": "把一次超长换成多次可控长度", "E": "摘要是有损压缩，细节型问题会丢"}, d: "中" },
  { q: "上下文里同时塞进新旧两版互相矛盾的规章，正确的说法有？", o: ["A. 矛盾材料只影响 Token 开销，不影响结论", "B. 模型没有默认的裁决规则，可能任选其一，也可能折中，答案不稳", "C. 应在提示里显式给出生效时间与优先级，或干脆只喂当前版本", "D. 冲突点落在中段时更容易被忽略，落在头尾更容易被采纳", "E. 材料里带了日期，模型以最新那份为准"], a: [1, 2, 3], e: "新旧材料冲突时模型没有默认裁决规则，要在提示里显式给生效时间与优先级，或只喂当前版。答案 B、C、D。E错误：日期只是又一段文本，没有被显式指定为裁决依据时不保证生效。A错误：两份都进窗口时，结论会在两版之间漂。", t: 0, n: {"A": "两份都进窗口时，结论会在两版之间漂", "B": "模型没有默认裁决规则，可能任选或折中", "C": "提示里显式给生效时间与优先级，或只喂当前版", "D": "冲突点在中段更易被忽略", "E": "日期只是又一段文本，没有被显式指定为裁决依据时不保证生效"}, d: "高" },
  { q: "按“输出是什么”来选模型形态，正确的有？", o: ["A. 只要一个标签或一个相似度分数，双向编码器就够用，不必上生成", "B. 要产出任意长度的文本，用 Decoder-Only 这一代形态", "C. 先读懂再写出这类结构，Encoder-Decoder 也有它的位置", "D. 分类任务只能用生成式模型，编码器形态已经不适用", "E. 任务一复杂，就该把各种形态串成一条固定流水线"], a: [0, 1, 2], e: "按输出形态选模型：标签用编码器，长文用 Decoder-Only，先读后写用 Encoder-Decoder，不必强行串链。答案 A、B、C。D错误：判断式恰恰相反，只输出理解结果时编码器类更省。E错误：复杂度不是串链的理由，链路越长故障域和成本越大。", t: 0, n: {"A": "只要标签或分数，双向编码器就够", "B": "要产出任意长度文本，用 Decoder-Only", "C": "先读懂再写出，Encoder-Decoder 也有位置", "D": "判断式恰恰相反，只输出理解结果时编码器类更省", "E": "复杂度不是串链的理由，链路越长故障域和成本越大"}, d: "中" },
  { q: "站在选型角度，多模态语言模型相对纯语言模型改的是什么，正确的有？", o: ["A. 主干仍是自回归语言模型，视觉侧负责把图变成能接龙的表示", "B. 加的是输入通路与对齐，训练目标还是预测下一个 Token", "C. 选型时要回头看纯文本能力有没有被侵蚀，不能只测图文题", "D. 模型挂了多模态标签，图表读数与 OCR 便可靠", "E. 加了视觉通路后文本侧就换了一套解码机制，不再受采样参数影响"], a: [0, 1, 2], e: "多模态改的是输入通路与对齐，主干仍是自回归文本模型；标签不等于 OCR 与图表能力。答案 A、B、C。D错误：标签只说明有视觉通路，密集数字与细线图表仍是常见失分点。E错误：视觉动的只是输入通路，文本侧仍是同一套自回归解码与采样。", t: 10, n: {"A": "主干仍是自回归语言模型，视觉侧只把图变成可接龙的表示", "B": "加的是输入通路与对齐，目标还是预测下一个 token", "C": "要回头看纯文本能力有没有被侵蚀", "D": "标签只说明有视觉通路，密集数字与细线图表仍是常见失分点", "E": "视觉动的只是输入通路，文本侧仍是同一套自回归解码与采样"}, d: "中" },
  { q: "关于 VLM（视觉语言模型），下列说法正确的有？", o: ["A. VLM 是能同时理解图像与文本的多模态模型", "B. VLM 把视觉信息编码成 token，拼进语言模型处理", "C. VLM 是专门做语音识别的模型", "D. VLM 是专门做向量检索的系统", "E. 看图问答、描述图片内容是 VLM 的典型任务"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：VLM 是图文多模态模型。B 正确：视觉信息编码成 token 后拼进语言模型。E 正确：看图问答与图片描述是典型用途。C 错误：语音识别是 ASR，不是 VLM。D 错误：向量检索是另一套系统，与 VLM 定义无关。", t: 10, n: {"A": "图文多模态模型", "B": "视觉编码成 token 拼序列", "C": "语音识别是 ASR", "D": "检索是另一套系统", "E": "看图问答/图片描述"}, d: "低" },
  { q: "关于嵌入模型（Embedding Model），下列说法正确的有？", o: ["A. 它把文本转成定长向量，用于计算语义相似度", "B. 在 RAG 里通常负责把文档与查询向量化的环节", "C. 它可以直接生成自然语言回答给用户", "D. 嵌入向量是稀疏的词频统计，与 TF-IDF 是同一原理", "E. 它常用于语义检索、聚类与推荐等场景"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：嵌入模型的定义就是把文本映射为定长向量。B 正确：RAG 中文档与查询的向量化由嵌入模型完成。E 正确：语义检索、聚类、推荐是它的典型用途。C 错误：嵌入模型输出的是向量而不是文本，生成回答要靠生成式模型。D 错误：句嵌入是稠密语义向量，由神经网络编码得到，与 TF-IDF 的稀疏词频统计不是一回事。", t: 2, n: {"A": "嵌入=文本转定长向量", "B": "RAG 中负责向量化", "C": "它不生成文本", "D": "稠密语义向量，非词频统计", "E": "用于检索、聚类、推荐"}, d: "低" },
  { q: "关于 MMLU 基准，下列说法正确的有？", o: ["A. MMLU 用多学科选择题考察模型的通用知识面", "B. MMLU 覆盖人文、社科、理工等多个学科领域", "C. MMLU 主要测代码能否通过单元测试", "D. MMLU 主要测小学数学应用题的解题能力", "E. MMLU 主要测图像分类的准确率"], a: [0, 1], e: "答案 A、B。A 正确：MMLU 用多学科选择题考通用知识面。B 正确：题目覆盖人文、社科、STEM 等几十个专业学科。C 错误：代码单元测试是 HumanEval 一类代码基准。D 错误：小学数学应用题是 GSM8K 一类数学基准。E 错误：图像分类是视觉基准，MMLU 是纯文本语言基准。", t: 0, n: {"A": "多学科选择题考知识面", "B": "覆盖人文社科理工", "C": "那是 HumanEval 类", "D": "那是 GSM8K 类", "E": "MMLU 是文本基准"}, d: "低" },
  { q: "把语音、图像、文本都收进一个端到端模型，与用多个专职模型编排相比，正确的有？", o: ["A. 单模型里短板模态会拉低整体，且不容易定位问题出在哪一模态", "B. 单模型在成本上低于编排", "C. 用一个大一统模型后，按模态分别建评测集的必要性下降", "D. 单模型少掉中间转换，跨模态信息更完整地进到同一次推演里", "E. 编排方案每段可独立替换与验收，故障域更小"], a: [0, 3, 4], e: "端到端少转换、跨模态信息全，但短板模态会拖累整体、难定位；编排每段可验收、故障域小。答案 A、D、E。B错误：一个模型要常驻全部模态的能力，成本取决于负载与规模，谈不上必然更省。C错误：模态能力不均衡，评测恰恰要按模态拆开。", t: 10, n: {"A": "单模型里短板模态会拉低整体，且不好定位", "B": "一个模型要常驻全部模态的能力，成本取决于负载与规模，谈不上必然更省", "C": "模态能力不均衡，评测恰恰要按模态拆开", "D": "少掉中间转换，跨模态信息更完整地进同一次推演", "E": "编排每段可独立替换验收，故障域更小"}, d: "中" },
  { q: "企业问答为什么常用 RAG？", o: ["A. 能让模型参数量变大", "B. 能替代所有微调与评测", "C. 能保证完全不出幻觉", "D. 知识可更新、可溯源，不必为每次知识变化重训模型", "E. 能让模型不用联网就获得实时知识"], a: [3], e: "单选。答案 D。A 错误：RAG 不改模型参数；B 错误：RAG 只解决知识注入的一环；C 错误：检索错、生成歪仍会出错；E 错误：RAG 通常要访问知识库，实时性靠数据更新。D：RAG 的价值是「只说我们有的东西」，不是零错误。", t: 2, n: {"A": "RAG 不改模型参数。", "B": "RAG 只解决知识注入的一环。", "C": "检索错、生成歪仍会出错。", "D": "RAG 的价值是「只说我们有的东西」，不是零错误。", "E": "RAG 通常要访问知识库，实时性靠数据更新。"}, d: "低" },
  { q: "关于 RAG 中的切块（chunking），下列说法正确的有？", o: ["A. 切块是把长文档切成适合检索与放入上下文的片段", "B. 切块的粒度会影响检索命中的质量与上下文的利用效果", "C. 切块是把模型权重切分到多张 GPU 上", "D. 切块通常在建立向量索引之前完成", "E. 切块是对嵌入向量做降维处理"], a: [0, 1, 3], e: "答案 A、B、D。A 正确：切块就是把长文档拆成便于检索与放入上下文的片段。B 正确：块太大或太小都会影响检索命中与上下文利用，这是切块的基本事实。D 正确：先切块、再对块做嵌入并建索引，是常规流程。C 错误：把权重切到多卡是模型并行或分片，不是切块。E 错误：对向量降维是另一类操作，切块针对的是文档文本。", t: 2, n: {"A": "切块=把长文档拆成可检索片段", "B": "粒度影响检索与上下文利用", "C": "那是模型并行/分片", "D": "先切块再嵌入建索引", "E": "降维不是切块"}, d: "低" },
  { q: "文档里的表格在切块与检索时容易出问题，正确的处理与原因包括？", o: ["A. 常见补救是让每行自带表头（写成“列名: 值”），或小表整表作为一块", "B. 很大的明细表更适合走结构化通路（SQL 或表格工具），而不是硬挤进向量召回", "C. 表格属于结构化数据，向量检索对它的召回通常比自然段落更好", "D. 页眉页脚与水印对切块没有影响，原样保留即可", "E. 表格被拉平成逐行文本后，列名与数值的对应关系容易丢失"], a: [0, 1, 4], e: "表格拉平后结构丢失、召回更差；小表带表头或整表一块，大表走结构化查询。答案 A、B、E。C说反了：拉平后的表格在向量空间里像一串稀疏 token，往往比自然段更难召回，这正是需要混合检索与结构化通路的原因；D错误：每页重复的页眉页脚彼此高度相似，容易被高分召回并污染片段，入库前应剥离。", t: 2, n: {"A": "让每行自带表头，或小表整块作为一块", "B": "大明细表走 SQL 或表格工具更合适", "C": "表格结构被打散，向量召回通常更差", "D": "每页重复的页眉页脚彼此高度相似，容易被高分召回并污染片段，入库前应剥离", "E": "拉平成逐行文本后，列名与数值的对应会丢"}, d: "中" },
  { q: "关于 RAG 切块时保留元数据（标题路径、页码、时间等），下列说法正确的有？", o: ["A. 标题路径这类字段能帮孤立片段补回所属的层级语境", "B. 页码、段落等字段可用于答案的溯源定位", "C. 元数据只用于前端展示，不参与过滤与检索", "D. 元数据指的是模型服务的 GPU 配置信息", "E. 时间、部门等字段可用作检索时的元数据过滤条件"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：篇-章-节路径为孤立片段提供上下文归属。B 正确：页码与段落字段是答案溯源的依据。E 正确：时间、部门等是常见的元数据过滤条件。C 错误：元数据既参与过滤，标题路径等内容也参与检索，并非只做展示。D 错误：这里的元数据指文档的标题、页码、时间、版本等描述字段，与 GPU 配置无关。", t: 2, n: {"A": "标题路径补回层级语境", "B": "页码字段支持溯源", "C": "元数据参与过滤与检索", "D": "元数据是文档描述字段", "E": "时间部门可做过滤条件"}, d: "低" },
  { q: "切块太大会有什么问题？", o: ["A. 片段会失去主语和条件", "B. 向量维度会变低", "C. 片段混入无关内容，检索不精确，还挤占上下文", "D. 模型无法加载", "E. 检索结果一定会更精确"], a: [2], e: "单选。答案 C。A 错误：那是切得太小的问题；B 错误：切块不改变向量维度；D 错误：切块是文本处理，不影响加载；E 错误：块太大反而混入无关内容。C：块太大混主题，检索命中率与上下文利用率都会下降。", t: 2, n: {"A": "那是切得太小的问题。", "B": "切块不改变向量维度。", "C": "块太大混主题，检索命中率与上下文利用率都会下降。", "D": "切块是文本处理，不影响加载。", "E": "块太大反而混入无关内容。"}, d: "低" },
  { q: "切块粒度对召回与成本的影响是双向的，正确的有？", o: ["A. 块过大时一条里混着多个主题，向量被平均，命中后还夹带噪声", "B. 固定 Top-K 下块越大，拼装进上下文的字数越多、生成成本越高", "C. 块切得越小，端到端准确率就单调上升", "D. 块越碎，向量条目数越多，索引体积与候选比较量随之上升", "E. 块越碎，单条语义越聚焦，Top-K 捞回的内容更贴合问题"], a: [0, 1, 3, 4], e: "切块是双向权衡：太大混主题、成本高；太小丢上下文、索引膨胀；没有单调最优。答案 A、B、D、E。C 错误：块太小会丢上下文，是权衡不是单调。", t: 2, n: {"A": "块过大则一条里混多个主题，向量被平均", "B": "固定 Top-K 下块越大，拼进上下文的字数越多", "C": "块太小会丢上下文，是权衡不是单调", "D": "块越碎条目越多，索引体积与比较量上升", "E": "块越碎语义越聚焦，Top-K 更贴题"}, d: "中" },
  { q: "文档入库前的预处理，合理的做法包括？", o: ["A. 清洗规则只需首次全量导入执行一次，后续增量可以跳过", "B. 剥离页眉页脚、页码、目录、免责声明等每页重复的样板内容", "C. 扫描件先做 OCR，并标记识别失败的页面，避免静默入库成空块", "D. 近重复内容要去重，否则 Top-K 会被同一份材料的多个副本占位", "E. 空块和超长块可以不管，检索时自然不会命中"], a: [1, 2, 3], e: "入库前要剥样板、OCR 标记失败、去重、拦空块与超长块；增量也要同样清洗。答案 B、C、D。E错误：超长块语义宽泛，容易什么都沾一点边而被高分召回，空块还可能白吃名额，必须在入库校验里拦掉；A错误：增量必须走同一套清洗，否则脏数据从增量口子持续进入，库质量随时间退化。", t: 0, n: {"A": "增量必须走同一套清洗，否则脏数据从增量口子持续进入，库质量随时间退化", "B": "剥离页眉页脚、页码等每页重复的样板", "C": "扫描件先 OCR，并标记识别失败的页", "D": "近重复去重，否则 Top-K 被副本占位", "E": "超长块语义宽泛，容易什么都沾一点边而被高分召回，空块还可能白吃名额，必须在入库校验里拦掉"}, d: "中" },
  { q: "关于嵌入向量的维度，下列说法正确的有？", o: ["A. 维度越高，单条向量的存储体积越大", "B. 不同嵌入模型输出的向量可以直接混进同一个索引比较距离", "C. 维度越高，检索效果就越好", "D. 同一批文档需要用同一个模型编码，向量才在同一空间里可比", "E. 维度是嵌入模型的一个超参数，常见取值在数百到数千之间"], a: [0, 3, 4], e: "答案 A、D、E。A 正确：存储体积与维度成正比，这是基本事实。D 正确：不同模型的向量空间互不兼容，同库必须同模型编码。E 正确：常见嵌入模型维度如 384、768、1024、1536 等，属数百到数千量级。B 错误：不同模型各维含义不同，混检等于拿两套坐标系比距离，没有意义。C 错误：维度只是表达容量，效果取决于训练语料与目标，高维不保证更好。", t: 2, n: {"A": "存储体积随维度增大", "B": "不同模型向量空间不兼容", "C": "高维不保证效果好", "D": "同库须同模型编码", "E": "维度常见数百到数千"}, d: "低" },
  { q: "线上准备更换嵌入模型（升级版本或换供应商），正确的说法有？", o: ["A. 只换查询侧、沿用旧文档向量，结果会出现系统性偏差", "B. 迁移期可双索引并行，用检索指标灰度对比后再切流量", "C. 把模型名与版本写进元数据，便于回滚和定位片段的编码来源", "D. 换模型只影响新入库文档，老文档的向量可以继续正常使用", "E. 需要对全库文档重新编码并重建索引，是一次离线大工程"], a: [0, 1, 2, 4], e: "换嵌入模型等于换向量空间：查询与文档必须同模型，老库要全量重编码并重建索引。答案 A、B、C、E。D 错误：新旧向量不可互相比较，老库不重编码就等于失效，这正是换型即重建的由来。", t: 2, n: {"A": "只换查询侧、沿用旧文档向量，会系统性偏差", "B": "双索引并行，用检索指标灰度后再切流量", "C": "模型名与版本写进元数据，方便回滚与定位", "D": "新旧向量不可互相比较，老库不重编码就等于失效，这正是换型即重建的由来", "E": "全库重编码加重建索引，是一次离线大工程"}, d: "高" },
  { q: "切块太小会有什么问题？", o: ["A. 片段缺少主语、条件和上下文，语义不完整", "B. 检索一定更快更准", "C. 成本一定更低", "D. 模型会拒绝回答", "E. 向量维度会变高"], a: [0], e: "单选。答案 A。B 错误：过碎会丢条件，召回反而变差；C 错误：碎片多也会增加检索与拼接成本；D 错误：模型不会因为块小就拒答；E 错误：切块不改变向量维度。A：块太小会丢主语与条件，答案就拼不回来。", t: 2, n: {"A": "块太小会丢主语与条件，答案就拼不回来。", "B": "过碎会丢条件，召回反而变差。", "C": "碎片多也会增加检索与拼接成本。", "D": "模型不会因为块小就拒答。", "E": "切块不改变向量维度。"}, d: "低" },
  { q: "向量相似度容易“看走眼”的场景包括？", o: ["A. 出现这类误判就应放弃向量检索，只用关键词匹配", "B. 两句结论相反但话题相同，向量位置可能很近", "C. 问句与对应陈述句说的是同一件事，相似度常低于两段同话题文本", "D. 只改动一个数字或型号，向量距离的变化可能小于普通改写的噪声", "E. 换更强的嵌入模型，这类误判消失"], a: [1, 2, 3], e: "向量看走眼是表示局限：反义、问句陈述、单个数字差异都可能很近；要混合检索与重排。答案 B、C、D。E错误：这是表示学习的结构性局限，更强模型只能缓解，仍需混合检索与重排补位；A错误：方向相反，该把语义召回与 BM25、结构化过滤、重排组合使用，而不是丢掉语义能力。", t: 2, n: {"A": "方向相反，该把语义召回与 BM25、结构化过滤、重排组合使用，而不是丢掉语义能力", "B": "话题相同、结论相反的两句，位置可能很近", "C": "问句与陈述句讲同一件事，相似度反而常偏低", "D": "只改一个数字，距离变化可能小于普通改写的噪声", "E": "这是表示学习的结构性局限，更强模型只能缓解，仍需混合检索与重排补位"}, d: "中" },
  { q: "关于 GSM8K 基准，下列说法正确的有？", o: ["A. GSM8K 是一个小学数学应用题评测集", "B. GSM8K 主要考察多步算术推理能力", "C. GSM8K 主要衡量综合学科知识面的广度", "D. GSM8K 通过运行单元测试来判断代码是否正确", "E. GSM8K 是一个语音识别评测集"], a: [0, 1], e: "答案 A、B。A 正确：GSM8K 由小学数学应用题组成。B 正确：题目需要多步计算，考察推理链条。C 错误：综合学科知识面是 MMLU 的覆盖范围。D 错误：用单元测试判代码是 HumanEval 的做法。E 错误：GSM8K 是文本数学基准，与语音识别无关。", t: 0, n: {"A": "小学数学应用题集", "B": "考多步算术推理", "C": "那是 MMLU", "D": "那是 HumanEval", "E": "与语音识别无关"}, d: "低" },
  { q: "关于 Embedding（嵌入），下列说法正确的有？", o: ["A. 嵌入是把文本映射成定长向量", "B. 语义相近程度可以用向量间的距离或相似度来衡量", "C. 嵌入向量常用于语义检索、聚类等任务", "D. 嵌入是把模型权重压缩到 4-bit 的技术", "E. 嵌入是把中文翻译成英文的生成任务"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：嵌入的定义就是把文本映射为定长向量。B 正确：向量距离/相似度让「意思像不像」变得可计算。C 正确：语义检索与聚类是嵌入的典型用途。D 错误：把权重压到低比特是量化，不是嵌入。E 错误：翻译是生成任务，嵌入输出的是向量而非文本。", t: 2, n: {"A": "文本→定长向量", "B": "距离衡量语义相近", "C": "用于检索与聚类", "D": "那是量化", "E": "翻译是生成任务"}, d: "低" },
  { q: "关于召回条数与相似度阈值的设定，正确的有？", o: ["A. Top-K 越大答案越准，因为给模型的材料更多", "B. 设了阈值就不需要评测，阈值本身就是质量的证明", "C. 固定 Top-K 在库里根本没有相关内容时，照样会返回一堆低质片段", "D. 单靠相似度阈值卡控，对长度和话题都不同的查询很难有统一门槛", "E. 常见做法是召回稍深的候选池，再由重排截断出真正送进模型的少数几条"], a: [2, 3, 4], e: "召回深一点再重排截断；Top-K 越大越夹带噪声，阈值要按标注集验。答案 C、D、E。A错误：候选越多越容易夹带无关或互相矛盾的片段，模型利用质量下降、成本还同步上升；B错误：阈值只是工程约束，合不合适要用标注集上的 Recall@k 与命中率来验。", t: 2, n: {"A": "候选越多越容易夹带无关或互相矛盾的片段，模型利用质量下降、成本还同步上升", "B": "阈值只是工程约束，合不合适要用标注集上的 Recall@k 与命中率来验", "C": "固定 Top-K 在库里没相关内容时，照样返回低质片段", "D": "长度与话题都不同的查询，很难有统一阈值", "E": "常见做法是召回略深，再由重排截断"}, d: "中" },
  { q: "把复合问题拆成子问题分别检索，正确的有？", o: ["A. 做了子问题拆解，最终答案的正确率提高", "B. 对比类、多跳类问题拆成单跳后，每一跳都更容易命中对应片段", "C. 各子查询分别召回，再汇总去重后交给模型作答", "D. 代价是检索次数与延迟成倍上升，简单问题不值得拆", "E. 拆分粒度越细越好，拆到词一级最准"], a: [1, 2, 3], e: "子问题拆解提升多跳命中，但会增延迟、可能拆错；不是越细越好。答案 B、C、D。E错误：过细的查询丢失整体意图，捞回一堆碎片反而拼不出答案；A不成立：拆解本身可能拆错方向，每一跳的漏检还会累积到最后的答案里。", t: 2, n: {"A": "拆解可能拆错方向，每一跳的漏检还会累积", "B": "拆成单跳后，每一跳都更容易命中片段", "C": "各子查询分别召回，汇总去重后交给模型", "D": "检索次数与延迟成倍上升，简单问题不值得拆", "E": "过细的查询丢失整体意图，捞回一堆碎片反而拼不出答案。"}, d: "中" },
  { q: "多轮会话里做检索，为什么必须先补全查询？", o: ["A. 把整段对话历史原样拼成查询最好，信息量最全", "B. 模型够强时，可以拿原始追问直接去检索", "C. “那它有什么副作用”这类追问直接拿去检索，缺主语几乎无法命中", "D. 要把上文出现的实体、时间范围补进一个可独立理解的查询再检索", "E. 补全时顺手把上文确定的筛选条件写进元数据过滤，可减少无关召回"], a: [2, 3, 4], e: "多轮追问缺主语，必须先补全实体与筛选条件；拼整段历史会稀释语义。答案 C、D、E。A错误：历史里的寒暄、纠错和无关话题会稀释查询语义，通常只取最近若干轮或抽取关键实体；B错误：这不是模型能力问题，检索器收到缺主语的短查询就是缺信息，生成端再强也定位不到。", t: 13, n: {"A": "历史里的寒暄、纠错和无关话题会稀释查询语义，通常只取最近若干轮或抽取关键实体", "B": "这不是模型能力问题，检索器收到缺主语的短查询就是缺信息，生成端再强也定位不到", "C": "「那它有什么副作用」缺主语，直接检索几乎命不中", "D": "把上文实体与时间范围补进查询再检索", "E": "把已确定的筛选条件写进元数据过滤"}, d: "中" },
  { q: "下面哪些查询是向量检索答不好、GraphRAG 更占优的？", o: ["A. 这批材料整体在讲什么趋势这类全局归纳", "B. 答案分散在彼此不相似、但实体相连的片段里，靠语义相似度捞不全", "C. 一句话即可定位的单点事实题，例如某参数的默认值", "D. 刚上线、每天大量新增与删除的文档库最该先上 GraphRAG", "E. 要跨多份文档串两跳以上才能落地的关系型问题"], a: [0, 1, 4], e: "GraphRAG 适合全局归纳与多跳关系，不适合单点事实与高频变更库。答案 A、B、E。C错误：这种一跳事实题向量或关键词就够，建图纯属多付成本；D错误：GraphRAG 的构建 token 开销高一个数量级、增量更新也贵，它更适合相对静态的中小库做深度问答。", t: 2, n: {"A": "整体讲什么趋势这类全局归纳，图谱的社区摘要更擅长", "B": "答案分散在实体相连但语义不相似的片段里，向量捞不全", "C": "这种一跳事实题向量或关键词就够，建图纯属多付成本", "D": "GraphRAG 的构建 token 开销高一个数量级、增量更新也贵，它更适合相对静态的中小库做深度问答", "E": "要跨多份文档串两跳以上才能落地"}, d: "中" },
  { q: "关于代理式检索（Agentic RAG）与固定一次检索的取舍，正确的有？", o: ["A. 单跳事实题套上循环，只是多付延迟与费用", "B. 循环里的错误不会累积，因为每轮都拿得到新证据", "C. 用了 Agentic RAG 就不需要再单独做检索评测", "D. 由模型自决要不要检索、检索几轮、是否改写查询、换哪个检索器", "E. 多跳、对比、归纳类问题，检索到发现缺口再补查的循环上限更高"], a: [0, 3, 4], e: "Agentic RAG 让模型自决检索轮次与改写，适合多跳；单跳套循环只多花钱，错误会累积。答案 A、D、E。B说反了：前一轮选错的查询方向会带歪后续，错误会累积，这也是延迟成倍的原因之一；C错误：通路变多以后更要分别量每条通路的贡献，否则说不清是哪一步在起作用。", t: 2, n: {"A": "单跳事实题套上循环，只是多付延迟与费用", "B": "错误会沿轮次累积，新证据不等于能纠错", "C": "通路变多以后更要分别量每条通路的贡献，否则说不清是哪一步在起作用", "D": "由模型自己决定要不要检索、检索几轮", "E": "多跳与归纳类问题，循环的上限更高"}, d: "中" },
  { q: "关于 HumanEval 基准，下列说法正确的有？", o: ["A. HumanEval 主要评测根据函数签名生成代码的能力", "B. HumanEval 通过运行单元测试来判断生成代码是否正确", "C. HumanEval 主要衡量长文摘要的忠实度", "D. HumanEval 是向量检索召回率的评测基准", "E. HumanEval 是图像生成质量的评测基准"], a: [0, 1], e: "答案 A、B。A 正确：HumanEval 是代码生成基准，题目给出函数签名与说明。B 正确：判分方式是执行单元测试，常见指标是 pass@k。C 错误：摘要忠实度要用 ROUGE 或人评等，不是 HumanEval。D 错误：检索召回是另一类评测。E 错误：图像生成属于视觉评测，与 HumanEval 无关。", t: 0, n: {"A": "函数签名→代码", "B": "单元测试判对错", "C": "摘要另有指标", "D": "不是检索评测", "E": "不是视觉基准"}, d: "低" },
  { q: "要求答案给出可核对的引用字段（片段编号、页码、章节），为什么能降幻觉？", o: ["A. 引用字段只是给合规看的，对答案质量没有约束作用", "B. 模型必须把结论落到具体依据上，凭空补全的空间被压小", "C. 可以程序化校验每句有无依据，忠实度指标才有产出方式", "D. 用户能一键回到原文核对，错误被发现得快，也更容易归因", "E. 有了引用字段，模型就不会再编造内容了"], a: [1, 2, 3], e: "引用把结论锚到片段，能程序化校验、便于溯源；但仍可能挂错片段，要校验支持关系。答案 B、C、D。E错误：模型仍可能挂个片段号去支持原文里没有的结论，即引用幻觉，需要自动校验引用与原文是否真的对应；A不成立：它是链路里少数能机器检查忠实度的抓手，不只是展示层的事。", t: 4, n: {"A": "可核对的编号本身就限制了编造", "B": "结论必须落到具体依据上，凭空补全的空间被压小", "C": "能程序化校验每句有无依据", "D": "用户能一键回原文核对", "E": "模型仍可能挂个片段号去支持原文里没有的结论，即引用幻觉，需要自动校验引用与原文是否真的对应。"}, d: "中" },
  { q: "关于是否引入 GraphRAG、Agentic RAG 这类进阶形态，合理的判断包括？", o: ["A. 厂商宣传支持时，就应当一步到位把链路做满", "B. 基础链路还没做对时，也值得先把进阶形态堆上", "C. 先用标注集确认瓶颈在检索通路，而不在切块或答案生成", "D. 每加一层都要能单独量出增益，否则只是加了无法归因的复杂度", "E. 延迟与费用预算是硬约束，循环检索与图遍历都可能顶到上限"], a: [2, 3, 4], e: "进阶 RAG 要先确认瓶颈在检索，再逐层量增益；基础没做对就堆形态只会加复杂度。答案 C、D、E。A错误：外部宣传不构成技术依据，选型要由自己的问题分布和指标决定；B说反了：基础环节的漏洞会被上层机制放大，应该先把切块、混合检索、重排这三件便宜的事做对。", t: 2, n: {"A": "外部宣传不构成技术依据，选型要由自己的问题分布和指标决定。", "B": "基础没做对，进阶形态只会把问题放大", "C": "先用标注集确认瓶颈在检索通路", "D": "每加一层都要能单独量出增益", "E": "延迟与费用预算是硬约束"}, d: "中" },
  { q: "企业知识分散在文档、工单系统和代码库三处，检索层的合理设计包括？", o: ["A. 每一路用自己的索引与过滤条件，结果再统一融合与重排", "B. 结构化数据走查询工具，文档走向量与关键词，各用所长", "C. 三路结果直接拼进上下文，谁先谁后没有关系", "D. 都接进同一个向量索引之后，来源差异的影响可以忽略", "E. 按问题类型做路由，决定查哪几路，而不是每次都全库扫"], a: [0, 1, 4], e: "多源检索各用索引与过滤，再融合重排；结构化走查询工具，按问题路由。答案 A、B、E。C错误：片段顺序影响模型对材料的利用，各路可信度与新鲜度也不同，必须排序并标注来源；D错误：把工单和代码硬塞进同一个文本向量索引，会同时丢掉结构化字段与权限语义，精度反而下降。", t: 2, n: {"A": "每一路用自己的索引与过滤条件，再做融合与重排", "B": "结构化走查询工具，文档走向量与关键词", "C": "片段顺序影响模型对材料的利用，各路可信度与新鲜度也不同，必须排序并标注来源", "D": "把工单和代码硬塞进同一个文本向量索引，会同时丢掉结构化字段与权限语义，精度反而下降", "E": "按问题类型路由，而不是每次全库扫"}, d: "高" },
  { q: "关于向量检索与关键词检索，下列说法正确的有？", o: ["A. 向量检索按语义相似度进行匹配", "B. 关键词检索按字面词条进行匹配", "C. 实践中两者常结合使用，即混合检索", "D. 向量检索只支持中文，关键词检索只支持英文", "E. 两者的核心区别在于一个用 CPU、一个用 GPU"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：向量检索抓语义相近。B 正确：关键词检索抓精确字面匹配。C 正确：混合检索是常见做法，两者互补。D 错误：两者都支持多语言，语言不是区分标准。E 错误：硬件不是两者的定义区别，区别在匹配方式。", t: 2, n: {"A": "向量抓语义", "B": "关键词抓字面", "C": "常混合使用", "D": "都支持多语言", "E": "硬件不是区别"}, d: "低" },
  { q: "标注集上 Recall@k 已经不错，但 MRR 偏低，合理的判断与对策是？", o: ["A. 应该调高生成端温度，让模型自己去利用排在后面的材料", "B. 相关内容被召回了却排在候选池后段，没进入最终送进模型的几条", "C. 排序质量不够，融合权重或重排环节需要调整", "D. 融合只看名次、不做内容级判断，相关片段可能被一批长尾副本挤下去", "E. 说明切块粒度错了，应当推倒重做切块"], a: [1, 2, 3], e: "Recall 好 MRR 差是排序问题：调融合权重或重排，不是重做切块。答案 B、C、D。E错误：Recall@k 好说明网眼已经捞到东西，问题出在排序而不是切块；A说反了：温度调高只会让模型更容易脱开依据，正解是把该看的材料排到前面。", t: 2, n: {"A": "温度与材料利用无关，该改的是重排", "B": "相关内容被召回，但排在候选池后段没进最终的几条", "C": "排序质量不够，融合权重或重排要调", "D": "融合只看名次，长尾副本会把相关片段挤下去", "E": "Recall@k 好说明网眼已经捞到东西，问题出在排序而不是切块。"}, d: "高" },
  { q: "关于 ANN 索引，下列说法正确的有？", o: ["A. ANN 指近似最近邻（Approximate Nearest Neighbor）", "B. ANN 索引用少量召回损失换取更快的检索速度", "C. ANN 索引用于加速大规模向量库中的近邻搜索", "D. ANN 索引的作用是训练嵌入模型", "E. ANN 索引把向量压缩到一维来存储"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：ANN 就是近似最近邻的缩写。B 正确：近似换速度，可能漏掉个别真近邻，这是 ANN 的基本取舍。C 正确：ANN 的用途是加速大规模近邻搜索。D 错误：索引只负责组织与查找向量，不训练嵌入模型。E 错误：ANN 是索引结构，不是把向量压到一维的降维方法。", t: 2, n: {"A": "ANN=近似最近邻", "B": "近似换速度", "C": "加速大规模近邻搜索", "D": "索引不训练嵌入", "E": "不是降维"}, d: "低" },
  { q: "关于忠实度（Faithfulness）评测，下列说法正确的有？", o: ["A. 它衡量答案是否被给定的检索片段或上下文支持", "B. 它的参照系是外部世界的客观事实", "C. 可以用答案句子被片段支持的比例来量化", "D. 忠实度评测衡量的是答案是否流畅自然", "E. 忠实度只能靠人工判断，无法自动打分"], a: [0, 2], e: "答案 A、C。A 正确：忠实度的定义就是答案对给定材料的忠实程度。C 正确：句子级支持比例是常见的量化方式。B 错误：以外部世界事实为参照的是事实性（Factuality），不是忠实度。D 错误：流畅自然属于语言质量维度，与是否有材料依据无关。E 错误：可用引用对齐、句子级支持判定等方法自动打分，人工用于抽检校准。", t: 0, n: {"A": "忠实度=答案被给定材料支持", "B": "外部事实是事实性的参照", "C": "可按句子支持比例量化", "D": "流畅度是另一维度", "E": "可以自动打分"}, d: "低" },
  { q: "公开榜单分数很高，能否直接当作自家业务的验收结论？", o: ["A. 不能，公开榜与业务分布不同，题目还可能已被污染", "B. 能，榜单分数就是业务效果", "C. 能，排名越高一定越便宜", "D. 只有在多模态任务上不能", "E. 能，只要把榜单题目翻译成中文就能用"], a: [0], e: "单选。答案 A。B 错误：榜单测的是公开题，业务分布往往不同；C 错误：排名与价格没有直接关系；D 错误：文本任务同样存在分布不一致与污染；E 错误：翻译题目不改变分布与污染问题。A：榜单只能看水位，验收必须用自家业务题集。", t: 0, n: {"A": "榜单只能看水位，验收必须用自家业务题集。", "B": "榜单测的是公开题，业务分布往往不同。", "C": "排名与价格没有直接关系。", "D": "文本任务同样存在分布不一致与污染。", "E": "翻译题目不改变分布与污染问题。"}, d: "高" },
  { q: "RAG 系统上线后，防止检索质量悄悄退化的做法包括？", o: ["A. 评测集一旦建立就永久冻结，改动会失去可比性", "B. 定期用固定标注集回归，把 Recall@k 与忠实度画成可比曲线", "C. 线上埋点记录零命中查询、无结果率与用户追问率作为弱信号", "D. 文档源变更、嵌入或重排模型升级都要灰度对比后再全量", "E. 用户没投诉，就说明链路没有退化"], a: [1, 2, 3], e: "检索退化要靠固定集回归、线上弱信号、变更灰度；没投诉不等于没退化。答案 B、C、D。E错误：沉默不等于没问题，退化通常先体现在指标上，等投诉已经晚了；A错误：评测集要跟着真实问题分布更新，更新时保留历史子集或分版记录，兼顾可比性与代表性，而不是永久冻结。", t: 2, n: {"A": "评测集要跟着真实问题分布更新，更新时保留历史子集或分版记录，兼顾可比性与代表性，而不是永久冻结", "B": "固定标注集定期回归，把指标画成可比曲线", "C": "埋点零命中、无结果率与用户追问率", "D": "源变更与模型升级都先灰度对比", "E": "沉默不等于没问题，退化通常先体现在指标上，等投诉已经晚了"}, d: "中" },
  { q: "关于评测集污染（contamination），下列说法正确的有？", o: ["A. 污染指评测题目或答案提前进入了训练语料", "B. 污染会让评测分数被记忆抬高，难以反映真实能力", "C. 污染指评测集文件在磁盘上损坏", "D. 污染指标注员之间意见不一致", "E. 使用模型未见过的新题目评测，有助于减轻污染的影响"], a: [0, 1, 4], e: "答案 A、B、E。A 正确：污染的定义就是评测内容混入训练语料。B 正确：被污染的评测测到的是记忆而非能力，分数虚高。E 正确：换新题、避开训练语料是应对污染的常见做法。C 错误：文件损坏是工程事故，不是污染。D 错误：标注不一致是标注一致性问题，与污染无关。", t: 0, n: {"A": "评测内容混入训练语料", "B": "分数被记忆抬高", "C": "文件损坏是工程事故", "D": "那是一致性问题", "E": "新题可减轻污染"}, d: "低" },
  { q: "模型产出的工具调用参数在真正执行前，客户端合理的处理有？", o: ["A. 参数正确性交给模型自觉，提示词里写一句「务必填写正确」就行", "B. 重试必须有次数上限，超限就判定失败并上报，否则容易陷入报错与重试的死循环", "C. 校验失败时把具体错误（哪个字段、期望什么格式）回喂给模型，比只回「调用失败」更容易一次改对", "D. 对高危字段（目标路径、金额、收件人）单独设白名单或二次确认，不能只看格式合法", "E. 先按 JSON Schema 本地校验，缺必填字段或类型不对就别把这次调用发出去"], a: [1, 2, 3, 4], e: "工具参数执行前要 schema 校验、高危字段白名单/二次确认、有界重试并回喂具体错误。答案 B、C、D、E。A错误：提示词只是概率性约束，格式与取值边界必须由代码兜住，这和「权限不能只靠提示词」是同一件事。E、B、C、D 成立：模型输出的只是调用意图，执行前的确定性校验与有界重试属于执行框架的职责，回喂的错误信息还要具体到字段。", t: 3, n: {"A": "提示词只是概率性约束，格式与取值边界必须由代码兜住，这和「权限不能只靠提示词」是同一件事。", "B": "重试必须有次数上限，超限就判失败", "C": "把具体错误回喂，比只说「失败」更容易改对", "D": "高危字段单独白名单或二次确认", "E": "先本地按 schema 校验，别把坏调用发出去"}, d: "中" },
  { q: "工具调用中，模型负责什么？", o: ["A. 直接执行数据库事务", "B. 输出结构化的调用意图与参数", "C. 修改工具源代码", "D. 管理服务器权限", "E. 决定工具返回什么结果"], a: [1], e: "单选。答案 B。A 错误：执行由外部程序完成；C 错误：模型不改代码，除非另外生成；D 错误：权限在宿主程序与基础设施层；E 错误：返回值由工具与外部系统决定。B：模型写申请表，真正的执行与权限在代码里。", t: 3, n: {"A": "执行由外部程序完成。", "B": "模型写申请表，真正的执行与权限在代码里。", "C": "模型不改代码，除非另外生成。", "D": "权限在宿主程序与基础设施层。", "E": "返回值由工具与外部系统决定。"}, d: "低" },
  { q: "关于黄金集（golden set），下列说法正确的有？", o: ["A. 黄金集通常是人工精标的小规模评测集", "B. 黄金集用于关键决策的终审评测", "C. 黄金集是用来训练模型的全量语料", "D. 黄金集就是线上日志的全部原始记录", "E. 黄金集与公开榜单的全部题目是同一回事"], a: [0, 1], e: "答案 A、B。A 正确：黄金集规模小但标注权威，靠人工精标保证质量。B 正确：它的角色是给关键决策做终审。C 错误：黄金集是评测资产，不拿来训练。D 错误：原始日志要经抽样、脱敏、标注才可能成为评测集，不等于黄金集。E 错误：公开榜题目分布与自家业务不同，不能直接当黄金集。", t: 0, n: {"A": "人工精标、小规模", "B": "关键决策终审", "C": "评测资产不训练", "D": "原始日志≠黄金集", "E": "公开榜≠黄金集"}, d: "低" },
  { q: "关于 ReAct 模式，下列说法正确的有？", o: ["A. ReAct 让推理（Reasoning）与行动（Acting）交替进行", "B. ReAct 根据行动返回的观察结果决定下一步", "C. ReAct 是一种提示与循环模式，通常不需要重训专用模型", "D. ReAct 要求一次写死全部计划，中途不做调整", "E. ReAct 只做一次检索就结束，不支持多轮行动"], a: [0, 1, 2], e: "答案 A、B、C。A 正确：ReAct 的名字就来自 Reasoning + Acting 交替。B 正确：一步一看，观察结果反馈进下一轮推理。C 正确：ReAct 靠提示与循环实现，一般不必训练专用模型。D 错误：一次写死计划是「先计划再执行」模式，不是 ReAct。E 错误：ReAct 支持多轮行动，不是一次检索就结束。", t: 3, n: {"A": "推理与行动交替", "B": "看观察定下一步", "C": "提示模式，无需重训", "D": "那是先计划再执行", "E": "ReAct 可多轮行动"}, d: "低" },
  { q: "循环里同一类错误连续出现三次，最合理的处置是？", o: ["A. 把报错原样回传让它再试一次，这是自我修正的标准做法", "B. 调高采样温度，让它换几种写法试试", "C. 跳过这一步继续往下走，最后整体看结果", "D. 把最大迭代次数翻倍，多给几次机会总会成功", "E. 判定当前策略缺信息或缺能力：换手段（补检索、换工具、再拆任务）或升级人工"], a: [4], e: "单选。连续三次同类失败说明缺信息或缺能力，不是随机波动；继续原样重试只会重复同一个错。答案 E。A 错误：原样回传只对偶发失败和参数错有效，对系统性缺信息无效，连续三次同类失败本身就是信号；B 错误：温度只改变措辞分布，不会补上它不知道的事实；C 错误：带着缺口继续往下走，错误会在下游步骤放大，最终产物更难定位到是哪一步坏的；D 错误：次数翻倍的典型结局是把同一个错误多犯几遍，预算烧光而状态不变。", t: 3, n: {"A": "原样回传只对偶发失败和参数错有效，对系统性缺信息无效，连续三次同类失败本身就是信号", "B": "温度只改变措辞分布，不会补上它不知道的事实", "C": "带着缺口继续往下走，错误会在下游步骤放大，最终产物更难定位到是哪一步坏的", "D": "次数翻倍的典型结局是把同一个错误多犯几遍，预算烧光而状态不变", "E": "判定当前策略缺信息或缺能力，换手段或转人工"}, d: "高" },
  { q: "Agent 循环为什么需要刹车？", o: ["A. 让模型变得更聪明", "B. 防止死循环、烧光预算和重复执行副作用", "C. 提高采样温度", "D. 减少可用工具数量", "E. 让模型自己记住已经调过几次"], a: [1], e: "单选。答案 B。A 错误：刹车不提升模型能力；C 错误：温度与循环终止无关；D 错误：刹车是终止条件，不是工具数量；E 错误：模型没有可靠的计数器，刹车要写进代码。B：模型没有「够了」的出口，刹车必须写进代码。", t: 3, n: {"A": "刹车不提升模型能力。", "B": "模型没有「够了」的出口，刹车必须写进代码。", "C": "温度与循环终止无关。", "D": "刹车是终止条件，不是工具数量。", "E": "模型没有可靠的计数器，刹车要写进代码。"}, d: "中" },
  { q: "MCP server 收到调用请求后，合理的自我约束有？", o: ["A. 每次调用记录调用方、参数摘要、结果与耗时，出问题才能定位到具体一步", "B. 即使参数合法，server 也有权拒绝它认为不安全的调用", "C. 参数合法就意味着业务上安全，server 只做格式判断", "D. 高危工具应在准入与确认机制上设卡，而不是只在工具描述里写一句「请谨慎使用」", "E. 不能假设客户端已经校验过：类型、取值范围、路径穿越这类检查要在 server 侧再做一遍"], a: [0, 1, 3, 4], e: "MCP server 是最终执行者：参数合法不等于该执行，校验、审计与拒绝权都在 server。答案 A、B、D、E。C错误：合法只保证能解析，不保证该执行，一条格式完全正确的删除命令照样是事故。E、A、B、D 是同一条：server 是唯一真正动手的一方，校验和审计不能外包给模型或宿主。", t: 3, n: {"A": "记录调用方、参数摘要、结果与耗时", "B": "参数合法也可以拒绝，安全判断在 server 侧", "C": "合法只保证能解析，不保证该执行，一条格式完全正确的删除命令照样是事故。", "D": "高危工具要在准入与确认处设卡", "E": "不能假设客户端校验过，类型与路径要再查一遍"}, d: "中" },
  { q: "按正文口径，Agent 的权限分级按「放手程度」分为哪三级？", o: ["A. 训练、推理、评测", "B. 输入、输出、日志", "C. 中文、英文、代码", "D. 建议、代劳、自动", "E. 只读、可写、管理员"], a: [3], e: "单选。答案 D。A 错误：那是生命周期阶段；B 错误：那是数据通道；C 错误：那是内容类型；E 错误：只读、可写、管理员是账号与资源访问权限的常见分法，不是正文按放手程度划分的三级。D：读操作可直通，写操作要确认，不可逆动作要二次确认。", t: 3, n: {"A": "那是生命周期阶段。", "B": "那是数据通道。", "C": "那是内容类型。", "D": "读操作可直通，写操作要确认，不可逆动作要二次确认。", "E": "只读、可写、管理员是资源访问权限的分法，不是放手程度的三级。"}, d: "低" },
  { q: "Parallelization 的投票变体（同一任务多份输出取多数）在哪些情况下不涨反亏？", o: ["A. 任务难度远超模型能力时，多采几份得到的只是分布更散的噪声", "B. 投票把延迟和 token 按份数放大，涨幅不明显时性价比直接转负", "C. 采样次数加上去，模型的系统性偏差会被摊平", "D. 各候选的错误高度相关时，投票只是把「共识性的错」固化成结论", "E. 投票只适用于有唯一标准答案的任务，开放性写作碰不得"], a: [0, 1, 3], e: "投票抑制方差，前提是错误独立；共同偏差、强相关错误时投票会把错固化。答案 A、B、D。C错误：多次采样能压掉随机错，压不掉共同错，偏差来自模型本身而不是来自某一次抽样；E错误：开放任务同样可以多次生成再按维度择优，只是判据从「答案是否一致」换成打分聚合，不是禁区。D、A、B 成立：投票买到的是方差抑制，前提是错误彼此独立，而且要为这份独立性付费。", t: 0, n: {"A": "难度远超能力时，多采只是更散的噪声", "B": "延迟与 token 按份数放大", "C": "多次采样能压掉随机错，压不掉共同错，偏差来自模型本身而不是来自某一次抽样", "D": "错误高度相关时，投票会把共识性的错固化", "E": "开放任务同样可以多次生成再按维度择优，只是判据从「答案是否一致」换成打分聚合，不是禁区。"}, d: "中" },
  { q: "Routing 模式里上游分类把请求分错类目，后果与缓解说法正确的有？", o: ["A. 分错类目只影响这一条请求，对整体质量没有系统性影响", "B. 两类错分的代价不对称，阈值该按业务损失定，而不是按总体准确率定", "C. 分类准确率过九成，路由就比统一用强模型省钱", "D. 给路由层单独建评测集并按类目看混淆矩阵，比只盯一个总准确率更能暴露坑", "E. 置信度低时走兜底路径（统一交给强模型或转人工），比强行选一条分支更划算"], a: [1, 3, 4], e: "路由分错会走完整条下游，代价按类目不对称；要混淆矩阵、低置信兜底，不只看总准确率。答案 B、D、E。A错误：分错的请求会一路走完下游分支，错的检索、错的模板、错的回答全都被计入同一件事，用户感知到的正是这类整体塌方；C错误：省多少取决于错误类目的流量占比与错分后的返工成本，准确率高但错的那批集中在高价值场景，账照样亏。E、B、D 成立：路由层本质是个 classifier，要按 classifier 的方式评测和兜底。", t: 0, n: {"A": "分错的请求会一路走完下游分支，错的检索、错的模板、错的回答全都被计入同一件事，用户感知到的正是这类整体塌方", "B": "两类错分代价不对称，阈值该按业务损失定", "C": "省多少取决于错误类目的流量占比与错分后的返工成本，准确率高但错的那批集中在高价值场景，账照样亏。", "D": "给路由层单独建评测集，看混淆矩阵", "E": "置信度低时走兜底，比强行选一条划算"}, d: "高" },
  { q: "关于五大工作流模式的适用边界与常见错配，正确的有？", o: ["A. 评估-优化的前提是「好坏讲得清」，缺可执行标准时循环只是在两种口味之间来回摆", "B. 路由适合用在没有分类信号的开放任务上", "C. 编排-工作者的价值在于子任务无法预先枚举，代价是分解质量取决于中心模型", "D. 分段并行与投票的区别只在于并行度大小，与子任务能否独立无关", "E. 步骤能枚举清楚的活，交给固定链路更便宜也更好定位"], a: [0, 2, 4], e: "五种工作流各有边界：能枚举用固定链，标准说不清别上评估闭环，路由要有分类信号。答案 A、C、E。D错误：分段（sectioning）要求子任务彼此独立，投票（voting）恰恰是对同一个任务取多份，两者的分界是任务结构而不是并发数；B错误：没有分类信号就没有路由的输入，硬做只会退化成一次额外的模型调用，那种场景该用动态决策或干脆单次调用。E、A、C 成立：模式不是越花哨越好，能预定义就用预定义，说不清标准就别上闭环。", t: 3, n: {"A": "评估-优化的前提是好坏讲得清", "B": "没有分类信号就没有路由的输入，硬做只会退化成一次额外的模型调用，那种场景该用动态决策或干脆单次调用。", "C": "编排的价值在于子任务无法预先枚举", "D": "分段（sectioning）要求子任务彼此独立，投票（voting）恰恰是对同一个任务取多份，两者的分界是任务结构而不是并发数", "E": "能枚举清楚的活，固定链路更便宜也更好定位"}, d: "中" },
  { q: "下列场景里，更应当钉死成固定工作流而不是交给自主循环的有？", o: ["A. 生成营销活动文案初稿：没有固定步骤，多出几版让人挑更合适", "B. 月结对账：步骤固定，每一步都要留下能对证的证据链", "C. 把批量工单按模板转成结构化记录：字段可枚举，输出还要过 schema 校验", "D. 排查一个从未见过的线上故障：现象发散，需要边试边缩小范围", "E. 按制度发放补偿：金额规则写死在条文里，超出规则必须转人工，路径要求可复现"], a: [1, 2, 4], e: "步骤可枚举、要复现、要审计的场景钉死工作流；探索型任务才交给自主循环。答案 B、C、E。D错误：路径不可预知的探索任务正是自主循环的用武之地，钉死流程反而把聪明的做法挡在门外；A错误：这里没有需要审计的确定路径，也不需要复现，多生成再人工择优比编排更省。B、C、E 成立：共同特征是步骤可枚举、要求可复现，而且出问题必须能在日志里指认到具体哪一步。", t: 3, n: {"A": "这里没有需要审计的确定路径，也不需要复现，多生成再人工择优比编排更省。", "B": "对账步骤固定，每步都要留证据链", "C": "字段可枚举，输出要过 schema 校验", "D": "路径不可预知的探索任务正是自主循环的用武之地，钉死流程反而把聪明的做法挡在门外", "E": "规则写死在条文里，超出就转人工"}, d: "高" },
  { q: "编排器-工作者模式里，「把各分支结果汇总回中心模型」这一步的代价，正确的有？", o: ["A. 中心模型看到的常是工作者自述的结论而非原始证据，出错时难以复核", "B. 汇总本身是一次长输入调用，多份中间结果拼回去，成本又拉回来一截", "C. 工作者越多总成本越低，因为任务被平摊掉了", "D. 每个分支的上下文都要先压缩再交回去，压缩窗口就是丢信息的窗口", "E. 要求工作者统一输出 JSON，汇总阶段就不会引入新错误"], a: [0, 1, 3], e: "汇总层信息有损、责任转移、成本回流；要规定交回什么、证据留哪。答案 A、B、D。E错误：统一格式只解决「能不能解析」，解决不了两份结论互相冲突、或者结论本身就是错的；C错误：分支数增加时，固定开销与汇总输入都在涨，平摊的是单步工作量而不是总量。D、A、B 成立：汇总层的典型病灶是信息有损加上责任转移，设计时要显式规定交回什么、证据留在哪里。", t: 3, n: {"A": "中心看到的是工作者自述的结论，不是原始证据", "B": "汇总本身是一次长输入调用", "C": "分支数增加时，固定开销与汇总输入都在涨，平摊的是单步工作量而不是总量。", "D": "每个分支先压缩再交回，压缩窗口就是丢信息的窗口", "E": "统一格式只解决「能不能解析」，解决不了两份结论互相冲突、或者结论本身就是错的"}, d: "中" },
  { q: "在提示链的中间步骤加程序化检查门（Gate），说法正确的有？", o: ["A. Gate 加得越多，链条准确率就越逼近百分之百，因为每次拦截都在纠错", "B. 用确定性代码校验格式、必填项、引用是否存在，比再叫模型自审一次更可复现", "C. 每个 Gate 都增加一次延迟和一个失败出口，链条越长越要提前设计「不过门怎么办」", "D. 一旦流程里出现 Gate 判断分支，这套编排就变成自主 Agent 了", "E. Gate 的价值是把错误挡在早期，免得后面几步在错误前提上继续加工"], a: [1, 2, 4], e: "Gate 用确定性换可定位，但会增加延迟与失败出口；要设计不过门怎么办。答案 B、C、E。A错误：Gate 自身有误杀率，拦下来的东西要么回炉要么转人工，堆到后面整体通过率反而掉下来；D错误：分支由代码按预设规则决定，流程控制权仍在代码手里，判断标准是模型会不会在没有新指令时自己推进下一步。E、B、C 成立：Gate 是拿确定性换可定位，代价是延迟与需要设计回退路径。", t: 0, n: {"A": "Gate 自身有误杀率，拦下来的东西要么回炉要么转人工，堆到后面整体通过率反而掉下来", "B": "用确定性代码校验，比再叫模型自审可复现", "C": "每个 Gate 都加延迟与一个失败出口", "D": "分支由代码按预设规则决定，流程控制权仍在代码手里，判断标准是模型会不会在没有新指令时自己推进下一步。", "E": "Gate 的价值是把错误挡在早期"}, d: "中" },
  { q: "子 Agent 向主循环汇报结果，关于粒度与结构，正确的有？", o: ["A. 合适的结构是结论、关键证据的位置、未解决项，细节留在可回读的文件里", "B. 把整段执行日志原样贴回去，主上下文几轮就被灌满，后面每一步都在为噪声付费", "C. 汇报越简短越好，主模型需要时会自己再去查一遍", "D. 只回一句「已完成」，主控既无法判断可信度，也无从决定下一步", "E. 漏掉「执行了哪些不可逆动作」，等到需要回滚时才发现手里没有线索"], a: [0, 1, 3, 4], e: "子 Agent 汇报要结论+证据位置+未解决项；太厚挤窗口，太薄没法判断。答案 A、B、D、E。C错误：主控通常不会去查，也不该去查——它没有子 Agent 的现场，重查等于把刚才的工作再做一遍，缺的信息只能靠汇报方补全。B、D、E、A 成立：汇报是跨上下文边界的唯一通道，太厚挤爆窗口，太薄让下游失去判断依据。", t: 3, n: {"A": "结论、关键证据位置、未解决项，细节留在可回读的文件", "B": "贴整段日志会灌满主上下文", "C": "主控通常不会去查，也不该去查——它没有子 Agent 的现场，重查等于把刚才的工作再做一遍，缺的信息只能靠汇报方补全。", "D": "只回「已完成」，主控无从判断可信度", "E": "漏掉不可逆动作，回滚时手里没线索"}, d: "中" },
  { q: "多 Agent 协作时把规格与任务状态放进共享库，实际价值在于？", o: ["A. 出错时能回溯「当时是按哪一版做的」，而不是只能追问当时的提示词", "B. 把提示词里的一段话变成可版本化、可 diff 的对象，评审成本因此前移", "C. 有了共享规格就不再需要验收，执行体会自动对齐", "D. 各执行体对「做成什么样」有同一个依据，不至于人手一份自己的理解", "E. 这套机制只对十几个 Agent 以上的大型系统有意义，两三个执行体用不上"], a: [0, 1, 3], e: "共享规格与状态防漂移、可回溯；它不能替代验收。答案 A、B、D。E错误：价值与 Agent 数量无关，两个执行体就已经可能各自脑补出不同版本的需求，共享库首先是防漂移；C错误：规格只是判据，判据不会自己执行，验收动作仍然必须由人或测试来落地。D、A、B 成立：共享的是唯一真相来源与状态可见性，这两样也正是并行工作不退化成重复劳动的前提。", t: 3, n: {"A": "能回溯当时是按哪一版做的", "B": "把提示词里的一段话变成可版本化、可 diff 的对象", "C": "规格只是判据，判据不会自己执行，验收动作仍然必须由人或测试来落地。", "D": "各执行体对「做成什么样」有同一依据", "E": "价值与 Agent 数量无关，两个执行体就已经可能各自脑补出不同版本的需求，共享库首先是防漂移"}, d: "中" },
  { q: "把一个粗粒度 Agent 拆成几个子 Agent 后成本不降反升，可能的原因有？", o: ["A. 汇总调用可以省掉，让各子 Agent 直接对最终产物负责即可", "B. 拆得越细，每步上下文越小，总 token 随之下降", "C. 并行只缩短墙钟时间，不减少总计算量，而账单看的是后者", "D. 每个子 Agent 都要重发自己的系统提示与工具定义，固定开销按份数叠加", "E. 交接要把上下文压成文字，压不掉的就只能重查，重复劳动变成额外的检索与调用"], a: [2, 3, 4], e: "拆多 Agent 的收益在质量与隔离，成本在固定开销、交接与汇总；指望省钱常失望。答案 C、D、E。A错误：总得有人把各分支拼成一个答案，省掉这一步就变成把冲突直接抛给用户，或者干脆没人负责；B错误：单步上下文确实变小，但固定开销、交接与汇总都是新增项，多数拆分的净效果是总量上升。D、E、C 成立：拆分的收益主要在质量与隔离，指望它直接省钱通常要失望。", t: 3, n: {"A": "总得有人把各分支拼成一个答案，省掉这一步就变成把冲突直接抛给用户，或者干脆没人负责", "B": "单步上下文确实变小，但固定开销、交接与汇总都是新增项，多数拆分的净效果是总量上升。", "C": "并行只缩短墙钟时间，不减少总计算量", "D": "每个子 Agent 都要重发系统提示与工具定义", "E": "交接压不掉的上下文只能重查，变成额外检索"}, d: "高" },
  { q: "长任务跑到中途把前几十轮压缩成一段摘要，关于常见失真与应对，正确的有？", o: ["A. 摘要写得够详细，原始记录的回读入口就可以不保留", "B. 压缩点应选在有外部产物可回读的位置（提交、落盘之后），而不是随手每十轮一次", "C. 摘要保得住结论，丢掉的常是精确量：路径、版本号、报错原文，而下一步往往正好要用它们", "D. 压缩之后模型并不知道自己丢了信息，会照着摘要里残留的印象继续往下编", "E. 摘要由同一个模型生成，它对「什么算重要」的判断可能与后续步骤的需要不一致"], a: [1, 2, 3, 4], e: "摘要压缩的失真来自「谁判断重要」和「原文能否回捞」；压缩点要选在有外部产物可回读处。答案 B、C、D、E。A错误：摘要永远是有损压缩，被省掉的那一行恰恰可能是下一步的唯一依据，所以保留可回读的原始产物比把摘要写长更重要。C、D、E、B 成立：失真的根源是「谁判断重要性」与「信息还能不能拿回来」，选对压缩点能把损失关在可恢复的范围内。", t: 13, n: {"A": "摘要永远是有损压缩，被省掉的那一行恰恰可能是下一步的唯一依据，所以保留可回读的原始产物比把摘要写长更重要。", "B": "压缩点选在有外部产物可回读的位置", "C": "摘要保得住结论，丢的是路径、版本号与报错原文", "D": "模型不知道自己丢了信息，会照残留印象继续编", "E": "摘要由同一模型生成，重要性判断可能与后续需要不一致"}, d: "高" },
  { q: "一个跑二十轮的工具循环，token 消耗远大于二十次独立的单轮问答，原因有？", o: ["A. 命中前缀缓存后，历史部分不再按输入计费，循环长度对账单影响很小", "B. 轮数越多，最近几轮的输入里就越可能塞满早已无用的中间结果", "C. 每轮输出很短时，总成本主要由输出累加决定，与历史长度关系不大", "D. 每轮都要把此前的完整历史重新作为输入发一遍，累计输入随轮数近似平方增长", "E. 工具返回值往往比模型的自然语言输出长得多，一次大输出会长期挂在历史里"], a: [1, 3, 4], e: "循环账单随轮数近似平方涨：每轮重发全量历史，工具大输出长期挂在上下文。答案 B、D、E。A错误：缓存改变的是重复计算与一部分单价，历史仍占着窗口位置和整轮预算，长轮的账单照样被它撑起来；C错误：这类循环的账单大头恰恰是每轮重发的输入，输出短并不会让它变便宜。D、E、B 成立：放大来自循环结构本身，所以控制轮数和控制单轮长度同样重要。", t: 3, n: {"A": "缓存改变的是重复计算与一部分单价，历史仍占着窗口位置和整轮预算，长轮的账单照样被它撑起来", "B": "轮数越多，历史里越容易积压已无用的中间结果", "C": "这类循环的账单大头恰恰是每轮重发的输入，输出短并不会让它变便宜。", "D": "每轮重发完整历史，累计输入近似平方增长", "E": "工具返回值往往很长，一次大输出长期挂在历史里"}, d: "中" },
  { q: "哪些动作通常需要人工确认？", o: ["A. 读取公开资料", "B. 转账、删库、对外发送这类不可逆动作", "C. 查询天气", "D. 计算一加一", "E. 生成一段草稿"], a: [1], e: "单选。答案 B。A 错误：只读且低风险，通常可直通；C 错误：只读查询，风险低；D 错误：无副作用，不需要确认；E 错误：草稿通常可逆，不必逐次确认。B：人审要留给不可逆、高代价、低置信的动作。", t: 3, n: {"A": "只读且低风险，通常可直通。", "B": "人审要留给不可逆、高代价、低置信的动作。", "C": "只读查询，风险低。", "D": "无副作用，不需要确认。", "E": "草稿通常可逆，不必逐次确认。"}, d: "低" },
  { q: "关于工具调用中的幂等（idempotency），下列说法正确的有？", o: ["A. 幂等指同一个请求重复执行，结果保持一致", "B. 设计重试机制时考虑幂等，可以避免重复执行造成额外副作用", "C. 幂等指每次执行都产生不同的结果", "D. 幂等指请求必须加密传输", "E. 幂等指工具必须联网才能调用"], a: [0, 1], e: "答案 A、B。A 正确：幂等的定义就是重复执行结果一致。B 正确：重试前考虑幂等，否则一次失败可能变成两次副作用，这是幂等在工具调用中的用途。C 错误：每次结果不同恰恰是不幂等。D 错误：加密传输属于传输安全，与幂等无关。E 错误：离线工具也可以有幂等语义，联网不是幂等的条件。", t: 3, n: {"A": "重复执行结果一致", "B": "重试不产生重复副作用", "C": "那是不幂等", "D": "那是传输安全", "E": "离线也可幂等"}, d: "低" },
  { q: "评测一个已经上线的 Agent，最该当主指标的是？", o: ["A. 用户对单次回答的点赞率，样本越大越可信", "B. 平均端到端延迟，因为它最贴近用户体验", "C. 平均完成任务所需的步数，越少说明系统越聪明", "D. 有外部可验证判据的任务完成率，并按任务难度分层统计", "E. 工具调用总次数，因为它直接反映做了多少工作"], a: [3], e: "单选。上线 Agent 的主指标要落在可验证的完成上，并按难度分层；点赞、延迟、步数、调用量都是代理量。答案 D。A 错误：点赞衡量的是满意度，用户往往看不出中间哪一步其实走错了，事情办没办成才是关键；B 错误：延迟是 SLA 指标，快而错不是好；C 错误：步数可以被反向优化——少做几步就少犯几个错，但任务并没有做成；E 错误：调用次数是成本指标，多调也可能是瞎调，不能代表质量。", t: 15, n: {"A": "点赞衡量的是满意度，用户往往看不出中间哪一步其实走错了，事情办没办成才是关键", "B": "延迟是 SLA 指标，快而错不是好。", "C": "步数可以被反向优化——少做几步就少犯几个错，但任务并没有做成", "D": "有外部可验证判据的任务完成率，并按难度分层", "E": "调用次数是成本指标，多调也可能是瞎调，不能代表质量"}, d: "高" },
  { q: "从「单步正确率会随步数连乘」这个事实出发，工程上成立的推论有？", o: ["A. 人工检查点该压在不可逆、难回滚、影响面大的动作之前，而不是均匀分布", "B. 检查点越密整体完成率越高，每一道都在拦错误", "C. 切成可独立验收的短段，错误能在段内被发现，而不是靠运气跑完整程", "D. 单步准确率提上去之后，长任务可以全自动跑完", "E. 缩短关键路径本身就是提效手段：能一步拿到的信息别绕三步去猜"], a: [0, 2, 4], e: "步数连乘让长任务必然掉完成率：减少步数、把检查点压在不可逆处、切到可验收的粒度。答案 A、C、E。B错误：每道检查自带延迟与误杀，拦下来的要回炉或转人工，密到一定程度整体通过率反而掉下来；D错误：单步再高也扛不住步数连乘，而且不可逆动作的风险不能靠概率达标豁免，这正是长任务必须留人工兜底的理由。E、A、C 成立：少跑几步、把检查点放在代价最高的位置、把长度切到能验收的粒度，是真能拉高完成率的三条手段。", t: 4, n: {"A": "检查点压在不可逆、难回滚的动作前", "B": "每道检查自带延迟与误杀，拦下来的要回炉或转人工，密到一定程度整体通过率反而掉下来", "C": "切成可独立验收的短段，错误在段内被发现", "D": "单步再高也扛不住步数连乘，而且不可逆动作的风险不能靠概率达标豁免，这正是长任务必须留人工兜底的理由。", "E": "缩短关键路径本身就是提效"}, d: "中" },
  { q: "给 Agent 功能做成本核算与归因，合理的做法有？", o: ["A. 人工审核的时间不该计入成本，那是固定工资，与单次任务无关", "B. 平摊到「每次对话」是够用的粒度，任务复杂度的差异会被平均掉", "C. 成本要和完成率放在一起看，单位成本下降也可能只是任务被悄悄做少了", "D. 单次任务成本要含输入输出 token、工具与检索调用，以及失败重跑的那部分，只记成功那次会低估", "E. 按功能、租户、用户三个维度打标，才能回答「哪一块在烧钱」，只有总量数字没法决策"], a: [2, 3, 4], e: "Agent 成本要含人审、工具、检索与失败重跑，按功能/租户/用户归因；平均到每次对话会掩盖长尾。答案 C、D、E。A错误：人审往往是这条链路里最贵的可变成本之一，不算它就会得出「自动化一定更便宜」的错误结论，越是需要检查点的功能越要先算这笔账；B错误：平均值掩盖长尾，一个长任务可能抵得上一百次闲聊，不按任务与租户拆开就找不到成本来源。D、E、C 成立：核算的目的是能定位、能做取舍，而不是产出一个总数。", t: 3, n: {"A": "人审往往是这条链路里最贵的可变成本之一，不算它就会得出「自动化一定更便宜」的错误结论，越是需要检查点的功能越要先算这笔账", "B": "平均值掩盖长尾，一个长任务可能抵得上一百次闲聊，不按任务与租户拆开就找不到成本来源。", "C": "成本要和完成率一起看，单位成本降也可能是任务做少了", "D": "单次成本要含失败重跑，只记成功那次会低估", "E": "按功能、租户、用户三个维度打标"}, d: "中" },
  { q: "给一次 Agent 任务设成本预算与止损线，合理的有？", o: ["A. 单步成本低的时候，整轮任务可以不设预算上限", "B. 预算应按任务类型分档，简单问答和长程重构共用一个上限会两头不讨好", "C. 超预算率本身是有用的指标，它能暴露哪类任务的拆解方式有问题", "D. 触顶时要输出已完成部分与未竟事项，而不是只留一句「预算用完了」", "E. 单任务要有预算上限（token 或费用），触顶就收敛并交人工，而不是等它自然结束"], a: [1, 2, 3, 4], e: "预算约束整条链路而非单步；按任务分档、触顶留交接信息，预算也是护栏。答案 B、C、D、E。A错误：单步便宜、轮数失控照样能把账单拉平，预算约束的对象是整条链路而不是某一步。E、B、C、D 成立：预算是护栏的一种，价值不只在省钱，触顶时留下什么直接决定人工接手还要花多少力气。", t: 3, n: {"A": "单步便宜、轮数失控照样能把账单拉平，预算约束的对象是整条链路而不是某一步。", "B": "预算按任务类型分档", "C": "超预算率能暴露拆解方式的问题", "D": "触顶要输出已完成部分与未竟事项", "E": "单任务要有 token 或费用上限"}, d: "中" },
  { q: "工具调用失败后，合理的做法是什么？", o: ["A. 无限重试直到成功", "B. 忽略错误继续下一步", "C. 默认工具一定成功", "D. 校验错误、有限重试，仍失败就切策略或转人工", "E. 把错误信息从日志里删掉"], a: [3], e: "单选。答案 D。A 错误：会把过载放大成雪崩；B 错误：错误会沿链路传播；C 错误：工具是外部系统，失败是常态；E 错误：删日志会失去定位依据。D：失败要显式处理，重试要有上限与退避。", t: 3, n: {"A": "会把过载放大成雪崩。", "B": "错误会沿链路传播。", "C": "工具是外部系统，失败是常态。", "D": "失败要显式处理，重试要有上限与退避。", "E": "删日志会失去定位依据。"}, d: "低" },
