  { q: "关于静态榜与动态榜（持续换题的私有榜），下列说法正确的有", o: ["A. 两个模型在同一张公开静态榜上都考 85 分，说明它们在用户任务上的能力相当", "B. 动态私有榜的分数要当趋势读，跨榜横向比较没有意义，因为考的根本不是同一批题", "C. 把静态榜的题序随机打乱重排，就能消除污染带来的虚高", "D. 静态榜的题目发布后很快会出现在公开网页语料里，模型可能在预训练阶段就见过", "E. 动态榜靠定期投入新题（私有 held-out、刚生成的题、刚发生的时事）维持效力，没人来得及背"], a: [1, 3, 4], e: "A错误：静态榜的分数混着背题收益，同分不代表同能力，可信度也不如动态榜。C错误：题面文本没变，模型照样认得，打乱顺序不改变它见过这道题的事实。" },
  { q: "用 n-gram 重叠检测排查评测集污染，合理的做法与局限，正确的有", o: ["A. 把 n 取得足够长，就能确认一份评测集完全没有污染", "B. 把题目切成连续 n-gram 与预训练语料做匹配，命中率异常高就是泄漏嫌疑", "C. n 取得太短时大量通用表述会误报，要结合命中长度、频次和语料来源再判", "D. 它只能抓到原样或近似原样进过语料的题，被改写、换了数字和实体名的题检不出来", "E. 命中即证明模型在该题上的得分来自背题而不是能力"], a: [1, 2, 3], e: "E错误：命中只说明题目进过语料，是否真靠记忆答题要靠行为验证（换皮题、只给线索要求复述）确认。A错误：语料快照不全、切分方式不同、题目被同义改写都会漏检，零命中不等于无污染。" },
  { q: "关于在评测集里预埋 Canary String，下列说法正确的有", o: ["A. 发布页面不印出这段串，就能确认评测集没被爬过", "B. 正因为它是长串且无实际语义，偶然出现在正常回答里的概率极低", "C. 它是一段固定、本身没有内容价值的指纹串，用来标记某批语料的来源", "D. 模型输出里原样复述出这段串，可确证它见过埋了该串的那批数据", "E. 它顺带能证明模型没有背下这套数据集里的其他题目"], a: [1, 2, 3], e: "E错误：它只证明来源重叠这一件事，对其它题目是否被记住没有任何推断力。A错误：串可以留在文档正文、代码注释、镜像站点里，只靠发布页去不掉痕迹。" },
  { q: "要区分「模型真会做」和「它背过这道题」，可操作的验证手段包括", o: ["A. 提高采样温度多试几次，反复总能答对就说明不是背的", "B. 看首个作答 token 的概率，概率极高就说明它真的会做", "C. 只给题号或极短线索，要求模型复述完整题面与解析；一字不差说明它记住的是文本", "D. 把题里的数字、实体名、选项顺序换掉再跑一遍，成绩大幅跳水说明靠记忆", "E. 让它先讲清解题方法，再换一道同方法的新题验证能不能迁移"], a: [2, 3, 4], e: "A错误：背过的题换个温度照样对，多采样只会把记忆和择优混在一起，反而更难判断。B错误：首 token 概率极高恰恰是背过题面的典型信号，不是能力的证据。" },
  { q: "同一模型分别在污染子集与新鲜子集上跑分，关于怎么读这个落差，正确的有", o: ["A. 榜单不披露题目是否来自私有 held-out 时，这个落差只能靠自建新鲜集复测出来", "B. 两个子集的分差本身就可以当作污染程度的一种量度", "C. 越强的模型落差可能越大，因为它有更多容量把题面背下来", "D. 两个子题集题量相同时，分差就等于背题带来的虚高", "E. 新鲜子集分数更低，就证明模型的真实能力必然低于公开榜单分数"], a: [0, 1, 2], e: "D错误：分差里还混着两批题难度、领域分布不同带来的差异，必须按同一分层设计才接近可用的估计。E错误：「必然」过头，新题本身可能更难，落差只能说明注水存在，给不出真实能力的点估计。" },
  { q: "关于 Goodhart 定律在榜单上的体现，下列说法正确的有", o: ["A. 专门练四选一的排除法（利用选项结构与长度线索）也能涨分，与理解无关", "B. 榜单分数被刷上去，就一定是因为题目泄进了预训练语料", "C. 厂商都报同一份公开榜单时，分数差异反映真实能力差异", "D. 指标一旦成为优化目标，它就不再是个好指标", "E. 把训练数据往榜单分布上加权能抬分，但不改变用户的活能不能干完"], a: [0, 3, 4], e: "B错误：抬分与污染是两回事——不改训练数据也能靠多采样取最优、答案格式解析漏洞把分刷上去。C错误：同一份卷子也能被同考法优化，共同的榜单挡不住共同的应试技巧。" },
  { q: "某四选一榜单的随机猜测基线是 25%，模型实测准确率 70%。按概率折分（chance-corrected）口径，下列说法成立的有", o: ["A. 折分后约为 45%，因为要减掉猜对的那 25 个百分点", "B. 若实测正好 25%，折分后为 0，等于完全没有超过随机", "C. 折分只能剔除瞎猜的收益，不能证明开放题、写作题也会做", "D. 折分后的分数一定不低于原始分数，因为它补回了被扣掉的分", "E. 折分后约为 60%，算法是 (0.70 − 0.25) / 0.75"], a: [1, 2, 4], e: "A错误：(0.70−0.25)=0.45 只是分子，还要除以可得分空间 0.75，折分是 60% 不是 45%。D错误：折分只会往下修不会往上抬，只有实测低于随机基线时折分才为负（通常截到 0）。" },
  { q: "同一模型在不同评测脚手架（harness）下通过率能差出十几个百分点。关于跨模型比较怎么读，正确的有", o: ["A. 两种实验的结论可以放进同一张表上报，读者会自己区分变量", "B. 读榜单先找三个字段：采样次数、解码温度、是否择优，缺一个这张表就没有可比性", "C. 既然 harness 影响这么大，所有公开榜单都不可信，选型时应一律弃用", "D. 「A 比 B 高 3 分」只有在提示词、工具集、重试策略、采样次数全部锁死时才有意义", "E. 自建复测比较模型时固定 harness 换模型；评估脚手架本身时固定模型换 harness"], a: [1, 3, 4], e: "A错误：两种实验量的是不同东西，混在一张表里等于让读者把脚手架的差距读成模型的差距。C错误：结论是跨 harness 不可比，要固定变量、自建复测，而不是连趋势都不看。" },
  { q: "厂商宣传「某代码榜达到 90 分」，读这类数字时要注意", o: ["A. pass@k 越高，说明模型单次生成的质量必然越好", "B. 题集相同时，pass@1 与 pass@10 可以互相替换着比", "C. 先确认是 pass@1 还是 pass@10，后者只是多买了九次机会", "D. maj@k（多数投票）与 best-of-n（取最优）的结果不能和单次采样并排放在一列", "E. 未披露采样次数与解码温度时，这个数字不构成可比的评测结论"], a: [2, 3, 4], e: "A错误：pass@k 变高也可能只是候选数变多、k 次里蒙对一次，单次命中未必改善。B错误：两者是两个物种，换了口径同题集也比不出高低。" },
  { q: "公开榜单分数很高，接到自家业务上却不行，合理的解释包括", o: ["A. 说明榜单造假，应该改看另一家机构发布的榜单", "B. 通用榜在个位数百分点内波动时，本来就不够支撑选型结论", "C. 榜单的意图、语言、领域分布与线上流量不同构，比如很少中英混杂和行业黑话", "D. 榜单多是单轮问答，线上是多轮、长上下文、带工具失败与重试的场景", "E. 榜单答案形式收敛，业务要的是可控格式、可引用来源和权限边界"], a: [1, 2, 3, 4], e: "A错误：同一个分数换一份榜单照样虚高，问题出在分布不同构，不是「榜单选错了」。" },
  { q: "关于裁判的单点打分（Direct Scoring）与成对比较（Pairwise），正确的有", o: ["A. 成对比较的开销是二次方级的：n 份答案两两比就是 n(n−1)/2 对", "B. 单点打分能给绝对值，便于和历史批次纵向比较", "C. 成对比较与人类偏好的一致性通常更高，而且不受量纲影响", "D. 单点打分量纲不稳：换一批样本、换一个提示词版本，分档就会漂，裁判还偏爱中间档", "E. 成对比较天然给出绝对质量分，不需要额外的参照锚"], a: [0, 1, 2, 3], e: "E错误：成对比较只有相对序，必须留一个固定参照答案当锚，否则不同批次连不成一条线。" },
  { q: "关于裁判的位置偏差（Position Bias），正确的有", o: ["A. 换序后结论冲突的样本，随便取其中一次结果计入就行", "B. 排在前面、占据 A 位的答案更容易被判赢", "C. 同一对答案正反序各评一次，只有两次判同一个胜者才计入", "D. 两次判定不一致的比例要单独记录，它是裁判的体检指标，上升就说明该重校了", "E. 把两份答案都压到很短，位置偏差就会自动消失"], a: [1, 2, 3], e: "E错误：位置偏差是「先看到的占优」的排序偏置，与答案长短无关，压短只会引入新的信息损失。A错误：冲突样本应判平或送人评，随机取一次等于把位置偏差重新引入统计。" },
  { q: "要排查裁判是不是只在奖励长度，合理的做法包括", o: ["A. 把所有答案都填充到同一字数再评，长度偏差就消除了", "B. 把裁判换成更强的模型，长度偏差会自己消失", "C. 在评分标准里明写冗长扣分，把简洁单独成一维", "D. 统计胜率与答案长度的相关系数，相关性很强就说明裁判被长度绑架", "E. 做截断对照：把长答案尾部截掉再评一次，分数大跌说明赢在篇幅不在内容"], a: [2, 3, 4], e: "A错误：填充只对齐了字符数，还引入噪声；真正与长度高度相关的是信息量，硬凑等长反而把差异洗掉。B错误：更强的模型同样有长度偏好，这是裁判自身的属性，只能靠标准和控制变量治。" },
  { q: "关于裁判的自偏好（Self-preference），正确的有", o: ["A. 比 A 家族新模型与 B 家族旧模型时，用 A 家族的裁判会让胜率整体偏向 A", "B. 把解码温度设为 0，就能消除自偏好", "C. 自偏好只出现在打分式评测里，成对比较不受影响", "D. 裁判倾向偏爱与自己同源、同风格的输出，候选与裁判同家族时更明显", "E. 换一个不同家族的裁判，或两个家族交叉裁判，是缓解手段之一"], a: [0, 3, 4], e: "B错误：温度只改变采样随机性，自偏好来自裁判与候选同源的分布偏好，确定性解码只会把偏差固定下来。C错误：成对比较同样会被同源风格影响，所以才要换序双评加换家族裁判。" },
  { q: "一份稳得住的裁判 rubric，写法上应当", o: ["A. 每个档位配正反锚例，并包含边界示例", "B. 要求裁判先摘出证据句，再下结论", "C. 最后加一条「综合质量主观总评」收口，越靠主观越能反映真实水平", "D. 裁判模型与提示词版本连同评测集一起冻结，改动走版本", "E. 一条只判一件事，写成二元可核对的观察项"], a: [0, 1, 3, 4], e: "C错误：综合总评会把前面所有维度的偏差重新混回一杯，正是标准歧义的来源；要合成也得用固定权重的程序化规则，不能让裁判自由发挥。" },
  { q: "用相关系数与 Kappa 度量裁判和人类的一致性，正确的有", o: ["A. 相关系数够高就说明裁判与人类完全一致，可以直接替代人评", "B. 只有几十条样本时，相关系数的置信区间很宽，不足以支撑放行门槛", "C. 人与人一致率本身很低时，差距有一部分来自标签定义模糊，而不是裁判不行", "D. Spearman 看的是排序一致性，适合用来核成对比较给出的名次", "E. Cohen's Kappa 衡量类别标签的一致性，且已经扣掉随机命中的部分"], a: [1, 2, 3, 4], e: "A错误：相关只反映同向变化，看不见系统偏差——裁判整体偏高半档、量纲被压缩，相关系数照样漂亮，但绝对分数不能直接用人。" },
  { q: "关于裁判能不能当发布门、什么时候必须回到人评，正确的有", o: ["A. 达不到这个水平的裁判只能做粗筛，不能当发布门", "B. 医疗、法律、金融这类专业事实核验必须保留人评", "C. 裁判模型比被测模型更强时，可以取消人评", "D. 黄金集冷启动的标准答案可以先让裁判自动生成一批，省一轮人力", "E. 放行门槛是裁判与人类的一致率不低于人与人之间的一致率"], a: [0, 1, 4], e: "C错误：更强的模型同样有位置、长度、自偏好这些偏差，安全合规边界、品牌语气与文化语域仍然要人判。D错误：冷启动阶段的标准本来就是人的判断，用裁判生成标注等于把裁判的偏差固化成地面真值，后面再也查不出来。" },
  { q: "裁判选强模型还是便宜模型，合理的判断有", o: ["A. 两种裁判跑出的趋势曲线可以互相替换着看，各自内部自洽即可", "B. 裁判预算应全押在最强模型上，因为裁判越贵结论越可靠", "C. 强裁判判得准、能遵循长 rubric，但贵且慢，且更容易与前沿候选同源，自偏好风险最高", "D. 便宜裁判跑得动全量回归，但对长 rubric 遵循差、噪声大，容易把格式像好答案当成内容好", "E. 分层是常见折中：便宜裁判跑冒烟与粗筛，强裁判跑发布门与争议样本，小比例人评做校准"], a: [2, 3, 4], e: "A错误：换裁判等于换量具，两条曲线的整体水位和斜率都不同，混着看会把裁判变更读成模型变更。B错误：结论可靠性来自偏差控制、锚例和人评校准，不是单价；越强的前沿模型与候选越可能同源，自偏好反而更重。" },
  { q: "让生成答案的模型同时当裁判（同一模型配同一份提示词），会出现", o: ["A. 把随机种子固定下来就能消除同源自评的偏差", "B. 缓解办法是裁判换模型家族、两家族交叉裁判，关键结论回落到人评", "C. 策略学会讨好裁判：评测分数上涨，人评与投诉同步恶化", "D. 这在强化学习里就是奖励被套路，与评测里的同源偏置是同一件事的两面", "E. 同一模型最了解自己的输出分布，自评天然无偏"], a: [1, 2, 3], e: "E错误：了解自己的分布只会让它更认得出、也更偏爱自己的风格，「无偏」恰好说反了。A错误：种子只固定随机性，同源是系统性偏差，锁种子只是把偏差稳定地留在结果里。" },
  { q: "关于裁判的格式语气偏差与分数漂移，正确的有", o: ["A. 剥掉样式做纯文本对照，可以检验分数到底是不是格式带来的", "B. 同一答案在不同批次拿到不同分，说明这道题本身有歧义", "C. 必须用打分制时，锁住锚例、同一批次不混裁判版本，能压住漂移", "D. 排版整齐、分点清晰、语气自信就容易被加分，即使内容有错", "E. 把事实性单独成一维并且先判，能减少好排版掩盖错内容"], a: [0, 2, 3, 4], e: "B错误：批次间漂首先是分数漂移，要查裁判版本、提示词、锚例和同批混跑的题目；题目歧义是另一回事，它会同时拉低人与人一致率。" },
  { q: "用成对比较汇报裁判结果时，统计口径上容易出问题的点，正确的有", o: ["A. 正反序判定冲突的样本要单独列成一类，不能被平均掉", "B. 只有几十对样本时，两三个百分点的胜率差通常还分不出真实好坏", "C. 候选数量够多，胜率差就能直接换算成质量分差距", "D. 中途换掉参照锚后，新锚挑得好，前后两批胜率仍然可比", "E. 胜、平、负要分开计：把判平全算给某一方或一律折算 0.5，胜率会随口径漂移"], a: [0, 1, 4], e: "C错误：胜率只是相对序上的比例，不是等距量表，换不成「高几分」。D错误：锚一换整条曲线的基准就变了，前后不能连读；非要换就让新旧锚并行跑一段做换算。" },
  { q: "关于 pass@k 的适用边界与估计口径，正确的有", o: ["A. 标准做法是生成 n 个候选、统计其中通过 c 个，再按组合数换算 pass@k", "B. 只跑 k 个样本看有没有通过噪声很大，多生成一些（n 远大于 k）再折算更稳，代价是算力翻几倍", "C. 写文案、做摘要这类没有唯一真值的任务，pass@k 无处可用", "D. pass@k 随 k 单调上升，所以 pass@200 最能体现模型的真实实力", "E. 它适合有免费真值的任务：代码有单元测试，数学题答案能精确匹配"], a: [0, 1, 2, 4], e: "D错误：k 越大越好看，pass@200 接近买彩票，它测的是「这么多尝试里有没有出现过一次解」，不是稳定交付能力。" },
  { q: "下列判断属于 ROUGE / BLEU 明显失真的场景，正确的有", o: ["A. 文本改写得更清晰时 n-gram 重合反而更少，会出现「分数降、质量升」", "B. 多准备几份参考答案，ROUGE 就能替代人工评分", "C. 同义改写的长摘要被打低分，照抄参考文本反而拿高分", "D. 开放式生成里，没写进参考答案的正确答案直接判零，这是 BLEU 的机制", "E. ROUGE 自带长度惩罚，能自动抵消摘要长短带来的影响"], a: [0, 2, 3], e: "E错误：长度惩罚在 BLEU 那一侧，ROUGE 偏召回，输出越长能命中的 n-gram 越多，天然占便宜。B错误：多参考只缓解表述单一的问题，字面重叠与语义质量的相关性依然弱，替代不了人评。" },
  { q: "用一个分类器在线上拦截坏答案，关于精确率、召回率与 F1，正确的有", o: ["A. F1 是精确率与召回率的算术平均，因此不太被低值拖累", "B. 这三个数都绑在同一个判定阈值上，阈值一动必须整体重算", "C. 把阈值调高，通常精确率和召回率会一起上升", "D. F1 只描述那一个工作点，线上换了工作点就不能直接引用它", "E. 正例极稀时总体准确率会虚高：全预测「放行」也能对九成九"], a: [1, 3, 4], e: "C错误：调高判定门槛一般是此消彼长——精确率换来召回率下降，是取舍不是白拿。A错误：F1 是调和平均，对低值非常敏感，一侧塌了整体就跟着塌。" },
  { q: "关于把 AUC 当离线指标，正确的有", o: ["A. 正负样本极度不平衡时 AUC 可能仍然好看，要配精确率-召回率曲线一起看", "B. 几百条样本上 AUC 从 0.85 提到 0.87，通常就足以判定新版本更好", "C. 它衡量整体排序质量，与具体判定阈值无关", "D. AUC 高说明分数校准得好，可以直接当概率用于决策", "E. 业务只关心 Top-k 时，AUC 会掩盖高分段的错排"], a: [0, 2, 4], e: "D错误：排序好不等于校准好，AUC 对分数整体平移和缩放都不敏感，把它当概率用之前要单独做校准检查。B错误：两个百分点在这个样本量下多半落在噪声区间里，先报置信区间或做显著性检验再下结论。" },
  { q: "要量化「过度拒答」（该答的也拒），合理的做法有", o: ["A. 按语言分开统计，低资源语言上的误拒通常更严重", "B. 把拒答话术统一成固定的一句，误拒率就归零了", "C. 拒答话术格式不一会让识别口径漂移，统计前先固定「什么算拒答」的判定规则", "D. 单独准备一批明确应该回答的良性提问，测误拒率，而不是只看安全榜通过率", "E. 安全召回率与误拒率必须一起报：只优化前者必然把后者推高"], a: [0, 2, 3, 4], e: "B错误：统一话术只改变文本样式，该答不答的行为一点没变，反而让下游更难从日志里发现误拒。" },
  { q: "要把「幻觉率」做成可核对的指标，正确的有", o: ["A. 换一个更强的裁判模型来判幻觉，口径就自动统一了", "B. 依据集（可核对的知识来源）要锁定并随版本发布，否则「无依据」无法复现", "C. 口径必须写死成「可验证断言中无依据断言的占比」，否则两次测量不可比", "D. 判定粒度要拆到断言级：整句判有没有错太粗，一句里对九错一也可能被整句判错", "E. 能自动核对的先测：数字、日期、编号、代码能否运行、引用是否真实存在"], a: [1, 2, 3, 4], e: "A错误：裁判再强也替代不了定义，换模型只是换了一套隐含口径；口径要写进评测规范并配正反锚例，才能跨版本比较。" },
  { q: "线上用采纳率与编辑距离衡量生成质量，关于两者口径，正确的有", o: ["A. 把「用户没点拒绝」当成采纳，会系统性高估采纳率", "B. 采纳率是建议被直接采用的比例，受任务难度影响大，跨功能不可比", "C. 编辑距离小不等于质量好：用户懒得改、将就用，也算改动小", "D. 编辑距离要按输出长度归一，否则长文本天然显得改得多", "E. 两者方向总是一致的，盯住一个就够"], a: [0, 1, 2, 3], e: "E错误：两者会反着走——用户改了一堆但照样用（采纳率掉、价值没掉），或原样接受一份没人看的废话（采纳率涨、价值为零），所以还要配人工干预率一起看。" },
  { q: "离线评测集涨了 4 个点，线上采纳率一点没动。合理的排查方向有", o: ["A. 看涨的是哪一类分：涨的是重叠度而人评不动，很可能是指标被讨好", "B. 离线多是一问一答，线上是多轮、长上下文、带工具失败与重试，本来不是同一个任务", "C. 说明线上用户不敏感，把评测集换成更难的题就能体现差异", "D. 几百条样本上 1～2 分本来就在噪声里，先算置信区间再谈归因", "E. 先比对评测集与线上流量在意图、语言、长度上的占比，按线上分布重抽样再跑一次"], a: [0, 1, 3, 4], e: "C错误：把考卷换难只会让分数整体下移，回答不了「线上为什么不涨」；分布、链路、功效三条线查完再谈题目难度。" },
  { q: "模型侧分数确实涨了，但收益在链路里被吃掉。属于这条排查线的证据有", o: ["A. 护栏误杀把合格答案拦在返回之前，而离线脚本没接护栏", "B. 这类问题再刷一轮离线分数就能定位，看分数波动即可", "C. 超时降级触发兜底模板，用户看到的其实不是新模型的输出", "D. 离线与线上用同一个模型版本时，链路差异可以忽略", "E. 缓存命中了改动前的旧结果，评测请求根本没打上新版本"], a: [0, 2, 4], e: "D错误：召回为空、超时降级、缓存旧结果、护栏误杀都在模型之外，同一个版本照样把收益吃掉。B错误：这一层要看 Trace 和链路埋点，分数波动只能告诉你「没涨」，告诉不了你在哪一段丢的。" },
  { q: "关于在线指标的口径，正确的有", o: ["A. 在线实验又慢又贵，不适合用来挡每次提交的回归，那部分该交给离线集", "B. 人工干预率（转人工、重试、改写提示词、放弃）是最便宜的负面信号", "C. 单位有效任务成本要把失败重试与人工复核工时算进分母，否则 ROI 会算虚", "D. 完成率与留存是端到端价值，但要看几周量级的周期，不能当天定论", "E. 一次线上实验可以同时改多个变量，样本够大就能分别归因"], a: [0, 1, 2, 3], e: "E错误：线上实验一次只能验一个变量，多变量混在一起，大样本也只是把混淆估得更精确，归因依然做不出来。" },
  { q: "对外汇报一次模型评测结果时，按正文口径必须给出的三要素是", o: ["A. 把榜单名次与参数量报清楚就算完整", "B. 模型名称、榜单名次、参数量", "C. 温度、top_p、max_tokens", "D. 提示词全文、API 单价、上线日期", "E. 指标定义、样本量与置信区间、离线还是在线"], a: [4], e: "单选。B错误：名次回答不了「这个数怎么测的、有多可信」，而且跨榜名次本来就不可比。C错误：采样参数是必须固定并公开的实验条件，属于指标定义的一部分，顶替不了样本量与区间。D错误：提示词全文通常涉密，单价与上线日期与结论可信度无关，正文要求的三要素里没有这些；A错误：缺指标定义与置信区间，名次无法判断可信度。" },
  { q: "给「长文摘要」这类任务挑离线指标，合理的有", o: ["A. 换成部分可验证的口径：必需点覆盖率、断言级事实核对、引用支持率", "B. 冗余度、schema 合规这类能程序化检查的维度单独成项", "C. 直接用 ROUGE-L 当主指标，它与人工评分高度相关", "D. 让裁判模型打一个总分就够，不必再设可验证维度", "E. 别硬套 pass@k：这类任务没有单元测试那样的免费真值"], a: [0, 1, 4], e: "C错误：ROUGE 与人工评分相关性弱，长文的价值在改写与判断，往往「分数降、质量升」。D错误：裁判总分本身带长度、格式、自偏好偏差，没有可验证维度兜底，分数涨跌无法归因，也挡不住被讨好。" },
  { q: "从生产日志抽题自建评测集，抽样阶段的正确做法有", o: ["A. 简单、中等、困难各留固定额度，否则回归集会悄悄变成全是简单题", "B. 超长输入、中英混杂、缺字段、空结果、对抗提问这些低频边界要专门留位", "C. 安全合规、专业事实、金钱与权限动作、不可逆操作单独成一层并强制覆盖", "D. 样本量够大就行，分层只是锦上添花，随机抽一万条自然覆盖长尾", "E. 按线上真实意图分布配比（问答、改写、抽取、代码、工具调用、拒答），而不是按题目好不好写"], a: [0, 1, 2, 4], e: "D错误：长尾在流量里本就占比极低，纯随机抽出来那一格只剩几条，起不了回归作用；分层后每格至少要留几十条，否则长尾那层只是装饰。" },
  { q: "在 100 条黄金集上测得正确率约 70%，按 95% 区间半宽约 1.96·sqrt(p(1−p)/n) 估算，下列说法成立的有", o: ["A. 其他条件不变时，p 越接近 0.5，半宽越大", "B. 报分数时附上样本量和置信区间，比只报一个点估计更负责", "C. 半宽约 9 个百分点，所以「涨了 3 分」完全可能只是噪声", "D. 想把半宽压到一半，样本量大约要加到四倍", "E. 从 100 条加到 200 条，半宽就正好减半"], a: [0, 1, 2, 3], e: "E错误：半宽按 1/√n 收缩，样本量翻倍只把半宽除以 √2（约 9 个百分点降到 6 个多），要减半得四倍量。" },
  { q: "想验证新版本把正确率从 70% 提到 78%，关于样本量与检验方式，正确的有", o: ["A. 同一批题跑两版却把两组结果当独立样本比较，会浪费配对信息、降低功效", "B. 样本量足够大之后，1 个百分点的差异也一定说明模型真的变好了", "C. 按 α=0.05、功效 80% 的两比例近似式，大约需要四百余条", "D. 若只想检出 3 个百分点的提升，需求量级再上一个台阶，要数千条", "E. 两版跑同一批题目时用配对检验（McNemar，只看一错一对的对子）更省样本"], a: [0, 2, 3, 4], e: "B错误：显著不等于重要，大样本能把噪声级差异推出显著性；分布漂移、题目污染、裁判换版这类系统误差也不会因为样本多就消失。" },
  { q: "标注流程里「试标校准」这一步，正确的认识有", o: ["A. 试标暴露的分歧要回写进标注指南，而不是只在会上解释一遍", "B. 试标样本应当从正式批次里随机抽，否则不能代表整体", "C. 先双人标二三十条，对口径后再铺量", "D. 跳过试标直接铺量，标到一半发现判据要改，整批返工是最贵的代价", "E. 试标只是为了培训新人，与判据口径无关"], a: [0, 2, 3], e: "B错误：试标发生在铺量之前，没有正式批次可抽；这个阶段反而要刻意挑边界样本，把最容易吵起来的情况提前暴露出来；E错误：试标暴露的分歧要回写判据，否则整批返工。" },
  { q: "黄金集的标签与判据设计，说法正确的有", o: ["A. 每档配正反例并包含边界示例；只给文字描述不给例子是常见错误", "B. 改了指南却不通知已标数据，同一题在新旧口径下会判出不同结果", "C. 把五档改成九档，粒度更细，标注一致率通常会随之提高", "D. 档位越多越专业，标注一致率会自然提高", "E. 用封闭标签集、每条判据写成二元可核对的观察项，比「好/一般/差」这种没有客观标准的三档更可复现"], a: [0, 1, 4], e: "C错误：档位在「好」与「较好」之间没有客观判据时只会更难分，一致率往往更低；要提一致率得改判据和锚例，不是加档位；D错误：档位越多判据越难统一，一致率通常下降。" },
  { q: "关于冒烟集、回归集、影子集、黄金集这四层的分工，正确的有", o: ["A. 黄金集由双人标注并仲裁锁定标准答案，季度更新，用于校准裁判与终审", "B. 四层里跑得最勤的那一层应当最大最全，才能及时发现问题", "C. 冒烟集几十条、秒级到分钟级，每次改提示词或改代码就跑", "D. 回归集数百条，按意图与难度配比，发布前必跑，结果进趋势看板", "E. 影子集是从线上流量匿名快照取的新题，永不公开、永不进训练，只周期性复测"], a: [0, 2, 3, 4], e: "B错误：分工正好相反——跑得越勤的集子越小越便宜，越靠下的越权威、更新越慢；把万条全量塞进每次提交，没人会再跑它。" },
  { q: "关于四层集合的使用纪律，正确的有", o: ["A. 影子集不能拿来反复调提示词：一旦用它做优化，它就变成了练习册", "B. 冒烟集失败但回归集通过时可以直接放行，冒烟只是形式", "C. 影子集分数明显低于回归集，是污染或分布漂移的信号之一", "D. 为省人力可以把影子集并进回归集，总题量够大即可", "E. 只有回归集与黄金集的成绩写进发布决策"], a: [0, 2, 4], e: "B错误：冒烟集挡的是链路坏掉（解析失败、工具不可用、模板写错），它挂了说明这次跑的东西根本不有效，回归集通过也没意义。D错误：合并等于自废——影子集的价值就在于永不公开、从不参与优化，一旦进回归集就会被反复针对。" },
  { q: "把评测集当密封真考卷管，属于防污染硬规矩的有", o: ["A. few-shot 示例与错误样例都不能从评测集里挑，这是最常见的隐形泄漏", "B. 不把题目给模型厂商、不写进公开博客，影子集只跑不发布", "C. 给每题算指纹，与训练、提示词、外发三条通道定期比对，命中即报警", "D. 训练侧做过 n-gram 去重后，提示词这条污染通道也一并堵住了", "E. 评测题目绝不进训练数据，SFT 样本、偏好对、RL 采样都算泄漏通道"], a: [0, 1, 2, 4], e: "D错误：提示词通道不经过训练数据，去重管不到它；把评测题当 few-shot 或错误示例贴进提示词，模型线上一答就命中，是最难事后察觉的泄漏。" },
  { q: "评测集的版本管理，正确的有", o: ["A. 所有模型都做对或都做错的题区分度接近零，是淘汰候选，但要先确认它不是风险面的强制覆盖项", "B. 为了让趋势好看，可以把历史版本做错的题从回归集里删掉", "C. 数据集带版本号与变更日志，题目只增不改", "D. 直接改题目内容而不换版本，历史报告立刻不可比", "E. 失效题（依赖的接口下线、事实已过时）应当退役但不删除，保留可追溯"], a: [0, 2, 3, 4], e: "B错误：那是改考卷迎合模型，趋势曲线当场失去意义；做错要保留、要复盘，只在题目本身失效时才走退役流程并记录原因。" },
  { q: "把评测回归接进 CI 当发布门禁，合理的设计有", o: ["A. 每次提交都跑全量黄金集上万条，越全越安全", "B. 门禁失败要能下钻到失败样本与 Trace，否则只剩一个没法行动的数字", "C. 阈值要按噪声定：几百条样本上把「跌 1 分」设成红线，会天天误拦", "D. 分层设线：冒烟集硬阻断，回归集看关键意图不劣化，安全与权限这类风险面零容忍", "E. 固定随机种子、解码参数与题目版本，门禁才谈得上可复现"], a: [1, 2, 3, 4], e: "A错误：跑得越勤的集子越小；全量黄金集该放在发布前或夜间任务，硬塞进每次提交只会让人开始无条件重跑和忽略门禁。" },
  { q: "把一批答案已知的题混进线上真实请求流当哨兵，关于它的读数与纪律，正确的有", o: ["A. 这批题要定期轮换、答案知情范围要收窄，否则会被人专门针对它优化", "B. 哨兵题通过率不掉，足以证明线上体验没有退化", "C. 题目长期固定不动，会因流量分布漂移而失去代表性，需要按周期换题", "D. 它掉分首先指向链路问题（路由到旧版本、解析器改了、缓存串了），而不是模型能力一夜退化", "E. 它的通过率不能并进整体指标，否则真实分布的分数会被抬虚"], a: [0, 2, 3, 4], e: "B错误：它只覆盖这批已知题，分布极窄；新出现的问题类型、长尾与风险面它一概测不到，通过率稳不代表体验没退化。" },
  { q: "从生产日志抽题进黄金集，来源记录与脱敏环节，正确的有", o: ["A. 进集前做去标识化：姓名、证件号、密钥、内部域名都要处理", "B. 用户原话里的行业黑话和错别字可以顺手改通顺，题目更好读", "C. 密钥和内部域名只影响观感、不影响答题，可以原样保留", "D. 脱敏会改变分布，所以进集前不做脱敏", "E. 记下时间窗、渠道与筛选方式，否则这份分布无法复现，后续漂移也没法解释"], a: [0, 4], e: "B错误：黑话、错别字、中英混杂正是线上真实分布的样子，洗成通顺书面语等于把考卷改成练习题，测出来的分数不再代表线上。C错误：密钥与内部域名一旦进集就扩大了泄露面，必须替换成虚构占位，不能以「不影响答题」为由保留；D错误：保真与脱敏可以并存，敏感信息必须处理。" },
  { q: "一份提示分成指令、上下文、示例、待处理输入与输出要求几段，关于它们的排列，正确的有？", o: ["A. 示例排在指令之前，指令容易被当成示例文本被模仿", "B. 输出要求塞在提示中段，比贴在末尾更稳", "C. 整段提示被当成一个序列续写，谁挨着生成点谁的话语权大", "D. 静态规则与动态资料混排即可，模型能自己分清主次", "E. 待处理输入贴近生成点，任务不容易被示例带偏"], a: [0, 2, 4], e: "B错误：离生成点越近越不会被读丢，输出要求贴末尾比塞中间稳；D错误：静态规则与动态资料混排会互相稀释，正文口径是别混排。" },
  { q: "挑选 Few-shot 示例时，符合正文口径的有？", o: ["A. 反例补上形容词说不清的那部分边界", "B. 示例数量越多，任务表现单调提升", "C. 同一类连给十条，模型会自己补齐其它形态", "D. 四个形态差异大的示例，通常胜过八个同分布的示例", "E. 边界样本把决策线写进提示"], a: [0, 3, 4], e: "B错误：示例超出覆盖需要之后主要增加 token 开销和分布偏置；C错误：十条同分布通常只锚定一个模式，换个形态照样靠猜。" },
  { q: "关于示例顺序与近因偏置，合理的做法有？", o: ["A. 最像当前输入的示例放在最后一条", "B. 示例顺序随意即可，位置对结果没有可观察的影响", "C. 后面的示例影响更大，这是 In-Context Learning 的位置效应", "D. 位置效应只出现在小模型上，强模型不受距离生成点远近的影响", "E. 多条示例让类别轮换排列，别把同一类固定在末尾"], a: [0, 2, 4], e: "B错误：近因偏置是真实存在的位置效应，随意排列可能让末条恰好把输出带偏；D错误：这是提示作为序列续写的物理事实，不由模型尺寸豁免。" },
  { q: "情感分类的提示里十条示例有七条标负面，中性文本常被判成负面。关于这个现象，正确的有？", o: ["A. 把七条负面挪到前面就能解决偏斜", "B. 加一句「注意别偏向负面」就能抵消分布带来的影响", "C. 偏斜的来源是示例的标签分布，不是模型没见过中性文本", "D. 这是标签分布偏斜，示例的标签先验盖过了输入本身", "E. 类别配平优先，宁可少给示例也别偏科"], a: [2, 3, 4], e: "A错误：位置只改变近因权重，七比三的统计比例仍在起作用，配平才是治本；B错误：模型抄的是示例里的形状与分布，一句提醒抵不过统计先验。" },
  { q: "关于「格式靠示例而不是形容词传达」，正确的有？", o: ["A. System Prompt 里写清了格式要求，示例的格式就会被它覆盖", "B. 想改输出风格，换示例比追加形容词更省力", "C. 「简洁专业别啰嗦」规定的是气质，不是形状", "D. 给一条理想输出，通常比三条风格形容词更能固定格式", "E. 示例里的标点、字段顺序、段落长度都会被模仿"], a: [1, 2, 3, 4], e: "A错误：示例离生成点更近，格式打架时通常是示例赢，所以两处要写成一件事。" },
  { q: "什么情况下不给示例（Zero-shot）反而更划算？正确的有？", o: ["A. 上下文预算紧张时，示例的机会成本可以忽略", "B. 任务定义清楚、模型本来就会（翻译、抽字段、总结）", "C. 示例会占 token、引入分布偏置，还会锁住答案风格", "D. 任务难时应当先加示例，把标准说清是次要的", "E. 先分清难的是「把标准说清」还是「模型不会做」"], a: [1, 2, 4], e: "D错误：标准不清要靠指令加验收条款，示例治的是形状不是能力；A错误：示例每轮重复发送，预算越紧这笔开销越显眼。" },
  { q: "示例里的「风格泄漏」可能表现在哪些方面？", o: ["A. 输出长度跟着示例的冗长程度走，与任务要求无关", "B. 示例里带错的事实被当成依据复述出来", "C. 示例给得越多，泄漏的概率越低", "D. 把示例标成 Input 与 Output，就能杜绝泄漏", "E. 示例中的具体实体名、日期出现在了对新输入的回答里"], a: [0, 1, 4], e: "C错误：可抄的表面特征随示例增多而增多；D错误：显式标注只划清输入输出边界，内容与语气照抄不误。" },
  { q: "指令遵循能力更强的新模型上线后，关于示例的作用，符合机制的有？", o: ["A. 示例的边际收益下降，但形状锚定仍然有用", "B. 指令遵循变强后，示例里的标签分布偏斜就不再起作用", "C. 示例与指令冲突时，模型必定优先听指令", "D. 换模型后示例集要重跑回归，不能默认继续有效", "E. 清楚的分节指令能替代一部分示例，示例可以更省"], a: [0, 3, 4], e: "B错误：示例是统计信号，分布偏斜不会因为模型更听话就消失；C错误：示例贴近生成点，冲突时未必优先执行指令。" },
  { q: "把示例排进提示时，关于输入与输出的边界，正确的有？", o: ["A. 示例与真实待处理输入之间要有明确分隔，免得示例被当成待处理内容", "B. 示例只给输入不给输出，同样能锚定期望形状", "C. 示例的结束方式要与期望输出的结束方式一致，否则模型不知道何时停", "D. 示例的输入与输出要显式标注，边界不能全靠猜", "E. 示例与待处理输入混排能省 token，且不影响结果"], a: [0, 2, 3], e: "B错误：没有输出部分的示例只是又一道题，形状无从锚定；E错误：混排会让模型把示例当成待处理内容。" },
  { q: "关于在提示里使用反例，正确的有？", o: ["A. 给了反例就可以省掉正例", "B. 反例把决策边界写进提示，那是形容词说不清的部分", "C. 反例也要给完整的输入输出对，只标「这个不对」模型学不到该怎么处理", "D. 反例比例过高会把示例集的标签分布带偏", "E. 反例必须排在最前面，模型才学得会拒绝"], a: [1, 2, 3], e: "E错误：位置规则不因反例改变，把拒绝类样本压到末尾反而可能把输出锚在拒绝上；A错误：反例划边界、正例给形状，缺正例就只剩「不能怎样」。" },
  { q: "按当前输入动态检索示例、而不是一套示例固定不动，正确的说法有？", o: ["A. 多出一条检索链路要维护和评测", "B. 动态挑示例能让准确率单调上升", "C. 挑到的示例若类别不配平，照样引入标签偏斜", "D. 覆盖面更贴近线上真实分布", "E. 示例每轮都在变，前缀一致性下降，缓存收益随之受损"], a: [0, 2, 3, 4], e: "B错误：挑得准不准取决于检索质量，分布偏置与风格泄漏也不会因为改成动态就自动消失。" },
  { q: "把同一条要求同时写进指令和示例，效果与风险，正确的有？", o: ["A. 指令与示例冲突时，模型通常更信指令", "B. 重复的内容额外占 token，还把风格锁得更死", "C. 指令与示例同时存在时，遵守率会更高", "D. 两者一致时是强化锚定，输出更稳", "E. 两者冲突时模型常跟着示例走，冲突面被放大"], a: [1, 3, 4], e: "C错误：两者不一致时反而互相拆台，重复本身不等于可靠；A错误：冲突时模型常跟着示例走，冲突面被放大。" },
  { q: "把 status 字段收成枚举，正确的说法有？", o: ["A. 三选通常比「正常、异常、未知、其他、待定」五选更好落地", "B. 枚举约束可以替代内容校验", "C. 取值空间变小，下游分支才写得住", "D. 枚举值要与业务口径逐字一致，否则校验直接判非法", "E. 用了枚举，字段里的值就不会是编的"], a: [0, 2, 3], e: "E错误：枚举管取值集合，不管这个取值是否属实；B错误：语义正确性只有校验那一档管，格式合法不等于内容真实。" },
  { q: "关于 required 与可空字段的设计，正确的有？", o: ["A. 「缺信息就填 null」这条路要写清，给模型一个合法的退出方式", "B. required 越多，整体遵守率通常越高", "C. required 只锁真必需的字段，锁太多会逼模型硬填", "D. 可空字段要明确允许 null，否则一部分幻觉是被 schema 逼出来的", "E. 把所有字段都设成 required，能最大限度减少漏填"], a: [0, 2, 3], e: "E错误：不给 null 出路时模型会编一个看起来合理的值，字段填满了内容反而更差；B错误：约束越密，一次输出里出现违反的概率越高。" },
  { q: "给摘要字段设长度上限，正确的说法有？", o: ["A. 再叠加过小的 max_tokens，整段 JSON 可能在结构中途断掉", "B. 上限放得越松，下游解析失败率越低", "C. 作用是防止模型把摘要写成小作文", "D. 上限收得太紧会截掉要点，排在末尾的信息先丢", "E. 长度上限只能写在提示里，schema 表达不了"], a: [0, 2, 3], e: "E错误：maxLength 这类约束可以写进 schema，配合约束解码还能从语法层保证；B错误：输出越长越容易顶到全局 token 上限，结构也越容易走偏。" },
  { q: "为了提高结构化输出的遵守率，schema 层面的设计哪些做法有效？", o: ["A. 一次只要求少数几个字段，比一次要十几项的整表更容易全部填对", "B. 做成多层深嵌套的大对象，条理更清楚，遵守率更高", "C. 用 pattern、最大值这类取值约束去收窄最容易填错的字段", "D. 把校验规则全压进 schema，就能保证内容真实", "E. 浅嵌套优于深嵌套，层级越深漏填越多"], a: [0, 2, 4], e: "B错误：嵌套越深，漏填与结构漂移越多，正文口径是浅嵌套；D错误：schema 管结构与类型，语义正确要靠出处字段与校验重试。" },
  { q: "把 evidence 排在 conclusion 之前能提高准确率，原因正确的有？", o: ["A. 字段顺序能影响质量，说明模型是逐 token 续写而不是一次性填表", "B. 后面的字段是在前面已生成文本的条件下采样出来的，先落依据等于自带脚手架", "C. 这与思维链提升多步任务准确率是同一类机制", "D. 依据排在前面主要是方便人阅读，对模型输出质量没有影响", "E. 结论先写、依据补在后面时，依据容易变成事后找理由"], a: [0, 1, 2, 4], e: "D错误：字段顺序是实打实的采样条件差异，不只是可读性问题。" },
  { q: "结构化输出校验失败后，重试策略合理的有？", o: ["A. 回灌报错时要提防外部数据里的文本被当成指令执行", "B. 重试次数越多，最终通过率单调上升", "C. 把校验器的报错原样喂回模型，比原样重试更有效", "D. 同提示同温度原样重试，大概率复现同一个错", "E. 重试时降低 Temperature，必要时只重生成失败的字段"], a: [0, 2, 3, 4], e: "B错误：失败多来自结构或理解问题，在同一坑里反复采样没有用，连着几次仍失败就该改 schema 或换策略。" },
  { q: "模型产出的函数调用参数出现幻觉，典型表现包括？", o: ["A. 参数类型合法，值却来自上下文里不存在的实体", "B. 开启函数调用之后参数值就可靠了，只需校验字段是否齐备", "C. 「缺信息就留空并说明」这类提示条款能部分抑制参数幻觉", "D. 编造并不存在的 ID、路径或枚举值，把参数填满", "E. 把 schema 里根本没有的参数名也一并传出去"], a: [0, 2, 3, 4], e: "B错误：约束解码只保证语法合法与字段齐备，值真不真不在它管辖范围。" },
  { q: "把长输出拆成标题、发现、证据、置信度几个字段，而不是让它自由写份报告，正确的有？", o: ["A. 出处字段（文档编号、行号、URL）让结论能被程序核对", "B. 置信度字段要预先定义口径，否则不同批次的分数不可比", "C. 字段就是清单，缺哪项补哪项，便于程序化检查", "D. 每个字段能单独设类型与上限，可测性更好", "E. 拆字段一定会丢掉整体连贯性，任何场景都不如自由长文"], a: [0, 1, 2, 3], e: "E错误：叙事类任务确实更适合自由长文，但「任何场景都不如」说过头了，可核查的工程输出正是靠拆字段。" },
  { q: "关于 schema 校验与业务规则校验的分工，正确的有？", o: ["A. 给不出出处的结论降级为待验证，让下游能识别而不是硬凑出处", "B. schema 查得出类型与枚举非法，查不出金额是编的", "C. 日期区间、金额与明细是否一致这类规则要放在 schema 之外", "D. 语义正确性只有校验这一档管，格式合法不等于内容真实", "E. 上了约束解码就可以去掉 schema 校验环节"], a: [0, 1, 2, 3], e: "E错误：约束解码治语法，校验治结构与内容，两者不互相替代。" },
  { q: "遇到「语法完全合法但内容不可用」的结构化输出，合理的识别与处置有？", o: ["A. 把出处字段与源数据做程序比对，比人工抽查更快发现编造", "B. 让模型对每个字段自报置信度，就能替代事实校验", "C. 用另一个模型做忠实度核对时，要限定它只依据给定资料", "D. 结构合法就先入库，等用户投诉再回头处理", "E. 校验里补「非空不等于有效」的规则，例如空数组、占位值、所有字段同一个值"], a: [0, 2, 4], e: "B错误：自报置信度只是模型生成的一句话，能帮下游排序，但不是事实证据；D错误：格式完美的假数据最难被发现，入库即污染下游。" },
  { q: "只在提示里写「请输出合法 JSON，不要多余文字」，这种纯提示约束的特点是？", o: ["A. 把这句话重复三遍，破功率就能压到接近零", "B. 反复破功时，升级到 JSON 模式或函数调用比继续加形容词有效", "C. 可靠性靠模型自愿，长输出与深嵌套时容易破功", "D. 破功的常见形式是在 JSON 前后加解释文字或 Markdown 围栏", "E. 字段少、输出短的任务上通常够用"], a: [1, 2, 3, 4], e: "A错误：重复措辞不改变采样机制，非法结构照样可能出现。" },
  { q: "关于 schema 与提示的配合，合理的说法有？", o: ["A. schema 已经写对，提示里就不必再写取值口径", "B. null、空字符串、字段缺失三种空值语义要在提示里区分，否则会混用", "C. 字段描述写得含糊，模型会按自己的理解补全字段语义", "D. 字段名本身就是提示，evidence 比 info 更能诱导模型给出证据", "E. 输出格式要求贴近生成点末尾，比埋在提示中段稳"], a: [1, 2, 3, 4], e: "A错误：schema 管类型与枚举，业务口径和缺信息怎么办仍要靠提示说明。" },
  { q: "一份两万 token 的提示里既有硬约束又有关键资料，位置怎么安排更稳？正确的有？", o: ["A. 把中段的关键资料加粗强调，就能稳定读到", "B. 硬约束放最前，关键资料放末尾", "C. 首段与末段召回最好、中段最弱，呈 U 形", "D. 开头有格式上的先天优势，结尾紧邻生成点", "E. 按资料收集的先后顺序摊开即可，位置不影响读取"], a: [1, 2, 3], e: "E错误：正文口径是关键两页夹在开头和结尾，别按收资料的先后摊开；A错误：中间丢失是注意力层面的稀释，与排版标记无关。" },
  { q: "为了让提示前缀缓存多吃到命中，提示内部该怎么排？正确的有？", o: ["A. 开头塞一个时间戳或会话 ID，会让整段前缀每次重算", "B. 工具列表顺序随机排一下没关系，不影响命中", "C. 顺序稳定才能复用重复部分，命中的 token 通常按折扣价计费", "D. 把不变的挪到最前并保证逐字节不变，收益通常大于删几百字修辞", "E. 系统提示、项目规范、工具 schema 这类逐字节一致的内容放最前"], a: [0, 2, 3, 4], e: "B错误：命中靠的是前缀完全一致，顺序一变一致性就没了。" },
  { q: "半静态层（本轮检索片段）在提示里怎么排，合理的有？", o: ["A. 片段给得越多答案越准，二十个半相关通常强过三个强相关", "B. 资料多到一定规模，先回到检索而不是继续加长", "C. 编号写进提示后，出处字段才能被程序化核对", "D. 每个片段带编号与出处，让模型能引用而不是靠位置猜", "E. 片段顺序固定，有助于复用重复部分"], a: [1, 2, 3, 4], e: "A错误：塞二十个半相关片段，往往比只给三个强相关的更容易答错。" },
  { q: "时间序材料与相关性材料混在一起时，符合正文口径的有？", o: ["A. 两类顺序冲突时以相关性优先", "B. 把有因果关系的时间线强行按相关性打散，会破坏顺序信息", "C. 每类内部排好序时，中段位置的读取质量没有差别", "D. 相关性优先就意味着不再标注来源时间", "E. 代码 diff、对话轮次天然按时间排，RAG 片段天然按相关性排"], a: [0, 1, 4], e: "C错误：排序不解决位置权重，中段照样被稀释；D错误：相关性优先说的是排列次序，出处与时间仍要作为标注保留。" },
  { q: "一份三万 token 的提示，调用没有任何报错，答案质量却明显比三千 token 时差，最合理的解释是？", o: ["A. Temperature 太高，采样随机性压过了长度的影响", "B. 超出窗口被截断，属于读不完", "C. 注意力稀释：读了但读不准，质量随长度下滑", "D. 缓存没命中，导致同一个提示给出不同答案", "E. 把温度调低就能恢复三千 token 时的质量"], a: [2], e: "单选。C正确：不报错、质量随长度下滑是注意力稀释的特征。B错误：超出窗口是读不完，会表现为结尾缺失或结构不闭合；D错误：缓存命中影响的是时延与计费口径，解释不了质量随长度的稳定退化；A错误：温度只改变随机性，与长度带来的单调变差没有因果；E错误：这是注意力稀释，与采样随机性无关。" },
  { q: "多轮会话里用摘要替换旧轮次，正确的做法与代价有？", o: ["A. 压缩有损，要留下能回捞原文的引用", "B. 摘要丢掉的关键约定，后续每一轮都看不见它", "C. 窗口够大时摘要可以省掉，长度本身不影响答案质量", "D. 工具输出可以截断，保留路径与关键行即可", "E. 摘要只留事实与决定，把寒暄和重复的中间过程换掉"], a: [0, 1, 3, 4], e: "C错误：窗口够大不等于读得准，注意力稀释让质量随长度下滑。" },
  { q: "长上下文导致的退化有两种，正确的说法有？", o: ["A. 注意力稀释是读了但读不准，不报错，质量随长度下滑", "B. 两种退化都能靠接口报错发现", "C. 日志里没有错误，就证明提示长度是安全的", "D. 判断是不是只是截断，可以看结尾是否完整、结构是否闭合", "E. 超出窗口是读不完，会被截断，看得见"], a: [0, 3, 4], e: "B错误：稀释不报错；C错误：无错误只排除了读不完这一类，读不准恰恰是静默的。" },
  { q: "工具 schema 是每轮的固定开销，合理的处理有？", o: ["A. 工具描述写长一点对预算没影响，反正不进对话", "B. 常驻内容要精选，逐字节一致才能同时省预算又保住缓存命中", "C. 工具数量到一定规模后，膨胀的只是提示前缀，回答质量不受影响", "D. 注册的工具越多，每轮重复发送的 token 越多", "E. 能按需注入的工具就别常驻，这正是常驻规范与按需技能分层的理由"], a: [1, 3, 4], e: "A错误：工具描述就是 schema 文本，每轮都要算 token；C错误：前缀膨胀一边挤占任务预算、一边稀释注意力，两头都会坏。" },
  { q: "实测的有效上下文明显小于标称窗口，这个数字对提示设计的含义有？", o: ["A. 标称 128K 就意味着塞满 128K 资料后仍能同等质量作答", "B. 没触发截断，就说明长度还在可用范围内", "C. 长度接近上限时成本与时延一起上升，排布收益要算总账", "D. 别按标称窗口规划提示长度，关键信息要留安全余量", "E. 有效长度要用自己的任务实测，跨任务不能直接搬运"], a: [2, 3, 4], e: "A错误：标称是位置编码上限，不等于可用质量上限；B错误：不截断只说明没超窗，稀释早就开始了。" },
  { q: "静态层、半静态层、动态层三层排布中，动态层放什么、放哪里，正确的有？", o: ["A. 静态规则与动态资料混排会互相稀释", "B. 把每次都变的内容整体提到最前，有利于提高缓存命中", "C. 摘要后的历史、当前问题与格式要求属于动态层", "D. 动态层贴近生成点末尾，符合位置优势", "E. 每次都变的用户画像放在动态层最前、静态层之后，能保住静态前缀的命中"], a: [0, 2, 3, 4], e: "B错误：变的内容放最前，会把后面所有静态内容一起赶出命中区。" },
  { q: "要瘦身一份越来越长的系统提示，合理的做法有？", o: ["A. 不常驻的规范移到按需层，而不是全塞在系统提示里", "B. 条款越多越安全，冗余不会干扰判断", "C. 删完要重跑回归，确认原来不是靠冗余条款兜底", "D. 末尾的输出要求与出处格式要保留，它们贴着生成点起作用", "E. 先删重复的形容词式要求，保留可执行的约束与验收条款"], a: [0, 2, 3, 4], e: "B错误：冗余既占预算又稀释注意力，越多并不越安全。" },
  { q: "关于会话内提示逐轮增长的后果，合理的有？", o: ["A. 早期达成的约定越到后面越容易被读丢", "B. 历史增长只增加费用，不影响答案质量", "C. 按需注入工具与技能能压住每轮的固定开销", "D. 摘要替换旧轮次同时改善预算占用与中段稀释", "E. 每轮把全量历史重发一次，累计 token 随轮数按平方量级增长"], a: [0, 2, 3, 4], e: "B错误：长度上升还带来注意力稀释，费用只是其中一头。" },
  { q: "把提示当作资产做版本管理，合理的做法有？", o: ["A. 线上紧急时在控制台热改提示，不留记录也可以接受", "B. 提示用到的示例集与 schema 要一起版本化，否则回滚不彻底", "C. 每次改动记一句动机与验收结论，便于事后归因", "D. 提示进版本库，与代码一起提 PR，可 diff、可回滚", "E. 提示版本号要能与它所用的模型版本、数据集版本对上"], a: [1, 2, 3, 4], e: "A错误：无痕热改让故障无法归因，回滚也找不到目标状态，事后至少要补记录与评审。" },
  { q: "提示改动也要跑离线回归，合理的说法有？", o: ["A. 只看一条样例变好了就上，容易按下葫芦浮起瓢", "B. 提示只是文本，不必像代码那样安排测试", "C. 回归集全绿就等于线上没问题，不必再看灰度指标", "D. 一段提示常被多个任务共用，改动会牵动其它任务", "E. 提示改动在一两条样例上验证通过就可以上线"], a: [0, 3], e: "B错误：文本改动的作用面和代码一样广，而且失败是静默的；C错误：离线回归覆盖不到真实分布与多轮组合，线上指标仍要看；E错误：一段提示常被多个任务共用，要看回归集。" },
  { q: "提示与模型版本耦合，合理的说法有？", o: ["A. 针对旧模型弱点写的补丁，在新模型上可能只剩噪声", "B. 提示没变时，换模型不需要重新评测", "C. 效果好坏是提示与模型的联合结果，两个版本要成对记录", "D. 换模型后原提示的遵守率可能变化，提示不是与模型无关的常量", "E. 模型升级要把提示一起纳入回归，而不是只测模型"], a: [0, 2, 3, 4], e: "B错误：真正被测的是提示与模型的组合，模型一换结论就可能翻。" },
  { q: "提示文件本身也是攻击面，把它当作可被篡改的代码来管，合理的管控有？", o: ["A. 运行时有权限控制，提示内容被改就不影响安全边界", "B. 提示文件要有 owner 与变更审批，改动走评审", "C. 第三方模板引入前要审读里面有没有改变行为的指令", "D. 构建时对提示模板与 AGENTS.md 做来源与完整性校验，与依赖锁定一个思路", "E. 提示被篡改不必走安全事件流程，改回来就行"], a: [1, 2, 3], e: "E错误：提示被篡改等于行为被篡改，应按事件处理并回滚；A错误：权限控制不能只靠提示词，但提示是执行链的一环，被改会改变模型对指令与数据的判别。" },
  { q: "什么时候该改检索或数据，而不是继续改提示？正确的有？", o: ["A. 线上指标下滑时，第一反应应当是多加几条提示条款", "B. 错误来自资料没召回或召回错，改提示措辞通常无效", "C. 模型缺领域知识时该补数据或上检索，而不是加形容词", "D. 输出格式不稳定时，优先调 schema 与示例，不必动知识库", "E. 先定位失败发生在哪一层，再决定动检索、schema 还是提示"], a: [1, 2, 3, 4], e: "A错误：提示条款不是万能旋钮，没定位到失败层就加条款，只会把提示越写越长。" },
  { q: "提示评审与验收怎么进流程，合理的有？", o: ["A. 关键业务的提示要有 owner 和明确的回滚路径", "B. 提示变更走与代码同样的评审，评审人能直接看到 diff 与动机", "C. 验收条款要可判定，写「更专业一点」没法核查", "D. 提示属于文案，交由产品同学自行发布就行", "E. 上线时附上回归集结果与被否决的备选方案"], a: [0, 1, 2, 4], e: "D错误：文案式发布既没有评审也没有回滚，线上失败会归因不清。" },
  { q: "提示资产的可复用与可维护，正确的有？", o: ["A. 复制粘贴的多份提示会随时间漂移，改一处漏一处", "B. 占位符插值能复用结构，但外部文本插进占位符要处理好边界", "C. 提示越通用越好，不需要为具体任务分化", "D. 复用单元带版本号，跨团队引用时能追到源头", "E. 通用规则与任务专属规则分层，免得每处复制一份"], a: [0, 1, 3, 4], e: "C错误：通用规范与任务验收条款职责不同，硬合成一份两头都做不好。" },
  { q: "怀疑问题不在提示措辞时，合理的验证手段有？", o: ["A. 把长提示分段裁剪做对照，定位到底哪一段在起作用", "B. 多改几版措辞轮流上线，总能撞出好的那一版", "C. 看失败样本是否集中在某个输入分布，而不是整体退化", "D. 比较前先固定采样参数，否则差异可能来自解码随机性", "E. 用另一个更强的模型跑同一提示，区分提示问题与模型能力问题"], a: [0, 2, 3, 4], e: "B错误：不受控的措辞搜索既慢又无法归因，改完也说不清是哪一处起了作用。" },
  { q: "提示与评测集一起演化，正确的有？", o: ["A. 提示改动记录与评测集版本一起存，能复盘哪次改动引入了问题", "B. 线上坏 case 要回流成回归集条目，否则同类错误反复出现", "C. 提示里每加一条新规则，最好配一个能判定的例子", "D. 评测集一旦定稿就绝不能再改，否则历史分数不可比", "E. 加新条目时保留旧的基线子集，分数才能跨版本对齐"], a: [0, 1, 2, 4], e: "D错误：评测集要随业务增长，保持可比的办法是固定基线子集，而不是禁止新增。" },
  { q: "关于直接提示注入与间接提示注入的本质差别，正确的有？", o: ["A. 直接注入只来自用户输入框，工具返回值与检索文档都归间接注入", "B. 间接注入只在 RAG 里成立，Agent 读到的外部内容不算", "C. 请求来源是已登录用户，就不可能发生间接注入", "D. 差别在入口不在动机，两类都想让模型执行攻击者控制的指令", "E. 间接注入更难防，因为全部输入被摊平成同一条 token 流，架构上没有一位标记写着这段是数据、那段是指令"], a: [0, 3, 4], e: "B错误：Agent 读邮箱、读网页、读数据库字段都是间接注入，正文点名的典型受害者恰恰是 Agent 与 RAG 两类。C错误：间接注入的指令作者本来就不是当前请求者，登录态与用户信誉都拦不住被污染的文档。" },
  { q: "模型为什么分不清检索回来的第三方指令和你的系统提示词？说法正确的有？", o: ["A. 换一个更强的主模型，就能从原理上分辨指令与数据", "B. 两者进入模型后只是同一条 token 序列里的不同片段，唯一区别是谁写的，而模型看不见作者", "C. 加定界符并声明以下外部内容仅作数据，只是给模型一条可参考的线索，不构成强制", "D. 把外部内容放在上下文末尾，模型就会自动把它当数据而不是指令", "E. 系统提示词写得够长时，外部指令挤不进决策"], a: [1, 2], e: "D错误：位置不赋予内容权限，排在末尾的外部文本同样能压过排在开头的禁令，这正是 lost-in-the-middle 之外的另一件事。E错误：长度是竞争权重的手段之一，不是隔离机制；提示词再长也只改概率。A错误：分辨不了的根源在架构上不分指令与数据，与模型强弱无关。" },
  { q: "关于工具返回值与 MCP 的信任边界，正确的有？", o: ["A. 工具返回值由代码拼装并做过格式化，比用户输入更可信", "B. MCP server 是自家注册进来的，它的响应内容就不必当外部数据看", "C. 判据是凡不是你自己拼装的文本，都是不可信输入", "D. 工具描述本身也能承载注入，等于往你的系统提示词层面埋雷", "E. 可以让高风险工具的输出不进主模型上下文，只把结构化结论交给主模型"], a: [2, 3, 4], e: "A错误：格式化只改形态不改来源，返回值里的字段（网页正文、邮件正文、第三方 API 响应）仍是攻击者写的文本。B错误：注册解决能不能调用，不解决内容可信不可信；内部 server 转发的外部数据同样是入口。" },
  { q: "关于 Base64、ROT13、小语种转写这类编码绕过，正确的有？", o: ["A. 编码后的文本 token 数会变多，长度限制能自然把它拦下", "B. 只有小语种转写会造成绕过，Base64 会被分词器直接拒绝", "C. 它的机理是语义恶毒、形态无害，绕开的是明文匹配而不是语义判定", "D. 因此关键词与明文黑名单对这类输入基本无效", "E. 兜底应放在输出侧的合规分类，而不是继续在输入侧穷举编码形态"], a: [2, 3, 4], e: "A错误：长度不是安全属性；变长不构成拦截，几十行 Base64 也能表达一条完整恶意指令，而且长度上限本来是为窗口与成本设的。B错误：三者是同一类机理（换形态不换语义）；分词器只切字节序列，切完模型照样能学会解码执行，Base64 高频出现时甚至更容易被切开理解。" },
  { q: "前十轮单轮看都无害，一轮一步把边界往外推。关于多轮渐进诱导，正确的有？", o: ["A. 因为摘要压缩会掉字，所以摘要里没出现敏感词就等于安全", "B. 违规发生在最后一句，所以只对最后一句做判定即可", "C. 风险不在任何单轮的字面违规，而在允许范围被逐步外推", "D. 有效缓解是每轮独立做一次安全判定，不继承前轮的放行结论", "E. 只看第一轮或只看整段对话累计摘要，正是正文点名的无效缓解"], a: [2, 3, 4], e: "A错误：摘要把逐步试探压成一段正常对话，掉掉的恰好是那句往外挪一点的措辞，这是摘要做安全判定的失效方式。B错误：最后一句往往字面无害（继续刚才那个话题再说一点点），拦它要看的是趋势而非末句。" },
  { q: "为什么对齐做得最强的模型仍然会被越狱？正确的有？", o: ["A. 把系统提示词写得更长更严格，等价于补上这个证明", "B. 对齐是统计优化，RLHF/DPO 压低的是有害输出的概率，不是穷尽输出空间", "C. 只要生成是逐 token 的概率采样，就存在拒答概率极低的路径，而这类路径会被自动化搜索找出来", "D. 越狱成功率高说明该模型没做对齐训练", "E. 再多跑一轮偏好优化，就能给出不存在越狱路径的证明"], a: [1, 2], e: "D错误：正文的结论是越狱在最强对齐模型上仍然有效，对齐只是降低成功率，成功率高不等于没训练过。E错误：概率性优化给不出形式证明，再加一轮抬升的仍然只是概率。A错误：提示词层面的承诺只是概率修正，不是保证，防御必须建在模型之外。" },
  { q: "在系统提示词里写一句绝不允许把数据发到外部地址，为什么不算防御？正确的有？", o: ["A. 真正止血的写法是这个外发工具根本没注册，或收件人不在白名单里，模型想调也没有入口", "B. 这句话和攻击语在同一条 token 流里竞争权重，模型可以被骗到不遵守它", "C. 写进提示词改变的是概率，写进运行时改变的才是可能", "D. 把这句话从 user 移到 system 位置，就变成硬约束", "E. 同一条规则重复三遍并加粗，就等价于工具白名单"], a: [0, 1, 2], e: "D错误：位置只影响优先级与权重，不改变它可以被说服这个本质，正文把提示词层面的承诺归为概率修正。E错误：措辞强度与重复次数仍是概率修正，只要还存在一句能顶过去的话术，保证就不成立；白名单是结构性的，没有注册就没有调用入口。" },
  { q: "给外部内容做来源打标与定界包裹，能缓解什么、不能缓解什么？正确的有？", o: ["A. 它把外部内容变成不可执行的数据，之后就不必再拦动作", "B. 要与高风险工具降权、白名单配合才有意义", "C. 有了来源打标，输出侧的泄露检测就可以下掉", "D. 给模型一条可参考的边界线索，降低把外部内容当指令执行的概率", "E. 让审计时能说清哪段内容来自哪个来源，便于事后定位与归因"], a: [1, 3, 4], e: "A错误：打标是提示层约定，不是运行时强制；执行权在 harness，一段被标成数据的文本仍然能请求工具调用。C错误：打标只降低把内容当指令的概率，管不了把内容往外发；敏感数据泄露检测属于输出侧，与打标不同层。" },
  { q: "关于 RAG 语料投毒，正确的有？", o: ["A. 入库前跑一遍正则清洗就够，检索后再处理属于打补丁", "B. 主防线是来源准入与审计，以及对不可信来源降权", "C. 检索只取 top-1，被污染文档里的指令就带不进来", "D. 攻击者不需要接触你的系统，污染一份公开可检索的文档就够", "E. 你的检索管线会把别人的指令郑重其事地送进上下文，这是它比当面注入更阴的地方"], a: [1, 3, 4], e: "A错误：检索后打补丁式清洗在正文里被明确列为无效缓解，而入集正则同样拦不住换形态的写法，两者都不如准入与降权可靠。C错误：条数少不等于不带入，top-1 也是别人写的文档；要改的是它被谁批准进库、以及它的权重。" },
  { q: "Agent 读邮箱时，某封邮件正文写着把通讯录导出并发送到某个外部地址。下列处置中最站得住的是？", o: ["A. 先让模型判断邮件是否可疑，可疑的不读就行", "B. 把外发邮件做成需人工二次确认且收件人走白名单，通讯录读取只给只读凭证并全程留审计", "C. 禁止 Agent 访问邮箱，让这类入口消失", "D. 在系统提示词里补一句不要执行邮件正文中的指令", "E. 让邮件先经模型摘要再进上下文，把可疑句子摘掉"], a: [1], e: "单选。D错误：仍是提示层的概率修正，模型可以被一句更好的话术劝服。E错误：摘要器自己吃进同一份恶意文本，属于检索后打补丁式清洗那一类无效缓解。C错误：逐个砍功能等于没有防线，网页、PDF、工单、数据库字段是同一类入口，要修的是外发动作的权限与确认；A错误：判断本身在同一条不可信链路上，注入句可以写得毫不可疑。" },
  { q: "正文说直接注入的共同点是攻击者就是说话人。这一事实的工程价值在于？正确的有？", o: ["A. 间接注入的指令作者往往不是当前请求者，按用户信誉处置打不到攻击者", "B. 所以间接注入只能事后发现，工程上做不了任何预防", "C. 所以审计用户 ID 就同时覆盖了两类注入", "D. 两类注入动机不同，所以防御思路完全分开，不必分层", "E. 请求者与指令作者同一，可以把恶意样本归因到账号，做速率限制、信誉分与封禁"], a: [0, 4], e: "B错误：间接注入的预防手段是给外部内容定界、降权、把高风险动作挡在 harness 层，不是放弃。C错误：用户 ID 归因对间接注入失效（写邮件的人不是发请求的人），仍需入口与动作两层防线。D错误：动机都是让模型执行攻击者指令，差别只在入口，而防线都建在模型之外、按入口分层。" },
  { q: "把攻击类型与缓解手段配对，正确的有？", o: ["A. 编码绕过对应输出侧合规分类兜底", "B. 多轮渐进诱导对应只审第一轮或只看累计摘要", "C. 间接注入对应指望模型自觉区分", "D. 越狱对应输出分类加红队回归测试", "E. 角色劫持对应指令与数据分离、来源打标"], a: [0, 3, 4], e: "B错误：这两条在正文里被明确列为无效缓解，有效的是每轮独立做安全判定。C错误：指望模型自觉不是缓解手段；外部内容定界加高风险工具降权才对应间接注入。" },
  { q: "关于护栏在输入侧、输出侧、动作侧三个站位，正确的有？", o: ["A. 输出侧常见检查包括毒性合规分类、JSON Schema 结构化校验、系统提示词与敏感数据泄露检测", "B. 输入侧拦得越严，输出侧与动作侧就越可以简化", "C. 用小模型给大模型守门已是标配，调用成本与主模型差一个数量级", "D. 动作侧拦在工具调用参数落地之前，是唯一能真正止血的防线", "E. 生成错了可以重说，转账发出去收不回来，这是动作侧优先的理由"], a: [0, 2, 3, 4], e: "B错误：三层各管一类风险，入口拦不住的改写与越权要靠动作侧白名单，把入口收紧只是把误杀率抬上去，换不来后两层可以下岗。" },
  { q: "关于拿守门分类器当最后防线，正确的有？", o: ["A. 分类器判定与规则粗筛是互补关系，不是替代关系", "B. 分类器语义上比正则鲁棒，但自带误杀率", "C. 它自己的决策边界同样可被对抗样本糊弄", "D. 它能输出可审计的分类置信度，便于分级处置与复核", "E. 主模型足够强时，守门分类器可以省掉"], a: [0, 1, 2, 3], e: "E错误：护栏建在模型之外正是防御的前提之一——对齐只降概率，分类器与动作侧检查是对模型输出的外部约束，与主模型强弱无关。" },
  { q: "关于规则与正则这类护栏的能力边界，正确的有？", o: ["A. 命中率好看就说明它可靠，后续判定可以省掉", "B. 常见组合是规则粗筛加分类器判定加 LLM 审计复核三票", "C. 分类器语义更鲁棒，因此名单类规则可以下掉", "D. 拦得住已知恶意，拦不住换语、编码和小语种", "E. 适合作为零成本的第一道粗筛，不能当最后防线"], a: [1, 3, 4], e: "A错误：命中率只统计它见过的形态，没见过的一律放行；对过滤器而言没命中等于安全是读反了指标。C错误：规则便宜、对已知样本几乎零误杀，撤掉它等于把本来免费能拦的部分改由按调用计费且会误杀的分类器承担。" },
  { q: "关于规则粗筛、分类器判定、LLM 审计复核这套三票组合与人审的位置，正确的有？", o: ["A. 高危环节倾向更严，误杀靠重试和人审来缓和", "B. 三票跑完就不需要预算与速率熔断", "C. 只有高危动作才上人审，其余由规则与分类器分流", "D. 多票的意义是压低单点误杀，而不是把所有请求都送人工", "E. 每一次调用都跑一遍 LLM 审计复核，才能保证判定口径一致"], a: [0, 2, 3], e: "E错误：LLM 复核贵且慢，全量上会把流程压瘫；正文只把检查点设在不可逆、高代价、模型自报置信度低这三类动作之前。B错误：熔断管的是失控循环与账单增长，判定链管的是单次内容风险，两者不同轴，互不替代。" },
  { q: "关于最小权限与工具白名单，正确的有？", o: ["A. 参数范围写进注册信息之后，模型给出的参数就一定合规", "B. 默认拒绝、逐个注册、并约束参数范围", "C. 工具在白名单里时，它的参数可以直接信任模型给的值", "D. 只给只读凭证与短时令牌：查询工具不许写，写账号不许删", "E. 白名单拦得住越权调用，拦不住合法工具被诱导滥用"], a: [1, 3, 4], e: "C错误：合法工具被诱导滥用正是白名单的盲区，收件人地址、金额、目标路径这些字段还要在参数级再过一遍。A错误：注册信息约束的是可选范围与校验规则，模型仍能在规则内挑出最坏的合法值（比如合法域名下别人的邮箱），所以后面还要有分级与确认。" },
  { q: "不可逆操作的二次确认，下列做法符合工程要求的是？", o: ["A. 所有工具调用一律弹窗，确保一步不漏", "B. 把确认弹窗做成是/否两个按钮就满足要求", "C. 只读查询也要人审，因为查询同样可能泄露数据", "D. 弹一句 AI 准备给你发送邮件，是否继续，由用户点确认", "E. 确认界面展示实际参数（收件人地址、金额、目标路径），而不是模型的转述"], a: [4], e: "单选。D错误：正文要求展示实际参数而不是 AI 转述，转述环节本身就可被污染。A错误：确认点放多了流程瘫痪，审批疲劳会把确认变成橡皮图章，等于没有。C错误：只读泄露靠权限过滤、字段脱敏与访问审计处理，不该挤占人审预算；人审位置留给不可逆、高代价、低置信三类动作；B错误：关键在展示真实参数，按钮形式不解决转述问题。" },
  { q: "关于沙箱与凭证，正确的有？", o: ["A. 短时令牌把凭证泄露的可用窗口压缩到任务时长以内", "B. 沙箱能挡住把通讯录发到外部地址这一步", "C. 进了沙箱就不必再写审计日志", "D. 长期有效的管理密钥不该直接交给 Agent 使用", "E. 命令与代码在一次性环境里执行，Agent 的临时权限随任务销毁"], a: [0, 3, 4], e: "B错误：沙箱隔离的是执行环境，外发走的是被允许的工具与网络出口，拦它要靠白名单、参数级校验与出域检测。C错误：判定链要求全程留痕、可定位到具体一步，沙箱不是免审计的理由，一次性环境里做过什么同样要能查。" },
  { q: "给一个可能失控的 Agent 设预算与速率熔断，正确的有？", o: ["A. 重试风暴会撞上供应方速率限制，熔断与退避要一起设计", "B. 把上限设到接近配额或上下文上限，以免误伤正常任务", "C. 失控 Agent 的账单按分钟累积，所以超限即停并告警", "D. 迭代次数、token 花费、API 调用量要分开设上限，三者不成正比", "E. 熔断线设好之后，失控循环就不会发生"], a: [0, 2, 3], e: "E错误：熔断是止损手段，不阻止循环发生，它做的是在损失继续扩大前掐断并告警，根因还要靠终止条件设计解决。B错误：贴着配额设上限等于没有熔断——真失控时正好把额度吃光，还会挤掉同一账号或同一租户下的正常流量。" },
  { q: "某护栏阈值 t1 下每天拦掉 500 条正常请求（每条误杀成本 2 元）、漏掉 1 条恶意请求（每条期望损失 1500 元）。改成更严的 t2 后拦掉 900 条正常、漏放期望 0.2 条。按期望成本法，结论正确的是？", o: ["A. t1 为 1500 元、t2 为 300 元，本例应当维持现状", "B. 拦截率越高越安全，误杀成本可以忽略", "C. 该比的是准确率，t2 拦得多所以必然更优", "D. t1 为 2500 元、t2 为 2100 元，本例应当调严；只看拦截率或准确率会把成本较轻的一侧漏掉", "E. t1 为 1000 元、t2 为 1800 元，本例应当调严"], a: [3], e: "单选。算式：t1 = 2×500 + 1500×1 = 1000 + 1500 = 2500 元；t2 = 2×900 + 1500×0.2 = 1800 + 300 = 2100 元，调严更省。E错误：1000 与 1800 各自只取了误杀项，把漏放项整块漏掉。A错误：1500 与 300 各自只取了漏放项，把误杀项整块漏掉。C错误：标尺选错，判据是期望成本而不是准确率或拦截率——本例调严多花 800 元误杀，换回 1200 元漏放损失，净省 400 元；B错误：误杀成本随拦截率一起涨，标尺是期望成本。" },
  { q: "十道串联的护栏，每道对请求的放行率是 99%。按 0.99 的十次方约等于 0.904 这个口径，正确的有？", o: ["A. 把每道都提到 99.9%，串联后的整体通过率就无需再考虑", "B. 正常请求穿过十道的通过率约九成，而不是仍然 99%", "C. 每道 1% 的误杀串起来会互相抵消，总体误杀率仍是 1%", "D. 恶意样本要连续骗过十道才得手，串联抬高的是拦截侧，代价落在误杀侧", "E. 结论不是多设防线无用，而是防线要包在高风险动作外层，不要全堆在入口"], a: [1, 3, 4], e: "C错误：串联环节的误杀按乘法累积而不是取平均，十道各 1% 就是正常请求约有一成被拦。A错误：0.999 的十次方约 0.990，仍有约 1% 的正常请求被拦，量级变了但这道账不会消失。" },
  { q: "正文说提示词是建议、代码是约束。关于护栏应该长在哪一层，正确的有？", o: ["A. 护栏进了 harness 层之后，提示词里就不必再写任何安全约定", "B. 模型可以被骗到不遵守绝不允许转账这句话，但绕不过没注册的工具", "C. 把同一条护栏同时写进 system 和多处 user 轮次，就能得到与代码等价的保证", "D. 判定链里任何一环拒绝即终止，且全程留痕可定位到具体一步", "E. 护栏写进提示词只是改变概率，写进运行时才是改变可能"], a: [1, 3, 4], e: "C错误：多处重复仍是提示层的权重竞争，增加的是被遵守的概率，不产生强制力。A错误：提示词层的定界与来源打标是成本最低的第一道概率修正，harness 负责兜住它兜不住的部分，两层不互相取消。" },
  { q: "团队要为一个能发消息、能改数据的 Agent 上护栏，资源有限只能分批。合理的顺序，正确的有？", o: ["A. 按成本从低到高排即可，输入分类最便宜所以应当最先上", "B. 先做输入意图分类，因为把入口收紧之后后两层可以简化", "C. 先做工具白名单与最小权限，这一步是止血", "D. 第二步做输出审计，主要保声誉", "E. 第三步做输入意图分类，主要优化体验"], a: [2, 3, 4], e: "A错误：正文给的顺序按后果排而不是按单价排，反过来做买到的只是心理安慰——转账照样能发出去。B错误：入口收紧换不来后两层下岗，动作侧管的是越权与不可逆，与入口拦了什么无关。" },
  { q: "关于 PII 的三种形态，正确的有？", o: ["A. 判据是可识别性，而不是文本里有没有出现姓名", "B. 直接标识符（手机号、邮箱、银行卡号）单个字段就能定位到具体人", "C. 由行为或序列推断出的敏感标签（健康、婚育、财务困难）不必按 PII 处理", "D. 不含姓名与身份证号的文本，不算含 PII", "E. 准标识符（区县、出生日期、科室）单个不显眼，组合起来足以重标识"], a: [0, 1, 4], e: "C错误：推断型敏感属性同样在个人信息范围内，而且比原字段更隐蔽——模型输出的是一条结论，脱敏扫描看不见它。D错误：区县加生日加科室这类组合就能把人点出来，姓名不是必要条件，这正是泛化与重标识要分开讨论的原因。" },
  { q: "训练与应用链路里的 PII 来源，说法正确的有？", o: ["A. 自家系统的日志属于内部数据，不必走与公开语料同一道脱敏与留痕", "B. 最被忽视的是企业微调阶段的日志：生产日志带全量输入输出，随手拿去构造评测集等于把红线清单原样复制进训练管线", "C. PII 扫描是一次性的入集检查，后续增量不必重扫", "D. 公开爬虫语料里的论坛邮箱、手机号、住址是最常见的一路", "E. 公共代码仓库混着硬编码密钥，以及带真实姓名、卡号的测试数据"], a: [1, 3, 4], e: "A错误：内部日志的敏感度只高不低——它是全量明文输入输出，正文把它列为最被忽视的来源，处置口径与公开语料一致甚至更严。C错误：语料是持续进料的，增量批次同样会带新的 PII，扫描要挂在流水线上而不是入库那天做一次。" },
  { q: "关于替换与掩码这类脱敏手段的可逆风险，正确的有？", o: ["A. 同一实体在不同字段复用同一个占位符，保留下来的共指结构本身就是可用指纹", "B. 随机打乱比稳定映射更难复原，代价是破坏实体指代的连贯性", "C. 一对一且稳定的映射本质是一张替代表，映射泄露或规律可推就能还原", "D. 换成不带密钥的普通哈希就变成不可逆，映射关系不再需要当密钥管理", "E. 掩码保留手机号前 7 位只是少留 4 位，不影响匿名性"], a: [0, 1, 2], e: "D错误：普通哈希仍是确定性映射，等值关系照旧保留，短输入还能被字典跑出来；它没有取消管理负担，只是换了个还原成本。E错误：11 位里留 7 位，剩下的搜索空间小到可以靠号段与外部名单枚举，等于把重标识的活儿交给对手。" },
  { q: "关于泛化（分桶、区间化）与重标识，正确的有？", o: ["A. 判据之一是看泛化后该等价类里还剩几个人，类内人数过少就能被外部名单点名", "B. 泛化拿信息损失换匿名：33 岁变年龄区间、精确住址变城区", "C. 泛化粒度越粗越安全，与数据效用无关", "D. 对稀有个体，泛化等于没匿名——科室里唯一的百岁患者，该科室加百岁仍然唯一", "E. 删掉姓名之后，年龄加区县级住址加性别就不足以定位某人"], a: [0, 1, 3], e: "C错误：粗到把年龄并成一档就没有分析价值，选粒度是在效用与重标识风险之间取点，不是越粗越好。E错误：这三项的组合在小总体里常常唯一，正文对稀有个体的口径就是泛化救不了它。" },
  { q: "关于用合成数据替代真实记录，正确的有？", o: ["A. 既然不含真实记录，合成数据集可以直接对外发布，不必再审查", "B. 评估要同时看分布保真（还有分析价值）与个体可区分性（别把真人抄出来）", "C. 改用合成数据就不需要来源与授权审计", "D. 它是脱敏的第三条路：用统计等价的生成数据替代真实记录", "E. 残余风险是合成数据仍可能记住并吐出它参照过的真实样本"], a: [1, 3, 4], e: "A错误：吐出真实样本的风险就在发布这一步兑现，敏感样本与可还原的极端值要当发布前检查项，不能因为它是生成的就免审。C错误：生成模型的训练料仍要有来路与授权，合成只是换了交付形态，审计链条一寸没短。" },
  { q: "关于机器遗忘能做到与做不到，正确的有？", o: ["A. 实务上删除权常落到流程承诺：留痕证明它被剔出训练集、下一轮重训不再包含", "B. 做得到：用微调或针对性擦除手段抑制模型对特定样本的输出倾向", "C. 做得到：证明权重里不再含有那条信息", "D. 它管不到已分发的模型副本、衍生缓存与历史备份", "E. 对权重做一次随机重置，就能彻底清除某条样本且不影响其他能力"], a: [0, 1, 3], e: "C错误：正文给的诚实答案是机器遗忘尚不成熟，做得到的只是抑制输出倾向，给不出权重里已不含这条信息的证明。E错误：随机重置权重等于把模型毁掉，而且它做的仍是抹除动作，拿不到这条信息已不存在的结论，代价与结论两头都不成立。" },
  { q: "模型进了内网之后，关于私有化部署与安全这笔账，正确的有？", o: ["A. 推理机房在内网时，出口不必再设 DLP 做发送前脱敏与拦截", "B. 备份与监控系统只给自己团队看，不必按敏感库分级", "C. 私有化只解决存储位置，不解决日志、备份与运维权限", "D. 终端侧插件把提示词原文回传厂商遥测，是内网部署里常被漏掉的一条出口", "E. 有 root 权限的运维能翻看任意会话，运维权限本身成了新的泄露面"], a: [2, 3, 4], e: "A错误：出域判据是能否被还原，而不是机房在谁家；内网形态仍要在出口做发送前脱敏与拦截，正文把它列为自建与 API 两种形态共同的标配。B错误：备份与监控全量复制了输入输出，等于另建一份明文敏感库，处置口径与应用日志一致。" },
  { q: "按正文的出域判据，下列哪种情形算数据出域？", o: ["A. 调用第三方 API 后，服务方能从流水里还原出系统提示词与检索文档，因此它实际持有这些数据", "B. 内容经过 DLP 网关处理过，就不必再审批能出什么深度，因为已经脱敏", "C. 只有把数据库整表交给供应商才算，发文本不算", "D. 提示词只是模型输入不是用户数据，不进 DLP 范围", "E. 只是文本、不含数据库记录，所以最多算敏感信息外发，不算出域"], a: [0], e: "单选。C错误：判据看的是能否还原，不是有没有搬库；一次调用就带走了提示词与文档。D错误：系统提示词里写着业务逻辑，本身就是商业秘密，正文把提示词与补全列为需要出域前脱敏的敏感形态。E错误：不因只是文本而减轻，批量按权限检索等于批量复制。B错误：网关只是执行环节，哪类数据、能到什么深度、由谁审批这张表仍然要先定，否则脱敏范围靠现场判断。" },
  { q: "关于合规留痕的三件事与审计日志，正确的有？", o: ["A. 日志加了访问控制之后，就可以不再限制留存时间", "B. 可追溯的含义是每次回答能定位到模型版本、提示词与检索来源", "C. 审计日志本身是最大号的明文敏感库，要做分级与留存期管理", "D. 留存期设得越久越安全，删太早不算问题", "E. 出域边界的决策口径是一张表：哪类数据、能到什么深度、由谁审批"], a: [1, 2, 4], e: "D错误：正文口径是删太早和存太久都违规，留存期是两头卡的选择而不是越长越好。A错误：访问控制管谁能看，留存期管这份明文存在多久，两者各解决一半，只设前者等于把明文长期堆在一个可被提权读走的地方。" },
  { q: "用户提出删除其全部数据的请求，落到工程上意味着什么？正确的有？", o: ["A. 下一轮重训的清单要能复核，否则删除承诺无法验证", "B. 训练语料与历史备份归别的团队管，不在删除流程范围内", "C. 模型输出里不再出现那条信息，就算删除完成，不必额外留痕", "D. 要能在训练集里定位到具体样本，并留下剔除记录", "E. 向监管提交一句已完成删除的声明即可，不必追溯到样本"], a: [0, 3], e: "C错误：抑制输出倾向不等于删除完成，正文把它列为做得到的那半边，做得到的部分还得靠留痕交付。E错误：拿不出可追溯的剔除记录，承诺就只是声明，因为权重层面的证明本来就拿不到。B错误：管不到已分发副本、衍生缓存与历史备份是能力边界，不是裁剪范围的理由；副本受控分发、退役有销毁记录正是为了把这几处纳进流程。" },
  { q: "把数据形态与处置手段配对，正确的有？", o: ["A. 提示词与补全：出域前 DLP 脱敏，终端侧禁遥测回传", "B. 应用日志：分级留存、到期销毁、访问审计", "C. RAG 知识库文档：检索前按用户权限过滤即可，文档本身不必分级", "D. 模型权重：副本受控分发，退役要有销毁记录", "E. 训练语料里的 PII：只能在输出侧拦，入集前处理没有意义"], a: [0, 1, 3], e: "E错误：正文给的处置是入集前脱敏加来源审计与留痕；输出侧拦截既晚又漏，信息一旦学进去就难以证明删除。C错误：按权限检索等于批量复制，文档分级与检索过滤是一件事的两半，只做后半等于把敏感文档继续留在可检索池里。" },
  { q: "关于第三方权重的采购纪律与验证步骤（格式之外的部分），正确的有？", o: ["A. 来自知名托管平台的权重可以省掉同源对比与触发测试", "B. 核对校验和与签名、加载前扫一遍异常序列化内容，属于采购纪律", "C. 换格式只是缩小攻击面，格式安全的权重照样能藏行为后门", "D. 校验和与签名对得上，就说明这套权重没有行为后门", "E. 下载模型就是安装软件：先查来路是原作者组织，还是来路不明的搬运"], a: [1, 2, 4], e: "D错误：校验和与签名证明的是没被改动，不证明原作者诚实，更证明不了行为层面有没有后门。A错误：平台声誉不是验证手段，正文列的验法全是体力活——同源对比、触发测试、自建探针，一步都不能靠名声代替。" },
  { q: "关于后门 checkpoint 的两类信号，正确的有？", o: ["A. 触发词唤醒的日常表现是普通提问答得正常，特定词、特定排版或某个小语种一出现就换一副行为", "B. 这类后门在常规评测里完全隐形", "C. 某个领域强得与训练说明对不上、像被小名单特训过，是第二类征兆", "D. 日常提问答得正常，就可以判定它不带触发词型后门", "E. 公开安全基准总分达标，就不必再自建敏感话题变体当探针"], a: [0, 1, 2], e: "E错误：自建探针扫敏感话题变体，正因为公开题集覆盖不到触发词，跑完总分不解释后门。D错误：日常提问答得正常恰恰是触发词型后门的标准表现，换行为只在触发条件出现时发生；判定要靠同一批输入加与不加触发词的对比，而不是看平时像不像好人。" },
  { q: "验证一套可疑权重有没有后门，正文给出的做法包括？", o: ["A. 触发测试可以直接在生产环境上做，避开真实用户即可", "B. 用自己构造的敏感话题变体当探针扫一遍", "C. 权重规模与结构参数和官方说明一致时，可以跳过触发测试", "D. 同一批输入加与不加疑似触发词各跑一遍，比较行为漂移", "E. 与官方同源权重逐项对比"], a: [1, 3, 4], e: "C错误：结构与参数量对得上，说明的是它没被改形；后门活在行为层，同尺寸权重照样能带触发词，所以它替代不了加与不加触发词的对比。A错误：验证要放在沙箱加载阶段做完；生产环境带着真实数据与真实权限，拿它做触发测试等于把攻击面搬到线上。" },
  { q: "把数据集也当供应链标的来审，正确的有？", o: ["A. 授权有上游声明就够，可除名留痕属于过度工程", "B. 最终评测分数没掉，就不必追查投毒", "C. 来源、授权、可除名留痕三件事都要审", "D. 训练集投毒与语料投毒是一回事的两端", "E. 入库检查包含抽样人工复核"], a: [2, 3, 4], e: "B错误：投毒往往不体现在总分上，标签翻转与定向样本能在不伤整体指标的前提下改掉某类行为，所以分数不是投毒检测器。A错误：不能除名就意味着后续的删除请求与授权撤回没有杠杆，正文把可除名留痕列为入库检查项之一。" },
  { q: "关于仓库里的指令文件（AGENTS.md、SKILL.md 这类）作为攻击面，正确的有？", o: ["A. 有效的防御是把这几个文件当代码管：评审、CODEOWNERS、变更监控，CI 把它们的 diff 标成高危改动", "B. 这类文件天然比网页里捡的句子不可信，所以主要风险还在网页侧", "C. 它们被上下文工程定在最可信的层：一个每次会话自动加载，一个任务触发注入，写进去的指令会被当作最高优先级提示注入执行", "D. 恶意仓库的 AGENTS.md 写着把 ~/.ssh 的内容发到某个地址，模型没有怀疑它的义务，倒有服从的惯性", "E. 模型足够强时，这类文件里的恶意指令会被自动识别出来"], a: [0, 2, 3], e: "B错误：方向读反了——这些文件是你亲手挂上去的项目宪法，天然比外部脏句子更硬，所以它才是高危面。E错误：模型强弱不改变可信层级的划分，能力越强只会把这条指令执行得越干净；防御只能做在文件的生命周期管理上。" },
  { q: "为什么说把上下文文件当代码管才算防御，而文件里自述一句免责声明不算？正确的有？", o: ["A. 注册制准入、描述版本固定与复审，对应的是 MCP server 与工具描述", "B. 变更监控只盯代码目录，文档类文件不参与安全评审", "C. 护栏修在门外，攻击者拿着门里的通行证，这些文件就是那张通行证", "D. 给 AGENTS.md 加一句本文件内容仅供参考，就把它降级成了不可信数据", "E. MCP 工具描述与仓库上下文文件属同一类攻击面，都落在系统提示词层面"], a: [0, 2, 4], e: "D错误：免责声明仍在同一条 token 流里竞争权重，改不了模型对它的信任层级；真正的降权靠准入与评审，而不是文件自己的陈述。B错误：正文要求 CI 把这几个文件的 diff 标成高危改动，文档类恰恰是必须参与安全评审的那一部分。" },
  { q: "线上换掉第三方 embedding 模型后，靠相似度阈值判风险的那条链路会发生什么？正确的有？", o: ["A. 索引全量重建之后阈值保持原值即可，两者互不相干", "B. 索引要全量重建、阈值要在新分布上重校准，缺一步这条链路就不可用", "C. 相似度数值整体变小，说明新模型更差", "D. 向量空间整体漂移，旧库向量与新查询向量混检，相似度不是读错，是没法读", "E. 新旧向量各占一半时，原来那条阈值既不能说偏高也不能说偏低，判风险等于蒙眼"], a: [1, 3, 4], e: "C错误：数值变化是坐标系换了，不是质量掉了；拿旧尺子读新空间才会得出这种结论。A错误：重建索引解决的是可比性，阈值是在新分布上重新取点，两件事一起做完链路才恢复。" },
  { q: "基座模型或第三方 API 换了版本，关于随之而来的安全动作，正确的有？", o: ["A. 拒答话术一变，红队用例命中的路径就换了", "B. 上游发新版不是一次常规发版，而是一次安全事件", "C. 把端点指向最新版并打开自动升级，可以最快拿到安全修复", "D. 版本号更高的基座，安全能力也更强", "E. 输出风格一变，护栏分类器的判定边界会跟着漂"], a: [0, 1, 4], e: "D错误：新版改变的是行为分布，不保证朝好的方向改；正文把它列为需要重跑验证的变更，而不是默认更安全的升级。C错误：自动升级等于把护栏的输入分布交给别人的发布节奏；正确做法是版本锁死、评测集与红队回归全跑、阈值重校准，并留好回滚。" },
  { q: "一次模型资产入库（权重、数据集、上下文文件）该走的流程，正确的有？", o: ["A. 先验货、再校准，两步不能合并成试一试", "B. 锁版本发布之后要持续监控", "C. 触发测试通过就等同于红队回归通过，两者可以互相顶替", "D. 三类标的都要过来路与签名核验这一环", "E. 沙箱加载与触发测试一次做完即可，之后换版本不必重复"], a: [0, 1, 3], e: "C错误：触发测试查的是一套权重在疑似触发词下的行为漂移，对象是权重本身；红队回归打的是含护栏、工具与上下文文件的整条链路，对象是产品。覆盖面不同，谁也顶替不了谁。E错误：验货是跟版本走的——上游发新版被正文定性为一次安全事件，重跑评测与红队回归、阈值重校准、版本锁死缺一不可，不存在一次验过终身有效。" },
  { q: "一套开源权重号称通过了全部公开安全基准，团队准备接进生产。按正文口径，最该补的是？", o: ["A. 把温度调低，并在系统提示词里加一句行为约束", "B. 什么都不用补，公开基准全过就是安全证明", "C. 补做触发词对比与同源权重比对，锁版本后重跑红队回归并重新校准护栏阈值", "D. 换成只存张量而不存序列化对象的权重格式即可", "E. 公开安全基准全过就等于可以接进生产"], a: [2], e: "单选。B错误：基准分数高不能当安全证明，触发词型后门在常规评测里完全隐形；正文的口径是危险题集必须过，只过高分题集不算数。D错误：换格式只是缩小攻击面，格式安全的权重照样能藏行为后门。A错误：温度与提示词都属于概率修正，既发现不了后门也证明不了没有后门；正文给的入库流程是先验货、再校准，两步不能合并成试一试；E错误：需要同源比对、触发词测试、红队回归与阈值重校准。" },
  { q: "KV Cache 那串乘积（2 × 层数 × KV 头数 × 头维度 × 序列长 × 每元素字节数 × 并发数）里，哪些属于部署时就定死的模型结构项？", o: ["A. KV 头数与头维度", "B. 序列长（上下文长度）", "C. 并发数", "D. 每元素字节数（KV 精度）", "E. 层数"], a: [0, 4], e: "B、C、D错误：乘号右边一半是运行参数——序列长靠 max_model_len 裁、并发靠 max_num_seqs 或入口限长控制、每元素字节数靠 KV 低比特量化改（FP8 就是 1 字节），三者都能在部署后动；只有层数与 KV 头数、头维度是权重定形的结构项。开头那个 2 是 K 和 V 各存一份，同属结构侧。" },
  { q: "按正文口径（80 层、8 个 KV 头、头维度 128、KV 用 FP8 每元素 1 字节），每生成一个 token 要为它存多少 KV？", o: ["A. 约 320 KB", "B. 约 1.28 MB", "C. 约 2 KB", "D. 约 80 KB", "E. 约 160 KB"], a: [4], e: "单选。2 × 8 × 128 = 2048 个数一层，乘 80 层 = 163840 个数，每元素 1 字节约 160 KB。C错误：那是一层的量，漏乘 80 层；D错误：那是再压到 0.5 字节一档的数；A错误：那是 KV 用 FP16（2 字节）的口径；B错误：那是按 MHA 给 64 个 Q 头都存 K/V（160 KB × 8）。" },
  { q: "按正文口径把账算完：80 层、8 个 KV 头、头维度 128、KV FP8、上下文 4096、并发 16、权重 FP16。正确的有？", o: ["A. 三笔账合计约 155 GB（权重 140 + KV 10 + 激活缓冲约 5）", "B. 一条 4K 序列的 KV 约 1.25 GB", "C. 16 路并发的 KV 约 40 GB", "D. 一条 4K 序列的 KV 约 640 MB", "E. 16 路并发的 KV 约 10 GB"], a: [0, 3, 4], e: "B错误：1.25 GB 是 KV 改用 FP16（每 token 320 KB）时单条 4K 的数；C错误：那是并发到 64 或精度再降一档才会有的量级。本口径是 4096 × 160 KB = 640 MB，640 MB × 16 = 10 GB，再加权重 140 GB 与约 5 GB 激活缓冲得 155 GB。" },
  { q: "同一台机器把上下文从 4K 换成 128K（并发仍为 16），按口径正确的有？", o: ["A. KV 涨到 140 GB，与权重同级", "B. 总占用里 KV 反超权重成了大头", "C. 单条序列的 KV 从 640 MB 涨到约 20 GB", "D. KV 总量从约 10 GB 涨到约 320 GB", "E. 权重仍是 140 GB，一点没变"], a: [1, 2, 3, 4], e: "A错误：上下文 4K→128K 是 32 倍，单条 0.625 × 32 ≈ 20 GB，16 并发合计约 320 GB，而不是恰好落在权重那笔上。序列长只进第二笔账，第一笔权重是常数项；320 GB 已远超 140 GB，所以 KV 反超成了占用大头。" },
  { q: "某部署按正文口径跑 70B：16 路并发、上下文 4K 时 KV 约 10 GB。若把上下文换成 128K 的同时并发提到 64，KV 总量会到多少？", o: ["A. 约 80 GB", "B. 约 320 GB", "C. 约 1.28 TB", "D. 约 40 GB", "E. 约 12.8 TB"], a: [2], e: "单选。序列长一项乘 32、并发一项乘 4，合计 128 倍：10 GB × 128 = 1280 GB ≈ 1.28 TB。B错误：只乘了上下文的 32 倍，漏了并发；D错误：只乘了并发的 4 倍；E错误：把 32 倍又乘了一遍；A错误：那是按 MHA 存 64 个 KV 头的口径。" },
  { q: "关于“先撑爆的总是 KV 而不是权重”，合理的说法有？", o: ["A. KV 是序列长与并发数两个变量的乘积", "B. 注意力计算量是序列长的平方级，所以显存占用也是平方级", "C. 显存里随对话长度单调增长、永不回还的部分只有 KV Cache", "D. 权重会随并发数线性增长，所以高并发下权重才是大头", "E. 权重是常数项，与上下文长度、并发数都无关"], a: [0, 2, 4], e: "B错误：平方级是算力账，FlashAttention 分块后不必把整张注意力矩阵物化在显存里；D错误：权重与并发无关，它就是参数量 × 每参数字节数。4K→128K 是 32 倍、16→64 并发是 4 倍，两项相乘 KV 涨 128 倍而权重照旧 140 GB——所以“支持百万上下文”的标称值和“能同时服务多少人”是两件事。" },
  { q: "三笔账各有各的压法，对应关系正确的有？", o: ["A. 激活与缓冲（峰值项）→ FlashAttention 分块、chunked prefill、把超长 prompt 拆批", "B. 把权重压到 INT4，长上下文那笔账也跟着变便宜", "C. 权重（常数项）→ 权重量化 INT8/INT4：70B 从 140 GB 降到约 70 GB / 35 GB", "D. 跨卡张量并行能把权重本身变小", "E. KV Cache（线性项）→ KV 低比特量化、GQA/MLA 改结构、分页减碎片、限 max_model_len 与 max_num_seqs"], a: [0, 2, 4], e: "D错误：张量并行只是把同一份权重摊到多张卡上，总量没变小；B错误：两套量化互不替代，压权重不会让 KV 变少，压 KV 也不会让模型加载更快。剩下的 E、A 各归各的账：线性项改结构与精度，峰值项改一次吞进多少 prompt。" },
  { q: "关于 GQA 与 MLA 砍的是哪一笔账，正确的有？", o: ["A. GQA/MLA 的收益主要落在并发上限和长上下文预算上", "B. 它们砍的正是 KV 公式里“KV 头数 × 头维度”那一项", "C. 按口径这台机器 Q 头数是 64，若改成每个头都存 K/V，同样的 KV 会从 10 GB 涨到 80 GB", "D. MLA 把权重也压小了，第一笔账跟着一起降", "E. MLA 不再按头存 K 和 V，而是先压到一个低维 latent 再缓存"], a: [0, 1, 2, 4], e: "D错误：MLA 只动第二笔账，它的权重照旧大，第一笔没省。64 个 Q 头对 8 个 KV 头是 8 倍关系，10 GB × 8 = 80 GB，这就是 GQA 省下的量；MLA 则是把“头数 × 头维度”换成一个固定的小维度，省的是缓存而不是参数。" },
  { q: "关于“权重是常数项”这个说法，正确的有？", o: ["A. MoE 的权重账要按总参数量算，它省的是算力不是显存", "B. 上下文涨到 128K 时这笔账也跟着涨 32 倍", "C. 它等于参数量 × 每参数字节数，FP16 下 7B 是 14 GB、70B 是 140 GB", "D. 它不随上下文长度和并发数变化", "E. MoE 模型按每个 token 激活的那部分参数量算这笔账"], a: [0, 2, 3], e: "E错误：没被点亮的专家权重同样得驻留显存，按激活参数算会严重低估这一笔；B错误：涨 32 倍的是第二笔 KV，权重纹丝不动。正因为第一笔不动，OOM 才常常是先撞 KV 而不是先撞权重。" },
  { q: "线上 OOM，按“崩在哪一步就查哪笔账”的顺序，合理的有？", o: ["A. 用量没超却崩 → 一定是权重那笔算错了，重下模型即可", "B. 只在超长 prompt 进来时崩 → 是 Prefill 峰值缓冲打穿，用 chunked prefill 或入口长度限制解决", "C. 加载权重阶段就崩 → 第一笔账超了：换更小模型、加卡做并行、上权重量化，跟调度无关", "D. 生成中途崩 → 先核对并发数 × 单条 KV 是否超过预留，把 max_model_len 与 max_num_seqs 调下来验证", "E. 只在超长 prompt 进来时崩 → 说明第二笔 KV 账爆了"], a: [1, 2, 3], e: "E错误：超长 prompt 打穿的是第三笔（激活与临时缓冲的短时峰值），不是 KV 那笔线性账；A错误：“用量没超却崩”是碎片的典型症状——连续预留 KV 时尾部浪费凑不出整块，该查的是碎片与显存利用率余量，不是重下权重。C 归第一笔，D 归第二笔，四种崩法分别落在三笔账加碎片上，所以先定位崩在哪一步比先开优化开关有用。" },
  { q: "把 KV 从 FP8 换成 FP16（其余口径不变），账本会怎么变？正确的有？", o: ["A. 16 路并发的 KV 从约 10 GB 涨到约 20 GB", "B. 权重也随之从 140 GB 变成 70 GB", "C. 反过来看，换成 FP8 省下的约 10 GB 相当于多出约 16 条 4K 序列的余量", "D. 换 KV 精度还能顺带让模型加载更快", "E. 每 token 的 KV 从约 160 KB 涨到约 320 KB"], a: [0, 2, 4], e: "B错误：KV 精度只动第二笔，权重那笔由参数量 × 每参数字节数决定；D错误：让加载变快的是权重量化，不是 KV 量化。单条 4K 是 0.625 GB，16 条正好 10 GB，所以省下的这笔钱折算成并发就是 16 条。" },
  { q: "某部署的 KV 预算固定为 40 GB，仍按每 token 约 160 KB 的口径。把上下文上限从 4K 提到 32K，最多能塞下的序列条数怎么变？", o: ["A. 约 32 条", "B. 约 8 条", "C. 约 16 条", "D. 约 128 条", "E. 仍约 64 条"], a: [1], e: "单选。4K 单条 = 4096 × 160 KB = 640 MB，40 ÷ 0.625 = 64 条；32K 是 8 倍，单条 = 8 × 0.625 = 5 GB，40 ÷ 5 = 8 条。E错误：以为预算不变条数就不变，忽略了单条变长；A、C错误：分别把 8 倍当成 2 倍和 4 倍；D错误：方向反了，上下文变长只会挤掉并发。" },
  { q: "关于第三笔账（激活与临时缓冲），正确的有？", o: ["A. Decode 每步只处理一个 token 宽度，激活很小", "B. 并发一高，这笔账跟着暴涨", "C. 在口径算例里它约 5 GB，远小于权重那笔 140 GB", "D. 把它压下去主要靠 KV 低比特量化", "E. Prefill 要把整段 prompt 的中间结果一次铺开，形成短时峰值"], a: [0, 2, 4], e: "B错误：并发升高时暴涨的是第二笔 KV，激活这笔并不跟着线性涨；D错误：KV 量化动的是缓存那笔，峰值项要靠 FlashAttention 分块、chunked prefill 切小、把超长 prompt 拆批。它就是“接待大巴团客才付的装修押金”：平时不出现，长 prompt 进来才打穿。" },
  { q: "TTFT 与 TPOT 的构成，正确的有？", o: ["A. Prefill 的计算量约等于 2 × 参数量 × 输出 token 数", "B. Prefill 是算力密集：整段 prompt 一次并行算完", "C. TTFT = 排队时间 + Prefill 时间", "D. TPOT 主要由 prompt 长度的平方决定", "E. TPOT 由 Decode 步决定，而 Decode 每步都要把全部权重和批内所有请求的 KV 从显存搬一遍"], a: [1, 2, 4], e: "D错误：平方级是注意力的计算量，TPOT 取决于每步搬运量除以带宽与批大小；A错误：公式里乘的是 prompt token 数（输入那一段），按输出 token 数算会把 prefill 的量整个弄错——4096 个输入 token 对应约 2 × 70×10⁹ × 4096 ≈ 5.7×10¹⁴ FLOPs。C 给出 TTFT 的两段来源，E 是 TPOT 的访存本质，B 说明 prefill 为什么算算力密集。一个病在队列、一个病在带宽，合成一个“响应时间”就看不出病灶。" },
  { q: "按正文口径的 8 卡机（权重 140 GB、聚合带宽记 24 TB/s、单条 4K 的 KV 0.625 GB），关于 Decode 每步搬运量与并发上限，正确的有？", o: ["A. 批越大搬运量涨得和权重一样快，所以 batching 不划算", "B. 批大小 1 时每步搬 140 GB，一个 token 的下限约 5.8 ms", "C. 批大小 16（每条都 4K）时每步搬约 150 GB，只多 7%", "D. 要让 KV 的搬运量追平权重那 140 GB，按 4K 算凑够 16 条就行", "E. 限制并发的通常是显存容量和算力饱和，不是带宽"], a: [1, 2, 4], e: "D错误：每条 4K 的 KV 是 0.625 GB，要 140 ÷ 0.625 = 224 条才追平权重，16 条只多搬 10 GB，也就是 C 里那 7%；A错误：多出来的只是批内各条请求的 KV，140 GB 那一趟车是共享的，这正是 batching 的秘密。B 是批 1 的下限（140 ÷ 24000 ≈ 5.8 ms），E 是结论：常规并发下限制你的不是带宽，而是显存容量与算力饱和。" },
  { q: "同一台 8 卡机：批大小 16、每条都 4K，每步搬运量约 150 GB，聚合显存带宽记 24 TB/s。单请求速率与整机聚合吞吐各是多少？", o: ["A. 单请求约 160 token/s，整机聚合约 2560 token/s", "B. 单请求约 2560 token/s，整机聚合约 2560 token/s", "C. 单请求约 160 token/s，整机聚合约 160 token/s", "D. 单请求约 10 token/s，整机聚合约 160 token/s", "E. 单请求约 170 token/s，整机聚合约 170 token/s"], a: [0], e: "单选。150 ÷ 24000 = 6.25 ms 一个 token，即每请求 1 ÷ 0.00625 = 160 token/s；16 条一起跑，整机聚合 16 × 160 = 2560 token/s。C错误：把聚合吞吐当成了单请求速率；D错误：那是拿 160 再除以 16 的结果；E错误：170 token/s 是批 1（140 ÷ 24000 ≈ 5.8 ms）时的下限；B错误：单请求不可能达到整机聚合值。" },
  { q: "用户看到的总时长约等于 TTFT + 输出 token 数 × TPOT。两种情形：甲 TTFT 800 ms、TPOT 6.25 ms；乙 TTFT 200 ms、TPOT 120 ms；输出都是 350 token。正确的有？", o: ["A. 乙约 3 秒，两者量级相同", "B. 甲约 3 秒", "C. 乙约 42 秒", "D. 用“平均总耗时”一个指标就能把两者区分开", "E. 甲的问题多半在队列与 prefill，乙的问题在每步搬运量"], a: [1, 2, 4], e: "D错误：800 + 350 × 6.25 ≈ 3.0 s，200 + 350 × 120 = 42.2 s ≈ 42 s，两者都该被 SLA 拦住，但只报“平均响应时间”会把队列病和带宽病混成一类；A错误：两者差一个数量级，不是同量级。甲慢在首 token（排队与 prefill 算力），乙慢在逐 token（搬运量与批）。" },
  { q: "按正文口径算 4096 个输入 token 的 Prefill 计算量（约 2 × 参数量 × prompt token 数，参数量 70×10⁹），结果与它的含义是？", o: ["A. 约 2.3×10¹⁸", "B. 约 6.25×10⁻³，说明 prefill 受带宽限制", "C. 约 2.9×10¹⁴", "D. 约 1.4×10¹¹", "E. 约 5.7×10¹⁴，且这是算力账，跟显存带宽无关"], a: [4], e: "单选。2 × 70×10⁹ × 4096 ≈ 5.7×10¹⁴ FLOPs。C错误：漏乘公式里的 2（70×10⁹ × 4096 ≈ 2.9×10¹⁴）；D错误：漏乘 prompt token 数，只剩 2 × 70×10⁹；A错误：把序列长又按平方级乘了一遍（5.7×10¹⁴ × 4096 ≈ 2.3×10¹⁸）；B错误：6.25 ms 是 decode 每步的时间下限，不是 prefill 的计算量。" },
  { q: "关于 TPOT 的体感饱和点与流式输出，符合正文口径的有？", o: ["A. 流式输出能减少一次请求的总耗时", "B. 流式的价值在于把体感锚点从“全文完成”挪到“第一个 token”", "C. 打字速度比默读的字速率还高一档，所以阈值该按打字速度定", "D. 中文默读每分钟数百字、一个汉字折 1~2 个 token，折算出约 5~10 字/秒就跟得上阅读", "E. TPOT 降到约 100~150 ms 以下就“不断流”，再快主要是给报表好看"], a: [1, 3, 4], e: "A错误：流式并不减少总耗时，一个字一个包反而略微增加网络开销；C错误：打字速度（每分钟一两百字）比默读还低一个档次，不是更高。阈值定在默读速度上，意味着 TPOT 再往下压一半对体感没有意义。" },
  { q: "batch 继续加大时 TTFT 与 TPOT 同时变差，机制上正确的有？", o: ["A. 吞吐数字必须写清是在什么 TTFT/TPOT 约束下测的，因为“提高并发”和“降低延迟”在同一张卡上是直接换的", "B. 新请求要等到下一个调度点才被接进来，前一批不走完它就只能等", "C. 它的 Prefill 要和大批正在跑的 Decode 抢同一张卡的算力与带宽", "D. KV 见底触发抢占时，只会劣化被抢那条的 TTFT，TPOT 不受影响", "E. 长 prefill 插进来后，别人的 TPOT 也跟着抖"], a: [0, 1, 2, 4], e: "D错误：被抢的那条是 TTFT 与 TPOT 一起劣化——KV 丢掉待重算或换出，重新排队和后续每一步都受影响。B 是排队、C 与 E 是算力争抢、A 是结论：三股力同时作用，所以脱离延迟约束谈吞吐没有意义。" },
  { q: "关于 SLA 用分位数而不是均值，正确的有？", o: ["A. P99 长尾不可能来自抢占重算与显存回收", "B. 延迟是重尾分布，均值会被大量快请求稀释，最慢那批人一平均就看不见", "C. 样本量够大时，均值就足以定位长尾", "D. TTFT 与 TPOT 要各报一条线，达标写法例如“P99 TTFT 达标且 P95 TPOT 达标”", "E. 两个指标同时劣化提示容量不足，只有一个劣化提示调度或单卡故障"], a: [1, 3, 4], e: "C错误：问题不在样本量，而在分布本身重尾，样本再多均值也照样被快请求拉低；A错误：KV 碎片与显存回收、抢占重算、多轮对话把缓存顶到上限，正是正文列的 P99 长尾常见来源，一旦平均进“平均响应时间”就全看不见。定位顺序是先分池看排队还是计算，再看是两条线一起坏还是只有一条坏。" },
  { q: "把 P99 长尾的来源归到对应指标，正确的有？", o: ["A. 前缀缓存未命中只影响账单，对 TTFT 没有任何影响", "B. 超长 prompt 插队、冷启动 → TTFT", "C. 队列积压、chunked prefill 排队 → TTFT", "D. KV 逼近上限触发抢占重算 → 只砸 TTFT，与 TPOT 无关", "E. 批内长序列拖累、慢卡降频 → TPOT"], a: [1, 2, 4], e: "D错误：抢占重算在正文里归在 TPOT 那一行，而且被抢的那条是两个指标一起劣化；A错误：前缀缓存正是写在 TTFT 那一行的对应手段，未命中就要重算整段 prompt，首 token 直接变慢。B、C 属排队与 prefill 侧（对应手段还有准入控制、按长度分池、prefill 独立扩容），E 属每步搬运与单卡侧（对应手段是 KV 量化、分页管理、限制 max_model_len、驱逐或换出长请求）。" },
  { q: "推理模型把思考 token 计在输出侧，几十秒思考会让“首 token 很慢”这个指标失真。正文给的处理方式有？", o: ["A. 把思考 token 改记到输入侧，这个指标就自然对齐了", "B. 把思考内容也流式吐出去，比如摘要或进度提示", "C. 统计 TTFT 时把思考阶段整段剔除，指标就干净了", "D. 把 TTFT 的定义改成“首个可见字符”", "E. 在看板里把思考 token 量单列一条曲线"], a: [1, 3, 4], e: "C错误：剔除只是把指标做假，用户等的时长一点没少；A错误：正文没有换记账口径这条路，思考 token 本来就计在输出侧，要改的是定义或让它可见。B、D、E 是那条生产建议里的三个动作：要么把思考内容流式出来，要么把 TTFT 改成“首个可见字符”，再把思考 token 量单列一条曲线——不这么处理，容量规划和账单都会被它带偏。" },
  { q: "continuous batching 相对原生 batching 改的是什么？正确的有？", o: ["A. 短请求提前结束也只占着卡空转，这是原生批处理的浪费", "B. 原生是步级：攒满一批一起跑，要等最长那条生成完才能换人", "C. 它让每条请求的 KV 不再需要占用显存", "D. 改成请求级：某条序列吐出结束符就立刻出批", "E. 新请求要等当前整批全部跑完才有机会补位"], a: [0, 1, 3], e: "C错误：KV 照旧要存，改的只是进出批的粒度，并不减 KV 这笔账；E错误：那正是原生步级做法的描述，continuous batching 让新请求在下一个调度点就补位。B 与 A 是它要解决的两个症状（步级换人、空占位置），D 是它的机制，而这个机制同时也是显存碎片的来源。" },
  { q: "continuous batching 把并发开起来之后，真正卡住它的是什么？正确的有？", o: ["A. 有了 continuous batching 就不必再上 PagedAttention", "B. 分页按需分配等宽小块，才让并发真开得起来；两者是一套，不是两个独立卖点", "C. 死穴是显存碎片", "D. 批内每条序列长度不同、且每步都在长，按连续整块预留就得按最坏情况留", "E. 请求退出后腾出的块大小不一，凑不出新请求要的连续区间，于是理论并发很高、实际塞不进几条"], a: [1, 2, 3, 4], e: "A错误：恰恰相反，continuous batching 制造碎片，PagedAttention 才让它能用——正文的因果链是提并发 → 造碎片 → 分页解决 → 显存预算才敢开大。D 是“按最坏情况留”的成因，E 是碎片化之后“有位子却拼不出空间”的具体表现。" },
  { q: "chunked prefill 的取舍，正确的有？", o: ["A. 切块后每轮只算一块，和 decode 步混在同一批里", "B. 切得越碎，这条长请求自己的 TTFT 越短", "C. 代价是这条长请求自己的 TTFT 变长，且每块还要重复读已有 KV", "D. 切得越碎总吞吐越高，因为每块更省算力", "E. 不切块时，一条几十万 token 的 prompt 做 prefill，这张卡上正在 decode 的请求都得停下来等它"], a: [0, 2, 4], e: "B错误：切碎牺牲的正是这条长请求自己的 TTFT，收益落在别人身上（老请求不再被新来的长 prompt 打断）；D错误：正文的取舍是切得越碎抖动越小、总吞吐越差，每块还要重复读已有 KV，并不省算力。E 是不切块的后果——别人的 TPOT 瞬间变成秒级；A 是做法，C 是代价的两面。" },
  { q: "前缀缓存要保住命中，拼 prompt 的工程做法有哪些？（命中条件本身不在此重考）", o: ["A. 把时间戳放在系统提示之前，让缓存内容更“新鲜”", "B. 多轮对话只在尾部追加，别重排历史", "C. 静态系统提示、工具定义、少样本示例放最前面", "D. 会变化的用户内容、时间戳、随机 ID 一律往后放，别插在中间", "E. 命中部分按原价计费，折扣只作用于输出 token"], a: [1, 2, 3], e: "E错误：命中部分按折扣价计费（口径见 c5_maas），具体折扣各家不同，别拿别家的数字套；A错误：时间戳放前面会让第一个 token 就变化，从它起全部重算，等于把整段静态前缀全废掉。C、D、B 是同一条原则的三个应用：会变的东西越靠后、历史只在尾部追加，能被复用的前缀就越长。" },
  { q: "Agent 是前缀缓存收益最大的场景，但另一面也最疼。正确的有？", o: ["A. 另一面是输入 token 随轮数一路累加，几十轮之后账单大头落在输入侧", "B. 输入单价约为输出的 3~5 倍，所以 Agent 的账单大头一定在输出侧", "C. 轮数一多缓存就自动失效，因为 KV 已经被回收", "D. ReAct 循环每轮都把完整历史重新发一遍，前缀高度重复", "E. 工具调用越多、轮数越多，缓存省下的 prefill 越可观"], a: [0, 3, 4], e: "B错误：把单价关系说反了——输出单价约为输入的 3~5 倍，也就是说输入单价只有输出的三分之一到五分之一，但 Agent 场景架不住输入量大；C错误：轮数多反而让可复用的前缀更长，失效不是因为 KV 被回收，而是因为前缀里插进了会变化的内容。" },
  { q: "PD 分离（prefill 与 decode 分池）的动机与代价，正确的有？", o: ["A. 分离后 prefill 不再抢占 decode 的步", "B. 分离之后两侧都不必再预留显存，成本自然下降", "C. 代价很直白：算好的 KV 要整份搬到 decode 池", "D. Prefill 吃算力、Decode 吃带宽，混在一起时批大小和 chunk 长度只能取一个折中", "E. 分离后两侧必须共用同一套批大小与并行度，否则 KV 对不上"], a: [0, 2, 3], e: "E错误：分池的意义恰恰在于两侧各自设并行度、批大小，甚至用不同精度与不同卡型；B错误：两侧都要预留显存，任何一侧空转都在烧钱，这是它最贵的隐性成本。D 是动机（两种瓶颈不该抢同一张卡），A 是对 TTFT/TPOT 互扰的直接修复，C 是随之而来的跨机流量问题。" },
  { q: "按正文口径估 PD 分离的跨机流量：单条 4K 序列的 KV 是 640 MB，QPS 为 4。正确的有？", o: ["A. 4K、QPS 4 时约 25 GB/s", "B. 约 2.5 GB/s 的跨机 KV 传输流量", "C. 上下文换成 128K 时，单条序列的 KV 约 20 GB", "D. 长上下文下传输时间直接进 TTFT，没有高速互联就别分", "E. 128K、QPS 4 时约 8 GB/s，对 TTFT 没有影响"], a: [1, 2, 3], e: "E错误：0.625 × 32 = 20 GB（C 对），20 × 4 = 80 GB/s，比 8 GB/s 大一个数量级，正是“没有高速互联就别分”的理由；A错误：640 MB × 4 = 2.56 GB/s ≈ 2.5 GB/s，小数点错了一位。B、C、D 合起来是 PD 分离的适用判断：流量按 QPS × 单条 KV 算，长上下文先把它顶到互联带宽之上。" },
  { q: "投机解码（draft / verify）为什么能提速？正确的有？", o: ["A. 它主要降的是 Prefill 阶段的算力需求", "B. 它靠减少模型层数来加速", "C. Decode 每步本来就要把权重搬一遍，顺手多算几个 token 几乎不增加搬运量", "D. 由小模型或目标模型自带的草稿头一次起草 k 个 token，大模型一次前向并行验证", "E. 被接受多少，就等于把 Decode 的访存次数摊薄多少"], a: [2, 3, 4], e: "A错误：它作用在 Decode 侧的访存次数上，prefill 那笔算力账一点没动；B错误：层数不变，变的是一趟搬运换几个 token。它本质是用富余算力换访存次数，所以前提是机器还有富余算力。" },
  { q: "投机解码的收益边界在哪里？正确的有？", o: ["A. 草稿被拒只是那几个 token 白算，不会多花别的时间", "B. 并发越高收益越大，因为草稿可以并行验证", "C. 批开大后算力已接近饱和，草稿那部分不再是免费的算力，高并发场景收益明显缩水", "D. 它被列为压低单次调用成本的手段，但别指望在满载机器上白拿", "E. 收益全看接受率：代码、模板、翻译这类可预测任务接受率高"], a: [2, 3, 4], e: "A错误：草稿被拒就得重来，起草和验证两笔都花了，正文原话是反而多花了起草和验证；B错误：说反了，批开大以后算力不再富余，收益缩水而不是更大。E 是收益的第一决定因素（任务可预测性决定接受率，创造性写作就低），C 是它与 batching 的冲突，D 是它的定位：压单次成本的手段，前提是不满载。" },
  { q: "“批内饿死”是怎么发生的、怎么防？正确的有？", o: ["A. 把 max_num_seqs 调到最大，让所有请求一起排队就能避免饿死", "B. 给长请求预留配额，或者把它们单独分池", "C. KV 见底时调度器要抢占，被反复挑中的往往是最短、最便宜的那条请求", "D. 长的那条每次重算都要抢一大块显存，于是永远做不完，而短请求一路插队", "E. 按等待时间递增优先级（aging），并给每租户设并发上限"], a: [1, 3, 4], e: "C错误：被反复挑中的是上下文最长、最“贵”的那条，因为它每次重算要占一大块显存，腾挪空间也最大；A错误：把并发开到最大只会让 KV 更早见底、抢占更频繁，饿死恰恰是被反复抢占造成的。D 是机制与后果，E 与 B 是正文给的对策：配额、分池、aging、租户并发上限，再加上最实用的准入控制。" },
  { q: "关于准入控制（admission control），合理的做法与理由有？", o: ["A. 超长 prompt 不要跟短请求挤在同一个池里，按长度分池", "B. KV 还有余量时一律先接进来，排队交给调度器", "C. 准入控制只是把长尾从 prefill 挪到 decode，对 SLO 没有帮助", "D. 算不出能塞进 KV 预算就不要接这个请求，别接了再抢占", "E. 接进来之后再抢占，被抢的那条 TTFT 与 TPOT 会一起劣化"], a: [0, 3, 4], e: "B错误：这正是“接了再抢占”的写法，正文点名它是最该避免的；C错误：准入控制是为了不把超预算的请求放进批内，从源头上消掉抢占重算带来的双指标劣化，所以它直接改善尾延迟。D 是原则，E 是不做的后果，A 是让预算算得准的分池手段。" },
  { q: "调度这四件事的因果链，连得上的有？", o: ["A. PagedAttention 分页解决碎片 → 显存预算才敢开大", "B. 并发开大后 TTFT 因排队与 prefill 抢占而劣化 → 于是需要 chunked prefill 或 PD 分离", "C. 前缀缓存只认完全匹配的前缀，prompt 顺序错了等于没有", "D. 上了分页管理解决碎片之后，TTFT 就自然达标了", "E. continuous batching 提高并发 → 制造显存碎片"], a: [0, 1, 2, 4], e: "D错误：分页解决的是塞不塞得下的问题，TTFT 还受排队、prefill 抢占、缓存未命中影响，链子走到这里没完。E→A→B 是同一条链的三段，C 是另一条独立前提：省下来的 prefill 只在完全匹配的前缀上成立。" },
  { q: "从 QPS 推到需要几台机器，四步法的顺序与要点，正确的有？", o: ["A. 第二步两路分别除以单台 prefill、单台 decode 的实测产能，取两者较大值", "B. 把输入与输出需求相加，除以单台总吞吐就够了", "C. 第三步用 Little 定律 L = QPS × W 算在飞并发，再回去校验 KV 塞不塞得下", "D. 第四步算术上限算得出来，就可以拿它当承诺吞吐去配卡", "E. 第一步换算 token 需求：输入侧按 prefill 产能算，输出侧按 decode 产能算"], a: [0, 2, 4], e: "B错误：两路瓶颈性质不同，相加除以总吞吐会把“瓶颈在 prefill 还是 decode”这个判断糊掉，正文要的是分别除以各自产能再取较大值；D错误：算术上限是天花板、实测吞吐才是地板，两者取交集才定台数，实测与理论比值低到一两成时该先修引擎（碎片、抢占、CPU 前端、网络）。E、A 是前两步，C 是回去校验 KV 的那一步。" },
  { q: "按正文口径：峰值 QPS 4、平均输入 1500 token、平均输出 350 token，单台 decode 实测 2560 token/s、单台 prefill 压测约 7000 token/s。换算正确的有？", o: ["A. 输入侧需要 6000 ÷ 7000 ≈ 0.86 台，瓶颈落在 prefill", "B. 合计 7400 token ÷ 2560 ≈ 2.9 台", "C. 该取两者较大值约 0.86 台，而不是把 0.55 与 0.86 相加", "D. 两侧需求都是 1400 token/s，因为 QPS 相同", "E. 输出侧需要 1400 ÷ 2560 ≈ 0.55 台"], a: [0, 2, 4], e: "D错误：两路各按自己的平均长度算——输入侧 4 × 1500 = 6000 token/s，输出侧 4 × 350 = 1400 token/s，QPS 相同不等于 token/s 相同；B错误：这是“总量除以总吞吐”的典型错法，7400 里混着两种性质完全不同的瓶颈。E 与 A 是两条独立的产能线，C 是取法：取较大值就是瓶颈所在，不是把两路相加。" },
  { q: "正文用算力账给 prefill 那一侧做交叉核算。关于这笔核算，正确的有？", o: ["A. 比值低说明单卡峰值算力记小了，应当把它按十倍重记", "B. 2 × 70×10⁹ × 6000 ≈ 8.4×10¹⁴ FLOP/s", "C. 把这个数除以单卡峰值稠密算力与实测利用率，应当得到与压测同一个数", "D. 两个结果差得远，说明算术账更可靠，应当以理论值为准下单", "E. 实测与理论的比值低到一两成时，先修引擎（碎片、抢占、CPU 前端、网络），别急着买卡"], a: [1, 2, 4], e: "D错误：正文的读法相反——两个结果差得远说明压测没压到点上，问题在压测不在那串乘法；A错误：先怀疑的从来不是标称算力，而是引擎有没有把算力喂满，为低效率买卡是白花钱。B 用的输入侧需求是 6000 token/s（QPS 4 × 平均输入 1500），C 说清怎么对：除以单卡峰值稠密算力与实测利用率应当得到同一个数，E 是对不上时的处理顺序。" },
  { q: "按正文口径做 Little 定律那一步：TTFT 约 0.9 s、TPOT 6.25 ms、输出 350 token、QPS 4。换算与结论正确的有？", o: ["A. 在飞请求 L = W ÷ QPS ≈ 0.8 条", "B. 12 条在飞并发就要预留约 140 GB 的 KV", "C. 按平均序列长 1675 token 算，每条 KV 约 0.26 GB，12 条合计约 3.2 GB", "D. 这个场景显存根本不绑人，加卡或压 prefill 才是解药，做 KV 量化纯属白忙", "E. 单条驻留时间 W ≈ 0.9 + 350 × 0.00625 ≈ 3.1 s"], a: [2, 3, 4], e: "A错误：Little 定律是 L = QPS × W，除反了会把十来条算成不到一条，也就看不出并发塞不塞得进显存；B错误：140 GB 是权重那笔常数账，十来条在飞请求的 KV 只有约 3.2 GB（正文按每条 0.26 GB 记作约 3.2 GB）。E 是驻留时间，C 里的 1675 = 输入 1500 加上写到一半的输出，1675 × 160 KB ≈ 0.26 GB；D 是这一步的结论：瓶颈不在 KV 时，压 KV 是白忙。" },
  { q: "QPS 4、平均输入 1500、平均输出 350 的那个场景，若把上下文上限换成 128K 且请求真打到满长，判断会反过来。正确的有？", o: ["A. 几百 GB 的 KV 预算只塞得下二十来条", "B. 此时先撞的是 KV 墙，不是算力墙", "C. 权重那笔也从 140 GB 涨到 320 GB", "D. 前面“做 KV 量化纯属白忙”的结论在这里不再成立", "E. 每条序列的 KV 从约 0.26 GB 量级涨到约 20 GB 量级"], a: [0, 1, 3, 4], e: "C错误：涨的仍然只有第二笔账，权重是常数项。E 的算法是 0.625 GB × 32（4K→128K）≈ 20 GB，A 就是几百 GB 预算除以 20 GB；D 是关键转折：一旦 KV 成为约束，量化、分页、限长这些手段重新变得值钱。" },
  { q: "关于峰谷比与“按峰值配卡”，正确的有？", o: ["A. 峰谷比只影响用户体验，不影响单 token 成本", "B. 超出容量时的处理顺序应当是写死的、能演练的", "C. 日内波动 3 倍以上时，自建集群一天里大部分时间在闲置", "D. 把卡买够之后，峰谷闲置会被摊平，不必单独看利用率", "E. 按峰值配卡是最贵的一种保守"], a: [1, 2, 4], e: "D错误：卡买得越多，分子（月度总成本）变大而分母不变，闲置只会更贵，利用率恰恰是自建的三条判据之一；A错误：峰谷比决定的是分母——实际处理的有效 token 数，波谷闲置会把自建的单 token 成本抬高，它从来不只是体验问题。C 是量级判断，E 是结论，B 是同一节的另一半：容量不够时靠预案，不靠当场拍脑袋。" },
  { q: "容量不够时的降级预案，符合正文口径的有？", o: ["A. 再往后是分级路由切小模型、关闭思考档位或压低 max_tokens、只回缓存/兜底答案", "B. 最后两条降档要提前在评测里确认质量底线，别到故障当天才发现没测过", "C. 超出容量时先限流、别让请求进队列", "D. 限流要返回明确返回码加 Retry-After，别让客户无限重试", "E. 客户重试不消耗我方容量，让它们自己重试就好"], a: [0, 1, 3], e: "C错误：正文的顺序是排队在前（带超时，超时就落到限流），不是先限流、把排队跳过去；E错误：重试本身就在烧你的卡，无限重试会把容量问题放大成雪崩，所以才要明确返回码加 Retry-After。D 是限流那一级的写法，A 是后面几级，B 是对降档质量的预演要求——这套顺序得能演练，别到故障当天现编。" },
  { q: "三种计费口径各自最容易踩的坑，正确的有？", o: ["A. 按 token：优化方向只有输入长度这一头，输出长度由任务决定、动不了", "B. 包卡/包时段：利用率是你的锅，峰值要为最大容量买单，波谷全是闲置", "C. 包卡：费用固定，所以长上下文来了也不必扩容", "D. 按次/按效果：分母由供应方定义，同一次任务在不同 Harness 上成本可差十几倍", "E. 按 token：把思考 token 也按输出计、Agent 每轮重发全量历史，都会把账单放大"], a: [1, 3, 4], e: "A错误：输出单价约为输入的 3~5 倍，正文点名“只优化 prompt 长度不优化输出长度，方向就反了”，而 max_tokens、思考档位、工具循环动的都恰恰是输出侧；C错误：包卡的显存与吞吐上限硬封顶，长上下文一来容量立刻见底，闲置还全算你的账。E 与 B、D 分别是三种口径各自的坑，D 还有一句前提：按次口径只适合结果可验证的任务，否则无法核账。" },
  { q: "关于缓存与思考档位对账单的影响量级，正确的有？", o: ["A. 把输入 prompt 压短，账单能降一个数量级", "B. 给每条请求打标签（团队、功能、模型、是否思考档、是否缓存命中、输入输出 token 明细）是成本归属的前提", "C. 缓存命中率和思考 token 量要各单列一条曲线，它们对账单的影响是数量级的", "D. 输入单价打折的幅度，比少写五百个输出 token 更值得先做", "E. 命中前缀另计折扣，但具体折扣各家不同，别拿别家的数字套"], a: [1, 2, 4], e: "D错误：正文原话是输入单价打折的幅度远不如少写五百个输出 token，先动的应该是输出侧；A错误：数量级来自缓存命中与思考档位这两条曲线，不是把 prompt 剪短。C 是看板做法，E 是折扣口径的提醒，B 是把这些量级落到归属上的第一步：没有标签，看板就只剩全公司总额。" },
  { q: "成本归属与“什么时候自建更贵”，正确的有？", o: ["A. 只看通过率会选出最贵的方案，只看成本会选出做不成任务的方案", "B. 卡买到足够大的规模，自建单 token 成本就低于 API 单价", "C. 三条判据是利用率、运维人力、迭代速度，任何一条不成立就别自建", "D. 出账报全公司总额一项就够，标签打得越细越难核账", "E. 三个分母都要出：每团队每月金额、每功能每用户金额、每个成功任务金额"], a: [0, 2, 4], e: "D错误：正文恰恰要求别只做全公司总额，标签（团队、功能、模型、是否思考档、是否缓存命中、输入输出明细）才把账拆得开；B错误：波峰波谷业务的分母天然小，很容易算出比 API 单价还贵的单 token 成本，规模本身不保证便宜。E 与 A 是归属口径：通过率与每次通过成本要同图看，SLO 与账单都按分位数和实际通过量核算，别用平均值向管理层汇报；C 是自建门槛——反过来，数据不可出域或规模大到边际成本倒挂时，自建才成立。" }
);

  { q: "MLP 直连与「交叉注意力把整图压成固定数量可学习 query」两种连接方式，正确的有", o: ["A. 压成固定数量会对细粒度信息形成信息瓶颈", "B. 压缩越狠，密集文字、多个小目标这类内容越容易丢", "C. 压缩之后下游任务的准确率普遍会提升，因为小模型更不容易过拟合", "D. 交叉注意力压缩能明显减少进入上下文的视觉 token 数", "E. 一层 MLP 便宜，但视觉 token 数量保持不变"], a: [0, 1, 3, 4], e: "C错误：瓶颈正是压缩的代价——需要保留细节的任务（逐字读数、逐个小目标）反而退化，正文口径是「token 少但形成信息瓶颈」，不是无条件变好。" },
  { q: "训练时先冻结视觉编码器与语言模型、只练中间连接层，关于理由与后果，正确的有", o: ["A. 代价是视觉特征的粒度若不适配下游任务，还得解冻部分层接着练", "B. 冻结是为了让生成出来的图像更清晰", "C. 连接层参数量小，用有限图文对先把它拉进正轨最省算力", "D. 一上来就全参联合训练，容易把语言模型已有的语言能力练坏", "E. 冻结两大块可以省显存，不必同时对它们做反向传播"], a: [0, 2, 3, 4], e: "B错误：这条策略服务于理解型 VLM 的连接层训练，与图像画质无关；冻结的动机是保住语言能力与压成本，从来不是提分辨率。" },
  { q: "为什么视觉编码器可以直接复用，语言模型却必须再训练，正确的有", o: ["A. 词表里没有「图像 patch」这一项，拼进序列后语言模型得先学会读它", "B. 因为视觉编码器的参数量一定比语言模型小", "C. 复用可行的前提之一是视觉侧已经在大规模图文对上做过训练", "D. 视觉侧预训练学到的是通用感知特征，「认出物体」这类能力可迁移", "E. 语言模型权重服从的是文本 token 的条件分布，从没吃过视觉向量这一路输入"], a: [0, 2, 3, 4], e: "B错误：谁大谁小不是能否复用的判据，很多视觉分支参数量并不小；决定因素是特征是否已通用、语言侧是否需要适配新输入模态。" },

  { q: "图文向量先做归一化再算相似度，配上温度，关于这套做法正确的有", o: ["A. batch 越大，负样本越充足，对比任务的难度与收益同步上升", "B. L2 归一化后内积等价于余弦相似度，分数被压到可比的尺度上", "C. 温度决定 softmax 分布的尖锐程度，工程上常作为可学习参数", "D. 温度过小会把各候选的得分拉平，对比信号变弱", "E. 归一化的目的是把相似度矩阵变成方阵"], a: [0, 1, 2, 3], e: "E错误：矩阵形状只取决于 batch 里图数和文数是否相等，归一化只改向量尺度，不改形状。" },
  { q: "图文数据的配比会影响哪些能力，正确的有", o: ["A. 带框标注的 grounding 数据，决定模型能不能把对象写成坐标", "B. 多图与高分辨率样本不足，模型对这两种输入形态就陌生", "C. 纯文本占比被大幅挤压，文本侧能力会退化", "D. 配比只影响训练速度，不影响能力分布", "E. 含文字的图、文档类图片占比够高，OCR 与图表阅读能力才有素材"], a: [0, 1, 2, 4], e: "D错误：总量决定算力开销，配比决定能力形状——正文把「数据配比难做」列为全模态的核心难点，说明它影响的是会什么而不是跑多快。" },
  { q: "视觉 token 拼进文本序列之后，关于损失与注意力，正确的有", o: ["A. 不给视觉段位置信息，模型无从判断 patch 的行列顺序", "B. 视觉段也要逐 token 预测自身，因此损失额外多一项", "C. KV Cache 不给视觉 token 分配空间，它们只在第一步用一次", "D. 语言建模损失只落在文本位置，视觉段是条件而不是预测目标", "E. 视觉 token 一样占上下文窗口、一样进 KV Cache"], a: [0, 3, 4], e: "B错误：视觉段不进 next-token 监督，它是输入侧的条件；C错误：视觉 token 与文本 token 共用同一套 KV Cache，正文的 token 账本明写「拼进序列后一样占上下文、一样进 KV Cache」。" },
  { q: "为什么视觉编码器的输出不能直接当词向量喂给语言模型，正确的有", o: ["A. 因为 ViT 用双向注意力而语言模型用因果注意力，所以向量不可用", "B. 视觉向量乘一个常数就能当词向量用", "C. 两侧向量来自不同训练目标，坐标系不共用", "D. 维度与数值尺度不一致，直接进语言模型会出现分布不匹配", "E. 视觉向量与词表没有对应关系，语言模型没法据此选预测目标"], a: [2, 3, 4], e: "A错误：注意力方向与「向量能否直接当词向量」无关；拼接进同一序列后，视觉段一样受语言模型那套注意力规则约束，需要的是把向量搬到同一个嵌入空间；B错误：坐标系与语义都不共用，线性缩放不够。" },
  { q: "要判断一层 projector 是否真的把图文对齐好了，合理的检查有", o: ["A. 只看总训练损失的下降曲线就够了", "B. 只跑纯文本基准就够，视觉部分不重要", "C. 留一批没见过的图文对做检索，看图→文召回率是否随训练上升", "D. 拿图问「图里写了什么」，看它是复述内容还是泛泛描述", "E. 除了总训练损失，单独盯视觉分支的评测"], a: [2, 3, 4], e: "A错误：总损失会被文本侧主导，连接层训歪了未必显眼，容易掩盖问题；B错误：纯文本基准完全不经过视觉通路，等于没测这条链路。" },
  { q: "VLM 数物体个数容易出错，最主要的原因是哪一条", o: ["A. 图像编码器的分辨率一定太低", "B. 语言模型不认识中文量词", "C. 没有「逐个枚举再累加」的机制，数量只能靠注意力隐式聚合", "D. 把问题改成「数一数」的措辞就能解决", "E. 词表里没有数字 token，没法输出数量"], a: [2], e: "单选。C正确：同一个物体可能占 3 块也可能占 300 块，模型没有计数结构，物体一多就退化成「猜个看着合理的数」。E错误：数字是普通词表 token，卡点在视觉侧的证据组织方式；A错误：升分辨率能缓解但改不了「无枚举机制」这一根因；B错误：错的是数量不是词，中文量词本身没问题；D错误：缺的是逐个枚举再累加的机制，措辞不解决。" },
  { q: "关于 VLM 读图中文字（OCR）能力，正确的有", o: ["A. 输入被缩得越小，小字越容易被抹平，读字准确率随之下降", "B. 几像素高的笔画在下采样与投影后被抹平成一片纹理，属于机制性丢失", "C. 能不能读清，取决于训练里有没有喂够含文字的高分辨率图像", "D. CLIP 式对比目标没要求逐字读出图中文字，所以 OCR 不是架构自带", "E. 把解码温度调低就能显著提升读字的准确率"], a: [0, 1, 2, 3], e: "E错误：温度只改文本解码时的概率分布，改不了视觉证据在编码阶段已经被抹平的事实——看不清的字不会因为更确定的解码变清楚。" },
  { q: "把检测框写成文本坐标来做 grounding，误差来源正确的有", o: ["A. 坐标归一化口径与训练分布不一致，会产生整体性偏移", "B. 让模型先写一遍推理链，就能消除量化误差", "C. 连续空间被量化成文本里的数字，精度受量化粒度限制", "D. 小目标只落在少数 patch 上，特征本来就弱", "E. 「左后方第三件」这类相对关系缺少显式的空间枚举机制支撑"], a: [0, 2, 3, 4], e: "B错误：思维链改变不了「连续框最终要写成有限位数的数字」这个粒度上限，正文把量化粒度列为精度受限的根因。" },
  { q: "要在长视频里定位「某动作发生在什么时刻」，困难的原因正确的有", o: ["A. 把抽帧率提到每秒 30 帧就能精确到毫秒", "B. 视频成本来自每帧 token 数 × 帧数，不是帧数本身", "C. 全帧塞进上下文会撑爆窗口，只能少取帧，于是时间分辨率变粗", "D. 换一个更大的模型就能解决定位不准", "E. 抽帧会跳过事件，时间定位精度的上限约为帧间隔"], a: [1, 2, 4], e: "D错误：这是采样与成本的结构性限制——没取到的帧就是没看到，模型规模补不回不存在的证据；A错误：帧间隔与成本都有硬限制，模型的时间分辨率也跟不上。" },
  { q: "一次请求里放多张图，容易出现的状况正确的有", o: ["A. 多图一定比单图准，因为证据更多", "B. 两张图的内容互相串味，把后一张的细节安到前一张的对象上", "C. 「第一张/第二张」这类指代依赖顺序与边界信息，顺序一乱就指错", "D. 视觉 token 总量成倍上涨，窗口占用与账单同步涨", "E. 每图 patch 按行优先排成序列后，仍需要位置信息区分来源"], a: [1, 2, 3, 4], e: "A错误：证据变多的同时干扰也变多，串味与顺序混淆正是多图的典型失效方式，多图不是无条件的增益。" },
  { q: "关于视觉幻觉（图里明明没有，模型却断言有），正确的有", o: ["A. 目标区域太小、被下采样抹平，都会让它更容易出现", "B. 让它把答案写成带框的输出（给区域），比只听它自述更容易核对", "C. 把 CFG 引导强度调大就能压住视觉幻觉", "D. 它多发生在视觉证据不足的区域，模型按语言先验把内容补齐了", "E. 与文本侧幻觉不同，它的证据在图像里，可以用检测器或 OCR 独立核验"], a: [0, 1, 3, 4], e: "C错误：CFG 是扩散采样时放大条件差值的旋钮，与理解型 VLM 的解码无关；正文口径里这类模型连温度都不适用，更不存在调 CFG 治幻觉。" },
  { q: "让 VLM 读图表、仪表盘上的数值，容易错在哪里，正确的有", o: ["A. 从柱子高低反推具体数值要靠多步比较，模型常按视觉印象估数", "B. 数字本身往往是小字，笔画受损后读数连字带数一起错", "C. 表格那种跨行跨列的对齐关系，不在对比学习考的东西里", "D. 读图准不准只由语言模型侧决定，与输入图像质量无关", "E. 坐标轴刻度与网格线被切进 patch，细密刻度容易被抹平"], a: [0, 1, 2, 4], e: "D错误：证据在图像侧就被抹掉时，再强的语言模型也只能猜；正文明写 OCR 靠高分辨率训练样本补，不是架构自带的能力。" },
  { q: "哪些任务该退回专职 OCR 或检测器，而不是硬让 VLM 看，正确的有", o: ["A. 把发票字段结构化抽取并留存可审计的记录", "B. 逐字转录合同条款，每个数字都要对得上", "C. 需要精确到可裁剪、可测量的框坐标", "D. 数清画面里几十个小目标的确切个数", "E. 判断「这张图大概在讲什么」这类全局语义"], a: [0, 1, 2, 3], e: "E错误：全局语义理解恰恰是 VLM 的强项，专职检测器只会给框和类别，答不出「讲什么」；需要精确计数、逐字转录、坐标精度时才该换工具。" },
  { q: "搭一条「VLM + 专职工具」的混合链路，合理的设计有", o: ["A. 为了省 token 把分辨率统一压低，读字任务照此跑", "B. 先用 OCR 或检测器产出结构化证据，再把结果当文本喂给语言模型推理", "C. 让模型自己决定要不要调用 OCR，不必显式编排", "D. 允许模型在证据不足时回答「看不清」，而不是逼它硬猜", "E. 工具结果与模型自述不一致时记成失败样本回流，用来定位错在哪一段"], a: [1, 3, 4], e: "A错误：读字恰恰最吃分辨率，压低输入会把笔画抹平，省下的那点 token 会以错答的形式还回去；C错误：证据产出要显式编排并可核查，否则无法定位错在哪一段。" },
  { q: "VLM 被问「图里有几个人」答了 6，实际 11，最合理的处置是哪一条", o: ["A. 换更大的上下文窗口重新问一遍", "B. 先检测再计数，或把人群区域裁出来放大再看，把计数交给有枚举机制的环节", "C. 把温度调到 0 再问一次", "D. 多问几次取多数答案就能修正", "E. 把 CFG 调高再问一次"], a: [1], e: "单选。B正确：模型没有「逐个枚举再累加」的机制，数量靠注意力隐式聚合，一多就退化成猜数，所以要用外部枚举或降低单帧目标密度。C错误：温度只让解码更确定，错的视觉证据不会因此变对，反而更自信地报错数；E错误：CFG 属于扩散采样的参数，VLM 解码路径上没有这个旋钮；A错误：窗口大小不改变计数机制缺失这件事，塞更多内容也数不对；D错误：机制缺失导致的计数错会稳定复现，投票没用。" },
  { q: "扩散模型的正向加噪过程为什么不需要训练，正确的有", o: ["A. 因为正向过程可逆，反向只是把它精确解出来", "B. 正向过程也算损失，只是权重给得小", "C. 它按预设噪声表逐步掺高斯噪声，规则是写死的", "D. 每一步从干净图到带噪图都有解析形式，不需要学", "E. 加到最后与随机噪声无异，所以采样起点可以直接从随机分布取"], a: [2, 3, 4], e: "A错误：正向加噪是有损的，反向只能靠模型近似去噪——真可逆就不必训练反向网络了；B错误：训练目标只有反向那一步（给定带噪图与步数预测掺入的噪声），正向没有可学参数也没有损失项。" },
  { q: "关于扩散模型在反向每一步预测的对象，正确的有", o: ["A. 文本条件与时间步一起作为输入提供给网络", "B. 每一步都看见整幅图，而不是逐块接龙", "C. 预测下一段离散 codebook token 上的概率分布", "D. 预测这张图对应的文字描述 caption", "E. 给定带噪图与当前步数，预测这一步掺入的噪声并减掉"], a: [0, 1, 4], e: "C错误：逐 token 接龙是自回归图像生成的机制；扩散每步是对连续值的回归，把两者混为一谈就会误以为它也有词表和 softmax；D错误：caption 是条件或评测对象，不是去噪目标。" },
  { q: "关于去噪步数这个旋钮，正确的有", o: ["A. 超过约几十步，质量几乎不再往上走", "B. 早期步定构图，中后期步修轮廓纹理与细节", "C. 步数加够多可以替代分辨率，把细节补回来", "D. 步数太少会留噪点与涂抹感", "E. 每多一步就多一次完整前向，成本线性上涨"], a: [0, 1, 3, 4], e: "C错误：步数管的是收敛得干不干净，能容纳多少细节由分辨率决定；latent token 数不变，再多次迭代也补不出被压缩掉的像素级信息。" },
  { q: "关于 CFG（无分类器引导），正确的有", o: ["A. 系数小容易自由发挥跑偏题，系数大更贴合指令", "B. 引导过强会过饱和、结构易崩、风格趋同", "C. 这一步的算力与显存开销明显上涨", "D. 要分别训练一个引导模型和一个被引导模型", "E. 每步要同时算「按 prompt」和「不给 prompt」两路，等效批次翻倍"], a: [0, 1, 2, 4], e: "D错误：两路来自同一个模型，只是条件给与不给的两次前向，正文说的是「这步等于跑两路，批次翻倍」，不是维护两套权重。" },
  { q: "要把一张文生图的输出复现出来，需要固定哪些东西，正确的有", o: ["A. prompt、引导强度等采样参数也要保持一致", "B. seed 固定后画面就由 seed 单独决定，prompt 的影响被覆盖", "C. seed 决定起点那张噪声图，必须存下来", "D. 同 seed 但换了调度器或步数，结果不会一致", "E. 把 prompt 存下来，seed 每次随机也能复现"], a: [0, 2, 3], e: "B错误：seed 只锁住起点那张噪声，内容仍由条件与采样参数驱动；正文的分工是多样性来自 seed 与调度器，可控性来自 CFG 与步数；E错误：起点噪声决定构图，seed 必须一起存。" },
  { q: "把 Temperature 搬到扩散采样上为什么不成立，正确的有", o: ["A. 把温度调到很低，画面细节就会更锐利", "B. 温度缩放的是离散词表 logits 上的 softmax 分布", "C. 扩散每步是对连续噪声的回归，没有可缩放的概率分布", "D. 想要多样性该动 seed 与调度器，想要可控该动 CFG 与步数", "E. 图像被量化成离散 codebook token 逐块接龙时，温度才有意义"], a: [1, 2, 3, 4], e: "A错误：没有可缩放的分布，温度在这里就是无效参数；锐不锐取决于步数、分辨率与条件强度，不取决于它。" },
  { q: "在 VAE 压出的 latent 空间做扩散，相比直接在像素上做，正确的有", o: ["A. 平方关系没被消掉：边长翻倍时 latent token 照样乘四", "B. 每段成片都要 VAE 解码回像素，这一步成本常被忽略", "C. 压缩是有损的，细纹理与小字这类内容存在上限", "D. 换到 latent 空间就不用训练去噪网络了", "E. latent 尺寸压缩数倍、通道变多，序列短了显存与算力都降"], a: [0, 1, 2, 4], e: "D错误：换的只是工作空间，训练目标仍是预测噪声；VAE 负责把维度压下来，不负责替代反向过程。" },
  { q: "按正文的分辨率账：输出边长翻倍会带来什么，正确的有", o: ["A. 注意力算力也只乘四", "B. 像素数乘四", "C. latent token 数乘四", "D. 显存约乘四", "E. 注意力算力乘十六"], a: [1, 2, 3, 4], e: "A错误：注意力随序列长度平方上涨，序列乘四意味着算力乘十六；正文的口径就是「显存约乘四、注意力算力乘十六」。" },
  { q: "把主干从 U-Net 换成 DiT，是为了什么，正确的有", o: ["A. 条件改用归一化调制注入，而不是只靠交叉注意力进文本", "B. 代价是序列长度进了注意力的平方项", "C. 换上 DiT 就不需要 VAE，也不需要迭代去噪了", "D. 把 latent 也切成 patch 当序列处理，接上 Transformer 那套扩展路径", "E. 堆参数、堆数据对图像生成同样有效，这是换主干的主要收益"], a: [0, 1, 3, 4], e: "C错误：DiT 仍在 latent 上逐步去噪，变的只是主干；省掉 VAE 或省掉迭代都不是这次换形的内容。" },
  { q: "生成一段 CRUD 只要几分钟之后，团队的瓶颈并没有消失而是移动了。按正文口径，它移到了哪里", o: ["A. 移到了需求积压：周产能在涨，积压和没人认领的产物也在涨", "B. 哪里都没移，产能上来瓶颈自然就消化了", "C. 前端的把需求定义清楚：这段代码该不该存在，一点没变快", "D. 后端的集成与长期维护：三年后谁敢改它，照样没人接", "E. 移到了敲代码的手速，Agent 终究比人写得慢"], a: [0, 2, 3], e: "E错误：写样板代码正是被接管得最干净的一段，手速不再是瓶颈。B错误：生成变快只压掉中间那一段，前后两端都没变，积压反而跟着产能一起涨。" },
  { q: "过去集成是人写代码时的副产品，现在必须变成有 owner 的显式动作。关于这一变化的原因与表现，正确的有", o: ["A. Agent 各生成一块时，错误码各写各的、依赖被重复引入", "B. 把接口文档喂给每个 Agent，集成这件事就不再需要人做", "C. 两处相似实现各自演化，最后没人敢合并", "D. 集成做得快不快，取决于模型的代码补全延迟", "E. 以前写代码的人顺手就读到别人的接口，集成是副产物"], a: [0, 2, 4], e: "B错误：文档喂进去不等于对齐，错误码仍会各写各的，正文要的是有人认领这个动作。D错误：集成是决策与合并的工作量，跟单次补全的延迟没有关系。" },
  { q: "审查点上移之后，资深工程师的日常产出也跟着换。关于这些产出，错误的有", o: ["A. 按能独立验证的粒度切任务", "B. 把技术栈、目录约定、禁止事项与合规红线写成约束", "C. 把自己练成读 diff 最快的人，靠阅读速度覆盖产量", "D. 亲自重写 Agent 的产出，把质量攥在自己手里", "E. 把“能做出来就行”换成能通过的判据：触发条件、数值边界、明确反例"], a: [2, 3], e: "E成立：它正是三件可复用产出里的第一件。A成立：切错粒度会让人审不动，于是跳过审查。B成立：约束写得客气，模型就用它见过的平均值来补。C错误：读得再快也只是在消费产出，能留给团队复用的还是判据、切分和约束这三样。D错误：逐段重写不沉淀任何资产，同类错误照样在下一处冒出来。" },
  { q: "口头 review 挡一次，一条好判据挡十次同类错误。关于这句话的机制与落地做法，正确的有", o: ["A. 判据补齐之后，人的抽审就可以整段取消", "B. 判据是可复用资产，一次写清、长期替人挡错", "C. 没进流水线的口头意见只作用于当次合并", "D. 判据要落成能执行的检查：测试、门禁、静态规则", "E. 判据的拦截力来自它写了触发条件、边界值和明确反例"], a: [1, 2, 3, 4], e: "A错误：人抽审关键点仍是兜底，只是不再是日常工作量的主体；流水线绿了不等于符合规格。" },
  { q: "任务切分要按能独立验证的粒度来切，切错的代价很直接。关于切分粒度，正确的有", o: ["A. 切分粒度只影响体感，不影响返工率与首次验收通过率", "B. 切得越细越好，审查成本可以忽略", "C. 一次吐八百行，没人审得动，结果就是跳过审查", "D. 单次产出越长，一次失败要返工的决策越多", "E. 切分粒度由模型的上下文上限决定，跟人没关系"], a: [2, 3], e: "E错误：能独立验证是判据尺度，不是 token 尺度；按上限切出来的块往往混着一堆决策。A错误：审不动就跳过审查，返工和线上兜底跟着涨，这两项恰好都会在指标上露头；B错误：过细会增加集成与决策次数，粒度要按可验证性定。" },
  { q: "AI 生成的代码出了线上事故，按正文口径，可执行的责任落在哪里", o: ["A. 只落在按下合并键的提交人，另外两层不参与复盘", "B. 落在批准引入 AI 工具的管理层", "C. 自动减免，因为没人逐行写过这段代码", "D. 落在提交人、评审人、门禁设计者三层，缺一层就退化成没人负责", "E. 落在模型及其供应商，因为错误内容是它生成的"], a: [3], e: "单选。E错误：模型没有账户、不上 on-call，也不能被复盘，责任落不到它头上。A错误：提交人只是三层之一，前两层追人，第三层追系统。B错误：把责任推给决策层，等于当前三层都没人认领。C错误：提交即背书，代码不是人逐行写的这件事不构成免责。" },
  { q: "同一类错误第二次仍然被合进主干。按正文口径，正确的处置是", o: ["A. 门禁设计者要对为什么这类错误能一路通过流水线负责", "B. 要求评审人逐行读完所有 AI 生成代码，作为修复手段", "C. 责任从又一次按下合并的工程师，转移到设计门禁的人", "D. 复盘要问缺哪条检查、谁补、几天内补上", "E. 仍然只追究提交人，因为他读得不够仔细"], a: [0, 2, 3], e: "E错误：第一次可以追人，第二次还能合进来就该追系统，否则同一个错误会一直追到下一个提交人头上。B错误：逐行读完不可规模化，要补的是那条缺失的检查，不是加大人力。" },
  { q: "一个人加 Agent 写完整个模块，个体尺度成立、组尺度会爆炸。关于它崩在哪里，正确的有", o: ["A. 模块规模不到八百行就不会出这个问题", "B. 个体尺度确实成立：所有决策在作者脑子里，跑通即完成", "C. 组尺度崩在知识不成文：八百行整洁代码里埋着二十次没写下来的取舍", "D. 接手的人只能重写，而且比重写更慢，因为没人告诉他坑在哪", "E. 这类模块的代码质量必然低于团队平均值"], a: [1, 2, 3], e: "E错误：崩的不是质量而是可解释性，代码能跑、写得整洁也照样没人能接手。A错误：八百行只是举例，债的多少看没写下来的取舍数量，跟行数的关系不是阈值。" },
  { q: "一个模块背上了知识债，正文给出的可观察信号包括", o: ["A. 作者休假一周，问题开始排队", "B. 那一行代码所有权名单上只有一个名字", "C. 找不到一份记录来解释当初为什么这么选", "D. 单元测试覆盖率为零", "E. 只有作者能改这个模块"], a: [0, 1, 2, 4], e: "D错误：覆盖率低是质量问题。知识债的四个信号都指向没人能解释，而不是没被测过；覆盖率高但只有作者能改，一样是债。" },
  { q: "关于知识债与代码债、技术债的区分，正确的有", o: ["A. 知识债只能靠整段重写来还，作者一走就一次性兑现", "B. 代码整洁、命名规范就能把知识债消掉", "C. 知识债只在小团队出现，大团队有文档就不会有", "D. 知识债的形态是代码能跑，但没人能解释", "E. 技术债写在代码结构里，知识债写在没落地的取舍里"], a: [3, 4], e: "A错误：还它靠的是把取舍写下来（选型记录、结对接手、补齐判据），重写只是最贵的一条路，不是唯一一条。B错误：整洁只降低阅读成本，解释不了为什么用乐观锁、这个字段为什么可空。C错误：大团队的文档常常是事后补的形式件，四个信号里那条找不到选型记录就是冲着它来的。" },
  { q: "新人靠修小 bug、写接口摸清代码库这条路被 Agent 占掉之后，正文给出的补法与评估项，正确的有", o: ["A. 评估项从写得快换成会问、会验", "B. 让新人先抄写既有模块练手速，把手感找回来", "C. 入门任务往上挪：先给别人的 Agent 产出写测试", "D. 再让他们参与判据评审，被迫回答怎么算对", "E. 最后才独立提小改动"], a: [0, 2, 3, 4], e: "B错误：断掉的不只是练手题，而是读代码的动机和即时反馈，抄写两样都补不上；写测试才逼人读接口与边界。" },
  { q: "按正文口径，面试里值得专门设环节的三种能力，正确的有", o: ["A. 知道什么该常驻、什么按需加载、什么根本不该喂进去", "B. 手写常见算法复杂度推导的速度", "C. 提示词话术背得多不多，熟不熟悉上一代模型的魔法句式", "D. 听到一句模糊需求，能追问出大小上限、超时、失败提示、权限归属并写成可验证条款", "E. 面对没见过的 Agent 产出，能立刻想出便宜的证伪办法"], a: [0, 3, 4], e: "C错误：提示技巧的半衰期比一次模型换代还短，去年的魔法句式今年基本失效，它不构成核心竞争力。B错误：那衡量的是不再稀缺的能力，环节可以留，但它筛不出新瓶颈。" },
  { q: "正文认为会定义验收比会提示更值钱，给出的机制包括", o: ["A. 提示写得足够清楚时，模型能替团队决定什么算做完", "B. 什么算做完是价值判断，模型只会让选定的那条路看起来更像样", "C. 验收定义写下来就变成团队资产，能复用、能被门禁执行", "D. 口头提示只留在一个人脑子里，人一走就没了", "E. 提示词技巧会贬值：每一代模型都更擅长把含糊意图补全"], a: [1, 2, 3, 4], e: "A错误：它补的是意图的空白，给不出价值判断，把做完的标准交给它等于没有标准。" },
  { q: "提效指标按问法分四类，每类都有自己固定的作弊姿势。关于指标类与作弊姿势的对应，正确的有", o: ["A. 四类的作弊姿势是同一套，都是多写代码", "B. 行产量类被样板代码偷走：只让 Agent 干容易过的活，没人删代码", "C. 吞吐量类被拆卡偷走：一件事拆成五张卡，相关需求不再合并", "D. 质量类被改标偷走：少写测试，把缺陷标成改进项", "E. 体验类被好玩偷走：满意度跟有没有用无关"], a: [1, 2, 3, 4], e: "A错误：四类各有各的省力路径，正因为路径不同，才需要配套项把速度类指标钉在稳定性上。" },
  { q: "行产量类指标要配配套项才压得住。关于配套项与理由，正确的有", o: ["A. 采纳行数量受任务难度影响大，跨功能不可比", "B. 配净删除行数：只统计生成不统计删除，仓库会只增不减", "C. 配每需求周期：把注意力从写了多少行拉回多久交付一个需求", "D. 单看本周被采纳的生成行数就够，行数涨就是效率涨", "E. 行数适合跨功能横向比较，因为口径统一"], a: [0, 1, 2], e: "D错误：只看它，最优策略就变成让 Agent 只写样板，真正省时间的重构和删代码没人碰。E错误：不同功能的重构密度本来就不一样，口径统一不等于可比。" },
  { q: "正文认为各家 SDD 工具的差别主要看三件事，包括哪些？", o: ["A. 支持哪几家模型的接口", "B. 工具是开源还是商用", "C. 规格长什么样", "D. 人工审查卡在哪一步", "E. 存量项目（棕地）怎么办"], a: [2, 3, 4], e: "B错误：授权方式不在那三件事里；A错误：支持哪些模型接口也不是正文的判据。" },
  { q: "关于「三件套瀑布」模式，正确的有？", o: ["A. tasks 一条条执行打勾", "B. 最擅长从零做新功能，逼你把需求写成可验证条款", "C. 一次变更一份规格增量，归档后回写基线", "D. 以 Epic/Story 为最小单元，角色之间互相评审", "E. requirements、design、tasks 三份文档逐份确认才写码"], a: [0, 1, 4], e: "C错误：提案加规格增量并归档回写属于变更提案流；D错误：Epic/Story 为最小单元、角色互审是多角色敏捷。" },
  { q: "「宪法 + 阶段门」模式的规格形态与推进方式，正确的有？", o: ["A. 可以回头跑一致性检查", "B. 靠分析师、架构师、QA 等角色互相评审推进", "C. 擅长团队统一流程、强制留痕", "D. 一份原则文件加每个特性一个 specs 目录", "E. 命令式阶段推进，每阶段人工放行"], a: [0, 2, 3, 4], e: "B错误：多角色接力产出文档属于 BMAD 式多角色敏捷。" },
  { q: "关于「变更提案流」，正确的有？", o: ["A. 规格基线一旦建立就不再更新", "B. 流程是审提案、实现、归档并回写到规格基线", "C. 是已有系统渐进改造（棕地）的首选", "D. 需要先把存量代码全部重写", "E. 一次变更等于提案加任务加规格增量"], a: [1, 2, 4], e: "A错误：归档正是把增量合并回当前规格基线；D错误：它面向渐进改造，不要求推倒存量代码。" },
  { q: "关于「多角色敏捷」模式，正确的有？", o: ["A. 代价是文档量小、几乎没有学习曲线", "B. 规格形态是接口契约，由契约反向生成骨架", "C. 分析报告、PRD、架构、故事卡多份接力", "D. 以 Epic/Story 为最小单元，角色之间互相评审", "E. 擅长需求本身还没想清楚的中大型项目"], a: [2, 3, 4], e: "B错误：契约先行是另一种模式；A错误：它的代价恰恰是文档量大、学习曲线陡。" },
  { q: "「常驻规范 + 契约先行」模式，说法正确的有？", o: ["A. 它要求三份文档逐份人工确认后才允许写码", "B. 已有规范的仓库、前后端并行开发最受益", "C. 这种形态必须依赖专用 IDE 才能落地", "D. 规则文件每次会话自动生效", "E. 由契约反向生成前后端骨架与测试"], a: [1, 3, 4], e: "A错误：逐份确认三份文档属于三件套瀑布；C错误：这一档的典型形态是常驻规则文件加 Plan Mode，并不绑定 IDE。" },
  { q: "按正文的选型口径，工具与场景配对正确的有？", o: ["A. 连需求是什么都还没定，用 BMAD 式多角色帮忙挖需求", "B. 只是日常改点东西，用常驻规则加先出方案再动手，不必装工具", "C. 前后端要并行、接口是关键，契约先行先锁接口定义再生成代码", "D. 新项目要把需求一次讲清，优先用变更提案流", "E. 已经有一堆老代码要改，用 OpenSpec 式变更提案，别一上来给全系统补规格"], a: [0, 1, 2, 4], e: "D错误：一次讲清新需求该用 Kiro 式三件套或 Spec Kit，变更提案流是棕地首选。" },
  { q: "关于「轻规格」这一档，正确的有？", o: ["A. 覆盖日常小改动，成本最低", "B. 好处是天然留下需求与实现之间的追溯矩阵", "C. 适用场景是单人、改动小、需求方就是你自己", "D. 做法是宪法文件加多角色评审加审计留痕", "E. 常驻规则文件写约定，动手前先让模型出可审批的执行方案"], a: [0, 2, 4], e: "D错误：宪法、多角色、追溯加审计留痕是重规格档的定义；B错误：正文明说它的代价就是不留需求与实现的追溯。" },
  { q: "「什么时候用多重的方法」四档划分，正确的有？", o: ["A. 分档只看团队人数，与风险和留存无关", "B. 纯 Vibe 适用于一次性脚本、原型验证、玩具项目", "C. 轻规格适用于强合规行业、生成代码直接进生产", "D. 标准 SDD 适用于多人协作、跨模块功能、要长期维护的代码", "E. 重规格适用于强合规行业、大版本重构"], a: [1, 3, 4], e: "C错误：强合规、代码直接进生产属于重规格档，轻规格只够单人小改动；A错误：正文的口径是三个月后有没有人接手、错了要不要背锅。" },
  { q: "把各家 SDD 工具拆开看，共同套路里的要素正确的有？", o: ["A. 一道一致性检查，专门抓规格和代码互相撒谎", "B. 一份不可协商的原则（宪法、steering、rules），保证每次生成风格一致", "C. 一份可验证的需求：目标、非目标、验收标准", "D. 任务清单要尽量大颗粒，一次生成的代码越多越好", "E. 一份技术方案（架构、数据、接口），是人审怎么做的抓手"], a: [0, 1, 2, 4], e: "D错误：小步任务清单的目的就是把每次生成体量落在人能审完的范围内。" },
  { q: "关于工具与规格本身的收益，符合正文观点的有？", o: ["A. 不装任何工具也能拿到完整流程的大部分收益", "B. 最小可用 SDD 必须凑齐三份文档加一道审计流程", "C. 只有接入商用 SDD 工具才算真正在做 SDD", "D. 换工具的收益远小于把这几份东西写好的收益", "E. 看清那五个要素，新出的 SDD 工具十分钟就能上手"], a: [0, 3, 4], e: "B错误：最小可用是一个 spec 文件（目标、非目标、约束、验收标准）加一个 tasks 文件（每条带完成判据）加每条验收对应一条测试；C错误：正文特意给了不装任何工具的搭法。" },
  { q: "cc-sdd 与 Agent 自带 Plan Mode 的定位差异，正确的有？", o: ["A. cc-sdd 带绿地与棕地两条流程和规格实现一致性审查命令", "B. Plan Mode 是动手前先让模型出一个可审批的执行方案，批准后再改码", "C. cc-sdd 的主要代价是绑定某一家 IDE", "D. Plan Mode 属于三件套瀑布那一档", "E. cc-sdd 是宪法加阶段门的轻量版，装在 Claude Code 或 Cursor 里"], a: [0, 1, 4], e: "C错误：cc-sdd 的代价是生态较小，绑定 IDE 是 Kiro 的代价；D错误：Plan Mode 归在常驻规范加契约先行这一档。" },

QUIZ_BANK.push(
  { q: "某服务日均 20 万次调用，平均输入 1200 token、平均输出 300 token，无缓存命中。假定输入单价 2 元/百万 token、输出单价 8 元/百万 token，一个月按 30 天计。下列换算正确的有？", o: ["A. 输入侧与输出侧金额相等，各占一半", "B. 输入 token 是输出的 4 倍，所以输入侧才是账单大头", "C. 单次调用平均约 0.48 分", "D. 把平均输出从 300 压到 150，月账单就能砍一半", "E. 日账单约 960 元，月账单约 2.88 万元"], a: [0, 2, 4], e: "算式：日输入 200000×1200＝2.4 亿 token＝240 百万，240×2＝480 元；日输出 200000×300＝6000 万＝60 百万，60×8＝480 元；日合计 960 元，月 960×30＝28800 元；单次 960÷200000＝0.0048 元＝0.48 分。B错误：比的是 token 数乘单价，输入量是 4 倍但单价只有四分之一，两边正好打平；D错误：输出减半只砍掉输出侧那 480 元里的一半，日账单 720 元、月 21600 元，降幅是四分之一而不是一半。" },
  { q: "按正文口径，MaaS 的输出单价约为输入的 3~5 倍。关于这条价差的来处与治理，正确的有？", o: ["A. 供应商侧压这条价差的手段是模型压缩、上下文缓存与连续 batching", "B. Decode 逐 token 生成，每走一步都要把权重和 KV 再过一遍，算力难以摊薄", "C. Prefill 能把整段输入一次并行算完，输入侧的单位成本更低", "D. Decode 常受显存带宽限制，产出一个 token 的搬运代价高于同数量输入 token 的计算", "E. 这条价差是正文给的量级口径，各家数字不同，别拿别家的倍数套"], a: [0, 1, 2, 3, 4], e: "五项皆成立：B 与 D 讲的是 Decode 侧的算力与访存瓶颈，逐 token 的产能天然低于一次算完整段的 Prefill；C 是输入侧便宜的另一半原因，输入可以并行；E 是正文口径（输出约为输入的 3~5 倍）本身，它只是量级不是承诺；A 对应正文的毛利段——量化、蒸馏、投机解码、上下文缓存、连续 batching 都是压低单次调用成本的手段。" },
  { q: "假定输入单价 2 元/百万 token、缓存命中部分 0.5 元/百万 token、输出 8 元/百万 token。某 Agent 每次调用有 8000 token 固定前缀且全部命中，另有新增输入 500 token、输出 400 token，日均 10 万次。下列换算正确的有？", o: ["A. 命中口径下单次约 0.0082 元，月账单约 2.46 万元", "B. 完全不命中时单次约 0.0202 元，缓存每天省下约 1200 元", "C. 命中部分按原价计费，折扣只给包月客户", "D. 把输出从 400 压到 200 大约每天省 160 元，不到缓存那笔钱的七分之一", "E. 折扣只作用于输出 token，本例输出不变，所以缓存省不下钱"], a: [0, 1, 3], e: "算式：命中 8000×0.5÷10⁶＝0.004；新增输入 500×2÷10⁶＝0.001；输出 400×8÷10⁶＝0.0032；单次 0.0082 元，日 100000×0.0082＝820 元，月 820×30＝24600 元。全不命中时输入 8500×2÷10⁶＝0.017，加输出 0.0032 得 0.0202 元、日 2020 元，差额约 1200 元。压一半输出省的是 200×8÷10⁶＝0.0016 元/次，即每天 160 元。E错误：命中折扣作用于命中的输入前缀，与输出无关；C错误：正文口径是命中部分按折扣价计费，具体折扣各家不同，没有只给包月客户这一说。" },
  { q: "关于失败请求与重试在账单上的口径，正确的有？", o: ["A. SDK 抛异常没拿到内容时，这条请求不会计费", "B. 内容策略在生成中途拦截时，前面已经吐出的 token 不该算钱", "C. 请求已进入服务端并开始产生 token，即使业务处理失败，输入侧与已生成的输出通常仍会计费", "D. 客户端在收到响应前超时，这条消耗一定不会出现在账单里", "E. 参数校验失败、在网关早期就被直接拒掉的请求，一般不产生推理消耗"], a: [2, 4], e: "D错误：超时丢掉的是回程而不是执行，服务端可能继续跑完，算力已经花掉、消耗照样入账；A错误：和 D 同一个误判，没拿到内容不代表没被计费，对账要看服务端 usage 明细；B错误：生成中途已经占用产能，正文里没有「没交付给用户就不计费」这条口径。" },
  { q: "一个 10 轮会话，每轮用户新增 200 token、模型输出 100 token，客户端每轮都把全部历史重新发送（忽略系统提示）。单价：输入 2 元/百万、输出 8 元/百万。关于这笔账，下列换算正确的是？", o: ["A. 输入侧金额随轮数线性增长，输出侧随轮数近似平方增长", "B. 会话越长，输入侧金额在账单里的占比越小", "C. 开了前缀缓存之后，重发的历史就不再产生费用", "D. 全量重发的总输入约 1.2 万 token，账单大头落在输出侧", "E. 全量重发口径下总输入 15500 token，总成本约 0.039 元"], a: [4], e: "单选。算式：第 k 轮发送输入 200k＋100×(k−1)＝300k−100，k 从 1 到 10 求和＝300×55−1000＝15500 token；输入金额 15500×2÷10⁶＝0.031 元，输出 1000×8÷10⁶＝0.008 元，合计约 0.039 元。D错误：15500 不是 1.2 万，而且输入占 0.031÷0.039≈79%，大头在输入侧；A错误：每轮发送量随 k 线性增长，累加后是平方级，输出才是线性；B错误：正好相反，轮数越多输入侧占比越高；C错误：命中部分按折扣价计费，是便宜不是免费。" },
  { q: "某客服系统把 6000 token 的固定 SOP 与工具定义放最前、用户问题放最后，日均 10 万次，命中率 95%。单价：输入原价 2 元/百万、命中 0.5 元/百万、输出 8 元/百万；平均问题 300 token、回答 200 token。下列换算正确的有？", o: ["A. 命中率只影响首字延迟，对账单没有影响", "B. 完全没有命中的口径约 1420 元一天，命中率把这笔钱压掉约六成", "C. 按 95% 命中率折算，日账单约 565 元", "D. 命中的请求单次约 0.0052 元，未命中的约 0.0142 元", "E. 按 95% 命中率折算，日账单约 1420 元"], a: [1, 2, 3], e: "算式：命中 6000×0.5÷10⁶＝0.003，新增输入 300×2÷10⁶＝0.0006，输出 200×8÷10⁶＝0.0016，命中请求合计 0.0052 元；不命中时那一段变成 6000×2÷10⁶＝0.012，合计 0.0142 元。加权 0.95×0.0052＋0.05×0.0142＝0.00565 元，日 565 元；全不命中 0.0142×100000＝1420 元，(1420−565)÷1420≈60%。E错误：1420 元是零命中口径的天花板，不是折算后的实际值；A错误：命中同时降首字延迟和降账单，命中部分按折扣价计费。" },
  { q: "关于大模型 API 的状态码与客户端处置，正确的有？", o: ["A. 4xx 一律可以原样重试，等一会儿自然会成功", "B. 5xx 与网络超时属于可重试错误，但要设重试上限与总时长，超了就落降级", "C. 401 说明模型版本已下线，换个模型名再重试就能通过", "D. 429 和 500 都属于服务端过载，处置动作完全一样", "E. 429 表示限流，应按 Retry-After 或指数退避加抖动后再发"], a: [1, 4], e: "D错误：429 是配额窗口问题，要退避降速；500 是服务端故障，退避之外还要有备用路径，两者的动作与告警含义不同；A错误：参数错、上下文超限、内容策略拒绝这类 4xx 改请求才有用，原样重发只会复现同一个错；C错误：401 对应认证失败（Key 无效或未提供），模型下线通常由专门的错误码或部署配置说明。" },
  { q: "要把 LLM 调用的账单核对到能追责，下列做法正确的有？", o: ["A. 财务出账只报全公司总额一项就够，标签打得越细越难核账", "B. 本地估算只能当趋势参考，模板渲染与工具 schema 序列化后的长度都可能和线上不一致", "C. 用本地 tokenizer 估出的 token 数就是计费依据，服务端字段只是参考", "D. 中英混排可以直接按字符数除以二折算 token，够核账用了", "E. usage 里的输入、输出、缓存命中要分别落进日志，才能验证折扣有没有生效"], a: [1, 4], e: "C错误：计费以服务端返回的 usage 明细为准，本地估算和线上的分词、模板、序列化结果都可能不一致；D错误：按正文口径中文消耗的 token 往往是英文的 1.5～2 倍，统一按字符折算会估偏；A错误：正文要求给每条请求打标签（团队、功能、模型、是否思考档、是否缓存命中、输入输出明细），否则看板只剩一个全公司总额。" },
