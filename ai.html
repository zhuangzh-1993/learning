var rmTip = null;
const RM_TAG_LABEL = {0:"评测/横切",1:"预训练/分词",2:"RAG",3:"Agent",4:"评测集",5:"安全",6:"推理成本",7:"商业/许可",8:"量化/端侧",9:"训练数据",10:"多模态",11:"推理/解码",12:"部署/运维",13:"记忆",14:"编码/规格",15:"治理/指标"};
function initMap(){
  const app = document.getElementById('rm-app');
  const dataEl = document.getElementById('rm-data');
  if (!app || !dataEl) return;
  let ROOT;
  try { ROOT = JSON.parse(dataEl.textContent); } catch (e) { return; }
  const canvas = document.getElementById('rm-canvas');
  const stage = document.getElementById('rm-stage');
  const nodesEl = document.getElementById('rm-nodes');
  const linksEl = document.getElementById('rm-links');
  const panel = document.getElementById('rm-panel');
  if (!canvas || !stage || !nodesEl || !linksEl || !panel) return;
  const NS = 'http://www.w3.org/2000/svg';
  const all = [], domains = [];
  function walk(n, parent, depth, path, color){
    n._id = path; n._parent = parent; n._depth = depth;
    if (depth === 1) { n._color = domains.length; domains.push(n); }
    else { n._color = color || 0; }
    all.push(n);
    if (n.children) n.children.forEach(function(c, i){ walk(c, n, depth + 1, path + '-' + i, n._color); });
  }
  walk(ROOT, null, 0, '0', 0);

  all.forEach(function(n){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'rm-node ' + (n._depth === 0 ? 'rm-root' : n._depth === 1 ? ('rm-domain rm-d' + n._color) : n._depth === 2 ? 'rm-topic' : 'rm-concept');
    b.style.setProperty('--rm-c', ['#2563eb','#7c3aed','#0891b2','#059669','#ea580c','#e11d48'][n._color] || '#64748b');
    b.innerHTML = '<span class="rm-t"></span>' + ((n.children && n.children.length) ? '<span class="rm-more" role="button" tabindex="0" aria-label="展开或收起整棵子树">＋</span>' : '');
    b.querySelector('.rm-t').textContent = n.title;
    b.setAttribute('aria-label', n.title);
    b.dataset.id = n._id;
    b.addEventListener('click', function(e){
      if (e.target.closest('.rm-more')) { e.stopPropagation(); toggleSubtree(n); return; }
      e.stopPropagation(); onNode(n);
    });
    b.addEventListener('keydown', function(e){
      if (e.target.closest('.rm-more') && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault(); e.stopPropagation(); toggleSubtree(n);
      }
    });
    b.addEventListener('mouseenter', function(){ showTip(n, b); });
    b.addEventListener('mouseleave', hideTip);
    nodesEl.appendChild(b);
    n._el = b;
    if (n._parent) {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('class', 'rm-l' + n._color);
      linksEl.appendChild(p);
      n._path = p;
    }
  });

  const listEl = document.getElementById('rm-list');
  const RM_COLORS = ['#2563eb','#7c3aed','#0891b2','#059669','#ea580c','#e11d48'];
  function buildList(){
    if (!listEl) return;
    listEl.innerHTML = '';
    domains.forEach(function(d, di){
      const sec = document.createElement('div'); sec.className = 'rm-list-domain';
      const head = document.createElement('button'); head.type = 'button'; head.className = 'rm-list-head';
      const dot = document.createElement('span'); dot.className = 'rm-list-dot'; dot.style.background = RM_COLORS[di] || '#64748b';
      const tt = document.createElement('span'); tt.className = 'rm-list-t'; tt.textContent = d.title;
      const bb = document.createElement('span'); bb.className = 'rm-list-b'; bb.textContent = d.one;
      const chev = document.createElement('span'); chev.className = 'rm-list-chev'; chev.textContent = '▸';
      head.appendChild(dot); head.appendChild(tt); head.appendChild(bb); head.appendChild(chev);
      const tbox = document.createElement('div'); tbox.className = 'rm-list-topics';
      (d.children || []).forEach(function(tp){
        const tw = document.createElement('div'); tw.className = 'rm-list-topic';
        const th = document.createElement('button'); th.type = 'button'; th.className = 'rm-list-th';
        const ttl = document.createElement('span'); ttl.textContent = tp.title; ttl.style.flex = '1';
        const ch = document.createElement('span'); ch.className = 'rm-list-chev'; ch.textContent = '▸';
        th.appendChild(ttl); th.appendChild(ch);
        const cb = document.createElement('div'); cb.className = 'rm-list-concepts';
        (tp.children || []).forEach(function(c){
          const b = document.createElement('button'); b.type = 'button'; b.className = 'rm-list-concept'; b.textContent = c.title;
          b.addEventListener('click', function(){ showCard(c); });
          cb.appendChild(b);
        });
        th.addEventListener('click', function(){
          const on = !tw.classList.contains('open');
          tbox.querySelectorAll('.rm-list-topic').forEach(function(x){ x.classList.remove('open'); const cx = x.querySelector('.rm-list-chev'); if (cx) cx.textContent = '▸'; });
          tw.classList.toggle('open', on);
          ch.textContent = on ? '▾' : '▸';
        });
        tw.appendChild(th); tw.appendChild(cb); tbox.appendChild(tw);
      });
      head.addEventListener('click', function(){
        const on = !sec.classList.contains('open');
        listEl.querySelectorAll('.rm-list-domain').forEach(function(x){ x.classList.remove('open'); const cx = x.querySelector('.rm-list-head .rm-list-chev'); if (cx) cx.textContent = '▸'; });
        sec.classList.toggle('open', on);
        chev.textContent = on ? '▾' : '▸';
      });
      sec.appendChild(head); sec.appendChild(tbox); listEl.appendChild(sec);
    });
  }
  buildList();
  const cx = 450, cy = 380, R = [0, 170, 270, 350];
  const openD = new Set(), openT = new Set();
  let selected = ROOT;
  let scale = 1, tx = 0, ty = 0, drag = null, raf = null;
  const canHover = window.matchMedia && window.matchMedia('(hover:hover)').matches;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function isVisible(n){
    if (n._depth <= 1) return true;
    if (n._depth === 2) return openD.has(n._parent._id);
    return openD.has(n._parent._parent._id) && openT.has(n._parent._id);
  }
  function leaves(n){
    if (!isVisible(n)) return 0;
    const kids = (n.children || []).filter(isVisible);
    if (!kids.length) return 1;
    return kids.reduce(function(s, c){ return s + leaves(c); }, 0);
  }
  function place(n, start, span, depth){
    const a = start + span / 2;
    n._tx = cx + R[depth] * Math.cos(a);
    n._ty = cy + R[depth] * Math.sin(a);
    const kids = (n.children || []).filter(isVisible);
    if (!kids.length) return;
    const total = kids.reduce(function(s, c){ return s + leaves(c); }, 0) || 1;
    let aa = start;
    kids.forEach(function(c){
      const sp = span * leaves(c) / total;
      place(c, aa, sp, depth + 1);
      aa += sp;
    });
  }
  function targets(){
    all.forEach(function(n){ n._tx = null; n._ty = null; });
    ROOT._tx = cx; ROOT._ty = cy;
    const openList = domains.filter(function(d){ return openD.has(d._id); });
    if (openList.length === 1) {
      const open = openList[0];
      place(open, -Math.PI, Math.PI, 1);
      const others = domains.filter(function(d){ return d !== open; });
      let a = 0, step = Math.PI / (others.length || 1);
      others.forEach(function(d){ place(d, a, step, 1); a += step; });
    } else {
      const step = 2 * Math.PI / domains.length;
      let a = -Math.PI / 2 - step / 2;
      domains.forEach(function(d){ place(d, a, step, 1); a += step; });
    }
  }
  function drawLinks(){

      const r1 = Math.hypot(x1 - cx, y1 - cy);

  function esc(s){

  function closeCard(){

  }
  panel.addEventListener('click', function(e){

  layout(false);

var TERM_TIPS = {
 'Chinchilla':"🐣 人话：一条经验规律：参数量和训练数据量大约按 1:20 同步增长，单位算力最划算。\n🍰 栗子：70B 模型配约 1.4T Token；不是参数越大越好。",
 'PagedAttention':"🐣 人话：把 KV Cache 切成等宽小块、按需分配，像操作系统管内存，减少碎片。\n🍰 栗子：餐厅不再只接整桌，改成小卡座，同样面积能坐更多人。",
 'SSM':"🐣 人话：用固定大小的状态代替不断变长的注意力缓存，长序列更省。\n🍰 栗子：不把整本会议记录都带着，只带一页最新摘要。",
 'Mamba':"🐣 人话：一种 SSM 架构，训练时能并行、推理时像 RNN 一样只带固定状态。\n🍰 栗子：开会时只记摘要，不保留每句话的录音。",
 'RWKV':"🐣 人话：把 RNN 和 Transformer 结合起来的线性注意力路线。\n🍰 栗子：既有流水线的稳定，又想保留并行训练的速度。",
 'Dense':"🐣 人话：稠密模型，每次推理所有参数都参与计算，和 MoE 的“只叫醒少数专家”相对。\n🍰 栗子：每次开会全员到场，稳定但人多。",
 'Token':"🐣 人话：模型眼里的“字块”，不一定是汉字，可能是一个词、半个词甚至一个标点。\n🍰 栗子：“人工智能”可能切成“人工/智能”两块；英文 unbelievable 可能切成三块。",
 'Tokenizer':"🐣 人话：把文字切成 Token 的翻译官，切法由词表和合并规则决定。\n🍰 栗子：同一句话换一个分词器，Token 数和账单都会变。",
 '分词器':"🐣 人话：把文字切成 Token 的翻译官。\n🍰 栗子：中文一个字可能占 2~3 个字节，所以同一句话常比英文更费 Token。",
 'BPE':"🐣 人话：从单个字符开始，把最常一起出现的两块粘成一块，反复粘。\n🍰 栗子：a 和 b 老一起出现，就合并成 ab，再继续和别的块粘。",
 'OOV':"🐣 人话：词表里没有的词，模型不认识。\n🍰 栗子：生僻字、网络新词。Byte-level 用字节兜底，所以能切出来，但可能切得很碎。",
 'Embedding':"🐣 人话：把词、句子或图片变成一串数字坐标，意思相近的坐标也相近。\n🍰 栗子：“猫”和“狗”的坐标比“猫”和“汽车”更近。",
 'Logits':"🐣 人话：模型对每个候选词打的原始分，还没换算成概率。\n🍰 栗子：考试排名前的原始分，Softmax 之后才是百分比。",
 'Softmax':"🐣 人话：把一堆原始分变成概率，而且所有概率加起来等于 1。\n🍰 栗子：三个人按分数比例分 100 块，谁分高谁拿得多。",
 'Temperature':"🐣 人话：控制模型“胆子大不大”的旋钮。调低更保守，调高更爱赌冷门。\n🍰 栗子：Temperature=0 只选最有把握的词；调高后连低概率词也有机会。",
 'Top_p':"🐣 人话：只保留累计概率达到 p 的那批候选，后面的砍掉。\n🍰 栗子：从高到低排队，凑够 90% 就停，剩下 10% 不要了。",
 'Top_k':"🐣 人话：只保留分数最高的 K 个候选，不管分布陡不陡。\n🍰 栗子：全班只取前 5 名，第 6 名开始淘汰。",
 'Min_p':"🐣 人话：候选概率必须达到“最大概率 × Min_p”，太小的直接淘汰。\n🍰 栗子：第一名 0.5，Min_p=0.1，低于 0.05 的候选就别来了。",
 'Beam Search':"🐣 人话：同时保留 K 条候选路径，最后挑总分最高的一条。\n🍰 栗子：下棋不是只看一步，而是保留几种走法往后算。",
 'Seed':"🐣 人话：随机数的种子。同 seed 只锁采样，不锁硬件和部署形态。\n🍰 栗子：同一颗种子长出相似的树，但换块地（集群）样子还会变。",
 'Reasoning effort':"🐣 人话：给模型“想多久”的预算档位，不是选词参数。\n🍰 栗子：low 是快问快答，high 是让它先打草稿再答。",
 'CoT':"🐣 人话：让模型把推理步骤一步步写出来。\n🍰 栗子：数学题写“因为…所以…”，而不是只报一个答案。",
 'CoD':"🐣 人话：只留关键步骤的极简草稿，砍掉解释性废话。\n🍰 栗子：草稿纸上只写几个关键数，不写完整句子。",
 'RLHF':"🐣 人话：用人类偏好当奖励来训练模型。\n🍰 栗子：老板给两份方案打分，模型学着写老板更喜欢的那份。",
 'PPO':"🐣 人话：一种强化学习算法，RLHF 里常用来更新模型。\n🍰 栗子：演员（模型）按裁判（奖励模型）的打分调整动作。",
 'DPO':"🐣 人话：直接用“好回答/坏回答”成对数据优化，不用单独训裁判。\n🍰 栗子：老板把两份方案拍桌上：“照好的写。”",
 'SFT':"🐣 人话：用人工问答对教模型“怎么对话”，主要教格式，不负责灌新知识。\n🍰 栗子：入职培训，教它怎么回客户；公司制度要靠 RAG 查。",
 'LoRA':"🐣 人话：冻结大模型，只训练旁边的小补丁，省显存。\n🍰 栗子：不改原书，只在书页上贴便利贴。",
 'QLoRA':"🐣 人话：先把基座压成 4-bit，再贴 LoRA 补丁，让消费级显卡也能微调。\n🍰 栗子：把厚书压成电子版，再贴便利贴。",
 'PEFT':"🐣 人话：参数高效微调的统称，只动一小部分参数。\n🍰 栗子：不重刷整面墙，只补几块砖。",
 'Rank':"🐣 人话：LoRA 补丁的“容量”，决定能记下多少改动。\n🍰 栗子：本子有几页，页数越多能记的事越多。",
 'Alpha':"🐣 人话：LoRA 补丁的“音量”，通常看 alpha/rank 这个比值。\n🍰 栗子：补丁说话声音多大；声音太大容易盖过原模型。",
 'Quantization':"🐣 人话：把权重从 16 位压到 8 位或 4 位，省显存和带宽。\n🍰 栗子：把高清照片压成小图，省空间但会糊一点。",
 'PTQ':"🐣 人话：训练后量化，用一小批校准数据统计数值范围，不做梯度更新。\n🍰 栗子：考完试再按分数调整评分标准。",
 'QAT':"🐣 人话：量化感知训练，训练时就模拟低精度误差。\n🍰 栗子：平时练习就用旧秤，考试才不会被坑。",
 'NF4':"🐣 人话：一种 4-bit 量化格式，按正态分布设计刻度。\n🍰 栗子：大多数值给细刻度，离群值给粗刻度。",
 'Distillation':"🐣 人话：用大模型（老师）的输出教小模型（学生），换取推理成本。\n🍰 栗子：学霸把解题思路讲给学弟，学弟不用从零悟。",
 '蒸馏':"🐣 人话：用大模型（老师）的输出教小模型（学生），换取推理成本。\n🍰 栗子：学霸把解题思路讲给学弟；老师讲错了，学弟也会跟着错。",
 'Pruning':"🐣 人话：剪掉不重要的权重或结构。\n🍰 栗子：非结构化剪枝只是把叶子藏起来，结构化剪枝才是真锯掉树枝。",
 '剪枝':"🐣 人话：删掉不重要的权重或结构。非结构化剪枝不省时间，结构化剪枝才真省。\n🍰 栗子：把树上的枯枝剪掉；只藏叶子不锯树枝，树还是那么大。",
 'Transformer':"🐣 人话：靠注意力让词与词互相交换信息的架构。\n🍰 栗子：开会时每个人都能点名叫别人发言。",
 'Self-Attention':"🐣 人话：一句话里每个词去问其他词“你和我有多相关”，再按相关度取信息。\n🍰 栗子：“她”去找“小红”，把小红的信息拿过来。",
 'Q/K/V':"🐣 人话：Query 是搜索词，Key 是标签，Value 是内容。\n🍰 栗子：Q 是你要找的书名，K 是书脊标签，V 是书里的内容。",
 'Multi-Head':"🐣 人话：同时开多组注意力，每组看不同的关系。\n🍰 栗子：一组看语法，一组看指代，一组看位置。",
 'RoPE':"🐣 人话：用旋转角度表示位置，让注意力分数主要取决于相对距离。\n🍰 栗子：两个齿轮转的角度差，告诉模型谁在前谁在后。",
 'ALiBi':"🐣 人话：直接给远距离的注意力扣分，越远越不容易被注意。\n🍰 栗子：坐得越远，说话声音越小。",
 'LayerNorm':"🐣 人话：把每个 Token 的特征数值拉回稳定范围，防止训练爆炸。\n🍰 栗子：每道菜上桌前先调回统一咸度。",
 'RMSNorm':"🐣 人话：LayerNorm 的简化版，只按均方根缩放，少算一步均值。\n🍰 栗子：少放一道“减均值”的工序，省时间。",
 'Residual':"🐣 人话：把输入原样加回输出，让每层只学“改哪”。\n🍰 栗子：不改就原样传下去，改了就在原件上批注。",
 'FFN':"🐣 人话：每个词各自经过的小型全连接网络，负责消化信息。\n🍰 栗子：开完会回工位自己整理笔记。",
 'SwiGLU':"🐣 人话：一种带门控的激活函数，让网络自己决定放行多少特征。\n🍰 栗子：两路信息，一路当门卫，决定另一路能过多少。",
 'MoE':"🐣 人话：混合专家，每次只叫醒少数专家，省算力但不省显存。\n🍰 栗子：医院分诊，只叫相关科室，但所有科室都得占着房间。",
 'Router':"🐣 人话：决定每个 Token 去哪个专家的分诊台。\n🍰 栗子：医院导诊员。",
 'All-to-All':"🐣 人话：专家分散在不同卡上，Token 要来回搬运，是 MoE 真正的通信墙。\n🍰 栗子：病人先被送到各科室，看完再送回大厅。",
 'Capacity Factor':"🐣 人话：每个专家单步最多收多少 Token 的余量系数。\n🍰 栗子：每个科室每天放号 = 平均人数 × 1.1；号少了病人被拒，号多了医生空转。",
 'GQA':"🐣 人话：几个 Q 头共享一组 K/V，省 KV Cache。\n🍰 栗子：几个听众共用一块黑板，省黑板面积。",
 'MQA':"🐣 人话：所有 Q 头共用一组 K/V，最省但质量损失最明显。\n🍰 栗子：全班共用一块黑板，省地方但后排看不清。",
 'MLA':"🐣 人话：把 K/V 压成一个低维 latent 再缓存，省的是 KV 这笔账。\n🍰 栗子：不存整本讲义，只存摘要。",
 'Prefill':"🐣 人话：一次性处理整段输入，算力密集。\n🍰 栗子：上菜前先把整桌菜谱看一遍。",
 'Decode':"🐣 人话：一个 Token 一个 Token 往外吐，受显存带宽限制。\n🍰 栗子：边想边说。",
 'Continuous Batching':"🐣 人话：请求级进出，谁结束谁让位，新请求立刻补位。\n🍰 栗子：公交车随上随下，不用等所有人到终点。",
 'Chunked Prefill':"🐣 人话：把长 prompt 切成小块，和 Decode 混着算，避免堵住别人。\n🍰 栗子：大菜分几次下锅，别堵住整层楼。",
 'Prefix Cache':"🐣 人话：复用完全相同前缀的 KV，前缀必须逐字节一致才命中。\n🍰 栗子：同一份简历每次只改最后一段，前面的不用重读。",
 'PD 分离':"🐣 人话：把 Prefill 和 Decode 放进不同资源池，各用各的瓶颈。\n🍰 栗子：切配和炒菜分开，别抢同一口锅。",
 'Speculative Decoding':"🐣 人话：小模型先起草几个 Token，大模型一次前向并行验证。\n🍰 栗子：实习生先写草稿，老板快速批改。",
 'OOM':"🐣 人话：显存不够，程序崩了。\n🍰 栗子：桌子太小，菜摆不下。",
 'RAG':"🐣 人话：先检索资料，再让模型开卷答题。\n🍰 栗子：考试允许翻书，但书得翻对。",
 'Chunking':"🐣 人话：把长文档切成小段，方便检索。\n🍰 栗子：把一本书拆成卡片，抽到相关那几张。",
 'BM25':"🐣 人话：按关键词频率和稀有度打分的检索算法，擅长精确编号。\n🍰 栗子：找“iPhone 15 电池”，关键词越准分越高。",
 'RRF':"🐣 人话：把多路检索的名次融合，只看名次不看原始分数。\n🍰 栗子：两个榜单各排一次，按名次重新投票。",
 'Rerank':"🐣 人话：对召回结果再精排一轮，把最相关的挑出来。\n🍰 栗子：海选之后再加一轮面试。",
 'HNSW':"🐣 人话：多层捷径图的向量索引，快、召回高、吃内存。\n🍰 栗子：靠人脉网找东西，几步就找到。",
 'IVF':"🐣 人话：先聚类分桶再检索，省内存但召回看 nprobe。\n🍰 栗子：先判断东西在哪个书架区，只翻那几个区。",
 'GraphRAG':"🐣 人话：用实体关系图做检索，适合多跳和全局归纳。\n🍰 栗子：顺着人物关系网查案。",
 'Agentic RAG':"🐣 人话：让 Agent 自己决定查几轮、怎么改写查询、换哪个检索器。\n🍰 栗子：侦探发现线索不够就再出去查。",
 'Hallucination':"🐣 人话：模型不知道却一本正经地编。\n🍰 栗子：考试不会也硬蒙一个答案。",
 'Grounding':"🐣 人话：把回答落到图或文档的具体位置，能指出来源。\n🍰 栗子：说“第 3 页第 2 段”，而不是空口说。",
 'VLM':"🐣 人话：能看图的模型，把图像切成 patch 后当 Token 读。\n🍰 栗子：给模型配了眼睛。",
 'Patch':"🐣 人话：把图切成的小方块，每块变成一个视觉 Token。\n🍰 栗子：把照片剪成拼图块。",
 'ViT':"🐣 人话：用 Transformer 处理 patch 序列的视觉编码器。\n🍰 栗子：把图当句子读。",
 'Projector':"🐣 人话：把视觉向量翻译成语言模型能读的向量。\n🍰 栗子：同声传译。",
 'CLIP':"🐣 人话：用图文对比学习把图和文拉到同一空间，练的是全局匹配。\n🍰 栗子：给图和配文牵红线。",
 'Diffusion':"🐣 人话：从噪声一步步去噪生成图。\n🍰 栗子：从一团雾里慢慢雕出形状。",
 'CFG':"🐣 人话：无分类器引导，控制生成多贴 prompt。\n🍰 栗子：甲方盯得越紧越贴需求，但太紧会僵。",
 'U-Net':"🐣 人话：扩散模型常用的卷积主干，先缩小看全局再放大补细节。\n🍰 栗子：先看地图再走街串巷。",
 'DiT':"🐣 人话：用 Transformer 当扩散主干，方便堆参数堆数据。\n🍰 栗子：把 U-Net 换成更会堆规模的 Transformer。",
 'VAE':"🐣 人话：把图压到 latent 再解码，扩散常在 latent 空间做。\n🍰 栗子：先把图压成小抄，再从小抄还原。",
 'Latent':"🐣 人话：压缩后的中间表示。\n🍰 栗子：图的“摘要”。",
 'RVQ':"🐣 人话：残差向量量化，一层层补残差，把音频压成离散 Token。\n🍰 栗子：先画大致轮廓，再一层层补细节。",
 'VAD':"🐣 人话：语音活动检测，判断用户有没有开口。\n🍰 栗子：会议室的自动话筒。",
 'Barge-in':"🐣 人话：用户打断时立刻停止播放并回滚未播内容。\n🍰 栗子：别人一开口，你就闭嘴听。",
 'RTF':"🐣 人话：处理时长 ÷ 音频时长，小于 1 才追得上实时。\n🍰 栗子：说 1 秒的话，处理不能超过 1 秒。",
 'Benchmark':"🐣 人话：标准考卷，用来横向比较模型。\n🍰 栗子：高考真题。",
 'Contamination':"🐣 人话：考题漏进训练数据，模型背过答案。\n🍰 栗子：考前做过原题，分数自然虚高。",
 'Canary':"🐣 人话：埋在评测集里的指纹串，出现在模型输出就说明泄题。\n🍰 栗子：在考卷里夹一根彩色线。",
 'pass@k':"🐣 人话：k 次采样里至少一次通过。\n🍰 栗子：给你 k 次机会，中一次就算赢。",
 'maj@k':"🐣 人话：k 次采样取多数票。\n🍰 栗子：找 k 个人投票，少数服从多数。",
 'Rubric':"🐣 人话：评分标准，把“好不好”拆成可判定的条款。\n🍰 栗子：作文评分细则。",
 'Position Bias':"🐣 人话：裁判偏爱排在前面的答案。\n🍰 栗子：先上桌的菜更容易被夸。",
 'Kappa':"🐣 人话：扣除运气后的一致性，比单纯一致率更可信。\n🍰 栗子：两个评委一致率 80%，但随机也能到 50%，Kappa 看真正多出来的一致。",
 'Golden Set':"🐣 人话：自建的标准答案集，用来做发布门禁。\n🍰 栗子：自己封存的真题。",
 'McNemar':"🐣 人话：配对检验，只看一错一对的题。\n🍰 栗子：同一个人两次考试，只看成绩变了的题。",
 'Prompt Injection':"🐣 人话：把指令伪装成数据塞给模型，让它执行攻击者的命令。\n🍰 栗子：在快递单上写“请把仓库钥匙给我”。",
 '提示注入':"🐣 人话：把指令伪装成数据塞给模型，让它执行攻击者的命令。\n🍰 栗子：在快递单上写“请把仓库钥匙给我”。",
 'Jailbreak':"🐣 人话：用话术绕过模型的安全限制。\n🍰 栗子：哄小孩说出不该说的话。",
 '越狱':"🐣 人话：用话术绕过模型的安全限制。\n🍰 栗子：哄小孩说出不该说的话。",
 'Guardrail':"🐣 人话：模型外的拦截层，挡在输入、输出或动作之前。\n🍰 栗子：机场安检。",
 'Guardrails':"🐣 人话：模型外的拦截层。\n🍰 栗子：机场安检，金属门、行为排查、开包检查各管一段。",
 'PII':"🐣 人话：个人可识别信息，能指向具体某个人。\n🍰 栗子：姓名、身份证、手机号；年龄+邮编+职位组合也可能指到唯一的人。",
 'DLP':"🐣 人话：数据防泄露，在出口处检测并拦截敏感数据。\n🍰 栗子：公司大门口的安检机。",
 'Backdoor':"🐣 人话：权重里埋的触发器，遇到特定输入才发作。\n🍰 栗子：听到暗号才启动的隐藏程序。",
 'SLO':"🐣 人话：服务质量目标，通常写成 P99 延迟和可用性。\n🍰 栗子：承诺 99.9% 的时间能用。",
 'SLA':"🐣 人话：对外承诺的服务协议，违约可能要赔钱。\n🍰 栗子：合同里那张写清赔多少钱的纸。",
 'Error Budget':"🐣 人话：SLO 允许你失败的额度。\n🍰 栗子：一个月允许停 43 分钟，用完就冻结发布。",
 'P99':"🐣 人话：99% 的请求快于这个值。\n🍰 栗子：100 个人排队，第 99 个人的等待时间。",
 'Backpressure':"🐣 人话：下游撑不住就快速拒绝，而不是让队列无限变长。\n🍰 栗子：餐厅满了就停止放号，别让队伍排到街上。",
 'Idempotency':"🐣 人话：同一个请求重复执行，结果一样。\n🍰 栗子：按一次电梯按钮和按十次，电梯都只来一趟。",
 'SSE':"🐣 人话：服务器单向推流，适合持续吐 Token。\n🍰 栗子：电台广播，你只能听。",
 'WebSocket':"🐣 人话：双向长连接，适合语音这种要同时上传和下发的场景。\n🍰 栗子：打电话，双方都能说。",
 '灰度':"🐣 人话：先放一小部分流量给新版本，确认没问题再全量。\n🍰 栗子：新菜先给 5% 的客人试吃。",
 '多租户':"🐣 人话：多个客户共用一套系统，但数据和配额要隔离。\n🍰 栗子：一栋楼多个公司，水电要分表。",
 'MFU':"🐣 人话：实际算力利用率，实际吞吐除以硬件标称峰值。\n🍰 栗子：健身房年卡，真正练的时间占多少。",
 'ZeRO':"🐣 人话：把优化器状态、梯度、参数按卡分片，用通信换显存。\n🍰 栗子：四个人合买一套工具，每人放一部分。",
 'Activation Checkpointing':"🐣 人话：只存少量激活，反向时重算，用算力换显存。\n🍰 栗子：草稿只留几页，需要时再重算。",
 'Gradient Accumulation':"🐣 人话：小 batch 攒几次梯度再更新一次，模拟大 batch。\n🍰 栗子：零钱攒够一笔再存银行。",
 'Tensor Parallel':"🐣 人话：切单个矩阵，通信密集，尽量留在机内。\n🍰 栗子：一道菜分给几个人各切一部分。",
 'Pipeline Parallel':"🐣 人话：按层切分到不同机器，像流水线。\n🍰 栗子：每人负责一道工序。",
 'Data Parallel':"🐣 人话：每张卡一份完整模型，切 batch。\n🍰 栗子：同样的教材复印多份，每人教一批学生。",
 'Expert Parallel':"🐣 人话：专家分到不同卡，代价是 All-to-All 流量。\n🍰 栗子：不同科室分散在不同楼层。",
 'Corpus':"🐣 人话：训练语料，模型读过的所有文本。\n🍰 栗子：一个人从小到大读过的书。",
 'MinHash':"🐣 人话：用一组签名估计两个集合的相似度。\n🍰 栗子：给每本书抽几页代表作，撞页多就说明内容像。",
 'LSH':"🐣 人话：把相似签名分到同一个桶，减少两两比较。\n🍰 栗子：按开头几个字把卡片分抽屉。",
 'Jaccard':"🐣 人话：交集 ÷ 并集，衡量两个集合有多像。\n🍰 栗子：两本书共同页数 ÷ 总页数。",
 'Data Flywheel':"🐣 人话：用户反馈 → 训练 → 更好的产品 → 更多用户，越转越快。\n🍰 栗子：越用越聪明，越聪明越多人用。",
 '飞轮':"🐣 人话：用户反馈 → 训练 → 更好的产品，形成正循环。\n🍰 栗子：越用越聪明，越聪明越多人用。",
 'Alignment Tax':"🐣 人话：对齐带来的能力或风格损失。\n🍰 栗子：为了礼貌，说话变得四平八稳，锐度没了。",
 '对齐税':"🐣 人话：对齐改变输出分布后，部分能力和风格多样性下降的代价。\n🍰 栗子：为了礼貌，说话变得四平八稳，锐度没了。",
 'Sycophancy':"🐣 人话：讨好用户、顺着用户说，甚至用户一反问就改口。\n🍰 栗子：你说 1+1=3，它也点头。",
 'Knowledge Debt':"🐣 人话：知识债，代码或文档没写清，后人反复踩坑。\n🍰 栗子：没人知道这个模块为什么这么写。",
 'SDD':"🐣 人话：规格驱动开发，先写清规格再让 AI 写代码；人定验收，AI 实现，门禁验证。\n🍰 栗子：先画图纸再施工。",
 'Vibe Coding':"🐣 人话：凭感觉编码，说一句话让 AI 写，错了再改，SDD 的反面。\n🍰 栗子：没图纸先施工，看着不对就拆了重盖。",
 'AGENTS.md':"🐣 人话：仓库级指令文件，项目怎么跑、哪里不许动、提交规范，每个 AI 和新人都读。\n🍰 栗子：贴在车间门口的员工手册。",
 'Spec Kit':"🐣 人话：GitHub 开源的 SDD 工具包，把流程固化成命令链：立宪法→写规格→定方案→拆任务→实现。\n🍰 栗子：给施工队配好的标准工序手册。",
 'Kiro':"🐣 人话：AWS 的规格驱动 IDE，每个功能生成需求、设计、任务三份文件，验收标准写在需求里。\n🍰 栗子：图纸、施工方案、工单三件套。",
 'OpenSpec':"🐣 人话：轻量 SDD 框架，每次变更一个提案，做完归档，适合老项目增量改动。\n🍰 栗子：旧楼改造，一次只报批一间房。",
 'EARS':"🐣 人话：写验收条件的句式：当〔条件〕，系统应当〔响应〕，可测试、可勾选。\n🍰 栗子：当用户连续输错三次密码，系统应当锁定账户十五分钟。",
 'OPSX':"🐣 人话：OpenSpec 的流式工作流：propose→apply→archive，规格按增删改增量描述。\n🍰 栗子：旧楼改造先报批，施工完再把图纸归档进总图。",

 'Harness':"🐣 人话：模型外的执行框架，负责循环、工具、权限和记录。\n🍰 栗子：给实习生配的工牌、审批流和操作记录仪。",
 'MCP':"🐣 人话：模型与工具之间的标准接口。\n🍰 栗子：USB-C 接口，工具即插即用。",
 'Function Calling':"🐣 人话：模型输出结构化的工具调用请求。\n🍰 栗子：填一张“我要调用哪个工具、参数是什么”的申请表。",
 'ReAct':"🐣 人话：想一步、做一步、看结果，再想下一步。\n🍰 栗子：边查地图边走路。",
 'Plan-and-Execute':"🐣 人话：先列完整计划，再一步步执行。\n🍰 栗子：先写行程表再出门。",
 'Reflexion':"🐣 人话：做完自查，发现错误打回重做。\n🍰 栗子：交卷前自己检查一遍。",
 'Workflow':"🐣 人话：流程写死在代码里，模型只负责其中的步骤。\n🍰 栗子：流水线作业。",
 'Orchestrator':"🐣 人话：中心调度者，负责拆任务、派活、收结果。\n🍰 栗子：包工头。",
 'Handoff':"🐣 人话：把任务、进度、注意事项交接给下一个 Agent。\n🍰 栗子：换班时把工作交代清楚。"
, 'token':"🐣 人话：模型眼里的字块，可能是一个词、半个词或一个标点。\n🍰 栗子：中文「充电桩」常常要拆成两三个 token。",
 '上下文窗口':"🐣 人话：模型一次能看见多少字。看不见的部分等于不存在。\n🍰 栗子：桌面只有这么大，摊满就放不下新纸了。",
 '提示词':"🐣 人话：你写给它看的那段话，包括要求、资料和例子。\n🍰 栗子：给新人的交接说明。",
 '结构化输出':"🐣 人话：要求模型按固定字段返回，而不是写一段话。\n🍰 栗子：填表格，而不是写作文。",
 '函数调用':"🐣 人话：模型输出一张「要调用哪个工具、参数是什么」的申请表。\n🍰 栗子：它填单子，你的代码去执行。",
 '幻觉':"🐣 人话：模型不知道却答得像知道，或者拿到资料却总结歪了。\n🍰 栗子：把见过的句式套到不存在的事实上。",
 '事实型幻觉':"🐣 人话：它根本没有这条信息，却给了具体数字。\n🍰 栗子：说停车场有 200 个桩，实际 12 个。",
 '忠实型幻觉':"🐣 人话：资料给了，它总结时说歪了。\n🍰 栗子：原文写「仅限工作日」，它答成「随时可用」。",
 '中间失忆':"🐣 人话：放在超长上下文正中间的信息，模型最容易忽略。\n🍰 栗子：一摞纸里最下面那几张，翻不到。",
 '切块':"🐣 人话：把长文档切成小段，一段一段检索。\n🍰 栗子：书太厚，先拆成卡片。",
 '向量':"🐣 人话：把文字变成一串数字，意思相近的数字也相近。\n🍰 栗子：把每句话放到一张地图上，近邻就是近义。",
 '向量检索':"🐣 人话：按「意思像不像」找资料，而不是按字面匹配。\n🍰 栗子：搜「保存没反应」也能找到「提交失败」。",
 '重排':"🐣 人话：先粗捞出几十条，再用更贵的模型重新排序。\n🍰 栗子：海选之后进复试。",
 '混合检索':"🐣 人话：关键词和向量两路一起搜，再合并。\n🍰 栗子：两条腿走路，一条怕同义词，一条怕精确型号。",
 'Agent':"🐣 人话：模型不只说话，还能调工具、看结果、决定下一步。\n🍰 栗子：给它手和眼睛，也要给它刹车。",
 '工具调用':"🐣 人话：模型请求执行一个外部动作，比如改路线、查天气。\n🍰 栗子：点菜单，厨房去做。",
 '幂等':"🐣 人话：同一个请求重复发多次，只生效一次。\n🍰 栗子：电梯按钮按十下，也只来一次。",
 '间接提示注入':"🐣 人话：恶意指令来自网页、评论、文档这些被读进来的内容。\n🍰 栗子：不是你让它干的，是它读到的东西让它干的。",
 '护栏':"🐣 人话：在输入、模型、输出三处设卡，拦住不该发生的事。\n🍰 栗子：前两道是礼貌，第三道才是门锁。",
 '出域':"🐣 人话：数据离开你能控制的范围，比如发给第三方模型。\n🍰 栗子：把客户名单带出了公司。",
 '前缀缓存':"🐣 人话：每次请求开头都一样的那段，只算一次钱和一次计算。\n🍰 栗子：开场白录好音，不用每次重说。",
 'KV Cache':"🐣 人话：模型读过的内容算出的中间结果，存下来好生成下一个词。\n🍰 栗子：草稿纸上的演算过程，不擦掉就能接着算。",
 '显存':"🐣 人话：显卡上那块内存，模型权重和缓存都住在里面。\n🍰 栗子：工作台，东西摆满了就干不了活。",
 '显存带宽':"🐣 人话：每秒能从显存里搬多少数据，常常比算力更卡脖子。\n🍰 栗子：仓库再大，叉车慢也白搭。",
 '批处理':"🐣 人话：把多个请求凑成一批一起算，摊薄开销。\n🍰 栗子：攒够一车再发车。",
 '首字延迟':"🐣 人话：用户说完到看见第一个字要等多久，行业里叫 TTFT。\n🍰 栗子：按下开关到灯亮的那一下。",
 'TTFT':"🐣 人话：首字延迟，用户感知最强的那一段。\n🍰 栗子：水龙头拧开后第一滴水。",
 'TPOT':"🐣 人话：之后每多出一个字的平均耗时，决定「读起来顺不顺」。\n🍰 栗子：水流的粗细。",
 '量化':"🐣 人话：把每个数的精度压低，省显存也省带宽。\n🍰 栗子：照片从原图压成 JPG，文件小一半。",
 '灾难性遗忘':"🐣 人话：在新数据上训练，把原来的本事忘了。\n🍰 栗子：突击学了法语，英语口音都跑了。",
 '路由':"🐣 人话：按问题难度把请求分给不同的模型。\n🍰 栗子：小病去社区医院，大病去三甲。",
 '端侧':"🐣 人话：模型直接跑在车机、手机这种设备上，不依赖网络。\n🍰 栗子：随身带的工具，不用回厂里借。",
 '车规':"🐣 人话：汽车行业的安全与可靠性标准，比消费电子严得多。\n🍰 栗子：手机上崩一次重启，车上崩一次是事故。",
 'OTA':"🐣 人话：远程给车机推送升级包。\n🍰 栗子：手机系统更新，只是这台车在路上跑。",
 '回滚':"🐣 人话：出问题时退回到上一个正常版本。\n🍰 栗子：踩空了能退回上一级台阶。",
 '黄金集':"🐣 人话：一小批人工确认过标准答案的样例，改动前后都要跑。\n🍰 栗子：每次换零件都拿同一把尺子量。",
 '微调':"🐣 人话：用你自己的数据继续训练，让它更像你们的说话方式。\n🍰 栗子：入职培训，教的是规矩不是知识。",
 '合成数据':"🐣 人话：用模型生成训练数据，替代拿不到的真实数据。\n🍰 栗子：没真题就自己出模拟题。",
 '数据飞轮':"🐣 人话：用户反馈变成训练数据，产品变好，吸引更多用户。\n🍰 栗子：越用越聪明，越聪明越多人用。",
 '多模态':"🐣 人话：模型同时处理文字、图片、语音、视频。\n🍰 栗子：不光听你说，还能看你拍的照片。",
 '扩散模型':"🐣 人话：从一团噪声开始，一步步去掉噪声，最后出现一张图。\n🍰 栗子：雾里雕花，越雕越清。",
 'OCR':"🐣 人话：把图片里的文字识别成可读文本。\n🍰 栗子：把路牌上的「80」读出来。",
 '推理模型':"🐣 人话：回答前先在心里写一段推理，再给结论的模型。\n🍰 栗子：先打草稿再交卷。",
 '测试时扩展':"🐣 人话：不重新训练，只在推理时多花算力换准确率。\n🍰 栗子：多想一会儿再答。",
 '思考预算':"🐣 人话：给模型一个「最多想多久」的上限。\n🍰 栗子：考试时间到了必须交卷。",
 '投机解码':"🐣 人话：小模型先猜几个词，大模型一次性验证。\n🍰 栗子：实习生先起草，主管只审不改。",
 '分离部署':"🐣 人话：把读输入和写输出拆到两组机器上，各用各的长处。\n🍰 栗子：点单和做菜分两个窗口。",
 '上下文工程':"🐣 人话：决定这次请求里到底放进去哪几样东西、放多少、按什么顺序。\n🍰 栗子：出门前按行程装包，不是全塞进去。",
 '记忆':"🐣 人话：模型本身不记事，所有「它记得我」都是外面替它存的。\n🍰 栗子：便利贴加抽屉。",
 '沙箱':"🐣 人话：把代码关进一个有边界的盒子里跑，出错也伤不到外面。\n🍰 栗子：泳池里练游泳。",
 '代码审查':"🐣 人话：提交的改动必须有人或流程看一遍再合入。\n🍰 栗子：出门前照镜子。",
 '技术债':"🐣 人话：为赶进度留下的将就，以后要连本带利还。\n🍰 栗子：先用胶带粘上，迟早要拆开重装。",
 '开源模型':"🐣 人话：权重可以下载、自己部署的模型。\n🍰 栗子：买了菜自己回家做。",
 '私有化部署':"🐣 人话：把模型装进客户自己的机房，数据不出门。\n🍰 栗子：请厨师到家里做。",
 '模型权重':"🐣 人话：模型学到的那些数字，几亿到几千亿个。\n🍰 栗子：菜谱的分量，精确到克。",
 '过拟合':"🐣 人话：把训练样本背下来了，换个题就不会。\n🍰 栗子：只背答案不理解。",
 '榜单污染':"🐣 人话：评测题目泄露进了训练数据，分数虚高。\n🍰 栗子：考前拿到了原题。",
 'LLM-as-Judge':"🐣 人话：让另一个模型来打分，比人工便宜，但会有偏好。\n🍰 栗子：请另一个老师批卷，标准未必一样。",
 'A/B 测试':"🐣 人话：把用户随机分两组，各看一个版本，比数据。\n🍰 栗子：两条街同时卖两种口味。",
 'SOP':"🐣 人话：整车开始批量生产的节点，错过了要等下一个车型年。\n🍰 栗子：开学日期，晚一天就得等一年。",
 '前装':"🐣 人话：车出厂时就装好的软件，不是后装的 App。\n🍰 栗子：装修时嵌进墙里的柜子。",
 'SoC':"🐣 人话：车机里那颗芯片，CPU、GPU、NPU 都在一起，还要分给多个功能。\n🍰 栗子：一间小厨房，几家人合用。",
 '预训练':"🐣 人话：在海量文字上反复做「遮住下一个词猜一猜」，把语言规律沉进参数里。\n🍰 栗子：读了万卷书，还没上过一天班。",
 '算子':"🐣 人话：模型计算里的一个个基本动作，比如矩阵乘、激活函数。\n🍰 栗子：菜谱里的「切丝」「过油」，缺一道这道菜就做不出来。",
 '工具链':"🐣 人话：把模型跑起来所需要的一整套编译、调试、部署工具。\n🍰 栗子：有发动机不等于有车，还得有变速箱和方向盘。",
 'PR':"🐣 人话：pull request，一次提交的改动请求，合入前要有人或流程看一遍。\n🍰 栗子：交上去等审批的报销单。",
 'POI':"🐣 人话：地图上的一个地点，商场、停车场、充电站都算。\n🍰 栗子：地图上的那颗小圆钉。",
 'TTS':"🐣 人话：文本转语音，把字念出来。\n🍰 栗子：把稿子交给播音员。",
 'OBD':"🐣 人话：车上的诊断接口，能读取故障码和车辆状态。\n🍰 栗子：车的体检插口。",
 '参数总量':"🐣 人话：模型里有多少个数，通常按「亿」或「B（十亿）」算。\n🍰 栗子：一本书有多少个字，字数多不等于写得好。",
 '每字耗时':"🐣 人话：第一个字出来之后，后面每多一个字的平均耗时，行业里叫 TPOT，决定读起来顺不顺。\n🍰 栗子：水流的粗细。",
 '温度':"🐣 人话：控制输出随机程度的旋钮，调低更稳、调高更散。\n🍰 栗子：同一个人，低了背书，高了freestyle。",
 'RLVR':"🐣 人话：只在有标准答案的任务上用奖励训练，比如数学和代码。\n🍰 栗子：有标准答案的题，对就是对。",
 '对齐':"🐣 人话：让模型的回答符合人类偏好和规则，代价是可能变得四平八稳。\n🍰 栗子：培训太久，连玩笑都不敢开了。",
 '多智能体':"🐣 人话：把活拆给几个各管一段的模型，互相交接。\n🍰 栗子：三个人接力送快递，最慢的那个决定总时长。",
 '工作流':"🐣 人话：步骤写死在代码里，模型只负责其中某一步。\n🍰 栗子：流水线作业，模型只是其中一个工位。",
 '交接':"🐣 人话：把任务、输入位置、验收标准、禁止事项交代给下一棒。\n🍰 栗子：换班时的那张交班单。",
 '并行':"🐣 人话：把一份活切开同时做，省时间但要多花机器。\n🍰 栗子：两个人一起洗碗，但得有两个水池。",
 '槽位':"🐣 人话：把一句话拆成「目的地是什么、什么时候去」这样的固定格子。\n🍰 栗子：填表，格子对不上就填不进去。",
 '召回率':"🐣 人话：该找到的东西里，实际找到了几成。\n🍰 栗子：十个该来的只来了七个，召回率七成。",
 '精确率':"🐣 人话：找回来的东西里，真正有用的有几成。\n🍰 栗子：捞上来十条，三条有用。",
 '索引':"🐣 人话：为快速查找预先建好的目录结构。\n🍰 栗子：书的目录页，不用翻完整本。",
 '图谱':"🐣 人话：把实体和它们之间的关系存成一张网。\n🍰 栗子：商场连楼层，楼层连商户，商户连充电桩。",
 '采样':"🐣 人话：按概率从候选词里挑一个，而不是每次都要最高的那个。\n🍰 栗子：同一个问题问两次，答案不一样。",
 '评测':"🐣 人话：用一批有标准答案的题，量它在变好还是变差。\n🍰 栗子：同一张卷子反复考。",
 '合规':"🐣 人话：满足法律、监管和合同里对数据使用的约束。\n🍰 栗子：车主录音能不能拿去训练，得先问法务。",
 '脱敏':"🐣 人话：把能定位到具体人的字段去掉或打码。\n🍰 栗子：手机号中间四位变成星号。",
 '许可证':"🐣 人话：开源模型的使用条款，决定你能不能用它做生意。\n🍰 栗子：写着「仅限研究」，就别拿去卖。",
 '闭源':"🐣 人话：只给接口不给权重的模型，只能调用，不能自己部署。\n🍰 栗子：饭店只卖菜，不给菜谱。",
 '熔断':"🐣 人话：下游连续失败时直接掐断调用，避免把整个系统拖死。\n🍰 栗子：保险丝，烧断保整条线路。",
 '错误预算':"🐣 人话：允许系统出错的那点额度，用超了就冻结发布。\n🍰 栗子：每月停电额度，用完了就少折腾。",
 '归因':"🐣 人话：把一个指标的变化，追到具体是哪次改动上。\n🍰 栗子：账对不上，得找出是哪一笔。",
 '降级':"🐣 人话：主要功能撑不住时，退到一个更差但还能用的版本。\n🍰 栗子：电梯坏了，走楼梯。",
 '私有化':"🐣 人话：把模型装进客户自己的机房，数据不出他的门。\n🍰 栗子：请厨师到家里做菜。",
 '按台授权':"🐣 人话：按装车台数收一次性的软件授权费。\n🍰 栗子：卖软件光盘，一台车一张。",
 '人工确认':"🐣 人话：关键动作由人来点最后一下，模型只能建议。\n🍰 栗子：手术机器人，下刀还得医生踩脚踏。",
 '连续批处理':"🐣 人话：谁的请求先算完谁先出，新来的立刻补进空位。\n🍰 栗子：排队买饭，前面的人走了马上叫下一个。",
 'checkpoint':"🐣 人话：训练中途存一份快照，崩了从快照接着跑。\n🍰 栗子：游戏存档。",
 'temperature':"🐣 人话：控制输出随机程度的旋钮，调低更稳、调高更散。\n🍰 栗子：同一个人，低了背书，高了自由发挥。",
 'reward hacking':"🐣 人话：模型学会讨好打分的裁判，而不是把事真的做对。\n🍰 栗子：考试押题而不是学懂。",
 'alignment tax':"🐣 人话：对齐之后，某些能力或风格多样性会掉一点的代价。\n🍰 栗子：话说得太周全，锐气就没了。",

var TERM_TIP_LIST = Object.keys(TERM_TIPS).sort(function(a,b){return b.length-a.length});
function annotateTerms(){
  var root=document.querySelector('#article .body');if(!root)return;
  var seen={};
  var anchors=root.querySelectorAll('a');
  for(var i=0;i<anchors.length;i++){
    var a=anchors[i],t=a.textContent.trim();
    if(TERM_TIPS[t]&&!seen[t]){a.classList.add('term-tip');a.setAttribute('data-tip',TERM_TIPS[t]);a.setAttribute('tabindex','0');seen[t]=1;}
  }
  function isWordChar(ch){return /[A-Za-z0-9_]/.test(ch)}
  function findTerm(text,term){
    var idx=text.indexOf(term);
    while(idx>=0){
      var before=idx>0?text.charAt(idx-1):'';
      var after=idx+term.length<text.length?text.charAt(idx+term.length):'';
      var startOk=!/^[A-Za-z0-9_]/.test(term)||!before||!isWordChar(before);
      var endOk=!/[A-Za-z0-9_]$/.test(term)||!after||!isWordChar(after);
      if(startOk&&endOk)return idx;
      idx=text.indexOf(term,idx+1);
    }
    return -1;
  }
  for(var ti=0;ti<TERM_TIP_LIST.length;ti++){
    var term=TERM_TIP_LIST[ti];
    if(seen[term])continue;
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),node;
    while((node=walker.nextNode())){
      var p=node.parentNode;if(!p)continue;
      if(p.closest('a,code,pre,summary,h1,h2,h3,.fig,.tbl,.code,.term-tip'))continue;
      var idx=findTerm(node.nodeValue,term);
      if(idx<0)continue;
      var span=document.createElement('span');
      span.className='term-tip';span.textContent=term;span.setAttribute('data-tip',TERM_TIPS[term]);span.setAttribute('tabindex','0');
      var frag=document.createDocumentFragment();
      if(idx>0)frag.appendChild(document.createTextNode(node.nodeValue.slice(0,idx)));
      frag.appendChild(span);
      if(idx+term.length<node.nodeValue.length)frag.appendChild(document.createTextNode(node.nodeValue.slice(idx+term.length)));
      p.replaceChild(frag,node);
      seen[term]=1;
      break;
    }
  }
}
var _render=render;
render=function(id,btn){_render(id,btn);if(id!=='exam'){annotateTerms();}};
render('intro',side.querySelector('.nav'));
</script>
<script>
(function () {
  function pad(n) { return ("0" + n).slice(-2); }
  function fmt(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function show(text) {
    var b = document.querySelector(".badge");
    if (b) b.textContent += " · 最后保存：" + text;
  }
  fetch(location.href, { cache: "no-store" }).then(function (r) {
    var lm = r.headers.get("Last-Modified");
    if (lm) show(fmt(new Date(lm)));
    else show("无法获取真实保存时间（当前打开方式下浏览器不提供）");
  }).catch(function () {
    show("无法获取真实保存时间（当前打开方式下浏览器不提供）");
  });
})();
</script>
