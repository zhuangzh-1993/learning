  { q: "TTFT 指什么？", o: ["A. 从请求发出到收到第一个 token 的时间", "B. 生成阶段每个 token 的间隔", "C. 模型训练的总时长", "D. 模型文件加载的时间", "E. 模型生成完全部 token 的总时间"], a: [0], e: "单选。答案 A。B 错误：那是 TPOT；C 错误：那是训练成本指标；D 错误：加载只是一次性启动开销；E 错误：那是总生成时间，不是首字。A：TTFT 包含排队与 Prefill，是首字体感的核心指标。", t: 6, n: {"A": "TTFT 包含排队与 Prefill，是首字体感的核心指标。", "B": "那是 TPOT。", "C": "那是训练成本指标。", "D": "加载只是一次性启动开销。", "E": "那是总生成时间，不是首字。"} },
  { q: "下列有助于缓解大模型幻觉的做法有？", o: ["A. 允许模型回答不知道而不是强行编造", "B. 用 RAG 提供可溯源的参考资料", "C. 降低 temperature 并要求模型标注不确定性", "D. 要求回答引用检索到的原文", "E. 对高风险输出增加事实校验环节"], a: [0, 1, 2, 3, 4], e: "以上均为业界常用缓解手段，组合使用效果更好；但幻觉只能缓解，无法根除。", t: 4, n: {"A": "允许它说不知道，而不是硬编", "B": "RAG 给出可溯源的参考资料", "C": "降温度并要求标注不确定性", "D": "强制引用检索到的原文", "E": "高风险输出加一道事实校验"} },
  { q: "关于 Agent 的 ReAct 模式，正确的有？", o: ["A. ReAct 依赖工具调用能力", "B. ReAct 模式下模型无法利用外部信息", "C. 将推理（Thought）与行动（Action）交替进行", "D. 行动结果作为观察反馈回下一步推理", "E. ReAct 要求模型一次性输出全部计划且不再修改"], a: [0, 2, 3], e: "ReAct 是推理与行动交替：每步看工具返回再决定下一步，不是一次把计划写死。答案 A、C、D。B 错误：ReAct 正是靠工具返回的外部信息推进；E 错误：那是「先计划再执行」，ReAct 每步都可能改主意。", t: 3, n: {"B": "ReAct 正是靠工具返回的外部信息推进", "E": "那是「先计划再执行」，ReAct 每步都可能改主意", "A": "ReAct 依赖工具调用", "C": "推理与行动交替进行", "D": "观察结果回灌到下一步推理"} },
  { q: "RAG 的基本流程是什么？", o: ["A. 先微调模型，再让模型凭记忆回答", "B. 先训练一个分类器，再生成图片", "C. 先从知识库检索相关片段，再让模型基于片段回答", "D. 只靠模型参数里的记忆回答", "E. 先把答案写死，再补检索日志"], a: [2], e: "单选。答案 C。A 错误：那更像微调，不是 RAG；B 错误：与 RAG 的检索生成链路无关；D 错误：那正是 RAG 想避免的做法；E 错误：顺序反了，RAG 先检索后生成。C：RAG 是开卷考试：先查资料，再回答。", t: 2, n: {"A": "那更像微调，不是 RAG。", "B": "与 RAG 的检索生成链路无关。", "C": "RAG 是开卷考试：先查资料，再回答。", "D": "那正是 RAG 想避免的做法。", "E": "顺序反了，RAG 先检索后生成。"} },
  { q: "限流（rate limiting）的作用是什么？", o: ["A. 控制单位时间内的请求量，保护服务", "B. 提高模型精度", "C. 增加上下文长度", "D. 减少显存占用", "E. 限制单个请求的最大 token 数"], a: [0], e: "单选。答案 A。B 错误：限流不改变模型能力；C 错误：窗口由模型决定；D 错误：限流只是少接请求；E 错误：那是 max_tokens 或长度限制。A：限流要返回明确返回码与 Retry-After。", t: 12, n: {"A": "限流要返回明确返回码与 Retry-After。", "B": "限流不改变模型能力。", "C": "窗口由模型决定。", "D": "限流只是少接请求。", "E": "那是 max_tokens 或长度限制。"} },
  { q: "下列属于大模型评测基准的有？", o: ["A. 把训练集上的 loss 曲线当作公开评测基准", "B. GSM8K", "C. HumanEval", "D. ImageNet 原始分类任务", "E. MMLU"], a: [1, 2, 4], e: "评测基准要公开、可复现、测下游能力；训练损失与 ImageNet 分类都不算。答案 B、C、E。D是图像分类经典数据集（2012 年），不是大模型语言评测基准；A错误：训练损失是内部指标，既不公开也不反映下游能力，不能当基准用。", t: 0, n: {"A": "训练损失是内部指标，既不公开也不反映下游能力，不能当基准用", "D": "ImageNet 是视觉分类基准，不测语言能力", "B": "数学推理基准", "C": "代码生成基准", "E": "综合知识基准"} },
  { q: "关于 Function Calling（工具调用），正确的有？", o: ["A. 函数定义会影响模型选择哪个工具", "B. 模型可以直接修改数据库", "C. 模型输出结构化的参数而非直接执行", "D. 实际执行由外部程序完成", "E. 工具定义写进系统提示后，模型会自己发起 HTTP 请求并回填结果"], a: [0, 2, 3], e: "模型只产出结构化的调用意图与参数，执行、权限与重试都在外部程序。答案 A、C、D。B错误：模型只产出调用意图与参数，执行与权限控制在外部程序；E错误：模型只产出结构化参数，真正的执行由宿主程序完成。", t: 3, n: {"B": "模型只产出调用意图与参数，执行与权限控制在外部程序", "E": "模型只产出结构化参数，真正的执行由宿主程序完成", "A": "函数定义会影响模型选哪个工具", "C": "模型输出结构化参数，不直接执行", "D": "实际执行由外部程序完成"} },
  { q: "LLM 的 token 与字符的关系，正确的有？", o: ["A. token 是模型处理文本的最小单位", "B. 英文常用词通常一个 token", "C. 中文字符数与 token 数一一对应", "D. 一个汉字通常不是固定一个 token", "E. 空格与换行不占 token，排版可以随便加"], a: [0, 1, 3], e: "token 是切分单位，不等于字符：中文常 1~2 token，空白也计费。答案 A、B、D。C错误：中文经 BPE 切分，token 数通常与字符数不等；E错误：空格与换行同样被编码并计费，长空白会把 token 预算吃掉。", t: 1, n: {"A": "token 是模型处理文本的最小单位", "B": "高频英文词多数就是一个 token", "D": "常用字可能整字成 token，生僻字被拆碎", "C": "中文经 BPE 切分，token 数通常与字符数不等", "E": "空格与换行同样被编码并计费，长空白会把 token 预算吃掉"} },
  { q: "下列属于大模型常见安全风险的有？", o: ["A. 显卡驱动版本与 CUDA 不匹配", "B. 训练数据投毒", "C. 梯度消失", "D. 提示词注入", "E. 越狱（Jailbreak）"], a: [1, 3, 4], e: "安全风险看的是模型被滥用或产出有害内容这一面：投毒、注入、越狱都在其中。答案 B、D、E。A 错误：那是部署环境问题，不属于模型安全风险；C 错误：梯度消失是训练问题，不是内容安全风险。", t: 5, n: {"A": "那是部署环境问题，不属于模型安全风险", "C": "梯度消失是训练问题，不是内容安全风险", "B": "训练数据投毒", "D": "提示词注入", "E": "越狱"} },
  { q: "大模型评测基准（benchmark）的核心作用是什么？", o: ["A. 证明模型在自家业务上一定好用", "B. 替代人工验收与线上监控", "C. 直接决定模型 API 的价格", "D. 只要有公开题集，就不需要自建业务评测集", "E. 用统一的题集和指标，横向比较模型在某类能力上的水平"], a: [4], e: "单选。答案 E。A 错误：基准测的是通用能力，业务分布不同，不能直接保证好用；B 错误：基准只是初筛，验收还要靠业务评测与线上指标；C 错误：价格由供应商定价与推理成本决定，与榜单分数没有直接关系；D 错误：公开题集不能替代业务题集，分布与判据都不同。E：统一题集与统一指标才有可比性，这是基准的定义。", t: 0, n: {"A": "基准测的是通用能力，业务分布不同，不能直接保证好用。", "B": "基准只是初筛，验收还要靠业务评测与线上指标。", "C": "价格由供应商定价与推理成本决定，与榜单分数没有直接关系。", "D": "公开题集不能替代业务题集，分布与判据都不同。", "E": "统一题集与统一指标才有可比性，这是基准的定义。"} },
  { q: "下列关于开源模型生态的说法，正确的有？", o: ["A. 开源协议对商用可能有限制条款", "B. 开放权重意味着训练数据也随之公开", "C. 开放权重等于可随意改名再发行", "D. Llama、Qwen、DeepSeek 等系列开放权重", "E. 开放权重模型可以私有化部署"], a: [0, 3, 4], e: "开放权重不等于公开训练数据或可随意再发行，许可证与私有化部署是两件事。答案 A、D、E。C错误：多数许可证要求保留署名或限制再分发方式；B错误：权重与训练数据是两件事，多数开放权重模型并不公开语料。", t: 7, n: {"C": "多数许可证要求保留署名或限制再分发方式", "B": "权重与训练数据是两件事，多数开放权重模型并不公开语料", "A": "开源协议对商用可能有限制条款", "D": "Llama、Qwen、DeepSeek 都开放权重", "E": "开放权重可以私有化部署"} },
  { q: "大模型应用中 Guardrails（护栏）的作用包括？", o: ["A. 提升模型预训练速度", "B. 拦截违规或有害输出", "C. 校验结构化输出格式", "D. 替代对齐训练，让模型从参数层面不再产生有害输出", "E. 防止模型泄露系统提示词"], a: [1, 2, 4], e: "护栏是推理侧的运行时检查：拦输出、校格式、防泄露，不改参数，也替代不了对齐训练。答案 B、C、E。A错误：护栏作用于推理输入输出侧，与预训练无关；D错误：护栏是运行时拦截，不改模型参数，也替代不了对齐训练。", t: 5, n: {"A": "护栏作用于推理输入输出侧，与预训练无关", "D": "护栏是运行时拦截，不改模型参数，也替代不了对齐训练", "B": "拦截违规或有害输出", "C": "校验结构化输出的格式", "E": "防止系统提示词被套出来"} },
  { q: "关于大模型推理时的 batching，正确的有？", o: ["A. batching 可以显著提升 GPU 利用率", "B. batch 越大，单请求延迟跟着下降", "C. batching 会改变每个请求的输出内容", "D. Continuous Batching 允许请求随时加入与退出批次", "E. 静态 batching 中短请求会等待同批最长请求"], a: [0, 3, 4], e: "batching 用吞吐换延迟：同批请求共享一次权重搬运，利用率上去；batch 越大排队与单请求延迟越差。答案 A、D、E。B 错误：batch 增大会推高排队与计算竞争，延迟通常上升；C 错误：批处理只影响调度，不改变采样结果。", t: 12, n: {"B": "batch 增大会推高排队与计算竞争，延迟通常上升。", "C": "批处理只影响调度，不改变采样结果", "A": "batching 显著提升 GPU 利用率", "D": "Continuous Batching 允许请求随时进出批次", "E": "静态 batching 里短请求要等最长的那个"} },
  { q: "关于 Embedding 模型的选型，合理的考量包括？", o: ["A. 只看通用榜单 C-MTEB 排名即可", "B. 在目标领域数据上评测检索效果", "C. 优先选参数量最大的，参数量越大检索效果越好", "D. 关注模型支持的最大输入长度", "E. 对比检索延迟与部署成本"], a: [1, 3, 4], e: "嵌入选型看目标领域检索效果、输入长度与延迟成本，不看通用榜排名或参数量。答案 B、D、E。A错误：通用榜单与垂直领域表现常脱节，必须业务评测；C错误：检索效果要看目标领域评测与延迟成本，参数量不是判据。", t: 2, n: {"A": "通用榜单与垂直领域表现常脱节，必须业务评测", "C": "检索效果要看目标领域评测与延迟成本，参数量不是判据", "B": "要用目标领域的真实查询去评检索效果", "D": "最大输入长度决定长文档会不会被截", "E": "延迟与部署成本是可选项的硬约束"} },
  { q: "企业构建 RAG 时文档解析的难点包括？", o: ["A. 纯文本文档解析通常比 PDF 更困难", "B. PDF 中表格结构的还原", "C. 跨页段落与页眉页脚干扰", "D. 把整份 PDF 直接转成一张长图再喂给模型，解析难题就不存在了", "E. 扫描件需要 OCR 且错误会传播"], a: [1, 2, 4], e: "PDF 解析难在版面：表格结构、跨页、页眉页脚、扫描件 OCR；纯文本最简单，转图会丢结构。答案 B、C、E。A错误：纯文本解析最简单，PDF 才是重灾区；D错误：图像化会丢结构与文字精度，读表与读字仍要版面分析与 OCR。", t: 2, n: {"A": "纯文本解析最简单，PDF 才是重灾区", "D": "图像化会丢结构与文字精度，读表与读字仍要版面分析与 OCR", "B": "PDF 里的表格结构最容易还原失败", "C": "跨页段落与页眉页脚会污染切分", "E": "扫描件先 OCR，识别错误会一路传到答案"} },
  { q: "关于大模型的思维链（CoT），正确的有？", o: ["A. CoT 会增加输出 token 与成本", "B. 让模型先输出中间推理步骤再给答案", "C. 对多步数学与逻辑任务提升明显", "D. Zero-shot CoT 只需一句“一步一步思考”触发", "E. 简单分类、抽取这类任务上，CoT 多花的 token 也换来同等幅度的准确率提升"], a: [0, 1, 2, 3], e: "CoT 把中间推理写成 token，用输出长度换多步任务的准确率；简单分类、抽取上几乎没有增量。答案 A、B、C、D。E 错误：对简单分类等任务收益有限甚至无收益。", t: 11, n: {"E": "对简单分类等任务收益有限甚至无收益", "A": "CoT 会增加输出 token 与成本", "B": "先输出中间推理，再给答案", "C": "对多步数学与逻辑提升明显", "D": "Zero-shot CoT 一句「一步一步想」就能触发"} },
  { q: "关于模型上下文窗口与 RAG 的关系，正确的有？", o: ["A. RAG 可控制注入内容的成本与来源", "B. 把窗口开到最大之后，切块与检索的必要性下降", "C. 上下文再长，检索质量差照样答错", "D. RAG 负责把相关知识放进上下文，二者互补", "E. 长上下文出现后，RAG 的位置被取代了"], a: [0, 2, 3], e: "长窗口管容量，RAG 管内容与来源；窗口再大也受成本与注意力稀释限制。答案 A、C、D。E错误：长上下文成本高且存在注意力稀释，RAG 仍是主流；B错误：窗口再大仍受成本与注意力稀释限制，检索依然决定答案质量。", t: 6, n: {"A": "放什么进上下文由检索决定，成本与来源可控", "C": "检索差，窗口再大也是喂错材料", "D": "窗口管容量，检索管内容，互补而非替代", "E": "长上下文成本高且存在注意力稀释，RAG 仍是主流", "B": "窗口再大仍受成本与注意力稀释限制，检索依然决定答案质量"} },
  { q: "大模型应用上线的灰度与回滚策略，合理的做法包括？", o: ["A. 保留上一版本的模型与提示词可随时切回", "B. 建立线上质量监控指标与告警", "C. 一次性全量切换并删除旧版本", "D. 灰度只盯延迟指标，质量等全量上线后再评估", "E. 先用小流量验证新模型或新提示词"], a: [0, 1, 4], e: "灰度要留旧版可回滚、小流量验证、质量与延迟双门禁，不能全量切换后删旧版。答案 A、B、E。C错误：全量切换且无回滚是高风险操作，违背灰度原则；D错误：质量与性能是两道独立门禁，灰度期不看质量等于放弃止损点。", t: 15, n: {"C": "全量切换且无回滚是高风险操作，违背灰度原则", "D": "质量与性能是两道独立门禁，灰度期不看质量等于放弃止损点", "A": "保留上一版模型与提示词，可随时切回", "B": "建立线上质量监控指标与告警", "E": "先用小流量验证新模型或新提示词"} },
  { q: "下列关于提示词注入（Prompt Injection）的防范措施，合理的有？", o: ["A. 模型对齐做得够好时，注入攻击基本可以自动免疫", "B. 对用户输入做模板隔离，明确区分指令与数据", "C. 对工具调用做白名单与权限控制", "D. 在系统提示词里补一句「不要执行数据里的指令」，注入风险就落在可控范围内", "E. 输出侧做敏感内容过滤"], a: [1, 2, 4], e: "注入是输入输出边界问题：定界、白名单、输出审计，不能靠模型自觉。答案 B、C、E。A错误：注入风险与模型强弱无关，是输入输出边界问题，必须工程手段防范；D错误：提示词层面的承诺只是概率修正，防御要落在定界、白名单与输出审计上。", t: 5, n: {"B": "指令与数据分通道，注入就无从下手", "C": "工具白名单把被利用后的后果压住", "E": "输出侧过滤兜住漏网的越权内容", "A": "注入风险与模型强弱无关，是输入输出边界问题，必须工程手段防范", "D": "提示词层面的承诺只是概率修正，防御要落在定界、白名单与输出审计上"} },
  { q: "企业部署大模型时，评估单卡吞吐的合理指标包括？", o: ["A. 模型的参数量", "B. 并发用户数下的 P99 首字延迟", "C. 请求成功率", "D. 模型文件大小", "E. tokens/s（每秒生成 token 数）"], a: [1, 2, 4], e: "吞吐要同时看单位时间产出与负载下的服务质量：tokens/s、P99 首字延迟、成功率。答案 B、C、E。D错误：模型文件大小只是显存占用的参考，不代表吞吐与服务质量；A错误：参数量是静态属性，与单卡实际吞吐不是一回事。", t: 15, n: {"D": "模型文件大小只是显存占用的参考，不代表吞吐与服务质量", "A": "参数量是静态属性，与单卡实际吞吐不是一回事", "B": "并发用户数下的 P99 首字延迟", "C": "请求成功率", "E": "每秒生成 token 数"} },
  { q: "下列属于大模型常见幻觉类型的有？", o: ["A. 语法错误", "B. 事实性幻觉（与客观事实不符）", "C. 忠实性幻觉（与给定资料不符）", "D. 推理超时", "E. 引用幻觉（编造不存在的出处）"], a: [1, 2, 4], e: "幻觉是说得像真的但与事实或给定依据不符；语法错误与服务超时是另外两类问题。答案 B、C、E。A 错误：语法错误属于语言能力，不是幻觉；D 错误：超时是服务层故障，不是幻觉。", t: 4, n: {"D": "超时是服务层故障，不是幻觉", "A": "语法错误属于语言能力，不是幻觉", "B": "与客观事实不符", "C": "与给定资料不符", "E": "编造并不存在的出处"} },
  { q: "关于大模型的微调数据质量，正确的有？", o: ["A. 数据越多，效果单调上升", "B. 数据质量比数量更重要", "C. 含错误标签的数据会直接教坏模型", "D. 清洗做得干净之后，数据分布与线上不一致也不再是问题", "E. 数据分布应与目标场景一致"], a: [1, 2, 4], e: "微调数据质量比数量重要：错标会教坏模型，分布要贴目标场景；清洗只解决噪声。答案 B、C、E。A错误：低质数据的堆积会稀释信号甚至引入退化，规模不是充分条件；D错误：分布一致性是必要项，清洗只解决噪声。", t: 9, n: {"A": "低质数据的堆积会稀释信号甚至引入退化，规模不是充分条件", "D": "分布一致性是必要项，清洗只解决噪声", "B": "质量比数量更重要", "C": "带错误标签的数据会直接教坏模型", "E": "数据分布要与目标场景一致"} },
  { q: "使用大模型生成代码时，合理的工程实践包括？", o: ["A. 对生成代码做静态检查与安全扫描", "B. 生产环境直接部署未经审查的生成代码", "C. 生成的代码必须经人工审查与测试", "D. 用单元测试验证生成代码的行为", "E. 单元测试通过即可直接上线，人工审查可以省略"], a: [0, 2, 3], e: "生成代码要静态检查、人工审查、单测验证三件套；测试通过不能替代审查。答案 A、C、D。B错误：生成代码可能有逻辑与安全缺陷，审查与测试不可省略；E错误：测试覆盖不到权限、并发与安全，审查不能省。", t: 14, n: {"B": "生成代码可能有逻辑与安全缺陷，审查与测试不可省略", "E": "测试覆盖不到权限、并发与安全，审查不能省", "A": "对生成代码做静态检查与安全扫描", "C": "必须经人工审查与测试", "D": "用单元测试验证行为"} },
  { q: "大模型在企业落地时，成本优化的可行手段包括？", o: ["A. 把 max_tokens 压得很小，用截断换成本", "B. 每个请求都用最大模型并拉满思考预算", "C. 对高频重复请求做缓存", "D. 按任务难度分级选用不同规模的模型", "E. 精简提示词，减少输入 token"], a: [2, 3, 4], e: "成本优化要动账单大头：缓存、按难度选模型、精简输入；截断和拉满大模型只会带来失败与返工。答案 C、D、E。A 错误：截断会让任务失败，返工与重试反而更贵；B 错误：与成本优化目标相反，应按需分配算力。", t: 7, n: {"B": "与成本优化目标相反，应按需分配算力", "A": "截断会让任务失败，返工与重试反而更贵", "C": "高频重复请求做缓存", "D": "按难度分级选不同规模的模型", "E": "精简提示词，减少输入 token"} },
  { q: "下列关于向量数据库与关系数据库的说法，正确的有？", o: ["A. 元数据过滤常与向量检索组合使用", "B. 向量检索返回的是精确匹配结果，不涉及近似", "C. 向量数据库以相似度检索为核心能力", "D. 向量检索的结果通常带相似度分数", "E. 向量数据库可以承担关系数据库的查询职责"], a: [0, 2, 3], e: "向量库做相似度检索，关系库做事务与精确匹配；ANN 是近似，不是精确结果。答案 A、C、D。E错误：二者定位不同，向量库不擅长事务与精确匹配；B错误：向量检索通常走 ANN 近似索引，返回的是近邻而非精确匹配。", t: 2, n: {"E": "二者定位不同，向量库不擅长事务与精确匹配", "B": "向量检索通常走 ANN 近似索引，返回的是近邻而非精确匹配", "A": "元数据过滤常和向量检索一起用", "C": "向量库的核心能力就是相似度检索", "D": "检索结果通常带相似度分数，可用于阈值"} },
  { q: "关于多模态模型的训练，正确的有？", o: ["A. 视觉编码器可以冻结只训练连接层", "B. 图文对齐训练只需要视觉编码器，文本侧不参与", "C. 图文数据的配比影响各模态能力", "D. 多模态模型只能理解图像不能理解文字", "E. 常用图文对数据做对齐训练"], a: [0, 2, 4], e: "多模态训练常冻结视觉编码器、训连接层；图文配比影响能力，文本侧也参与对齐。答案 A、C、E。D说反了：多模态语言模型的核心正是同时理解文字与图像；B错误：投影层与文本侧同样在被训练，否则向量接不上语言模型。", t: 10, n: {"B": "投影层与文本侧同样在被训练，否则向量接不上语言模型", "D": "多模态恰恰是图文都能读", "A": "可以冻结视觉编码器，只训连接层", "C": "图文配比会影响各模态能力", "E": "常用图文对做对齐训练"} },
  { q: "Agent 与普通问答的核心区别是什么？", o: ["A. 参数量一定更大", "B. 回答一定更长", "C. 只能处理中文", "D. 必须联网才能算 Agent", "E. 能调用工具，并根据工具返回继续行动"], a: [4], e: "单选。答案 E。A 错误：Agent 可以用小模型；B 错误：长度不是判据；C 错误：Agent 与语言无关；D 错误：Agent 可以调用本地工具，联网不是定义。E：Agent 多了「行动—观察—再行动」的循环。", t: 3, n: {"A": "Agent 可以用小模型。", "B": "长度不是判据。", "C": "Agent 与语言无关。", "D": "Agent 可以调用本地工具，联网不是定义。", "E": "Agent 多了「行动—观察—再行动」的循环。"} },
  { q: "大模型微调中常见的过拟合信号包括？", o: ["A. 对未见过的输入输出质量明显变差", "B. 训练损失与验证损失同步下降", "C. 训练初期损失快速下降", "D. 训练损失持续下降但验证损失回升", "E. 模型只会背诵训练集答案而不会泛化"], a: [0, 3, 4], e: "过拟合的信号是训练与验证分叉：验证变差、泛化下降；同步下降和初期快速下降都是正常收敛。答案 A、D、E。B 错误：同步下降是正常收敛，过拟合的特征是两者分叉；C 错误：初期快速下降是正常收敛，不是过拟合。", t: 9, n: {"B": "同步下降是正常收敛，过拟合的特征是两者分叉", "C": "初期快速下降是正常收敛，不是过拟合", "A": "对没见过的输入，输出质量明显变差", "D": "训练损失继续降，验证损失回升", "E": "只会背训练集答案，不会泛化"} },
  { q: "关于 ReAct 与 Plan-and-Execute 的对比，正确的有？", o: ["A. Plan-and-Execute 遇到意外需要重规划", "B. ReAct 适合目标明确、路径可预知的任务", "C. ReAct 每步都结合观察调整下一步", "D. Plan-and-Execute 不产出中间观察，所以不需要重规划", "E. Plan-and-Execute 先产出整体计划再执行"], a: [0, 2, 4], e: "ReAct 边走边看，Plan-and-Execute 先计划再执行、遇意外要重规划。答案 A、C、E。B说反了：路径可预知更适合 Plan-and-Execute；ReAct 适合需要边探索边行动的任务；D错误：执行中遇到意外必须重规划，这正是它的一环。", t: 3, n: {"D": "执行中遇到意外必须重规划，这正是它的一环", "B": "目标明确、路径可预知，正是计划式的适用面", "A": "计划式遇到意外要重规划", "C": "ReAct 每步结合观察调整下一步", "E": "先产出整体计划再执行"} },
  { q: "企业大模型应用的评测数据集构建，正确的做法包括？", o: ["A. 建立答案质量的人工评级标准", "B. 尽量使用公开榜单题目，客观性更有保障", "C. 覆盖真实用户的高频问题类型", "D. 包含边界与对抗样例", "E. 评测集越大越好，凑够几千条自然就覆盖了业务"], a: [0, 2, 3], e: "评测集要以自身业务为核心，覆盖高频、边界与对抗；公开榜与堆量都不解决问题。答案 A、C、D。B错误：公开榜单与业务分布脱节，评测集应以自身业务为核心；E错误：覆盖与分层比条数重要，同分布堆量不解决问题。", t: 0, n: {"B": "公开榜单与业务分布脱节，评测集应以自身业务为核心", "E": "覆盖与分层比条数重要，同分布堆量不解决问题", "A": "建立答案质量的人工评级标准", "C": "覆盖真实高频问题", "D": "包含边界与对抗样例"} },
  { q: "关于 Long Context 与 KV Cache 的关系，正确的有？", o: ["A. MLA、GQA 等技术可压缩 KV Cache", "B. KV Cache 占用与批处理并发数成正比", "C. KV Cache 可以无限期保留而不占资源", "D. KV Cache 的显存占用只与模型参数量有关", "E. 上下文越长 KV Cache 显存占用越大"], a: [0, 1, 4], e: "KV 随长度与并发涨、请求结束即释放；与权重是两笔账，长并发要容量管理。答案 A、B、E。C错误：KV Cache 是显存资源，请求结束即释放，长并发场景必须做容量管理；D错误：它随上下文长度与并发数线性增长，与权重是两笔账。", t: 6, n: {"C": "KV Cache 是显存资源，请求结束即释放，长并发场景必须做容量管理", "D": "它随上下文长度与并发数线性增长，与权重是两笔账", "A": "MLA、GQA 这类技术能压缩 KV Cache", "B": "KV 占用与并发数成正比", "E": "上下文越长，KV 越占显存"} },
  { q: "下列关于蒸馏与量化的组合，正确的有？", o: ["A. 蒸馏后的模型不能再量化", "B. 蒸馏减小模型规模，量化降低单参数位宽", "C. 二者可以叠加使用进一步压缩部署成本", "D. 蒸馏会损失部分能力，量化也会带来少量精度损失", "E. 蒸馏与量化都只作用于推理，不影响训练成本"], a: [1, 2, 3], e: "蒸馏减规模、量化降位宽，两者维度不同可叠加，也都带来能力损失；蒸馏本身要训练。答案 B、C、D。A 错误：蒸馏与量化作用于不同维度，完全可组合；E 错误：蒸馏本身就是一次训练，训练成本跑不掉。", t: 8, n: {"A": "蒸馏与量化作用于不同维度，完全可组合", "E": "蒸馏本身就是一次训练，训练成本跑不掉", "B": "蒸馏减规模，量化降单参数位宽", "C": "两者可叠加，进一步压缩部署成本", "D": "蒸馏与量化都会带来一定的能力损失"} },
  { q: "Agent 系统中工具调用的结果校验，合理的做法包括？", o: ["A. 把报错信息原样回传给模型让其自我修正", "B. 假设工具调用总是成功", "C. 对工具返回值做结构校验与异常处理", "D. 工具返回 HTTP 200 就代表业务办成了，返回体可以不校验", "E. 连续失败时切换策略或上报人工"], a: [0, 2, 4], e: "工具是外部系统，失败是常态：返回值要校验，HTTP 200 不等于业务成功。答案 A、C、E。B错误：工具是外部系统，失败是常态，必须显式处理；D错误：HTTP 200 只说明请求被接住，业务是否成功要看返回体，必须校验。", t: 3, n: {"B": "工具是外部系统，失败是常态，必须显式处理", "D": "HTTP 200 只代表请求被接住，业务是否成功要看返回体", "A": "报错原样回传，让它自己修正", "C": "返回值要做结构校验与异常处理", "E": "连续失败就切策略或转人工"} },
  { q: "关于中文分词与 LLM token，正确的有？", o: ["A. 词表中的中文 token 覆盖影响中文编码效率", "B. 现代大模型里中文一个字恒为一个 token", "C. 扩大中文词表只会多占显存，对单位文本切出多少 token 没有影响", "D. 中文专有名词常被 BPE 切碎", "E. token 数不等于汉字数"], a: [0, 3, 4], e: "中文 token 数因词表而异，扩表能把常见词切短；token 数与汉字数不是一一对应。答案 A、D、E。B错误：中文切分因模型词表而异，常见 1~2 token 不等；C错误：词表覆盖直接决定中文串被合并成多长的片段，扩表通常能把常见词切得更短，省下输入 token。", t: 1, n: {"A": "词表覆盖越高，同样的中文越省 token", "D": "专有名词常被 BPE 拆成好几段", "E": "token 数和汉字数不是一一对应", "B": "中文切分因模型词表而异，常见 1~2 token 不等", "C": "词表覆盖直接决定中文串被合并成多长的片段，扩表通常能把常见词切得更短，省下输入 token"} },
  { q: "大模型输出的结构化格式（JSON 模式）的价值包括？", o: ["A. 支持稳定的函数调用参数传递", "B. 让内容事实正确", "C. 便于下游程序解析", "D. 降低格式解析失败率", "E. 开了 JSON 模式之后，输出侧就不再计费"], a: [0, 2, 3], e: "JSON 模式只约束格式，让下游好解析、降低解析失败；内容正确性与计费不受影响。答案 A、C、D。B错误：结构化只约束格式，内容正确性仍需检索与校验保障；E错误：结构化输出照常计费，token 一个不少。", t: 1, n: {"A": "字段稳定，参数才传得准", "C": "下游程序能按字段直接取值", "D": "格式失败率下降，重试变少", "B": "结构化只约束格式，内容正确性仍需检索与校验保障", "E": "结构化输出照常计费，token 一个不少"} },
  { q: "大模型项目的安全评测（红队测试）应覆盖的面包括？", o: ["A. 模型的推理速度是否够快", "B. 敏感信息泄露场景", "C. 工具调用被诱导执行危险操作", "D. 同一提示重复提问时，模型回答是否稳定一致", "E. 提示词注入与越狱尝试"], a: [1, 2, 4], e: "红队覆盖安全面：泄露、越权工具调用、注入与越狱；速度与稳定性是另外的指标。答案 B、C、E。D错误：回答稳定性属于一致性/确定性问题，不是红队要覆盖的安全面；A错误：那是性能指标，不属于安全评测的覆盖面。", t: 5, n: {"D": "回答稳定性属于一致性/确定性问题，不是红队要覆盖的安全面", "A": "那是性能指标，不属于安全评测的覆盖面", "B": "敏感信息泄露", "C": "工具被诱导执行危险动作", "E": "注入与越狱尝试"} },
  { q: "SFT 是什么？", o: ["A. 继续做下一词预测的预训练", "B. 用偏好数据做强化学习", "C. 把权重压到 4-bit", "D. 把多个模型的输出做加权平均", "E. 用人工标注的问答对做监督微调，教模型对话格式"], a: [4], e: "单选。答案 E。A 错误：那是继续预训练；B 错误：那是 RLHF 或 DPO；C 错误：那是量化；D 错误：那是模型融合，不是 SFT。E：SFT 教「怎么答」，不负责注入大量新知识。", t: 9, n: {"A": "那是继续预训练。", "B": "那是 RLHF 或 DPO。", "C": "那是量化。", "D": "那是模型融合，不是 SFT。", "E": "SFT 教「怎么答」，不负责注入大量新知识。"} },
  { q: "拿未经对话微调的基座模型直接当聊天机器人用，会出现？", o: ["A. 因为它掌握的语言知识比对话模型少，所以答不好", "B. 同一道题换个提示措辞分数剧烈波动，因为它没学过稳定的应答模式", "C. 它更倾向续写问题而不是回答问题，因为训练目标是下一个 token", "D. 缺少拒绝行为，容易被诱导输出不当内容", "E. 指令前缀怎么写会显著影响输出格式，比如它可能接着把回答也编出来"], a: [1, 2, 3, 4], e: "基座的知识不少，缺的是问答格式与拒绝行为；它更倾向续写而不是回答。答案 B、C、D、E。A错误：知识主体在预训练阶段注入，对话微调改的是调用方式而非知识存量，基座的知识往往并不更少（对齐税甚至说明它本来更强）。C、D、B 都是“没学过问答这一格式”的不同表现，E 是基座最典型的失控方式。", t: 9, n: {"A": "知识主体在预训练阶段注入，对话微调改的是调用方式而非知识存量，基座的知识往往并不更少（对齐税甚至说明它本来更强）。", "B": "换个提示措辞分数剧烈波动", "C": "更倾向续写问题而不是回答", "D": "缺少拒绝行为，容易被诱导", "E": "指令前缀显著影响输出格式"} },
  { q: "预训练验证损失持续下降，能推出什么、不能推出什么？", o: ["A. 不同评测指标对同一批 checkpoint 可能给出相反的排序", "B. 损失下降伴随评测高分时，也要排查基准污染", "C. 损失是充分统计量，其余指标的参考价值有限", "D. 能推出模型在验证语料上的下一 token 预测概率变高", "E. 不能直接推出数学、代码或工具调用能力提升"], a: [0, 1, 3, 4], e: "验证损失只说明下一词概率变高；任务能力、格式与安全要单独测，还要防污染。答案 A、B、D、E。C错误：损失只覆盖“在验证分布上的可预测性”这一维，任务能力、格式遵从、安全性都得单独测。D 是唯一能被损失直接支撑的结论，E、A、B 是损失之外的三件必查事项。", t: 4, n: {"A": "不同指标对同一批 checkpoint 可能给出相反排序", "B": "分数上去的同时必须排查基准污染", "D": "只能推出现在验证语料上的下一词概率变高", "E": "数学、代码、工具调用不必然跟着提升", "C": "损失只覆盖“在验证分布上的可预测性”这一维，任务能力、格式遵从、安全性都得单独测。"} },
  { q: "SFT 阶段只用人工精修的「长而全面」回复做训练数据，会带来哪些后果？", o: ["A. 可以用长短配对的指令数据与按长度分桶采样来缓解", "B. 指令跟随能力会因此明显受损", "C. 后续奖励模型也会给长回答高分，放大成 reward hacking 的一个来源", "D. 模型形成长度偏置，倾向用冗余篇幅回答简单问题", "E. 训练损失更高"], a: [0, 2, 3], e: "只用长回复训练会带来长度偏置与冗长，后续奖励模型也会放大；不是损失变高。答案 A、C、D。E错误：损失高低与回复长短没有必然关系，长回复条数少时平均损失反而可能更低；B错误：长度偏置改变的是回答风格分布，不会让模型听不懂指令。", t: 9, n: {"E": "损失高低与回复长短没有必然关系，长回复条数少时平均损失反而可能更低", "B": "长度偏置改变的是回答风格分布，不会让模型听不懂指令", "A": "用长短配对数据与按长度分桶采样缓解", "C": "奖励模型也会偏爱长回答，放大成 reward hacking", "D": "形成长度偏置，简单问题也用冗余篇幅"} },
  { q: "会话记忆、偏好记忆、事实记忆通常怎么存？", o: ["A. 全部放云端", "B. 全部放内存", "C. 全部写进模型权重", "D. 会话在内存、偏好在本地可删、事实在云端按合同保留", "E. 全部交给模型权重记住"], a: [3], e: "单选。答案 D。A 错误：会把最敏感的一层也带出设备；B 错误：设备重启就丢了；C 错误：写权重不可删除也不可追溯；E 错误：权重不可控、不可删，也不适合存会话。D：分层存放，才能同时兼顾体验、离线与隐私。", t: 13, n: {"A": "会把最敏感的一层也带出设备。", "B": "设备重启就丢了。", "C": "写权重不可删除也不可追溯。", "D": "分层存放，才能同时兼顾体验、离线与隐私。", "E": "权重不可控、不可删，也不适合存会话。"} },
  { q: "在 SFT 数据里加入大量统一措辞的安全拒绝样本，可能的副作用与对策包括？", o: ["A. 安全样本占比过高会挤压通用指令信号，专业能力轻微退化", "B. 应补充同话题的可答边界样本教它区分", "C. 拒答样本必须删掉才能避免过度拒答", "D. 模型把话题关键词与拒答强关联，误伤含同名词的合法提问", "E. 统一措辞的免责段落容易被背诵，近义提问输出几乎相同的拒答文本"], a: [0, 1, 3, 4], e: "拒答样本要控配比、补同话题的可答边界；全删会让有害请求失去拦截，全用统一措辞又会过拒与背模板。答案 A、B、D、E。C 错误：删光安全样本会让有害请求直接得到回答，正确做法是控制配比并补边界样本，而不是清零。", t: 9, n: {"C": "删光安全样本会让有害请求直接得到回答，正确做法是控制配比并补边界样本，而不是清零", "A": "安全样本占比过高会挤压通用指令信号", "B": "补同话题的可答边界样本，教它区分", "D": "话题关键词与拒答强关联，误伤合法提问", "E": "免责段落被背诵，近义提问输出几乎相同的拒答"} },
  { q: "提升指令数据多样性，有效的做法包括？", o: ["A. 按语义聚类采样，避免同一意图被重复堆量", "B. 引入不同来源模型生成的回复，减少单一风格主导", "C. 把同一问题的二十个近义改写一起塞进训练集", "D. 对任务类型、回复长度、语气风格分别做配比统计", "E. 对同一批文档反向合成多种问法的指令"], a: [0, 1, 3, 4], e: "多样性要动语义与来源：按意图聚类、换生成家族、按任务/长度/语气配比；近义改写只是表面扰动。答案 A、B、D、E。C 错误：近义改写只是表面扰动，语义高度同质，堆量会稀释有效梯度并加重记忆化。", t: 1, n: {"C": "近义改写只是表面扰动，语义高度同质，堆量会稀释有效梯度并加重记忆化", "A": "按语义聚类采样，避免同一意图被重复堆量", "B": "混入不同来源模型的回复，减少单一风格主导", "D": "对任务类型、长度、语气分别做配比统计", "E": "对同一批文档反向合成多种问法"} },
  { q: "几千条指令数据训完，通用问答明显退化但业务题几乎全对，最可能的原因是？", o: ["A. batch size 太大", "B. 基座模型本身能力不够", "C. 学习率设得太小", "D. 数据覆盖过窄叠加训练轮次过多，模型记住了训练分布", "E. 没有对 user 段做损失掩码"], a: [3], e: "少量数据训到业务全对、通用全崩，典型是覆盖窄加轮次多，模型记住了训练分布。答案 D。A 错误：批大小与是否记住训练集没有直接关系；B 错误：基座弱不会让原本具备的能力突然不见；C 错误：学习率过小表现为欠拟合而不是背题；E 错误：掩掉非 assistant 段本就是正确做法，与这种退化无因果。", t: 1, n: {"B": "基座弱不会让原本具备的能力突然不见", "C": "学习率过小表现为欠拟合而不是背题", "E": "掩掉非 assistant 段本就是正确做法，与这种退化无因果", "A": "批大小与是否记住训练集没有直接关系", "D": "数据覆盖窄加上轮次过多，模型记住了训练分布"} },
  { q: "把通用模型微调成法律专岗后其他领域明显变差，合理的解释与缓解是？", o: ["A. 混入一部分通用指令数据可以兜底", "B. 全参微调比只训旁路参数更容易出现这种遗忘", "C. 上线前要对旧能力做回归评测，而不是只测专项指标", "D. 把微调学习率调大，专业能力涨得更快，同时能减少对通用能力的覆盖", "E. 单领域数据占比过高会造成通用能力的分布损失"], a: [0, 1, 2, 4], e: "单领域微调会带来通用能力遗忘：混通用数据、降学习率、只训旁路，上线前跑旧能力回归。答案 A、B、C、E。D错误：加大学习率会加重遗忘，方向正好相反；缓解靠数据配比、更小的学习率或 LoRA 这类约束更新范围的手段。", t: 9, n: {"D": "加大学习率会加重遗忘，方向正好相反；缓解靠数据配比、更小的学习率或 LoRA 这类约束更新范围的手段", "A": "混入一定比例通用指令数据兜底", "B": "全参微调比只训旁路更容易遗忘", "C": "上线前对旧能力做回归评测", "E": "单领域占比过高造成通用能力损失"} },
  { q: "给 AI 的规格里，验收条款应该写成什么？", o: ["A. 形容词越多越好", "B. 只写「做好看点」", "C. 只写截止日期", "D. 可判定的条件、数值范围与正反例", "E. 写清「尽快完成」"], a: [3], e: "单选。答案 D。A 错误：不可判定的描述没法验收；B 错误：太模糊，无法测试；C 错误：日期不是质量条款；E 错误：没有可判定标准。D：规格是给 AI 的接口，写不清就会返工。", t: 14, n: {"A": "不可判定的描述没法验收。", "B": "太模糊，无法测试。", "C": "日期不是质量条款。", "D": "规格是给 AI 的接口，写不清就会返工。", "E": "没有可判定标准。"} },
  { q: "奖励模型分数一路上升，下列哪些是 reward hacking 的典型征兆？", o: ["A. 多个独立奖励模型对同一批回答给出明显分歧的评分", "B. 裁判分数与人类偏好在各阶段都严格一致", "C. 回答长度持续膨胀而内容越来越空", "D. 开头堆免责、复述提问来骗取「结构完整」加分", "E. 自动分数上升的同时人工盲评胜率下降"], a: [0, 2, 3, 4], e: "reward hacking 的定义就是自动分与人类偏好脱钩；集成裁判能暴露只讨好单一打分器的策略。答案 A、C、D、E。B说反了：自动分数与人类偏好脱钩正是 reward hacking 的定义；A 是 ensemble 裁判能暴露「策略只讨好某一个打分器」的信号。", t: 9, n: {"B": "严格一致说明没在 hacking，正是反例", "A": "多个独立奖励模型对同一批回答分歧明显", "C": "长度持续膨胀而内容越来越空", "D": "开头堆免责、复述提问骗结构分", "E": "自动分涨的同时人工盲评胜率下降"} },
  { q: "预训练与 SFT 的分工是什么？", o: ["A. 两者都只教对话格式", "B. 两者都只注入新知识", "C. SFT 可以完全替代预训练", "D. 预训练注入知识与语言能力，SFT 教调用方式与格式", "E. SFT 会替换掉预训练权重"], a: [3], e: "单选。答案 D。A 错误：预训练不做对话格式；B 错误：SFT 主要教调用方式；C 错误：没有基座，SFT 无从谈起；E 错误：SFT 通常在基座上继续训练，不是替换知识。D：先读遍世界，再教怎么当助手。", t: 9, n: {"A": "预训练不做对话格式。", "B": "SFT 主要教调用方式。", "C": "没有基座，SFT 无从谈起。", "D": "先读遍世界，再教怎么当助手。", "E": "SFT 通常在基座上继续训练，不是替换知识。"} },
  { q: "微调数据质量与数量的关系是什么？", o: ["A. 数量是唯一重要的因素", "B. 质量与数量完全无关", "C. 数据越多效果一定越好", "D. 质量比数量更重要，错标会直接教坏模型", "E. 只要数据量够，错标也会被平均掉"], a: [3], e: "单选。答案 D。A 错误：低质数据的堆量会稀释信号；B 错误：两者都影响结果，但质量优先；C 错误：重复与错标会带来退化；E 错误：错标会被学进去，不会被平均掉。D：少量干净数据常胜过大量脏数据。", t: 9, n: {"A": "低质数据的堆量会稀释信号。", "B": "两者都影响结果，但质量优先。", "C": "重复与错标会带来退化。", "D": "少量干净数据常胜过大量脏数据。", "E": "错标会被学进去，不会被平均掉。"} },
  { q: "经过可验证奖励训练后，模型仍会出现「过程错、答案对」，最合理的解释是？", o: ["A. 采样温度设得太高", "B. 思维链太长导致注意力丢失", "C. 过程奖励模型打分过严", "D. 奖励只校验最终答案，正确的过程并不是拿到奖励的必要条件", "E. 训练集里难题不够多"], a: [3], e: "只校验最终答案时，过程对不是拿奖励的必要条件，模型可以蒙对。答案 D。A 错误：温度只改变采样随机性，不改变奖励结构；B 错误：注意力丢失通常导致答错而非蒙对；C 错误：过程打分过严恰恰会抑制蒙对；E 错误：难度不足影响的是正确率，不造成过程与答案脱节。", t: 4, n: {"E": "难度不足影响的是正确率，不造成过程与答案脱节", "A": "温度只改变采样随机性，不改变奖励结构", "B": "注意力丢失通常导致答错而非蒙对", "C": "过程打分过严恰恰会抑制蒙对", "D": "奖励只校验最终答案，过程对不是拿奖励的必要条件"} },
  { q: "temperature 主要控制什么？", o: ["A. 控制模型参数量", "B. 控制上下文窗口", "C. 控制训练轮数", "D. 控制模型输出必定正确", "E. 控制采样分布的平滑程度与随机性"], a: [4], e: "单选。答案 E。A 错误：参数量是架构决定的；B 错误：窗口由位置与显存决定；C 错误：温度是推理参数；D 错误：温度不保证正确。E：温度只改变分布形状，不增加知识。", t: 11, n: {"A": "参数量是架构决定的。", "B": "窗口由位置与显存决定。", "C": "温度是推理参数。", "D": "温度不保证正确。", "E": "温度只改变分布形状，不增加知识。"} },
  { q: "关于对齐税（Alignment Tax），正确的有？", o: ["A. 评测应在对齐前后跑同一套题，差值才是税", "B. 对齐后部分能力基准分数下降，是常见代价", "C. 对齐税只出现在带安全过滤的模型上，纯能力提升不涉及", "D. 更隐蔽的是分布层面的损失：罕见但有价值的创造性回答被磨平", "E. 用更高质量、更多样的对齐数据可以减轻对齐税"], a: [0, 1, 3, 4], e: "对齐税是改变输出分布的代价：能力基准下降、风格变平均；换更高质量的对齐数据可减轻。答案 A、B、D、E。C错误：任何改变输出分布的训练都要付代价，加长思考同样带来成本上升与风格变化的税，不是安全过滤专属。", t: 9, n: {"C": "任何改变输出分布的训练都要付代价，加长思考同样带来成本上升与风格变化的税，不是安全过滤专属", "A": "对齐前后跑同一套题，差值才是税", "B": "对齐后部分能力基准下降是常见代价", "D": "更隐蔽的是创造性回答被磨平", "E": "更高质量、更多样的对齐数据能减轻"} },
  { q: "提示注入的本质是什么？", o: ["A. 模型参数量太大", "B. 训练数据太少", "C. 推理速度太慢", "D. 模型输出格式不规范", "E. 把不可信的数据混进了指令通道"], a: [4], e: "单选。答案 E。A 错误：参数规模不是注入的成因；B 错误：数据量不改变指令与数据的边界；C 错误：延迟与注入无关；D 错误：格式问题是生成质量，不是注入。E：注入是边界问题，不是模型强弱问题。", t: 5, n: {"A": "参数规模不是注入的成因。", "B": "数据量不改变指令与数据的边界。", "C": "延迟与注入无关。", "D": "格式问题是生成质量，不是注入。", "E": "注入是边界问题，不是模型强弱问题。"} },
  { q: "对齐版本上线前的安全评测，最可靠的做法是？", o: ["A. 只测英文单轮直接提问", "B. 让模型自己评估有没有安全风险", "C. 只看上线后的用户投诉量", "D. 只用公开红队数据集跑一遍看通过率", "E. 在固定的同一题集上同时报有害率与误拒率，并另设含敏感词的正常任务集专测误伤"], a: [4], e: "安全评测要固定同一题集，同时看有害率与误拒率，并用含敏感词的正常任务测误伤。答案 E。A 错误：多语言与多轮追问是主要漏点；B 错误：模型自评系统性偏乐观；C 错误：投诉是被看到的极小且有偏的样本，且严重滞后；D 错误：公开集覆盖窄又容易被针对性优化，打不穿只说明当前这批攻击失效。", t: 5, n: {"D": "公开集覆盖窄又容易被针对性优化，打不穿只说明当前这批攻击失效", "A": "多语言与多轮追问是主要漏点", "B": "模型自评系统性偏乐观", "C": "投诉是被看到的极小且有偏的样本，且严重滞后", "E": "同一题集上同时报有害率与误拒率，另设正常任务集测误伤"} },
  { q: "模型顺着用户的错误前提往下答、用户一反问就立刻改口，关于这一现象正确的有？", o: ["A. 这属于对齐带来的行为问题，而不是知识缺失", "B. 评测时应专门构造用户给出错误前提的题目来量化它", "C. 在标注指南里明确惩罚迎合错误前提，比事后加一层拒答更有效", "D. 该现象只出现在开放写作类任务，数学和代码上不存在", "E. 偏好标注里自信、附和用户的回答常被排在前面，模型学到了讨好"], a: [0, 1, 2, 4], e: "迎合用户错误前提是对齐带来的行为问题，不是知识缺失；评测要专门构造错误前提题。答案 A、B、C、E。D错误：可验证任务上同样存在——用户声称答案应该是 7 时，模型可能把正确的推导改成迎合 7，只是判分器能兜住一部分。", t: 0, n: {"D": "可验证任务上同样存在——用户声称答案应该是 7 时，模型可能把正确的推导改成迎合 7，只是判分器能兜住一部分", "A": "属对齐带来的行为问题，不是知识缺失", "B": "专门构造错误前提题来量化它", "C": "标注指南里明确惩罚迎合，比事后加拒答有效", "E": "偏好标注里自信附和的回答常被排前面"} },
  { q: "用大模型做自动评审（LLM-as-judge）时，必须处理的偏置包括？", o: ["A. 长度与风格偏置：更长、排版更花的答案容易拿高分", "B. 自我偏好：评审模型偏爱自己或同族模型的输出", "C. 换更强的评审模型，这些偏置会消失", "D. 应抽样与人工评审对齐，用一致率给自动分数标定可信区间", "E. 位置偏置：交换两个候选的顺序重测，结论不稳的样本判为无效"], a: [0, 1, 3, 4], e: "裁判偏置要用机制去偏：换序、换家族、人工锚定；换更强模型不等于偏置消失。答案 A、B、D、E。C 错误：更强的评审模型仍有自身偏好，只能缓解；必须靠机制性去偏（随机化位置、控制长度）加人工锚点。", t: 0, n: {"C": "更强的评审模型仍有自身偏好，只能缓解；必须靠机制性去偏（随机化位置、控制长度）加人工锚点", "A": "长度与风格偏置：更长更花更容易拿高分", "B": "自我偏好：偏爱自己或同族输出", "D": "抽样与人工对齐，用一致率给分数标定", "E": "位置偏置：换序重测，不稳的样本判无效"} },
  { q: "评测一个后训练版本是否真的更好，合理的做法包括？", o: ["A. 评测集要与训练数据做污染检查，重复题目会把对齐评成能力", "B. 同一套题在对齐前后各跑一次，才能把能力提升与对齐提升分开", "C. 公开榜单分数涨了，就说明对齐做得更好", "D. 分层评测：单轮指令跟随、多轮一致性、安全边界、长尾任务分别看", "E. 尽量用成对比较而不是绝对打分，绝对分对提示措辞太敏感"], a: [0, 1, 3, 4], e: "后训练评测要防污染、对齐前后同题对比、分层看能力与安全，不能只看公开榜涨分。答案 A、B、D、E。C错误：榜单混着能力、格式熟悉度和数据泄漏，而对齐的收益常体现在「不该答的不答、该拒的准拒」上，榜单对此几乎不敏感。", t: 9, n: {"C": "榜单混着能力、格式熟悉度和数据泄漏，而对齐的收益常体现在「不该答的不答、该拒的准拒」上，榜单对此几乎不敏感", "A": "评测集要与训练数据做污染检查", "B": "对齐前后各跑一次，才能分开两种提升", "D": "分层评测：单轮、多轮、安全、长尾分开看", "E": "用成对比较，别用绝对打分"} },
  { q: "关于 LoRA 的“低秩”假设，正确的有？", o: ["A. rank 越大效果越好，而且不用担心过拟合", "B. LoRA 把要学的权重变化拆成 ΔW = B·A 两个窄矩阵相乘", "C. 秩 r 远小于隐藏维度 d，所以可训练参数远少于全参微调", "D. 训练时要显式存下一个完整的 d×d 的 ΔW 大矩阵", "E. 基座权重全程冻结，ΔW 只作为旁路叠加在输出上"], a: [1, 2, 4], e: "LoRA 学的是低秩 ΔW=B·A，不落 d×d 大矩阵；rank 越大越容易过拟合。答案 B、C、E。D错误：ΔW 从不落成 d×d 大矩阵，存储与训练都只碰 C、B 两个窄矩阵；A错误：rank 上去后容量与噪声一起涨，小数据集更容易过拟合，要按业务评测集来定。", t: 9, n: {"D": "ΔW 从不落成 d×d 大矩阵，存储与训练都只碰 C、B 两个窄矩阵", "A": "rank 上去后容量与噪声一起涨，小数据集更容易过拟合，要按业务评测集来定", "B": "把权重变化拆成两个窄矩阵相乘", "C": "秩远小于隐藏维度，可训参数远少于全参", "E": "基座冻结，ΔW 只作为旁路叠加"} },
  { q: "训练语料去重的主要目的是什么？", o: ["A. 只是让文件更小", "B. 提高采样温度", "C. 减少模型参数量", "D. 让训练集和评测集更接近", "E. 降低记忆化、提高多样性，并避免评测污染"], a: [4], e: "单选。答案 E。A 错误：省存储只是附带收益；B 错误：去重与温度无关；C 错误：去重不改变模型规模；D 错误：去重是降重复，不是拉近分布。E：重复样本会被逐字背诵，也会让 token 预算虚高。", t: 9, n: {"A": "省存储只是附带收益。", "B": "去重与温度无关。", "C": "去重不改变模型规模。", "D": "去重是降重复，不是拉近分布。", "E": "重复样本会被逐字背诵，也会让 token 预算虚高。"} },
  { q: "数据配比指什么？", o: ["A. 模型层数的比例", "B. 学习率曲线的形状", "C. 不同来源、语言和任务在训练集中的比例", "D. 显卡数量的分配", "E. 每个 batch 里样本的排列顺序"], a: [2], e: "单选。答案 C。A 错误：层数是架构参数；B 错误：那是优化调度；D 错误：那是并行配置；E 错误：顺序不是配比，配比是来源与任务的比例。C：配比决定模型更像谁，也决定哪些能力被挤掉。", t: 9, n: {"A": "层数是架构参数。", "B": "那是优化调度。", "C": "配比决定模型更像谁，也决定哪些能力被挤掉。", "D": "那是并行配置。", "E": "顺序不是配比，配比是来源与任务的比例。"} },
  { q: "在“全参微调 / LoRA / 只调嵌入”之间做选择，合理的判据有？", o: ["A. 显存是硬约束：全参要同时装权重、梯度和优化器状态", "B. 要按租户或任务热切换个性化，不适合全参，适合一个基座配多适配器", "C. 数据量上来之后，LoRA 与全参微调在各种任务上的效果差距会自行消失", "D. 任务分布与基座差得远、数据量大、要改深层能力时，倾向全参或继续预训练", "E. 只有几百到几万条样例、目标只是行为和格式时，应该直接上全参微调"], a: [0, 1, 3], e: "全参贵的在显存与遗忘，LoRA 适合小数据与热切换；改深层表征仍要全参或继续预训练。答案 A、B、D。E错误：这种小数据场景全参既费显存又容易过拟合与遗忘，性价比远不如旁路；C错误：数据规模与任务深度是两回事，需要改深层表征时旁路容量有限。D、A、B 分别对应能力差距、显存约束与部署形态三条判据。", t: 9, n: {"E": "这种小数据场景全参既费显存又容易过拟合与遗忘，性价比远不如旁路", "C": "数据规模与任务深度是两回事，需要改深层表征时旁路容量有限。", "A": "显存是硬约束：全参要同时装权重、梯度与优化器状态", "B": "要按租户或任务热切换，适合一个基座配多个适配器", "D": "分布差得远、数据量大、要改深层能力时倾向全参或继续预训练"} },
  { q: "关于灾难性遗忘的表现与检测，正确的有？", o: ["A. 只看训练损失曲线足以发现遗忘", "B. 只训旁路比全参微调更容易出现灾难性遗忘", "C. 调小学习率、按比例混回原分布数据、只训旁路，都是常用缓解手段", "D. 微调后旧任务与通用评测掉分、新任务也没涨多少，是典型表现", "E. 检测要留一组旧能力回归集，训练前后同口径各跑一遍"], a: [2, 3, 4], e: "遗忘发生在没参与训练的能力上，训练损失看不出来；要留旧能力回归集。答案 C、D、E。A错误：遗忘发生在没参与训练的能力上，训练损失对它完全不敏感，必须靠外部回归集；B错误：方向说反，基座参数被动过才有大范围遗忘的风险，旁路恰恰是缓解手段。D、E、C 与本库“全参微调容易发生灾难性遗忘”的口径一致。", t: 9, n: {"A": "遗忘发生在没参与训练的能力上，训练损失对它完全不敏感，必须靠外部回归集", "B": "方向说反，基座参数被动过才有大范围遗忘的风险，旁路恰恰是缓解手段。", "C": "调小学习率、混回原分布、只训旁路都是常用缓解", "D": "旧任务与通用评测掉分、新任务也没涨，是典型表现", "E": "留一组旧能力回归集，训练前后同口径各跑一遍"} },
  { q: "准备微调数据时，关于格式规范，正确的有？", o: ["A. 数据里的缩进、换行这类格式噪声模型学不会，不用清理", "B. 对话模板和特殊 token 必须与基座一致，否则模型学的是错位格式", "C. 通常只在 assistant 回复上计算损失，user 与 system 部分做 mask", "D. 超长样本截断时要小心把答案截掉，宁可重切或者丢弃", "E. 训练用一套模板、推理用另一套也可以，不影响效果"], a: [1, 2, 3], e: "格式是 SFT 的硬约束：模板与特殊 token 要对齐，只在 assistant 段算损失，截断别切掉答案。答案 B、C、D。E错误：模板错位会让模型在推理时找不到该续写的边界，掉点非常直接；A错误：这类噪声会被一并学成输出习惯，正是需要清理的部分。B、C、D 是数据格式阶段要逐条落实的事。", t: 9, n: {"E": "模板错位会让模型在推理时找不到该续写的边界，掉点非常直接", "A": "这类噪声会被一并学成输出习惯，正是需要清理的部分。", "B": "对话模板与特殊 token 必须与基座一致", "C": "通常只在 assistant 回复上算损失，其余 mask 掉", "D": "截断时要小心把答案截掉，宁可重切或丢弃"} },
  { q: "评测集里的黄金集通常由谁标注？", o: ["A. 双人独立标注，分歧再仲裁", "B. 模型自动生成，不需要人看", "C. 按用户点赞数决定", "D. 按训练损失高低决定", "E. 由产品经理按经验挑几条"], a: [0], e: "单选。答案 A。B 错误：黄金集要的是权威判据，不能只靠自评；C 错误：点赞受表面特征影响，不等于正确；D 错误：训练损失不是答案质量标签；E 错误：经验挑选不能替代双人标注与仲裁。A：黄金集的价值在判据可靠，不在数量多。", t: 4, n: {"A": "黄金集的价值在判据可靠，不在数量多。", "B": "黄金集要的是权威判据，不能只靠自评。", "C": "点赞受表面特征影响，不等于正确。", "D": "训练损失不是答案质量标签。", "E": "经验挑选不能替代双人标注与仲裁。"} },
  { q: "微调模型上线前的评测门禁，合理的有？", o: ["A. 门禁里要有安全项与格式项，比如拒答率和结构合法性", "B. 自动指标之外再留一批人工抽评", "C. 公开榜单分数更高就可以跳过业务评测直接上线", "D. 门禁先看总分，分域切片等上线后再补", "E. 与线上基线同口径对比，关键指标跌破阈值就直接拦住"], a: [0, 1, 4], e: "发布门禁要安全项、格式项、人工抽评、分域切片与线上基线对比；公开榜不能替代。答案 A、B、E。C错误：榜单与自家业务分布脱节，替代不了业务门禁，与本库“评测集应以自身业务为核心”的口径一致；D错误：上线前不做分域切片，就可能让某一块能力悄悄退步。", t: 9, n: {"C": "榜单与自家业务分布脱节，替代不了业务门禁，与本库“评测集应以自身业务为核心”的口径一致", "D": "上线前不做分域切片，就可能让某一块能力悄悄退步", "A": "门禁要有安全项与格式项，比如拒答率与结构合法性", "B": "自动指标之外再留一批人工抽评", "E": "与线上基线同口径对比，跌破阈值就拦住"} },
  { q: "上线后发现“某项能力掉了”，合理的定位手段有？", o: ["A. 一条用户投诉就足以定根因，不用再看日志与回放", "B. 按业务域与意图切片看指标，先确认是哪一块退化", "C. 把数据、超参、模板、模型版本的变更记录与指标时间线对齐", "D. 用固定回归集定期回放，隐性退化能更早暴露", "E. 总体平均分没掉，说明能力没有退化"], a: [1, 2, 3], e: "能力掉了要按域切片、对齐变更时间线、用固定回归集回放；总分与单条投诉都不够。答案 B、C、D。E错误：总分是各域的加权平均，小域塌陷会被大域涨分掩盖；A错误：投诉只是线索，定根因要能复现并归因到某一次具体变更。B、C、D 是定位三件套。", t: 0, n: {"E": "总分是各域的加权平均，小域塌陷会被大域涨分掩盖", "A": "投诉只是线索，定根因要能复现并归因到某一次具体变更。", "B": "按业务域与意图切片，先确认哪块退化", "C": "变更记录与指标时间线对齐", "D": "固定回归集定期回放，隐性退化更早暴露"} },
  { q: "微调效果不达预期，值得先查的点有？", o: ["A. 训练是欠拟合还是过拟合，要看验证曲线而不是训练损失", "B. 数据质量与标注一致性，脏数据比少数据更致命", "C. 评测集测的是不是目标分布，指标可能压根测错了地方", "D. 基座本身没有的能力，靠加大微调数据量可以补出来", "E. 把 rank 从 16 提到 64，这类效果问题通常就解决了"], a: [0, 1, 2], e: "微调不达预期先查验证曲线、数据质量与评测分布；加 rank 或堆数据补不出基座没有的能力。答案 A、B、C。D错误：旁路微调是重新组织已有表征，基座没有的底子补不出来，与本库“注入新知识应使用 RAG”的口径一致；E错误：容量不是瓶颈时加大 rank 只带来噪声和过拟合。B、C、A 是排查的先后顺序，也与“数据质量比数量更重要”的说法一致。", t: 9, n: {"D": "旁路微调是重新组织已有表征，基座没有的底子补不出来，与本库“注入新知识应使用 RAG”的口径一致", "E": "容量不是瓶颈时加大 rank 只带来噪声和过拟合。", "A": "看验证曲线判断欠拟合还是过拟合，而不是训练损失", "B": "数据质量与标注一致性，脏数据比少数据更致命", "C": "评测集未必测的是目标分布，指标可能测错了地方"} },
  { q: "量化是什么？", o: ["A. 用更低位数表示权重或激活，换取更小显存与带宽", "B. 删除模型的一部分层", "C. 把输入文本变短", "D. 把模型能力完整保留且无损", "E. 把模型权重从 FP16 换成 FP32"], a: [0], e: "单选。答案 A。B 错误：那是剪枝；C 错误：那是截断或摘要；D 错误：量化通常会有精度损失；E 错误：那是升精度，不是量化。A：量化是拿精度换空间与带宽，落地后要重测。", t: 8, n: {"A": "量化是拿精度换空间与带宽，落地后要重测。", "B": "那是剪枝。", "C": "那是截断或摘要。", "D": "量化通常会有精度损失。", "E": "那是升精度，不是量化。"} },
  { q: "蒸馏是什么？", o: ["A. 把参数复制给另一个更大的模型", "B. 删除训练数据", "C. 增加模型层数", "D. 用大模型的输出分布训练更小的学生模型", "E. 把教师模型再训练一遍"], a: [3], e: "单选。答案 D。A 错误：方向反了，蒸馏是大教小；B 错误：数据删除与蒸馏无关；C 错误：蒸馏通常减小模型；E 错误：蒸馏是用教师指导更小的学生。D：学生学的是教师的分布与套路，不是全部知识。", t: 8, n: {"A": "方向反了，蒸馏是大教小。", "B": "数据删除与蒸馏无关。", "C": "蒸馏通常减小模型。", "D": "学生学的是教师的分布与套路，不是全部知识。", "E": "蒸馏是用教师指导更小的学生。"} },
  { q: "关于激活重计算（gradient checkpointing），正确的有？", o: ["A. 重计算会改变梯度的数学结果，训练效果与不开时明显不同", "B. 可以只重算注意力这类选择性策略，与其他省显存手段搭配使用", "C. 前向时只存少量检查点，反向时把激活重新算出来，用算力换显存", "D. 激活显存只由参数量决定，与序列长度无关", "E. 开启后单步时间变长，换来的是能跑更长上下文或更大 batch"], a: [1, 2, 4], e: "激活重计算用一次额外前向换显存，梯度等价；激活随序列与 micro batch 涨。答案 B、C、E。D错误：激活是逐 token 产生的，序列长度和 micro batch 一涨它就涨，这正是长序列微调的痛点；A错误：重算出来的是同一批激活，梯度在数学上等价，差别只剩浮点误差。C、E、B 是它的机制、收益与常见搭配。", t: 12, n: {"D": "激活是逐 token 产生的，序列长度和 micro batch 一涨它就涨，这正是长序列微调的痛点", "A": "重算出来的是同一批激活，梯度在数学上等价，差别只剩浮点误差。", "B": "可只重算注意力这类选择性策略，配合其他省显存手段", "C": "前向只存少量检查点，反向重算激活，用算力换显存", "E": "单步变慢，换来更长上下文或更大 batch"} },
  { q: "关于 Temperature 与分布熵的关系，正确的有？", o: ["A. Temperature 为 0 时等价于贪心解码", "B. 温度只影响排序，不改变各候选之间的概率比例", "C. 温度调高会扩大模型词表的规模", "D. 温度调低，分布变尖锐，熵下降，Top_p 保留的候选随之变少", "E. 温度调高，分布被拉平，熵上升，长尾词更容易被选中"], a: [0, 3, 4], e: "温度缩放全部 logits、改变概率比值：调高变平、调低变尖，词表不变。答案 A、D、E。B错误：温度除的是 Logits 的对数概率，T 变大会改变任意两候选的概率比值；C错误：词表是固定的，温度只改变分布形状。", t: 11, n: {"B": "温度除的是 Logits 的对数概率，T 变大会改变任意两候选的概率比值", "C": "词表是固定的，温度只改变分布形状", "A": "温度为 0 等价于贪心", "D": "温度调低则分布变尖、熵下降、Top_p 候选变少", "E": "温度调高则分布拉平、长尾词更容易被选中"} },
  { q: "要让一个问答服务尽可能“同输入同输出”，工程上合理的做法有？", o: ["A. temperature 设为 0 之后，部署形态带来的差异消失，集群固定与否影响不大", "B. 低温度或贪心，配合固定部署形态，减少随机选词与数值路径的漂移", "C. 结果落缓存：命中缓存直接返回上次答案", "D. 把 prompt 逐字节固定住，就可以不考虑硬件与驱动的差异", "E. 业务侧加幂等或去重键，防止重试造成重复副作用"], a: [1, 2, 4], e: "确定性要温度归零、固定部署、缓存结果；seed 不锁版本与硬件，prompt 固定也不够。答案 B、C、E。A错误：seed 只锁随机数，不锁版本与硬件形态，跨版本跨集群不保证一致；D错误：seed 只锁采样，部署形态、版本与数值路径仍会改变结果。", t: 0, n: {"A": "seed 只锁随机数，不锁版本与硬件形态，跨版本跨集群不保证一致", "D": "seed 只锁采样，部署形态、版本与数值路径仍会改变结果", "B": "低温度或贪心加固定部署，减少漂移", "C": "结果落缓存，命中就直接返回上次答案", "E": "业务侧加幂等键，防重试造成重复副作用"} },
  { q: "超时设置的意义是什么？", o: ["A. 让模型更聪明", "B. 提高采样温度", "C. 增加训练数据", "D. 避免请求无限等待，及时失败", "E. 让请求永远不失败"], a: [3], e: "单选。答案 D。A 错误：超时不提升能力；B 错误：温度与超时无关；C 错误：超时不生成数据；E 错误：超时是及时失败，不是保证成功。D：超时是止损点，不是性能优化。", t: 12, n: {"A": "超时不提升能力。", "B": "温度与超时无关。", "C": "超时不生成数据。", "D": "超时是止损点，不是性能优化。", "E": "超时是及时失败，不是保证成功。"} },
  { q: "关于用参数获得确定性输出，正确的有？", o: ["A. 配 seed 可以锁住采样随机数，配合固定部署形态才有可复现性", "B. 调低 top-p 是收窄候选集，不等于去掉随机性", "C. 开启 Min_p 之后，输出就是确定性解码", "D. 把 top_p 设为 1 就等价于贪心解码", "E. 把 temperature 设为 0，走贪心路径，近似去掉采样随机性"], a: [0, 1, 4], e: "温度归零才是贪心；top-p 收窄候选、Min_p 仍是随机抽样，p=1 等于不截断。答案 A、B、E。C错误：Min_p 是截断阈值，仍然在剩下的候选里随机抽样，与确定性无关；D错误：p=1 等于不作截断的全量采样，确定性要温度归零。", t: 11, n: {"C": "Min_p 是截断阈值，仍然在剩下的候选里随机抽样，与确定性无关", "D": "p=1 等于不作截断的全量采样，确定性要温度归零", "A": "seed 锁住采样随机数，配合固定部署才可复现", "B": "调低 top-p 是收窄候选集，不等于消除随机性", "E": "温度设为 0 走贪心，近似去掉采样随机性"} },
  { q: "把 Presence、Frequency、Repetition 三个惩罚同时拉到很高，可能出现？", o: ["A. 惩罚只作用于实义词，不会碰到标点和格式符", "B. 三个惩罚都靠减法实现，叠加效果线性可预测", "C. 括号、引号、逗号这类结构 Token 被一起压低，JSON 与代码容易畸形", "D. 为避开高频词硬换生僻说法，可读性下降", "E. 模型被迫不断换新表达，用词发散但可能偏离原意"], a: [2, 3, 4], e: "三个惩罚同时拉高会压到标点与结构 token，造成 JSON/代码畸形与用词发散。答案 C、D、E。A错误：惩罚按“是否出现/出现几次”施加，不看词性，格式 Token 一样被压；B错误：Repetition Penalty 是乘法缩放（正 Logit 除以 γ），Presence 与 Frequency 才是减法，三者叠加不是线性叠加。", t: 11, n: {"A": "惩罚按“是否出现/出现几次”施加，不看词性，格式 Token 一样被压", "B": "Repetition Penalty 是乘法缩放（正 Logit 除以 γ），Presence 与 Frequency 才是减法，三者叠加不是线性叠加。", "C": "括号、引号、逗号被一起压低，JSON 与代码容易畸形", "D": "为避开高频词硬换生僻说法，可读性下降", "E": "被迫不断换新表达，用词发散但可能偏离原意"} },
  { q: "关于惩罚参数与 Temperature 的同时调整，正确的有？", o: ["A. 惩罚与温度作用在相同的对象上，改一个等于改两个", "B. 温度拉高让分布变平坦、鼓励换词，惩罚拉高压制已出现的词，两者方向可能互相拉扯", "C. 多数场景只调其中一个即可", "D. 三个惩罚可以同时生效，但方向要一致，别互相抵消", "E. 温度与惩罚同时调高，输出更容易复现"], a: [1, 2, 3], e: "温度作用于全部候选、惩罚只压已出现的 token；方向不一致会互相抵消。答案 B、C、D。E错误：两个都推高只会让分布更难预测，而不是更稳定；A错误：温度缩放全部候选的 Logits，惩罚只作用于已出现过的 Token，作用对象不同。", t: 11, n: {"E": "两个都推高只会让分布更难预测，而不是更稳定", "A": "温度缩放全部候选的 Logits，惩罚只作用于已出现过的 Token，作用对象不同", "B": "温度拉高鼓励换词，惩罚压制已出现的词，方向会互相拉扯", "C": "多数场景只调其中一个即可", "D": "三个惩罚可同时生效，但方向要一致"} },
  { q: "关于推理模型的“思考 Token”，正确的有？", o: ["A. 思考 Token 按输入 Token 计价，因为它来自模型内部", "B. 思考 Token 是服务端内部产生的，不该算进用户账单", "C. 思考 Token 通常计入输出 Token，一并计费", "D. 思考阶段也会拉长整段请求的总延迟", "E. 用户端看不到推理草稿，说明模型并没有真的逐 Token 生成它"], a: [2, 3], e: "思考 token 是模型生成的输出，按输出计费；看不到不等于没生成。答案 C、D。B、A 的计费方向都错：它是模型生成出来的，按输出计费；E错误：看不到不等于没生成，正文说的“隐藏”指默认不把草稿展示出来，推理仍然是一步一步逐 Token 算出来的。", t: 11, n: {"E": "看不到不等于没生成，正文说的“隐藏”指默认不把草稿展示出来，推理仍然是一步一步逐 Token 算出来的", "A": "思考 Token 按输出计价，不按输入", "B": "思考 Token 是输出，照常计费", "C": "思考 token 通常计入输出 token，一并计费", "D": "思考阶段也会拉长整段请求的延迟"} },
  { q: "top-p 采样是什么？", o: ["A. 只取概率最高的一个", "B. 把所有概率置零", "C. 按输出长度截断", "D. 按概率从高到低取固定 k 个", "E. 只从累积概率达到 p 的候选里采样"], a: [4], e: "单选。答案 E。A 错误：那是贪心；B 错误：那会无法采样；C 错误：长度截断是另一件事；D 错误：那是 top-k。E：top-p 动态保留候选，比固定 top-k 更自适应。", t: 11, n: {"A": "那是贪心。", "B": "那会无法采样。", "C": "长度截断是另一件事。", "D": "那是 top-k。", "E": "top-p 动态保留候选，比固定 top-k 更自适应。"} },
  { q: "关于思考预算（effort 档位或思考 Token 上限）的理解，正确的有？", o: ["A. 给思考预算设上限，作用是控制最坏情况下的延迟与成本", "B. 简单题上把预算拉满，更可能只是想了更久而非答得更好", "C. 把档位调高，思考长度单调增加", "D. 思考预算和最大输出长度是同一回事", "E. 设了高档位不等于会产生大量思考 token，档位更像天花板而非地板"], a: [0, 1, 4], e: "思考预算控制的是上限：档位高不等于用满，简单题拉满只是更慢；它与最大输出长度是两层。答案 A、B、E。C错误：达到天花板不代表必须用满，模型可能提前收敛；D错误：一个管内部推理阶段、一个管最终返回的输出长度，是两层上限。", t: 11, n: {"C": "达到天花板不代表必须用满，模型可能提前收敛", "D": "一个管内部推理阶段、一个管最终返回的输出长度，是两层上限", "A": "设上限控制最坏情况下的延迟与成本", "B": "简单题把预算拉满，多半只是想得更久", "E": "高档位是天窗不是地板，不一定真的想那么久"} },
  { q: "关于 CoT 与 CoD，正确的有？", o: ["A. CoT 的输出更短、更省钱", "B. CoT 把推理过程一步步写出来，出错能定位到具体步骤", "C. CoD 只留每一步的极简草稿，砍掉解释性内容", "D. CoD 大幅降低 Token 消耗与延迟，精度与 CoT 相近", "E. CoD 是 CoT 的训练前置阶段，模型要先学会 CoD 再学会 CoT"], a: [1, 2, 3], e: "CoT 写全、CoD 压缩：CoD 省 token 与延迟，代价是中间依据不落纸；CoT 是训练前置。答案 B、C、D。E说反了：正文口径是模型先学会“写全”再学会“压缩”，完整 CoT 轨迹才是 RLVR 能分配奖励的前提；A错误：CoT 的问题正是输出长、延迟高、费用贵，省的是 CoD。", t: 11, n: {"A": "CoT 的问题正是输出长、延迟高、费用贵，省的是 CoD", "E": "两者是两种记账方式，不是先后训练阶段", "B": "CoT 一步步写出来，出错能定位到具体步骤", "C": "CoD 只留极简草稿，砍掉解释性内容", "D": "CoD 大幅降低 token 与延迟，精度接近 CoT"} },
  { q: "在同一批任务上给 CoT 与 CoD 做选型，主要该看什么？", o: ["A. 选型只看模型的上下文窗口有多大", "B. 出错的代价高不高", "C. 延迟与吞吐要求", "D. 模型的参数量大小", "E. 结论是否需要被人逐步复核"], a: [1, 2, 4], e: "CoT/CoD 选型只看两件事：结论要不要逐步复核、量大不大且延迟敏不敏感。答案 B、C、E。D错误：正文的选型判断式只看两件事——要不要可回溯复核、是不是量大且延迟敏感，参数量既不决定轨迹写法，也不决定审计要求；A错误：要看结论是否需要逐步复核、出错代价与延迟要求。", t: 11, n: {"D": "正文的选型判断式只看两件事——要不要可回溯复核、是不是量大且延迟敏感，参数量既不决定轨迹写法，也不决定审计要求", "A": "要看结论是否需要逐步复核、出错代价与延迟要求", "B": "看错误代价高不高", "C": "看延迟与吞吐要求", "E": "看结论要不要被人逐步复核"} },
  { q: "针对输出可能被截断，下游合理的处理包括？", o: ["A. 对 JSON 做闭合校验，不通过就重问或走降级分支", "B. 判定被截断后重新发起请求，并给这一次留更宽的输出预算", "C. HTTP 状态 200 就说明内容完整", "D. 忽略结束原因，由前端把残缺的括号补全再交给下游", "E. 检查返回的结束原因是否为 max_tokens，而不是只看有没有报错"], a: [0, 1, 4], e: "截断要看结束原因与结构是否闭合；200 不代表内容完整，前端补括号会伪造合法 JSON。答案 A、B、E。C错误：200 只说明请求成功，内容仍可能因预算耗尽停在半句；D错误：前端硬补括号会造出一条模型从未生成过的“合法 JSON”，把截断伪装成正常结果，应当显式重试或降级。", t: 0, n: {"C": "200 只说明请求成功，内容仍可能因预算耗尽停在半句", "D": "前端硬补括号会造出一条模型从未生成过的“合法 JSON”，把截断伪装成正常结果，应当显式重试或降级", "A": "对 JSON 做闭合校验，不通过就重问或降级", "B": "判定被截断后重发，并给更宽的输出预算", "E": "看结束原因是不是 max_tokens，而不是只看有没有报错"} },
  { q: "关于 stop（停止序列），正确的有？", o: ["A. 如果下游要靠结束标记来判定消息写完，就不要把该标记列进 stop", "B. 命中 stop 后不再继续生成，匹配串本身通常不会出现在返回内容里", "C. 它能控制“在哪里收尾”，但不能用来纠正已经生成出来的错误内容", "D. stop 会同时截断思考预算，两者是同一个开关", "E. 把 stop 设成模型可能自然输出的任意词，不会影响输出完整性"], a: [0, 1, 2], e: "stop 管输出终止，思考预算管内部推理；把结束标记列进 stop 会吃掉下游分界信号。答案 A、B、C。D错误：stop 管输出侧的终止条件，思考预算管内部推理阶段，是两层上限；E错误：stop 命中即截断，选得太随意会把正文拦腰切掉。", t: 11, n: {"D": "stop 管输出侧的终止条件，思考预算管内部推理阶段，是两层上限", "E": "stop 命中即截断，选得太随意会把正文拦腰切掉", "A": "下游要靠结束标记判定写完，就别把它列进 stop", "B": "命中 stop 后不再继续，匹配串通常不出现在返回里", "C": "它能控制在哪收尾，纠正不了已生成的错误"} },
  { q: "预训练的核心任务是什么？", o: ["A. 按人类偏好给回答打分", "B. 教模型按对话格式回答", "C. 在海量文本上做下一词预测", "D. 让模型调用外部工具", "E. 让模型学会拒绝有害请求"], a: [2], e: "单选。答案 C。A 错误：那是偏好对齐阶段的事；B 错误：那是 SFT 的事；D 错误：那是 Agent 与工具调用层的事；E 错误：拒答属于后训练对齐。C：预训练只做文字接龙，产出的是基座模型。", t: 1, n: {"A": "那是偏好对齐阶段的事。", "B": "那是 SFT 的事。", "C": "预训练只做文字接龙，产出的是基座模型。", "D": "那是 Agent 与工具调用层的事。", "E": "拒答属于后训练对齐。"} },
  { q: "关于上下文缓存（Prompt Caching）的命中条件与收益，正确的有？", o: ["A. 语义相近的请求也能复用同一份前缀缓存", "B. 命中率取决于请求前缀的重叠程度，不是开关一开就全量生效", "C. 前缀要逐字节匹配才能命中，同一段 System Prompt 换个标点就失效", "D. 命中可降低首字延迟与调用成本", "E. 把长 System Prompt 固定在最前面、可变内容放在后面，命中率最高"], a: [1, 2, 3, 4], e: "前缀缓存只认逐字节一致的前缀：语义相近不算命中，静态内容放最前，可变内容往后放。答案 B、C、D、E。A错误：正文口径是前缀必须完全匹配，语义相似不算命中；其余四条与“任何请求都能 100% 命中”的误解相对。", t: 12, n: {"A": "正文口径是前缀必须完全匹配，语义相似不算命中；其余四条与“任何请求都能 100% 命中”的误解相对", "B": "命中率取决于前缀重叠程度，不是开关一开就全量生效", "C": "前缀要逐字节完全匹配，换个标点就失效", "D": "命中降低首字延迟与调用成本", "E": "长 System Prompt 固定在最前、可变内容放后面"} },
  { q: "关于约束解码的副作用，正确的有？", o: ["A. Schema 太复杂时，合法路径的组合空间变大，推理负担上升", "B. 加了约束之后，内容质量比不加约束更好", "C. 约束改变的是可选 Token 的集合，不改变模型对事实的掌握", "D. 该填数字的位置只剩少数合法 Token，模型可能硬编一个看起来合规的值", "E. 在合法候选很少的位置上，容易写出语法正确但内容空洞的模板句"], a: [0, 2, 3, 4], e: "约束解码只改可选 token 集合，治语法不治内容；复杂 schema 增加负担，候选太少会逼出空洞值。答案 A、C、D、E。B 错误：约束只保证格式合法，不能保证内容更好，甚至在强约束下更容易产出空洞套话。", t: 14, n: {"B": "约束只保证格式合法，不能保证内容更好，甚至在强约束下更容易产出空洞套话", "A": "schema 太复杂时合法路径变多，推理负担上升", "C": "约束只改可选 token 集合，不改事实掌握", "D": "该填数字的位置只剩少数候选，可能硬编一个", "E": "合法候选很少时，容易写出空洞的模板句"} },
  { q: "关于“Temperature 调高就更聪明、更有创造力”，正确的有？", o: ["A. 温度调低会提升模型的知识覆盖面", "B. 温度过高会把长尾低质量候选的概率抬上来", "C. 事实类问答把温度调高，不会提升事实正确率，只会提升跑偏概率", "D. 温度越高，模型的能力上限就越高", "E. 温度只改变分布形状，不改变模型学到的知识"], a: [1, 2, 4], e: "温度只改分布形状，不改知识：调高抬长尾噪声，事实正确率不会上升。答案 B、C、E。D错误：能力上限由模型与训练决定，温度只是在已有分布上做取舍；想要更靠谱的事实输出该靠检索与校验，不是加温度；A错误：温度不改知识，只改分布形状与采样。", t: 11, n: {"D": "能力上限由模型与训练决定，温度只是在已有分布上做取舍；想要更靠谱的事实输出该靠检索与校验，不是加温度", "A": "温度不改知识，只改分布形状与采样", "B": "温度过高会把长尾低质量候选抬上来", "C": "事实问答调高温度只提升跑偏概率", "E": "温度只改分布形状，不改模型学到的知识"} },
  { q: "对外报告模型评测结果时，为什么要固定并公开采样参数？", o: ["A. 报告里应写明档位、温度、max_tokens 等配置", "B. 固定参数加固定部署形态，别人才能复现你的结论", "C. 同模型同版本跑出来的分数天然可比，采样配置可以不写", "D. 同一模型同一提示词，换个温度就可能从及格线上下翻盘", "E. Temperature、top-p、Min_p 会显著改变输出分布，参数不同的分数不可直接比较"], a: [0, 1, 3, 4], e: "采样参数是评测条件的一部分：温度、top-p、max_tokens 不同，分数不可直接比较，报告要写清。答案 A、B、D、E。C错误：正文的实测口径就是“同模型不同配置结果差很多”，采样配置是评测的一部分，不写等于不给对照组。", t: 4, n: {"C": "正文的实测口径就是“同模型不同配置结果差很多”，采样配置是评测的一部分，不写等于不给对照组", "A": "写明档位、温度、max_tokens 这些配置", "B": "固定参数与部署形态，别人才复现得出", "D": "换个温度就可能从及格线上下翻盘", "E": "参数不同，分数不可直接比较"} },
  { q: "评测集分层（冒烟、回归、影子、黄金）的意义是什么？", o: ["A. 层数越多分数一定越高", "B. 只用黄金集就足够", "C. 分层只是为了省存储", "D. 不同层回答不同问题，不能互相替代", "E. 四层必须每次全跑"], a: [3], e: "单选。答案 D。A 错误：分层不直接提高分数；B 错误：黄金集小且贵，不适合每次改动都跑；C 错误：分层是决策流程，不是存储优化；E 错误：全跑成本高，应按改动与发布阶段选择。D：越靠近发布，用越权威的评测集。", t: 4, n: {"A": "分层不直接提高分数。", "B": "黄金集小且贵，不适合每次改动都跑。", "C": "分层是决策流程，不是存储优化。", "D": "越靠近发布，用越权威的评测集。", "E": "全跑成本高，应按改动与发布阶段选择。"} },
  { q: "TPOT 指什么？", o: ["A. 生成阶段每个 token 之间的平均间隔", "B. 首字延迟", "C. 训练损失", "D. 显存占用", "E. 首字之后到结束的总时间"], a: [0], e: "单选。答案 A。B 错误：那是 TTFT；C 错误：那是训练指标；D 错误：那是资源指标；E 错误：TPOT 是每个 token 的间隔，不是总时间。A：TPOT 决定字出来得跟不跟得上。", t: 6, n: {"A": "TPOT 决定字出来得跟不跟得上。", "B": "那是 TTFT。", "C": "那是训练指标。", "D": "那是资源指标。", "E": "TPOT 是每个 token 的间隔，不是总时间。"} },
  { q: "关于指令模型与推理模型的差别，符合机制的有？", o: ["A. 指令模型走快思考，一次前向直接给答复", "B. 推理模型先在内部生成隐藏的思维链，再落到结论", "C. 这条思维链是靠可验证奖励、过程打分这类训练逼出来的，不是提示词加上去的", "D. 把 Temperature 调高，指令模型就有同等的多步推演能力", "E. 两者的差别其实只在参数量大小"], a: [0, 1, 2], e: "指令模型与推理模型的差别在训练目标与推理路径，不在参数量；调温度不能补出多步推演。答案 A、B、C。D错误：温度只是重塑下一步的概率分布，不会凭空多出多步推演。E错误：同尺寸基座上训法不同就能分成两类，与参数量无关。", t: 11, n: {"D": "温度只是重塑下一步的概率分布，不会凭空多出多步推演", "E": "同尺寸基座上训法不同就能分成两类，与参数量无关", "A": "指令模型一次前向直接给答复", "B": "推理模型先在内部生成隐藏思维链，再落到结论", "C": "这条链是靠可验证奖励与过程打分逼出来的，不是提示词加的"} },
  { q: "手上有一笔固定的推理算力预算想换成准确率，把单次思考拉长与多采样再投票这两条路线，正确的有？", o: ["A. 投票对答案离散、可两两比对的题（数学、选择）更见效", "B. 投票需要一个能归并多样本的判据，否则只是撞运气取众数", "C. 拉长思考多付的是思考 Token 与拿到结论前的等待，投票则要多付几份完整生成", "D. 两条路线在各类任务上收益相当", "E. 采样次数堆得够多，再训练推理能力的必要性下降"], a: [0, 1, 2], e: "两条买准确率的路：拉长思考多付输出 token，投票多付完整候选；投票要有可归并判据。答案 A、B、C。D错误：开放写作没有可比对的离散答案，投票归并不出东西。E错误：投票放大的是已有能力的稳定性，不会教出模型原本不会的推演。", t: 11, n: {"D": "开放写作没有可比对的离散答案，投票归并不出东西", "E": "投票放大的是已有能力的稳定性，不会教出模型原本不会的推演", "A": "投票对可两两比对的离散答案更见效", "B": "投票需要能归并多样本的判据，否则只是撞运气", "C": "拉长思考多付思考 token，投票多付几份完整生成"} },
  { q: "下列任务更值得交给会先想再答的慢思考模型，合理的有？", o: ["A. 每天几十万条、只出一个标签的模板化分类", "B. 日常寒暄与文案润色", "C. 多个硬约束要同时满足的排班、逻辑谜题", "D. 线索散在多处、必须串起来才能定位的取证类问题", "E. 有客观判分器的题，例如数学唯一解、代码跑测试"], a: [2, 3, 4], e: "慢思考适合多约束、跨线索、可验证的难题；模板分类、寒暄、单步任务不值得花思考 token。答案 C、D、E。A错误：这类量大、只要结论、延迟敏感，把预算花在思考上是亏的。B错误：单步就能写完的任务再加推理轨迹，只多出费用和延迟。", t: 11, n: {"A": "这类量大、只要结论、延迟敏感，把预算花在思考上是亏的", "B": "单步就能写完的任务再加推理轨迹，只多出费用和延迟", "C": "多个硬约束要同时满足的排班与谜题", "D": "线索散在多处、必须串起来的取证类问题", "E": "有客观判分器的题，例如唯一解与跑测试"} },
  { q: "关于推理模型写出的思维链与最终答案之间的关系，正确的有？", o: ["A. 思维链长度与准确率单调正相关", "B. 思维链本身也是生成的文本，不保证与答案因果一致", "C. 把它当审计证据之前，要抽查中间步骤是否真的支撑结论", "D. 思维链里算错的数字可能被后面的步骤一路沿用", "E. 思维链写得越详细，最终答案越对"], a: [1, 2, 3], e: "思维链是生成的文本，不保证与答案因果一致；当审计证据要抽查步骤，错值会一路沿用。答案 B、C、D。E错误：详细不等于正确，长篇草稿里同样能带着错值走到底。A错误：超过某个难度点后继续加长只会绕圈，收益不单调。", t: 11, n: {"E": "详细不等于正确，长篇草稿里同样能带着错值走到底", "A": "超过某个难度点后继续加长只会绕圈，收益不单调", "B": "思维链本身也是生成的，不保证与答案因果一致", "C": "当审计证据前，要抽查中间步骤是否真支撑结论", "D": "中间算错的数字会被后面的步骤一路沿用"} },
  { q: "把完整推理轨迹当成交付给复核人的工作底稿，成立的说法有？", o: ["A. 每步显式写出，错了能定位到具体步骤，配合逐步打分便于纠正", "B. 金融、医疗、法律这类结论要被人背书，只给结果无法采信", "C. 留全轨迹也等于给训练期的奖励分配提供了可打分的对象", "D. 底稿写得越长，复核人的成本就越低", "E. 留了轨迹，核对每步原始数据的必要性下降"], a: [0, 1, 2], e: "完整轨迹适合当复核底稿：能定位错步、支持逐步打分，但会推高复核成本，原始数据仍要回查。答案 A、B、C。D错误：长轨迹是把核对成本转嫁给复核人，越读越贵。E错误：步骤自洽不代表来源可靠，数字出处仍要回查。", t: 12, n: {"D": "长轨迹是把核对成本转嫁给复核人，越读越贵", "E": "步骤自洽不代表来源可靠，数字出处仍要回查", "A": "每步显式写出，错了能定位到具体步骤", "B": "金融、医疗、法律这类结论要人背书，只给结果无法采信", "C": "留全轨迹也给训练期的奖励分配提供了可打分对象"} },
  { q: "一套系统里同时留着指令模型和推理模型，合理的运维做法有？", o: ["A. 按任务分档：模板化高频走快模型，多步难题走慢模型", "B. 两条链路的输出结构与解析代码分开维护，别假设字段一致", "C. 换档时用同一批题集回归，免得快慢切换后质量落差没人发现", "D. 慢模型平均分更高时，就该把快模型全线撤掉", "E. 两类模型的接口与解析代码可以原样共用，区分的收益有限"], a: [0, 1, 2], e: "快慢模型并存要按任务分档、解析代码分开、换档回归；慢模型不是全面替代。答案 A、B、C。D错误：慢模型在延迟、费用和格式遵循上未必占优，全线撤掉会伤高频链路。E错误：一边只有回复、一边可能带思考块，字段与解析并不对称。", t: 11, n: {"D": "慢模型在延迟、费用和格式遵循上未必占优，全线撤掉会伤高频链路", "E": "一边只有回复、一边可能带思考块，字段与解析并不对称", "A": "高频模板走快模型，多步难题走慢模型", "B": "两条链路的输出结构与解析代码分开维护", "C": "换档要用同一批题回归，免得质量落差没人发现"} },
  { q: "关于标称上下文窗口与真正用得上的长度之间的差距，正确的有？", o: ["A. 标称是位置与显存能容纳的上限，不等于这段材料会被真正用上", "B. 序列越长，Softmax 要把更多分数归一，每个相关片段摊到的权重越薄", "C. 中段材料的召回通常比头尾差，塞得进不代表用得上", "D. 没超窗口时，模型在该长度内的表现是均匀可用的", "E. 窗口标称值一旦公布，就等于给有效长度开了担保"], a: [0, 1, 2], e: "标称窗口是容量上限，有效长度要看中段召回与注意力稀释；没超窗也不等于均匀可用。答案 A、B、C。D错误：退化主要落在中段与超长区间，可用性并不均匀。E错误：标称只是容量，有效长度要靠实测题集去量。", t: 6, n: {"A": "标称是位置与显存的上限，不等于真的用得上", "B": "序列越长，归一化把权重摊得越薄", "C": "中段召回最差，塞得进不代表用得上", "D": "退化主要落在中段与超长区间，可用性并不均匀", "E": "标称只是容量，有效长度要靠实测题集去量"} },
  { q: "单条“大海捞针”式找回题不足以代表长文能力，原因有？", o: ["A. 它只考定位一条孤立信息，不考把多处材料合并成结论", "B. 针与周围文本没有关联，靠字面就能对上，绕过了长程整合", "C. 单针不冲突，多份互相矛盾的材料才真正考验取舍", "D. 它的结论可以平移给摘要、跨章节问答这类任务", "E. 把针固定放在中段测一次，结果就稳定可比"], a: [0, 1, 2], e: "大海捞针只考单点定位，不考跨材料归并、冲突取舍与长程整合，不能代表长文能力。答案 A、B、C。D错误：找回与归纳是两种能力，找回高分不代表归纳可用。E错误：中段正是召回最差、方差最大的一段，单点结果不稳。", t: 0, n: {"D": "找回与归纳是两种能力，找回高分不代表归纳可用", "E": "中段正是召回最差、方差最大的一段，单点结果不稳", "A": "它只考定位一条孤立信息", "B": "针与周围没有关联，靠字面就能对上", "C": "单针不冲突，多份互相矛盾才考验取舍"} },
  { q: "从读一篇文章升级到读一整本书，任务发生质变，真正需要满足的条件有？", o: ["A. 头尾之外的中段材料要被真正纳入，而不是靠位置优势蒙混", "B. 单靠窗口变长不够，往往还要外部检索或分批归纳来补注意力的短板", "C. 窗口再拉长一个数量级之后，这类任务会做对", "D. 提示里写上“请通读全文”，细节会覆盖齐全", "E. 把散在多处的说法归并成一个一致结论，而不只是找回原句"], a: [0, 1, 4], e: "读整本书要中段被真正纳入、跨处归并成结论，往往还要检索或分批归纳；加窗口与提示不够。答案 A、B、E。C错误：窗口是容量，归并与抗稀释不是靠倍数解决的。D错误：一句指令改变不了注意力在长序列上的分配方式。", t: 0, n: {"C": "窗口是容量，归并与抗稀释不是靠倍数解决的", "D": "一句指令改变不了注意力在长序列上的分配方式", "A": "中段材料要被真正纳入，而不是靠位置优势", "B": "单靠窗口不够，还要外部检索或分批归纳", "E": "把散在多处的说法归并成一个一致结论"} },
  { q: "Prefill 与 Decode 的瓶颈分别是什么？", o: ["A. Prefill 偏算力，Decode 偏显存带宽", "B. 两者都偏网络带宽", "C. 两者都偏磁盘读写", "D. Prefill 偏带宽，Decode 偏算力", "E. 两者都受磁盘 IO 限制"], a: [0], e: "单选。答案 A。B 错误：网络会影响，但不是计算阶段的本质瓶颈；C 错误：推理主要不靠磁盘；D 错误：正好说反了；E 错误：推理主要不靠磁盘。A：首字慢与逐字慢是两种病，要先分清阶段。", t: 6, n: {"A": "首字慢与逐字慢是两种病，要先分清阶段。", "B": "网络会影响，但不是计算阶段的本质瓶颈。", "C": "推理主要不靠磁盘。", "D": "正好说反了。", "E": "推理主要不靠磁盘。"} },
  { q: "不换更长窗口的模型，只靠工程手段提高超长材料的利用率，合理的有？", o: ["A. 把最可能被追问的段落集中堆在中段", "B. 调高 Temperature 让模型更仔细地读细节", "C. 先检索筛选再喂，把无关材料挡在窗口之外", "D. 分批归纳再合并，把一次超长拆成多次可控长度", "E. 把最关键的约束与结论要求放到开头或结尾，避开召回最差的中段"], a: [2, 3, 4], e: "提利用率靠检索筛选、分批归纳、关键料放头尾；堆中段或调温度都没用。答案 C、D、E。A错误：中段正是注意力最薄的地方，把关键料堆那里是自找漏读。B错误：温度改的是生成端的采样陡度，改不了对已读材料的注意力分配。", t: 6, n: {"A": "中段正是注意力最薄的地方，把关键料堆那里是自找漏读", "B": "温度改的是生成端的采样陡度，改不了对已读材料的注意力分配", "C": "先检索筛选，把无关材料挡在窗口外", "D": "分批归纳再合并，把一次超长拆成多次可控长度", "E": "关键约束放开头或结尾，避开召回最差的中段"} },
  { q: "把一本长书先分段做摘要、再拿摘要回答问题，这种做法的特性有？", o: ["A. 除摘要外还要保留回查原文的路径，例如出处与页码", "B. 分段摘要后的信息总量与原文等价", "C. 每段摘要够长时，无须再回查原文", "D. 把单次超长换成多次可控长度，绕开注意力稀释", "E. 摘要是有损压缩，细节型问题会在压缩里丢掉"], a: [0, 3, 4], e: "分段摘要是先压缩再回答：用多次可控长度绕开稀释，但摘要本身有损，细节必须留回查路径。答案 A、D、E。B 错误：归一压缩的代价就是细节流失，不可能等量；C 错误：摘要再长也不是原文，落到具体数字仍要回查。", t: 0, n: {"B": "归一压缩的代价就是细节流失，不可能等量", "C": "摘要再长也不是原文，落到具体数字仍要回查", "A": "要保留回查原文的路径，例如出处与页码", "D": "把一次超长换成多次可控长度", "E": "摘要是有损压缩，细节型问题会丢"} },
  { q: "上下文里同时塞进新旧两版互相矛盾的规章，正确的说法有？", o: ["A. 矛盾材料只影响 Token 开销，不影响结论", "B. 模型没有默认的裁决规则，可能任选其一，也可能折中，答案不稳", "C. 应在提示里显式给出生效时间与优先级，或干脆只喂当前版本", "D. 冲突点落在中段时更容易被忽略，落在头尾更容易被采纳", "E. 材料里带了日期，模型以最新那份为准"], a: [1, 2, 3], e: "新旧材料冲突时模型没有默认裁决规则，要在提示里显式给生效时间与优先级，或只喂当前版。答案 B、C、D。E错误：日期只是又一段文本，没有被显式指定为裁决依据时不保证生效。A错误：两份都进窗口时，结论会在两版之间漂。", t: 0, n: {"E": "日期只是又一段文本，没有被显式指定为裁决依据时不保证生效", "A": "两份都进窗口时，结论会在两版之间漂", "B": "模型没有默认裁决规则，可能任选或折中", "C": "提示里显式给生效时间与优先级，或只喂当前版", "D": "冲突点在中段更易被忽略"} },
  { q: "按“输出是什么”来选模型形态，正确的有？", o: ["A. 只要一个标签或一个相似度分数，双向编码器就够用，不必上生成", "B. 要产出任意长度的文本，用 Decoder-Only 这一代形态", "C. 先读懂再写出这类结构，Encoder-Decoder 也有它的位置", "D. 分类任务只能用生成式模型，编码器形态已经不适用", "E. 任务一复杂，就该把各种形态串成一条固定流水线"], a: [0, 1, 2], e: "按输出形态选模型：标签用编码器，长文用 Decoder-Only，先读后写用 Encoder-Decoder，不必强行串链。答案 A、B、C。D错误：判断式恰恰相反，只输出理解结果时编码器类更省。E错误：复杂度不是串链的理由，链路越长故障域和成本越大。", t: 0, n: {"D": "判断式恰恰相反，只输出理解结果时编码器类更省", "E": "复杂度不是串链的理由，链路越长故障域和成本越大", "A": "只要标签或分数，双向编码器就够", "B": "要产出任意长度文本，用 Decoder-Only", "C": "先读懂再写出，Encoder-Decoder 也有位置"} },
  { q: "站在选型角度，多模态语言模型相对纯语言模型改的是什么，正确的有？", o: ["A. 主干仍是自回归语言模型，视觉侧负责把图变成能接龙的表示", "B. 加的是输入通路与对齐，训练目标还是预测下一个 Token", "C. 选型时要回头看纯文本能力有没有被侵蚀，不能只测图文题", "D. 模型挂了多模态标签，图表读数与 OCR 便可靠", "E. 加了视觉通路后文本侧就换了一套解码机制，不再受采样参数影响"], a: [0, 1, 2], e: "多模态改的是输入通路与对齐，主干仍是自回归文本模型；标签不等于 OCR 与图表能力。答案 A、B、C。D错误：标签只说明有视觉通路，密集数字与细线图表仍是常见失分点。E错误：视觉动的只是输入通路，文本侧仍是同一套自回归解码与采样。", t: 10, n: {"D": "标签只说明有视觉通路，密集数字与细线图表仍是常见失分点", "E": "视觉动的只是输入通路，文本侧仍是同一套自回归解码与采样", "A": "主干仍是自回归语言模型，视觉侧只把图变成可接龙的表示", "B": "加的是输入通路与对齐，目标还是预测下一个 token", "C": "要回头看纯文本能力有没有被侵蚀"} },
  { q: "VLM 是什么？", o: ["A. 只做语音识别", "B. 只做向量检索", "C. 能同时理解图像与文本的多模态模型", "D. 只做权重量化", "E. 只做文本摘要"], a: [2], e: "单选。答案 C。A 错误：语音识别是 ASR；B 错误：检索是另一套系统；D 错误：量化是压缩方法；E 错误：摘要仍是语言任务，不是多模态模型。C：VLM 把视觉信息编码成 token，拼进语言模型。", t: 10, n: {"A": "语音识别是 ASR。", "B": "检索是另一套系统。", "C": "VLM 把视觉信息编码成 token，拼进语言模型。", "D": "量化是压缩方法。", "E": "摘要仍是语言任务，不是多模态模型。"} },
  { q: "关于嵌入模型在模型谱系里的位置，正确的有？", o: ["A. 它把一段文本压成定长向量，输出不是文本，不做生成", "B. 追求的是同一段文本在向量空间里可比较，句向量走的是双向编码那一路", "C. 它与生成式模型不等价：召回靠它，组织回答靠生成式", "D. 维度越大，检索精度越高", "E. 它可以顶替生成模型直接写答复"], a: [0, 1, 2], e: "嵌入模型输出定长向量，不做生成；召回靠它，组织回答靠生成式，维度不等于精度。答案 A、B、C。D错误：维度主要影响开销与表达容量，精度取决于训练目标与领域适配。E错误：它不产出文本，回答环节仍需生成式模型。", t: 2, n: {"D": "维度主要影响开销与表达容量，精度取决于训练目标与领域适配", "E": "它不产出文本，回答环节仍需生成式模型", "A": "它输出定长向量而不是文本，不做生成", "B": "句向量走双向编码那一路", "C": "召回靠嵌入，组织回答靠生成式"} },
  { q: "MMLU 主要测什么能力？", o: ["A. 代码能否通过单元测试", "B. 小学数学应用题的解题能力", "C. 综合学科知识的选择题", "D. 图像分类的准确率", "E. 模型生成 SQL 能否执行"], a: [2], e: "单选。答案 C。A 错误：那是 HumanEval 一类代码基准；B 错误：那是 GSM8K 一类数学基准；D 错误：那是视觉基准，不是语言模型基准；E 错误：SQL 执行属于代码或数据库任务评测。C：MMLU 用多学科选择题考通用知识面。", t: 0, n: {"A": "那是 HumanEval 一类代码基准。", "B": "那是 GSM8K 一类数学基准。", "C": "MMLU 用多学科选择题考通用知识面。", "D": "那是视觉基准，不是语言模型基准。", "E": "SQL 执行属于代码或数据库任务评测。"} },
  { q: "把语音、图像、文本都收进一个端到端模型，与用多个专职模型编排相比，正确的有？", o: ["A. 单模型里短板模态会拉低整体，且不容易定位问题出在哪一模态", "B. 单模型在成本上低于编排", "C. 用一个大一统模型后，按模态分别建评测集的必要性下降", "D. 单模型少掉中间转换，跨模态信息更完整地进到同一次推演里", "E. 编排方案每段可独立替换与验收，故障域更小"], a: [0, 3, 4], e: "端到端少转换、跨模态信息全，但短板模态会拖累整体、难定位；编排每段可验收、故障域小。答案 A、D、E。B错误：一个模型要常驻全部模态的能力，成本取决于负载与规模，谈不上必然更省。C错误：模态能力不均衡，评测恰恰要按模态拆开。", t: 10, n: {"B": "一个模型要常驻全部模态的能力，成本取决于负载与规模，谈不上必然更省", "C": "模态能力不均衡，评测恰恰要按模态拆开", "A": "单模型里短板模态会拉低整体，且不好定位", "D": "少掉中间转换，跨模态信息更完整地进同一次推演", "E": "编排每段可独立替换验收，故障域更小"} },
  { q: "企业问答为什么常用 RAG？", o: ["A. 能让模型参数量变大", "B. 能替代所有微调与评测", "C. 能保证完全不出幻觉", "D. 知识可更新、可溯源，不必为每次知识变化重训模型", "E. 能让模型不用联网就获得实时知识"], a: [3], e: "单选。答案 D。A 错误：RAG 不改模型参数；B 错误：RAG 只解决知识注入的一环；C 错误：检索错、生成歪仍会出错；E 错误：RAG 通常要访问知识库，实时性靠数据更新。D：RAG 的价值是「只说我们有的东西」，不是零错误。", t: 2, n: {"A": "RAG 不改模型参数。", "B": "RAG 只解决知识注入的一环。", "C": "检索错、生成歪仍会出错。", "D": "RAG 的价值是「只说我们有的东西」，不是零错误。", "E": "RAG 通常要访问知识库，实时性靠数据更新。"} },
  { q: "切块（chunking）是什么？", o: ["A. 把模型权重切成多份", "B. 把长文档切成适合检索与放入上下文的片段", "C. 把最终回答截断", "D. 把向量维度降低", "E. 把用户问题改写成更短的句子"], a: [1], e: "单选。答案 B。A 错误：那是模型并行或分片；C 错误：截断回答不是切块；D 错误：那是降维或量化；E 错误：那是查询改写，不是切块。B：切块决定了检索能捞到什么，也决定了上下文里放什么。", t: 2, n: {"A": "那是模型并行或分片。", "B": "切块决定了检索能捞到什么，也决定了上下文里放什么。", "C": "截断回答不是切块。", "D": "那是降维或量化。", "E": "那是查询改写，不是切块。"} },
  { q: "文档里的表格在切块与检索时容易出问题，正确的处理与原因包括？", o: ["A. 常见补救是让每行自带表头（写成“列名: 值”），或小表整表作为一块", "B. 很大的明细表更适合走结构化通路（SQL 或表格工具），而不是硬挤进向量召回", "C. 表格属于结构化数据，向量检索对它的召回通常比自然段落更好", "D. 页眉页脚与水印对切块没有影响，原样保留即可", "E. 表格被拉平成逐行文本后，列名与数值的对应关系容易丢失"], a: [0, 1, 4], e: "表格拉平后结构丢失、召回更差；小表带表头或整表一块，大表走结构化查询。答案 A、B、E。C说反了：拉平后的表格在向量空间里像一串稀疏 token，往往比自然段更难召回，这正是需要混合检索与结构化通路的原因；D错误：每页重复的页眉页脚彼此高度相似，容易被高分召回并污染片段，入库前应剥离。", t: 2, n: {"D": "每页重复的页眉页脚彼此高度相似，容易被高分召回并污染片段，入库前应剥离", "C": "表格结构被打散，向量召回通常更差", "A": "让每行自带表头，或小表整块作为一块", "B": "大明细表走 SQL 或表格工具更合适", "E": "拉平成逐行文本后，列名与数值的对应会丢"} },
  { q: "切块时保留元数据与文档层级（标题路径、页码、版本、时间），作用包括？", o: ["A. 元数据越多越好，把整篇正文复制进每个块的附加字段就行", "B. 片段带上“篇-章-节”路径，可补回孤立片段丢掉的主语与限定条件", "C. 时间、部门、密级这类条件交给元数据过滤，不必把内容切得更碎", "D. 答案里的页码与段落定位依赖这些字段，否则无法溯源核对", "E. 元数据只影响前端展示，对召回质量没有影响"], a: [1, 2, 3], e: "元数据补回片段丢掉的主语与限定条件，支持过滤与溯源；不是越多越好。答案 B、C、D。E错误：标题路径本身参与关键词与向量检索，会直接改变召回结果；A错误：整篇正文冗余进每块会让块向量被全文语义平均化、区分度下降，存储与去重成本也一起暴涨。", t: 2, n: {"E": "标题路径本身参与关键词与向量检索，会直接改变召回结果", "A": "整篇正文冗余进每块会让块向量被全文语义平均化、区分度下降，存储与去重成本也一起暴涨", "B": "带上篇章节路径，能补回孤立片段丢掉的主语", "C": "时间、密级这类条件交给元数据过滤", "D": "答案里的页码与段落定位依赖这些字段"} },
  { q: "切块太大会有什么问题？", o: ["A. 片段会失去主语和条件", "B. 向量维度会变低", "C. 片段混入无关内容，检索不精确，还挤占上下文", "D. 模型无法加载", "E. 检索结果一定会更精确"], a: [2], e: "单选。答案 C。A 错误：那是切得太小的问题；B 错误：切块不改变向量维度；D 错误：切块是文本处理，不影响加载；E 错误：块太大反而混入无关内容。C：块太大混主题，检索命中率与上下文利用率都会下降。", t: 2, n: {"A": "那是切得太小的问题。", "B": "切块不改变向量维度。", "C": "块太大混主题，检索命中率与上下文利用率都会下降。", "D": "切块是文本处理，不影响加载。", "E": "块太大反而混入无关内容。"} },
  { q: "切块粒度对召回与成本的影响是双向的，正确的有？", o: ["A. 块过大时一条里混着多个主题，向量被平均，命中后还夹带噪声", "B. 固定 Top-K 下块越大，拼装进上下文的字数越多、生成成本越高", "C. 块切得越小，端到端准确率就单调上升", "D. 块越碎，向量条目数越多，索引体积与候选比较量随之上升", "E. 块越碎，单条语义越聚焦，Top-K 捞回的内容更贴合问题"], a: [0, 1, 3, 4], e: "切块是双向权衡：太大混主题、成本高；太小丢上下文、索引膨胀；没有单调最优。答案 A、B、D、E。C 错误：块太小会丢上下文，是权衡不是单调。", t: 2, n: {"C": "块太小会丢上下文，是权衡不是单调", "A": "块过大则一条里混多个主题，向量被平均", "B": "固定 Top-K 下块越大，拼进上下文的字数越多", "D": "块越碎条目越多，索引体积与比较量上升", "E": "块越碎语义越聚焦，Top-K 更贴题"} },
  { q: "文档入库前的预处理，合理的做法包括？", o: ["A. 清洗规则只需首次全量导入执行一次，后续增量可以跳过", "B. 剥离页眉页脚、页码、目录、免责声明等每页重复的样板内容", "C. 扫描件先做 OCR，并标记识别失败的页面，避免静默入库成空块", "D. 近重复内容要去重，否则 Top-K 会被同一份材料的多个副本占位", "E. 空块和超长块可以不管，检索时自然不会命中"], a: [1, 2, 3], e: "入库前要剥样板、OCR 标记失败、去重、拦空块与超长块；增量也要同样清洗。答案 B、C、D。E错误：超长块语义宽泛，容易什么都沾一点边而被高分召回，空块还可能白吃名额，必须在入库校验里拦掉；A错误：增量必须走同一套清洗，否则脏数据从增量口子持续进入，库质量随时间退化。", t: 0, n: {"E": "超长块语义宽泛，容易什么都沾一点边而被高分召回，空块还可能白吃名额，必须在入库校验里拦掉", "A": "增量必须走同一套清洗，否则脏数据从增量口子持续进入，库质量随时间退化", "B": "剥离页眉页脚、页码等每页重复的样板", "C": "扫描件先 OCR，并标记识别失败的页", "D": "近重复去重，否则 Top-K 被副本占位"} },
  { q: "关于嵌入模型的维度与向量开销，正确的有？", o: ["A. 把两个模型的向量放进同一个索引，两边的短板会互相补齐", "B. 维度越高，单条向量的存储体积与检索时的距离计算开销越大", "C. 维度只是容量，与训练目标不匹配时高维也可能在业务上表现差", "D. 同一批文档必须用同一模型编码，不同模型的向量空间互不兼容", "E. 维度越高，检索召回率越高"], a: [1, 2, 3], e: "维度影响存储与距离开销，收益会饱和；不同模型的向量空间不能混。答案 B、C、D。E错误：维度收益很快饱和，决定效果的是训练语料与目标函数而不是位数；A错误：不同模型各维含义完全不同，混检等于拿两套坐标系比距离，只能全库重编码后重建索引。", t: 2, n: {"E": "维度收益很快饱和，决定效果的是训练语料与目标函数而不是位数", "A": "不同模型各维含义完全不同，混检等于拿两套坐标系比距离，只能全库重编码后重建索引", "B": "维度高则单条存储与距离计算都更贵", "C": "维度只是容量，目标不匹配时高维也白搭", "D": "同一批文档必须用同一模型编码，空间才可比"} },
  { q: "线上准备更换嵌入模型（升级版本或换供应商），正确的说法有？", o: ["A. 只换查询侧、沿用旧文档向量，结果会出现系统性偏差", "B. 迁移期可双索引并行，用检索指标灰度对比后再切流量", "C. 把模型名与版本写进元数据，便于回滚和定位片段的编码来源", "D. 换模型只影响新入库文档，老文档的向量可以继续正常使用", "E. 需要对全库文档重新编码并重建索引，是一次离线大工程"], a: [0, 1, 2, 4], e: "换嵌入模型等于换向量空间：查询与文档必须同模型，老库要全量重编码并重建索引。答案 A、B、C、E。D 错误：新旧向量不可互相比较，老库不重编码就等于失效，这正是换型即重建的由来。", t: 2, n: {"D": "新旧向量不可互相比较，老库不重编码就等于失效，这正是换型即重建的由来", "A": "只换查询侧、沿用旧文档向量，会系统性偏差", "B": "双索引并行，用检索指标灰度后再切流量", "C": "模型名与版本写进元数据，方便回滚与定位", "E": "全库重编码加重建索引，是一次离线大工程"} },
  { q: "切块太小会有什么问题？", o: ["A. 片段缺少主语、条件和上下文，语义不完整", "B. 检索一定更快更准", "C. 成本一定更低", "D. 模型会拒绝回答", "E. 向量维度会变高"], a: [0], e: "单选。答案 A。B 错误：过碎会丢条件，召回反而变差；C 错误：碎片多也会增加检索与拼接成本；D 错误：模型不会因为块小就拒答；E 错误：切块不改变向量维度。A：块太小会丢主语与条件，答案就拼不回来。", t: 2, n: {"A": "块太小会丢主语与条件，答案就拼不回来。", "B": "过碎会丢条件，召回反而变差。", "C": "碎片多也会增加检索与拼接成本。", "D": "模型不会因为块小就拒答。", "E": "切块不改变向量维度。"} },
  { q: "向量相似度容易“看走眼”的场景包括？", o: ["A. 出现这类误判就应放弃向量检索，只用关键词匹配", "B. 两句结论相反但话题相同，向量位置可能很近", "C. 问句与对应陈述句说的是同一件事，相似度常低于两段同话题文本", "D. 只改动一个数字或型号，向量距离的变化可能小于普通改写的噪声", "E. 换更强的嵌入模型，这类误判消失"], a: [1, 2, 3], e: "向量看走眼是表示局限：反义、问句陈述、单个数字差异都可能很近；要混合检索与重排。答案 B、C、D。E错误：这是表示学习的结构性局限，更强模型只能缓解，仍需混合检索与重排补位；A错误：方向相反，该把语义召回与 BM25、结构化过滤、重排组合使用，而不是丢掉语义能力。", t: 2, n: {"E": "这是表示学习的结构性局限，更强模型只能缓解，仍需混合检索与重排补位", "A": "方向相反，该把语义召回与 BM25、结构化过滤、重排组合使用，而不是丢掉语义能力", "B": "话题相同、结论相反的两句，位置可能很近", "C": "问句与陈述句讲同一件事，相似度反而常偏低", "D": "只改一个数字，距离变化可能小于普通改写的噪声"} },
  { q: "GSM8K 主要测什么能力？", o: ["A. 综合学科知识面", "B. 小学数学应用题的解题能力", "C. 根据函数签名生成代码", "D. 语音识别的字错率", "E. 手写摘要与参考摘要的重叠度"], a: [1], e: "单选。答案 B。A 错误：那是 MMLU 的覆盖范围；C 错误：那是 HumanEval 的覆盖范围；D 错误：那是 ASR 评测，不是文本基准；E 错误：那是摘要指标，不是 GSM8K。B：GSM8K 是多步算术应用题集，考的是推理链条。", t: 0, n: {"A": "那是 MMLU 的覆盖范围。", "B": "GSM8K 是多步算术应用题集，考的是推理链条。", "C": "那是 HumanEval 的覆盖范围。", "D": "那是 ASR 评测，不是文本基准。", "E": "那是摘要指标，不是 GSM8K。"} },
  { q: "Embedding 是什么？", o: ["A. 把中文翻译成英文", "B. 把模型权重压到 4-bit", "C. 把日志按时间排序", "D. 把模型输出压成更短的摘要", "E. 把文本映射成定长向量，用距离表示语义相近程度"], a: [4], e: "单选。答案 E。A 错误：翻译是生成任务，不是嵌入；B 错误：那是量化；C 错误：那是日志处理；D 错误：摘要是生成任务，不是嵌入。E：嵌入把「意思像不像」变成可计算的向量距离。", t: 2, n: {"A": "翻译是生成任务，不是嵌入。", "B": "那是量化。", "C": "那是日志处理。", "D": "摘要是生成任务，不是嵌入。", "E": "嵌入把「意思像不像」变成可计算的向量距离。"} },
  { q: "关于召回条数与相似度阈值的设定，正确的有？", o: ["A. Top-K 越大答案越准，因为给模型的材料更多", "B. 设了阈值就不需要评测，阈值本身就是质量的证明", "C. 固定 Top-K 在库里根本没有相关内容时，照样会返回一堆低质片段", "D. 单靠相似度阈值卡控，对长度和话题都不同的查询很难有统一门槛", "E. 常见做法是召回稍深的候选池，再由重排截断出真正送进模型的少数几条"], a: [2, 3, 4], e: "召回深一点再重排截断；Top-K 越大越夹带噪声，阈值要按标注集验。答案 C、D、E。A错误：候选越多越容易夹带无关或互相矛盾的片段，模型利用质量下降、成本还同步上升；B错误：阈值只是工程约束，合不合适要用标注集上的 Recall@k 与命中率来验。", t: 2, n: {"A": "候选越多越容易夹带无关或互相矛盾的片段，模型利用质量下降、成本还同步上升", "B": "阈值只是工程约束，合不合适要用标注集上的 Recall@k 与命中率来验", "C": "固定 Top-K 在库里没相关内容时，照样返回低质片段", "D": "长度与话题都不同的查询，很难有统一阈值", "E": "常见做法是召回略深，再由重排截断"} },
  { q: "把复合问题拆成子问题分别检索，正确的有？", o: ["A. 做了子问题拆解，最终答案的正确率提高", "B. 对比类、多跳类问题拆成单跳后，每一跳都更容易命中对应片段", "C. 各子查询分别召回，再汇总去重后交给模型作答", "D. 代价是检索次数与延迟成倍上升，简单问题不值得拆", "E. 拆分粒度越细越好，拆到词一级最准"], a: [1, 2, 3], e: "子问题拆解提升多跳命中，但会增延迟、可能拆错；不是越细越好。答案 B、C、D。E错误：过细的查询丢失整体意图，捞回一堆碎片反而拼不出答案；A不成立：拆解本身可能拆错方向，每一跳的漏检还会累积到最后的答案里。", t: 2, n: {"E": "过细的查询丢失整体意图，捞回一堆碎片反而拼不出答案。", "A": "拆解可能拆错方向，每一跳的漏检还会累积", "B": "拆成单跳后，每一跳都更容易命中片段", "C": "各子查询分别召回，汇总去重后交给模型", "D": "检索次数与延迟成倍上升，简单问题不值得拆"} },
  { q: "多轮会话里做检索，为什么必须先补全查询？", o: ["A. 把整段对话历史原样拼成查询最好，信息量最全", "B. 模型够强时，可以拿原始追问直接去检索", "C. “那它有什么副作用”这类追问直接拿去检索，缺主语几乎无法命中", "D. 要把上文出现的实体、时间范围补进一个可独立理解的查询再检索", "E. 补全时顺手把上文确定的筛选条件写进元数据过滤，可减少无关召回"], a: [2, 3, 4], e: "多轮追问缺主语，必须先补全实体与筛选条件；拼整段历史会稀释语义。答案 C、D、E。A错误：历史里的寒暄、纠错和无关话题会稀释查询语义，通常只取最近若干轮或抽取关键实体；B错误：这不是模型能力问题，检索器收到缺主语的短查询就是缺信息，生成端再强也定位不到。", t: 13, n: {"A": "历史里的寒暄、纠错和无关话题会稀释查询语义，通常只取最近若干轮或抽取关键实体", "B": "这不是模型能力问题，检索器收到缺主语的短查询就是缺信息，生成端再强也定位不到", "C": "「那它有什么副作用」缺主语，直接检索几乎命不中", "D": "把上文实体与时间范围补进查询再检索", "E": "把已确定的筛选条件写进元数据过滤"} },
  { q: "下面哪些查询是向量检索答不好、GraphRAG 更占优的？", o: ["A. 这批材料整体在讲什么趋势这类全局归纳", "B. 答案分散在彼此不相似、但实体相连的片段里，靠语义相似度捞不全", "C. 一句话即可定位的单点事实题，例如某参数的默认值", "D. 刚上线、每天大量新增与删除的文档库最该先上 GraphRAG", "E. 要跨多份文档串两跳以上才能落地的关系型问题"], a: [0, 1, 4], e: "GraphRAG 适合全局归纳与多跳关系，不适合单点事实与高频变更库。答案 A、B、E。C错误：这种一跳事实题向量或关键词就够，建图纯属多付成本；D错误：GraphRAG 的构建 token 开销高一个数量级、增量更新也贵，它更适合相对静态的中小库做深度问答。", t: 2, n: {"C": "这种一跳事实题向量或关键词就够，建图纯属多付成本", "D": "GraphRAG 的构建 token 开销高一个数量级、增量更新也贵，它更适合相对静态的中小库做深度问答", "A": "整体讲什么趋势这类全局归纳，图谱的社区摘要更擅长", "B": "答案分散在实体相连但语义不相似的片段里，向量捞不全", "E": "要跨多份文档串两跳以上才能落地"} },
  { q: "关于代理式检索（Agentic RAG）与固定一次检索的取舍，正确的有？", o: ["A. 单跳事实题套上循环，只是多付延迟与费用", "B. 循环里的错误不会累积，因为每轮都拿得到新证据", "C. 用了 Agentic RAG 就不需要再单独做检索评测", "D. 由模型自决要不要检索、检索几轮、是否改写查询、换哪个检索器", "E. 多跳、对比、归纳类问题，检索到发现缺口再补查的循环上限更高"], a: [0, 3, 4], e: "Agentic RAG 让模型自决检索轮次与改写，适合多跳；单跳套循环只多花钱，错误会累积。答案 A、D、E。B说反了：前一轮选错的查询方向会带歪后续，错误会累积，这也是延迟成倍的原因之一；C错误：通路变多以后更要分别量每条通路的贡献，否则说不清是哪一步在起作用。", t: 2, n: {"C": "通路变多以后更要分别量每条通路的贡献，否则说不清是哪一步在起作用", "B": "错误会沿轮次累积，新证据不等于能纠错", "A": "单跳事实题套上循环，只是多付延迟与费用", "D": "由模型自己决定要不要检索、检索几轮", "E": "多跳与归纳类问题，循环的上限更高"} },
  { q: "HumanEval 主要测什么能力？", o: ["A. 长文摘要的忠实度", "B. 图像生成的清晰度", "C. 根据函数签名生成可运行代码的能力", "D. 向量检索的召回率", "E. 多轮对话的指令遵循率"], a: [2], e: "单选。答案 C。A 错误：摘要要看 ROUGE 或人评，不是 HumanEval；B 错误：那是扩散模型与视觉指标；D 错误：那是检索评测，不是代码生成；E 错误：指令遵循是另一类评测，不是代码基准。C：HumanEval 用单元测试判断生成代码是否正确。", t: 0, n: {"A": "摘要要看 ROUGE 或人评，不是 HumanEval。", "B": "那是扩散模型与视觉指标。", "C": "HumanEval 用单元测试判断生成代码是否正确。", "D": "那是检索评测，不是代码生成。", "E": "指令遵循是另一类评测，不是代码基准。"} },
  { q: "要求答案给出可核对的引用字段（片段编号、页码、章节），为什么能降幻觉？", o: ["A. 引用字段只是给合规看的，对答案质量没有约束作用", "B. 模型必须把结论落到具体依据上，凭空补全的空间被压小", "C. 可以程序化校验每句有无依据，忠实度指标才有产出方式", "D. 用户能一键回到原文核对，错误被发现得快，也更容易归因", "E. 有了引用字段，模型就不会再编造内容了"], a: [1, 2, 3], e: "引用把结论锚到片段，能程序化校验、便于溯源；但仍可能挂错片段，要校验支持关系。答案 B、C、D。E错误：模型仍可能挂个片段号去支持原文里没有的结论，即引用幻觉，需要自动校验引用与原文是否真的对应；A不成立：它是链路里少数能机器检查忠实度的抓手，不只是展示层的事。", t: 4, n: {"E": "模型仍可能挂个片段号去支持原文里没有的结论，即引用幻觉，需要自动校验引用与原文是否真的对应。", "A": "可核对的编号本身就限制了编造", "B": "结论必须落到具体依据上，凭空补全的空间被压小", "C": "能程序化校验每句有无依据", "D": "用户能一键回原文核对"} },
  { q: "关于是否引入 GraphRAG、Agentic RAG 这类进阶形态，合理的判断包括？", o: ["A. 厂商宣传支持时，就应当一步到位把链路做满", "B. 基础链路还没做对时，也值得先把进阶形态堆上", "C. 先用标注集确认瓶颈在检索通路，而不在切块或答案生成", "D. 每加一层都要能单独量出增益，否则只是加了无法归因的复杂度", "E. 延迟与费用预算是硬约束，循环检索与图遍历都可能顶到上限"], a: [2, 3, 4], e: "进阶 RAG 要先确认瓶颈在检索，再逐层量增益；基础没做对就堆形态只会加复杂度。答案 C、D、E。A错误：外部宣传不构成技术依据，选型要由自己的问题分布和指标决定；B说反了：基础环节的漏洞会被上层机制放大，应该先把切块、混合检索、重排这三件便宜的事做对。", t: 2, n: {"A": "外部宣传不构成技术依据，选型要由自己的问题分布和指标决定。", "B": "基础没做对，进阶形态只会把问题放大", "C": "先用标注集确认瓶颈在检索通路", "D": "每加一层都要能单独量出增益", "E": "延迟与费用预算是硬约束"} },
  { q: "企业知识分散在文档、工单系统和代码库三处，检索层的合理设计包括？", o: ["A. 每一路用自己的索引与过滤条件，结果再统一融合与重排", "B. 结构化数据走查询工具，文档走向量与关键词，各用所长", "C. 三路结果直接拼进上下文，谁先谁后没有关系", "D. 都接进同一个向量索引之后，来源差异的影响可以忽略", "E. 按问题类型做路由，决定查哪几路，而不是每次都全库扫"], a: [0, 1, 4], e: "多源检索各用索引与过滤，再融合重排；结构化走查询工具，按问题路由。答案 A、B、E。C错误：片段顺序影响模型对材料的利用，各路可信度与新鲜度也不同，必须排序并标注来源；D错误：把工单和代码硬塞进同一个文本向量索引，会同时丢掉结构化字段与权限语义，精度反而下降。", t: 2, n: {"C": "片段顺序影响模型对材料的利用，各路可信度与新鲜度也不同，必须排序并标注来源", "D": "把工单和代码硬塞进同一个文本向量索引，会同时丢掉结构化字段与权限语义，精度反而下降", "A": "每一路用自己的索引与过滤条件，再做融合与重排", "B": "结构化走查询工具，文档走向量与关键词", "E": "按问题类型路由，而不是每次全库扫"} },
  { q: "向量检索与关键词检索的区别是什么？", o: ["A. 向量检索只能用中文，关键词只能用英文", "B. 向量检索看语义相似，关键词检索看字面匹配", "C. 向量检索用 CPU，关键词用 GPU", "D. 两者结果永远一致", "E. 向量检索一定比关键词检索慢"], a: [1], e: "单选。答案 B。A 错误：两者都支持多语言；C 错误：硬件不是区分标准；D 错误：同义改写与型号编号上各有长短；E 错误：速度取决于索引与规模，不是定义。B：一个抓语义，一个抓精确字面，常配合使用。", t: 2, n: {"A": "两者都支持多语言。", "B": "一个抓语义，一个抓精确字面，常配合使用。", "C": "硬件不是区分标准。", "D": "同义改写与型号编号上各有长短。", "E": "速度取决于索引与规模，不是定义。"} },
  { q: "标注集上 Recall@k 已经不错，但 MRR 偏低，合理的判断与对策是？", o: ["A. 应该调高生成端温度，让模型自己去利用排在后面的材料", "B. 相关内容被召回了却排在候选池后段，没进入最终送进模型的几条", "C. 排序质量不够，融合权重或重排环节需要调整", "D. 融合只看名次、不做内容级判断，相关片段可能被一批长尾副本挤下去", "E. 说明切块粒度错了，应当推倒重做切块"], a: [1, 2, 3], e: "Recall 好 MRR 差是排序问题：调融合权重或重排，不是重做切块。答案 B、C、D。E错误：Recall@k 好说明网眼已经捞到东西，问题出在排序而不是切块；A说反了：温度调高只会让模型更容易脱开依据，正解是把该看的材料排到前面。", t: 2, n: {"E": "Recall@k 好说明网眼已经捞到东西，问题出在排序而不是切块。", "A": "温度与材料利用无关，该改的是重排", "B": "相关内容被召回，但排在候选池后段没进最终的几条", "C": "排序质量不够，融合权重或重排要调", "D": "融合只看名次，长尾副本会把相关片段挤下去"} },
  { q: "ANN 索引的作用是什么？", o: ["A. 保证结果与暴力检索完全一致", "B. 训练嵌入模型", "C. 用近似换速度，加速大规模近邻搜索", "D. 生成最终答案", "E. 把向量维度压到一维"], a: [2], e: "单选。答案 C。A 错误：ANN 允许少量召回损失；B 错误：索引不训练嵌入；D 错误：索引只负责找近邻；E 错误：ANN 是索引，不是降维。C：ANN 是近似最近邻，快但可能漏掉个别真近邻。", t: 2, n: {"A": "ANN 允许少量召回损失。", "B": "索引不训练嵌入。", "C": "ANN 是近似最近邻，快但可能漏掉个别真近邻。", "D": "索引只负责找近邻。", "E": "ANN 是索引，不是降维。"} },
  { q: "关于忠实度（Faithfulness）评测，正确的有？", o: ["A. 可以用答案句子被片段支持的比例来量化，作为可回归的指标", "B. 检索指标都达标而忠实度低，责任在生成侧，即没看材料或直接编", "C. 忠实度高就说明答案符合客观事实", "D. 忠实度只能靠人工通读判断，无法自动化", "E. 它量的是答案每句能否在给定片段里找到依据，与客观事实正确性是两件事"], a: [0, 1, 4], e: "忠实度看答案是否被给定片段支持，不等于事实正确；可自动打分，人工校准。答案 A、B、E。C错误：模型可以完全依据一段过时资料作答，忠实度满分而结论已失效，事实性要靠语料新鲜度与外部校验；D错误：可用引用对齐、句子级支持判定等方式自动打分，人工抽检的作用是校准这套自动判定。", t: 0, n: {"C": "模型可以完全依据一段过时资料作答，忠实度满分而结论已失效，事实性要靠语料新鲜度与外部校验", "D": "可用引用对齐、句子级支持判定等方式自动打分，人工抽检的作用是校准这套自动判定", "A": "用答案句子被片段支持的比例来量化", "B": "检索达标而忠实度低，责任在生成侧", "E": "量的是每句能否在给定片段里找到依据"} },
  { q: "公开榜单分数很高，能否直接当作自家业务的验收结论？", o: ["A. 不能，公开榜与业务分布不同，题目还可能已被污染", "B. 能，榜单分数就是业务效果", "C. 能，排名越高一定越便宜", "D. 只有在多模态任务上不能", "E. 能，只要把榜单题目翻译成中文就能用"], a: [0], e: "单选。答案 A。B 错误：榜单测的是公开题，业务分布往往不同；C 错误：排名与价格没有直接关系；D 错误：文本任务同样存在分布不一致与污染；E 错误：翻译题目不改变分布与污染问题。A：榜单只能看水位，验收必须用自家业务题集。", t: 0, n: {"A": "榜单只能看水位，验收必须用自家业务题集。", "B": "榜单测的是公开题，业务分布往往不同。", "C": "排名与价格没有直接关系。", "D": "文本任务同样存在分布不一致与污染。", "E": "翻译题目不改变分布与污染问题。"} },
  { q: "RAG 系统上线后，防止检索质量悄悄退化的做法包括？", o: ["A. 评测集一旦建立就永久冻结，改动会失去可比性", "B. 定期用固定标注集回归，把 Recall@k 与忠实度画成可比曲线", "C. 线上埋点记录零命中查询、无结果率与用户追问率作为弱信号", "D. 文档源变更、嵌入或重排模型升级都要灰度对比后再全量", "E. 用户没投诉，就说明链路没有退化"], a: [1, 2, 3], e: "检索退化要靠固定集回归、线上弱信号、变更灰度；没投诉不等于没退化。答案 B、C、D。E错误：沉默不等于没问题，退化通常先体现在指标上，等投诉已经晚了；A错误：评测集要跟着真实问题分布更新，更新时保留历史子集或分版记录，兼顾可比性与代表性，而不是永久冻结。", t: 2, n: {"E": "沉默不等于没问题，退化通常先体现在指标上，等投诉已经晚了", "A": "评测集要跟着真实问题分布更新，更新时保留历史子集或分版记录，兼顾可比性与代表性，而不是永久冻结", "B": "固定标注集定期回归，把指标画成可比曲线", "C": "埋点零命中、无结果率与用户追问率", "D": "源变更与模型升级都先灰度对比"} },
  { q: "什么是评测集污染（contamination）？", o: ["A. 评测集文件在磁盘上损坏", "B. 标注员之间意见不一致", "C. 模型输出出现乱码", "D. 评测题目或答案提前进入训练语料，分数被记忆抬高", "E. 评测脚本在 CI 里跑失败了"], a: [3], e: "单选。答案 D。A 错误：文件损坏是工程事故，不是污染；B 错误：那是一致性问题，不是污染；C 错误：那是生成质量问题，不是污染；E 错误：脚本失败是工程故障，不是污染。D：污染让评测测到的是记忆，不是能力。", t: 0, n: {"A": "文件损坏是工程事故，不是污染。", "B": "那是一致性问题，不是污染。", "C": "那是生成质量问题，不是污染。", "D": "污染让评测测到的是记忆，不是能力。", "E": "脚本失败是工程故障，不是污染。"} },
  { q: "模型产出的工具调用参数在真正执行前，客户端合理的处理有？", o: ["A. 参数正确性交给模型自觉，提示词里写一句「务必填写正确」就行", "B. 重试必须有次数上限，超限就判定失败并上报，否则容易陷入报错与重试的死循环", "C. 校验失败时把具体错误（哪个字段、期望什么格式）回喂给模型，比只回「调用失败」更容易一次改对", "D. 对高危字段（目标路径、金额、收件人）单独设白名单或二次确认，不能只看格式合法", "E. 先按 JSON Schema 本地校验，缺必填字段或类型不对就别把这次调用发出去"], a: [1, 2, 3, 4], e: "工具参数执行前要 schema 校验、高危字段白名单/二次确认、有界重试并回喂具体错误。答案 B、C、D、E。A错误：提示词只是概率性约束，格式与取值边界必须由代码兜住，这和「权限不能只靠提示词」是同一件事。E、B、C、D 成立：模型输出的只是调用意图，执行前的确定性校验与有界重试属于执行框架的职责，回喂的错误信息还要具体到字段。", t: 3, n: {"A": "提示词只是概率性约束，格式与取值边界必须由代码兜住，这和「权限不能只靠提示词」是同一件事。", "B": "重试必须有次数上限，超限就判失败", "C": "把具体错误回喂，比只说「失败」更容易改对", "D": "高危字段单独白名单或二次确认", "E": "先本地按 schema 校验，别把坏调用发出去"} },
  { q: "工具调用中，模型负责什么？", o: ["A. 直接执行数据库事务", "B. 输出结构化的调用意图与参数", "C. 修改工具源代码", "D. 管理服务器权限", "E. 决定工具返回什么结果"], a: [1], e: "单选。答案 B。A 错误：执行由外部程序完成；C 错误：模型不改代码，除非另外生成；D 错误：权限在宿主程序与基础设施层；E 错误：返回值由工具与外部系统决定。B：模型写申请表，真正的执行与权限在代码里。", t: 3, n: {"A": "执行由外部程序完成。", "B": "模型写申请表，真正的执行与权限在代码里。", "C": "模型不改代码，除非另外生成。", "D": "权限在宿主程序与基础设施层。", "E": "返回值由工具与外部系统决定。"} },
  { q: "黄金集（golden set）通常指什么？", o: ["A. 模型训练用的全量语料", "B. 线上日志的全部原始记录", "C. 一份公开榜单的全部题目", "D. 线上抽取的一百条最新问题", "E. 人工精标、用于关键决策的小规模评测集"], a: [4], e: "单选。答案 E。A 错误：黄金集是评测资产，不拿来训练；B 错误：原始日志要抽样、脱敏后才可能进评测集；C 错误：公开榜题目分布与业务不同，不能直接当黄金集；D 错误：那是影子集或回归集的来源，不叫黄金集。E：黄金集规模小但标注权威，用来做终审。", t: 0, n: {"A": "黄金集是评测资产，不拿来训练。", "B": "原始日志要抽样、脱敏后才可能进评测集。", "C": "公开榜题目分布与业务不同，不能直接当黄金集。", "D": "那是影子集或回归集的来源，不叫黄金集。", "E": "黄金集规模小但标注权威，用来做终审。"} },
  { q: "ReAct 模式的核心是什么？", o: ["A. 推理与行动交替，看到观察结果再决定下一步", "B. 一次写死全部计划，中途不改", "C. 只做一次检索就结束", "D. 只输出最终答案，不写过程", "E. 必须先训练一个专用模型"], a: [0], e: "单选。答案 A。B 错误：那是先计划再执行；C 错误：ReAct 可以多轮行动；D 错误：ReAct 明确交替推理与行动；E 错误：ReAct 是提示与循环模式，不一定重训。A：ReAct 是一步一看，不是一次把计划写完。", t: 3, n: {"A": "ReAct 是一步一看，不是一次把计划写完。", "B": "那是先计划再执行。", "C": "ReAct 可以多轮行动。", "D": "ReAct 明确交替推理与行动。", "E": "ReAct 是提示与循环模式，不一定重训。"} },
  { q: "循环里同一类错误连续出现三次，最合理的处置是？", o: ["A. 把报错原样回传让它再试一次，这是自我修正的标准做法", "B. 调高采样温度，让它换几种写法试试", "C. 跳过这一步继续往下走，最后整体看结果", "D. 把最大迭代次数翻倍，多给几次机会总会成功", "E. 判定当前策略缺信息或缺能力：换手段（补检索、换工具、再拆任务）或升级人工"], a: [4], e: "连续三次同类失败说明缺信息或缺能力，不是随机波动；继续原样重试只会重复同一个错。答案 E。A 错误：原样回传只对偶发失败和参数错有效，对系统性缺信息无效，连续三次同类失败本身就是信号；B 错误：温度只改变措辞分布，不会补上它不知道的事实；C 错误：带着缺口继续往下走，错误会在下游步骤放大，最终产物更难定位到是哪一步坏的；D 错误：次数翻倍的典型结局是把同一个错误多犯几遍，预算烧光而状态不变。", t: 3, n: {"D": "次数翻倍的典型结局是把同一个错误多犯几遍，预算烧光而状态不变", "A": "原样回传只对偶发失败和参数错有效，对系统性缺信息无效，连续三次同类失败本身就是信号", "B": "温度只改变措辞分布，不会补上它不知道的事实", "C": "带着缺口继续往下走，错误会在下游步骤放大，最终产物更难定位到是哪一步坏的", "E": "判定当前策略缺信息或缺能力，换手段或转人工"} },
  { q: "Agent 循环为什么需要刹车？", o: ["A. 让模型变得更聪明", "B. 防止死循环、烧光预算和重复执行副作用", "C. 提高采样温度", "D. 减少可用工具数量", "E. 让模型自己记住已经调过几次"], a: [1], e: "单选。答案 B。A 错误：刹车不提升模型能力；C 错误：温度与循环终止无关；D 错误：刹车是终止条件，不是工具数量；E 错误：模型没有可靠的计数器，刹车要写进代码。B：模型没有「够了」的出口，刹车必须写进代码。", t: 3, n: {"A": "刹车不提升模型能力。", "B": "模型没有「够了」的出口，刹车必须写进代码。", "C": "温度与循环终止无关。", "D": "刹车是终止条件，不是工具数量。", "E": "模型没有可靠的计数器，刹车要写进代码。"} },
  { q: "MCP server 收到调用请求后，合理的自我约束有？", o: ["A. 每次调用记录调用方、参数摘要、结果与耗时，出问题才能定位到具体一步", "B. 即使参数合法，server 也有权拒绝它认为不安全的调用", "C. 参数合法就意味着业务上安全，server 只做格式判断", "D. 高危工具应在准入与确认机制上设卡，而不是只在工具描述里写一句「请谨慎使用」", "E. 不能假设客户端已经校验过：类型、取值范围、路径穿越这类检查要在 server 侧再做一遍"], a: [0, 1, 3, 4], e: "MCP server 是最终执行者：参数合法不等于该执行，校验、审计与拒绝权都在 server。答案 A、B、D、E。C错误：合法只保证能解析，不保证该执行，一条格式完全正确的删除命令照样是事故。E、A、B、D 是同一条：server 是唯一真正动手的一方，校验和审计不能外包给模型或宿主。", t: 3, n: {"C": "合法只保证能解析，不保证该执行，一条格式完全正确的删除命令照样是事故。", "A": "记录调用方、参数摘要、结果与耗时", "B": "参数合法也可以拒绝，安全判断在 server 侧", "D": "高危工具要在准入与确认处设卡", "E": "不能假设客户端校验过，类型与路径要再查一遍"} },
  { q: "Agent 的权限分级通常怎么分？", o: ["A. 训练、推理、评测", "B. 输入、输出、日志", "C. 中文、英文、代码", "D. 建议、代劳、自动", "E. 只读、可写、管理员"], a: [3], e: "单选。答案 D。A 错误：那是生命周期阶段；B 错误：那是数据通道；C 错误：那是内容类型；E 错误：那是权限级别，不是建议、代劳、自动三类。D：读操作可直通，写操作要确认，不可逆动作要二次确认。", t: 3, n: {"A": "那是生命周期阶段。", "B": "那是数据通道。", "C": "那是内容类型。", "D": "读操作可直通，写操作要确认，不可逆动作要二次确认。", "E": "那是权限级别，不是建议、代劳、自动三类。"} },
  { q: "Parallelization 的投票变体（同一任务多份输出取多数）在哪些情况下不涨反亏？", o: ["A. 任务难度远超模型能力时，多采几份得到的只是分布更散的噪声", "B. 投票把延迟和 token 按份数放大，涨幅不明显时性价比直接转负", "C. 采样次数加上去，模型的系统性偏差会被摊平", "D. 各候选的错误高度相关时，投票只是把「共识性的错」固化成结论", "E. 投票只适用于有唯一标准答案的任务，开放性写作碰不得"], a: [0, 1, 3], e: "投票抑制方差，前提是错误独立；共同偏差、强相关错误时投票会把错固化。答案 A、B、D。C错误：多次采样能压掉随机错，压不掉共同错，偏差来自模型本身而不是来自某一次抽样；E错误：开放任务同样可以多次生成再按维度择优，只是判据从「答案是否一致」换成打分聚合，不是禁区。D、A、B 成立：投票买到的是方差抑制，前提是错误彼此独立，而且要为这份独立性付费。", t: 0, n: {"C": "多次采样能压掉随机错，压不掉共同错，偏差来自模型本身而不是来自某一次抽样", "E": "开放任务同样可以多次生成再按维度择优，只是判据从「答案是否一致」换成打分聚合，不是禁区。", "A": "难度远超能力时，多采只是更散的噪声", "B": "延迟与 token 按份数放大", "D": "错误高度相关时，投票会把共识性的错固化"} },
  { q: "Routing 模式里上游分类把请求分错类目，后果与缓解说法正确的有？", o: ["A. 分错类目只影响这一条请求，对整体质量没有系统性影响", "B. 两类错分的代价不对称，阈值该按业务损失定，而不是按总体准确率定", "C. 分类准确率过九成，路由就比统一用强模型省钱", "D. 给路由层单独建评测集并按类目看混淆矩阵，比只盯一个总准确率更能暴露坑", "E. 置信度低时走兜底路径（统一交给强模型或转人工），比强行选一条分支更划算"], a: [1, 3, 4], e: "路由分错会走完整条下游，代价按类目不对称；要混淆矩阵、低置信兜底，不只看总准确率。答案 B、D、E。A错误：分错的请求会一路走完下游分支，错的检索、错的模板、错的回答全都被计入同一件事，用户感知到的正是这类整体塌方；C错误：省多少取决于错误类目的流量占比与错分后的返工成本，准确率高但错的那批集中在高价值场景，账照样亏。E、B、D 成立：路由层本质是个 classifier，要按 classifier 的方式评测和兜底。", t: 0, n: {"A": "分错的请求会一路走完下游分支，错的检索、错的模板、错的回答全都被计入同一件事，用户感知到的正是这类整体塌方", "C": "省多少取决于错误类目的流量占比与错分后的返工成本，准确率高但错的那批集中在高价值场景，账照样亏。", "B": "两类错分代价不对称，阈值该按业务损失定", "D": "给路由层单独建评测集，看混淆矩阵", "E": "置信度低时走兜底，比强行选一条划算"} },
  { q: "关于五大工作流模式的适用边界与常见错配，正确的有？", o: ["A. 评估-优化的前提是「好坏讲得清」，缺可执行标准时循环只是在两种口味之间来回摆", "B. 路由适合用在没有分类信号的开放任务上", "C. 编排-工作者的价值在于子任务无法预先枚举，代价是分解质量取决于中心模型", "D. 分段并行与投票的区别只在于并行度大小，与子任务能否独立无关", "E. 步骤能枚举清楚的活，交给固定链路更便宜也更好定位"], a: [0, 2, 4], e: "五种工作流各有边界：能枚举用固定链，标准说不清别上评估闭环，路由要有分类信号。答案 A、C、E。D错误：分段（sectioning）要求子任务彼此独立，投票（voting）恰恰是对同一个任务取多份，两者的分界是任务结构而不是并发数；B错误：没有分类信号就没有路由的输入，硬做只会退化成一次额外的模型调用，那种场景该用动态决策或干脆单次调用。E、A、C 成立：模式不是越花哨越好，能预定义就用预定义，说不清标准就别上闭环。", t: 3, n: {"D": "分段（sectioning）要求子任务彼此独立，投票（voting）恰恰是对同一个任务取多份，两者的分界是任务结构而不是并发数", "B": "没有分类信号就没有路由的输入，硬做只会退化成一次额外的模型调用，那种场景该用动态决策或干脆单次调用。", "A": "评估-优化的前提是好坏讲得清", "C": "编排的价值在于子任务无法预先枚举", "E": "能枚举清楚的活，固定链路更便宜也更好定位"} },
  { q: "下列场景里，更应当钉死成固定工作流而不是交给自主循环的有？", o: ["A. 生成营销活动文案初稿：没有固定步骤，多出几版让人挑更合适", "B. 月结对账：步骤固定，每一步都要留下能对证的证据链", "C. 把批量工单按模板转成结构化记录：字段可枚举，输出还要过 schema 校验", "D. 排查一个从未见过的线上故障：现象发散，需要边试边缩小范围", "E. 按制度发放补偿：金额规则写死在条文里，超出规则必须转人工，路径要求可复现"], a: [1, 2, 4], e: "步骤可枚举、要复现、要审计的场景钉死工作流；探索型任务才交给自主循环。答案 B、C、E。D错误：路径不可预知的探索任务正是自主循环的用武之地，钉死流程反而把聪明的做法挡在门外；A错误：这里没有需要审计的确定路径，也不需要复现，多生成再人工择优比编排更省。B、C、E 成立：共同特征是步骤可枚举、要求可复现，而且出问题必须能在日志里指认到具体哪一步。", t: 3, n: {"D": "路径不可预知的探索任务正是自主循环的用武之地，钉死流程反而把聪明的做法挡在门外", "A": "这里没有需要审计的确定路径，也不需要复现，多生成再人工择优比编排更省。", "B": "对账步骤固定，每步都要留证据链", "C": "字段可枚举，输出要过 schema 校验", "E": "规则写死在条文里，超出就转人工"} },
  { q: "编排器-工作者模式里，「把各分支结果汇总回中心模型」这一步的代价，正确的有？", o: ["A. 中心模型看到的常是工作者自述的结论而非原始证据，出错时难以复核", "B. 汇总本身是一次长输入调用，多份中间结果拼回去，成本又拉回来一截", "C. 工作者越多总成本越低，因为任务被平摊掉了", "D. 每个分支的上下文都要先压缩再交回去，压缩窗口就是丢信息的窗口", "E. 要求工作者统一输出 JSON，汇总阶段就不会引入新错误"], a: [0, 1, 3], e: "汇总层信息有损、责任转移、成本回流；要规定交回什么、证据留哪。答案 A、B、D。E错误：统一格式只解决「能不能解析」，解决不了两份结论互相冲突、或者结论本身就是错的；C错误：分支数增加时，固定开销与汇总输入都在涨，平摊的是单步工作量而不是总量。D、A、B 成立：汇总层的典型病灶是信息有损加上责任转移，设计时要显式规定交回什么、证据留在哪里。", t: 3, n: {"E": "统一格式只解决「能不能解析」，解决不了两份结论互相冲突、或者结论本身就是错的", "C": "分支数增加时，固定开销与汇总输入都在涨，平摊的是单步工作量而不是总量。", "A": "中心看到的是工作者自述的结论，不是原始证据", "B": "汇总本身是一次长输入调用", "D": "每个分支先压缩再交回，压缩窗口就是丢信息的窗口"} },
  { q: "在提示链的中间步骤加程序化检查门（Gate），说法正确的有？", o: ["A. Gate 加得越多，链条准确率就越逼近百分之百，因为每次拦截都在纠错", "B. 用确定性代码校验格式、必填项、引用是否存在，比再叫模型自审一次更可复现", "C. 每个 Gate 都增加一次延迟和一个失败出口，链条越长越要提前设计「不过门怎么办」", "D. 一旦流程里出现 Gate 判断分支，这套编排就变成自主 Agent 了", "E. Gate 的价值是把错误挡在早期，免得后面几步在错误前提上继续加工"], a: [1, 2, 4], e: "Gate 用确定性换可定位，但会增加延迟与失败出口；要设计不过门怎么办。答案 B、C、E。A错误：Gate 自身有误杀率，拦下来的东西要么回炉要么转人工，堆到后面整体通过率反而掉下来；D错误：分支由代码按预设规则决定，流程控制权仍在代码手里，判断标准是模型会不会在没有新指令时自己推进下一步。E、B、C 成立：Gate 是拿确定性换可定位，代价是延迟与需要设计回退路径。", t: 0, n: {"A": "Gate 自身有误杀率，拦下来的东西要么回炉要么转人工，堆到后面整体通过率反而掉下来", "D": "分支由代码按预设规则决定，流程控制权仍在代码手里，判断标准是模型会不会在没有新指令时自己推进下一步。", "B": "用确定性代码校验，比再叫模型自审可复现", "C": "每个 Gate 都加延迟与一个失败出口", "E": "Gate 的价值是把错误挡在早期"} },
  { q: "子 Agent 向主循环汇报结果，粒度上常见的坑有？", o: ["A. 合适的结构是结论、关键证据的位置、未解决项，细节留在可回读的文件里", "B. 把整段执行日志原样贴回去，主上下文几轮就被灌满，后面每一步都在为噪声付费", "C. 汇报越简短越好，主模型需要时会自己再去查一遍", "D. 只回一句「已完成」，主控既无法判断可信度，也无从决定下一步", "E. 漏掉「执行了哪些不可逆动作」，等到需要回滚时才发现手里没有线索"], a: [0, 1, 3, 4], e: "子 Agent 汇报要结论+证据位置+未解决项；太厚挤窗口，太薄没法判断。答案 A、B、D、E。C错误：主控通常不会去查，也不该去查——它没有子 Agent 的现场，重查等于把刚才的工作再做一遍，缺的信息只能靠汇报方补全。B、D、E、A 成立：汇报是跨上下文边界的唯一通道，太厚挤爆窗口，太薄让下游失去判断依据。", t: 3, n: {"C": "主控通常不会去查，也不该去查——它没有子 Agent 的现场，重查等于把刚才的工作再做一遍，缺的信息只能靠汇报方补全。", "A": "结论、关键证据位置、未解决项，细节留在可回读的文件", "B": "贴整段日志会灌满主上下文", "D": "只回「已完成」，主控无从判断可信度", "E": "漏掉不可逆动作，回滚时手里没线索"} },
  { q: "多 Agent 协作时把规格与任务状态放进共享库，实际价值在于？", o: ["A. 出错时能回溯「当时是按哪一版做的」，而不是只能追问当时的提示词", "B. 把提示词里的一段话变成可版本化、可 diff 的对象，评审成本因此前移", "C. 有了共享规格就不再需要验收，执行体会自动对齐", "D. 各执行体对「做成什么样」有同一个依据，不至于人手一份自己的理解", "E. 这套机制只对十几个 Agent 以上的大型系统有意义，两三个执行体用不上"], a: [0, 1, 3], e: "共享规格与状态防漂移、可回溯；它不能替代验收。答案 A、B、D。E错误：价值与 Agent 数量无关，两个执行体就已经可能各自脑补出不同版本的需求，共享库首先是防漂移；C错误：规格只是判据，判据不会自己执行，验收动作仍然必须由人或测试来落地。D、A、B 成立：共享的是唯一真相来源与状态可见性，这两样也正是并行工作不退化成重复劳动的前提。", t: 3, n: {"E": "价值与 Agent 数量无关，两个执行体就已经可能各自脑补出不同版本的需求，共享库首先是防漂移", "C": "规格只是判据，判据不会自己执行，验收动作仍然必须由人或测试来落地。", "A": "能回溯当时是按哪一版做的", "B": "把提示词里的一段话变成可版本化、可 diff 的对象", "D": "各执行体对「做成什么样」有同一依据"} },
  { q: "把一个粗粒度 Agent 拆成几个子 Agent 后成本不降反升，可能的原因有？", o: ["A. 汇总调用可以省掉，让各子 Agent 直接对最终产物负责即可", "B. 拆得越细，每步上下文越小，总 token 随之下降", "C. 并行只缩短墙钟时间，不减少总计算量，而账单看的是后者", "D. 每个子 Agent 都要重发自己的系统提示与工具定义，固定开销按份数叠加", "E. 交接要把上下文压成文字，压不掉的就只能重查，重复劳动变成额外的检索与调用"], a: [2, 3, 4], e: "拆多 Agent 的收益在质量与隔离，成本在固定开销、交接与汇总；指望省钱常失望。答案 C、D、E。A错误：总得有人把各分支拼成一个答案，省掉这一步就变成把冲突直接抛给用户，或者干脆没人负责；B错误：单步上下文确实变小，但固定开销、交接与汇总都是新增项，多数拆分的净效果是总量上升。D、E、C 成立：拆分的收益主要在质量与隔离，指望它直接省钱通常要失望。", t: 3, n: {"A": "总得有人把各分支拼成一个答案，省掉这一步就变成把冲突直接抛给用户，或者干脆没人负责", "B": "单步上下文确实变小，但固定开销、交接与汇总都是新增项，多数拆分的净效果是总量上升。", "C": "并行只缩短墙钟时间，不减少总计算量", "D": "每个子 Agent 都要重发系统提示与工具定义", "E": "交接压不掉的上下文只能重查，变成额外检索"} },
  { q: "长任务跑到中途把前几十轮压缩成一段摘要，常见的失真有？", o: ["A. 摘要写得够详细，原始记录的回读入口就可以不保留", "B. 压缩点应选在有外部产物可回读的位置（提交、落盘之后），而不是随手每十轮一次", "C. 摘要保得住结论，丢掉的常是精确量：路径、版本号、报错原文，而下一步往往正好要用它们", "D. 压缩之后模型并不知道自己丢了信息，会照着摘要里残留的印象继续往下编", "E. 摘要由同一个模型生成，它对「什么算重要」的判断可能与后续步骤的需要不一致"], a: [1, 2, 3, 4], e: "摘要压缩的失真来自「谁判断重要」和「原文能否回捞」；压缩点要选在有外部产物可回读处。答案 B、C、D、E。A错误：摘要永远是有损压缩，被省掉的那一行恰恰可能是下一步的唯一依据，所以保留可回读的原始产物比把摘要写长更重要。C、D、E、B 成立：失真的根源是「谁判断重要性」与「信息还能不能拿回来」，选对压缩点能把损失关在可恢复的范围内。", t: 8, n: {"A": "摘要永远是有损压缩，被省掉的那一行恰恰可能是下一步的唯一依据，所以保留可回读的原始产物比把摘要写长更重要。", "B": "压缩点选在有外部产物可回读的位置", "C": "摘要保得住结论，丢的是路径、版本号与报错原文", "D": "模型不知道自己丢了信息，会照残留印象继续编", "E": "摘要由同一模型生成，重要性判断可能与后续需要不一致"} },
  { q: "一个跑二十轮的工具循环，token 消耗远大于二十次独立的单轮问答，原因有？", o: ["A. 命中前缀缓存后，历史部分不再按输入计费，循环长度对账单影响很小", "B. 轮数越多，最近几轮的输入里就越可能塞满早已无用的中间结果", "C. 每轮输出很短时，总成本主要由输出累加决定，与历史长度关系不大", "D. 每轮都要把此前的完整历史重新作为输入发一遍，累计输入随轮数近似平方增长", "E. 工具返回值往往比模型的自然语言输出长得多，一次大输出会长期挂在历史里"], a: [1, 3, 4], e: "循环账单随轮数近似平方涨：每轮重发全量历史，工具大输出长期挂在上下文。答案 B、D、E。A错误：缓存改变的是重复计算与一部分单价，历史仍占着窗口位置和整轮预算，长轮的账单照样被它撑起来；C错误：这类循环的账单大头恰恰是每轮重发的输入，输出短并不会让它变便宜。D、E、B 成立：放大来自循环结构本身，所以控制轮数和控制单轮长度同样重要。", t: 3, n: {"B": "轮数越多，历史里越容易积压已无用的中间结果", "D": "每轮重发完整历史，累计输入近似平方增长", "E": "工具返回值往往很长，一次大输出长期挂在历史里", "A": "缓存改变的是重复计算与一部分单价，历史仍占着窗口位置和整轮预算，长轮的账单照样被它撑起来", "C": "这类循环的账单大头恰恰是每轮重发的输入，输出短并不会让它变便宜。"} },
  { q: "哪些动作通常需要人工确认？", o: ["A. 读取公开资料", "B. 转账、删库、对外发送这类不可逆动作", "C. 查询天气", "D. 计算一加一", "E. 生成一段草稿"], a: [1], e: "单选。答案 B。A 错误：只读且低风险，通常可直通；C 错误：只读查询，风险低；D 错误：无副作用，不需要确认；E 错误：草稿通常可逆，不必逐次确认。B：人审要留给不可逆、高代价、低置信的动作。", t: 3, n: {"A": "只读且低风险，通常可直通。", "B": "人审要留给不可逆、高代价、低置信的动作。", "C": "只读查询，风险低。", "D": "无副作用，不需要确认。", "E": "草稿通常可逆，不必逐次确认。"} },
  { q: "幂等（idempotency）在工具调用里指什么？", o: ["A. 同一个请求重复执行，结果保持一致", "B. 每次执行都产生不同结果", "C. 请求必须加密传输", "D. 工具必须联网才能调用", "E. 请求必须带时间戳"], a: [0], e: "单选。答案 A。B 错误：那正是不幂等；C 错误：那是传输安全；D 错误：离线工具也可以有幂等语义；E 错误：时间戳不等于幂等。A：重试前先想幂等，否则一次失败会变成两次副作用。", t: 3, n: {"A": "重试前先想幂等，否则一次失败会变成两次副作用。", "B": "那正是不幂等。", "C": "那是传输安全。", "D": "离线工具也可以有幂等语义。", "E": "时间戳不等于幂等。"} },
  { q: "评测一个已经上线的 Agent，最该当主指标的是？", o: ["A. 用户对单次回答的点赞率，样本越大越可信", "B. 平均端到端延迟，因为它最贴近用户体验", "C. 平均完成任务所需的步数，越少说明系统越聪明", "D. 有外部可验证判据的任务完成率，并按任务难度分层统计", "E. 工具调用总次数，因为它直接反映做了多少工作"], a: [3], e: "上线 Agent 的主指标要落在可验证的完成上，并按难度分层；点赞、延迟、步数、调用量都是代理量。答案 D。A 错误：点赞衡量的是满意度，用户往往看不出中间哪一步其实走错了，事情办没办成才是关键；B 错误：延迟是 SLA 指标，快而错不是好；C 错误：步数可以被反向优化——少做几步就少犯几个错，但任务并没有做成；E 错误：调用次数是成本指标，多调也可能是瞎调，不能代表质量。", t: 15, n: {"C": "步数可以被反向优化——少做几步就少犯几个错，但任务并没有做成", "E": "调用次数是成本指标，多调也可能是瞎调，不能代表质量", "A": "点赞衡量的是满意度，用户往往看不出中间哪一步其实走错了，事情办没办成才是关键", "B": "延迟是 SLA 指标，快而错不是好。", "D": "有外部可验证判据的任务完成率，并按难度分层"} },
  { q: "从「单步正确率会随步数连乘」这个事实出发，工程上成立的推论有？", o: ["A. 人工检查点该压在不可逆、难回滚、影响面大的动作之前，而不是均匀分布", "B. 检查点越密整体完成率越高，每一道都在拦错误", "C. 切成可独立验收的短段，错误能在段内被发现，而不是靠运气跑完整程", "D. 单步准确率提上去之后，长任务可以全自动跑完", "E. 缩短关键路径本身就是提效手段：能一步拿到的信息别绕三步去猜"], a: [0, 2, 4], e: "步数连乘让长任务必然掉完成率：减少步数、把检查点压在不可逆处、切到可验收的粒度。答案 A、C、E。B错误：每道检查自带延迟与误杀，拦下来的要回炉或转人工，密到一定程度整体通过率反而掉下来；D错误：单步再高也扛不住步数连乘，而且不可逆动作的风险不能靠概率达标豁免，这正是长任务必须留人工兜底的理由。E、A、C 成立：少跑几步、把检查点放在代价最高的位置、把长度切到能验收的粒度，是真能拉高完成率的三条手段。", t: 4, n: {"B": "每道检查自带延迟与误杀，拦下来的要回炉或转人工，密到一定程度整体通过率反而掉下来", "D": "单步再高也扛不住步数连乘，而且不可逆动作的风险不能靠概率达标豁免，这正是长任务必须留人工兜底的理由。", "A": "检查点压在不可逆、难回滚的动作前", "C": "切成可独立验收的短段，错误在段内被发现", "E": "缩短关键路径本身就是提效"} },
  { q: "给 Agent 功能做成本核算与归因，合理的做法有？", o: ["A. 人工审核的时间不该计入成本，那是固定工资，与单次任务无关", "B. 平摊到「每次对话」是够用的粒度，任务复杂度的差异会被平均掉", "C. 成本要和完成率放在一起看，单位成本下降也可能只是任务被悄悄做少了", "D. 单次任务成本要含输入输出 token、工具与检索调用，以及失败重跑的那部分，只记成功那次会低估", "E. 按功能、租户、用户三个维度打标，才能回答「哪一块在烧钱」，只有总量数字没法决策"], a: [2, 3, 4], e: "Agent 成本要含人审、工具、检索与失败重跑，按功能/租户/用户归因；平均到每次对话会掩盖长尾。答案 C、D、E。A错误：人审往往是这条链路里最贵的可变成本之一，不算它就会得出「自动化一定更便宜」的错误结论，越是需要检查点的功能越要先算这笔账；B错误：平均值掩盖长尾，一个长任务可能抵得上一百次闲聊，不按任务与租户拆开就找不到成本来源。D、E、C 成立：核算的目的是能定位、能做取舍，而不是产出一个总数。", t: 3, n: {"A": "人审往往是这条链路里最贵的可变成本之一，不算它就会得出「自动化一定更便宜」的错误结论，越是需要检查点的功能越要先算这笔账", "B": "平均值掩盖长尾，一个长任务可能抵得上一百次闲聊，不按任务与租户拆开就找不到成本来源。", "C": "成本要和完成率一起看，单位成本降也可能是任务做少了", "D": "单次成本要含失败重跑，只记成功那次会低估", "E": "按功能、租户、用户三个维度打标"} },
  { q: "给一次 Agent 任务设成本预算与止损线，合理的有？", o: ["A. 单步成本低的时候，整轮任务可以不设预算上限", "B. 预算应按任务类型分档，简单问答和长程重构共用一个上限会两头不讨好", "C. 超预算率本身是有用的指标，它能暴露哪类任务的拆解方式有问题", "D. 触顶时要输出已完成部分与未竟事项，而不是只留一句「预算用完了」", "E. 单任务要有预算上限（token 或费用），触顶就收敛并交人工，而不是等它自然结束"], a: [1, 2, 3, 4], e: "预算约束整条链路而非单步；按任务分档、触顶留交接信息，预算也是护栏。答案 B、C、D、E。A错误：单步便宜、轮数失控照样能把账单拉平，预算约束的对象是整条链路而不是某一步。E、B、C、D 成立：预算是护栏的一种，价值不只在省钱，触顶时留下什么直接决定人工接手还要花多少力气。", t: 3, n: {"A": "单步便宜、轮数失控照样能把账单拉平，预算约束的对象是整条链路而不是某一步。", "B": "预算按任务类型分档", "C": "超预算率能暴露拆解方式的问题", "D": "触顶要输出已完成部分与未竟事项", "E": "单任务要有 token 或费用上限"} },
  { q: "工具调用失败后，合理的做法是什么？", o: ["A. 无限重试直到成功", "B. 忽略错误继续下一步", "C. 默认工具一定成功", "D. 校验错误、有限重试，仍失败就切策略或转人工", "E. 把错误信息从日志里删掉"], a: [3], e: "单选。答案 D。A 错误：会把过载放大成雪崩；B 错误：错误会沿链路传播；C 错误：工具是外部系统，失败是常态；E 错误：删日志会失去定位依据。D：失败要显式处理，重试要有上限与退避。", t: 3, n: {"A": "会把过载放大成雪崩。", "B": "错误会沿链路传播。", "C": "工具是外部系统，失败是常态。", "D": "失败要显式处理，重试要有上限与退避。", "E": "删日志会失去定位依据。"} },
  { q: "哪些情况下不该把流程压在低代码平台上，而应回到代码实现？", o: ["A. 要在平台之外做统一评测与灰度发布，流程只是被验证的对象之一", "B. 分支复杂到画布上要靠海量连线和补丁节点才能表达，评审与 diff 都已经不可维护", "C. 流程一旦要调用外部接口，低代码平台就基本无能为力，只能回到代码实现", "D. 需要自定义工具、复杂状态机或精细的失败恢复策略，平台的扩展点够不着", "E. 团队靠 PR 与代码评审协作，而流程只能在画布上改、改完没有历史记录"], a: [0, 1, 3, 4], e: "低代码适合连接器与简单编排；复杂度、状态机、失败恢复与 PR 评审超出画布能力时回代码。答案 A、B、D、E。C错误：调用外部接口恰恰是这类平台的强项，现成连接器通常比手写更省事，这一条构不成回到代码的理由。B、D、E、A 成立：判断线在于复杂度、可控性与工程流程能否被平台承载——承载不了时就该把编排逻辑收回代码，而不是在画布上硬堆。", t: 15, n: {"C": "调用外部接口恰恰是这类平台的强项，现成连接器通常比手写更省事，这一条构不成回到代码的理由。", "A": "要在平台外做统一评测与灰度，流程只是被验证的对象", "B": "分支复杂到画布要靠海量连线，评审与 diff 已不可维护", "D": "需要自定义工具与精细失败恢复，平台扩展点够不着", "E": "团队靠 PR 协作，而流程只能在画布上改还没历史"} },
  { q: "担心被某个 Agent 平台锁定，成本更可控的做法有？", o: ["A. 提示词、规格与评测集放在平台外的版本库里，平台只当执行器", "B. 定期验证流程定义和运行日志能否导出，别到真要迁移时才发现拿不出来", "C. 模型与工具调用走抽象层或标准协议，换平台时不用逐节点重写", "D. 业务规则写成平台无关的规格或代码，画布里只保留编排与调用", "E. 选开源平台就没有锁定问题，数据与流程天然可迁移"], a: [0, 1, 2, 3], e: "抗锁定靠把规格、提示词、评测集留在平台外，并定期验证导出与迁移；开源不等于不锁定。答案 A、B、C、D。E错误：开源只保证拿得到源码，锁定的常见形态是数据格式、运维路径和已经砸进去的二次开发投入，这些不会因为协议开放就自动可迁移。A、B、C、D 成立：抗锁定的实质是把决策依据（规格、提示词、评测集）留在自己手里，只把执行外包给平台，并且定期验证退路真的走得通。", t: 3, n: {"E": "开源只保证拿得到源码，锁定的常见形态是数据格式、运维路径和已经砸进去的二次开发投入，这些不会因为协议开放就自动可迁移。", "A": "提示词、规格与评测集放在平台外的版本库", "B": "定期验证流程定义与日志能否导出", "C": "模型与工具调用走抽象层或标准协议", "D": "业务规则写成平台无关的规格或代码"} },
  { q: "灰度发布的合理顺序是什么？", o: ["A. 直接全量切换", "B. 先删旧版再发新版", "C. 只在周末发布", "D. 小流量验证，再扩大流量，并保留回滚方案", "E. 先扩大流量，再补小流量验证"], a: [3], e: "单选。答案 D。A 错误：那会把故障面放到最大；B 错误：删旧版等于放弃回滚；C 错误：时间点不降低风险；E 错误：顺序反了，小流量验证必须在前。D：灰度用流量比例控制风险，回滚用旧版本兜底。", t: 15, n: {"A": "那会把故障面放到最大。", "B": "删旧版等于放弃回滚。", "C": "时间点不降低风险。", "D": "灰度用流量比例控制风险，回滚用旧版本兜底。", "E": "顺序反了，小流量验证必须在前。"} },
  { q: "冒烟集（smoke set）的主要特点是什么？", o: ["A. 最大最全，只在年度评审时跑", "B. 只跑一次，之后不再更新", "C. 只使用公开榜单题目", "D. 覆盖全部业务线的全量题集", "E. 最小、最快，每次改动都跑一遍"], a: [4], e: "单选。答案 E。A 错误：那是回归集或全量评测的角色；B 错误：冒烟集要跟着改动频繁跑；C 错误：公开题目无法覆盖自家业务；D 错误：那是回归集或全量评测，不是冒烟集。E：冒烟集用最小成本尽早发现明显退化。", t: 0, n: {"A": "那是回归集或全量评测的角色。", "B": "冒烟集要跟着改动频繁跑。", "C": "公开题目无法覆盖自家业务。", "D": "那是回归集或全量评测，不是冒烟集。", "E": "冒烟集用最小成本尽早发现明显退化。"} },
  { q: "开放权重与开源代码的区别是什么？", o: ["A. 两者完全是一回事", "B. 开放权重必须公开全部语料", "C. 开源代码必须公开模型权重", "D. 开放权重不等于公开训练数据与训练代码", "E. 开放权重必须公开训练代码"], a: [3], e: "单选。答案 D。A 错误：权重、代码、数据是三件事；B 错误：多数开放权重模型并不公开语料；C 错误：代码开源与权重开放是两套许可；E 错误：权重开放不要求训练代码开放。D：开放权重只说明权重可下载，不说明语料可商用。", t: 7, n: {"A": "权重、代码、数据是三件事。", "B": "多数开放权重模型并不公开语料。", "C": "代码开源与权重开放是两套许可。", "D": "开放权重只说明权重可下载，不说明语料可商用。", "E": "权重开放不要求训练代码开放。"} },
  { q: "要给合成数据设闸，下面哪些控制手段站得住？", o: ["A. 必须有外部判据：单元测试、验证器、可核对事实", "B. 换不同家族的模型来生成，避免模型反复读自己写的作文", "C. 定期跑一组纯真实数据对照组做消融，指标一退化就下调合成配比", "D. 把生成温度调低，合成数据的事实可靠性就有保障", "E. 设占比上限，合成只用来补真实语料稀缺的地方"], a: [0, 1, 2, 4], e: "合成数据要设占比上限、外部判据、跨家族生成、纯真实数据对照；降温与自评不解决事实。答案 A、B、C、E。D错误：降温只让输出更一致、更模板化，一致不等于正确，同一个错误反而更稳定地重复出现；只靠模型自评自信度等于自己给自己批卷。E、A、B、C 成立：这四条正是正文给出的控闸组合——占比上限、外部判据、跨家族生成、纯真实数据对照消融。", t: 9, n: {"D": "降温只让输出更一致、更模板化，一致不等于正确，同一个错误反而更稳定地重复出现；只靠模型自评自信度等于自己给自己批卷。", "A": "必须有外部判据：单测、验证器、可核对事实", "B": "换不同家族生成，避免反复读自己写的作文", "C": "定期跑纯真实数据对照组做消融", "E": "设占比上限，只补真实语料稀缺处"} },
